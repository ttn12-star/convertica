<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Microsoft 365 defaults with no metric-compatible free font. Without these
     aliases fontconfig falls through to Noto Serif: a sans document comes out
     serif and longer. Carlito/Liberation Sans are the closest metrics. -->
<fontconfig>
  <alias binding="same"><family>Aptos</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Aptos Display</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Liberation Sans</family></prefer></alias>
</fontconfig>
