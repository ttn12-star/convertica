<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Arabic Word documents. Without this, every Arabic run fell back to DejaVu
     Sans: a Traditional Arabic or Sakkal Majalla letter came out in a generic
     sans. The Windows naskh faces map to Noto Naskh Arabic (Latin text in them
     to Liberation Serif, as their Latin is Times-like), and Arabic glyphs inside
     Latin fonts use the Noto Arabic face of the same style. Other scripts are
     untouched: these families are only reached for glyphs Liberation lacks. -->
<fontconfig>
  <alias binding="same"><family>Traditional Arabic</family><prefer><family>Noto Naskh Arabic</family><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Simplified Arabic</family><prefer><family>Noto Naskh Arabic</family><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Simplified Arabic Fixed</family><prefer><family>Noto Naskh Arabic</family><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Arabic Typesetting</family><prefer><family>Noto Naskh Arabic</family><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Sakkal Majalla</family><prefer><family>Noto Naskh Arabic</family><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Amiri</family><prefer><family>Noto Naskh Arabic</family><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Arabic Transparent</family><prefer><family>Noto Naskh Arabic</family><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Traditional Naskh</family><prefer><family>Noto Naskh Arabic</family><family>Liberation Serif</family></prefer></alias>
  <match target="pattern"><test name="family"><string>Arial</string></test><edit name="family" mode="append"><string>Noto Sans Arabic</string></edit></match>
  <match target="pattern"><test name="family"><string>Liberation Sans</string></test><edit name="family" mode="append"><string>Noto Sans Arabic</string></edit></match>
  <match target="pattern"><test name="family"><string>Tahoma</string></test><edit name="family" mode="append"><string>Noto Sans Arabic</string></edit></match>
  <match target="pattern"><test name="family"><string>Segoe UI</string></test><edit name="family" mode="append"><string>Noto Sans Arabic</string></edit></match>
  <match target="pattern"><test name="family"><string>Calibri</string></test><edit name="family" mode="append"><string>Noto Sans Arabic</string></edit></match>
  <match target="pattern"><test name="family"><string>Carlito</string></test><edit name="family" mode="append"><string>Noto Sans Arabic</string></edit></match>
  <match target="pattern"><test name="family"><string>Verdana</string></test><edit name="family" mode="append"><string>Noto Sans Arabic</string></edit></match>
  <match target="pattern"><test name="family"><string>Helvetica</string></test><edit name="family" mode="append"><string>Noto Sans Arabic</string></edit></match>
  <match target="pattern"><test name="family"><string>Times New Roman</string></test><edit name="family" mode="append"><string>Noto Naskh Arabic</string></edit></match>
  <match target="pattern"><test name="family"><string>Liberation Serif</string></test><edit name="family" mode="append"><string>Noto Naskh Arabic</string></edit></match>
  <match target="pattern"><test name="family"><string>Cambria</string></test><edit name="family" mode="append"><string>Noto Naskh Arabic</string></edit></match>
  <match target="pattern"><test name="family"><string>Caladea</string></test><edit name="family" mode="append"><string>Noto Naskh Arabic</string></edit></match>
  <match target="pattern"><test name="family"><string>Georgia</string></test><edit name="family" mode="append"><string>Noto Naskh Arabic</string></edit></match>
</fontconfig>
