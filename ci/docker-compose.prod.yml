# Production Docker Compose configuration
# Usage: docker compose -f docker-compose.yml -f ci/docker-compose.prod.yml up -d

services:
  nginx:
    # Use nginx with Brotli support
    build:
      context: .
      dockerfile: ci/nginx.Dockerfile
    # Note: profiles removed - nginx should always be available in production
    # IMPORTANT: Using service_started instead of service_healthy to avoid deadlock
    # when web crashes - nginx should start independently and show 502 if web is down
    depends_on:
      web:
        condition: service_started
    healthcheck:
      # Check nginx is responding (health endpoint is served directly by nginx)
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "--header=Host: convertica.net", "http://127.0.0.1/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    labels:
      - "autoheal=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # Authenticated Origin Pulls: nginx.conf only accepts TLS clients that
      # present Cloudflare's certificate, so the bare origin IP serves nothing.
      - ./ci/cloudflare-origin-pull-ca.pem:/etc/nginx/cloudflare-origin-pull-ca.pem:ro

  web:
    build:
      context: .
      dockerfile: ci/Dockerfile
    # Fast startup: only migrate + server. Static files built separately via 'make build-static'
    command: >
      sh -c "python manage.py compilemessages &&
             python manage.py migrate --noinput &&
             gunicorn --config /app/ci/gunicorn.conf.py utils_site.wsgi:application"
    env_file:
      - .env
    environment:
      - SERVICE_NAME=web
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE}
      - SITE_DOMAIN=${SITE_DOMAIN:-convertica.net}
      - GUNICORN_MAX_REQUESTS=${GUNICORN_MAX_REQUESTS:-300}
      - GUNICORN_MAX_REQUESTS_JITTER=${GUNICORN_MAX_REQUESTS_JITTER:-50}
    # In production web should be reachable only from nginx via internal network.
    # Base compose binds web only to 127.0.0.1 for safety; keep direct exposure disabled.
    expose:
      - "8000"
    volumes:
      # Keep gunicorn config hot-reloadable via compose recreate without full image rebuild.
      - ./ci/gunicorn.conf.py:/app/ci/gunicorn.conf.py:ro
      - ./ci/web-healthcheck.sh:/app/ci/web-healthcheck.sh:ro
    deploy:
      resources:
        limits:
          cpus: '${WEB_CPU_LIMIT:-2.0}'
          memory: ${WEB_MEMORY_LIMIT:-2.5G}
        reservations:
          cpus: '${WEB_CPU_RESERVATION:-0.5}'
          memory: ${WEB_MEMORY_RESERVATION:-1G}
    # Allow container to use host swap (memory + swap total = 3G)
    # Without this, container is killed when hitting memory limit even if host has swap
    memswap_limit: 3G
    healthcheck:
      # Liveness only: verify gunicorn accepts TCP connections.
      # Avoid request-based checks here, because /livez can fail under worker saturation
      # and trigger false autoheal restarts.
      test: ["CMD-SHELL", "/bin/sh /app/ci/web-healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 120s
    restart: always
    labels:
      - "autoheal=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery:
    build:
      context: .
      dockerfile: ci/Dockerfile
    # Queues consumed (all in one worker for low-resource droplets):
    #   fast      — quick PDF-only ops (compress/split/merge/rotate/...)
    #   regular   — heavy multi-format conversions (default queue)
    #   premium   — same heavy ops for subscribed users
    #   maintenance, default — scheduled/auxiliary tasks
    # Trade-off vs the dedicated `celery-premium` service: this single worker
    # round-robins across queues, so premium isn't strictly first ahead of
    # regular at the queue-consumption level (priority field still used inside
    # each queue). Hence the dedicated `celery-premium` below; this worker
    # keeps `premium` as overflow for it.
    command: celery -A utils_site worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-3} --pool=prefork --max-tasks-per-child=50 --max-memory-per-child=250000 -Q fast,regular,premium,maintenance,default
    env_file:
      - .env
    environment:
      - SERVICE_NAME=celery
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE}
      - SITE_DOMAIN=${SITE_DOMAIN:-convertica.net}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CELERY_CPU_LIMIT:-2.0}'
          # 3 children; PDF to Word/Excel can use 500-800MB each on large files
          memory: ${CELERY_MEMORY_LIMIT:-2G}
        reservations:
          cpus: '${CELERY_CPU_RESERVATION:-0.2}'
          memory: ${CELERY_MEMORY_RESERVATION:-256M}
    # Allow celery to use swap for heavy PDF operations (memory + swap = 2.5G)
    memswap_limit: 2.5G
    healthcheck:
      # `|| exit 0` made this unfailable, so autoheal never restarted a wedged
      # worker. retries=10 x 60s still tolerates slow starts.
      test: ["CMD-SHELL", "celery -A utils_site inspect ping -d celery@$$HOSTNAME --timeout 30"]
      interval: 60s
      timeout: 45s  # the check itself imports Django; --timeout bounds only the reply wait
      retries: 10
      start_period: 30s
    restart: always
    labels:
      - "autoheal=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Dedicated premium capacity (profile "premium" in the base file; deploy.sh
  # names it explicitly, which starts it). Prefork with one child rather than
  # solo: an OOM kills the child, not the worker, and per-child recycling works.
  # The main `celery` still consumes `premium` too, as overflow and fallback.
  celery-premium:
    command: celery -A utils_site worker --loglevel=info --concurrency=1 --pool=prefork --max-tasks-per-child=50 --max-memory-per-child=250000 -Q premium
    environment:
      - SERVICE_NAME=celery-premium
      - CELERY_WORKER_POOL=prefork
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE}
      - SITE_DOMAIN=${SITE_DOMAIN:-convertica.net}
    deploy:
      resources:
        limits:
          cpus: '${CELERY_PREMIUM_CPU_LIMIT:-1.0}'
          memory: ${CELERY_PREMIUM_MEMORY_LIMIT:-1.5G}
        reservations:
          cpus: '0.25'
          memory: 512M
    memswap_limit: 2G
    restart: always
    labels:
      - "autoheal=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery-beat:
    build:
      context: .
      dockerfile: ci/Dockerfile
    command: celery -A utils_site beat --loglevel=info --schedule=/app/celerybeat-schedule/celerybeat-schedule.db
    volumes:
      - celery-beat-schedule:/app/celerybeat-schedule
    env_file:
      - .env
    environment:
      - SERVICE_NAME=beat
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE}
      - SITE_DOMAIN=${SITE_DOMAIN:-convertica.net}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CELERY_BEAT_CPU_LIMIT:-0.1}'
          memory: ${CELERY_BEAT_MEMORY_LIMIT:-384M}  # sat at 189M of 256M after the OVH move
        reservations:
          cpus: '${CELERY_BEAT_CPU_RESERVATION:-0.05}'
          memory: ${CELERY_BEAT_MEMORY_RESERVATION:-128M}
    healthcheck:
      test: ["CMD", "sh", "-c", "pgrep -f 'celery.*beat' > /dev/null && test -f /app/celerybeat-schedule/celerybeat-schedule.db || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    labels:
      - "autoheal=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    deploy:
      resources:
        limits:
          cpus: '${DB_CPU_LIMIT:-0.3}'
          memory: ${DB_MEMORY_LIMIT:-384M}  # 256M was below shared_buffers + work_mem x backends
        reservations:
          cpus: '${DB_CPU_RESERVATION:-0.1}'
          memory: ${DB_MEMORY_RESERVATION:-128M}
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    deploy:
      resources:
        limits:
          cpus: '${REDIS_CPU_LIMIT:-0.25}'
          memory: ${REDIS_MEMORY_LIMIT:-384M}
        reservations:
          cpus: '${REDIS_CPU_RESERVATION:-0.05}'
          memory: ${REDIS_MEMORY_RESERVATION:-128M}
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Autoheal - production override (restart: always)
  autoheal:
    restart: always

  # Docker monitor - sends Telegram alerts when containers die/restart (production only)
  docker-monitor:
    image: docker:cli
    container_name: convertica_docker_monitor
    restart: always
    entrypoint: /bin/sh
    command: ["/monitor.sh"]
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./ci/docker-monitor.sh:/monitor.sh:ro
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  celery-beat-schedule:
    driver: local
