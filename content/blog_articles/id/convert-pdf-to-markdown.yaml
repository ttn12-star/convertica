content_id: |
  Ada rasa kesal yang khas ketika teks di dalam PDF dibutuhkan di tempat lain. Halaman diblok, disalin, ditempel ke editor, lalu yang muncul adalah tumpukan baris dengan tanda hubung di tengah kata, nomor halaman terjepit di antara paragraf, judul yang kehilangan semua jejak sebagai judul, dan tabel yang datang sebagai satu kolom angka vertikal. Sepuluh menit merapikan, hasilnya baru setengah halaman.

  Markdown adalah format yang sebenarnya diharapkan oleh hampir semua tempat tujuan itu. Situs dokumentasi, generator situs statis, wiki, berkas README, vault Obsidian dan Notion, serta pipeline model bahasa membaca Markdown tanpa perantara. Jadi langkah yang berguna bukan copy-paste, melainkan konversi: ubah PDF menjadi berkas `.md` yang mempertahankan hierarki judul dan tabel, lalu habiskan lima menit merapikan alih-alih satu jam mengetik ulang.

  <h2>Apa yang diberikan Markdown dan tidak bisa diberikan PDF</h2>

  <p>PDF adalah deskripsi halaman cetak. Ia tahu posisi setiap huruf, jenis hurufnya, dan ukurannya. Yang hampir tidak ia ketahui adalah bahwa satu baris tadi berperan sebagai judul, tiga baris membentuk daftar, dan kisi angka itu sebuah tabel. Informasi tersebut hanya ada secara visual, itulah sebabnya menyalin dari PDF menghasilkan teks tanpa struktur.</p>

  <p>Markdown mengambil pertukaran yang berlawanan. Ia tidak tahu apa pun soal tampilan halaman, tetapi menyebut struktur secara terang-terangan: <code>#</code> berarti judul, <code>-</code> butir daftar, garis tegak menyusun tabel. Karena itu Markdown jadi:</p>

  <ul>
    <li><strong>Mudah dipindah.</strong> Berkas <code>.md</code> terbuka di editor teks mana pun dan bisa ditempel ke hampir semua alat modern tanpa membawa sampah format.</li>
    <li><strong>Jelas riwayatnya.</strong> Simpan di Git, dan setiap perubahan berikutnya tampil sebagai diff baris per baris, hal yang mustahil pada PDF biner.</li>
    <li><strong>Lentur di layar apa pun.</strong> Teks yang sama nyaman dibaca di ponsel, di terminal, maupun di situs dokumentasi, karena tidak ada yang terpaku pada ukuran halaman.</li>
    <li><strong>Ramah mesin.</strong> Pencarian, skrip, dan model bahasa memanfaatkan struktur yang eksplisit, bukan menerkanya dari koordinat.</li>
  </ul>

  <h2>Kenapa orang melakukannya di 2026</h2>

  <p>Alasannya bergeser dalam dua tahun terakhir. Sekarang empat hal ini menutup nyaris semuanya:</p>

  <ul>
    <li><strong>Menyuapkan dokumen ke model AI.</strong> Spesifikasi, manual, kontrak, dan makalah datang dalam bentuk PDF, dan versi Markdown adalah cara paling murah serta paling bersih untuk menyerahkannya ke model atau memasukkannya ke indeks pencarian.</li>
    <li><strong>Memindahkan dokumentasi lama.</strong> Manual PDF hasil satu dekade pada akhirnya pindah ke situs dokumentasi atau wiki, dan tujuan pindahnya adalah Markdown.</li>
    <li><strong>Catatan pribadi.</strong> Obsidian, Logseq, dan Joplin adalah vault Markdown. Laporan dan makalah masuk sebagai <code>.md</code> atau tidak masuk sama sekali.</li>
    <li><strong>Mengutip dan memakai ulang.</strong> Memindahkan tabel dari laporan ke tiket, changelog, atau artikel jadi sepele begitu tabel itu Markdown, dan menyiksa kalau bentuknya tangkapan layar.</li>
  </ul>

  <h2>Cara mengubah PDF ke Markdown dalam tiga langkah</h2>

  <figure><img src="/static/images/tools/pdf-to-markdown.jpg" alt="Konverter PDF ke Markdown Convertica dengan berkas yang sudah dimuat" width="1280" height="800" loading="lazy"></figure>

  <ol>
    <li>Buka <a href="/id/pdf-to-markdown/">konverter PDF ke Markdown</a> dan jatuhkan berkasnya. Konversi gratis menerima berkas sampai 15 MB, Premium menaikkannya ke 100 MB.</li>
    <li>Untuk dokumen biasa, biarkan <strong>deteksi judul</strong> dan <strong>pertahankan tabel</strong> tetap aktif. Yang pertama memetakan tingkat judul visual ke <code>#</code>, <code>##</code>, dan <code>###</code>; yang kedua mengubah kisi yang terdeteksi menjadi tabel Markdown.</li>
    <li>Jalankan konversi dan unduh berkas <code>.md</code>. Berkas itu terbuka di editor mana pun dan seluruh dokumen langsung terbaca sebagai teks.</li>
  </ol>

  <p>Konversinya berbasis teks, jadi cepat, dan untuk beberapa dokumen sehari tidak perlu akun: tanpa mendaftar tersedia 10 konversi per hari, akun gratis menaikkannya ke 40, dan Premium menghapus batas itu.</p>

  <h2>Bentuk hasilnya</h2>

  <p>Ambil laporan satu halaman dengan judul, satu baris pengantar, tabel tiga kolom, dan bagian catatan. Inilah yang kembali, tanpa disunting sama sekali:</p>

  <pre><code># Laporan Kuartalan

  Pendapatan per wilayah, semua angka dalam juta rupiah.

  | Wilayah | K1 | K2 |
  | --- | --- | --- |
  | Jakarta | 120 | 138 |
  | Surabaya | 95 | 102 |

  ## Catatan

  Pertumbuhan Surabaya melambat di K2 karena kalender hari raya.</code></pre>

  <p>Sebelum mengonversi berkas panjang, dua hal ini perlu diketahui:</p>

  <ul>
    <li><strong>Penanda halaman.</strong> Dokumen lebih dari satu halaman mendapat judul <code>## Page 2</code> dan garis horizontal di antara halaman, sehingga selalu jelas satu kutipan berasal dari mana. Pada dokumen yang mengalir, penanda itu biasanya dihapus; pada arsip pindaian atau berkas hukum, justru itu yang ingin dipertahankan.</li>
    <li><strong>Halaman kosong diberi keterangan.</strong> Halaman tanpa teks yang bisa diambil berubah menjadi baris <code>_No extractable text on this page._</code>, bukan hilang tanpa suara. Kalau baris itu muncul berulang, berkas Anda hasil pindaian dan butuh jalur OCR di bawah.</li>
  </ul>

  <h2>Apa yang selamat dan apa yang tidak</h2>

  <p>Di titik ini banyak panduan memilih diam. Setiap konversi PDF ke Markdown adalah rekonstruksi struktur dari petunjuk visual: ada yang hasilnya sangat baik, ada yang memang tidak mungkin. Mengetahui batasnya menghemat waktu memeriksa bagian yang salah:</p>

  <table>
    <thead>
      <tr><th>Elemen</th><th>Hasil</th><th>Yang bisa diharapkan</th></tr>
    </thead>
    <tbody>
      <tr><td>Teks utama dan urutan baca</td><td>Andal</td><td>Paragraf datang sesuai urutan tata letaknya di halaman</td></tr>
      <tr><td>Judul</td><td>Biasanya tepat</td><td>Dikenali dari ukuran huruf, jadi dokumen dengan tipografi konsisten terpetakan bersih ke tingkat <code>#</code></td></tr>
      <tr><td>Tabel dengan garis kisi</td><td>Biasanya tepat</td><td>Diekspor sebagai tabel Markdown; sel gabungan dan tabel bersarang diratakan</td></tr>
      <tr><td>Daftar berbutir</td><td>Sebagian</td><td>Teksnya selamat, tetapi butirnya datang sebagai karakter, bukan sintaks <code>-</code></td></tr>
      <tr><td>Tebal dan miring</td><td>Tidak</td><td>Penekanan di dalam paragraf tidak direkonstruksi, hanya tingkat judul</td></tr>
      <tr><td>Gambar dan grafik</td><td>Tidak</td><td>Ekspor teks tidak memuat gambar, ambil terpisah kalau perlu</td></tr>
      <tr><td>Tautan</td><td>Tidak</td><td>Alamat yang tampak tetap jadi teks; tautan yang bersembunyi di balik kata hilang</td></tr>
      <tr><td>Catatan kaki dan kepala halaman</td><td>Berantakan</td><td>Bagi PDF itu teks biasa di halaman, jadi mendarat di tempatnya semula</td></tr>
      <tr><td>Tata letak dua kolom</td><td>Berisiko</td><td>Tata letak jurnal dan surat kabar bisa mengaduk kolom, periksa halaman pertama sebelum memercayai sisanya</td></tr>
      <tr><td>Halaman hasil pindaian</td><td>Tidak</td><td>Tanpa lapisan teks tidak ada yang bisa diambil. OCR dulu</td></tr>
    </tbody>
  </table>

  <p>Patokan cepat: kalau teks di PDF bisa diblok dengan tetikus, konversi akan berhasil. Kalau memblok tidak menghasilkan apa pun, yang Anda pegang adalah gambar dan bagian berikut yang dibutuhkan.</p>

  <h2>Kalau PDF Anda hasil pindaian, mulailah dari OCR</h2>

  <p>Dokumen hasil pindaian atau foto tidak punya lapisan teks, hanya piksel. Mengonversinya ke Markdown menghasilkan baris <code>_No extractable text_</code> dan tidak lebih, dan itu jawaban yang jujur, bukan kegagalan. Pengenalan karakter optik harus dilakukan lebih dulu:</p>

  <ul>
    <li>Untuk dokumen hasil pindaian, lewatkan melalui <a href="/id/scanned-pdf-to-word/">PDF hasil pindaian ke Word</a>: alat ini menjalankan OCR dan memberi berkas yang bisa disunting lalu disimpan sebagai Markdown dari editor Anda.</li>
    <li>Untuk satu halaman, tangkapan layar, atau foto, lebih cepat memakai <a href="/id/image/to-text/">ekstraksi teks dari gambar</a>: hasilnya teks biasa yang strukturnya Anda susun sendiri.</li>
    <li>Belum yakin memegang yang mana? Panduan <a href="/id/blog/pdf-to-word-vs-ocr-which-to-use/">PDF ke Word atau OCR</a> menjelaskan cara membedakannya dalam sepuluh detik, dan artikel tentang <a href="/id/blog/how-to-extract-text-from-an-image/">mengambil teks dari gambar</a> membahas soal akurasi.</li>
  </ul>

  <h2>Rapikan lima menit yang membuat hasilnya layak dipublikasikan</h2>

  <p>Tidak ada konverter yang menyerahkan dokumen jadi, termasuk yang ini. Kabar baiknya, merapikannya bersifat mekanis dan hampir seluruhnya selesai dengan cari dan ganti:</p>

  <ol>
    <li><strong>Buang perabotnya.</strong> Kepala halaman, kaki halaman, nomor halaman, dan pernyataan kerahasiaan berulang di setiap halaman dan jadi yang pertama dihapus.</li>
    <li><strong>Sambung baris yang terpotong.</strong> Tata letak untuk cetak menyimpan pemutus baris keras di tengah kalimat. Cari tanda hubung sebelum ganti baris untuk menyatukan kata yang terbelah, lalu sambungkan sisa baris di dalam tiap paragraf.</li>
    <li><strong>Perbaiki tingkat judul.</strong> Deteksi berdasarkan ukuran huruf memberi tingkat yang wajar, tetapi dokumen yang menata judul utama dan judul bagian dengan gaya sama butuh satu putaran untuk menaikkan atau menurunkan beberapa tanda pagar.</li>
    <li><strong>Ubah karakter butir menjadi daftar.</strong> Ganti karakter butir di awal baris dengan <code>- </code> supaya penampil memperlakukannya sebagai butir daftar.</li>
    <li><strong>Periksa tabelnya.</strong> Pastikan jumlah kolom sama dengan aslinya dan tidak ada baris yang kehilangan sel. Tabel lebar yang paling sering terdampak.</li>
    <li><strong>Putuskan soal penanda halaman:</strong> hapus kalau Anda ingin dokumen yang mengalir, pertahankan kalau asal halaman itu penting.</li>
  </ol>

  <p>Lima menit untuk sepuluh halaman adalah pertukaran yang adil dibanding satu jam mengetik ulang, dan berbeda dari mengetik ulang, cara ini tidak menambah salah tulis baru pada angka.</p>

  <h2>Markdown, teks, Word, atau HTML: mana yang dipilih</h2>

  <p>Markdown bukan jawaban untuk semuanya. Format ekspor bergantung pada apa yang terjadi pada teks setelahnya:</p>

  <table>
    <thead>
      <tr><th>Tujuan</th><th>Format</th><th>Alasannya</th></tr>
    </thead>
    <tbody>
      <tr><td>Dokumentasi, catatan, Git, konteks AI</td><td><a href="/id/pdf-to-markdown/">Markdown</a></td><td>Struktur terjaga dan tetap terbaca sebagai teks biasa</td></tr>
      <tr><td>Hanya kata-katanya, tanpa struktur</td><td><a href="/id/pdf-to-text/">Teks</a></td><td>Keluaran paling sederhana untuk pencarian, skrip, atau grep cepat</td></tr>
      <tr><td>Lanjut menyunting dengan format</td><td><a href="/id/pdf-to-word/">Word</a></td><td>Menjaga tampilan serta memungkinkan lacak perubahan dan komentar</td></tr>
      <tr><td>Langsung dipublikasikan di web</td><td><a href="/id/pdf-to-html/">HTML</a></td><td>Terbuka di peramban tanpa proses build</td></tr>
      <tr><td>Angka yang akan dihitung ulang</td><td><a href="/id/pdf-to-excel/">Excel</a></td><td>Sel tetap sel, jadi formula masih bekerja</td></tr>
    </tbody>
  </table>

  <h2>Menyerahkan Markdown ke model AI tanpa membuang konteks</h2>

  <p>Kalau tujuannya model bahasa atau indeks pencarian, beberapa kebiasaan kecil sangat memengaruhi kualitas jawaban:</p>

  <ul>
    <li><strong>Pertahankan judulnya.</strong> Judul adalah petunjuk pemotongan paling murah yang ada. Memotong pada batas <code>##</code> memberi bagian-bagian yang masuk akal sendiri, dan itu mengalahkan pemotongan setiap seribu karakter di tengah kalimat.</li>
    <li><strong>Buang perabot yang berulang lebih dulu.</strong> Kaki halaman di enam puluh halaman berarti enam puluh potongan nyaris identik yang bersaing dengan isi sebenarnya dalam pencarian vektor, plus token berbayar di dalam prompt.</li>
    <li><strong>Biarkan tabel tetap tabel.</strong> Tabel bergaris tegak terbaca sebagai baris dan kolom oleh model. Angka yang sama, dilarutkan ke dalam paragraf, justru mengundangnya memasangkan angka yang salah dengan label yang salah.</li>
    <li><strong>Konversi per dokumen, bukan per arsip.</strong> Satu berkas <code>.md</code> untuk satu PDF menjaga keterlacakan, sehingga sumber sebuah jawaban selalu bisa ditunjuk.</li>
    <li><strong>Periksa angka yang penting.</strong> Konversi berjalan mekanis, tetapi sel gabungan yang diratakan bisa menggeser nilai ke kolom sebelah, dan tidak ada model yang akan menyadarinya untuk Anda. Angka yang menjadi dasar keputusan sebaiknya dicocokkan dengan PDF aslinya.</li>
  </ul>

  <h2>Apa yang terjadi pada berkas yang diunggah</h2>

  <p>Konversi berjalan di server, jadi PDF memang diunggah. Berkas itu dihapus tepat setelah konversi selesai, dan tautan unduhan hanya milik Anda. Tidak ada yang diindeks, dibaca, atau dipakai ulang untuk melatih model. Kalau yang Anda konversi adalah dokumentasi internal atau materi klien, catatan tentang <a href="/id/blog/is-convertica-safe-pdf-file-security-privacy-explained/">bagaimana Convertica memperlakukan berkas Anda</a> merinci aturan penyimpanannya; dan untuk dokumen dengan kewajiban kerahasiaan yang ketat, alat lokal tetap naluri yang benar.</p>

  <h2>Pertanyaan yang sering muncul</h2>

  <h3>Apakah tabel saya akan selamat?</h3>
  <p>Tabel dengan garis kisi yang terlihat biasanya berubah menjadi tabel Markdown utuh, termasuk baris kepalanya. Akurasi turun pada sel gabungan, tabel bersarang, dan tabel yang hanya dirapikan dengan spasi, karena tidak ada garis untuk dideteksi. Periksa tabel lebar lebih dulu; kisi sederhana hampir selalu benar.</p>

  <h3>Kenapa judul saya keluar sebagai paragraf biasa?</h3>
  <p>Deteksi bekerja dari tipografi: teks yang jelas lebih besar daripada teks isi menjadi judul. Dokumen yang judulnya hanya berbeda karena tebal atau warna, dengan ukuran sama seperti teks isi, tidak memberi apa pun untuk dideteksi. Biarkan deteksi aktif, konversikan, lalu naikkan beberapa judul secara manual.</p>

  <h3>Apakah teks tebal dan miring dipertahankan?</h3>
  <p>Tidak. Hanya tingkat judul dan struktur tabel yang direkonstruksi; penekanan di dalam paragraf tidak. Kalau penekanan itu penting, konversikan ke <a href="/id/pdf-to-word/">Word</a>, karena format karakternya ikut.</p>

  <h3>Bisakah saya mengonversi buku atau manual 300 halaman?</h3>
  <p>Bisa, selama masih dalam batas ukuran: 15 MB di tingkat gratis dan 100 MB dengan Premium. PDF besar yang isinya hanya teks biasanya jauh di bawah batas itu. Kalau dokumen besar butuh waktu, konversinya bisa dijalankan di latar belakang dan hasilnya dikirim lewat surel tanpa perlu menjaga tab tetap terbuka.</p>

  <h3>Apakah Markdown lebih baik daripada teks biasa untuk AI?</h3>
  <p>Untuk apa pun yang lebih panjang dari satu halaman, ya. Teks biasa memberi model kata-kata tanpa hierarki; Markdown memberi judul sebagai titik potong dan tabel yang masih terbaca sebagai tabel. Struktur itulah yang membuat sistem pencarian mengembalikan satu bagian yang utuh, bukan potongan karakter yang acak.</p>

  <h3>Seluruh halaman saya kembali sebagai satu baris tabel raksasa. Apa yang terjadi?</h3>
  <p>Dulu itu terjadi pada PDF yang ditata di dalam bingkai selebar halaman, karena bingkai terlihat seperti tabel satu sel. Konverter kini menolak tabel satu kolom dan membiarkan teksnya sebagai paragraf, jadi seharusnya tidak terulang. Kalau ada berkas tertentu yang masih aneh, konversikan lagi dengan opsi pertahankan tabel dimatikan.</p>

  <h2>Coba dengan berkas Anda</h2>

  <p>Ambil dokumen yang sejak lama ingin Anda pindahkan ke catatan atau situs dokumentasi, lalu lewatkan melalui <a href="/id/pdf-to-markdown/">konverter PDF ke Markdown</a>. Biarkan deteksi judul aktif, bandingkan halaman pertama dengan aslinya, dan lakukan rapikan lima menit. Kalau ternyata berkas itu hasil pindaian, mulailah dari <a href="/id/scanned-pdf-to-word/">PDF hasil pindaian ke Word</a>. Sisanya ada di <a href="/id/all-tools/">semua alat</a>.</p>
