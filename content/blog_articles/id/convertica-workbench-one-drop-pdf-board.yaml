  <p>Tiga ubin tanpa akun sudah cukup untuk melihat apakah ide ini cocok dengan cara Anda bekerja. Yang sebenarnya ditambahkan Premium adalah sinkronisasi: papan dan prasetel tersimpan di akun Anda, jadi papan yang Anda susun di meja kerja sudah ada di laptop dan ponsel, ubin sama, pengaturan sama. PDF ke PDF/A adalah satu-satunya konverter yang masih khusus Premium hari ini, ditandai lencana PRO bagi yang lain. Harganya ada di <a href="/id/pricing/">halaman harga</a>.</p>

  <h2>Apa yang terjadi pada berkas Anda</h2>

  <p>Papan tidak pernah menyimpan dokumen Anda. Yang disimpan hanya nama alat, urutan ubin, dan pengaturan, beberapa kilobita teks. Konversi cepat dikembalikan langsung ke browser Anda dan tidak ada yang ditahan. Berkas yang lebih besar berjalan di latar belakang lalu dihapus sekitar satu jam kemudian, sama seperti di halaman alat. Tutup tabnya dan faktur-faktur itu hilang; papan yang mengonversinya masih ada saat Anda kembali.</p>

  <h2>FAQ</h2>

  <h3>Apakah Workbench gratis?</h3>
  <p>Ya, dan Anda bisa memakainya tanpa masuk akun: satu papan, tiga ubin, tersimpan di browser. Akun gratis menaikkannya menjadi enam ubin, dan Premium memberi lima papan berisi dua puluh ubin masing-masing, tersinkron ke akun Anda. Isi tiap paket didaftar di <a href="/id/workbench/about/">halaman ringkasan Workbench</a>.</p>

  <h3>Alat apa saja yang bisa jadi ubin?</h3>
  <p>Semua yang menerima berkas dan mengembalikan berkas, 23 konverter sampai hari ini. Penyunting yang butuh masukan Anda di layar (tanda tangan, tambah teks, potong, atur ulang, bandingkan) bukan ubin, karena satu drop saja tidak bisa memberi tahu di mana tanda tangannya harus diletakkan.</p>

  <h3>Bagaimana cara mengubah pengaturan sebuah ubin?</h3>
  <p>Buka menu ubin, pilih "Konfigurasi di halaman alat". Halaman alat terbuka dengan pengaturan ubin saat ini, Anda ubah yang diinginkan, lalu klik Simpan Alur Kerja. Ubin memakai pengaturan baru itu untuk setiap drop berikutnya.</p>

  <h3>Bisa dipakai di ponsel?</h3>
  <p>Bisa. Kisinya menumpuk jadi satu kolom, pemindah papan berubah menjadi pemilih bawaan ponsel Anda, dan menyentuh ubin membuka pemilih berkas, biasanya galeri atau penyimpanan awan. Menggeser dengan tetikus memang lebih enak, tapi tidak ada bagian di sini yang khusus desktop.</p>

  <h3>Apakah berkas saya disimpan?</h3>
  <p>Tidak. Konversi instan kembali langsung ke browser Anda dan tidak disimpan, sedangkan berkas yang butuh antrean latar belakang dihapus sekitar satu jam kemudian. Papannya sendiri hanya mengingat alat mana yang Anda pilih dan bagaimana Anda mengaturnya.</p>

  <h2>Buka papan Anda</h2>

  <p>Cara tercepat memahaminya adalah menyusun satu. Buka <a href="/id/workbench/">Workbench</a>, tambahkan dua atau tiga konverter yang paling sering Anda pakai, lalu jatuhkan sebuah berkas ke ubin pertama. Kalau Anda lebih suka melihat orang lain melakukannya dulu, ada <a href="https://www.youtube.com/watch?v=Dcj_bE15UWQ" target="_blank" rel="noopener">panduan dua menit di YouTube</a>, dan <a href="/id/workbench/about/">halaman Workbench</a> menjawab sisanya.</p>
