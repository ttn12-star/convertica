content_id: |
  Ada konversi yang datang lagi setiap minggu. Faktur dari pemasok yang harus berakhir sebagai PDF arsip. Rekening koran yang harus masuk ke spreadsheet. Setumpuk foto dari ponsel yang tidak bisa dibuka siapa pun di kantor.

  Masing-masing cuma beberapa klik. Buka halaman alat, tunggu memuat, unggah, centang satu pengaturan yang selalu Anda centang, unduh. Lakukan delapan kali pada Senin pagi, dan dua puluh menit habis untuk layar yang sudah Anda hafal.

  Workbench PDF mengambil bagian itu dari pagi Anda. Alatnya Anda siapkan sekali di sebuah papan, dan sejak itu satu konversi cukup satu drop.

  <h2>Workbench PDF dalam satu ide: ubin</h2>

  <p>Papan adalah sebuah kisi. Tiap kotak di dalamnya adalah ubin, dan satu ubin berarti satu konverter plus pengaturan yang Anda simpan untuknya. Jatuhkan berkas ke ubin itu, atau klik lalu pilih berkas, dan konversi jalan dengan pengaturan tersebut. Tidak ada formulir, tidak ada opsi yang harus dipilih ulang, tidak ada halaman kedua. Hasilnya muncul di bawah ubin sebagai satu baris dengan tombol Unduh, dan tiga hasil terakhir tetap terlihat selagi Anda bekerja, jadi Anda bisa mengambil kembali sebuah berkas tanpa menjalankannya dua kali.</p>

  <p>Satu papan menjalankan satu konversi pada satu waktu. Itu memang disengaja: jatuhkan tiga berkas ke tiga ubin, dan semuanya kembali sesuai urutan Anda mengirimnya, bukan saling berebut.</p>

  <figure><img src="/static/images/blog/workbench-board.jpg" alt="Papan Convertica Workbench bernama Pembukuan dengan ubin PDF ke Word, Word ke PDF, dan PDF ke Excel, salah satunya menampilkan konversi selesai beserta tombol Unduh" width="1280" height="800" loading="lazy"></figure>

  <h2>Susun papan pertama Anda dalam dua menit</h2>

  <ol>
    <li><strong>Buka papannya.</strong> Masuk ke <a href="/id/workbench/">Workbench</a>. Tidak ada yang perlu dipasang, dan mencobanya tidak butuh akun. Tautannya juga ada di menu Semua Alat, menu akun, dan footer.</li>
    <li><strong>Klik "Tambahkan widget".</strong> Sebuah daftar yang bisa dicari akan terbuka dengan dua grup. <em>Prasetel saya</em> berisi alur kerja tersimpan yang sudah Anda buat di halaman alat, lengkap dengan pengaturan Anda sendiri. <em>Konverter</em> berisi semua alat yang menerima berkas dan mengembalikan berkas, 23 buah sampai hari ini: <a href="/id/pdf-to-word/">PDF ke Word</a> dan <a href="/id/word-to-pdf/">Word ke PDF</a>, Excel dan PowerPoint ke PDF, PDF ke HTML, teks, Markdown, EPUB, dan JPG, PDF/A, HEIC ke JPG, pengoptimal gambar, sampai alat ICO. Ketik beberapa huruf, lalu centang yang Anda mau.</li>
    <li><strong>Jatuhkan berkas.</strong> Ubin menerimanya, menjalankan konversi, dan menampilkan baris hasil di bawahnya. Berkas besar otomatis lewat jalur latar belakang, dan selagi satu konversi berjalan Anda bisa memilih "Lanjutkan di latar belakang" lalu meneruskan pekerjaan lain.</li>
    <li><strong>Unduh.</strong> Baris hasil menyimpan tombol Unduhnya sampai Anda menggantinya, dan dua hasil sebelumnya tetap tersusun di bawah.</li>
    <li><strong>Ajari ubin pengaturan Anda.</strong> Buka menu ubin, pilih "Konfigurasi di halaman alat", dan halaman alat terbuka dengan pengaturan ubin itu sudah termuat. Ubah yang perlu, klik <strong>Simpan Alur Kerja</strong>, dan ubin akan memegang versi baru itu. Begitulah OCR dinyalakan untuk PDF ke Word, atau ukuran halaman berhenti menjadi keputusan yang diulang terus. Sisi ini dibahas lebih jauh di halaman <a href="/id/saved-workflows/">alur kerja tersimpan</a>.</li>
  </ol>

  <figure><img src="/static/images/blog/workbench-picker.jpg" alt="Daftar Tambahkan widget di papan Workbench, disaring dengan kata 'word', menampilkan preset OCR tersimpan di grup Prasetel saya serta konverter PDF ke Word dan Word ke PDF di bawahnya" width="1280" height="800" loading="lazy"></figure>

  <p>Dua hal sengaja tidak dijadikan ubin. Alat yang pekerjaannya terjadi di layar (tanda tangan, tambah teks, potong, atur ulang, bandingkan) butuh tangan Anda dan sebuah pratinjau, jadi mereka tetap di halamannya sendiri. Lalu alat yang punya pilihan yang tidak bisa ditebak, seperti Konversi Gambar yang menanyakan format keluaran, akan menampilkan "Atur di halaman alat" dan mengantar Anda ke sana sekali.</p>

  <h2>Template: Office, Pindaian, Gambar</h2>

  <p>Papan yang masih kosong menawarkan tiga titik awal, begitu pula lembar Papan baru:</p>

  <ul>
    <li><strong>Office</strong>: Word ke PDF, PDF ke Word, Excel ke PDF, PowerPoint ke PDF.</li>
    <li><strong>Pindaian</strong>: Gambar ke teks, PDF ke teks, PDF ke Word.</li>
    <li><strong>Gambar</strong>: HEIC ke JPG, Optimalkan gambar, PDF ke JPG.</li>
  </ul>

  <p>Pilih salah satu, atau mulai dari papan kosong. Template hanya modal awal: setiap ubin yang dibuatnya bisa diatur ulang atau dibuang.</p>

  <h2>Beberapa papan, dan mode edit</h2>

  <p>Satu papan sudah menutup banyak kebutuhan, tapi pekerjaan biasanya terbelah jadi beberapa bentuk. Pemindah papan di kiri atas berpindah antar papan (di ponsel ia jadi pemilih bawaan sistem), dan menu papan di sebelahnya bisa mengganti nama, menjadikannya papan utama, menduplikasi, atau menghapus. Menduplikasi adalah cara cepat membuat varian: salin papan yang sudah Anda percaya, lalu ubah dua ubin yang berbeda saja.</p>

  <p>Penataan ulang terjadi di mode edit. Klik <strong>Edit</strong> di bilah atas, maka tiap ubin memunculkan pegangan geser, judulnya berubah menjadi kolom isian, dan tanda × muncul untuk membuangnya. Geser ubin ke urutan yang benar-benar Anda pakai, ganti nama "PDF ke Word" menjadi "Faktur pindaian" supaya langsung kenal sekali lihat, lalu klik Selesai. Di luar mode edit, menu ubin tetap menyediakan Ukuran S, M, atau L, Pindah kiri, Pindah kanan, dan Hapus.</p>

  <figure><img src="/static/images/blog/workbench-edit.jpg" alt="Workbench dalam mode edit: setiap ubin menampilkan pegangan geser, kolom judul yang bisa diisi, dan tombol hapus merah, dengan tombol Selesai di bilah atas" width="1280" height="800" loading="lazy"></figure>

  <h2>Tiga cara orang memakainya</h2>

  <p><strong>Staf pembukuan.</strong> Sebuah papan bernama Tutup bulan, tiga ubin. Faktur pemasok mendarat di ubin <a href="/id/pdf-to-pdfa/">PDF ke PDF/A</a>, karena arsipnya tidak menerima format lain. Rekening koran mendarat di <a href="/id/pdf-to-excel/">PDF ke Excel</a> supaya angkanya dicocokkan, bukan diketik ulang. Ubin ketiga menarik teks dari struk hasil pindaian. Dua puluh berkas, dua puluh drop, tanpa menyentuh satu pengaturan pun.</p>

  <p><strong>Asisten kantor.</strong> Semua yang keluar dari kantor sebagai lampiran mampir dulu ke satu papan. Draf Word dan materi presentasi jadi PDF supaya penerimanya melihat tata letak yang sama dengan penulisnya, dan foto yang dikirim tim penjualan dari ponsel lewat <a href="/id/image/heic-to-jpg/">HEIC ke JPG</a> sebelum sampai ke rekan yang memakai laptop Windows. Dulu satu tab browser untuk satu format. Sekarang satu tab, terbuka sepanjang hari.</p>

  <p><strong>Pengajar.</strong> Materi datang sebagai foto halaman buku dan harus jadi teks yang bisa disunting. Ubin <a href="/id/image/to-text/">gambar ke teks</a> yang membacanya, ubin PDF ke Word menangani lembar kerja pindaian yang lebih tua, dan ubin Word ke PDF mengirim versi jadinya keluar dalam format yang tercetak sama di setiap printer sekolah.</p>

