content_id: |
  Kamu bisa melakukan semuanya benar pada file dan tetap kehilangan pembeli di sepuluh detik terakhir. Pengiriman adalah bagian produk digital yang penjual desain secara tidak sengaja: filenya ada empat, jadi kamu zip, dan sekarang sebagian pembelimu tidak bisa membuka belanjaannya di perangkat yang dia pakai untuk membeli.

  Tiga keputusan menutup hampir semuanya.

  <h2>Keputusan 1: satu file, atau arsip</h2>

  <p>Nalurinya adalah membundel semuanya. Tahan diri kalau bisa, karena arsip itu hambatan nyata bagi porsi pembeli yang tidak kecil.</p>

  <table>
    <thead>
      <tr><th>Kirim satu PDF kalau</th><th>Kirim arsip kalau</th></tr>
    </thead>
    <tbody>
      <tr><td>Produknya satu hal dalam satu ukuran</td><td>Kamu punya beberapa ukuran kertas atau varian warna</td></tr>
      <tr><td>Kamu masih di dalam batas per file</td><td>Kalau tidak, kamu melewati batas jumlah file platform</td></tr>
      <tr><td>Sebagian besar trafikmu mobile</td><td>Produknya memang satu set yang akan disortir pembeli</td></tr>
    </tbody>
  </table>

  <p>Kalau kamu punya dua atau tiga file dan platform mengizinkan dua atau tiga, unggah terpisah. Pembeli menyentuh yang dia mau, selesai. Itu jelas lebih baik daripada memaksa semua orang mengekstrak arsip untuk mencapai file yang sama.</p>

  <h2>Keputusan 2: apa yang dilakukan HP</h2>

  <p>Porsi besar pembeli membuka belanjaannya di HP, sering dalam semenit setelah bayar, sering sambil berdiri di suatu tempat. Yang dialami orang itu dengan arsip:</p>

  <ul>
    <li><strong>Android dan iOS lama butuh satu langkah tambahan</strong> untuk sampai dari arsip yang diunduh ke PDF yang bisa dibaca. Versi modern menanganinya, tapi kata "modern" memikul banyak dalam kalimat itu, dan tidak semua pembelimu pakai HP baru.</li>
    <li><strong>File hasil ekstrak sering mendarat di satu direktori datar</strong>, jadi struktur foldermu hilang. Kalau dua file hanya dibedakan oleh foldernya, sekarang mereka tidak berbeda.</li>
    <li><strong>Unduhan 40 MB dengan data seluler</strong> itu jeda, dan jeda adalah tempat orang menutup tab sambil berniat kembali.</li>
  </ul>

  <p>Ini bukan berarti jangan pernah pakai arsip. Artinya: kalau memakainya, beri nama file supaya tetap jelas setelah diekstrak, dan jaga unduhannya cukup kecil agar selesai di perjalanan.</p>

  <h2>Keputusan 3: ukuran, per file</h2>

  <p>Batas platform dihitung per file, bukan per bundel, dan pembedaan itulah yang menentukan pengemasanmu. Marketplace umumnya membatasi setiap file digital sekitar 20 MB dan jumlah file per listing lima, jadi bundel empat ukuran dalam tiga varian warna harus jadi arsip, mau tidak mau. Cek angka yang berlaku di platformmu sebelum membangun bundel di sekitarnya.</p>

  <p>Kalau kamu melewati batas, cari penyebabnya sebelum meraih kompresi. PDF berisi teks saja ukurannya kecil sekali; planner 30 MB jadi 30 MB karena latar satu halaman penuh atau tekstur kertas. Mengganti tekstur itu dengan warna rata biasanya memangkas file berkali-kali lipat dan tidak terlihat bedanya di printer rumahan. Baru setelah itu pakai <a href="/id/pdf-organize/compress/">kompresor PDF</a>, yang menjaga teks dan vektor pada kualitas penuh lalu mengompres ulang gambar, dan cetak satu halaman sebelum percaya hasilnya.</p>

  <h2>Perlukah arsipnya dipassword?</h2>

  <p>Kamu bisa <a href="/id/archive/protect/">memberi password pada ZIP</a>, dan untuk unduhan berbayar biasanya sebaiknya tidak. Hitungannya tidak ramah: sekarang setiap pembeli butuh passwordnya, artinya password itu tinggal di deskripsi listing atau email pengiriman, artinya dia tidak melindungi apa pun, sementara sebagian pembeli akan gagal memasukkannya dengan benar lalu chat kamu.</p>

  <p>Kasus di mana ini masuk akal itu sempit: file yang dikirim ke satu klien tertentu, salinan pra-rilis untuk pengulas, atau bundel yang kamu kirim di luar platform ke orang tertentu. Catatan kami soal <a href="/id/blog/how-to-password-protect-a-zip-file/">memberi password pada arsip ZIP</a> membahas mekanismenya, dan pertanyaan yang lebih luas soal apa yang sebenarnya dicapai proteksi ada di <a href="/id/blog/stop-buyers-editing-reselling-your-pdf/">apa yang mencegah pembeli mengedit atau menjual ulang PDF</a>. Singkatnya: untuk produk, yang bekerja adalah halaman lisensi, bukan password.</p>

  <h2>Apa yang harus pembeli lihat pertama</h2>

  <p>Anggap pembeli mengekstrak semuanya ke folder unduhan dan tidak membaca apa pun. Desain untuk orang itu:</p>

  <ul>
    <li><strong>Nama file yang menyebut produk dan variannya</strong> dan tidak lebih. <code>weekly-planner-A4.pdf</code>, bukan <code>final_v3.pdf</code>.</li>
    <li><strong>Satu halaman panduan singkat</strong>, dan hanya satu. Kalau kamu menyertakan file teks bernama <code>READ ME FIRST.txt</code> di samping empat PDF, sebagian besar tidak akan membacanya, jadi duplikasikan baris pentingnya di dalam PDF-nya juga.</li>
    <li><strong>Panduan cetak, dikatakan sekali dan lugas.</strong> Cetak 100 persen, ukuran asli, penskalaan dimatikan. Satu baris ini mencegah lebih banyak keluhan daripada apa pun lain di artikel ini.</li>
  </ul>

  <h2>Permintaan kirim ulang</h2>

  <p>Selalu datang: pembeli yang kehilangan filenya, berganti HP, atau kena tautan kedaluwarsa. Tentukan jawabanmu sebelum itu terjadi, bukan berimprovisasi pada jam sebelas malam.</p>

  <ul>
    <li><strong>Ketahui kebijakan tautan platformmu.</strong> Ada yang kedaluwarsa, ada yang punya hitungan unduhan, ada yang bertahan selama akunnya ada. Tanpa itu kamu tidak bisa menjawab pembeli.</li>
    <li><strong>Simpan file yang dikirim, per versi.</strong> Kalau kamu sudah mengirim dua versi, kamu perlu tahu pembeli itu membeli yang mana. Di sinilah penanda versi dari pemeriksaan pra-rilis terbayar.</li>
    <li><strong>Bilang ya lalu lanjut.</strong> Mengirim ulang file tidak memakan biaya dan membeli niat baik dari orang yang sudah membayar. Berdebat memakan satu ulasan.</li>
  </ul>

  <h2>Checklist pengiriman</h2>

  <table>
    <thead>
      <tr><th>Pemeriksaan</th><th>Kenapa</th></tr>
    </thead>
    <tbody>
      <tr><td>File terpisah kalau jumlahnya diizinkan platform</td><td>Menghapus langkah arsip sepenuhnya</td></tr>
      <tr><td>Setiap file di bawah batas per file</td><td>Batasnya per file, bukan per bundel</td></tr>
      <tr><td>Nama file tetap bermakna setelah diekstrak</td><td>Struktur folder hilang</td></tr>
      <tr><td>Unduhan terbuka di HP dalam dua sentuhan</td><td>Di situlah sebagian besar pembukaan pertama terjadi</td></tr>
      <tr><td>Satu halaman panduan, skala cetak disebutkan</td><td>Mencegah keluhan yang paling sering</td></tr>
      <tr><td>Tanpa password kecuali ada penerima tertentu</td><td>Tidak melindungi apa pun, memancing pesan</td></tr>
      <tr><td>Kamu tahu kebijakan kedaluwarsa tautan</td><td>Kamu akan ditanya soal itu</td></tr>
      <tr><td>Kamu menyimpan file terkirim per versi</td><td>Kirim ulang butuh salinan yang tepat</td></tr>
    </tbody>
  </table>

  <p>Kalau kamu belum melakukan lintasan atas file dan listing, itu lebih dulu: <a href="/id/blog/digital-product-pdf-checklist-before-you-publish/">checklist sebelum rilis</a> kami adalah gerbangnya, dan <a href="/id/blog/sell-printable-pdf-on-etsy/">menyiapkan PDF printable untuk dijual</a> menutup filenya sendiri.</p>

  <h2>Apa yang terjadi pada file yang kamu unggah</h2>

  <p>Tool kami berjalan di server, jadi filenya diunggah. File dihapus begitu prosesnya selesai, dan tautan unduhannya hanya milikmu. Tidak ada yang diindeks, disimpan, atau dipakai untuk pelatihan. Catatan kami soal <a href="/id/blog/is-convertica-safe-pdf-file-security-privacy-explained/">bagaimana Convertica memperlakukan filemu</a> menjelaskan aturan penyimpanannya.</p>

  <h2>Pertanyaan yang sering muncul</h2>

  <h3>Apa iya ZIP sebegitu merepotkan?</h3>
  <p>Di komputer, tidak. Di HP itu langkah tambahan yang sebagian pembeli tidak akan selesaikan, dan HP adalah tempat banyak pembukaan pertama terjadi. Intinya bukan arsip itu buruk, tapi arsip harus jadi keputusan, bukan bawaan. Kalau dua file terpisah masuk aturan platform, kirim dua file terpisah.</p>

  <h3>Ukuran total unduhan yang wajar berapa?</h3>
  <p>Cukup kecil supaya selesai dengan data seluler tanpa pembeli bertanya-tanya apakah macet. Untuk printable, itu megabita satu digit di sebagian besar produk. Kalau kamu jauh di atas itu, penyebabnya hampir selalu gambar, dan menemukannya lebih baik daripada mengompres di sekelilingnya.</p>

  <h3>Perlu menyertakan file read-me?</h3>
  <p>Satu, singkat, dan duplikasikan baris kritisnya di dalam PDF-nya sendiri, karena file teks di samping empat PDF umumnya tidak terbaca. Baris kritisnya adalah skala cetak.</p>

  <h3>Bisakah saya mencegah orang membagikan tautan unduhan?</h3>
  <p>Tidak secara bermakna, dan kerugian jarang datang dari sana. Tautan platform biasanya terikat ke pesanan, dan orang yang niat membagikan akan membagikan filenya, bukan tautannya. Pakai tenaganya untuk halaman lisensi.</p>

  <h3>Pembeli bilang filenya tidak bisa dibuka. Apa yang saya tanya dulu?</h3>
  <p>Perangkat apa, dan apakah dia sudah mengekstrak arsipnya. Dua pertanyaan itu menyelesaikan mayoritas laporan "tidak bisa dibuka", karena jawaban umumnya HP lama dan ZIP yang belum diekstrak. Pertanyaan berikutnya adalah pembaca PDF-nya, karena pratinjau di browser kadang gagal pada file yang di aplikasi PDF terbuka baik-baik saja.</p>

  <h3>Perlu mengirim A4 dan US Letter terpisah?</h3>
  <p>Kalau batas jumlah file platform mengizinkan, ya, dan tandai di nama filenya. Itu jawaban paling jelas untuk pertanyaan ukuran, dan menyelamatkan pembeli dari membuka yang salah. Alasan menyediakan keduanya ada di <a href="/id/blog/a4-vs-us-letter-printable-sizes/">A4 atau US Letter</a>.</p>

  <h2>Perbaiki pengirimanmu</h2>

  <p>Buka pesananmu sendiri yang terakhir seperti cara pembeli, di HP, dan hitung berapa sentuhan sampai halaman yang bisa dibaca. Kalau lebih dari dua, obatnya biasanya memecah arsip jadi file terpisah atau mengganti namanya supaya masuk akal sendiri. Kalau arsipnya memang perlu dan harus dikunci untuk penerima tertentu, barulah <a href="/id/archive/protect/">beri password pada ZIP</a>, dan hanya saat itu. Sisanya ada di <a href="/id/all-tools/">semua tool</a>.</p>
