content_id: |
  Produk printable yang berakhir dengan refund hampir tidak pernah karena desainnya jelek. Di layar desainnya sudah bagus. Yang terjadi biasanya lain: pembeli membukanya di laptop Windows dan font yang cantik berubah jadi Times New Roman. Atau dia mencetaknya dan bingkainya terpotong di dua sisi. Atau ilustrasi yang tampak tajam di browser keluar lembek dan pecah dari printer inkjet. Atau Etsy langsung menolak unggahan karena filenya 34 MB.

  Jadi pekerjaan yang benar-benar menjaga rating toko justru mulai setelah desain selesai. Pekerjaannya tidak seru: ukuran halaman, resolusi, margin, font, ukuran file. Masing-masing gagal dengan cara yang khas, dan masing-masing bisa diperiksa dalam dua menit. Ini urutan kejadiannya.

  <h2>Apa yang sebenarnya dilakukan pembeli dengan file kamu</h2>

  <p>Semua syarat di bawah berasal dari satu hal yang sama, jadi ada gunanya membayangkan orang di ujung sana secara konkret. Pembeli kamu bukan percetakan. Dia:</p>

  <ul>
    <li><strong>Mencetak di rumah</strong>, pakai inkjet atau laser murah yang secara fisik tidak bisa mencetak sampai tepi kertas.</li>
    <li><strong>Memakai kertas yang dijual di negaranya.</strong> A4 di hampir semua tempat, US Letter di Amerika dan Kanada. Di Indonesia F4 alias folio juga masih umum di toko dan kantor, dan itu ukuran ketiga lagi. Semuanya proporsi yang berbeda, bukan cuma ukuran yang berbeda.</li>
    <li><strong>Membuka file dengan apa pun yang ada</strong>, dan makin sering itu berarti HP atau tablet dan pembaca PDF yang bukan Acrobat.</li>
    <li><strong>Tidak akan chat kamu soal masalahnya.</strong> Dia akan minta refund atau menulis ulasan, dan dua-duanya lebih mahal daripada nilai penjualannya.</li>
  </ul>

  <p>PDF memang format yang tepat untuk semua itu karena membawa tata letaknya sendiri. Di situ juga jebakannya: dia membawa persis tata letak yang kamu berikan, termasuk bagian yang cuma jalan di komputer kamu.</p>

  <h2>Ukuran halaman: proporsi dipilih sebelum apa pun</h2>

  <p>A4 itu 210 kali 297 mm. US Letter itu 216 kali 279 mm. Letter lebih lebar dan lebih pendek. Tidak ada faktor skala yang mengubah satu jadi yang lain, karena itu saran "cetak saja dengan fit to page" menghasilkan planner dengan garis putih tidak rata dan poster dengan tepi terpotong.</p>

  <p>Dua pilihan yang jujur: pilih satu ukuran dan tulis jelas di deskripsi listing, atau kirim keduanya. Sebagian besar toko printable yang sudah jalan mengirim keduanya, karena toko yang hanya A4 diam-diam kehilangan trafik Amerika, dan toko yang hanya Letter kehilangan semua orang lain.</p>

  <p>Mengirim keduanya berarti mengekspor dua file dari aplikasi desain. Jangan coba membuat ukuran kedua dengan crop atau scale dari PDF yang sudah jadi: crop memotong halaman jadi kotak yang lebih kecil, jadi kamu dapat jendela berproporsi Letter di atas desain A4 dengan isi yang hilang di bagian bawah. <a href="/id/pdf-edit/crop/">Crop PDF</a> kami gunanya membuang margin yang tidak terpakai pada dokumen, bukan mengonversi satu standar kertas ke standar lain. Mengekspor dua kali dari aplikasi desain tetap pilihan terbaik, karena hanya file aslinya yang benar-benar bisa ditata ulang untuk proporsi yang lain. Kalau file itu sudah tidak ada, atau kamu membeli templat, <a href="/id/pdf-edit/page-size/">ubah ukuran halaman PDF</a> melakukan hal terbaik berikutnya: memindahkan halaman ke kertas satunya dan, karena A4 kehilangan 8,8 mm di atas dan bawah saat jadi Letter, mempertahankan ukuran penuh kalau marginmu menyediakan ruang, lalu mengecilkannya seminimal mungkin kalau tidak. Dia tidak pernah memotong. Itu juga alasan praktis untuk menjaga margin 10 sampai 12 mm yang dibahas di bawah.</p>

  <h2>300 dpi, dan kenapa layar menipu kamu</h2>

  <p>Layar sekitar 100 piksel per inci. Kertas menampilkan detail sekitar tiga kali lebih halus. Karena itu gambar yang di browser tampak tajam sempurna pada zoom penuh bisa tercetak jelas lembek, dan tidak ada cara melihatnya dari monitor.</p>

  <p>Aturannya: 300 dpi pada ukuran cetak akhir. Praktiknya:</p>

  <ul>
    <li><strong>Poster 20 kali 25 cm</strong> butuh sumber gambar sekitar 2400 kali 3000 piksel. Kalau aslinya lebarnya 1000 piksel, tidak ada setelan ekspor yang bisa menyelamatkannya.</li>
    <li><strong>Teks dan bentuk tidak dihitung.</strong> Huruf, garis, dan ilustrasi vektor di dalam PDF tidak bergantung resolusi dan tercetak sebaik kemampuan printer. Planner yang seluruhnya teks dan garis selalu keluar tajam.</li>
    <li><strong>Yang berisiko hanya raster.</strong> Foto, tekstur, elemen cat air, tulisan hasil scan, dan apa pun yang kamu dapat dalam bentuk JPG atau PNG.</li>
  </ul>

  <p>Kalau kamu menyusun desain di editor berbasis browser, ekspor pada kualitas tertinggi yang tersedia, bukan pilihan bawaan: yang bawaan biasanya disetel untuk dibagikan di layar.</p>

  <h2>Tepi yang tidak tercetak, dan margin yang dipaksakannya</h2>

  <p>Printer rumahan menjepit kertas dengan roller supaya bisa menariknya, jadi tinta tidak bisa turun di beberapa milimeter terluar. Tergantung modelnya, zona mati itu sekitar 3 sampai 6 mm di setiap sisi, dan lebih lebar di tepi keluar.</p>

  <p>Ada dua akibatnya yang menjebak hampir semua penjual baru:</p>

  <ul>
    <li><strong>Latar full bleed tidak jalan di rumah.</strong> Desain yang warnanya sampai tepi halaman tercetak dengan garis putih tipis, dan biasanya tidak rata. Kalau desainnya memang butuh warna penuh sampai tepi, tulis di listing bahwa filenya ditujukan untuk percetakan.</li>
    <li><strong>Semua yang penting harus digeser ke dalam.</strong> Teks, nomor halaman, kotak centang, dan garis potong simpan minimal 10 sampai 12 mm dari tepi. Lebih dekat dari itu sudah jadi undian di printer yang tidak kita kenal.</li>
  </ul>

  <p>Separuh masalah lainnya ada di dialog cetak pembeli. Sebagian besar pembaca PDF secara bawaan memilih "fit to printable area", yang diam-diam mengecilkan halaman beberapa persen dan menengahkannya. Di planner tidak kelihatan. Di produk yang akan dipotong atau dijilid pembeli, itu masalah nyata, jadi tambahkan satu baris di panduanmu: cetak 100 persen, ukuran asli, penskalaan dimatikan.</p>

  <h2>Font: tanam, atau ubah jadi bentuk</h2>

  <p>Kegagalan file yang paling sering adalah font yang tidak ikut masuk ke PDF. Di komputer kamu font itu terpasang, jadi filenya kelihatan benar. Di komputer pembeli, pembaca PDF tidak menemukannya dan menggantinya dengan yang lain, dan itu menyusun ulang setiap baris serta menghancurkan tata letak yang kamu kerjakan sepanjang akhir pekan.</p>

  <p>Dua cara supaya aman, urut dari yang lebih disarankan:</p>

  <ul>
    <li><strong>Tanam font saat ekspor.</strong> Semua aplikasi desain yang serius punya opsi ini, dan yang berbasis browser melakukannya otomatis. Memeriksanya gampang: buka PDF-nya, lihat properti dokumen, ada tab font, dan setiap font harusnya bertanda "Embedded" atau "Embedded Subset".</li>
    <li><strong>Ubah teks jadi outline</strong> sebelum ekspor. Hurufnya jadi bentuk vektor, jadi tidak butuh font sama sekali. Cara ini antipeluru dan tidak bisa dibalik, jadi simpan file master yang masih bisa diedit.</li>
  </ul>

  <p>Uji di komputer yang tidak punya font kamu, atau minta orang lain membukanya. Membukanya di komputer sendiri tidak membuktikan apa pun: komputer kamu satu-satunya tempat yang dijamin berhasil.</p>

  <h2>Flatten filenya, tapi jujur soal apa yang kamu dapat</h2>

  <p>Layer, kolom formulir, anotasi, dan objek teks yang masih bisa diedit semuanya hal yang bisa digeser pembeli tanpa sengaja, dan hal yang membuat file lebih berat dari seharusnya. <a href="/id/pdf-edit/flatten/">Flatten PDF</a> melebur semuanya jadi satu halaman statis. Hasilnya lebih cepat dibuka, lebih bisa diprediksi saat dicetak di pembaca PDF yang aneh, dan tidak bergeser gara-gara satu klik nyasar.</p>

  <p>Yang tidak dilakukan flatten adalah menghentikan orang menjual ulang karyamu. Password juga tidak. Siapa pun yang bisa mencetak satu halaman bisa memfotonya, dan PDF yang bisa dibuka pembeli adalah PDF yang bisa di-screenshot. Flatten itu kebersihan file, bukan penegakan hak cipta. Yang benar-benar dicegahnya adalah kecelakaan sehari-hari: pembeli menggeser kotak teks, lalu bertanya kenapa filemu rusak.</p>

  <p>Kalau kamu juga ingin menahan pengeditan sembarangan, <a href="/id/pdf-security/protect/">izin akses PDF</a> bisa membatasi edit dan copy sambil membiarkan file tetap bisa dibaca dan dicetak. Anggap itu polisi tidur. Catatan kami tentang <a href="/id/blog/password-protect-pdf-before-emailing/">apa yang sebenarnya dilindungi password PDF</a> menjelaskan perbedaan dua jenis password, dan itu layak diketahui sebelum kamu bergantung pada salah satunya.</p>

  <h2>Ukuran file: batas sebenarnya adalah 20 MB milik Etsy</h2>

  <p>Saat tulisan ini dibuat, Etsy menerima file digital sampai 20 MB per file, maksimal lima file per listing. Angka itu, bukan desainmu, yang menentukan cara kamu mengemas satu paket. Tiga akibat praktisnya:</p>

  <ul>
    <li><strong>Paket dengan beberapa ukuran melewati lima file dengan cepat.</strong> Empat ukuran kali tiga varian warna sudah dua belas file. Jawaban standarnya ZIP: satu arsip menempati satu dari lima slot, dan pembeli bisa mengekstraknya di platform mana pun.</li>
    <li><strong>Planner yang besar biasanya besar karena gambar.</strong> PDF berisi teks saja ukurannya kecil sekali. Kalau planner 40 halaman jadi 30 MB, ada latar satu halaman penuh atau tekstur yang menyebabkannya.</li>
    <li><strong>Kompres paling terakhir, dan periksa hasilnya di atas kertas.</strong> <a href="/id/pdf-organize/compress/">Kompresor PDF</a> kami menjaga teks dan vektor pada kualitas penuh lalu mengompres ulang gambar, dan itu pertukaran yang tepat untuk planner yang banyak teks serta justru salah untuk poster fotografis. Untuk karya gambar, cetak satu halaman sebelum dan sesudah, lalu lihat sendiri. Kalau tidak bisa masuk batas tanpa penurunan yang terlihat, lebih baik pecah listingnya.</li>
  </ul>

  <p>Kalau kamu memilih jalur arsip dan ingin unduhannya sendiri terkunci, kamu bisa <a href="/id/archive/protect/">memberi password pada ZIP</a>, walaupun untuk unduhan berbayar itu biasanya menimbulkan lebih banyak pesan ke penjual daripada yang dicegahnya.</p>

  <h2>Produk banyak halaman butuh nomor halaman</h2>

  <p>Produk apa pun yang dicetak pembeli sebagai satu set, jadi planner, buku latihan, paket lembar kerja, butuh nomor halaman. Tanpa itu, orang yang mencetak 40 halaman lalu menjatuhkan tumpukannya tidak punya cara menyusunnya lagi, dan itu berubah jadi masalahmu.</p>

  <p>Tambahkan di paling akhir, saat urutan halaman sudah final, lewat <a href="/id/pdf-edit/add-page-numbers/">tambah nomor halaman</a>. Simpan di dalam zona aman yang dibahas di atas, karena nomor yang cuma 5 mm dari tepi adalah hal pertama yang dimakan printer. <a href="/id/blog/add-page-numbers-to-pdf/">Pembahasan lengkap soal penomoran</a> mencakup posisi dan awal hitungan kalau kamu perlu melewati halaman sampul.</p>

  <h2>Pratinjau untuk listing, bukan produknya</h2>

  <p>Gambar di listing harus memperlihatkan produk tanpa menjadi produknya. Ekspor satu halaman jadi gambar dengan <a href="/id/pdf-to-jpg/">PDF ke JPG</a> untuk mockup yang bersih, dan kalau kamu ingin menampilkan halaman dalam dari buku latihan berbayar, lewatkan dulu ke <a href="/id/pdf-edit/add-watermark/">tambah watermark</a>. Catatan kami soal <a href="/id/blog/watermark-pdf-confidential-draft/">watermark pada PDF</a> membahas posisi dan tingkat transparansi: untuk pratinjau, watermark harus terbaca tapi jangan sampai pembeli tidak bisa menilai desainnya.</p>

  <h2>Pemeriksaan delapan poin sebelum unggah</h2>

  <table>
    <thead>
      <tr><th>Yang diperiksa</th><th>Cara memastikan</th><th>Yang dicegah</th></tr>
    </thead>
    <tbody>
      <tr><td>Ukuran halaman sama di semua halaman</td><td>Buka PDF dan pastikan dimensinya sama di mana-mana</td><td>Satu halaman nyasar berukuran lain, yang tercetak dengan skala</td></tr>
      <tr><td>Font tertanam</td><td>Properti dokumen, tab font, semuanya "Embedded"</td><td>Font tergantikan dan tata letak berubah</td></tr>
      <tr><td>Gambar 300 dpi pada ukuran akhir</td><td>Cetak satu halaman dan lihat di bawah cahaya bagus</td><td>Karya gambar lembek dan pecah</td></tr>
      <tr><td>Isi berada dalam margin 10 sampai 12 mm</td><td>Cetak 100 persen dan cek keempat tepinya</td><td>Bingkai terpotong dan nomor halaman hilang</td></tr>
      <tr><td>File sudah di-flatten</td><td>Klik di halaman, tidak ada yang terpilih atau tergeser</td><td>Pembeli memindahkan elemen tanpa sengaja</td></tr>
      <tr><td>Ukuran masih dalam batas platform</td><td>Lihat ukuran per file, bukan per paket</td><td>Unggahan ditolak di saat paling tidak enak</td></tr>
      <tr><td>Nomor halaman pada set banyak halaman</td><td>Buka-buka file hasil ekspor</td><td>Pembeli tidak bisa menyusun tumpukan cetakan</td></tr>
      <tr><td>Bisa dibuka di perangkat yang bukan milikmu</td><td>HP, atau laptop teman</td><td>Semua masalah font dan pembaca PDF sekaligus</td></tr>
    </tbody>
  </table>

  <p>Sekali jalan butuh sepuluh menit. Jalan yang sama setelah ada permintaan refund butuh sepuluh menit plus satu ulasan yang tidak bisa kamu hapus.</p>

  <h2>Apa yang terjadi pada file yang kamu unggah</h2>

  <p>Tool kami berjalan di server, jadi filenya diunggah. File dihapus begitu prosesnya selesai, dan tautan unduhannya hanya milikmu. Tidak ada yang diindeks, disimpan, atau dipakai untuk pelatihan. Untuk produk yang belum diluncurkan sebagian penjual tetap merasa kurang nyaman, dan itu wajar: catatan kami soal <a href="/id/blog/is-convertica-safe-pdf-file-security-privacy-explained/">bagaimana Convertica memperlakukan filemu</a> menjelaskan aturan penyimpanannya supaya kamu bisa memutuskan sendiri.</p>

  <h2>Pertanyaan yang sering muncul</h2>

  <h3>Jual dalam A4 atau US Letter?</h3>
  <p>Kirim keduanya kalau bisa, dan beri label yang jelas di dalam unduhan. Kalau harus memilih satu, pilih berdasarkan asal trafikmu: A4 untuk sebagian besar dunia, US Letter untuk toko yang menyasar Amerika dan Kanada. Yang tidak boleh dilakukan adalah mengirim satu ukuran lalu diam soal itu, karena itu berubah jadi permintaan refund dari separuh dunia yang memegang kertas satunya.</p>

  <h3>Perlu bleed untuk produk printable?</h3>
  <p>Untuk cetak di rumah tidak perlu, dan menambahkannya biasanya malah memperburuk: desain dengan bleed mengandaikan dipotong setelah cetak, sementara pembelimu tidak punya alat potong. Rancang saja sesuai ukuran halaman dengan margin aman. Bleed baru relevan kalau kamu juga menjual versi untuk percetakan, dan itu seharusnya file terpisah.</p>

  <h3>Bisakah saya mencegah pembeli menjual ulang PDF saya?</h3>
  <p>Secara teknis tidak. File apa pun yang bisa dibuka dan dicetak pembeli bisa dikopi. Izin akses dan password hanya menahan pengeditan sembarangan. Yang benar-benar bekerja adalah kombinasi yang membosankan: satu halaman lisensi di dalam file yang menyatakan apa yang boleh dan tidak boleh dilakukan pembeli, plus proses pelaporan platform saat kamu menemukan salinannya.</p>

  <h3>Planner saya 45 MB. Apa yang dipotong dulu?</h3>
  <p>Cari gambarnya. Latar satu halaman penuh, tekstur kertas, atau sampul foto hampir selalu menjelaskan seluruh ukurannya, dan mengganti tekstur dengan warna rata atau pola vektor yang halus bisa memotong file sampai berkali-kali lipat. Kompres baru setelah itu, dan periksa halaman cetakannya.</p>

  <h3>Kirim satu PDF atau ZIP?</h3>
  <p>Satu PDF kalau produknya satu hal dalam satu ukuran, karena setiap langkah tambahan kehilangan pembeli yang membuka unduhan dari HP. ZIP begitu ada beberapa ukuran atau varian warna, karena itu menahanmu di dalam batas lima file dan merapikan penamaan. Kalau membundel, beri nama file yang tetap masuk akal di luar konteks: catatan kami soal <a href="/id/blog/pdf-naming-conventions-best-practices/">penamaan file</a> ditulis untuk dokumen kerja, tapi berlaku sama persis.</p>

  <h3>Apakah flatten menurunkan kualitas cetak?</h3>
  <p>Tidak. Flatten melebur layer dan elemen interaktif jadi isi halaman yang statis; dia tidak me-resample gambar dan tidak mengubah resolusi. Yang bisa memakan kualitas adalah kompresi, dan itu keputusan yang berbeda.</p>

  <h2>Siapkan filenya</h2>

  <p>Ambil produk yang paling dekat siap tayang dan jalankan pemeriksaan delapan poin sekarang, sebelum menulis deskripsi. Sebagian besar file butuh dua perbaikan: <a href="/id/pdf-edit/flatten/">flatten</a> dan, untuk set banyak halaman, <a href="/id/pdf-edit/add-page-numbers/">nomor halaman</a>. Kompres hanya kalau platformnya memaksa, pakai <a href="/id/pdf-organize/compress/">kompresor PDF</a>, dan lihat satu halaman cetakan sebelum percaya hasilnya. Sisanya ada di <a href="/id/all-tools/">semua tool</a>.</p>
