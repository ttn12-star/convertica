content_pl: |
  Jest moment tuż przed kliknięciem „publikuj”, gdy wszystko wygląda skończone. Projekt gotowy, plik sprawdzony, makiety zrobione. To najtańsza możliwa chwila, żeby wyłapać błąd, i najczęściej pomijana.

  Kontrole poniżej celowo pomijają sam plik. Format strony, rozdzielczość, osadzone czcionki i waga są opisane w naszym przewodniku <a href="/pl/blog/sell-printable-pdf-on-etsy/">jak przygotować PDF do druku na sprzedaż</a>, a jeśli produkt wychodzi w dwóch standardach papieru, to <a href="/pl/blog/a4-vs-us-letter-printable-sizes/">decyzja o A4 i US Letter</a> też jest tam. Zakładamy, że ta praca jest zrobiona. Dalej idzie wszystko wokół pliku, a właśnie tam mieszkają pozostałe zwroty.

  <h2>1. Otwórz zestaw tak, jak zrobi to kupujący</h2>

  <p>Nie folder na własnym pulpicie. Dokładnie to, co jest dostarczane. Pobierz przez podglądu platformy, jeśli taki oferuje, albo wyślij archiwum do siebie mailem i otwórz z maila.</p>

  <ul>
    <li><strong>Na telefonie.</strong> Duża część kupujących otwiera pobranie najpierw na telefonie, a archiwum na telefonie to gorsze doświadczenie, niż pamiętasz. Jeśli z telefonu nie da się dojść do twojego pliku w dwa dotknięcia, spodziewaj się wiadomości.</li>
    <li><strong>Bez struktury folderów.</strong> Wiele osób rozpakowuje wszystko do jednego katalogu. Jeśli twoje pliki różniły się tylko nazwą folderu, teraz się nie różnią.</li>
    <li><strong>Bez twoich czcionek.</strong> Czyjeś urządzenie to jedyny prawdziwy test osadzonych czcionek, a kosztuje jedną wiadomość do znajomego.</li>
  </ul>

  <h2>2. Nazywaj pliki, nie foldery</h2>

  <p>Każda nazwa pliku ma mieć sens poza kontekstem, pół roku później, w katalogu pobranych z czterystoma innymi rzeczami. Czyli: produkt, wariant i nic więcej.</p>

  <p>Dobrze: <code>weekly-planner-A4-portrait.pdf</code>. Źle: <code>final_v3.pdf</code>, <code>Untitled-1.pdf</code> albo nazwa z twoimi wewnętrznymi numerami rewizji. Unikaj znaków, które źle się zachowują między systemami, trzymaj małe litery i myślniki zamiast spacji. Nasza notka o <a href="/pl/blog/pdf-naming-conventions-best-practices/">nazewnictwie plików</a> jest napisana o dokumentach, ale zasady są identyczne.</p>

  <h2>3. Włóż do środka dwie dodatkowe strony</h2>

  <p>Dwie strony, które nic cię nie kosztują i eliminują większość wiadomości do obsługi:</p>

  <ul>
    <li><strong>Strona licencji.</strong> Prostym językiem, jedna strona: co kupującemu wolno, czego nie, czy użycie komercyjne jest w cenie i jak się z tobą skontaktować. Nasza notka o tym, <a href="/pl/blog/stop-buyers-editing-reselling-your-pdf/">co naprawdę daje ochrona pliku</a>, wyjaśnia, dlaczego ta strona robi więcej roboty niż jakikolwiek środek techniczny.</li>
    <li><strong>Jedna strona jak drukować.</strong> Drukuj w 100 procentach, rozmiar rzeczywisty, skalowanie wyłączone. Jaki papier. Które strony są opcjonalne. Ta jedna strona usuwa najczęstszą skargę, czyli poprawny plik wydrukowany w złej skali.</li>
  </ul>

  <p>Obie trzymaj krótkie. Dziesięciostronicowy regulamin w planerze za pięć dolarów czyta się jak ostrzeżenie.</p>

  <h2>4. Sprawdź, czy oferta mówi prawdę</h2>

  <p>Przeczytaj swój opis jak przeciwnik. Każda liczba i każdy rzeczownik w nim to obietnica:</p>

  <table>
    <thead>
      <tr><th>Jeśli w ofercie stoi</th><th>Sprawdź</th></tr>
    </thead>
    <tbody>
      <tr><td>„12 stron”</td><td>Otwórz plik i policz. Okładka i strona licencji zmieniają liczbę</td></tr>
      <tr><td>„A4 i US Letter w zestawie”</td><td>Oba pliki naprawdę są w archiwum i oba mają format, który deklarują</td></tr>
      <tr><td>„Edytowalny”</td><td>Edytowalny w narzędziu, które ma kupujący, nie tylko w twoim</td></tr>
      <tr><td>„Natychmiastowe pobranie”</td><td>Platforma faktycznie dostarcza natychmiast dla tego typu oferty</td></tr>
      <tr><td>„Użycie komercyjne dozwolone”</td><td>Strona licencji w pliku mówi to samo</td></tr>
      <tr><td>„300 dpi”</td><td>Grafiki naprawdę takie są, w docelowym rozmiarze druku</td></tr>
    </tbody>
  </table>

  <p>Ostatni wiersz wart jest chwili. Deklarowanie 300 dpi, gdy źródło zostało rozciągnięte, to ten rodzaj konkretnej i sprawdzalnej obietnicy, która daje najbardziej wściekłe opinie, bo kupujący może to zweryfikować, a ty nie możesz się spierać.</p>

  <h2>5. Nadaj plikowi wersję, po cichu</h2>

  <p>Umieść mały znacznik wersji gdzieś niepozornie: w metadanych pliku albo drobnym stopniem na stronie licencji. Nie w nazwie pliku, gdzie wygląda na nieskończone.</p>

  <p>Znajdziesz błąd po pięćdziesiątej sprzedaży. I wtedy numer wersji powie ci, czy skarżący się kupujący ma stary plik, pozwoli wyjaśnić, co się zmieniło, i oszczędzi zastanawiania się, która kopia leży u ciebie na dysku. To trzydzieści sekund pracy, które opłacają się dokładnie raz i drogo.</p>

  <h2>6. Zrób ostatnie przejście mechaniczne</h2>

  <p>Krótko, i każdy punkt coś realnie łapie:</p>

  <ul>
    <li><strong>Spłaszcz to, co oddajesz.</strong> <a href="/pl/pdf-edit/flatten/">Spłaszczanie</a> usuwa warstwy i przypadkowe pola formularzy, które kupujący może przesunąć, i przyspiesza otwieranie. Pomiń tylko wtedy, gdy produkt ma być wypełniany.</li>
    <li><strong>Sprawdź kolejność stron i numerację.</strong> Jeśli to zestaw wielostronicowy, <a href="/pl/pdf-edit/add-page-numbers/">numeracja</a> idzie na końcu, po ustaleniu kolejności.</li>
    <li><strong>Porównaj wagę z limitem platformy</strong> na plik, nie na zestaw, i <a href="/pl/pdf-organize/compress/">kompresuj</a> tylko wtedy, gdy musisz.</li>
    <li><strong>Usuń metadane, których nie zamierzałeś wysyłać.</strong> Pola autora i nazwy programu z eksportu często noszą twoje prawdziwe imię albo nazwę projektu obcego klienta.</li>
    <li><strong>Otwórz jeszcze raz, w całości.</strong> Nie przewijając. Pustą stronę na pozycji siódmej łatwiej znaleźć teraz niż w opinii.</li>
  </ul>

  <h2>7. Po pierwszych sprzedażach</h2>

  <p>Publikacja to nie koniec kontroli. Dwie rzeczy warte zrobienia w pierwszym tygodniu:</p>

  <ul>
    <li><strong>Kup własny produkt</strong>, jeśli platforma pozwala, albo poproś kogoś. Pełna droga od płatności do otwartego pliku to jedyny test obejmujący zachowanie samej platformy, którego nie kontrolujesz i które się zmienia.</li>
    <li><strong>Czytaj pierwsze pytania jak raporty błędów.</strong> Pierwsze trzy wiadomości od kupujących dokładnie powiedzą, która część opisu albo instrukcji jest niejasna. Popraw ofertę, nie odpowiadaj na to samo pytanie na zawsze.</li>
  </ul>

  <h2>Cała brama w jednej tabeli</h2>

  <table>
    <thead>
      <tr><th>Kontrola</th><th>Co łapie</th></tr>
    </thead>
    <tbody>
      <tr><td>Otworzyć dostarczony zestaw na telefonie</td><td>Tarcie archiwum, nieotwieralne pliki, brakujące części</td></tr>
      <tr><td>Rozpakować wszystko do jednego folderu</td><td>Nazwy plików, które działały tylko wewnątrz folderów</td></tr>
      <tr><td>Otworzyć na urządzeniu bez twoich czcionek</td><td>Nieosadzone czcionki, rozjechany układ</td></tr>
      <tr><td>Strona licencji i instrukcja druku w środku</td><td>Większość wiadomości do obsługi i sporów o licencję</td></tr>
      <tr><td>Każda obietnica oferty sprawdzona z plikiem</td><td>Opinie, z którymi nie da się spierać</td></tr>
      <tr><td>Znacznik wersji zapisany</td><td>Niewiedzę, którą kopię ma kupujący</td></tr>
      <tr><td>Spłaszczone, uporządkowane, ponumerowane, w limicie wagi</td><td>Przypadkowe zmiany, odrzucone wysłanie</td></tr>
      <tr><td>Metadane wyczyszczone</td><td>Wysłanie prawdziwego imienia albo nazwy projektu klienta</td></tr>
      <tr><td>Plik przeczytany od początku do końca</td><td>Pustą stronę, duplikat, literówkę w tytule</td></tr>
    </tbody>
  </table>

  <h2>Co dzieje się z plikiem, który wysyłasz</h2>

  <p>Nasze narzędzia działają na serwerze, więc plik jest wysyłany. Zostaje usunięty zaraz po zakończeniu zadania, a link do pobrania należy tylko do ciebie. Nic nie jest indeksowane, przechowywane ani używane do trenowania. Przy niewydanym produkcie nasza notka o tym, <a href="/pl/blog/is-convertica-safe-pdf-file-security-privacy-explained/">jak Convertica obchodzi się z plikami</a>, opisuje zasady przechowywania.</p>

  <h2>Częste pytania</h2>

  <h3>Ile to powinno zająć?</h3>
  <p>Dwadzieścia minut przy produkcie z jednego pliku, bliżej godziny przy zestawie z kilkoma formatami. To naprawdę najtańsze dwadzieścia minut w całym procesie, bo każdy punkt listy kosztuje wielokrotność tego, gdy poprawia się po publikacji.</p>

  <h3>Czy tania grafika do druku naprawdę potrzebuje strony licencji?</h3>
  <p>Tak, i tym bardziej tania. Niedrogie produkty kupuje się od ręki i używa ponownie od ręki, głównie ludzie niepewni, co im wolno. Jedna strona prostego języka usuwa tę niepewność, i to ten dokument, na który wskażesz, jeśli kiedyś trzeba będzie zgłosić kopię.</p>

  <h3>Czy numer wersji ma być widoczny dla kupujących?</h3>
  <p>Ledwo. Drobnym stopniem na stronie licencji albo w metadanych pliku to właściwie. Wersja w nazwie pliku albo na okładce robi z gotowego produktu roboczą wersję i zaprasza pytania, co było nie tak z pierwszą.</p>

  <h3>Co zrobić, gdy znajdę błąd już po sprzedaży?</h3>
  <p>Poprawić plik, podnieść wersję, podmienić na platformie i napisać do kupujących, jeśli błąd wpływa na użycie, a nie tylko na wygląd. Większość platform pozwala zaktualizować plik cyfrowy na miejscu, a kupujący, którzy bez pytania dostają poprawioną wersję, wystawiają lepsze opinie niż ci, którzy problemu nigdy nie widzieli.</p>

  <h3>Warto kupić własny produkt?</h3>
  <p>Raz na typ produktu tak. Nie testujesz swojego pliku, testujesz platformę: mail z potwierdzeniem, wygaśnięcie linku, czy plik przychodzi z nazwą, którą mu dałeś. Ta droga psuje się w sposób, którego nigdy nie zobaczysz z panelu sprzedawcy.</p>

  <h3>Ile czyścić w metadanych?</h3>
  <p>Autora, tytuł i wszelkie pola programu albo szablonu. Eksport często nosi nazwę szablonu, który kupiłeś, nazwę projektu poprzedniego klienta albo twoje prawdziwe imię, gdy sprzedajesz pod nazwą sklepu. Nic z tego ci nie pomaga, a jedno potrafi naprawdę zawstydzić.</p>

  <h2>Przejdź bramę</h2>

  <p>Weź produkt, który zamierzałeś opublikować, i zrób punkty od jednego do sześciu teraz, po kolei. Większość plików potrzebuje <a href="/pl/pdf-edit/flatten/">spłaszczenia</a> i niczego więcej; pracy wymaga zwykle zestaw i oferta. Jeśli twój produkt to wnętrze książki, a nie plik do druku, wymagania są inne i surowsze: zobacz <a href="/pl/blog/low-content-book-interior-pdf-requirements/">jak musi wyglądać wnętrze książki low-content</a>. Reszta jest we <a href="/pl/all-tools/">wszystkich narzędziach</a>.</p>
