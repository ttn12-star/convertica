content_pl: |
  Ten problem ma dwie wersje o przeciwnych przyczynach, więc najpierw ustal, którą masz.

  W pierwszej archiwum otwiera się od razu i o nic nie pyta, choć masz pewność, że ustawiłeś hasło. W drugiej pyta, wpisujesz hasło, którego jesteś pewien, i dostajesz odmowę.

  Żadna z nich to nie pech. Obie mają proste wyjaśnienie.

  <h2>Wersja pierwsza: archiwum nigdy nie pyta o hasło</h2>

  <p>Ta jest częstsza, a odpowiedź niemal zawsze brzmi tak samo: plik nigdy nie został zaszyfrowany. Coś go spakowało i po cichu pominęło krok z hasłem.</p>

  <p>Zwykłym winowajcą jest Eksplorator Windows. Prawy przycisk, Wyślij do, Folder skompresowany to droga, którą wybiera większość, a powstaje z niej zwykły plik ZIP bez żadnej opcji szyfrowania w całym procesie. Eksplorator potrafi <em>czytać</em> zaszyfrowane archiwum zrobione przez kogoś innego i przy otwieraniu poprosi o hasło. Nie potrafi ich <em>tworzyć</em>. Ta asymetria właśnie najbardziej myli: skoro otwierałeś już na tym komputerze chronione archiwa, zakładasz, że funkcja tam jest.</p>

  <p>Nie ma jej i nigdy nie było. Windows obsługuje ZIP od czasów XP i przez te wszystkie lata nie dołożył do tego szyfrowania. Jeśli korzystałeś tylko z wbudowanego menu, twoje archiwum nie ma hasła, cokolwiek wpisywałeś.</p>

  <p>Jest stara sztuczka, którą wielu pamięta: ustawienie hasła z poziomu widoku folderu skompresowanego. Istniała w Windows XP, potem ją usunięto i nie wróciła.</p>

  <p>Rozwiązaniem jest użycie czegoś, co naprawdę szyfruje: osobnego programu albo <a href="/pl/archive/protect/">narzędzia do zabezpieczania ZIP</a>, które nakłada prawdziwe hasło i stosuje AES-256 zamiast przestarzałego schematu.</p>

  <h3>Jak potwierdzić, że archiwum jest zaszyfrowane</h3>

  <p>Dwa szybkie sprawdzenia:</p>

  <ul>
    <li>Otwórz je czymś, co obsługuje szyfrowanie, na przykład 7-Zipem na Windowsie. Jeśli wypisze zawartość i rozpakuje bez pytania, hasła nie ma.</li>
    <li>Nie patrz na rozmiar pliku. Szyfrowanie prawie go nie zmienia, więc ten trop nic nie mówi.</li>
  </ul>

  <p>Wiarygodnym sygnałem jest zachowanie, nie wygląd. Zaszyfrowany ZIP pyta, zanim rozpakuje.</p>

  <h2>Wersja druga: hasło zostaje odrzucone</h2>

  <p>Tutaj archiwum naprawdę jest zaszyfrowane, a coś w samej próbie jest nie tak. Trzy przyczyny pokrywają prawie wszystkie przypadki.</p>

  <h3>Przyczyna A: program nie rozumie szyfrowania</h3>

  <p>ZIP ma dwa różne schematy szyfrowania pod jednym słowem «hasło».</p>

  <p><strong>ZipCrypto</strong> to pierwotny schemat z 1989 roku. Obsługuje go wszystko i jest na tyle słaby, że łamie się szybko atakiem ze znanym tekstem jawnym. <strong>AES-256</strong> pojawił się później, jest naprawdę mocny i nie wszędzie bywa obsługiwany.</p>

  <p>W tej właśnie szczelinie mieszkają awarie. Archiwum zaszyfrowane AES-256, otwierane starym programem albo mobilnym menedżerem plików znającym tylko dawny schemat, potrafi zwrócić błąd złego hasła przy haśle całkowicie poprawnym. Program nie mówi ci, że hasło jest złe. Mówi, że nie potrafi odszyfrować, a komunikat po prostu wprowadza w błąd.</p>

  <p>Jeśli na to trafisz, spróbuj 7-Zipa na Windowsie albo Keki na macOS. Oba radzą sobie z AES-256. Jeśli to samo hasło tam zadziała, masz odpowiedź.</p>

  <h3>Przyczyna B: hasło nie jest tym, co myślisz, że wpisujesz</h3>

  <p>Mniej egzotyczne, a częstsze, niż ludzie przypuszczają:</p>

  <ul>
    <li><strong>Układ klawiatury.</strong> Hasło ustawione na układzie rosyjskim, polskim czy arabskim i przepisane na innym daje inne znaki z tych samych klawiszy. Wpisz je najpierw w zwykłe pole tekstowe i spójrz.</li>
    <li><strong>Znaki spoza ASCII.</strong> Litery z ogonkami i wszystko poza podstawową łaciną bywa kodowane inaczej przez różne programy. Hasło z ż albo é potrafi działać wyłącznie w programie, który zrobił archiwum.</li>
    <li><strong>Spacja na końcu.</strong> Przy kopiowaniu hasła z czatu albo maila łapie się wyjątkowo łatwo. I liczy się.</li>
    <li><strong>Podobne znaki.</strong> Wielkie i, małe el oraz jedynka wyglądają w wielu krojach tak samo, podobnie jak zero i wielkie O.</li>
  </ul>

  <p>Gdzie się da, wklejaj zamiast pisać, i wklej najpierw w widoczne pole, żeby zobaczyć, co dokładnie masz.</p>

  <h3>Przyczyna C: archiwum jest uszkodzone</h3>

  <p>ZIP ucięty przez przerwane pobieranie albo bramkę pocztową potrafi zawieść jako błąd hasła, a nie jako błąd integralności. Jeśli plik przyszedł mailem lub komunikatorem, pobierz go ponownie ze źródła i porównaj rozmiary, zanim cokolwiek orzekniesz o haśle.</p>

  <h2>Dlaczego w jednych archiwach widać nazwy plików, a w innych nie</h2>

  <p>To myli tych, którzy oczekują, że szyfrowanie działa na zasadzie wszystko albo nic. ZIP ma dwa poziomy:</p>

  <ul>
    <li><strong>Zawartość zaszyfrowana, nazwy widoczne.</strong> Tak jest domyślnie niemal wszędzie. Każdy może otworzyć archiwum i przeczytać listę plików z nazwami i rozmiarami. Rozpakować nie może. Wycieka przy tym więcej, niż się sądzi: <code>wynagrodzenia-2026-final.xlsx</code> opowiada historię sam z siebie.</li>
    <li><strong>Nazwy też zaszyfrowane.</strong> Opcja w części programów, opisywana zwykle jako szyfrowanie nazw plików albo nagłówka. Takie archiwum nie pokazuje niczego, dopóki nie podasz hasła.</li>
  </ul>

  <p>Jeśli otworzysz archiwum i zobaczysz listę bez żadnego pytania, to jeszcze nie dowód, że zawartość jest niechroniona. Spróbuj rozpakować jeden plik. Wtedy pojawi się pytanie.</p>

  <h2>System po systemie</h2>

  <ul>
    <li><strong>Windows.</strong> Eksplorator czyta zaszyfrowane archiwa i nigdy ich nie tworzy. Do zrobienia takiego potrzebny jest osobny program albo narzędzie online. Do pewnego otwarcia archiwum AES-256 użyj 7-Zipa, nie Eksploratora.</li>
    <li><strong>macOS.</strong> Narzędzie archiwizacji w Finderze też pakuje bez szyfrowania. Polecenie <code>zip -e</code> w Terminalu szyfruje, ale słabym, dawnym schematem. Do AES potrzebny jest program zewnętrzny.</li>
    <li><strong>Android.</strong> Wszystko zależy od menedżera plików. Wiele obsługuje tylko ZipCrypto, i stąd bierze się częsty fałszywy błąd hasła.</li>
    <li><strong>iOS.</strong> Wbudowana aplikacja Pliki pakuje i rozpakowuje, ale nie tworzy zaszyfrowanych archiwów. Do tego trzeba aplikacji.</li>
  </ul>

  <h2>Jeśli hasło naprawdę przepadło</h2>

  <p>Tu warto powiedzieć wprost. Dla archiwum z AES-256 i sensownym hasłem odzyskiwanie nie istnieje. O to właśnie chodzi w szyfrowaniu. Programy obiecujące natychmiastowe odzyskanie albo zgadują ze słownika, co działa tylko przy słabych hasłach, albo biją w dawny ZipCrypto, gdzie rzeczywiście istnieje słabość kryptograficzna.</p>

  <p>Zanim więc wydasz pieniądze na program do odzyskiwania, ustal, jakiego schematu używa twoje archiwum. Jeśli to AES, żaden produkt nie pomoże, a uczciwa odpowiedź brzmi: wróć do osoby, która utworzyła plik.</p>

  <p>Jeśli archiwum jest twoje i chcesz tylko zmienić albo zdjąć hasło, <a href="/pl/archive/unlock/">narzędzie do odblokowania ZIP</a> przyjmuje archiwum i bieżące hasło, a oddaje zwykły plik.</p>

  <h2>Częste pytania</h2>

  <h3>Dlaczego nie mogę ustawić hasła do pliku ZIP w Windows 10 lub 11?</h3>
  <p>Bo Windows nigdy nie miał takiej funkcji. Wbudowana kompresja tworzy wyłącznie zwykłe archiwa. Otwierać zaszyfrowane, zrobione gdzie indziej, potrafi, i stąd przekonanie, że potrafi je też tworzyć.</p>

  <h3>Mój ZIP otwiera się bez pytania o hasło, które ustawiłem.</h3>
  <p>Hasło nie zostało zastosowane. To, czym spakowałeś folder, pominęło szyfrowanie, niemal na pewno menu prawego przycisku w Windowsie. Utwórz archiwum ponownie czymś, co szyfruje.</p>

  <h3>7-Zip mówi, że hasło jest błędne, a jestem pewien, że dobre.</h3>
  <p>Sprawdź je znak po znaku w zwykłym polu tekstowym, uważając na spację na końcu i na układ klawiatury. Jeśli na pewno jest poprawne, archiwum może być uszkodzone, więc pobierz je jeszcze raz.</p>

  <h3>Czy ZIP z hasłem jest naprawdę bezpieczny?</h3>
  <p>To zależy od schematu. AES-256 jest mocny. Dawny ZipCrypto nie i łamie się szybko, gdy atakujący zna część zawartości. Jeśli archiwum ma znaczenie, upewnij się, że używa AES.</p>

  <h3>Nazwy plików widać bez hasła. Czy to w ogóle jest zaszyfrowane?</h3>
  <p>Prawdopodobnie tak, na zwykłym poziomie, gdzie zawartość jest zaszyfrowana, a lista nie. Spróbuj rozpakować plik i zobacz, czy zapyta. Jeśli nazwy też mają być ukryte, użyj narzędzia szyfrującego nazwy plików.</p>

  <h3>Czy otworzę zaszyfrowany ZIP na telefonie?</h3>
  <p>Czasem. Wiele mobilnych menedżerów obsługuje tylko dawny schemat, więc archiwum AES kończy się mylącym błędem hasła. Aplikacja z wyraźnie zadeklarowanym AES albo rozpakowanie na komputerze rozwiązuje sprawę.</p>

  <h2>Zrób takie, które zadziała za pierwszym razem</h2>

  <p>Jeśli wysyłasz coś, co wymaga hasła, wbudowaną kompresję omiń szerokim łukiem. <a href="/pl/archive/protect/">Narzędzie do zabezpieczania ZIP</a> szyfruje AES-256 w przeglądarce, więc odbiorca dostanie archiwum, które naprawdę pyta o hasło, a <a href="/pl/archive/unlock/">odblokowanie ZIP</a> zdejmie hasło z archiwum, które już masz. Jeśli chodzi o jeden obraz, a nie o folder, <a href="/pl/image/password-protect-image/">zabezpieczenie obrazu hasłem</a> robi to wprost.</p>
