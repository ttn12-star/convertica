  <p>Jedno przejście zajmuje dziesięć minut. To samo przejście po prośbie o zwrot zajmuje dziesięć minut plus opinię, której już nie usuniesz.</p>

  <h2>Co dzieje się z plikiem, który wysyłasz</h2>

  <p>Nasze narzędzia działają na serwerze, więc plik jest wysyłany. Zostaje usunięty zaraz po zakończeniu zadania, a link do pobrania należy tylko do ciebie. Nic nie jest indeksowane, przechowywane ani używane do trenowania. Przy niewydanych jeszcze produktach części sprzedawców to i tak nie uspokaja, i to zrozumiałe: nasza notka o tym, <a href="/pl/blog/is-convertica-safe-pdf-file-security-privacy-explained/">jak Convertica obchodzi się z plikami</a>, opisuje zasady przechowywania, żeby można było zdecydować samemu.</p>

  <h2>Częste pytania</h2>

  <h3>Sprzedawać w A4 czy w US Letter?</h3>
  <p>Jeśli możesz, wysyłaj oba i wyraźnie je podpisz wewnątrz pobrania. Jeśli musisz wybrać, kieruj się źródłem ruchu: A4 dla większości świata, US Letter dla sklepu nastawionego na Stany i Kanadę. Czego nie wolno, to wysłać jeden format i o tym zamilczeć, bo to zamienia się w prośbę o zwrot od tej połowy świata, która trzyma w ręku drugi papier.</p>

  <h3>Czy plik do druku potrzebuje spadów?</h3>
  <p>Do druku domowego nie, a dodanie spadów zwykle pogarsza sprawę: projekt ze spadami zakłada obcięcie po druku, a kupujący nie ma gilotyny. Zamiast tego projektuj do formatu z bezpiecznym marginesem. Spady mają sens tylko wtedy, gdy sprzedajesz osobno wersję do drukarni, i wtedy to osobny plik.</p>

  <h3>Czy mogę zablokować odsprzedaż mojego PDF?</h3>
  <p>Technicznie nie. Każdy plik, który kupujący może otworzyć i wydrukować, da się skopiować. Uprawnienia i hasła zatrzymują tylko przypadkową edycję. Działa nudne połączenie: strona z licencją w środku pliku, mówiąca co kupującemu wolno i czego nie, plus proces zgłaszania naruszeń platformy, kiedy znajdziesz kopię.</p>

  <h3>Planer ma 45 MB. Co ciąć pierwsze?</h3>
  <p>Szukać grafik. Podkładka na całą stronę, tekstura papieru albo fotograficzna okładka prawie zawsze wyjaśniają całą wagę, a zamiana tekstury na płaski kolor albo delikatny wzór wektorowy potrafi zmniejszyć plik o rząd wielkości. Kompresja dopiero potem, i ze sprawdzeniem wydrukowanej strony.</p>

  <h3>Wysyłać jeden PDF czy ZIP?</h3>
  <p>Jeden PDF, jeśli produkt to jedna rzecz w jednym formacie: każdy dodatkowy krok gubi kupujących, którzy otwierają pobranie na telefonie. ZIP, jak tylko pojawia się kilka formatów albo wersji kolorystycznych, bo trzyma cię w limicie pięciu plików i porządkuje nazwy. Jeśli składasz zestaw, nazwij pliki tak, żeby były zrozumiałe bez kontekstu: nasza notka o <a href="/pl/blog/pdf-naming-conventions-best-practices/">nazewnictwie plików</a> jest napisana o dokumentach, ale pasuje jeden do jednego.</p>

  <h3>Czy spłaszczanie obniża jakość druku?</h3>
  <p>Nie. Spłaszczanie scala warstwy i elementy interaktywne w statyczną treść strony; nie przelicza grafik i nie zmienia rozdzielczości. Jakość może kosztować kompresja, ale to osobna decyzja.</p>

  <h2>Przygotuj plik</h2>

  <p>Weź produkt, który jest najbliżej publikacji, i przejdź po ośmiu punktach teraz, przed pisaniem opisu. Większość plików potrzebuje dwóch poprawek: <a href="/pl/pdf-edit/flatten/">spłaszczyć</a> i, przy zestawach wielostronicowych, <a href="/pl/pdf-edit/add-page-numbers/">dodać numery stron</a>. Kompresuj tylko wtedy, gdy platforma cię zmusza, przez <a href="/pl/pdf-organize/compress/">kompresję PDF</a>, i z wydrukowaną stroną przed oczami. Reszta jest we <a href="/pl/all-tools/">wszystkich narzędziach</a>.</p>
