content_pl: |
  Plik do druku, za który ktoś żąda zwrotu, prawie nigdy nie jest brzydki. Na ekranie projekt był w porządku. Stało się coś innego: kupujący otworzył go na laptopie z Windowsem i elegancka czcionka zamieniła się w Times New Roman. Albo wydrukował i ramka została ścięta z dwóch stron. Albo grafika, która w przeglądarce wyglądała ostro, wyszła z atramentówki miękka i rozpikselowana. Albo Etsy po prostu odmówiło przyjęcia pliku, bo miał 34 MB.

  Wynika z tego, że praca, która naprawdę chroni ocenę sklepu, zaczyna się po skończeniu projektu. Jest nudna: format strony, rozdzielczość, marginesy, czcionki, waga. Każda z tych rzeczy zawodzi w konkretny sposób i każdą sprawdza się w dwie minuty. Poniżej idą w kolejności, w jakiej zwykle się psują.

  <h2>Co kupujący naprawdę robi z twoim plikiem</h2>

  <p>Wszystkie wymagania poniżej wynikają z tego samego, więc warto wyobrazić sobie konkretnie osobę po drugiej stronie. Twój kupujący nie jest drukarnią. On:</p>

  <ul>
    <li><strong>Drukuje w domu</strong>, na atramentówce albo taniej laserówce, która fizycznie nie umie zadrukować krawędzi kartki.</li>
    <li><strong>Bierze papier, który sprzedaje się w jego kraju.</strong> A4 prawie wszędzie, US Letter w Stanach i Kanadzie. To inne proporcje, nie tylko inny rozmiar.</li>
    <li><strong>Otwiera plik w tym, co ma pod ręką</strong>, a to coraz częściej telefon albo tablet i czytnik PDF, który nie jest Acrobatem.</li>
    <li><strong>Nie napisze do ciebie o problemie.</strong> Poprosi o zwrot albo wystawi opinię, a jedno i drugie kosztuje więcej niż sama sprzedaż.</li>
  </ul>

  <p>PDF jest do tego wszystkiego właściwym formatem, bo nosi swój układ w sobie. To jest jednocześnie pułapka: nosi dokładnie ten układ, który mu dałeś, razem z fragmentami, które działały tylko na twojej maszynie.</p>

  <h2>Format strony: proporcje wybiera się przed wszystkim innym</h2>

  <p>A4 to 210 na 297 mm. US Letter to 216 na 279 mm. Letter jest szerszy i krótszy. Żaden współczynnik skali nie zamieni jednego w drugi, dlatego rada „wydrukuj z dopasowaniem do kartki” daje planer z nierównymi białymi pasami i plakat z obciętymi krawędziami.</p>

  <p>Uczciwe opcje są dwie: wybrać jeden format i wyraźnie o tym napisać w ofercie, albo wysyłać oba. Większość działających sklepów wysyła oba, bo sklep tylko z A4 cicho traci amerykański ruch, a sklep tylko z Letter traci wszystkich pozostałych.</p>

  <p>Wysyłanie obu oznacza wyeksportowanie dwóch plików z programu graficznego. Nie próbuj wyprodukować drugiego formatu przez kadrowanie albo skalowanie gotowego PDF: kadrowanie przycina stronę do mniejszego prostokąta, więc dostaniesz okno w proporcjach Letter na projekt A4, w którym brakuje treści u dołu. Nasze <a href="/pl/pdf-edit/crop/">kadrowanie PDF</a> służy do usuwania zbędnych marginesów w dokumencie, a nie do przeliczania jednego standardu papieru na drugi. Wyeksportowanie dwóch plików z programu graficznego pozostaje najlepszą opcją, bo tylko plik źródłowy potrafi naprawdę złamać się na nowo pod inne proporcje. Kiedy nie masz już tego pliku albo kupiłeś gotowy szablon, <a href="/pl/pdf-edit/page-size/">zmiana rozmiaru strony PDF</a> robi rzecz drugą co do jakości: przenosi strony na inny arkusz i, ponieważ A4 traci na Letter 8,8 mm z góry i z dołu, zachowuje pełny rozmiar, gdy twoje marginesy na to pozwalają, a zmniejsza dokładnie tyle, gdy nie pozwalają. Nigdy nie obcina. To też praktyczny powód, żeby trzymać opisany niżej margines 10–12 mm.</p>

  <h2>300 dpi, czyli dlaczego ekran cię oszukuje</h2>

  <p>Ekran ma około 100 pikseli na cal. Papier rozdziela szczegół około trzy razy drobniejszy. Dlatego grafika, która przy pełnym powiększeniu w przeglądarce wygląda idealnie ostro, na papierze może wyjść wyraźnie miękka, i nie ma sposobu, żeby zauważyć to na monitorze.</p>

  <p>Zasada brzmi: 300 dpi w docelowym rozmiarze druku. W praktyce:</p>

  <ul>
    <li><strong>Plakat 20 na 25 cm</strong> potrzebuje źródła około 2400 na 3000 pikseli. Jeśli oryginał ma 1000 pikseli szerokości, żadne ustawienie eksportu go nie uratuje.</li>
    <li><strong>Tekst i kształty się nie liczą.</strong> Krój pisma, linie i ilustracja wektorowa w PDF są niezależne od rozdzielczości i drukują się tak dobrze, jak umie drukarka. Planer zbudowany wyłącznie z tekstu i linii zawsze wyjdzie ostry.</li>
    <li><strong>Ryzykuje tylko raster.</strong> Zdjęcia, tekstury, elementy akwarelowe, zeskanowane napisy i wszystko, co znalazłeś jako JPG albo PNG.</li>
  </ul>

  <p>Jeśli składasz projekt w edytorze przeglądarkowym, eksportuj w najwyższej dostępnej jakości, a nie w domyślnej: domyślna jest zwykle ustawiona pod udostępnianie na ekranie.</p>

  <h2>Niezadrukowywalna krawędź i margines, który wymusza</h2>

  <p>Domowa drukarka trzyma kartkę rolkami, żeby ją przesuwać, więc nie może położyć tuszu na kilku ostatnich milimetrach przy krawędzi. Zależnie od modelu ta martwa strefa to około 3–6 mm z każdej strony i więcej przy krawędzi wyjściowej.</p>

  <p>Wynikają z tego dwie rzeczy, na których potyka się prawie każdy początkujący sprzedawca:</p>

  <ul>
    <li><strong>Tło na spad w domu nie działa.</strong> Projekt, w którym kolor dochodzi do krawędzi kartki, drukuje się z cienkimi białymi marginesami, i zwykle nierównymi. Jeśli projekt bez zalania do krawędzi nie ma sensu, napisz w ofercie, że plik jest przeznaczony do drukarni.</li>
    <li><strong>Wszystko ważne trzeba odsunąć do środka.</strong> Tekst, numery stron, pola do zaznaczania i linie cięcia trzymaj co najmniej 10–12 mm od krawędzi. Wszystko bliżej to na nieznanej drukarce już loteria.</li>
  </ul>

  <p>Druga połowa tego problemu siedzi w okienku druku u kupującego. Większość czytników domyślnie wybiera „dopasuj do obszaru drukowania”, co po cichu zmniejsza stronę o kilka procent i centruje ją. Przy planerze niewidoczne. Przy czymkolwiek, co kupujący będzie wycinał albo zszywał, to realny problem, więc dodaj do instrukcji jedno zdanie: drukuj w 100 procentach, rozmiar rzeczywisty, skalowanie wyłączone.</p>

  <h2>Czcionki: osadź je albo zamień na krzywe</h2>

  <p>Najczęstsza awaria pliku to czcionka, która nie weszła do PDF. Na twojej maszynie jest zainstalowana, więc plik wygląda poprawnie. Na komputerze kupującego czytnik jej nie znajduje i podstawia inną, co przelewa każdą linię od nowa i niszczy układ, nad którym siedziałeś weekend.</p>

  <p>Dwa sposoby, żeby być bezpiecznym, w kolejności preferencji:</p>

  <ul>
    <li><strong>Osadź czcionki przy eksporcie.</strong> Taka opcja jest w każdym poważnym programie, a narzędzia przeglądarkowe robią to same. Sprawdzenie jest proste: otwórz PDF i zajrzyj we właściwości dokumentu, jest tam zakładka z czcionkami, i przy każdej powinno stać „Osadzona” albo „Osadzony podzbiór”.</li>
    <li><strong>Zamień tekst na krzywe</strong> przed eksportem. Litery stają się kształtami wektorowymi, więc żadna czcionka nie jest potrzebna. Sposób jest pewny i nieodwracalny, więc trzymaj osobno plik źródłowy, który da się jeszcze edytować.</li>
  </ul>

  <p>Sprawdzaj na maszynie, na której nie ma twoich czcionek, albo poproś kogoś o otwarcie pliku. Otwarcie go na swoim komputerze nie dowodzi niczego: twój komputer to jedyne miejsce, gdzie zadziała na pewno.</p>

  <h2>Spłaszcz plik, ale nie łudź się, co to daje</h2>

  <p>Warstwy, pola formularzy, komentarze i edytowalne obiekty tekstowe to wszystko rzeczy, które kupujący może przypadkiem przesunąć, i rzeczy, które robią plik cięższym niż musi być. <a href="/pl/pdf-edit/flatten/">Spłaszczenie PDF</a> zbiera to wszystko w jedną statyczną stronę. Wynik szybciej się otwiera, przewidywalniej drukuje w dziwnych czytnikach i nie zjeżdża od przypadkowego kliknięcia.</p>

  <p>Czego spłaszczanie nie robi, to nie powstrzymuje nikogo od odsprzedaży twojej pracy. Hasło też nie. Kto może wydrukować stronę, może ją sfotografować, a PDF, który kupujący otwiera, może też zrzucić z ekranu. Spłaszczanie to higiena pliku, nie ochrona praw autorskich. Naprawdę zapobiega natomiast zwykłemu wypadkowi: kupujący przeciąga pole tekstowe, a potem pyta, dlaczego masz zepsuty plik.</p>

  <p>Jeśli chcesz dodatkowo odciąć przypadkowe zmiany, <a href="/pl/pdf-security/protect/">uprawnienia w PDF</a> umieją zabronić edycji i kopiowania, zostawiając plik otwarty do czytania i druku. Traktuj to jak próg zwalniający. W naszym omówieniu tego, <a href="/pl/blog/password-protect-pdf-before-emailing/">co naprawdę chroni hasło do PDF</a>, różnica między dwoma rodzajami hasła jest rozłożona dokładnie, a warto ją znać przed poleganiem na którymkolwiek.</p>

  <h2>Waga pliku: prawdziwym ograniczeniem jest 20 MB na Etsy</h2>

  <p>W momencie pisania Etsy przyjmuje pliki cyfrowe do 20 MB każdy, maksymalnie pięć plików na ofertę. To ta liczba, a nie twój projekt, decyduje o tym, jak składasz zestaw. Trzy praktyczne konsekwencje:</p>

  <ul>
    <li><strong>Zestaw na kilka formatów przekracza pięć plików natychmiast.</strong> Cztery formaty razy trzy wersje kolorystyczne to dwanaście plików. Standardowa odpowiedź to ZIP: archiwum zajmuje jedno miejsce z pięciu, a rozpakować je umie każdy system.</li>
    <li><strong>Ciężki planer jest ciężki z powodu grafik.</strong> PDF z samego tekstu waży tyle co nic. Jeśli planer na 40 stron ma 30 MB, robi to podkładka na całą stronę albo tekstura.</li>
    <li><strong>Kompresuj na końcu i sprawdzaj wynik na papierze.</strong> Nasz <a href="/pl/pdf-organize/compress/">kompresor PDF</a> zostawia tekst i wektory w pełnej jakości i przelicza grafiki, co jest dokładnie właściwym kompromisem dla planera tekstowego i dokładnie niewłaściwym dla plakatu fotograficznego. Przy grafice wydrukuj stronę przed i po, i popatrz. Jeśli nie da się zmieścić bez widocznej straty, lepiej podziel ofertę.</li>
  </ul>

  <p>Jeśli poszedłeś drogą archiwum i chcesz zamknąć samo pobranie, można <a href="/pl/archive/protect/">zabezpieczyć ZIP hasłem</a>, choć przy płatnym produkcie to zwykle generuje więcej wiadomości do obsługi niż zapobiega.</p>

  <h2>Produkty wielostronicowe potrzebują numerów stron</h2>

  <p>Każdy produkt, który kupujący drukuje jako zestaw, czyli planery, zeszyty ćwiczeń, paczki kart pracy, potrzebuje numeracji. Bez niej osoba, która wydrukowała 40 stron i rozsypała stos, nie ma jak go złożyć, a to staje się twoim problemem.</p>

  <p>Dodaj numery na samym końcu, kiedy kolejność stron jest już ostateczna, przez <a href="/pl/pdf-edit/add-page-numbers/">dodawanie numerów stron</a>. Trzymaj je w strefie bezpiecznej z sekcji powyżej, bo numer 5 mm od krawędzi drukarka zjada pierwszy. W <a href="/pl/blog/add-page-numbers-to-pdf/">pełnym omówieniu numeracji</a> jest o pozycji i przesunięciu początkowym, jeśli trzeba pominąć okładkę.</p>

  <h2>Podglądy do oferty, a nie sam produkt</h2>

  <p>Zdjęcia w ofercie powinny pokazywać produkt, nie będąc produktem. Wyeksportuj stronę jako obraz przez <a href="/pl/pdf-to-jpg/">PDF na JPG</a> do czystej makiety, a jeśli chcesz pokazać wewnętrzne strony płatnego zeszytu, przepuść je najpierw przez <a href="/pl/pdf-edit/add-watermark/">znak wodny</a>. Nasza notka o <a href="/pl/blog/watermark-pdf-confidential-draft/">znakach wodnych na PDF</a> omawia położenie i przezroczystość: do podglądu znak ma być czytelny, ale nie tak gęsty, żeby kupujący nie mógł ocenić projektu.</p>

  <h2>Ośmiopunktowa kontrola przed wysłaniem</h2>

