  <p>Trzy kafelki bez konta wystarczą, żeby sprawdzić, czy ten pomysł pasuje do twojej pracy. To, co Premium naprawdę dodaje, to synchronizacja: tablice i zapisane ustawienia żyją na koncie, więc tablica zbudowana przy biurku jest już gotowa na laptopie i w telefonie, te same kafelki, te same ustawienia. PDF na PDF/A to dziś jedyny konwerter, który zostaje przy Premium, u pozostałych ma plakietkę PRO. Ceny znajdziesz na <a href="/pl/pricing/">stronie cennika</a>.</p>

  <h2>Co dzieje się z twoimi plikami</h2>

  <p>Tablica nigdy nie przechowuje twoich dokumentów. Trzyma nazwy narzędzi, kolejność kafelków i ustawienia, czyli kilka kilobajtów tekstu. Szybkie konwersje wracają wprost do przeglądarki i nic nie zostaje po ich stronie. Większe pliki idą przez zadanie w tle i są usuwane po około godzinie, dokładnie tak samo jak na stronach narzędzi. Zamknij kartę i faktur już nie ma, a tablica, która je przetworzyła, czeka następnym razem.</p>

  <h2>FAQ</h2>

  <h3>Czy Workbench jest bezpłatny?</h3>
  <p>Tak, i możesz go używać bez logowania: jedna tablica, trzy kafelki, zapisane w przeglądarce. Darmowe konto podnosi to do sześciu kafelków, a Premium daje pięć tablic po dwadzieścia kafelków, synchronizowanych z kontem. Co obejmuje każdy plan, wypisuje <a href="/pl/workbench/about/">strona o Workbenchu</a>.</p>

  <h3>Które narzędzia mogą być kafelkami?</h3>
  <p>Wszystko, co przyjmuje plik i oddaje plik, dziś dwadzieścia trzy konwertery. Edytory, które potrzebują twoich decyzji na ekranie (podpis, dodawanie tekstu, przycinanie, porządkowanie, porównywanie), kafelkami nie są, bo samo upuszczenie pliku nie powie im, gdzie postawić podpis.</p>

  <h3>Jak zmienić ustawienia kafelka?</h3>
  <p>Otwórz menu kafelka i wybierz „Skonfiguruj na stronie narzędzia". Strona narzędzia otworzy się z obecnymi ustawieniami kafelka, zmieniasz to, co chcesz, i klikasz „Zapisz przepływ pracy". Kafelek używa nowych ustawień przy każdym kolejnym pliku.</p>

  <h3>Czy działa na telefonie?</h3>
  <p>Tak. Siatka układa się w jedną kolumnę, przełącznik tablic zamienia się w systemową listę telefonu, a dotknięcie kafelka otwiera wybór pliku, zwykle galerię zdjęć albo dysk w chmurze. Przeciąganie myszką jest przyjemniejsze, ale nic tutaj nie wymaga komputera.</p>

  <h3>Czy przechowujecie moje pliki?</h3>
  <p>Nie. Natychmiastowe konwersje wracają prosto do przeglądarki i nie są nigdzie zapisywane, a pliki, które muszą przejść przez kolejkę w tle, są usuwane po około godzinie. Sama tablica pamięta tylko to, jakie narzędzia wybrałeś i jak je skonfigurowałeś.</p>

  <h2>Otwórz swoją tablicę</h2>

  <p>Najszybciej zrozumieć to, budując własną. Otwórz <a href="/pl/workbench/">Workbench</a>, dodaj dwa albo trzy konwertery, z których i tak korzystasz najczęściej, i upuść plik na pierwszy z nich. Jeśli wolisz najpierw zobaczyć, jak to robi ktoś inny, jest <a href="https://youtu.be/Dcj_bE15UWQ" target="_blank" rel="noopener">dwuminutowy przewodnik na YouTube</a>, a <a href="/pl/workbench/about/">strona o Workbenchu</a> odpowiada na resztę pytań.</p>
