content_pl: |
  Niektóre konwersje wracają co tydzień. Te same faktury od dostawców, które muszą wylądować w archiwalnym PDF. Te same wyciągi bankowe, które muszą trafić do arkusza. Ta sama paczka zdjęć z telefonu, których nikt w biurze nie potrafi otworzyć.

  Każda z nich to tylko kilka kliknięć. Otwórz stronę narzędzia, poczekaj na wczytanie, wgraj plik, zaznacz tę jedną opcję, którą zaznaczasz zawsze, pobierz wynik. Zrób to osiem razy w poniedziałek rano i masz za sobą dwadzieścia minut klikania po ekranach, które znasz na pamięć.

  Workbench, czyli tablica narzędzi PDF w Convertice, zabiera tę część dnia. Narzędzia ustawiasz raz na tablicy, a potem konwersja to jedno upuszczenie pliku.

  <h2>Tablica narzędzi PDF w jednym słowie: kafelek</h2>

  <p>Tablica to siatka. Każde pole na niej to kafelek, a kafelek to jeden konwerter plus ustawienia, które dla niego zapisałeś. Upuszczasz na niego plik (albo klikasz i wybierasz plik z dysku) i konwersja rusza z tymi ustawieniami. Żadnego formularza, żadnego wybierania opcji od nowa, żadnej drugiej strony. Wynik pojawia się pod kafelkiem jako wiersz z przyciskiem pobierania, a trzy ostatnie wyniki zostają widoczne, kiedy pracujesz dalej. Możesz więc sięgnąć po plik jeszcze raz, bez powtarzania konwersji.</p>

  <p>Na jednej tablicy działa jedna konwersja naraz. To celowe: upuść trzy pliki na trzy kafelki i wrócą w kolejności, w jakiej je wysłałeś, zamiast ścigać się nawzajem.</p>

  <figure><img src="/static/images/blog/workbench-board.jpg" alt="Tablica Workbench o nazwie Księgowość z kafelkami PDF na Word, Word na PDF i PDF na Excel, jeden z nich pokazuje ukończoną konwersję z przyciskiem pobierania" width="1280" height="800" loading="lazy"></figure>

  <h2>Zbuduj pierwszą tablicę w dwie minuty</h2>

  <ol>
    <li><strong>Otwórz tablicę.</strong> Wejdź na <a href="/pl/workbench/">Workbench</a>. Nie ma nic do instalowania, a do pierwszych prób nie potrzebujesz konta. Link znajdziesz też w menu Wszystkie narzędzia, w menu konta i w stopce.</li>
    <li><strong>Kliknij „Dodaj widżet".</strong> Otworzy się lista z wyszukiwaniem, podzielona na dwie grupy. <em>Moje ustawienia</em> to przepływy pracy, które zapisałeś wcześniej na stronach narzędzi, razem z twoimi ustawieniami. <em>Konwertery</em> to wszystkie narzędzia typu plik na wejściu, plik na wyjściu, dziś dwadzieścia trzy: <a href="/pl/pdf-to-word/">PDF na Word</a> i <a href="/pl/word-to-pdf/">Word na PDF</a>, Excel i PowerPoint na PDF, PDF na HTML, tekst, Markdown, EPUB i JPG, PDF/A, HEIC na JPG, optymalizator obrazów oraz narzędzia do ikon ICO. Wpisz kilka liter i zaznacz to, czego potrzebujesz.</li>
    <li><strong>Upuść plik.</strong> Kafelek go przyjmuje, uruchamia konwersję i pokazuje wiersz z wynikiem poniżej. Duże pliki same wybierają tryb w tle, a kiedy konwersja trwa, możesz wybrać „Kontynuuj w tle" i zająć się czymś innym.</li>
    <li><strong>Pobierz.</strong> Wiersz trzyma swój przycisk pobierania, dopóki go nie zastąpisz, a dwa poprzednie zostają pod nim.</li>
    <li><strong>Naucz kafelek swoich ustawień.</strong> Otwórz menu kafelka, wybierz „Skonfiguruj na stronie narzędzia" i strona otworzy się z ustawieniami tego kafelka. Zmień, co chcesz, kliknij <strong>Zapisz przepływ pracy</strong>, a kafelek zapamięta nową wersję. Tak włącza się OCR dla PDF na Word albo przestaje się decydować o rozmiarze strony przy każdym pliku. Więcej o tej mechanice znajdziesz na stronie <a href="/pl/saved-workflows/">zapisanych przepływów pracy</a>.</li>
  </ol>

  <figure><img src="/static/images/blog/workbench-picker.jpg" alt="Lista Dodaj widżet na tablicy Workbench, przefiltrowana słowem word, z zapisanym presetem OCR w sekcji Moje ustawienia i konwerterami PDF na Word oraz Word na PDF poniżej" width="1280" height="800" loading="lazy"></figure>

  <p>Dwie rzeczy celowo nie są kafelkami. Narzędzia, w których praca dzieje się na ekranie (podpis, dodawanie tekstu, przycinanie, porządkowanie stron, porównywanie), potrzebują twoich rąk i podglądu, więc zostają na swoich stronach. A narzędzie z wyborem, którego nie da się odgadnąć, jak Konwersja obrazu pytająca o format wyjściowy, pokazuje „Skonfiguruj na stronie narzędzia" i odsyła cię tam raz.</p>

  <h2>Szablony: Office, Skany, Obrazy</h2>

  <p>Pusta tablica proponuje trzy punkty startowe, te same, które zobaczysz przy tworzeniu nowej tablicy:</p>

  <ul>
    <li><strong>Office</strong>: Word na PDF, PDF na Word, Excel na PDF, PowerPoint na PDF.</li>
    <li><strong>Skany</strong>: Obraz na tekst, PDF na tekst, PDF na Word.</li>
    <li><strong>Obrazy</strong>: HEIC na JPG, Optymalizacja obrazu, PDF na JPG.</li>
  </ul>

  <p>Wybierz jeden albo zacznij od pustej tablicy. Szablon to tylko forma na start: każdy kafelek, który utworzy, możesz przekonfigurować albo usunąć.</p>

  <h2>Kilka tablic i tryb edycji</h2>

  <p>Jedna tablica ogarnia dużo, ale praca dzieli się na różne kształty. Przełącznik w lewym górnym rogu przenosi cię między tablicami (na telefonie to zwykła lista systemowa), a menu tablicy obok pozwala ją przemianować, ustawić jako domyślną, zduplikować albo usunąć. Duplikat to najszybszy sposób na wariant: skopiuj tablicę, której ufasz, i zmień te dwa kafelki, które się różnią.</p>

  <p>Kolejność ustawia się w trybie edycji. Kliknij <strong>Edytuj</strong> na górnym pasku i każdy kafelek dostaje uchwyt do przeciągania, jego tytuł zmienia się w pole tekstowe, a obok pojawia się × do usunięcia. Poprzestawiaj kafelki tak, jak naprawdę pracujesz, zmień „PDF na Word" na „Skany faktur", żeby rozpoznać kafelek jednym spojrzeniem, i kliknij Gotowe. Poza trybem edycji menu kafelka wciąż oferuje rozmiar S, M lub L, przesunięcie w lewo i w prawo oraz usunięcie.</p>

  <figure><img src="/static/images/blog/workbench-edit.jpg" alt="Workbench w trybie edycji: każdy kafelek pokazuje uchwyt do przeciągania, edytowalne pole nazwy i czerwony przycisk usuwania, a na górnym pasku widać przycisk Gotowe" width="1280" height="800" loading="lazy"></figure>

  <h2>Trzy sposoby, w jakie ludzie z tego korzystają</h2>

  <p><strong>Księgowa.</strong> Tablica „Zamknięcie miesiąca", trzy kafelki. Faktury od dostawców lądują na kafelku <a href="/pl/pdf-to-pdfa/">PDF na PDF/A</a>, bo archiwum nie przyjmie niczego innego. Wyciągi bankowe idą na <a href="/pl/pdf-to-excel/">PDF na Excel</a>, żeby liczby dało się uzgodnić, a nie przepisywać z ekranu. Trzeci kafelek wyciąga tekst ze zeskanowanych paragonów. Dwadzieścia plików, dwadzieścia upuszczeń, zero dotkniętych ustawień.</p>

  <p><strong>Asystentka.</strong> Wszystko, co wychodzi z biura jako załącznik, przechodzi najpierw przez jedną tablicę. Wersje robocze w Wordzie i prezentacje stają się PDF-ami, żeby odbiorca zobaczył ten sam układ co autor, a zdjęcia, które handlowcy przysyłają z iPhone'ów, idą przez <a href="/pl/image/heic-to-jpg/">HEIC na JPG</a>, zanim trafią do kogokolwiek z laptopem na Windowsie. Kiedyś była z tego jedna karta przeglądarki na każdy format. Teraz jest jedna karta, otwarta przez cały dzień.</p>

  <p><strong>Nauczyciel.</strong> Materiały przychodzą jako zdjęcia stron z podręcznika, a muszą stać się tekstem, który da się edytować. Kafelek <a href="/pl/image/to-text/">obraz na tekst</a> odczytuje treść, kafelek PDF na Word bierze na siebie starsze zeskanowane karty pracy, a kafelek Word na PDF wypuszcza gotową wersję w formacie, który drukuje się tak samo na każdej szkolnej drukarce.</p>

  <h2>Bez konta, z kontem, z Premium</h2>

  <table>
    <thead>
      <tr><th>Plan</th><th>Tablice</th><th>Kafelki na tablicę</th><th>Gdzie zapisane</th></tr>
    </thead>
