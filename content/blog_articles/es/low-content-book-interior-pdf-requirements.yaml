excerpt_es: "Los servicios de impresión bajo demanda rechazan los archivos de interior por una lista de motivos sorprendentemente corta, y casi todos son mecánicos, no creativos. Un tamaño de página que no es exactamente el trim size, un medianil demasiado fino para el número de páginas, sangrado ausente o mal calculado, tipografías que nunca se incrustaron y transparencia viva. Aquí está cada uno, con los números."
