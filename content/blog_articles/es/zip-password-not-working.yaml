content_es: |
  Este problema tiene dos versiones y sus causas son opuestas, así que lo primero es averiguar cuál de las dos tienes.

  En la primera, el archivo se abre de inmediato y no pide nada, aunque estás seguro de haberle puesto contraseña. En la segunda sí pregunta, escribes una contraseña que sabes correcta, y te dice que no.

  Ninguna de las dos es mala suerte. Las dos tienen una explicación sencilla.

  <h2>Versión uno: el archivo nunca pide contraseña</h2>

  <p>Es la más frecuente, y la respuesta casi siempre es la misma: el archivo nunca se cifró. Algo lo comprimió y se saltó el paso de la contraseña sin decir nada.</p>

  <p>El culpable habitual es el Explorador de Windows. Clic derecho, Enviar a, Carpeta comprimida es el camino que toma casi todo el mundo, y produce un ZIP normal sin ninguna opción de cifrado en todo el proceso. El Explorador sí puede <em>leer</em> un ZIP cifrado hecho por otra persona, y te pedirá la contraseña al abrirlo. Lo que no puede es <em>crear</em> archivos cifrados. Esa asimetría es justo lo que confunde: ya has abierto ZIP protegidos en ese equipo, así que das por hecho que la función está ahí.</p>

  <p>No está, y nunca estuvo. Windows trae soporte de ZIP desde XP sin haberle añadido nunca el cifrado. Si solo usaste el menú integrado, tu archivo no tiene contraseña, escribieras lo que escribieras.</p>

  <p>Hay un truco viejo que mucha gente recuerda: poner la contraseña desde dentro de la vista de carpeta comprimida. Existió en Windows XP, se quitó después y no ha vuelto.</p>

  <p>La solución es usar algo que cifre de verdad: una herramienta específica o la <a href="/es/archive/protect/">herramienta para proteger ZIP</a>, que pone una contraseña real y usa AES-256 en lugar del esquema antiguo.</p>

  <h3>Cómo confirmar que el archivo está cifrado</h3>

  <p>Dos comprobaciones rápidas:</p>

  <ul>
    <li>Ábrelo con algo que admita cifrado, por ejemplo 7-Zip en Windows. Si lista el contenido y lo extrae sin preguntar, no lleva contraseña.</li>
    <li>No mires el tamaño. El cifrado apenas lo cambia, así que ese dato no dice nada.</li>
  </ul>

  <p>La señal fiable es el comportamiento, no el aspecto. Un ZIP cifrado pregunta antes de extraer.</p>

  <h2>Versión dos: la contraseña es rechazada</h2>

  <p>Aquí el archivo sí está cifrado y algo falla en el intento. Tres causas cubren casi todos los casos.</p>

  <h3>Causa A: la herramienta no entiende el cifrado</h3>

  <p>ZIP tiene dos esquemas de cifrado distintos bajo la misma palabra «contraseña».</p>

  <p><strong>ZipCrypto</strong> es el original, de 1989. Todo lo admite, y es lo bastante débil como para romperse rápido con un ataque de texto plano conocido. <strong>AES-256</strong> llegó después, es realmente sólido, y no está admitido en todas partes.</p>

  <p>En ese hueco viven los fallos. Un archivo cifrado con AES-256 abierto en una herramienta antigua, o en un gestor de archivos móvil que solo implementa el esquema antiguo, puede dar error de contraseña incorrecta aun siendo la contraseña perfecta. La herramienta no te está diciendo que la contraseña esté mal. Te está diciendo que no puede descifrar, y el mensaje simplemente engaña.</p>

  <p>Si te topas con esto, prueba 7-Zip en Windows o Keka en macOS. Ambos manejan AES-256. Si la misma contraseña funciona ahí, ya tienes la respuesta.</p>

  <h3>Causa B: la contraseña no es la que crees estar escribiendo</h3>

  <p>Menos exótico y más frecuente de lo que la gente supone:</p>

  <ul>
    <li><strong>Distribución del teclado.</strong> Una contraseña puesta con teclado ruso, polaco o árabe y reescrita en otro da caracteres distintos en las mismas teclas. Escríbela primero en un campo de texto normal y míralo.</li>
    <li><strong>Caracteres fuera del ASCII.</strong> Las letras acentuadas y todo lo que sale del latín básico se codifica distinto según la herramienta. Una contraseña con é o ż puede funcionar solo en el programa que creó el archivo.</li>
    <li><strong>Espacio final.</strong> Copiar la contraseña de un mensaje o un correo arrastra un espacio al final con muchísima facilidad. Y cuenta.</li>
    <li><strong>Caracteres parecidos.</strong> La i mayúscula, la ele minúscula y el uno se confunden en muchas tipografías, igual que el cero y la O mayúscula.</li>
  </ul>

  <p>Siempre que puedas, pega en lugar de teclear, y pega primero en un campo visible para ver exactamente qué tienes.</p>

  <h3>Causa C: el archivo está dañado</h3>

  <p>Un ZIP truncado por una descarga interrumpida o por una pasarela de correo puede fallar como error de contraseña en vez de como error de integridad. Si el archivo llegó por correo o por mensajería, descárgalo otra vez del origen y compara tamaños antes de concluir nada sobre la contraseña.</p>

  <h2>Por qué en unos archivos se ven los nombres y en otros no</h2>

  <p>Esto despista a quien espera que el cifrado sea todo o nada. ZIP ofrece dos niveles:</p>

  <ul>
    <li><strong>Contenido cifrado, nombres visibles.</strong> Es lo predeterminado casi siempre. Cualquiera puede abrir el archivo y leer la lista de ficheros, con nombres y tamaños. Extraerlos no. Eso filtra más de lo que parece: <code>salarios-2026-final.xlsx</code> ya cuenta una historia por sí solo.</li>
    <li><strong>Nombres también cifrados.</strong> Es una opción de algunas herramientas, descrita normalmente como cifrar los nombres o la cabecera. El archivo no muestra nada hasta que se da la contraseña.</li>
  </ul>

  <p>Si abres un archivo y ves la lista sin que te pregunten nada, eso no demuestra que el contenido esté desprotegido. Intenta extraer un fichero. Ahí aparece la petición.</p>

  <h2>Plataforma por plataforma</h2>

  <ul>
    <li><strong>Windows.</strong> El Explorador lee ZIP cifrados y nunca los crea. Para hacer uno necesitas una herramienta aparte o una en línea. Para abrir un archivo AES-256 con garantías, usa 7-Zip y no el Explorador.</li>
    <li><strong>macOS.</strong> La Utilidad de Archivo del Finder también comprime sin cifrar. El comando <code>zip -e</code> del Terminal sí cifra, pero con el esquema antiguo y débil. Para AES hace falta una herramienta de terceros.</li>
    <li><strong>Android.</strong> Depende por completo del gestor de archivos. Muchos manejan solo ZipCrypto, y de ahí sale a menudo el falso error de contraseña.</li>
    <li><strong>iOS.</strong> La app Archivos comprime y extrae, pero no crea archivos cifrados. Para eso necesitas una aplicación.</li>
  </ul>

  <h2>Si de verdad has perdido la contraseña</h2>

  <p>Conviene ser directo. Para un archivo con AES-256 y una contraseña razonable no hay recuperación. Ese es el objetivo del cifrado. Los programas que anuncian recuperación instantánea o bien adivinan por diccionario, lo que solo funciona con contraseñas débiles, o bien atacan el antiguo ZipCrypto, donde sí existe una debilidad criptográfica real.</p>

  <p>Así que antes de gastar dinero en software de recuperación, averigua qué esquema usa tu archivo. Si es AES, ningún producto puede ayudarte, y la respuesta honesta es volver a quien creó el fichero.</p>

  <p>Si el archivo es tuyo y solo quieres cambiar o quitar la contraseña, la <a href="/es/archive/unlock/">herramienta para desbloquear ZIP</a> toma el archivo y la contraseña actual y te devuelve uno normal.</p>

  <h2>Preguntas frecuentes</h2>

  <h3>¿Por qué no puedo poner contraseña a un ZIP en Windows 10 u 11?</h3>
  <p>Porque Windows nunca ha incluido esa función. La compresión integrada solo crea ZIP normales. Sí puede abrir archivos cifrados hechos en otro sitio, y por eso la gente supone que también puede crearlos.</p>

  <h3>Mi ZIP se abre sin pedir la contraseña que puse.</h3>
  <p>La contraseña no llegó a aplicarse. Lo que comprimió la carpeta se saltó el cifrado, casi seguro el menú del clic derecho de Windows. Vuelve a crear el archivo con algo que cifre.</p>

  <h3>7-Zip dice que la contraseña es incorrecta y estoy seguro de que no lo es.</h3>
  <p>Compruébala carácter a carácter en un campo de texto normal, atento al espacio final y a la distribución del teclado. Si es correcta con seguridad, el archivo puede estar dañado, así que descárgalo otra vez.</p>

  <h3>¿Un ZIP con contraseña es realmente seguro?</h3>
  <p>Depende del esquema. AES-256 es sólido. El antiguo ZipCrypto no, y se rompe rápido cuando el atacante conoce parte del contenido. Si el archivo importa, asegúrate de que usa AES.</p>

  <h3>Se ven los nombres sin contraseña. ¿Está cifrado siquiera?</h3>
  <p>Probablemente sí, al nivel habitual, donde el contenido va cifrado y el listado no. Intenta extraer un fichero y mira si pregunta. Si también necesitas ocultar los nombres, usa una herramienta que cifre los nombres de archivo.</p>

  <h3>¿Puedo abrir un ZIP cifrado en el móvil?</h3>
  <p>A veces. Muchos gestores móviles admiten solo el esquema antiguo, así que un archivo AES falla con un error de contraseña engañoso. Una app que indique AES explícitamente, o extraer en el ordenador, evita el problema.</p>

  <h2>Haz uno que funcione a la primera</h2>

  <p>Si vas a enviar algo que necesita contraseña, salta la compresión integrada por completo. La <a href="/es/archive/protect/">herramienta de protección ZIP</a> cifra con AES-256 en el navegador, de modo que quien lo reciba tendrá un archivo que sí pregunta, y <a href="/es/archive/unlock/">desbloquear ZIP</a> quita la contraseña de un archivo que ya tienes. Si lo tuyo es una sola imagen y no una carpeta, <a href="/es/image/password-protect-image/">proteger una imagen con contraseña</a> lo hace directamente.</p>
