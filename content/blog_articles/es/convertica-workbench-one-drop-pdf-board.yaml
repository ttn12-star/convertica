content_es: |
  Hay conversiones que vuelven cada semana. Las facturas de proveedores que tienen que acabar como PDF de archivo. Los extractos bancarios que hay que pasar a una hoja de cálculo. El lote de fotos del móvil que nadie en la oficina consigue abrir.

  Cada una son cuatro clics: abres la herramienta, subes el archivo, marcas la casilla de siempre, descargas. Ocho veces un lunes por la mañana son veinte minutos en pantallas que ya te sabes de memoria.

  El workbench PDF te quita esa parte del día. Configuras las herramientas una vez en un tablero y, a partir de ahí, convertir es soltar un archivo.

  <h2>El workbench PDF en una idea: el mosaico</h2>

  <p>Un tablero es una rejilla. Cada casilla es un mosaico, y un mosaico es un convertidor más los ajustes que guardaste para él. Sueltas un archivo encima, o lo pulsas y lo eliges a mano, y la conversión se ejecuta con esos ajustes. Sin formulario ni opciones que volver a elegir. El resultado aparece debajo como una fila con botón de descarga, y los tres últimos siguen a la vista, así que puedes recuperarlos sin convertir dos veces.</p>

  <p>En cada tablero se ejecuta una conversión a la vez, a propósito: sueltas tres archivos en tres mosaicos y vuelven en el orden en que los enviaste.</p>

  <figure><img src="/static/images/blog/workbench-board.jpg" alt="Tablero de Convertica Workbench llamado Contabilidad con mosaicos de PDF a Word, Word a PDF y PDF a Excel, uno de ellos con una conversión terminada y su botón de descarga" width="1280" height="800" loading="lazy"></figure>

  <h2>Arma tu primer tablero en dos minutos</h2>

  <ol>
    <li><strong>Abre el tablero.</strong> Entra en <a href="/es/workbench/">Workbench</a>. No hay nada que instalar y no necesitas cuenta para probarlo. También está en Todas las herramientas, tu menú de cuenta y el pie de página.</li>
    <li><strong>Pulsa «Agregar widget».</strong> Se abre una lista con buscador y dos grupos. En <em>Mis ajustes preestablecidos</em> están los flujos de trabajo que ya guardaste en las páginas de las herramientas. En <em>Convertidores</em>, todo lo que entra y sale como archivo, 23 hoy: <a href="/es/pdf-to-word/">PDF a Word</a> y <a href="/es/word-to-pdf/">Word a PDF</a>, Excel y PowerPoint a PDF, PDF a HTML, texto, Markdown, EPUB y JPG, PDF/A, HEIC a JPG, el optimizador de imágenes y las herramientas de ICO. Escribe tres letras y marca lo que te sirva.</li>
    <li><strong>Suelta un archivo.</strong> El mosaico lo recibe, lo convierte y muestra la fila del resultado debajo. Los archivos grandes pasan solos a segundo plano, y mientras algo se convierte puedes elegir «Continuar en segundo plano».</li>
    <li><strong>Descarga.</strong> La fila conserva su botón hasta que la reemplaces, y las dos anteriores, debajo.</li>
    <li><strong>Enséñale tus ajustes al mosaico.</strong> Menú del mosaico (⋯), «Configurar en la página de la herramienta», y la página se abre con los ajustes de ese mosaico. Cambia lo que necesites, pulsa <strong>Guardar flujo de trabajo</strong> y el mosaico se queda con la versión nueva. Así se activa el OCR para PDF a Word, o el tamaño de página deja de ser una decisión cada vez. Lo cuenta la página de <a href="/es/saved-workflows/">flujos de trabajo guardados</a>.</li>
  </ol>

  <figure><img src="/static/images/blog/workbench-picker.jpg" alt="Lista de «Agregar widget» en un tablero de Workbench, filtrada por la palabra word, con un ajuste guardado de OCR en Mis ajustes preestablecidos y los convertidores PDF a Word y Word a PDF debajo" width="1280" height="800" loading="lazy"></figure>

  <p>Dos cosas se quedan fuera de los mosaicos, a propósito. Las herramientas donde el trabajo ocurre en pantalla (firmar, agregar texto, recortar, organizar, comparar) necesitan tus manos y una vista previa, así que siguen en sus páginas. Y una herramienta con una decisión que nadie puede adivinar, como Convertir imagen y su formato de salida, muestra «Configurar en la página de la herramienta» y te lleva allí.</p>

  <h2>Plantillas: Office, Escaneos e Imágenes</h2>

  <p>Un tablero vacío ofrece tres puntos de partida, igual que la hoja de tablero nuevo:</p>

  <ul>
    <li><strong>Office</strong>: Word a PDF, PDF a Word, Excel a PDF, PowerPoint a PDF.</li>
    <li><strong>Escaneos</strong>: Imagen a texto, PDF a texto, PDF a Word.</li>
    <li><strong>Imágenes</strong>: HEIC a JPG, Optimizar imagen, PDF a JPG.</li>
  </ul>

  <p>Elige una o empieza en blanco. La plantilla solo adelanta camino: cada mosaico se puede reconfigurar o quitar.</p>

  <h2>Varios tableros y el modo de edición</h2>

  <p>El selector de arriba a la izquierda salta entre tableros (en el móvil es el selector nativo del teléfono), y el menú de al lado renombra, marca como predeterminado, duplica o elimina. Duplicar es el atajo para una variante: copias el que ya funciona y cambias los dos mosaicos distintos.</p>

  <p>Reordenar se hace en el modo de edición. Pulsa <strong>Editar</strong> en la barra superior y cada mosaico gana un asa para arrastrar, su título se vuelve un campo de texto y aparece una × para quitarlo. Ordénalos como trabajas de verdad, cambia «PDF a Word» por «Facturas escaneadas» y pulsa Hecho. Fuera de ese modo, el menú del mosaico ofrece Tamaño S, M o L, Mover a la izquierda, Mover a la derecha y Quitar.</p>

  <figure><img src="/static/images/blog/workbench-edit.jpg" alt="Workbench en modo de edición: cada mosaico muestra un asa para arrastrar, un campo de título editable y un botón rojo para quitarlo, con el botón Hecho en la barra superior" width="1280" height="800" loading="lazy"></figure>

  <h2>Tres formas de usarlo</h2>

  <p><strong>La contadora.</strong> Un tablero llamado Cierre de mes, tres mosaicos. Las facturas de proveedores caen en <a href="/es/pdf-to-pdfa/">PDF a PDF/A</a>, porque el archivo contable no acepta otra cosa. Los extractos bancarios caen en <a href="/es/pdf-to-excel/">PDF a Excel</a>, para conciliar las cifras en lugar de teclearlas. El tercero saca el texto de los recibos escaneados. Veinte archivos, veinte gestos, ni un ajuste tocado.</p>

  <p><strong>El asistente de dirección.</strong> Todo lo que sale como adjunto pasa antes por un tablero. Los borradores de Word y las presentaciones se vuelven PDF para que quien los reciba vea la maquetación del autor, y las fotos que el equipo comercial manda desde el móvil pasan por <a href="/es/image/heic-to-jpg/">HEIC a JPG</a> antes de llegar a un portátil con Windows. Antes era una pestaña por formato. Ahora una sola, abierta todo el día.</p>

  <p><strong>La profesora.</strong> Los materiales llegan como fotos de una página de libro y tienen que acabar en texto editable. Un mosaico de <a href="/es/image/to-text/">imagen a texto</a> hace la lectura, uno de PDF a Word se ocupa de las fichas escaneadas viejas y uno de Word a PDF devuelve la versión final, que imprime igual en cualquier impresora del colegio.</p>

  <h2>Gratis, con cuenta y Premium</h2>

  <table>
    <thead>
      <tr><th>Plan</th><th>Tableros</th><th>Mosaicos por tablero</th><th>Dónde se guardan</th></tr>
    </thead>
    <tbody>
      <tr><td>Sin cuenta</td><td>1</td><td>3</td><td>En tu navegador</td></tr>
      <tr><td>Cuenta gratuita</td><td>1</td><td>6</td><td>En tu navegador</td></tr>
      <tr><td>Premium</td><td>5</td><td>20</td><td>Sincronizados con tu cuenta</td></tr>
    </tbody>
  </table>

  <p>Con tres mosaicos y sin cuenta ya se ve si la idea encaja contigo. Lo que suma Premium es la sincronización: tableros y ajustes guardados viven en tu cuenta, así que el tablero del escritorio ya está en el portátil y en el teléfono, mismos mosaicos, mismos ajustes. PDF a PDF/A es hoy el único convertidor Premium, con una insignia PRO para el resto. Los precios están en la <a href="/es/pricing/">página de precios</a>.</p>

  <h2>Qué pasa con tus archivos</h2>

  <p>El tablero nunca guarda tus documentos. Guarda nombres de herramientas, orden de los mosaicos y ajustes: unos kilobytes de texto. Las conversiones rápidas vuelven directas a tu navegador y no se conserva nada. Los archivos grandes se procesan en segundo plano y se borran al cabo de una hora aproximadamente, igual que en las páginas de las herramientas. Cierras la pestaña y las facturas ya no están; el tablero sigue ahí.</p>

  <h2>Preguntas frecuentes</h2>

  <h3>¿Workbench es gratis?</h3>
  <p>Sí, y sin iniciar sesión: un tablero, tres mosaicos, guardados en tu navegador. Una cuenta gratuita sube a seis mosaicos, y Premium da cinco tableros de veinte mosaicos cada uno, sincronizados con tu cuenta. La <a href="/es/workbench/about/">presentación de Workbench</a> detalla cada plan.</p>

  <h3>¿Qué herramientas pueden ser mosaicos?</h3>
  <p>Todo lo que recibe un archivo y devuelve otro archivo, 23 convertidores hoy. Los editores que necesitan tu intervención en pantalla (firmar, agregar texto, recortar, organizar, comparar) no son mosaicos, porque soltar un archivo no les dice dónde va la firma.</p>

  <h3>¿Cómo cambio los ajustes de un mosaico?</h3>
  <p>Menú del mosaico, «Configurar en la página de la herramienta». La página se abre con los ajustes actuales, cambias lo que quieras y pulsas Guardar flujo de trabajo. El mosaico usa los nuevos en cada archivo que sueltes.</p>

  <h3>¿Funciona en el móvil?</h3>
  <p>Sí. La rejilla se apila en una columna, el selector de tableros pasa a ser el nativo del teléfono y, al tocar un mosaico, se abre el explorador de archivos, normalmente tu carrete o una nube. Arrastrar con el ratón es más cómodo, pero nada aquí es solo para escritorio.</p>

  <h3>¿Guardáis mis archivos?</h3>
  <p>No. Las conversiones instantáneas vuelven directas a tu navegador, y los archivos que pasan por la cola en segundo plano se borran al cabo de una hora. El tablero solo recuerda qué herramientas elegiste y cómo las configuraste.</p>

  <h2>Abre tu tablero</h2>

  <p>La forma más rápida de entenderlo es armarlo. Entra en <a href="/es/workbench/">Workbench</a>, agrega los dos o tres convertidores que más usas y suelta un archivo en el primero. Si prefieres verlo antes, hay un <a href="https://youtu.be/Dcj_bE15UWQ" target="_blank" rel="noopener">recorrido de dos minutos en YouTube</a>, y la <a href="/es/workbench/about/">página de Workbench</a> responde el resto.</p>
