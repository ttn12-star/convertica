slug: compress-pdf-for-email-under-25mb
title_hi: "PDF को ईमेल के लिए कैसे छोटा करें (25 MB से नीचे), गुणवत्ता बिगाड़े बिना"
meta_title_hi: "ईमेल के लिए PDF छोटी करें: 25 MB से नीचे, दो मिनट में"
meta_description_hi: "Gmail, Outlook और Yahoo 20 से 25 MB से बड़ी PDF लौटा देते हैं। PDF छोटी करने के तीन भरोसेमंद तरीक़े, किस्म के हिसाब से साइज़ और गुणवत्ता के नुस्ख़े।"
meta_keywords_hi: "ईमेल के लिए PDF छोटी करें, PDF का साइज़ घटाएँ, PDF ईमेल के लिए बहुत बड़ी, Gmail के लिए PDF छोटी, 25MB से कम PDF"
excerpt_hi: "Gmail अटैचमेंट पर 25 MB की हद रखता है, Outlook 20 MB की, और स्कैन किया दस पन्नों का कॉन्ट्रैक्ट दोनों हदें पार कर सकता है। उसे गुणवत्ता बिगाड़े बिना छोटा करने का सबसे तेज़ तरीक़ा।"
content_hi: |
  ईमेल सेवाएँ आज भी बड़े अटैचमेंट को 2010 की समस्या मानती हैं। Gmail 25 MB से ऊपर कुछ भी भेजने से मना कर देता है, Outlook.com 20 MB पर रोक देता है, और दफ़्तरों के ज़्यादातर मेल सर्वर इससे भी सख़्त चलते हैं। स्कैन किया बारह पन्नों का कॉन्ट्रैक्ट अक्सर इतना भारी हो जाता है कि मेल लौट आए, और लौटने का संदेश एक घंटे बाद आता है, जब आप आगे बढ़ चुके होते हैं।

  अच्छी ख़बर: सही तरीक़े से लगभग हर भारी PDF दो मिनट से कम में हद के नीचे आ जाती है। यह गाइड वे तीन तरीक़े बताती है जो असल में चलते हैं, दस्तावेज़ की किस्म के हिसाब से कितना घटने की उम्मीद रखिए, और कब ईमेल छोड़कर क्लाउड की कड़ी भेजनी चाहिए। समझाने के लिए हम Convertica का <a href="/hi/pdf-organize/compress/">मुफ़्त PDF कंप्रेसर</a> लेंगे, पर बात हर टूल पर लागू होती है।

  <figure><img src="/static/blog/images/tool-compress-hero.jpg" alt="Convertica के PDF कंप्रेसर में फ़ाइल अपलोड और सेटिंग के विकल्प" width="1280" height="800" loading="lazy"></figure>

  <h2>2026 में अटैचमेंट की असली हदें</h2>

  कुछ छोटा करने से पहले जान लीजिए कि निशाना कौन सा आँकड़ा है। बड़ी सेवाएँ अलग-अलग हदें बताती हैं, और असल छत बताई गई संख्या से नीची रहती है, क्योंकि ईमेल फ़ाइलों को भेजने का तरीक़ा ही ऐसा है।

  <table>
    <thead>
      <tr><th>सेवा</th><th>भेजने की हद</th><th>पाने की हद</th></tr>
    </thead>
    <tbody>
      <tr><td>Gmail</td><td>25 MB</td><td>50 MB</td></tr>
      <tr><td>Outlook.com</td><td>20 MB</td><td>20 MB</td></tr>
      <tr><td>Yahoo Mail</td><td>25 MB</td><td>25 MB</td></tr>
      <tr><td>iCloud Mail</td><td>20 MB</td><td>20 MB</td></tr>
      <tr><td>दफ़्तर का Exchange (आम तौर पर)</td><td>10 से 25 MB</td><td>10 से 35 MB</td></tr>
    </tbody>
  </table>

  एक पेच, जो ज़्यादातर लोगों से छूट जाता है: अटैचमेंट base64 नाम के रूप में भेजे जाते हैं, जो रास्ते में फ़ाइल को करीब 33% फुला देता है। आपके कंप्यूटर पर 20 MB की PDF तार पर करीब 27 MB बनकर पहुँचती है। सेवा 25 MB लिखती है, तो सुरक्षित रहने के लिए कंप्यूटर पर 18 MB से नीचे की फ़ाइल रखिए।

  <blockquote class="callout">मोटा नियम: आम ईमेल के लिए कंप्यूटर पर 15 MB का निशाना रखिए, और 8 MB का, अगर सामने वाला दफ़्तर के नेटवर्क पर बैठा है।</blockquote>

  कुछ ख़ास पेच, जिन पर लोग ठोकर खाते हैं और मानते रहते हैं कि फ़ाइल ठीक है:

  <ul>
    <li><strong>बड़ी सूची को भेजना।</strong> दो सौ लोगों की सूची पर एक भारी PDF भेजना कुल बोझ कई गुना कर देता है, और दफ़्तर के कई सर्वर उसे दिन के हिस्से में गिनते हैं या सीधे लौटा देते हैं।</li>
    <li><strong>सबको जवाब देने की कड़ी।</strong> एक बार पहुँच चुका अटैचमेंट भी सबको जवाब पर लौट सकता है, अगर किसी एक की सीमा सख़्त हो। तब पूरी कड़ी सबके लिए नाकाम हो जाती है।</li>
    <li><strong>मोबाइल नेटवर्क।</strong> कुछ नेटवर्क के मेल गेटवे आज भी 10 MB की छत लगाते हैं। सामने वाला पुराने मोबाइल क्लाइंट पर मेल पढ़ता है, तो उसका हिसाब रखिए।</li>
    <li><strong>वायरस जाँच की देरी।</strong> भारी अटैचमेंट सामने वाले के गेटवे पर जाँचने में ज़्यादा समय लेते हैं। जो मेल बीस मिनट तक नहीं दिखता, वह ख़राब नहीं है, क़तार में है।</li>
  </ul>

  <h2>PDF भारी क्यों हो जाती है</h2>

  छोटा करना तब सबसे अच्छा चलता है जब आप जानते हों कि वज़न कहाँ है। PDF कुछ जाने-पहचाने कारणों से फूलती है:

  <ul>
    <li><strong>ऊँचे DPI के स्कैन।</strong> 600 DPI रंगीन पर लगी मशीन हर पन्ने के 5 से 15 MB बनाती है। ज़्यादातर दस्तावेज़ों को 200 DPI स्लेटी ही चाहिए, और आम दूरी से आँख फ़र्क़ नहीं बता पाएगी।</li>
    <li><strong>अंदर रखे फ़ॉन्ट और रंग की जानकारी।</strong> PDF/A वाली आर्काइव फ़ाइल सिर्फ़ फ़ॉन्ट और रंग की जानकारी के लिए 1 से 3 MB जोड़ देती है, जिसकी ईमेल में ज़रूरत नहीं। PDF/A आर्काइव के लिए बना है, इनबॉक्स के लिए नहीं।</li>
    <li><strong>बिना दबाई तस्वीरें।</strong> Word से चिपकाई तस्वीरें या PDF के अंदर PNG के रूप में सहेजे स्क्रीनशॉट कभी ठीक से नहीं दबाए जाते। 4K का एक स्क्रीनशॉट सीधे रखने पर 8 MB जोड़ सकता है।</li>
    <li><strong>छिपा हुआ बदलावों का इतिहास।</strong> Acrobat में सहेजना फ़ाइल दोबारा लिखने के बजाय बदलाव आगे जोड़ता जाता है। सालों के बदलाव अदृश्य बोझ बन जाते हैं, और 200 KB से शुरू हुआ कॉन्ट्रैक्ट तीस बदलावों के बाद 12 MB पर बैठ सकता है।</li>
    <li><strong>अंदर रखी दूसरी फ़ाइलें।</strong> कुछ PDF अपने अंदर स्प्रेडशीट या ZIP लिए घूमती हैं। छोटा करने से पहले अटैचमेंट का पैनल देख लीजिए (Acrobat में पिन का निशान); हो सकता है आप 30 MB की Excel फ़ाइल मुफ़्त की सवारी करा रहे हों।</li>
    <li><strong>तस्वीर वाले ख़ानों के फ़ॉर्म।</strong> सरकारी फ़ॉर्म अक्सर हर ख़ाने को अलग छोटी तस्वीर के रूप में बनाते हैं। अस्सी ख़ानों से गुणा कीजिए और हैरान करने वाली भारी फ़ाइल मिलती है।</li>
  </ul>

  यह जानना कि आपकी फ़ाइल में इनमें से क्या हावी है, यह भी बता देता है कि नीचे का कौन सा तरीक़ा सबसे ज़्यादा काम करेगा। फ़ाइल किसी भी रीडर में खोलिए और पहला पन्ना देखिए। अगर वह साफ़ तौर पर काग़ज़ की तस्वीर है, तो मामला तस्वीरों का है। अगर टेक्स्ट साफ़ है और चुना जा सकता है, तो फ़ाइल सीधे कंप्यूटर पर बनी है और किसी और वजह से फूली है।

  <h2>तरीक़ा 1: PDF छोटी कीजिए (यही सुझाव है)</h2>

  भारी PDF के अस्सी प्रतिशत मामलों में सीधे छोटा करना ही सही जवाब है। यह फ़ाइल को तस्वीरों और फ़ॉन्ट के समझदार बरताव के साथ दोबारा लिख देता है, पन्नों की गिनती या टेक्स्ट बदले बिना।

  <figure><img src="/static/blog/images/tool-compress-options.jpg" alt="कदम-दर-कदम PDF छोटी करना, हल्की, मँझोली और तेज़ सेटिंग के साथ" width="1280" height="800" loading="lazy"></figure>

  <ol>
    <li>किसी भी ब्राउज़र में Convertica का <a href="/hi/pdf-organize/compress/">मुफ़्त PDF कंप्रेसर</a> खोलिए।</li>
    <li>अपनी PDF अपलोड की जगह पर खींच दीजिए, या दबाकर फ़ाइल चुन लीजिए।</li>
    <li>सेटिंग चुनिए: <strong>हल्की</strong> (गुणवत्ता सबसे अच्छी, कटौती थोड़ी), <strong>मँझोली</strong> (यही सुझाव है), या <strong>तेज़</strong> (ज़्यादा कटौती, पढ़ने भर के दस्तावेज़ों के लिए)।</li>
    <li>फ़ाइल तैयार होने का इंतज़ार कीजिए। बड़े स्कैन 20 से 40 सेकंड ले सकते हैं; दो सौ पन्नों से ऊपर वाले एक-दो मिनट।</li>
    <li>छोटी हुई कॉपी डाउनलोड कीजिए। मूल फ़ाइल आपके डिवाइस पर जैसी है वैसी रहती है।</li>
  </ol>

  <h3>कौन सी सेटिंग चुनें</h3>

  मँझोली ही सही दस्तूर है। यह तस्वीरों को करीब 150 DPI तक ले आती है और बेकार ब्यौरा हटा देती है, जो स्क्रीन पर दिखता ही नहीं और A4 पर अब भी साफ़ छपता है। तेज़ सेटिंग सिर्फ़ तब लीजिए जब सामने वाले को छापना नहीं है, और हल्की तब, जब दस्तावेज़ में ऐसे नक़्शे या तस्वीरें हैं जिन्हें साफ़ रहना चाहिए।

  छोटी पर काम की आदत: अपलोड पूरा होने के बाद आम तौर पर माउस तक हाथ बढ़ाने के बजाय Enter दबाकर पहले से चुनी सेटिंग पक्की कर सकते हैं।

  <h3>किस्म के हिसाब से कितनी कटौती</h3>

  यहीं नब्बे प्रतिशत तक छोटा वाले दावे टूटते हैं। छोटा करना असल में क्या कर सकता है:

  <table>
    <thead>
      <tr><th>दस्तावेज़ की किस्म</th><th>आम कटौती</th><th>उदाहरण</th></tr>
    </thead>
    <tbody>
      <tr><td>सिर्फ़ टेक्स्ट वाली PDF (Word या वेब से बनी)</td><td>80 से 95%</td><td>40 MB से 2 से 8 MB</td></tr>
      <tr><td>टेक्स्ट और तस्वीरें, दोनों</td><td>40 से 70%</td><td>30 MB से 9 से 18 MB</td></tr>
      <tr><td>पूरा स्कैन (हर पन्ना एक तस्वीर)</td><td>30 से 60%</td><td>50 MB से 20 से 35 MB</td></tr>
      <tr><td>पहले से छोटी की गई PDF</td><td>0 से 15%</td><td>दूसरा तरीक़ा देखिए</td></tr>
    </tbody>
  </table>

  अगर आपकी स्कैन PDF मँझोली सेटिंग के बाद भी हद से ऊपर है, तो सीधे तीसरे तरीक़े पर जाइए।

  <h2>तरीक़ा 2: PDF को छोटे हिस्सों में बाँटिए</h2>

  कभी-कभी फ़ाइल को पूरी गुणवत्ता पर रहना ही चाहिए (अदालती सबूत, डिज़ाइन के प्रूफ़) और छोटा करना काफ़ी नहीं पड़ता। बाँटना तब बेहतर है जब:

  <ul>
    <li>सामने वाले ने असली गुणवत्ता माँगी है।</li>
    <li>छोटा करने से फ़ाइल 30 MB तक आती है, 20 MB तक नहीं।</li>
    <li>PDF में क़ुदरती हिस्से हैं (अध्याय, महीनेवार स्टेटमेंट, अलग-अलग अनुलग्नक)।</li>
    <li>आप किसी नियामक को सबूत भेज रहे हैं, जो दोबारा बनाई हुई लगने वाली फ़ाइल नामंज़ूर कर देगा।</li>
  </ul>

  Convertica के टूल से <a href="/hi/pdf-organize/split/">PDF को छोटे हिस्सों में बाँटिए</a>, पन्नों की गिनती या हर हिस्से के पन्ने चुनिए, और टुकड़े डाउनलोड कर लीजिए। असल तरकीब नाम में है, ताकि सामने वाला उन्हें बिना उलझन जोड़ सके:

  <pre><code>2026-04-28_proposal_part-1-of-3.pdf
  2026-04-28_proposal_part-2-of-3.pdf
  2026-04-28_proposal_part-3-of-3.pdf</code></pre>

  हर हिस्सा एक छोटी लाइन के साथ अलग ईमेल में भेजिए: तीन में से पहला हिस्सा, बाक़ी अगले दो ईमेल में। सामने वाला चाहे तो <a href="/hi/pdf-organize/merge/">हिस्सों को वापस जोड़</a> सकता है। डर हो कि वह दूसरा संदेश खो देगा, तो सारे हिस्से एक ही कड़ी में क्रम से लिखे विषय के साथ भेजिए, ताकि इनबॉक्स में वे साथ-साथ बैठें।

  एक टेढ़ी बात: दफ़्तरों के कुछ स्पैम फ़िल्टर लगभग एक जैसे तीन ईमेल की झड़ी को शक की नज़र से देखते हैं। भेजने के बीच एक मिनट का फ़ासला रखिए, या पहले एक सूचना भेज दीजिए कि अगले कुछ मिनट में तीन हिस्से आएँगे।

  <h2>तरीक़ा 3: स्कैन को टेक्स्ट वाली PDF में बदलिए</h2>

  अगर आपकी फ़ाइल स्कैन किया कॉन्ट्रैक्ट, फ़ैक्स या पन्ने की तस्वीर है, तो सारा वज़न तस्वीरों का है, टेक्स्ट का नहीं। कोई सेटिंग 50 MB के पूरे स्कैन को दिखने वाली गुणवत्ता गँवाए बिना 10 MB से नीचे नहीं ला सकती। इलाज है OCR चलाना, जो शब्द निकाल लेता है और दस्तावेज़ को टेक्स्ट वाली PDF के रूप में दोबारा बना देता है।

  तरीक़ा:

  <ol>
    <li>स्कैन पर OCR चलाकर Word या टेक्स्ट वाला रूप बनाइए।</li>
    <li>पहले पन्ने पर सटीकता जाँच लीजिए, rn को m पढ़ा गया, 1 को l, और वे झुंड देखिए जहाँ पहचानने वाला डगमगाया हो।</li>
    <li>Word से दोबारा PDF बना लीजिए।</li>
    <li>नई फ़ाइल पहले तरीक़े से छोटी कर लीजिए।</li>
  </ol>

  50 MB का स्कैन इस चक्कर के बाद अक्सर 1 से 2 MB का निकलता है, क्योंकि टेक्स्ट को तस्वीरों के मुक़ाबले जगह का छोटा हिस्सा ही चाहिए। कीमत यह है कि हाथ की लिखाई, दस्तख़त और मुहरें इस बदलाव में नहीं बचेंगी, इसलिए वे कानूनी तौर पर मायने रखती हों तो मूल फ़ाइल रखिए। अदालत के सबूत या पहचान साबित करने वाली किसी भी चीज़ में मूल फ़ाइल को OCR वाले रूप से बदलिए मत, दोनों भेजिए।

  <h2>गुणवत्ता और साइज़: क्या उम्मीद रखें</h2>

  ख़ुद से साफ़ रहिए कि सामने वाले को असल में क्या चाहिए:

  <ul>
    <li><strong>स्क्रीन पर पढ़ना।</strong> मँझोली सेटिंग का फ़र्क़ दिखता ही नहीं। बेझिझक लगाइए।</li>
    <li><strong>आम दफ़्तरी काग़ज़ पर छपाई।</strong> मँझोली अब भी ठीक है। तेज़ सेटिंग तस्वीरों पर दिखने लगती है।</li>
    <li><strong>पेशेवर छपाई या दस्तख़त।</strong> हल्की सेटिंग पर रहिए, या मूल फ़ाइल रखकर क्लाउड की कड़ी भेजिए।</li>
    <li><strong>अदालती सबूत।</strong> बिल्कुल मत छोटा कीजिए। फ़ाइल की सलामती ईमेल की सहूलियत से बड़ी बात है, और दूसरा पक्ष फ़ाइल दोबारा बनने को भरोसे पर सवाल बना सकता है।</li>
    <li><strong>ऑनलाइन दाख़िल किए जाने वाले काग़ज़।</strong> कई अदालतें PDF का ठीक ब्यौरा छापती हैं (PDF/A 1b, गिने-चुने फ़ॉन्ट के बाहर कुछ अंदर न रखा हो, ज़्यादा से ज़्यादा 35 MB)। अंदाज़ा लगाने के बजाय उनका बताया रूप मानिए।</li>
  </ul>

  <h2>क्लाउड की कड़ी कब भेजें</h2>

  अगर आपकी PDF शुरू में ही 100 MB से ऊपर है, या एक साथ कई भारी फ़ाइलें भेजनी हैं, तो ईमेल से लड़ना बंद कीजिए और कड़ी भेजिए। ज़्यादातर लोगों के पास इनमें से कोई एक पहले से है:

  <table>
    <thead>
      <tr><th>सेवा</th><th>मुफ़्त में जगह</th><th>ध्यान रखिए</th></tr>
    </thead>
    <tbody>
      <tr><td>Google Drive</td><td>कुल 15 GB मुफ़्त</td><td>कड़ी की अनुमति ख़ुद तय करनी पड़ती है</td></tr>
      <tr><td>WeTransfer (मुफ़्त)</td><td>हर बार 2 GB</td><td>कड़ी सात दिन बाद ख़त्म हो जाती है</td></tr>
      <tr><td>Dropbox</td><td>कुल 2 GB मुफ़्त</td><td>कड़ियाँ टिकी रहती हैं</td></tr>
      <tr><td>OneDrive</td><td>5 GB मुफ़्त</td><td>Outlook वालों के लिए सबसे सहूलियत भरा</td></tr>
    </tbody>
  </table>

  प्राइवेसी की एक बात: क्लाउड की कड़ी आपकी संस्था के बाहर एक कॉपी बना देती है। दस्तावेज़ संवेदनशील है, तो चढ़ाने से पहले PDF पर पासवर्ड लगाइए और पासवर्ड अलग रास्ते से भेजिए। कड़ी की अनुमति सिर्फ़ चुने हुए लोगों पर रखिए, कड़ी वाले किसी पर नहीं, और सेवा में सुविधा हो तो समय-सीमा भी लगा दीजिए (Drive में है; Dropbox में पैसे वाले प्लान पर)।

  बाक़ी सब के लिए <a href="/hi/all-tools/">सभी PDF टूल</a> देखिए, छोटा करना, बाँटना और पासवर्ड, सब एक जगह।

  <h2>अक्सर पूछे जाने वाले सवाल</h2>

  <h3>छोटी करने के बाद भी मेरी PDF 25 MB से ऊपर क्यों है?</h3>
  <p>या फ़ाइल ज़्यादातर स्कैन की तस्वीरें हैं (पहला तरीक़ा पूरे स्कैन पर करीब साठ प्रतिशत कटौती पर रुक जाता है), या उसे पहले एक बार छोटा किया जा चुका है। स्कैन पर OCR के लिए तीसरा तरीक़ा देखिए, या दो ईमेल में बाँटने के लिए दूसरा। फ़ाइल सीधे कंप्यूटर पर बनी है और छोटी नहीं हो रही, तो अटैचमेंट का पैनल खोलकर देखिए कि उसके अंदर कोई और फ़ाइल सवारी नहीं कर रही।</p>

  <h3>PDF छोटी करने से गुणवत्ता घटती है?</h3>
  <p>मँझोली सेटिंग तस्वीरों को करीब 150 DPI तक ले आती है, जो पढ़ने की आम दूरी पर दिखता नहीं और A4 पर ठीक छपता है। तेज़ सेटिंग तस्वीरों और बारीक नक़्शों पर दिखने लगती है। टेक्स्ट किसी भी सेटिंग पर वैसा ही रहता है, क्योंकि वह तस्वीर नहीं है।</p>

  <h3>पासवर्ड वाली PDF छोटी कर सकता हूँ?</h3>
  <p>पहले अपने पासवर्ड से खोलना पड़ेगा, फिर छोटा करना, फिर ज़रूरत हो तो दोबारा पासवर्ड लगाना। छोटा करने वाले टूल एन्क्रिप्ट हुए पन्ने पढ़ ही नहीं सकते, और यह जान-बूझकर ऐसा है, वरना एन्क्रिप्शन का मतलब क्या रह जाता।</p>

  <h3>दफ़्तर के ईमेल के लिए सुरक्षित साइज़ क्या है?</h3>
  <p>10 MB से नीचे रखिए। कई दफ़्तरी सर्वर 10 से 15 MB से ऊपर के अटैचमेंट लौटा देते हैं, और सामने वाले का स्पैम फ़िल्टर अपनी सख़्ती और जोड़ देता है। असमंजस हो तो 8 MB से नीचे छोटा कीजिए या क्लाउड की कड़ी भेजिए।</p>

  <h3>छोटी की हुई PDF सामने वाला छाप पाएगा?</h3>
  <p>हाँ। मँझोली और हल्की सेटिंग दफ़्तरी छपाई के लिए काफ़ी साफ़ाई बचा लेती हैं। दस्तावेज़ पेशेवर तरीक़े से बड़े काग़ज़ पर छपना है (A3 से बड़ा कुछ भी), तो हल्की सेटिंग पर रहिए या मूल फ़ाइल भेजिए।</p>

  <h2>अभी आज़माइए</h2>

  <p>PDF ईमेल के लिए बहुत बड़ी है वाली ज़्यादातर दिक्क़तें मँझोली सेटिंग से एक मिनट में हल हो जाती हैं। अपनी फ़ाइल Convertica के कंप्रेसर में डालिए और छोटी हुई कॉपी बेझिझक भेज दीजिए। <a href="/hi/pdf-organize/compress/">PDF कंप्रेसर खोलें →</a></p>
