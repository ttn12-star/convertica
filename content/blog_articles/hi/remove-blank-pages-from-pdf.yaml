slug: remove-blank-pages-from-pdf
title_hi: "PDF से ख़ाली या बेकार पन्ने एक मिनट से कम में कैसे हटाएँ"
meta_title_hi: "PDF से ख़ाली पन्ने हटाएँ, मुफ़्त ऑनलाइन | Convertica"
meta_description_hi: "स्कैनर ख़ाली पन्ने जोड़ देते हैं, कॉन्ट्रैक्ट में जगह भरने वाले पन्ने आते हैं। Acrobat ख़रीदे या कुछ इंस्टॉल किए बिना उन्हें हटाने का सबसे तेज़ तरीक़ा।"
meta_keywords_hi: "PDF से ख़ाली पन्ने हटाएँ, PDF के पन्ने मिटाएँ, PDF पन्ना हटाने वाला टूल, PDF साफ़ करें, remove blank pages pdf hindi"
excerpt_hi: "दोनों तरफ़ स्कैन करने वाली मशीनें वहाँ भी ख़ाली पन्ने जोड़ देती हैं जहाँ मूल काग़ज़ एक तरफ़ ही छपा था। Acrobat का पैसा दिए बिना उन्हें सेकंडों में निकाल दीजिए।"
content_hi: |
  दोनों तरफ़ स्कैन करने वाली मशीन से निकली PDF खोलिए और अक्सर हर असली पन्ने के बाद एक ख़ाली पन्ना मिलेगा, क्योंकि मशीन ने एक तरफ़ छपे हर काग़ज़ की पीठ भी ईमानदारी से उतार ली है। कॉन्ट्रैक्ट का नमूना खोलिए और दो ख़ाली पन्ने मिल सकते हैं, जो दस्तख़त के लिए छोड़े गए हैं। जोड़ी हुई फ़ाइल खोलिए और उसमें मूल फ़ाइलों से बचे अलगाव के पन्ने मिल सकते हैं। सबसे बड़ा दोषी वही दफ़्तर का Brother या Canon वाला फ़ीडर है, जो पहले से दोनों तरफ़ स्कैन करता है, चाहे आपने कहा हो या नहीं।

  इन्हें हटाना ब्राउज़र में कुछ सेकंड का काम है। Acrobat नहीं चाहिए। छापकर दोबारा स्कैन नहीं करना है। कुछ दोबारा टाइप नहीं करना है। बस एक टूल चाहिए जो आपको बेकार पन्ने चुनने दे और बाक़ी लौटा दे।

  <figure><img src="/static/blog/images/tool-remove-pages-hero.jpg" alt="Convertica के व्यवस्थित करने वाले टूल में हटाने के लिए चुने गए ख़ाली पन्ने" width="1280" height="800" loading="lazy"></figure>

  <h2>ख़ाली पन्ने कहाँ से आते हैं</h2>

  वजह जान लेने से उन्हें ढूँढना तेज़ हो जाता है:

  <ul>
    <li><strong>एक तरफ़ छपे काग़ज़ पर दोनों तरफ़ का स्कैन।</strong> सबसे आम वजह। नतीजे में हर दूसरा पन्ना ख़ाली रहता है।</li>
    <li><strong>सेक्शन ब्रेक वाली Word फ़ाइलें।</strong> अगले विषम या अगले सम पन्ने पर सेट किया ब्रेक, पन्ना गिनती बनाए रखने के लिए ज़रूरत पड़ने पर ख़ाली पन्ना डाल देता है, और वह ख़ाली पन्ना PDF में भी चला आता है।</li>
    <li><strong>जगह भरने वाले पन्नों वाले नमूने।</strong> कॉन्ट्रैक्ट और रिपोर्ट के कई नमूनों में परिशिष्ट, अनुलग्नक या दस्तख़त के लिए पन्ने पहले से छोड़े होते हैं, जिनका इस्तेमाल हो या न हो।</li>
    <li><strong>अलग-अलग स्रोतों से जोड़ी गई PDF।</strong> ऐसी फ़ाइलें जोड़ना जिनमें हर एक सम पन्ने पर ख़त्म होती थी, बीच-बीच में ख़ाली पन्ने छोड़ जाता है। सालाना रिपोर्ट और प्रस्तुतियाँ इसमें आगे हैं।</li>
    <li><strong>प्रिंट ड्राइवर।</strong> कुछ सेटिंग के साथ PDF में छापना आख़िर में पुष्टि का या जगह भरने का पन्ना जोड़ देता है। HP के पुराने साझा प्रिंट ड्राइवर 2018 से 2020 के बीच इसके लिए बदनाम थे।</li>
    <li><strong>मोबाइल के स्कैनर ऐप।</strong> CamScanner और Adobe Scan जैसे ऐप मुफ़्त स्तर पर कभी-कभी अपने प्रचार का पन्ना जोड़ देते हैं, जो सुविधा से ज़्यादा ऐसा वॉटरमार्क लगता है जिससे आपको लड़ना पड़ता है।</li>
  </ul>

  <h2>कदम-दर-कदम: पन्ने देखकर हटाना</h2>

  यह तरीक़ा तब सही है जब आप देखे बिना अंदाज़ा नहीं लगा सकते कि कौन से पन्ने ख़ाली हैं।

  <figure><img src="/static/blog/images/tool-remove-pages-options.jpg" alt="ख़ाली PDF पन्नों की छोटी तस्वीरें, एक बार में हटाने के लिए चुनी जा रही हैं" width="1280" height="800" loading="lazy"></figure>

  <ol>
    <li><a href="/hi/pdf-organize/remove-pages/">PDF से पन्ने हटाने वाला टूल</a> खोलिए और अपनी फ़ाइल अपलोड कीजिए।</li>
    <li>छोटी तस्वीरों का जाल देखिए। ख़ाली पन्ने साफ़ दिखते हैं: बिना टेक्स्ट और तस्वीर के पूरे सफ़ेद चौकोर। जिन पन्नों पर स्कैनर की हल्की धूल है, उनमें बुनावट दिखती रहती है, इसलिए वे पूरे सफ़ेद के बजाय हल्के स्लेटी लगते हैं।</li>
    <li>जिन पन्नों को हटाना है, उन पर दबाइए। ज़्यादातर टूल चुने हुए पन्ने पर रंगीन किनारा या कूड़े का निशान दिखा देते हैं।</li>
    <li>पक्का कीजिए और साफ़ हुई फ़ाइल डाउनलोड कीजिए। देख लीजिए कि पन्नों की गिनती उम्मीद के मुताबिक़ है।</li>
  </ol>

  अगर साथ में क्रम भी बदलना है या पन्ने घुमाने हैं, तो तीनों काम एक बैठक में करना तीन अलग टूल चलाने से तेज़ है। <a href="/hi/pdf-organize/organize/">खींचकर पन्ने व्यवस्थित करने वाला</a> पन्ना आपको एक ही बार में हटाने, खींचने और घुमाने देता है।

  <h2>कदम-दर-कदम: पन्नों की गिनती बताकर हटाना</h2>

  जब आपको पहले से पता है कि कौन से पन्ने जाने हैं, तो नंबर लिख देना दबाने से तेज़ है।

  <ol>
    <li>PDF अपलोड कीजिए।</li>
    <li>गिनती वाले तरीक़े पर जाइए (ज़्यादातर टूल में देखकर चुनने और गिनती लिखने के बीच अदला-बदली होती है)।</li>
    <li>अपनी गिनती कॉमा से अलग करके लिखिए, और लगातार पन्नों के लिए हाइफ़न लगाइए। <code>3, 7-9, 12</code> का मतलब है: पन्ना 3 हटाइए, 7 से 9 तक, और पन्ना 12। इस सूची के बाहर के पन्ने बचे रहेंगे।</li>
    <li>लागू कीजिए और डाउनलोड कर लीजिए।</li>
  </ol>

  <blockquote class="callout">इस गिनती में पन्ना नंबर असली, भौतिक पन्नों के हैं, दस्तावेज़ पर छपी संख्या के नहीं। अगर आपका कॉन्ट्रैक्ट तीसरे भौतिक पन्ने से 1 गिनना शुरू करता है, तो आपका पन्ना 1 असल में तीसरा पन्ना हो सकता है।</blockquote>

  जानने लायक: ज़्यादातर जगहें <code>50-</code> जैसी अधूरी गिनती नहीं लेतीं, यानी पचास से आख़िर तक सब कुछ। आपको आख़िरी पन्ना भी लिखना पड़ेगा (जैसे 78 पन्नों की फ़ाइल में <code>50-78</code>)। शुरू में एक बार गिन लेना बाद के अरे, यह चला ही नहीं वाले चक्कर बचा देता है।

  <h2>हटाना और छिपाना, दोनों एक बात नहीं</h2>

  कुछ PDF टूल (और Acrobat) पन्ने मिटाने के बजाय छिपाने देते हैं। छिपे पन्ने दिखते नहीं, पर उनका डेटा फ़ाइल में पड़ा रहता है। कोई भी उसी फ़ाइल को दूसरे व्यूअर में खोले, या उन्हें फिर से दिखा दे, तो सामग्री लौट आती है।

  संवेदनशील सामग्री पर यह असली दिक्क़त है। अगर आप HR के दस्तावेज़ से तनख़्वाह वाला पन्ना हटाने के बजाय छिपा देते हैं, तो तनख़्वाह की जानकारी फ़ाइल के साथ ही घूमती रहती है। हमेशा के लिए हटाना ही सुरक्षित जवाब है, जब:

  <ul>
    <li>पन्नों में वह जानकारी है जो सामने वाले तक नहीं पहुँचनी चाहिए।</li>
    <li>आप फ़ाइल अपनी संस्था के बाहर भेज रहे हैं।</li>
    <li>फ़ाइल आर्काइव हो सकती है या आगे भेजी जा सकती है।</li>
    <li>दस्तावेज़ किसी कानूनी माँग या सूचना के अधिकार के दायरे में आ सकता है, जहाँ छिपी सामग्री भी निकाली जा सकती है।</li>
  </ul>

  ब्राउज़र वाले टूल पन्ने का डेटा मिटाते हैं, बस छिपाते नहीं। नतीजा किसी दूसरे व्यूअर में खोलकर देख लीजिए; हटाए पन्ने ग़ायब होने चाहिए, अदृश्य नहीं। एक झटपट जाँच: साफ़ हुई फ़ाइल किसी भी टेक्स्ट एडिटर में खोलिए (हाँ, Notepad में भी) और हटाए पन्ने का कोई ख़ास शब्द ढूँढिए। न मिले, तो पन्ना वाक़ई गया।

  <h2>हटाने के बाद पन्ना संख्या</h2>

  ज़्यादातर PDF में पन्ना संख्या अपने आप नहीं बनती, वह असली फ़ाइल बनाते समय हर पन्ने पर टेक्स्ट की तरह छप जाती है। पन्ने हटाने से बचे हुए पन्नों की संख्या जादू से नहीं बदलती। अगर आपके दस्तावेज़ में हर पन्ने पर बारह में से पाँचवाँ पन्ना लिखा था, तो हटाने के बाद बारह में से पहला, दूसरा, चौथा, छठा, सातवाँ पढ़ने वाले पन्ने बच सकते हैं, जो टूटा हुआ लगता है।

  दो रास्ते:

  <ul>
    <li><strong>इसे रहने दीजिए</strong> अंदरूनी दस्तावेज़ों में, जहाँ छपी संख्या से कोई फ़र्क़ नहीं पड़ता।</li>
    <li><strong>संख्या नई डाल दीजिए,</strong> पुरानी वाली पट्टी हटाकर। <a href="/hi/pdf-edit/add-page-numbers/">नई पन्ना संख्या डालने वाले टूल</a> पूरे दस्तावेज़ के ऊपर या नीचे का हिस्सा एक बार में बदल देते हैं।</li>
  </ul>

  उसी तरह विषय-सूची भी सुधार लीजिए। पन्ना सात पर भेजने वाली सूची, जब आपका नया पन्ना सात पहले नौ था, हर पढ़ने वाले को चिढ़ाती है। जब कोई कहता है कि यह PDF ख़राब है, तो दूसरी सबसे आम वजह यही होती है; पहली होती है कि सूची के लिंक भी नहीं चलते।

  <h2>स्कैन किए पुलिंदों की थोक सफ़ाई</h2>

  दो सौ पन्नों का स्कैन एक-एक क्लिक से साफ़ करना यातना है। दो तरीक़े मदद करते हैं:

  <h3>बहुत सारे पन्नों में ख़ाली पहचानना</h3>

  टूल में सुविधा हो तो छोटी तस्वीरों का आकार बढ़ा दीजिए। सफ़ेद चौकोर तुरंत आँख में आ जाते हैं। बहुत हल्की धूल वाले पन्ने ध्यान से देखिए; कोई टेक्स्ट या आकार न दिखे, तो पन्ना ख़ाली है।

  कुछ टूल इंटरनेट बचाने के लिए तस्वीरें बहुत कम रेज़ोल्यूशन पर बनाते हैं। अगर आपके ख़ाली पन्ने दबाव या धुँधलेपन की वजह से साफ़ सफ़ेद नहीं दिख रहे, तो फ़ाइल देखने से पहले बड़ी झलक वाले रूप पर जाइए। असली पन्ना ग़लती से मिटाने से बचने के लिए वह अतिरिक्त इंतज़ार सही सौदा है।

  <h3>दोनों तरफ़ स्कैन वाला छोटा रास्ता</h3>

  अगर आपने एक तरफ़ छपे काग़ज़ों का ढेर दोनों तरफ़ स्कैन करने वाली मशीन पर चढ़ाया है, तो हर पीठ ख़ाली है। यानी आपको PDF का हर <strong>सम</strong> पन्ना हटाना है। <code>2, 4, 6, 8, 10, ...</code> जैसी गिनती चल जाती है, और ज़्यादातर टूल हर nवाँ पन्ना या सम पन्ने वाले विकल्प से वह सूची ख़ुद बना देते हैं।

  शुरू के कुछ नतीजे देखकर पक्का कर लीजिए। अगर आपकी मशीन कभी काग़ज़ पलट देती है, या ढेर पीठ की तरफ़ से शुरू हुआ, तो क्रम एक से खिसक जाएगा और आपको विषम पन्ने हटाने पड़ेंगे। Fujitsu ScanSnap वाली मशीनें इसमें ख़ासकर फँसती हैं, जब फ़ीडर एक साथ दो काग़ज़ खींच लेता है, आपका पहला पन्ना जोड़े की पीठ बन जाता है और आगे का पूरा क्रम बिगड़ जाता है।

  सफ़ाई के बाद लग सकता है कि फ़ाइल को छोटे दस्तावेज़ों में बाँट देना बेहतर होगा। <a href="/hi/pdf-organize/split/">अध्यायों में बाँटने</a> वाला रास्ता तब अच्छा चलता है जब आपने दो सौ पन्नों का पुलिंदा साफ़ किया हो, जो असल में चालीस-चालीस पन्नों के पाँच दस्तावेज़ होने चाहिए थे।

  <h2>भेजने से पहले जाँच</h2>

  साफ़ हुई फ़ाइल किसी को भेजने से पहले दो जाँच कीजिए। पहली, गिनती देखिए (210 पन्ने गए, हर दूसरा हटा, 105 पन्ने आए)। दूसरी, नतीजे में जल्दी से नीचे तक स्क्रॉल कीजिए, यह पक्का करने के लिए कि सफ़ाई में कोई असली पन्ना नहीं चला गया। किन पर नज़र रखिए: बहुत कम टेक्स्ट वाले अध्याय-शीर्षक पन्ने छोटी तस्वीर में लगभग ख़ाली लगते हैं और ग़लती से मिट सकते हैं। वे पन्ने भी, जिन पर एक ही तस्वीर है (कोई चार्ट, दस्तख़त, लोगो), जब छोटी तस्वीर उसे न दिखने की हद तक छोटा कर देती है।

  <h2>अक्सर पूछे जाने वाले सवाल</h2>

  <h3>दो सौ पन्नों के स्कैन से ख़ाली पन्ने अपने आप कैसे हटाऊँ?</h3>
  <p>अगर ख़ाली पन्ने किसी क्रम में हैं (दोनों तरफ़ स्कैन से हर दूसरा पन्ना), तो गिनती वाला तरीक़ा लीजिए और सम पन्ने एक ही बार में हटा दीजिए। अगर वे बिखरे हुए हैं, तो छोटी तस्वीरों वाला जाल किसी भी नियम से तेज़ है, क्योंकि आप तेज़ी से स्क्रॉल करते हुए हर सफ़ेद चौकोर पर दबा सकते हैं।</p>

  <h3>पन्ने हटाने से पन्ना संख्या बिगड़ जाएगी?</h3>
  <p>अगर आपके दस्तावेज़ में नीचे संख्या टेक्स्ट की तरह छपी है (जैसे बारह में से पाँचवाँ पन्ना), तो हाँ। बचे पन्ने अपनी पुरानी संख्या ही लिए रहते हैं। या इसे अंदरूनी काम के लिए रहने दीजिए, या सफ़ाई के बाद पूरी फ़ाइल पर संख्या हटाकर नई डाल दीजिए।</p>

  <h3>पन्ना हटाना वापस लौटा सकता हूँ?</h3>
  <p>टूल ख़ुद एक नई फ़ाइल बनाता है, इसलिए आपकी मूल फ़ाइल कंप्यूटर पर जैसी है वैसी रहती है। पन्ने हटाकर नतीजा डाउनलोड कर लिया और ग़लती पकड़ में आई, तो बस मूल PDF पर लौट जाइए। साफ़ हुआ रूप जाँच लेने तक मूल फ़ाइल हमेशा रखिए।</p>

  <h3>हटाए पन्ने कभी-कभी लौट क्यों आते हैं?</h3>
  <p>यह तब होता है जब टूल ने पन्ने मिटाने के बजाय छिपाए थे, या फ़ाइल किसी ऐसे एडिटर में खुली जिसने सहेजे पुराने रूप से उसे लौटा दिया। ऐसा टूल लीजिए जो पन्ने का डेटा वाक़ई मिटाता है, और फ़ाइल का साइज़ तथा पन्ना गिनती जाँच लीजिए।</p>

  <h3>पासवर्ड वाली PDF से पन्ने हटा सकता हूँ?</h3>
  <p>पहले पासवर्ड देना पड़ेगा। ऑनलाइन पन्ना हटाने वाले ज़्यादातर टूल अपलोड पर पासवर्ड माँग लेते हैं। पासवर्ड के बिना आप फ़ाइल में जायज़ तरीक़े से बदलाव नहीं कर सकते।</p>

  <h2>अभी आज़माइए</h2>

  <p>ख़ाली पन्नों को स्क्रॉल करके पार करना बंद कीजिए। <a href="/hi/pdf-organize/remove-pages/">PDF से पन्ने हटाने वाला टूल</a> खोलिए, बेकार तस्वीरों पर दबाइए, और एक मिनट से कम में साफ़ फ़ाइल डाउनलोड कर लीजिए। Acrobat की लाइसेंस चाबी ढूँढने से भी तेज़।</p>
