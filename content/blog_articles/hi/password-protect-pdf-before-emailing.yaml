slug: password-protect-pdf-before-emailing
title_hi: "ईमेल से भेजने से पहले PDF पर पासवर्ड कैसे लगाएँ (और पासवर्ड सुरक्षित कैसे भेजें)"
meta_title_hi: "ईमेल के लिए PDF पर पासवर्ड, मुफ़्त | Convertica"
meta_description_hi: "PDF को तीस सेकंड में पासवर्ड से एन्क्रिप्ट कीजिए, फिर पासवर्ड भेजने का सही तरीक़ा सीखिए, ताकि एक लापरवाह ईमेल पूरी सुरक्षा बेकार न कर दे।"
meta_keywords_hi: "PDF पर पासवर्ड लगाएँ, ईमेल के लिए PDF एन्क्रिप्ट, सुरक्षित PDF अटैचमेंट, PDF पासवर्ड मुफ़्त, password protect pdf hindi"
excerpt_hi: "PDF पर पासवर्ड लगाना सिर्फ़ आधा काम है। पासवर्ड उसी ईमेल में भेज देना पूरी बात मिटा देता है। दोनों हिस्से ठीक करने का तरीक़ा यहाँ है।"
content_hi: |
  PDF को एन्क्रिप्ट करने में करीब तीस सेकंड लगते हैं। एन्क्रिप्शन को उसी पल बेकार किए बिना पासवर्ड भेजने में करीब दो मिनट सोचना पड़ता है, और लोग ठोकर वहीं खाते हैं। पासवर्ड को अटैचमेंट वाले उसी ईमेल में डाल देना, ताला लगाकर चाबी उसी दरवाज़े के हैंडल पर टेप कर देने जैसा है।

  यह गाइड दोनों हिस्से बताती है: फ़ाइल को असल में एन्क्रिप्ट कैसे करें, और पासवर्ड सामने वाले तक ऐसे रास्ते से कैसे पहुँचाएँ जहाँ ईमेल की पहुँच न हो।

  <figure><img src="/static/blog/images/tool-pdf-protect-hero.jpg" alt="Convertica का PDF पर पासवर्ड लगाने वाला टूल, AES-256 एन्क्रिप्शन के साथ" width="1280" height="800" loading="lazy"></figure>

  <h2>ईमेल के अटैचमेंट को अलग सुरक्षा क्यों चाहिए</h2>

  आम ईमेल एक सर्वर से दूसरे तक जाते हुए एन्क्रिप्ट रहता है (TLS से), लेकिन सिरे से सिरे तक नहीं। इसका मतलब:

  <ul>
    <li>आपकी ईमेल सेवा उसकी सामग्री पढ़ सकती है।</li>
    <li>सामने वाले की ईमेल सेवा भी पढ़ सकती है।</li>
    <li>संदेश आगे भेजा जाए, आर्काइव हो जाए, या खोज की सूची में चला जाए, तो उसकी नकलें उन जगहों पर बैठ जाती हैं जिन पर आपका ज़ोर नहीं है।</li>
    <li>साझा इनबॉक्स (info@, accounts@) में भेजने वाले से ज़्यादा पढ़ने वाले होते हैं।</li>
    <li>नियम-कायदे वाले उद्योगों में ईमेल के बैकअप सात साल या उससे ज़्यादा टिके रहते हैं, संदेश इनबॉक्स से मिटाने के बाद भी।</li>
    <li>कोई अदालती नोटिस, अंदरूनी जाँच या कानूनी रोक सालों बाद उन्हीं बैकअप से वह संदेश निकाल सकती है।</li>
  </ul>

  इसका मतलब यह नहीं कि रोज़ की चिट्ठी-पत्री के लिए ईमेल असुरक्षित है। मतलब यह है कि कॉन्ट्रैक्ट, तनख़्वाह की पर्ची, मेडिकल रिकॉर्ड या दस्तख़त हुए समझौते को एक ऐसी परत चाहिए जो आगे भेजे जाने और आर्काइव होने के बाद भी टिकी रहे। PDF की एन्क्रिप्शन ठीक वही परत है।

  <h2>कदम-दर-कदम: अपनी PDF एन्क्रिप्ट कीजिए</h2>

  <figure><img src="/static/blog/images/tool-pdf-protect-options.jpg" alt="PDF के लिए मज़बूत पासवर्ड और AES-256 एन्क्रिप्शन चुनना" width="1280" height="800" loading="lazy"></figure>

  <ol>
    <li><a href="/hi/pdf-security/protect/">PDF पर पासवर्ड लगाने वाला टूल</a> खोलिए और फ़ाइल अपलोड कीजिए। आपके डिवाइस पर पड़ी मूल फ़ाइल जैसी है वैसी रहती है।</li>
    <li>मज़बूत पासवर्ड रखिए। सामने वाले को बिल्कुल यही अक्षर चाहिए होंगे, इसलिए ध्यान से लिखिए, और दो बार टाइप करने के बजाय पासवर्ड मैनेजर से चिपकाइए।</li>
    <li>एन्क्रिप्शन का स्तर देख लीजिए। आजकल के टूल पहले से AES-256 पर रहते हैं, वही जो बैंक और सरकारी दफ़्तर इस्तेमाल करते हैं। पुराने RC4 और AES-128 अब भी मौजूद हैं, पर उनसे बचिए, सिवाय उस हालत में जब सामने वाला बहुत पुराना सॉफ़्टवेयर चला रहा हो (Acrobat 8 या उससे पुराना, कुछ औद्योगिक मशीनों के अंदर लगे रीडर)।</li>
    <li>एन्क्रिप्ट हुई फ़ाइल डाउनलोड कीजिए। पासवर्ड डालकर उसे एक बार ख़ुद खोलिए, यह देखने के लिए कि सब ठीक है, फिर ईमेल में लगाइए।</li>
  </ol>

  <blockquote class="callout">भेजने से पहले जाँच लीजिए। एन्क्रिप्ट हुई फ़ाइल को पासवर्ड से ख़ुद खोलिए, उसी व्यूअर में जो सामने वाला इस्तेमाल करेगा। एन्क्रिप्शन ख़राब है वाली बहुत सी शिकायतें असल में पासवर्ड की टाइपिंग की ग़लती निकलती हैं, और वह ईमेल जाने के बाद ही पकड़ में आती है।</blockquote>

  एक टेढ़ी बात, जो बताने लायक है: अगर आप पासवर्ड मैनेजर से पासवर्ड कॉपी करते हैं और मैनेजर आख़िर में एक खाली जगह या तिरछा उद्धरण चिह्न जोड़ देता है, तो सामने वाले का सीधा-सादा पासवर्ड कभी मेल नहीं खाएगा। पासवर्ड सहेजने से पहले आगे-पीछे की खाली जगह हटा दीजिए और घुमावदार उद्धरण चिह्नों (’ ‘ ” “) की जगह सीधे ASCII चिह्न (' ") रखिए। एन्क्रिप्शन काम नहीं कर रहा वाली लगभग आधी शिकायतों की चुपचाप वजह यही होती है।

  अगर दस्तावेज़ ड्राफ़्ट भी है या उस पर गोपनीयता की मुहर चाहिए, तो <a href="/hi/pdf-edit/add-watermark/">गोपनीय वाला वॉटरमार्क भी लगा</a> दीजिए, ताकि जिसके हाथ भी वह पहुँचे उसे साफ़ दिखे कि सामग्री सीमित है।

  <h2>पासवर्ड सुरक्षित तरीक़े से कैसे भेजें</h2>

  यही वह आधा हिस्सा है जो छूट जाता है, और यही तय करता है कि आपकी एन्क्रिप्शन असल में कुछ बचा रही है या नहीं।

  <h3>अलग रास्ता चुनिए</h3>

  नियम सीधा है: पासवर्ड को ऐसे रास्ते से जाना चाहिए जिसका ईमेल से कोई लेना-देना न हो। अच्छे विकल्प:

  <ul>
    <li><strong>SMS या मैसेंजर।</strong> पासवर्ड मैसेज से भेजिए, या Signal या WhatsApp जैसे सिरे से सिरे तक एन्क्रिप्टेड मैसेंजर से। फ़ोन नंबर ईमेल खाते से अलग पहचान है।</li>
    <li><strong>पासवर्ड मैनेजर का साझा लिंक।</strong> 1Password, Bitwarden और Dashlane, सबमें किसी चीज़ को साझा करने की सुविधा है, जो एक बार देखने के बाद या तय समय के बाद ख़त्म हो जाती है।</li>
    <li><strong>आमने-सामने या फ़ोन पर बोलकर।</strong> पुराना तरीक़ा, पर पक्का। ऊँची कीमत वाली चीज़ों के लिए, जहाँ आप फ़ोन कर सकते हैं।</li>
    <li><strong>एक बार खुलने वाली सेवाएँ।</strong> Bitwarden Send जैसे टूल ऐसा लिंक बना देते हैं जो एक बार खुलने के बाद ख़ुद मिट जाता है।</li>
    <li><strong>अलग टिकट सिस्टम।</strong> अगर दोनों पक्ष एक ही सर्विस डेस्क (Jira Service Desk, Zendesk) इस्तेमाल करते हैं, तो पासवर्ड निजी टिप्पणी की तरह जा सकता है, जो ईमेल की कड़ी से अलग रहती है।</li>
  </ul>

  वे रास्ते जो ठीक लगते हैं, पर हैं नहीं:

  <ul>
    <li><strong>पासवर्ड अगले ईमेल में है।</strong> वही इनबॉक्स, वही रिकॉर्ड, वही आगे भेजने वाले। एन्क्रिप्शन अब बस एक गति-अवरोधक है।</li>
    <li><strong>पासवर्ड ईमेल के विषय में।</strong> वही दिक्क़त, और ऊपर से ज़्यादा दिखाई देने वाली।</li>
    <li><strong>अंदाज़े में आ जाने वाले पासवर्ड (पासवर्ड सामने वाले का उपनाम है)।</strong> जो कोई अंदाज़ा लगा सकता है, उसे पासवर्ड की ज़रूरत ही नहीं।</li>
    <li><strong>Apple और Android के बीच iMessage।</strong> सामने वाला iMessage पर नहीं है, तो संदेश सादे SMS पर उतर आता है, जो नेटवर्क कंपनी के ढाँचे पर बिना एन्क्रिप्शन पड़ा रहता है।</li>
    <li><strong>वॉइसमेल।</strong> दफ़्तरों के कई वॉइसमेल सिस्टम रिकॉर्डिंग उसी इनबॉक्स में रखते हैं जो ईमेल से जुड़ा है, और वे लिखे हुए रूप में भी बदल दी जाती हैं।</li>
  </ul>

  <h3>ऐसा पासवर्ड चुनना जो टूटेगा नहीं</h3>

  PDF की एन्क्रिप्शन चाबी पासवर्ड से ही बनती है। कमज़ोर पासवर्ड, फ़ाइल हाथ में आने के बाद, हमलावर के कंप्यूटर पर ही तोड़ लिया जाता है। इसलिए उसे मुश्किल बनाइए।

  <ul>
    <li><strong>लंबाई, जटिलता से बड़ी बात है।</strong> सोलह अक्षरों की बेतरतीब लाइन, पाँच चिह्नों वाले दस अक्षरों से बेहतर है। PurpleDolphinChairOcean42 का पलड़ा P@55! से भारी है।</li>
    <li><strong>निजी जानकारी मत डालिए।</strong> सामने वाले का नाम, जन्मदिन, कंपनी और पालतू का नाम, सब LinkedIn पर एक नज़र डालने से मिल जाते हैं।</li>
    <li><strong>पासवर्ड बनवाइए, गढ़िए मत।</strong> अपने पासवर्ड मैनेजर का जनरेटर चलाइए। चार शब्दों वाला बेतरतीब वाक्यांश भी आपके सोचे हुए किसी भी पासवर्ड से कहीं ज़्यादा मज़बूत होता है।</li>
    <li><strong>अपने आप बदल जाने वाले अक्षरों से बचिए।</strong> कुछ कीबोर्ड, ख़ासकर मोबाइल के, कुछ विराम चिह्नों को अपने आप घुमावदार रूप में बदल देते हैं। अलग-अलग डिवाइस के बीच पासवर्ड भेजना हो तो अक्षरों और अंकों तक ही रहिए।</li>
  </ul>

  संवेदनशील सामग्री पर सबसे नीची सीमा: बारह बेतरतीब अक्षर-अंक, या चार शब्दों वाला वाक्यांश। दोनों से करीब 60 से 70 बिट की अनिश्चितता मिलती है, जो 2026 के किसी भी हार्डवेयर पर AES-256 तोड़ने को नामुमकिन बनाए रखने के लिए काफ़ी है।

  <h2>खोलने का पासवर्ड और अनुमति का पासवर्ड</h2>

  PDF दो अलग पासवर्ड रख सकती है, और वे अलग काम करते हैं:

  <table>
    <thead>
      <tr>
        <th>पासवर्ड की किस्म</th>
        <th>वह क्या करता है</th>
        <th>कब लगाइए</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>खोलने वाला पासवर्ड</td>
        <td>दस्तावेज़ देखने के लिए ही ज़रूरी। इसके बिना फ़ाइल बेमतलब कूट-लिपि है।</td>
        <td>जब सामग्री ख़ुद गोपनीय हो।</td>
      </tr>
      <tr>
        <td>अनुमति वाला पासवर्ड</td>
        <td>तय करता है कि देखने वाला क्या कर सकता है (छपाई, टेक्स्ट कॉपी, बदलाव)। दस्तावेज़ इसके बिना भी खुल जाता है।</td>
        <td>उन फ़ाइलों पर जो पढ़ी जानी चाहिए, पर बदली या कॉपी न हों (फ़ॉर्म के नमूने, बाँटी जाने वाली रिपोर्ट)।</td>
      </tr>
    </tbody>
  </table>

  ईमेल से गोपनीय PDF भेजने के ज़्यादातर मामलों में <strong>खोलने वाला पासवर्ड</strong> ही चाहिए, क्योंकि आप फ़ाइल को चाबी के बिना पढ़ी न जाने लायक चाहते हैं। अनुमति वाला पासवर्ड काम का है, पर ठाने हुए आदमी उसे आसानी से पार कर जाते हैं। कुछ PDF टूल (और Mac के Preview के कई पुराने वर्शन) उन फ़ाइलों पर अनुमति की पाबंदियाँ पूरी तरह अनदेखा कर देते हैं जिनमें खोलने वाला पासवर्ड नहीं है।

  अगर आपके काम में दोनों चाहिए, तो दोनों लगाइए: पहुँच रोकने के लिए खोलने वाला, और अधिकृत आदमी क्या कर सकता है यह तय करने के लिए अनुमति वाला।

  <h2>एन्क्रिप्शन के साथ ईमेल के काम के नुस्ख़े</h2>

  कुछ बातें, जो लोगों को अक्सर काटती हैं:

  <ul>
    <li><strong>छोटा करने के बाद एन्क्रिप्ट कीजिए।</strong> अगर PDF ईमेल के लिए भी बड़ी है, तो पहले <a href="/hi/pdf-organize/compress/">उसे छोटा कीजिए और फिर पासवर्ड लगाइए</a>। कुछ कंप्रेसर फ़ाइल को चुपचाप ऐसे दोबारा बना देते हैं कि एन्क्रिप्शन उतर जाती है।</li>
    <li><strong>सामने वाले को बता दीजिए कि फ़ाइल एन्क्रिप्टेड है।</strong> ईमेल में एक छोटी लाइन (यह PDF पासवर्ड से सुरक्षित है, पासवर्ड अभी मैसेज से भेज रहा हूँ) फ़ाइल को ख़राब या रोकी गई मान लिए जाने से बचा देती है।</li>
    <li><strong>स्पैम फ़िल्टर से सावधान रहिए।</strong> एन्क्रिप्ट हुए अटैचमेंट की जाँच नहीं हो सकती, इसलिए दफ़्तरों के स्पैम फ़िल्टर उन्हें कभी-कभी रोक लेते हैं। सामने वाले को कह दीजिए कि कुछ मिनट में ईमेल न दिखे तो स्पैम फ़ोल्डर देख लें, और बड़े मामलों में IT को पहले से बता दीजिए।</li>
    <li><strong>पासवर्ड ख़ुद को ईमेल मत कीजिए।</strong> अगर किसी ने आपका इनबॉक्स तोड़ा, तो भेजे हुए में फ़ाइल और इनबॉक्स में पासवर्ड, दोनों उसके हाथ हैं। पासवर्ड सिर्फ़ अपने पासवर्ड मैनेजर में रखिए।</li>
  </ul>

  <h2>पासवर्ड भूल जाएँ तो क्या करें</h2>

  बिना एन्क्रिप्शन वाली मूल फ़ाइल कहीं सुरक्षित रखिए। एन्क्रिप्शन दोनों तरफ़ एक ही चाबी से चलती है: पासवर्ड गया, तो फ़ाइल सीधे रास्ते से वापस नहीं आएगी। AES-256 को ज़ोर लगाकर तोड़ना किसी भी सामान्य समय-सीमा में मुमकिन नहीं, सूरज के ठंडा पड़ने का मज़ाक़ इसी पर बना है।

  अगर दस्तावेज़ आपका है, पासवर्ड खो गया पर मूल फ़ाइल मौजूद है, तो नए पासवर्ड से दोबारा एन्क्रिप्ट कर लीजिए। अगर आपके पास सिर्फ़ एन्क्रिप्ट हुई कॉपी है और उस पर हक़ वाक़ई आपका है, तो <a href="/hi/pdf-security/unlock/">अपनी PDF का ताला खोलने वाले टूल</a> कमज़ोर पाबंदियाँ हटाने की कोशिश कर सकते हैं, पर मज़बूत AES-256 पासवर्ड नहीं तोड़ेंगे। कमज़ोर पाबंदियों पर, जैसे 2003 के ज़माने की सिर्फ़ अनुमति वाली PDF, यह काम आसान है। लंबे पासवर्ड वाली असली AES-256 पर उम्मीद छोड़ दीजिए।

  <h2>अक्सर पूछे जाने वाले सवाल</h2>

  <h3>कानूनी दस्तावेज़ों के लिए AES-256 काफ़ी मज़बूत है?</h3>
  <p>हाँ। AES-256 को अमेरिका की राष्ट्रीय सुरक्षा एजेंसी ने सबसे गोपनीय सामग्री के लिए मंज़ूरी दी है, और बैंक, सरकारें तथा बड़ी क्लाउड कंपनियाँ इसे इस्तेमाल करती हैं। PDF की सुरक्षा में कमज़ोर कड़ी लगभग हमेशा पासवर्ड होता है, तरीक़ा नहीं।</p>

  <h3>पासवर्ड उसी ईमेल में भेजकर बाद में मिटा दूँ तो चलेगा?</h3>
  <p>नहीं। ईमेल सर्वरों पर नक़ल होता है, बैकअप होता है, आर्काइव होता है और आगे भेजा जाता है। भेजने के बाद मिटाना सिर्फ़ आपकी कॉपी मिटाता है और उन दर्जनों जगहों का कुछ नहीं करता जहाँ वह संदेश पड़ा है। अलग रास्ता चुनिए।</p>

  <h3>सामने वाला पासवर्ड भूल जाए तो?</h3>
  <p>आप पासवर्ड सुरक्षित रास्ते से दोबारा भेज देते हैं। अगर उसने फ़ाइल और पासवर्ड, दोनों खो दिए हैं, तो आप अपनी मूल फ़ाइल नए पासवर्ड से एन्क्रिप्ट करके फिर भेजिए। पासवर्ड वाली PDF का कोई रिकवरी कोड या मास्टर चाबी नहीं होती।</p>

  <h3>एन्क्रिप्शन से PDF का साइज़ बदल जाएगा?</h3>
  <p>बहुत थोड़ा। एन्क्रिप्शन कुछ सौ बाइट का ब्यौरा जोड़ती है। असली सामग्री जहाँ है वहीं एन्क्रिप्ट होती है, इसलिए 5 MB की PDF करीब 5.001 MB हो जाती है। ईमेल की सीमा पार कराने के लिए यह कुछ भी नहीं है।</p>

  <h3>सामने वाला फ़ाइल खोलने के बाद पासवर्ड हटा सकता है?</h3>
  <p>हाँ। पासवर्ड हाथ में आने के बाद वह किसी भी आम PDF टूल से एन्क्रिप्शन हटा सकता है। अगर आपको ऐसी सुरक्षा चाहिए जो सामने वाले के हाथों भी बची रहे, तो अकेली एन्क्रिप्शन जवाब नहीं है। उसे वॉटरमार्क और साफ़ नीति के साथ जोड़िए, और बड़े पैमाने पर बाँटने के लिए DRM वाले टूल पर सोचिए।</p>

  <h2>अभी आज़माइए</h2>

  <p>पहले फ़ाइल पर ताला लगाइए, फिर चाबी दूसरे दरवाज़े से भेजिए। <a href="/hi/pdf-security/protect/">PDF सुरक्षा टूल</a> खोलिए और अपना दस्तावेज़ एन्क्रिप्ट कीजिए, फिर ईमेल भेजने से पहले पासवर्ड Signal, SMS या अपने पासवर्ड मैनेजर के साझा लिंक से पहुँचा दीजिए।</p>
