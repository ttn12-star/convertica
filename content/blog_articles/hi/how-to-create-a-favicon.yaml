content_hi: |
  Favicon आपके ब्रांड का सबसे छोटा टुकड़ा है, और वही जिसे लोग सबसे ज़्यादा बार देखते हैं। यह ब्राउज़र टैब में बैठता है, बुकमार्क की पट्टी में, खोज के नतीजों में आपके नाम के बगल में, और फोन की होम स्क्रीन पर जब कोई आपका पन्ना सहेजता है। अच्छे favicon को कोई नोटिस नहीं करता। लेकिन गायब favicon, धुँधला favicon, या वो सलेटी गोला जो ब्राउज़र दिखाता है जब आप favicon लगाना भूल जाते हो, उसे लोग तुरंत नोटिस करते हैं। सही favicon बनाने में सिर्फ कुछ मिनट लगते हैं, बस एक बार समझ लो कि आज के ब्राउज़र और डिवाइस असल में मांगते क्या हैं। यहां पूरी तस्वीर है, और इसमें सबसे तेज़ रास्ता भी।

  <h2>Favicon असल में होता क्या है</h2>

  <p>Favicon, यानी पसंदीदा आइकन, वो छोटी चौकोर तस्वीर है जो किसी वेबसाइट की पहचान बनती है। इसकी शुरुआत नब्बे के दशक के आखिर में एक अकेली 16x16 पिक्सल फाइल favicon.ico से हुई थी, और लंबे समय तक कहानी इतनी ही थी। अब ऐसा नहीं है। आज वही छोटा लोगो ऊँचे रेज़ोल्यूशन वाले लैपटॉप के ब्राउज़र टैब में साफ दिखना चाहिए, बुकमार्क में, iPhone की होम स्क्रीन पर 180 पिक्सल पर, Android डिवाइस पर, इंस्टॉल होने वाले वेब ऐप के अंदर, और कभी-कभी खोज के नतीजों में आपकी पंक्ति के बगल में भी। इन सब जगहों को अलग नाप चाहिए, और कुछ जगह तो नाम भी तय मांगती हैं।</p>

  <p>इसी वजह से बस एक 16x16 चढ़ा दो वाली पुरानी सलाह आज धुँधली गड़बड़ी पैदा करती है। छोटी तस्वीर को 180 पिक्सल के होम-स्क्रीन आइकन तक बड़ा करो तो वो नरम और दानेदार दिखती है। सही तरीका यह है कि एक बड़ी, साफ तस्वीर से शुरू करो और उससे सही नाप वाली छोटी फाइलों का एक सेट बनाओ।</p>

  <h2>अब एक नाप क्यों काफी नहीं</h2>

  <p>अलग-अलग जगह अलग-अलग आइकन उठाती है। हर एक कहां जाता है यह समझ लो तो नीचे दी गई सूची बेवजह लगने के बजाय सीधी लगेगी:</p>

  <ul>
    <li><strong>ब्राउज़र टैब और बुकमार्क</strong> पुराना favicon लेते हैं, आम तौर पर 16x16 या 32x32, और आजकल की बारीक स्क्रीन पर 32 बेहतर रहता है।</li>
    <li><strong>iPhone और iPad की होम स्क्रीन</strong> 180x180 का apple-touch-icon लेते हैं, जब कोई आपका पन्ना अपनी होम स्क्रीन पर जोड़ता है।</li>
    <li><strong>Android और इंस्टॉल होने वाले वेब ऐप (PWA)</strong> 192x192 और 512x512 के आइकन लेते हैं, जो एक छोटी manifest फाइल में लिखे होते हैं।</li>
    <li><strong>Windows और ज़्यादा रेज़ोल्यूशन वाली स्क्रीन</strong> को बीच के नाप, जैसे 48, 64, 96, 128 और 256, फायदा देते हैं, ताकि आइकन को अपने असली नाप से दूर तक खींचना न पड़े।</li>
    <li><strong>खोज के नतीजे</strong> आपका favicon पन्ने के शीर्षक के बगल में दिखा सकते हैं, जो चुपके से हर पंक्ति पर आपके ब्रांड को मज़बूत करता है।</li>
  </ul>

  <h2>2026 में असल में जो नाप चाहिए</h2>

  <p>अंदाज़ा लगाने या सौ फाइलें बनाने की ज़रूरत नहीं। यह काम का सेट हर बड़े ब्राउज़र और डिवाइस को ढक लेता है, और बिल्कुल यही एक अच्छा जेनरेटर आपको देता है:</p>

  <table>
    <thead>
      <tr><th>फाइल</th><th>नाप</th><th>कहां दिखता है</th></tr>
    </thead>
    <tbody>
      <tr><td>favicon.ico</td><td>16, 32, 48 (एक ही फाइल में)</td><td>हर जगह चलने वाला सहारा: टैब, पता-पट्टी, बुकमार्क, पुराने ब्राउज़र</td></tr>
      <tr><td>favicon-16x16.png</td><td>16x16</td><td>छोटे टैब और बुकमार्क</td></tr>
      <tr><td>favicon-32x32.png</td><td>32x32</td><td>आजकल के डेस्कटॉप ब्राउज़र का आम टैब आइकन</td></tr>
      <tr><td>apple-touch-icon.png</td><td>180x180</td><td>iPhone और iPad की होम स्क्रीन</td></tr>
      <tr><td>android-chrome-192x192.png</td><td>192x192</td><td>Android की होम स्क्रीन और PWA इंस्टॉल</td></tr>
      <tr><td>android-chrome-512x512.png</td><td>512x512</td><td>Android की शुरुआती स्क्रीन और ऊँचे रेज़ोल्यूशन का PWA</td></tr>
      <tr><td>48, 64, 96, 128, 256 पिक्सल के PNG</td><td>कई</td><td>बारीक स्क्रीन और Windows, ताकि आइकन कम ही खिंचे</td></tr>
    </tbody>
  </table>

  <p>यानी कुल ग्यारह फाइलें: एक ICO, दस PNG, साथ में एक छोटी manifest और थोड़ा सा HTML। इन्हें हाथ से किसी इमेज एडिटर में बनाना उबाऊ है और गलती की गुंजाइश ज़्यादा। इन्हें एक ही कदम में बना लेना अगले हिस्से की पूरी बात है।</p>

  <h2>सबसे तेज़ तरीका: पूरा सेट एक साथ बनाओ</h2>

  <figure><img src="/static/images/tools/image-favicon-generator.jpg" alt="Convertica का favicon जेनरेटर एक तस्वीर को पूरे favicon सेट में बदलते हुए" width="1280" height="800" loading="lazy"></figure>

  <p>एक-एक नाप अलग बनाने के बजाय, एक अच्छी तस्वीर से शुरू करो और जेनरेटर को पूरा सेट बनाने दो। <a href="/hi/image/favicon-generator/">favicon जेनरेटर</a> के साथ रास्ता ऐसा है:</p>

  <ol>
    <li><a href="/hi/image/favicon-generator/">favicon जेनरेटर</a> खोलो और अपनी तस्वीर चढ़ा दो। PNG, JPG, WebP या SVG, सब चलते हैं, और SVG या कोई बड़ी PNG सबसे साफ नतीजा देती है।</li>
    <li>टूल आपकी तस्वीर को चौकोर में बीच से काटता है और हर नाप आपके लिए बना देता है: कई नाप वाली favicon.ico, 16 से 512 तक के PNG आइकन, 180 पिक्सल का apple-touch-icon, और 192 तथा 512 वाले Android आइकन।</li>
    <li>ZIP डाउनलोड करो। अंदर सारे आइकन मिलते हैं, PWA और Android के लिए तैयार site.webmanifest, और अपनी साइट में चिपकाने के लिए थोड़ा सा HTML।</li>
  </ol>

  <p>आपकी चढ़ाई हुई तस्वीर काम पूरा होने के बाद सर्वर से हटा दी जाती है, इसलिए जो लोगो आपने अभी सार्वजनिक नहीं किया वो कहीं रुका नहीं रहता। नतीजा: एक ही अपलोड से पूरा, मानकों के हिसाब से सही आइकन सेट, बिना किसी इमेज एडिटर के। और हां, यह पूरी तरह मुफ़्त है।</p>

  <h2>जो HTML आप चिपकाते हो, लाइन दर लाइन</h2>

  <p>Favicon तभी चलता है जब ब्राउज़र को पता हो कि उसे कहां ढूंढना है। जेनरेटर आपको इस तरह का हिस्सा देता है, जो आपके पन्नों के <code>&lt;head&gt;</code> के अंदर जाता है:</p>

  <pre><code>&lt;link rel="icon" type="image/x-icon" href="/favicon.ico"&gt;
  &lt;link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"&gt;
  &lt;link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"&gt;
  &lt;link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"&gt;
  &lt;link rel="manifest" href="/site.webmanifest"&gt;</code></pre>

  <p>लाइन दर लाइन, हर एक क्या करती है:</p>

  <ul>
    <li>पहली लाइन <strong>favicon.ico</strong> की तरफ इशारा करती है, वो सबका सहारा जिसे हर ब्राउज़र समझता है, पुराने वाले भी।</li>
    <li>दो PNG लाइनें नए ब्राउज़र को साफ <strong>32x32</strong> और <strong>16x16</strong> आइकन देती हैं और उन्हें स्क्रीन के हिसाब से सही वाला चुनने देती हैं।</li>
    <li><strong>apple-touch-icon</strong> वाली लाइन वही है जिसे iPhone और iPad लेते हैं जब कोई आपका पन्ना होम स्क्रीन पर सहेजता है, ताकि वो असली ऐप आइकन जैसा दिखे, धुँधले स्क्रीनशॉट जैसा नहीं।</li>
    <li><strong>manifest</strong> वाली लाइन उस फाइल की तरफ इशारा करती है, जहां से Android और इंस्टॉल होने वाले वेब ऐप अपने आइकन और बाकी ब्यौरा पढ़ते हैं।</li>
  </ul>

  <p>आइकन फाइलें और manifest अपनी साइट की जड़ में रखो, ताकि ऊपर लिखे रास्ते ठीक मिलें, बाकी ब्राउज़र खुद संभाल लेता है।</p>

  <h2>Web manifest किस काम का है</h2>

  <p>site.webmanifest एक छोटी टेक्स्ट फाइल है, जो आपकी साइट को इंस्टॉल होने वाले ऐप की तरह बताती है। Favicon के लिए इसका सबसे बड़ा काम है 192x192 और 512x512 वाले आइकन गिना देना, जिन्हें Android और इंस्टॉल होने वाले वेब ऐप होम स्क्रीन और शुरुआती स्क्रीन पर लेते हैं। अगर आप अपनी साइट को कभी इंस्टॉल होने लायक नहीं बनाना चाहते, तब भी manifest से कोई नुकसान नहीं और Android खुश रहता है। और अगर चाहते हो, तो यही दो आइकन चाहिए होते हैं, और जेनरेटर इन्हें आपके लिए भर देता है।</p>

  <h2>तस्वीर चुनना और तैयार करना</h2>

  <p>गुणवत्ता की सबसे बड़ी चाबी वही तस्वीर है जिससे आप शुरू करते हो। कुछ आदतें हर बने नाप को बेहतर बनाती हैं:</p>

  <ul>
    <li><strong>बड़ी और चौकोर से शुरू करो।</strong> 512x512 की तस्वीर, या कोई SVG, साफ तरह से छोटी होती है। छोटी तस्वीर हमेशा छोटी ही दिखेगी।</li>
    <li><strong>सादा रखो।</strong> Favicon अक्सर 16 पिक्सल पर दिखता है। बारीक ब्यौरा, पतली लकीरें और छोटे अक्षर उस नाप पर गायब हो जाते हैं। एक मोटा अक्षर, एक निशान या हल्का किया हुआ लोगो पूरे लोगो और उसकी लाइन से कहीं बेहतर पढ़ा जाता है।</li>
    <li><strong>गहरा अंतर रखो।</strong> आइकन को हल्की और गहरी, दोनों तरह की ब्राउज़र सजावट के सामने अलग दिखना है। निशान और उसके पीछे के रंग के बीच अच्छा अंतर उसे हर जगह पढ़ने लायक रखता है।</li>
    <li><strong>हाशिये का ध्यान रखो।</strong> निशान के आसपास थोड़ी जगह छोड़ो, ताकि कोई डिवाइस आइकन के कोने गोल करे तो वो कटे नहीं।</li>
  </ul>

  <p>अगर सोच रहे हो कि किस फ़ॉर्मैट से शुरू करें, तो <a href="/hi/blog/webp-vs-jpeg-vs-png-best-image-format/">WebP, JPEG या PNG</a> वाली गाइड सारे सौदे बताती है, और अगर सोच रहे हो कि चढ़ाए हुए लोगो का क्या होता है, तो <a href="/hi/blog/is-convertica-safe-pdf-file-security-privacy-explained/">Convertica आपकी फाइलें कैसे संभालता है</a> वाला लेख प्राइवेसी का पहलू समझाता है।</p>

  <h2>वो आम गलतियां जिनसे favicon टूटा रह जाता है</h2>

  <ul>
    <li><strong>सिर्फ favicon.ico भेजना।</strong> यह टैब ढक लेता है, पर iPhone की होम स्क्रीन या PWA इंस्टॉल नहीं। वो कमी apple-touch-icon और manifest के आइकन भरते हैं।</li>
    <li><strong>गलत रास्ते।</strong> अगर link वाली पंक्तियों का <code>href</code> उस जगह से मेल नहीं खाता जहां फाइलें असल में पड़ी हैं, तो ब्राउज़र कुछ नहीं दिखाता। आइकन साइट की जड़ में रखो, या रास्ते बदलकर मिला दो।</li>
    <li><strong>ब्राउज़र की याद को दोष देना।</strong> Favicon बहुत ज़िद से सहेजा जाता है। नया लगाने या बदलने के बाद, ज़ोर से रीफ़्रेश करना या निजी विंडो में एक चक्कर अक्सर वही नया आइकन दिखा देता है जिसे आम रीलोड छिपा रहा था।</li>
    <li><strong>छोटी तस्वीर से शुरू करना।</strong> छोटे लोगो को 180 या 512 पिक्सल तक खींचने से नरम, दानेदार आइकन बनता है। हमेशा अपने पास मौजूद सबसे बड़े साफ रूप से शुरू करो।</li>
  </ul>

  <h2>अक्सर पूछे जाने वाले सवाल</h2>

  <h3>क्या अब भी favicon.ico चाहिए, या PNG काफी है?</h3>
  <p>दोनों रखो। नए ब्राउज़र खुशी-खुशी PNG आइकन लेते हैं, लेकिन favicon.ico सबका सुरक्षित सहारा बना रहता है, और कुछ ब्राउज़र और टूल आज भी उसे साइट की जड़ में नाम से ढूंढते हैं। पूरे सेट में दोनों होते हैं, इसीलिए जेनरेटर PNG के साथ ICO भी बनाता है।</p>

  <h3>यहां ICO और PNG में फर्क क्या है?</h3>
  <p>ICO पुराना फ़ॉर्मैट है, जो एक ही फाइल के अंदर कई नाप (16, 32 और 48) रख सकता है, इसीलिए वो अकेले सहारे के रूप में इतना अच्छा चलता है। PNG एक फाइल में एक नाप रखता है, पर साफ, ऊँची गुणवत्ता और पारदर्शिता देता है, इसीलिए बड़े आइकन PNG होते हैं। दोनों चाहिए, हर एक अपना काम करता हुआ।</p>

  <h3>क्या पारदर्शी पीछे का रंग रख सकता हूं?</h3>
  <p>हां, और PNG इसे चलाता है। पारदर्शी पीठ आइकन को हल्की और गहरी, दोनों सजावट पर अपने आप बैठने देती है। बस ध्यान रखो कि निशान खुद में इतना अंतर रखता हो कि दोनों पर दिखता रहे।</p>

  <h3>मेरा नया favicon क्यों नहीं दिख रहा?</h3>
  <p>लगभग हमेशा ब्राउज़र की याद। ब्राउज़र favicon को बाकी चीज़ों से ज़्यादा देर पकड़े रहते हैं। ज़ोर से रीफ़्रेश करो, साइट निजी विंडो में खोलो, या आइकन फाइल का पता सीधे खोलकर देख लो कि वो चढ़ी है या नहीं। याद साफ होते ही नया आइकन दिखने लगता है।</p>

  <h3>क्या SEO के लिए favicon ज़रूरी है?</h3>
  <p>यह जगह तय करने वाला कारण नहीं, लेकिन favicon खोज के नतीजों में आपके शीर्षक के बगल में दिख सकता है, जो ब्रांड को मज़बूत करता है और क्लिक बढ़ा सकता है। यह छोटा, एक बार का काम है जिसका फायदा लंबे समय तक रहता है, इसलिए इसे छोड़ने की कोई वजह नहीं।</p>

  <h2>अपना favicon अभी बनाओ</h2>

  <p>अगर आपकी साइट बिना favicon के चल रही है, या बरसों पुराने धुँधले आइकन के साथ, तो इसे दो मिनट में ठीक करो। अपना लोगो <a href="/hi/image/favicon-generator/">favicon जेनरेटर</a> में चढ़ाओ, ZIP डाउनलोड करो, फाइलें साइट की जड़ में रखो, और HTML वाला हिस्सा चिपका दो। अगर पूरे सेट के बजाय सिर्फ एक फाइल चाहिए, तो <a href="/hi/image/png-to-ico/">PNG से ICO</a> और <a href="/hi/image/svg-to-ico/">SVG से ICO</a> वाले टूल वही एक काम करते हैं, और <a href="/hi/image/optimize/">इमेज ऑप्टिमाइज़र</a> पहले आपकी तस्वीर हल्की करने में मदद करता है।</p>
