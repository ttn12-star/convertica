excerpt_hi: "कोई साथी प्रस्तुति PDF में भेजता है और दो स्लाइड ठीक करने को कहता है। PDF एडिट होने के लिए नहीं बनी, इसलिए आपको वह वापस PowerPoint में चाहिए। उसे कैसे बदलें, नतीजा कब साफ़ आता है, और जिन स्लाइड को मरम्मत चाहिए उनका क्या करें।"
content_hi: |
  कोई साथी प्रस्तुति भेजता है, पर वह PDF बनकर आती है, और अब आपको दो आँकड़े बदलने और एक लोगो हटाकर दूसरा लगाना है। PDF इसलिए बनी है कि हर जगह एक जैसी दिखे, बदली जाने के लिए नहीं, इसलिए आप किसी स्लाइड पर दबाकर सीधे लिख नहीं सकते। PDF को वापस PowerPoint में बदल लेने से आपको फिर एडिट होने वाली स्लाइड मिल जाती हैं। यह कैसे करें, और साथ में साफ़-साफ़ यह भी कि नतीजा कब अच्छा आता है और कब उसे सँवारना पड़ता है।

  <h2>PDF एडिट क्यों नहीं होती</h2>

  <p>जब कोई PowerPoint की प्रस्तुति को PDF बनाता है, तो स्लाइड तय पन्नों में सपाट हो जाती हैं। अक्षर, आकार और तस्वीरें अपनी जगह जम जाते हैं, ताकि फ़ाइल किसी भी स्क्रीन पर एक जैसी दिखे। यह भेजने के लिए बढ़िया है और बदलने के लिए बेकार। वापस PowerPoint में बदलना उसी जमने को उलटने की कोशिश करता है: यह हर पन्ने को एक स्लाइड की तरह दोबारा खड़ा करता है और जमी हुई चीज़ों को वापस उन टेक्स्ट के डिब्बों और तस्वीरों में बदल देता है जिन्हें आप सरका और बदल सकते हैं।</p>

  <h2>एक ही बात तय करती है कि नतीजा कितना साफ़ होगा</h2>

  <p>हर PDF एक जैसी नहीं बदलती, और बात इस पर आती है कि वह PDF कैसे बनी थी।</p>

  <ul>
    <li><strong>PowerPoint, Keynote या Google Slides से बनी PDF</strong> अच्छी बदलती है। अक्षर असली, चुने जाने वाले अक्षर होते हैं, इसलिए वे बदले जाने लायक डिब्बों के रूप में लौटते हैं और ढाँचा मूल के करीब रहता है।</li>
    <li><strong>स्कैन की हुई PDF या स्लाइड की फ़ोटो</strong> तस्वीर है। लौटाने लायक असली अक्षर नहीं होते, इसलिए बदलना OCR के भरोसे रहता है और नतीजे को ज़्यादा सफ़ाई चाहिए। सजावट हाथ से ठीक करने की तैयारी रखिए।</li>
    <li><strong>भारी डिज़ाइन वाली PDF</strong>, अपने ही फ़ॉन्ट और पेचीदा ढाँचे के साथ, बदल तो जाएगी, पर फ़ॉन्ट बदल सकते हैं और चीज़ें खिसक सकती हैं, क्योंकि टूल जो मौजूद है उसी से दोबारा बना सकता है।</li>
  </ul>

  <p>झटपट जाँच वही पुरानी है: PDF में अक्षरों की एक लाइन चुनने की कोशिश कीजिए। अगर वह चुनी जाती है, तो हालत अच्छी है।</p>

  <h2>PDF को PowerPoint में बदलिए</h2>

  <figure><img src="/static/blog/images/tool-pdf-to-ppt.jpg" alt="Convertica का PDF से PowerPoint कन्वर्टर, बदलने के लिए तैयार फ़ाइल के साथ" width="1280" height="800" loading="lazy"></figure>

  <ol>
    <li><a href="/hi/pdf-to-ppt/">PDF से PowerPoint</a> कन्वर्टर खोलिए और अपनी फ़ाइल चढ़ाइए (25 MB तक)।</li>
    <li>उसे तैयार होने दीजिए। PDF का हर पन्ना एक स्लाइड बन जाता है।</li>
    <li>PPTX डाउनलोड कीजिए और उसे PowerPoint, Keynote या Google Slides में खोलिए। स्लाइड अब बदली जा सकती हैं।</li>
  </ol>

  <p>चढ़ाई गई फ़ाइलें थोड़ी देर बाद सर्वर से हटा दी जाती हैं, जो जानने लायक है अगर प्रस्तुति अंदरूनी या किसी क्लाइंट की हो।</p>

  <h2>बदलने के बाद स्लाइड सुधारना</h2>

  <p>अच्छे नतीजे को भी कभी हल्की मरम्मत चाहिए होती है, ख़ासकर सजी-धजी प्रस्तुतियों में:</p>

  <ul>
    <li><strong>फ़ॉन्ट बदल जाना।</strong> अगर कोई ख़ास फ़ॉन्ट फ़ाइल के अंदर नहीं था, तो PowerPoint सबसे मिलता-जुलता फ़ॉन्ट रख देता है। स्लाइड मास्टर से अपना फ़ॉन्ट दोबारा लगा दीजिए और वह पूरी प्रस्तुति में बह जाता है।</li>
    <li><strong>खिसकी हुई चीज़ें।</strong> कोई लोगो या टेक्स्ट का डिब्बा कुछ बिंदु इधर-उधर बैठ सकता है। उसे खींचकर जगह पर लाइए; सामग्री पूरी वहीं है, बस सीधी करनी है।</li>
    <li><strong>तस्वीर बन गए अक्षर।</strong> स्कैन की गई प्रस्तुतियों में कुछ अक्षर बदले जाने लायक टेक्स्ट के बजाय तस्वीर बनकर लौट सकते हैं। जो हिस्सा बदलना है उसे ऊपर से दोबारा लिख दीजिए।</li>
  </ul>

  <h2>कब बदलना ही नहीं चाहिए</h2>

  <p>अगर आपको स्लाइड सिर्फ़ दिखानी हैं, बदलनी नहीं, तो बदलना बेकार की मेहनत है। PDF अपने आप साफ़ दिखती है। और अगर किसी एक स्लाइड को तस्वीर की तरह किसी और दस्तावेज़ में डालना है, तो PDF को <a href="/hi/pdf-to-jpg/">PDF से JPG</a> टूल से तस्वीरों में बदल लेना पूरे PowerPoint के चक्कर से आसान है। PowerPoint में तभी बदलिए जब वाक़ई बदलाव करने हैं।</p>

  <h2>अक्सर पूछे जाने वाले सवाल</h2>

  <h3>चलती-फिरती सजावट और स्लाइड बदलने के असर वापस आएँगे?</h3>
  <p>नहीं। PDF ठहरे हुए पन्नों का सेट है, उसमें हिलने-डुलने की कोई जानकारी नहीं होती, इसलिए वह लौट ही नहीं सकती, वह कभी सहेजी ही नहीं गई थी। आपको बदली जाने वाली ठहरी स्लाइड मिलती हैं, और ज़्यादातर बदलावों को इतना ही चाहिए। सजावट ज़रूरी है तो भेजने वाले से मूल PPTX माँग लीजिए।</p>

  <h3>स्कैन की हुई प्रस्तुति PowerPoint में बदल सकता हूँ?</h3>
  <p>हाँ, टूल अक्षर पढ़ने के लिए OCR चलाता है, पर सटीकता स्कैन की हालत पर टिकी है और नतीजा ध्यान से देखना पड़ता है। सीधे PowerPoint से बनी फ़ाइल किसी भी स्कैन से हमेशा साफ़ बदलेगी।</p>

  <h3>मेरे फ़ॉन्ट क्यों बदल गए?</h3>
  <p>अगर मूल फ़ॉन्ट PDF के अंदर नहीं रखा गया था, तो वह फ़ाइल में ही नहीं है कि लौट सके, इसलिए PowerPoint कोई मिलता-जुलता फ़ॉन्ट रख देता है। PowerPoint में अपना फ़ॉन्ट दोबारा लगाने से यह झटपट ठीक हो जाता है।</p>

  <h3>फ़ाइल के साइज़ की कोई हद है?</h3>
  <p>एक फ़ाइल 25 MB तक हो सकती है, जो ज़्यादातर प्रस्तुतियों के लिए काफ़ी है। तस्वीरों से भरी PDF इससे बड़ी है, तो उसे पहले छोटा कर लेना आम तौर पर स्लाइड बिगाड़े बिना उसे हद के नीचे ले आता है।</p>

  <h3>मेरे कंप्यूटर पर PowerPoint होना ज़रूरी है?</h3>
  <p>बदलने के लिए नहीं। यह काम आपके ब्राउज़र में होता है और आपको PPTX फ़ाइल मिलती है, जो PowerPoint, Keynote, Google Slides या LibreOffice Impress में खुल जाती है।</p>

  <h2>अभी आज़माइए</h2>

  <p>जिस प्रस्तुति को बदलना है वह PDF में फँसी है, तो उसे <a href="/hi/pdf-to-ppt/">PDF से PowerPoint</a> कन्वर्टर पर चढ़ाइए और लौटकर आई स्लाइड खोल लीजिए। और काम पूरा होने पर उसे फिर एक तय फ़ाइल की तरह भेजना हो, तो <a href="/hi/ppt-to-pdf/">PowerPoint से PDF</a> चक्र पूरा कर देता है।</p>
