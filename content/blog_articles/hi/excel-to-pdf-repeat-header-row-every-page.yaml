content_hi: |
  आप किसी प्राइस लिस्ट या क्लास रजिस्टर की 30 पेज की PDF भेजते हैं और कुछ ही मिनट में जवाब आता है: "पेज 5 पर कौन सा कॉलम क्या है?" पहले पेज पर हेडर रो है। उसके बाद हर पेज पर बस अंकों की दीवार है, कोई लेबल नहीं।

  Excel हेडर रो को हर प्रिंट होने वाले पेज पर दोहरा सकता है, और Excel की नज़र में PDF भी एक प्रिंट किया हुआ पेज ही है। इस सेटिंग का नाम Print Titles है। इसमें लगभग तीस सेकंड लगते हैं, यह फ़ाइल के अंदर ही सेव होती है, और एक बार सेट हो जाए तो हर ठीक-ठाक PDF कन्वर्टर इसे मानता है।

  <h2>पहले वे दो तरीक़े जो काम नहीं करते</h2>

  <p><strong>Freeze Panes.</strong> लगभग हर कोई सबसे पहले यही आज़माता है, क्योंकि स्क्रीन पर यह बिल्कुल सही काम करता है: स्क्रॉल करते समय ऊपर की रो अपनी जगह टिकी रहती है। लेकिन Freeze Panes सिर्फ़ देखने की सेटिंग है। यह आपकी विंडो को कंट्रोल करती है, काग़ज़ को नहीं, इसलिए PDF इसे पूरी तरह अनदेखा कर देती है। आप रो 1 फ़्रीज़ कर दें, फिर भी हेडिंग सिर्फ़ पहले पेज पर ही आएगी।</p>

  <p><strong>रेंज को Table बना देना.</strong> Excel Table (Insert, Table) स्क्रॉल करते समय A, B, C अक्षरों की जगह आपके कॉलम के नाम दिखाती है। कहानी वही है: यह स्क्रीन की तरकीब है, प्रिंट में ये नाम नहीं दोहराए जाते।</p>

  <p>एक और चीज़ अक्सर उलझन पैदा करती है: <em>पेज हेडर</em> (Insert, Header &amp; Footer) बिल्कुल अलग चीज़ है। यह ऊपर के मार्जिन में लिखी एक लाइन होती है, जैसे रिपोर्ट का शीर्षक या पेज नंबर। यह हर पेज पर आती है, लेकिन इसमें आपके कॉलम के नाम कॉलम के ठीक ऊपर सीध में नहीं रखे जा सकते। आपको चाहिए शीट की अपनी एक <em>रो</em>, जो हर पेज पर दोहराई जाए।</p>

  <h2>Excel (Windows) में Print Titles सेट करें</h2>

  <ol>
    <li>शीट खोलें और <strong>Page Layout</strong> टैब पर जाएँ।</li>
    <li><strong>Print Titles</strong> पर क्लिक करें। Page Setup विंडो Sheet टैब पर खुलेगी।</li>
    <li><strong>Rows to repeat at top</strong> वाले बॉक्स में क्लिक करें, फिर शीट में अपनी हेडर रो के नंबर पर क्लिक करें। Excel अपने आप <code>$1:$1</code> भर देगा। अगर हेडर दो रो का है (मान लीजिए एक शीर्षक वाली रो और एक कॉलम के नामों वाली), तो दोनों पर ड्रैग करें, आपको <code>$1:$2</code> मिलेगा।</li>
    <li>अगर टेबल चौड़ी भी है और दाईं ओर अतिरिक्त पेजों पर फैल जाती है, तो <strong>Columns to repeat at left</strong> में भी यही करें, उस कॉलम के लिए जो हर रो की पहचान बताता है, जैसे ID या प्रोडक्ट का नाम।</li>
    <li>OK दबाएँ। File, Print में जाकर जाँचें: प्रीव्यू का पेज 2 अब आपकी हेडर रो से शुरू होना चाहिए।</li>
  </ol>

  <p>यह सेटिंग वर्कबुक में सेव होती है, इसलिए सेट करने के बाद फ़ाइल सेव ज़रूर करें। बाद में PDF में बदलते समय यही बात काम आती है।</p>

  <h2>Mac वाला Excel</h2>

  <p>तरीक़ा वही, रास्ता थोड़ा अलग: <strong>Page Layout</strong> टैब, फिर <strong>Print Titles</strong>, फिर वही Rows to repeat at top वाला बॉक्स। पुराने Mac वर्ज़न में यह File, Page Setup, Sheet के अंदर मिलता है। फ़ाइल में नतीजा बिल्कुल एक जैसा होता है।</p>

  <h2>Google Sheets</h2>

  <p>Sheets इस सुविधा को फ़्रीज़ से जोड़ता है, इसलिए सिर्फ़ यहीं फ़्रीज़ करना सच में मदद करता है। हेडर रो फ़्रीज़ करें (View, Freeze, 1 row), फिर File, Print खोलें। <strong>Headers &amp; footers</strong> के नीचे <strong>Repeat frozen rows</strong> पर टिक करें। उसी प्रिंट स्क्रीन से PDF डाउनलोड करें।</p>

  <p>अगर आप शीट को .xlsx के रूप में डाउनलोड करके कहीं और बदलते हैं, तो पहले Excel या Calc में Print Titles सेट करें। एक्सपोर्ट करने पर फ़्रीज़ की गई रो अपने आप Print Titles नहीं बनतीं।</p>

  <h2>LibreOffice Calc</h2>

  <p><strong>Format, Print Ranges, Edit</strong> पर जाएँ। <strong>Rows to repeat</strong> में "user defined" चुनें और <code>$1</code> लिखें (दो रो के लिए <code>$1:$2</code>)। Calc इसे .xlsx फ़ाइल में सही Excel Print Titles के रूप में सेव करता है, इसलिए सेटिंग फ़ाइल के साथ ही जाती है।</p>

  <h2>कई टैब वाली वर्कबुक</h2>

  <p>Print Titles पूरी वर्कबुक की नहीं, एक शीट की सेटिंग है। अगर आपकी फ़ाइल में हर महीने का अलग टैब है, तो हर टैब में अलग से सेट करना होगा, और हर टैब में अलग रो भी दोहराई जा सकती है। इसी वजह से कभी-कभी जनवरी में हेडर हर पेज पर दिखता है और फ़रवरी में सिर्फ़ पहले पेज पर।</p>

  <p>बारह टैब निपटाने का आसान तरीक़ा: पहली शीट पर एक बार सेट करें, फिर बाकी शीटों पर दोहराएँ। Excel में Print Titles के लिए "सभी शीटों पर लागू करें" जैसा कोई बटन नहीं है, शीटों को ग्रुप करने पर भी नहीं, इसलिए बड़ी वर्कबुक के लिए एक मिनट अलग रखें।</p>

  <h2>फ़ाइल को PDF में बदलना</h2>

  <p>एक बार Print Titles फ़ाइल में सेव हो जाएँ, तो आप उसे किसी भी तरह बदल सकते हैं। हमने इसे <a href="/hi/excel-to-pdf/">Excel to PDF कन्वर्टर</a> पर 120 रो की एक टेबल से जाँचा जो तीन पेजों में फैली थी: Print Titles सेट होने पर तीनों पेज हेडर रो से शुरू हुए, और बिना इसके सिर्फ़ पहला पेज। यह कन्वर्टर डिफ़ॉल्ट रूप से चौड़ी टेबल को एक पेज की चौड़ाई में भी रखता है, यानी जो हेडर दोहराया जा रहा है वह पढ़ने लायक भी रहता है।</p>

  <p>अगर आप Excel का अपना तरीक़ा पसंद करते हैं, तो File, Save As, PDF भी चलता है। बस वहाँ Options बटन देख लें: डिफ़ॉल्ट रूप से Excel सिर्फ़ सक्रिय शीट सेव करता है, इसलिए कई टैब वाली वर्कबुक के लिए "Entire workbook" चुनना होगा।</p>

  <h2>अगर हेडर फिर भी नहीं दोहराया जा रहा</h2>

  <ul>
    <li><strong>सेटिंग किसी दूसरी शीट पर है।</strong> जिस टैब को आप सच में बदल रहे हैं उस पर क्लिक करें और Print Titles फिर से खोलें। बॉक्स खाली है तो वहाँ कुछ सेट ही नहीं है।</li>
    <li><strong>फ़ाइल .csv के रूप में सेव हुई थी।</strong> CSV सिर्फ़ वैल्यू रखती है: न Print Titles, न कॉलम की चौड़ाई, कुछ भी नहीं। .xlsx में सेव करें।</li>
    <li><strong>आपने पुरानी .xls फ़ाइल बदली।</strong> Print Titles वहाँ भी काम करते हैं, लेकिन अगर कोई टूल गड़बड़ करे, तो फ़ाइल खोलकर पहले .xlsx में सेव कर लें। इसमें कुछ नहीं जाता।</li>
  </ul>

  <h2>अक्सर पूछे जाने वाले सवाल</h2>

  <h3>क्या पहले से बनी PDF में हेडर रो दोहराई जा सकती है?</h3>
  <p>असल में नहीं। PDF पेजों को वैसे ही रखती है जैसे वे बनाए गए थे, उसके अंदर "यह रो दोहराओ" जैसी कोई चीज़ होती ही नहीं। स्प्रेडशीट पर वापस जाएँ, Print Titles सेट करें और फिर से बदलें। अगर आपके पास सिर्फ़ PDF है, तो पहले उसे <a href="/hi/pdf-to-excel/">वापस Excel में बदलें</a>, वहाँ ठीक करें, फिर एक्सपोर्ट करें।</p>

  <h3>क्या हर पेज पर अलग हेडर हो सकता है?</h3>
  <p>एक शीट के अंदर नहीं: दोहराई जाने वाली रो हर पेज पर एक जैसी होती हैं। अलग शीर्षक वाली टेबलों को अलग-अलग शीट पर रखें और हर शीट के अपने Print Titles सेट करें।</p>

  <h3>क्या Freeze Panes कभी PDF पर असर डालता है?</h3>
  <p>Excel और Calc में नहीं। Google Sheets में सिर्फ़ तब, जब आप प्रिंट सेटिंग में "Repeat frozen rows" पर टिक करते हैं।</p>

  <h3>चौड़ी टेबल में पहला कॉलम हर पेज पर कैसे रखें?</h3>
  <p>उसी Print Titles विंडो में <strong>Columns to repeat at left</strong> का इस्तेमाल करें। यह बिल्कुल रो वाले विकल्प की तरह काम करता है, बस बगल की दिशा में।</p>

  <h3>क्या बनी हुई PDF में मेरे फ़िल्टर और छिपी रो बनी रहेंगी?</h3>
  <p>छिपी रो छिपी ही रहती हैं, और आमतौर पर आप यही चाहते हैं। PDF में फ़िल्टर बटन होते ही नहीं: फ़ाइल सेव करते समय जो रो दिख रही थीं, वही आपको मिलेंगी।</p>

  <h2>आज़माकर देखें</h2>

  <p>Print Titles सेट करें, सेव करें और फ़ाइल को <a href="/hi/excel-to-pdf/">Excel to PDF कन्वर्टर</a> में डालें। अगर टेबल पेज के किनारे से बाहर भी निकल रही है या उसमें खाली पेज जुड़ रहे हैं, तो <a href="/hi/blog/excel-to-pdf-cut-off-blank-pages-fix/">Excel से PDF में कटते कॉलम</a> वाली हमारी गाइड बाकी सब बताती है, और <a href="/hi/blog/convert-excel-to-pdf-keep-formatting/">PDF में Excel की फ़ॉर्मेटिंग बनाए रखने</a> वाले लेख में पूरी चेकलिस्ट है।</p>
