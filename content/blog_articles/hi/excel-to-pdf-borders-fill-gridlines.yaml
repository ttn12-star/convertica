meta_title_hi: "Excel से PDF में मोटे बॉर्डर? पतली लाइन, बिना फ़िल"
meta_description_hi: "PDF में सेल बॉर्डर स्क्रीन से ज़्यादा मोटे दिखते हैं, फ़िल कलर स्याही खाते हैं, ग्रिडलाइन ग़ायब हो जाती हैं। मापी गई लाइन की मोटाई और हर एक की सेटिंग।"
