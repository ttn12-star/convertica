content_hi: |
  स्क्रीन हर बॉर्डर को एक पिक्सेल का बनाती है, स्टाइल चाहे जो हो। काग़ज़ और PDF उसे उसकी असली मोटाई में बनाते हैं। इसलिए जो टेबल Excel में नाज़ुक दिखती है, वह PDF में ऐसी निकल सकती है जैसे स्केच पेन से ग्रिड खींचा हो, और इसमें कुछ भी ख़राब नहीं है: आप बस बॉर्डर स्टाइल की वही मोटाई देख रहे हैं जो उसकी हमेशा से थी।

  हमने मापा कि <a href="/hi/excel-to-pdf/">Excel to PDF कन्वर्टर</a> में बदलने पर हर स्टाइल कितना मोटा बनता है, और फिर उसी हिसाब से समाधान निकाले।

  <h2>हर बॉर्डर स्टाइल असल में कितना मोटा प्रिंट होता है</h2>

  <ul>
    <li><strong>Hairline</strong> (सबसे पतला स्टाइल): लगभग 0.1 pt। लगभग उतनी पतली, जितनी पतली लाइन कोई प्रिंटर बना सकता है।</li>
    <li><strong>Thin</strong> (Borders बटन दबाने पर यही लगता है): 0.75 pt। लोग जिसे "bold" कहते हैं, वह यही है।</li>
    <li><strong>Medium</strong>: 1.75 pt, thin लाइन से दोगुने से भी ज़्यादा।</li>
  </ul>

  <p>तुलना के लिए, किसी छपी किताब में टेबल की लाइन आमतौर पर 0.25 से 0.5 pt की होती है। यानी Excel का डिफ़ॉल्ट बॉर्डर ज़्यादातर छपी टेबलों से भारी है, और घनी शीट में जब हर सेल के चारों ओर लाइन हो तो यह असर और बढ़ जाता है।</p>

  <h2>लाइनें पतली करें: hairline स्टाइल लगाएँ</h2>

  <ol>
    <li>टेबल चुनें।</li>
    <li>राइट-क्लिक करें, <strong>Format Cells</strong>, फिर <strong>Border</strong> टैब।</li>
    <li><strong>Style</strong> लिस्ट में "None" के नीचे वाली पहली लाइन चुनें। स्क्रीन पर यह बारीक बिंदुओं वाली लाइन जैसी दिखती है; यही hairline है, और प्रिंट में यह एक सीधी, बहुत पतली लाइन बनती है।</li>
    <li><strong>Outline</strong> और <strong>Inside</strong> पर क्लिक करें (या सिर्फ़ वे किनारे जो आपको चाहिए), फिर OK।</li>
  </ol>

  <p>एक आम बीच का रास्ता जो काग़ज़ पर अच्छा लगता है: टेबल के अंदर hairline, और बाहर की ओर व हेडर रो के नीचे thin।</p>

  <h2>ग्रिडलाइन: प्रिंट करें या नहीं</h2>

  <p>Excel में दिखने वाली हल्की ग्रे ग्रिडलाइन बॉर्डर नहीं हैं, और डिफ़ॉल्ट रूप से प्रिंट नहीं होतीं। अगर आपकी टेबल में बॉर्डर नहीं हैं, तो PDF में कोई लाइन होगी ही नहीं, और यह बहुत लोगों को चौंकाता है।</p>

  <p>इन्हें प्रिंट करने के लिए: <strong>Page Layout</strong> टैब, <strong>Sheet Options</strong> ग्रुप, Gridlines के नीचे <strong>Print</strong> पर टिक करें। हमारी जाँच में ये 0.1 pt की लाइन बनकर आती हैं, hairline बॉर्डर जितनी, इसलिए बड़ी शीट पर हल्का ग्रिड पाने का यह सबसे तेज़ तरीक़ा है। कन्वर्टर इस सेटिंग को मानता है।</p>

  <p>उल्टा चाहिए, बिना किसी लाइन वाली साफ़ शीट? पक्का करें कि Gridlines के नीचे Print पर टिक न हो और सेल में कोई बॉर्डर न हो।</p>

  <h2>फ़िल कलर और रंगीन टेक्स्ट</h2>

  <p>फ़िल स्क्रीन पर और रंगीन PDF में अच्छे लगते हैं, लेकिन स्याही खाते हैं और ब्लैक एंड व्हाइट प्रिंटर पर धुंधले ग्रे बन सकते हैं। इनसे निपटने के दो तरीक़े:</p>

  <ul>
    <li><strong>Excel का अपना black-and-white मोड.</strong> Page Layout, Page Setup, <strong>Sheet</strong> टैब, <strong>Black and white</strong> पर टिक करें। इसके बाद जब आप Excel में File, Save As, PDF करते हैं, तो फ़िल हट जाते हैं और टेक्स्ट काला छपता है, जबकि फ़ाइल में रंग वैसे ही बने रहते हैं।</li>
    <li><strong>ऑनलाइन कन्वर्टर के लिए फ़िल को ही हटा दें.</strong> हमने अपने कन्वर्टर पर black-and-white सेटिंग की जाँच की और वह लागू नहीं होती: फ़िल और रंगीन टेक्स्ट PDF में बने रहते हैं। इसलिए अगर आप ऑनलाइन बदलते हैं, तो शीट की एक कॉपी बनाएँ, टेबल चुनें, Home, <strong>Fill Color</strong>, <strong>No Fill</strong>, और फ़ॉन्ट का रंग Automatic कर दें। फिर उस कॉपी को बदलें।</li>
  </ul>

  <h2>लाइनें सिर्फ़ आपके PDF व्यूअर में मोटी दिखती हैं</h2>

  <p>कभी-कभी PDF ठीक होती है और व्यूअर बढ़ा-चढ़ाकर दिखाता है। Adobe Acrobat और Reader में एक सेटिंग है, Preferences, Page Display, <strong>Enhance thin lines</strong>, जो हर ज़ूम पर हर पतली लाइन को कम से कम एक पिक्सेल मोटा बनाती है। तब 50% ज़ूम पर hairline वाला पेज भी ऐसा लगता है जैसे मार्कर से बना हो। 100% पर ज़ूम करें या यह विकल्प हटा दें: अगर लाइनें बारीक हो जाएँ, तो फ़ाइल शुरू से ठीक थी। प्रिंट करने पर इस सेटिंग का कोई असर नहीं होता।</p>

  <h2>और क्या लाइनों को मोटा करता है</h2>

  <ul>
    <li><strong>100% से ज़्यादा प्रिंट स्केलिंग.</strong> अगर Page Setup में Adjust to 120% है, तो हर बॉर्डर भी 20% मोटा हो जाता है। पेज की चौड़ाई में फ़िट करने से शीट आमतौर पर छोटी होती है, जिससे लाइनें पतली होती हैं, मोटी नहीं।</li>
    <li><strong>जहाँ दो सेल मिलते हैं वहाँ दोहरे बॉर्डर.</strong> अगर एक सेल पर दायाँ बॉर्डर है और उसके पड़ोसी पर बायाँ, तो दोनों एक के ऊपर एक बनते हैं। आमतौर पर इससे नुक़सान नहीं होता, लेकिन medium स्टाइल पर यह ज़्यादा भारी दिखता है। सेल दर सेल लगाने के बजाय पूरी रेंज पर एक साथ बॉर्डर लगाएँ।</li>
    <li><strong>पतले कॉलम.</strong> लाइनें मोटी नहीं होतीं, पर टेबल भरी-भरी लगती है: जब टेक्स्ट मुश्किल से समाता है, तो लाइनें भारी महसूस होती हैं। कॉलम थोड़े चौड़े करने से पढ़ना भी आसान होता है और लुक भी सुधरता है।</li>
  </ul>

  <h2>अक्सर पूछे जाने वाले सवाल</h2>

  <h3>Excel के print preview में बॉर्डर ठीक दिखे, पर PDF में भारी क्यों?</h3>
  <p>Print preview आपकी स्क्रीन में फ़िट होने के लिए छोटा किया जाता है, इसलिए 0.75 pt की लाइन एक पिक्सेल की रह जाती है। 100% ज़ूम पर PDF असली मोटाई दिखाती है। PDF को उतने ही साइज़ तक ज़ूम आउट करें, दोनों एक जैसे दिखेंगे।</p>

  <h3>क्या पहले से बनी PDF में बॉर्डर पतले किए जा सकते हैं?</h3>
  <p>किसी व्यावहारिक तरीक़े से नहीं: लाइनें पेज में बन चुकी हैं। स्प्रेडशीट में बॉर्डर स्टाइल बदलें और फिर से बदलें।</p>

  <h3>क्या कन्वर्टर मेरे बॉर्डर के रंग बनाए रखता है?</h3>
  <p>हाँ। बॉर्डर के रंग, फ़िल और फ़ॉन्ट के रंग वैसे ही रहते हैं जैसे फ़ाइल में हैं।</p>

  <h3>क्या hairline बॉर्डर सस्ते प्रिंटर पर दिखेंगे?</h3>
  <p>हाँ। 0.1 pt पर लेज़र या इंकजेट प्रिंटर अपनी सबसे पतली लाइन बनाता है, जो फिर भी साफ़ दिखती है। अगर आपको ऐसी लाइनें चाहिए जो फ़ैक्स या फ़ोटोकॉपी के बाद भी बची रहें, तो thin इस्तेमाल करें।</p>

  <h2>आज़माकर देखें</h2>

  <p>बॉर्डर को hairline पर करें, ग्रिडलाइन और फ़िल के बारे में तय करें, सेव करें और <a href="/hi/excel-to-pdf/">Excel to PDF कन्वर्टर</a> से बदलें। अगर टेबल पेज से बाहर भी निकल रही है या उसमें खाली पेज जुड़ रहे हैं, तो देखें <a href="/hi/blog/excel-to-pdf-cut-off-blank-pages-fix/">Excel से PDF में कटते कॉलम</a>, और लंबी टेबल के लिए <a href="/hi/blog/excel-to-pdf-repeat-header-row-every-page/">हेडर रो हर पेज पर दोहराना</a>।</p>
