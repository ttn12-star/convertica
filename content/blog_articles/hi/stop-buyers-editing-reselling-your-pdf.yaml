content_hi: |
  देर-सबेर डिजिटल फ़ाइल बेचने वाला हर कोई वही सवाल पूछता है, आम तौर पर अपना प्लानर किसी और की साइट पर पाने के बाद: लोगों को इसे बदलने से कैसे रोकूँ, और दोबारा बेचने से कैसे रोकूँ?

  ईमानदार जवाब असुविधाजनक है, पर काम का। कुछ सुरक्षाएँ सचमुच काम करती हैं, और वे जो हल करती हैं वह असली समस्या है, चोरी नहीं। बाकी सुरक्षा जैसी दिखती हैं और असल में विनम्र निवेदन के करीब हैं। और PDF फ़ॉर्मैट में कुछ भी ऐसा नहीं जो स्क्रीनशॉट बटन वाले इंसान को रोक दे। इन तीन ढेरों को अलग-अलग रखना उन उपायों पर बर्बाद होने वाला वीकेंड बचाता है जो कुछ नहीं बचाते, और उस मुट्ठी भर की ओर ले जाता है जो वसूल हो जाती है।

  <h2>PDF के दो तरह के पासवर्ड और अंतर क्यों मायने रखता है</h2>

  <p>PDF दशकों से दो बिल्कुल अलग पासवर्ड सहारे देता है, और सुरक्षा के बारे में लगभग पूरी उलझन उन्हें एक ही चीज़ मान लेने से पैदा होती है।</p>

  <table>
    <thead>
      <tr><th></th><th>खोलने वाला पासवर्ड</th><th>owner पासवर्ड</th></tr>
    </thead>
    <tbody>
      <tr><td>और भी कहते हैं</td><td>दस्तावेज़ पासवर्ड, user password</td><td>अनुमति पासवर्ड, मास्टर पासवर्ड</td></tr>
      <tr><td>क्या करता है</td><td>फ़ाइल एन्क्रिप्ट करता है। इसके बिना सामग्री पढ़ी ही नहीं जा सकती</td><td>ऐसे फ़्लैग लिखता है जो रीडर से छपाई, कॉपी या एडिट सीमित करने का निवेदन करते हैं</td></tr>
      <tr><td>किससे लागू होता है</td><td>गणित से</td><td>पढ़ने वाले प्रोग्राम की सद्भावना से</td></tr>
      <tr><td>किस काम का है</td><td>एक व्यक्ति को गोपनीय दस्तावेज़ भेजना</td><td>जिस फ़ाइल को पढ़ा जाना है, उसकी लापरवाह एडिटिंग हतोत्साहित करना</td></tr>
      <tr><td>पैसे वाली डाउनलोड के लिए</td><td>नहीं। खरीदार को उसे खोलना है</td><td>बस नाममात्र, स्पीड ब्रेकर की तरह</td></tr>
    </tbody>
  </table>

  <p>यहाँ आख़िरी पंक्ति ही असली है। खोलने वाला पासवर्ड असली एन्क्रिप्शन है, पर उसे प्रोडक्ट पर लगाया नहीं जा सकता: खरीदार को फ़ाइल खोलनी है, यानी पासवर्ड उसे देना पड़ेगा, और तब सुरक्षा बची नहीं। <a href="/hi/blog/password-protect-pdf-before-emailing/">PDF पासवर्ड असल में क्या बचाता है</a> वाली हमारी नोट दोनों किस्मों में गहरे जाती है, अगर आप गोपनीय दस्तावेज़ भी भेजते हैं।</p>

  <p>owner पासवर्ड वही है जो लोग "एडिट पर रोक" कहते समय सोचते हैं। वह फ़ाइल में अनुमति के फ़्लैग लिखता है, और हर शालीन रीडर उन्हें मानता है। "शालीन" शब्द पूरा वाक्य अपने कंधों पर ढो रहा है। फ़्लैग सामग्री का एन्क्रिप्शन नहीं, उससे नत्थी एक पर्ची हैं। जो रीडर पर्ची को अनदेखा करने का फ़ैसला करते हैं, वे चुटकी में मिल जाते हैं, इसीलिए <a href="/hi/blog/unlock-pdf-remove-password/">PDF से पाबंदियाँ हटाना</a> मौजूद है और चलता है।</p>

  <h2>अनुमतियाँ असल में क्या देती हैं</h2>

  <p>तो अनुमतियाँ बेकार हैं? नहीं, पर उनका मूल्य वह नहीं जिसकी ज़्यादातर लोग अपेक्षा करते हैं। <a href="/hi/pdf-security/protect/">PDF की अनुमतियाँ सेट करना</a> भरोसे से तीन चीज़ें हासिल करता है:</p>

  <ul>
    <li><strong>रोज़मर्रा की दुर्घटना रोकता है।</strong> खरीदार आपका प्लानर खोलता है, कहीं क्लिक करता है, टेक्स्ट ब्लॉक 3 मिमी खिसका देता है और फिर आपसे पूछता है कि आपकी फ़ाइल क्यों खराब है। यह असली और बार-बार आने वाला सपोर्ट खर्च है।</li>
    <li><strong>इरादा दर्ज करता है।</strong> जिसने पाबंदी हटाई, उसने जानते-बूझते कोई अड़चन पार की। विवाद में यह "फ़ाइल खुली थी, तो मैंने मान लिया कि कर सकता हूँ" से बिल्कुल अलग स्थिति है।</li>
    <li><strong>आलसियों को छानता है।</strong> जो लोग लापरवाही से फ़ाइल दोबारा इस्तेमाल कर लेते, उनमें से ज़्यादातर टूल ढूँढने नहीं जाएँगे। यह हिस्सा उतना बड़ा नहीं जितना आप चाहेंगे, पर शून्य भी नहीं।</li>
  </ul>

  <p>जो वे नहीं करतीं, वह है सामग्री की सुरक्षा। जो फ़ाइल पढ़ सकता है वह स्क्रीनशॉट ले सकता है, और जो छाप सकता है वह नई PDF में छाप सकता है। अनुमतियों को स्पीड ब्रेकर मानिए, मेहनत उसी हिसाब से लगाइए, और खरीदार को कभी न लिखिए कि फ़ाइल कॉपी "नहीं की जा सकती"।</p>

  <h2>फ़्लैटन: वह सुरक्षा जो सचमुच काम आती है</h2>

  <p>बेचने से पहले फ़ाइल के साथ अगर एक ही काम करना हो, तो <a href="/hi/pdf-edit/flatten/">उसे फ़्लैटन कीजिए</a>। लेयर, फ़ॉर्म फ़ील्ड, एनोटेशन और जीवित टेक्स्ट ऑब्जेक्ट, ये सब वे चीज़ें हैं जिन्हें खरीदार खिसका सकता है। फ़्लैटन उन्हें स्थिर पेज सामग्री में मिला देता है, और नतीजा जल्दी खुलता है और उन अजीब रीडरों में भी अंदाज़े के मुताबिक छपता है जिन्हें लोग असल में इस्तेमाल करते हैं।</p>

  <p>बस, यह क्या है, इसे ठीक-ठीक कहिए। फ़्लैटन फ़ाइल की सफ़ाई है, कॉपीराइट की पहरेदारी नहीं। वह दुर्घटना रोकता है, कॉपी नहीं। और प्रिंट क्वालिटी वह घटाता नहीं: लेयर और इंटरैक्टिव तत्व तस्वीरों को दोबारा सैंपल किए बिना मिलते हैं, इसलिए कुछ धुँधला नहीं होता। क्वालिटी कंप्रेशन से जाती है, और वह अलग फ़ैसला है।</p>

  <p>एक चेतावनी जानने लायक: अगर आपका प्रोडक्ट स्क्रीन पर भरने के लिए बना है, भरा जाने वाला प्लानर या फ़ॉर्म, तो उसे फ़्लैटन न करें। आप उसकी ख़ूबी ही हटा देंगे। भरने वाली वर्ज़न जैसी है वैसी बेचें, और अगर छपाई वाली भी देते हैं, तो उसे फ़्लैटन करें।</p>

  <h2>वॉटरमार्क: प्रीव्यू पर काम का, प्रोडक्ट पर असहज</h2>

  <p>वॉटरमार्क वह एक उपाय है जिसका मूल्य पूरी तरह इस पर टिका है कि वह किस फ़ाइल पर पड़ा।</p>

  <ul>
    <li><strong>प्रीव्यू पेजों पर वह ठीक जगह है।</strong> रीडिंग लायक निशान के साथ वर्कबुक के दो अंदर के पेज दिखाइए और मार्केटिंग का फ़ायदा मिल जाता है, प्रोडक्ट दिए बिना। <a href="/hi/pdf-edit/add-watermark/">वॉटरमार्क जोड़ना</a> एक मिनट का काम है, और <a href="/hi/blog/watermark-pdf-confidential-draft/">जगह और पारदर्शिता</a> वाली नोट बताती है कि उसे पढ़ने लायक कैसे रखें, डिज़ाइन दफ़न किए बिना।</li>
    <li><strong>पैसे वाले फ़ाइल पर दो बार सोचिए।</strong> जिस प्रोडक्ट के पैसे दिए गए, उस पर दिखने वाला निशान अविश्वास की तरह पढ़ा जाता है और उस पोस्टर को बिगाड़ देता है जिसे दीवार पर लगाना था। जो विक्रेता ऐसा करते हैं, उन्हें रिव्यू में यही लिखा जाता है।</li>
    <li><strong>व्यक्तिगत निशान अलग औज़ार है।</strong> खरीदार का नाम या ऑर्डर नंबर उसकी कॉपी पर छापना साझा करने की इच्छा सचमुच घटाता है, क्योंकि लीक हुई फ़ाइल एक व्यक्ति की ओर इशारा करती है। पर इसके लिए हर ऑर्डर पर फ़ाइल बनानी पड़ती है, यानी डिलीवरी सिस्टम, कोई चेकबॉक्स नहीं। महँगी फ़ाइलों के लिए वाजिब, तीन डॉलर के प्लानर के लिए ज़्यादा।</li>
  </ul>

  <h2>दोबारा बिक्री असल में क्या घटाता है</h2>

  <p>ऊपर का कोई तकनीकी उपाय दोबारा बिक्री नहीं रोकेगा। ये घटाते हैं, जितना कुछ भी घटा सकता है:</p>

  <ol>
    <li><strong>फ़ाइल के अंदर लाइसेंस पेज।</strong> एक पेज, सरल भाषा में: खरीदार क्या कर सकता है, क्या नहीं, व्यावसायिक उपयोग शामिल है या नहीं, और आपसे संपर्क कैसे करें। इस सूची में यह सबसे कीमती चीज़ है। यह ईमानदार उलझन सुलझाता है, जो समस्या का बड़ा हिस्सा है, और यही वह दस्तावेज़ है जिस पर आप कॉपी की शिकायत करते समय उँगली रखते हैं।</li>
    <li><strong>फ़ुटर में आपका नाम और दुकान का पता।</strong> सुरक्षा के तौर पर नहीं, श्रेय के तौर पर। आपके नाम के साथ घूमती फ़ाइल वह मार्केटिंग है जिसके पैसे आपने नहीं दिए, और स्रोत साफ़ हो जाता है।</li>
    <li><strong>प्लैटफ़ॉर्म की शिकायत प्रक्रिया।</strong> मार्केटप्लेस उल्लंघन करने वाले लिस्टिंग हटाते हैं, और तब तेज़ी से करते हैं जब आप अपनी लिस्टिंग की तारीख़ और लाइसेंस की शर्तें दिखा सकें। नीरस और असरदार।</li>
    <li><strong>कॉपी को असल से कम आकर्षक बनाना।</strong> मुफ़्त अपडेट, वर्ज़न इतिहास, अतिरिक्त नाप, सपोर्ट। चोरी की फ़ाइल एक स्नैपशॉट है, जीवित प्रोडक्ट नहीं।</li>
  </ol>

  <p>एक रणनीतिक बात भी है जो गुस्से में आसानी से छूट जाती है। सस्ती डिजिटल फ़ाइल बाँटने वाले ज़्यादातर लोग उसे कभी खरीदने ही नहीं वाले थे, और उनसे लड़ने में लगी मेहनत वह मेहनत है जो लिस्टिंग, तस्वीरों या अगले प्रोडक्ट में नहीं लगी। सुरक्षा पर एक तय, छोटा हिस्सा रखिए और आगे बढ़िए।</p>

  <h2>और असली DRM?</h2>

  <p>असली DRM, जहाँ फ़ाइल घर फ़ोन करती है और उसे रद्द किया जा सकता है, मौजूद है और महँगी कॉर्पोरेट तथा शैक्षणिक सामग्री के लिए इस्तेमाल होता है। उसके लिए प्लैटफ़ॉर्म, लाइसेंस सर्वर और ऐसा रीडर चाहिए जो खरीदार को इंस्टॉल करना पड़े। प्रिंटेबल, टेम्प्लेट या वर्कबुक के लिए वह अपनी ही शर्तों पर गिर जाता है: आपका खरीदार इसे घर के प्रिंटर पर छापना चाहता है, और जो भी फ़ॉर्मैट छापने देता है वह रखने भी देता है। ऐसा प्लगइन न खोजें जो उलटा वादा करे।</p>

  <h2>समझदार डिफ़ॉल्ट</h2>

  <table>
    <thead>
      <tr><th>प्रोडक्ट</th><th>क्या करें</th></tr>
    </thead>
    <tbody>
      <tr><td>प्रिंटेबल प्लानर, वॉल आर्ट, वर्कशीट</td><td>फ़्लैटन, लाइसेंस पेज, फ़ुटर में श्रेय। पासवर्ड छोड़ दें</td></tr>
      <tr><td>भरा जाने वाला फ़ॉर्म या डिजिटल प्लानर</td><td>फ़्लैटन न करें। लाइसेंस पेज, ढाँचे की छेड़छाड़ रोकने के लिए अनुमतियाँ</td></tr>
      <tr><td>लिस्टिंग के प्रीव्यू पेज</td><td>वॉटरमार्क, कम रिज़ॉल्यूशन, सिर्फ़ कुछ पेज</td></tr>
      <tr><td>महँगा टेम्प्लेट या कोर्स की वर्कबुक</td><td>प्रति ऑर्डर व्यक्तिगत छाप पर विचार, और डिलीवरी की मेहनत कीमत में जोड़ें</td></tr>
      <tr><td>क्लाइंट का गोपनीय दस्तावेज़</td><td>खोलने वाला पासवर्ड, अलग चैनल से भेजा। यही एक मौका है जहाँ एन्क्रिप्शन सही जवाब है</td></tr>
    </tbody>
  </table>

  <p>अगर आप पहली बार फ़ाइल बेचने के लिए तैयार कर रहे हैं, तो अपलोड से पहले का बाकी काम सुरक्षा से ज़्यादा मायने रखता है: पेज का नाप, रिज़ॉल्यूशन, एम्बेड शुदा फ़ॉन्ट और वज़न ही वे चीज़ें हैं जिनसे रिफंड आते हैं। हमारी गाइड <a href="/hi/blog/sell-printable-pdf-on-etsy/">बेचने के लिए प्रिंटेबल PDF कैसे तैयार करें</a> पूरा चेकलिस्ट चलती है, और <a href="/hi/blog/a4-vs-us-letter-printable-sizes/">A4 और US Letter के बीच चुनाव</a> उस नाप वाले फ़ैसले को बंद करती है जिससे सबसे ज़्यादा शिकायतें आती हैं।</p>

  <h2>आप जो फ़ाइल अपलोड करते हैं उसका क्या होता है</h2>

  <p>हमारे टूल सर्वर पर चलते हैं, इसलिए फ़ाइल अपलोड होती है। काम पूरा होते ही वह मिटा दी जाती है, और डाउनलोड लिंक सिर्फ़ आपका है। कुछ भी इंडेक्स, संग्रहित या ट्रेनिंग में इस्तेमाल नहीं होता। अगर आप बिना लॉन्च हुई चीज़ को बचा रहे हैं, तो <a href="/hi/blog/is-convertica-safe-pdf-file-security-privacy-explained/">Convertica आपकी फ़ाइलों के साथ कैसे बरतता है</a> वाली नोट में रखने के नियम लिखे हैं।</p>

  <h2>अक्सर पूछे जाने वाले सवाल</h2>

  <h3>क्या PDF को पूरी तरह न बदली जा सकने वाली बनाया जा सकता है?</h3>
  <p>बदलना असुविधाजनक बनाया जा सकता है, और यह करने लायक है, पर असंभव नहीं बनाया जा सकता। फ़्लैटन आसान पकड़ हटाता है, अनुमतियाँ वह फ़्लैग जोड़ती हैं जिसे ज़्यादातर रीडर मानते हैं। ठान चुका इंसान फिर भी पेज रैस्टर कर देगा, टेक्स्ट दोबारा टाइप कर लेगा या टूल से पाबंदियाँ हटा देगा। निशाना "कोई दुर्घटना नहीं और कोई लापरवाह पुनरुपयोग नहीं" रखें और लग जाएगा; निशाना "असंभव" रखें और वीकेंड गँवा देंगे।</p>

  <h3>क्या पासवर्ड मेरा प्रोडक्ट साझा करने से रोक देगा?</h3>
  <p>नहीं, और एक नई समस्या बना देगा। खोलने वाला पासवर्ड हर खरीदार को देना पड़ेगा, जिसके बाद वह सार्वजनिक है, और आपने बेवजह सपोर्ट का बोझ जोड़ लिया। owner पासवर्ड खोलना ही सीमित नहीं करता। पासवर्ड की जगह जाने-पहचाने पानेवाले के गोपनीय दस्तावेज़ हैं, प्रोडक्ट नहीं।</p>

  <h3>क्या मेरी PDF की पाबंदियाँ हटाना कानूनी है?</h3>
  <p>अपनी ही फ़ाइल से अपने इस्तेमाल के लिए पाबंदी हटाना आम तौर पर कोई बात नहीं। उसे इसलिए हटाना कि आपका काम बाँटा या दोबारा बेचा जाए, ज़्यादातर न्यायक्षेत्रों में कॉपीराइट उल्लंघन है, चाहे फ़ाइल कैसे भी सुरक्षित थी, और ठीक इसीलिए लाइसेंस पेज और शिकायत प्रक्रिया फ़्लैग से ज़्यादा मायने रखते हैं।</p>

  <h3>जिस फ़ाइल के पैसे लिए, उस पर वॉटरमार्क लगाऊँ?</h3>
  <p>आम तौर पर नहीं। यह अविश्वास का संकेत है और उस हर चीज़ को बिगाड़ता है जिसे दिखाना था। अपवाद हैं प्रीव्यू पेज, जहाँ वॉटरमार्क ठीक वही औज़ार है, और महँगी फ़ाइलें, जहाँ आप हर कॉपी पर उस खरीदार का ब्यौरा छापते हैं ताकि लीक पकड़ी जा सके।</p>

  <h3>फ़्लैटन से क्वालिटी जाती है या कुछ टूटता है?</h3>
  <p>वह तस्वीरें दोबारा सैंपल नहीं करता और रिज़ॉल्यूशन नहीं बदलता, इसलिए प्रिंट क्वालिटी पर असर नहीं। जो वह जानबूझकर तोड़ता है, वह है इंटरैक्टिविटी: फ़ॉर्म फ़ील्ड भरे जाना बंद कर देते हैं और एनोटेशन बदले जाना। एडिट होने वाली मास्टर कॉपी रखें, और जिस प्रोडक्ट की ख़ूबी ही भरा जाना है, उसे फ़्लैटन न करें।</p>

  <h3>लाइसेंस पेज पर असल में क्या होना चाहिए?</h3>
  <p>एक पेज, सरल भाषा: यह फ़ाइल खरीदार के निजी उपयोग के लिए है; अपने लिए जितनी बार चाहे छाप सकता है; अलग लाइसेंस के बिना दोबारा बेचना, बाँटना या व्यावसायिक उपयोग नहीं; और उस लाइसेंस के लिए संपर्क ऐसे करें। अनुमत उपयोग साफ़-साफ़ गिना देना किसी भी तकनीकी उपाय से ज़्यादा दुरुपयोग रोकता है, क्योंकि अधिकांश दुरुपयोग सच्ची अनिश्चितता है।</p>

  <h2>फ़ाइल को बचाइए और आगे बढ़िए</h2>

  <p>जो प्रोडक्ट लिस्ट करने वाले हैं, उसे <a href="/hi/pdf-edit/flatten/">फ़्लैटन</a> से गुज़ारिए, लाइसेंस पेज और फ़ुटर में दुकान का नाम जोड़िए, और वहीं रुक जाइए। अगर <a href="/hi/pdf-security/protect/">अनुमतियाँ</a> भी चाहिए, तो उनकी कीमत जानते हुए जोड़िए। और फिर बाकी दिन लिस्टिंग पर लगाइए, जो किसी भी ताले से ज़्यादा पैसे लाएगी। बाकी सब <a href="/hi/all-tools/">सभी टूल</a> में है।</p>
