excerpt_hi: "इनबॉक्स में कोई फ़ॉर्म PDF बनकर आता है और उस पर आपके दस्तख़त चाहिए। उसे छापना, कलम से दस्तख़त करना और वापस स्कैन करना धीमा रास्ता है। PDF पर स्क्रीन पर ही दस्तख़त कैसे करें, और बनाए हुए दस्तख़त तथा असली डिजिटल दस्तख़त में क्या फ़र्क़ है।"
content_hi: |
  इनबॉक्स में कोई फ़ॉर्म PDF बनकर आ गिरता है: किराए का इक़रारनामा, सहमति का फ़ॉर्म, नौकरी का पत्र, या कॉन्ट्रैक्ट। उस पर आपके दस्तख़त चाहिए। पुराना तरीक़ा तकलीफ़ का है: छापो, कलम से दस्तख़त करो, वापस स्कैन करो, और दुआ करो कि स्कैन टेढ़ा न आए। यह पूरा झंझट छोड़कर आप फ़ाइल पर स्क्रीन पर ही दस्तख़त कर सकते हैं। यह गाइड वही तरीक़ा बताती है, और डिजिटल दस्तख़त के बारे में लोग जो एक ग़लती करते हैं उसे भी साफ़ कर देती है।

  <h2>दो चीज़ें, जिन्हें दस्तख़त कहते हैं, पर वे एक नहीं हैं</h2>

  <p>कुछ भी दस्तख़त करने से पहले यह जान लेना काम आता है कि असल में आपको इनमें से कौन सी चाहिए, क्योंकि दोनों अलग दिक्क़त हल करती हैं।</p>

  <ul>
    <li><strong>इलेक्ट्रॉनिक दस्तख़त</strong> पन्ने पर रखी आपके दस्तख़त की एक तस्वीर है: लिखी हुई, माउस या उँगली से बनाई हुई, या तस्वीर के रूप में चढ़ाई हुई। यह दस्तख़त करने की नीयत दिखाती है, और रोज़मर्रा के लगभग हर फ़ॉर्म, इक़रारनामे या अंदरूनी मंज़ूरी को इतना ही चाहिए।</li>
    <li><strong>डिजिटल दस्तख़त</strong> एक प्रमाणपत्र से जुड़ी कूट-लिपि वाली मुहर है। यह सिर्फ़ आपका नाम नहीं दिखाती, गणित से साबित करती है कि दस्तख़त किसने किए और फ़ाइल उसके बाद बदली नहीं गई। बैंक, सरकारें और कुछ अदालती काग़ज़ यही मज़बूत किस्म चाहते हैं।</li>
  </ul>

  <p>इनबॉक्स में आने वाले ज़्यादातर काग़ज़ों के लिए इलेक्ट्रॉनिक दस्तख़त ही माँगा जा रहा होता है। अगर किसी दस्तावेज़ को ख़ास तौर पर प्रमाणित डिजिटल दस्तख़त चाहिए, तो वह साफ़ लिखा होगा, और आम तौर पर किसी ख़ास सेवा या सरकारी पोर्टल की तरफ़ इशारा करेगा।</p>

  <h2>PDF पर स्क्रीन पर दस्तख़त कीजिए (रोज़ का तरीक़ा)</h2>

  <figure><img src="/static/blog/images/tool-sign-hero.jpg" alt="Convertica का PDF पर दस्तख़त वाला टूल, दस्तख़त के लिए तैयार दस्तावेज़ के साथ" width="1280" height="800" loading="lazy"></figure>

  <ol>
    <li><a href="/hi/pdf-edit/sign/">दस्तख़त वाला टूल</a> खोलिए और अपनी फ़ाइल चढ़ाइए।</li>
    <li>अपने दस्तख़त बनाइए: लिखकर कोई लिखावट चुनिए, माउस या उँगली से बनाइए, या अपने असली दस्तख़त की फ़ोटो चढ़ा दीजिए।</li>
    <li>उन्हें पन्ने पर सही जगह रखिए, नाप ठीक कीजिए, और फ़ॉर्म माँगे तो तारीख़ या अपने नाम के पहले अक्षर भी जोड़ दीजिए।</li>
    <li>दस्तख़त हुई PDF डाउनलोड कर लीजिए। वह वापस भेजने के लिए तैयार है और हर जगह एक जैसी खुलती है।</li>
  </ol>

  <figure><img src="/static/blog/images/tool-sign-options.jpg" alt="दस्तख़त वाले टूल के विकल्प: लिखना, बनाना या तस्वीर चढ़ाना" width="1280" height="800" loading="lazy"></figure>

  <p>पूरे काम में एक मिनट से भी कम लगता है, और चढ़ाई गई फ़ाइल थोड़ी देर बाद सर्वर से हटा दी जाती है, जो तब मायने रखता है जब दस्तावेज़ कोई फ़ालतू फ़ाइल न होकर कॉन्ट्रैक्ट हो।</p>

  <h2>साफ़-सुथरे दस्तख़त पाना</h2>

  <p>कुछ छोटी बातें स्क्रीन पर किए दस्तख़त को भद्दा नहीं, सही दिखाती हैं:</p>

  <ul>
    <li><strong>फ़ोन या टैबलेट पर बनाना माउस से बेहतर है।</strong> उँगली या स्टाइलस से माउस घसीटने के मुक़ाबले कहीं ज़्यादा क़ुदरती लकीर बनती है।</li>
    <li><strong>दस्तख़त की फ़ोटो चढ़ा रहे हैं,</strong> तो सादे सफ़ेद काग़ज़ पर गहरी स्याही से दस्तख़त कीजिए और फिर किनारे कसकर काट दीजिए। साफ़, गहरे अंतर वाली तस्वीर पन्ने पर कहीं बेहतर बैठती है।</li>
    <li><strong>नाप लाइन के हिसाब से रखिए।</strong> पूरे फ़ॉर्म पर फैले दस्तख़त अटपटे लगते हैं। उन्हें दस्तख़त की लाइन पर करीने से बैठने लायक कर लीजिए।</li>
  </ul>

  <h2>दस्तख़त हुई फ़ाइल को बदले जाने से बचाइए</h2>

  <p>दस्तावेज़ पर दस्तख़त हो जाने के बाद आम तौर पर आप नहीं चाहते कि कोई उसे आगे बदले। इलेक्ट्रॉनिक दस्तख़त एक तस्वीर है, इसलिए वह अपने आप फ़ाइल पर ताला नहीं लगाती। दस्तावेज़ संवेदनशील है, तो उस पर पासवर्ड लगा दीजिए, ताकि वह बदला न जाए और ग़लत आदमी उसे खोल न सके: भेजने से पहले उसे <a href="/hi/pdf-security/protect/">पासवर्ड वाले टूल</a> से गुज़ार दीजिए। अगर आप नियमित रूप से दस्तख़त हुए कॉन्ट्रैक्ट ईमेल करते हैं, तो <a href="/hi/blog/password-protect-pdf-before-emailing/">ईमेल से पहले PDF पर पासवर्ड लगाने की गाइड</a> इसे सुरक्षित ढंग से करने का पूरा तरीक़ा बताती है।</p>

  <h2>अक्सर पूछे जाने वाले सवाल</h2>

  <h3>इलेक्ट्रॉनिक दस्तख़त कानूनी रूप से मान्य है?</h3>
  <p>ज़्यादातर देशों में रोज़मर्रा के इक़रारनामों पर इलेक्ट्रॉनिक दस्तख़त कानूनी तौर पर मान्य है, और अमेरिका का ESIGN कानून तथा यूरोप का eIDAS नियम इसे मान्यता देते हैं। कुछ ख़ास काग़ज़ (ज़मीन-जायदाद, अदालत, या नोटरी वाले) मज़बूत, प्रमाणित डिजिटल दस्तख़त माँगते हैं। ऐसा हो तो दस्तावेज़ या माँगने वाला ख़ुद बता देता है।</p>

  <h3>इलेक्ट्रॉनिक और डिजिटल दस्तख़त का फ़र्क़ दोबारा बताइए?</h3>
  <p>इलेक्ट्रॉनिक दस्तख़त नीयत दिखाती है, यानी पन्ने पर आपके दस्तख़त की तस्वीर। डिजिटल दस्तख़त उसमें पहचान और फ़ाइल के न बदले जाने का पक्का सबूत जोड़ देती है। रोज़ के फ़ॉर्म को पहली चाहिए; नियमों वाले काग़ज़ों को कभी-कभी दूसरी।</p>

  <h3>क्या PDF पर फ़ोन से दस्तख़त कर सकता हूँ?</h3>
  <p>हाँ, और अक्सर यही सबसे अच्छा तरीक़ा है, क्योंकि उँगली से क़ुदरती दिखने वाले दस्तख़त बन जाते हैं। टूल अपने फ़ोन के ब्राउज़र में खोलिए, दस्तख़त बनाइए, जगह पर रखिए, और डाउनलोड कर लीजिए, किसी ऐप की ज़रूरत नहीं।</p>

  <h3>दस्तख़त करने से बाक़ी दस्तावेज़ बदल जाएगा?</h3>
  <p>नहीं। आपके दस्तख़त पन्ने पर एक चीज़ की तरह जुड़ते हैं। पहले से मौजूद टेक्स्ट, ढाँचा और बाक़ी पन्ने बिल्कुल वैसे ही रहते हैं जैसे थे।</p>

  <h3>कुछ छापना पड़ेगा?</h3>
  <p>नहीं। स्क्रीन पर दस्तख़त करने का मक़सद ही यही है कि छापना और स्कैन करना पूरी तरह छूट जाए। आप PDF चढ़ाते हैं, दस्तख़त जोड़ते हैं, और तैयार फ़ाइल डाउनलोड कर लेते हैं।</p>

  <h2>अभी आज़माइए</h2>

  <p>अगर कोई फ़ॉर्म आपके इनबॉक्स में दस्तख़त का इंतज़ार करता पड़ा है, तो <a href="/hi/pdf-edit/sign/">दस्तख़त वाला टूल</a> खोलिए, अपने दस्तख़त जोड़िए, और एक मिनट में वापस भेज दीजिए। और दस्तख़त हुई कॉपी गोपनीय है, तो भेजने से पहले उसे <a href="/hi/pdf-security/protect/">पासवर्ड वाले टूल</a> से बंद कर दीजिए।</p>
