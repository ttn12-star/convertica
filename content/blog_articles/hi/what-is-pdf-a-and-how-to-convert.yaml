content_hi: |
  PDF/A के बारे में शायद ही कोई जिज्ञासा से पढ़ता है। इससे पहचान आमतौर पर एक झटके के साथ होती है: upload फ़ॉर्म फ़ाइल वापस कर देता है और लिखता है कि सिर्फ़ आर्काइवल फ़ॉर्मेट स्वीकार है। सबसे चुभने वाली बात यह कि आपकी PDF में कोई खराबी नहीं है। खुलती है, प्रिंट होती है, सालों से ईमेल पर जा रही है। बस वह उन नियमों को तोड़ती है जिनके होने का आपको पता ही नहीं था।

  तो वे नियम क्या हैं, किसे इनकी ज़रूरत पड़ी, और आपकी मौजूदा फ़ाइल से उस फ़ाइल तक का सबसे छोटा रास्ता क्या है जो स्वीकार हो जाए।

  <h2>PDF/A कोई अलग फ़ॉर्मेट नहीं है</h2>

  <p>सबसे पहले यही समझ लीजिए: PDF/A फ़ाइल एक PDF फ़ाइल ही है। वही extension, वही reader, वही डबल-क्लिक। उसे PDF/A बनाता है नियमों का एक ज़्यादा सख़्त सेट, जो ISO 19005 मानक के रूप में प्रकाशित है। जिन दस्तावेज़ों को दशकों तक सुरक्षित रखना होता है, उनके लिए यही फ़ॉर्मेट तय किया जाता है।</p>

  <p>इन सारे नियमों का मक़सद एक ही है: दस्तावेज़ बीस साल बाद भी बिल्कुल वैसा ही दिखे, ऐसे कंप्यूटर पर जो अभी बना भी नहीं है, और बिना इंटरनेट के।</p>

  <p>इसका मतलब है कि बाहरी दुनिया पर निर्भर हर चीज़ हटानी पड़ेगी। एक सामान्य PDF लिख सकती है कि "यह पैराग्राफ़ Helvetica में दिखाओ" और भरोसा कर सकती है कि पढ़ने वाले के सिस्टम में वह font होगा। 2045 में शायद न हो, तब text किसी और font में फिर से बहेगा और पूरा layout बिगड़ जाएगा। सामान्य PDF किसी URL से इमेज खींच सकती है, script चला सकती है, वीडियो चला सकती है। ये सब dependencies हैं, और dependencies समय के साथ सड़ती हैं।</p>

  <h2>मानक असल में क्या माँगता है</h2>

  <ul>
    <li><strong>सारे fonts फ़ाइल के अंदर embedded हों।</strong> अक्षरों की असली आकृतियाँ दस्तावेज़ के भीतर चलती हैं, इसलिए font सिस्टम में हो या न हो, text एक जैसा ही दिखता है।</li>
    <li><strong>रंग device-independent तरीक़े से लिखा हो।</strong> फ़ाइल के साथ ICC प्रोफ़ाइल जाती है, जो किसी भी भविष्य के प्रोग्राम को ठीक-ठीक बताती है कि यह ख़ास शेड क्या है, बजाय इसके कि फ़ैसला मॉनिटर पर छोड़ दिया जाए।</li>
    <li><strong>Encryption बिल्कुल नहीं।</strong> पासवर्ड लगी PDF, PDF/A नहीं हो सकती। जो आर्काइव ऐसे पासवर्ड के बिना खुले ही नहीं जो अब किसी को याद नहीं, वह आर्काइव नहीं है।</li>
    <li><strong>न JavaScript, न ऑडियो, न वीडियो, न कोई प्रोग्राम चलाने वाली कार्रवाई।</strong> जो कुछ भी executable है या समय में चलता है, बाहर।</li>
    <li><strong>कोई बाहरी reference नहीं।</strong> इमेज, fonts और सामग्री सब फ़ाइल के भीतर रहते हैं, खोलते समय कुछ भी डाउनलोड नहीं होता।</li>
    <li><strong>मानकीकृत metadata।</strong> फ़ाइल में XMP metadata होता है जो बताता है कि वह मानक के किस हिस्से और किस स्तर का दावा करती है, ताकि validator उसे सही नियम-पुस्तिका से जाँचे।</li>
  </ul>

  <p>ध्यान दीजिए इस सूची में क्या नहीं है: फ़ाइल का आकार, पन्नों की संख्या, इमेज की क्वालिटी, या text search हो पाता है या नहीं। PDF/A टिकाऊपन की गारंटी देता है, हल्केपन या सफ़ाई की नहीं।</p>

  <h2>कौन सा वर्ज़न चाहिए: PDF/A-1, 2 या 3</h2>

  <p>मानक के तीन हिस्से हैं और वे एक-दूसरे के पूरक हैं, प्रतियोगी नहीं। यहाँ नया अपने आप बेहतर नहीं होता, क्योंकि मायने यह रखता है कि लेने वाली संस्था क्या माँग रही है।</p>

  <ul>
    <li><strong>PDF/A-1</strong> (2005) सबसे सख़्त और सबसे व्यापक रूप से स्वीकृत है। यह पुराने PDF 1.4 पर टिका है और transparency व layers पर रोक लगाता है, इसलिए आधुनिक डिज़ाइन वाला दस्तावेज़ conversion के बाद साफ़ तौर पर चपटा दिख सकता है। कोई सरकारी संस्था अगर वर्ज़न बताती है, तो आमतौर पर यही।</li>
    <li><strong>PDF/A-2</strong> (2011) PDF 1.7 पर आधारित है। Transparency, layers और JPEG 2000 compression की छूट देता है, और भीतर दूसरी PDF/A फ़ाइलें attach करने देता है। ज़्यादातर लोगों के लिए यही समझदारी भरा डिफ़ॉल्ट है: आर्काइवल गारंटी वही रहती है, लेकिन दस्तावेज़ का रूप बदलने की आशंका बहुत कम हो जाती है।</li>
    <li><strong>PDF/A-3</strong> (2012) PDF/A-2 ही है, बस एक बड़े फ़र्क़ के साथ: इसके भीतर <em>कोई भी</em> फ़ाइल embed की जा सकती है, सिर्फ़ PDF/A नहीं। इलेक्ट्रॉनिक invoicing के मानक इसी पर टिके हैं, जहाँ मशीन-पठनीय XML को इंसान के पढ़ने लायक़ दस्तावेज़ के अंदर रख दिया जाता है। यह ज़रूरत न हो तो तीसरा हिस्सा आपके काम का नहीं।</li>
  </ul>

  <h3>नंबर के बाद वाला अक्षर</h3>

  <p>Levels 1b, 2b, 2u, 2a की तरह लिखे जाते हैं। अक्षर बताता है कि फ़ाइल कितनी संरचना साथ लिए चल रही है:</p>

  <ul>
    <li><strong>b (basic)</strong> दृश्य पुनरुत्पादन की गारंटी देता है। पन्ना हमेशा सही दिखेगा। ज़्यादातर माँगों का मतलब यही होता है।</li>
    <li><strong>u (unicode)</strong> यह गारंटी जोड़ता है कि पूरा text सही Unicode से मैप है, इसलिए उसे भरोसे से निकाला और खोजा जा सकता है।</li>
    <li><strong>a (accessible)</strong> पूरा tagging जोड़ता है: पढ़ने का क्रम, संरचना, इमेज के लिए alternative text। सुगम्यता से जुड़े नियम यही माँगते हैं, और किसी सपाट scan से इसे कोई converter पैदा नहीं कर सकता। असली a स्तर अच्छी तरह tag किए गए मूल दस्तावेज़ से आता है, conversion के किसी क़दम से नहीं।</li>
  </ul>

  <p>अगर किसी ने level नहीं बताया, तो <strong>PDF/A-2b</strong> लीजिए। यह "PDF/A चाहिए" वाली सामान्य शर्त पूरी करता है और दस्तावेज़ की शक्ल को सबसे कम छेड़ता है।</p>

  <h2>माँगता कौन है</h2>

  <ul>
    <li><strong>यूनिवर्सिटी और शोध repositories।</strong> Thesis और शोध-प्रबंध जमा करने वाले पोर्टल अक्सर PDF/A माँगते हैं ताकि काम जमा होने के दशकों बाद भी पढ़ा जा सके।</li>
    <li><strong>सरकारी विभाग और e-governance।</strong> लंबी अवधि तक रखे जाने वाले इलेक्ट्रॉनिक दस्तावेज़ों के लिए आर्काइवल फ़ॉर्मेट तय होता है। ऑनलाइन कुछ भी जमा करेंगे तो देर-सबेर सामना होगा।</li>
    <li><strong>अदालतें और e-filing सिस्टम।</strong> दस्तावेज़ दाख़िल करने के नियमों में आर्काइवल फ़ॉर्मेट की शर्त लगातार बढ़ रही है।</li>
    <li><strong>रिकॉर्ड प्रबंधन और ऑडिट।</strong> जहाँ भी नीति कहती है "सात साल तक रखो", वहाँ कोई न कोई पूछता ही है कि इसकी गारंटी किस चीज़ से है।</li>
    <li><strong>इलेक्ट्रॉनिक invoicing।</strong> यहाँ ख़ास तौर पर PDF/A-3 काम आता है, जहाँ invoice का structured डेटा पढ़ने लायक़ दस्तावेज़ के भीतर बैठा होता है।</li>
  </ul>

  <h2>PDF को PDF/A में कैसे बदलें</h2>

  <p>Conversion ख़ुद तेज़ है। असल में आप प्रोग्राम से कह रहे हैं कि जो कुछ पहले बाहर से आता था उसे भीतर embed कर दो, colour profile जोड़ दो, प्रतिबंधित चीज़ें हटा दो, और वह metadata लिख दो जो नतीजे को मानक के अनुरूप घोषित करे।</p>

  <ol>
    <li><a href="/hi/pdf-to-pdfa/">PDF से PDF/A कनवर्टर</a> खोलिए और फ़ाइल अपलोड कीजिए।</li>
    <li>Conformance level चुनिए। PDF/A-1b, 2b और 3b उपलब्ध हैं। जब तक अलग से न कहा गया हो, 2b लीजिए।</li>
    <li>Convert कीजिए और नतीजा डाउनलोड कीजिए।</li>
    <li>फ़ाइल खोलकर देख लीजिए। Conversion से रूप बदल सकता है, और कहीं जमा करने से पहले तीस सेकंड की यह जाँच पूरी क़ीमत वसूल करती है।</li>
  </ol>

  <p>एक काम पहले निपटा लीजिए: अगर PDF पर पासवर्ड लगा है तो conversion से पहले उसे हटाइए, क्योंकि encryption और PDF/A साथ नहीं चल सकते। तरीक़ा <a href="/hi/blog/unlock-pdf-remove-password/">अपनी PDF का पासवर्ड हटाने की गाइड</a> में है, और "अपनी" शब्द ज़रूरी है, क्योंकि पासवर्ड पता होना चाहिए।</p>

  <h2>कैसे जाँचें कि फ़ाइल सचमुच PDF/A है</h2>

  <p>ऐसी फ़ाइल किस काम की जो सिर्फ़ दावा करती हो और लेने वाला सिस्टम असहमत हो जाए। जाँच तीन स्तरों पर हो सकती है, और गहराई दाँव पर लगी चीज़ के हिसाब से रखिए।</p>

  <ul>
    <li><strong>किसी भी PDF reader में खोलिए।</strong> ज़्यादातर ऊपर एक पट्टी दिखाते हैं कि दस्तावेज़ PDF/A मोड में है। पट्टी नहीं, तो घोषणा भी नहीं।</li>
    <li><strong>Document properties देखिए।</strong> Metadata में लिखा मिलेगा कि फ़ाइल मानक के किस हिस्से और किस स्तर का दावा कर रही है।</li>
    <li><strong>असली validator चलाइए।</strong> veraPDF मुफ़्त और open-source reference implementation है। Thesis या अदालती दस्तावेज़ के लिए एक बार चला ही लीजिए। एक मिनट लगता है और यह वही जाँच है जो दूसरी तरफ़ का सिस्टम शायद कर रहा है।</li>
  </ul>

  <p>हमारा कनवर्टर फ़ाइल देने से पहले नतीजे की संरचनात्मक जाँच करता है: पुष्टि करता है कि colour profile मौजूद है और घोषित level वही है जो आपने माँगा था। इससे नाकाम conversion पकड़ी जाती है, पर यह पूरा ISO 19005 ऑडिट नहीं है। क़ानूनी असर वाले दस्तावेज़ों के लिए veraPDF से एक बार गुज़ार देना बेहतर है।</p>

  <h2>जब conversion आपका दस्तावेज़ बदल दे</h2>

  <ul>
    <li><strong>Transparency चपटी हो गई।</strong> PDF/A-1b में बदलने पर transparency हट जाती है, क्योंकि PDF 1.4 उसे जानता ही नहीं। मुलायम छायाएँ, glow और अर्धपारदर्शी परतें ठोस pixels में पक जाती हैं। दस्तावेज़ में आधुनिक डिज़ाइन हो तो 2b लीजिए, समस्या ख़त्म।</li>
    <li><strong>Font बदल गया।</strong> अगर स्रोत PDF किसी font का नाम लेती थी पर उसे embed नहीं करती थी, तो कनवर्टर को कुछ न कुछ embed करना ही पड़ता है और वह सबसे मिलता-जुलता चुन लेता है। अक्षरों की दूरी और line breaks खिसक सकते हैं। इलाज ऊपर की तरफ़ है: मूल दस्तावेज़ को fonts embed करके फिर से export कीजिए।</li>
    <li><strong>फ़ाइल भारी हो गई।</strong> यह अपेक्षित है, ख़राबी नहीं। Embedded fonts और colour profile जगह लेते ही हैं। आकार अखरे तो नतीजे को <a href="/hi/pdf-organize/compress/">PDF compress</a> से गुज़ारिए और दोबारा validate कीजिए, क्योंकि आक्रामक compression अनुपालन तोड़ सकता है।</li>
    <li><strong>Interactive हिस्से ग़ायब हो गए।</strong> Form fields, scripts और multimedia आर्काइवल सामग्री नहीं हैं। भरे हुए मान बचाने हों तो conversion से पहले form को flatten कर दीजिए ताकि जवाब पन्ने का हिस्सा बन जाएँ।</li>
    <li><strong>Conversion शुरू ही नहीं हुई।</strong> लगभग हमेशा encryption की वजह से। पासवर्ड हटाइए और दोबारा कोशिश कीजिए।</li>
  </ul>

  <h2>PDF/A क्या नहीं करता</h2>

  <ul>
    <li><strong>यह हस्ताक्षर नहीं है और प्रामाणिकता का प्रमाण भी नहीं।</strong> मानक वादा करता है कि फ़ाइल भविष्य में वैसी ही दिखेगी। किसने बनाई और किसी ने बदली या नहीं, इस पर वह चुप है। उसके लिए <a href="/hi/pdf-edit/sign/">दस्तावेज़ पर हस्ताक्षर</a> चाहिए।</li>
    <li><strong>यह सुरक्षा नहीं है।</strong> उल्टा है: encryption मना है। दस्तावेज़ को आर्काइव भी करना है और सुरक्षित भी रखना है, तो ये दो अलग कॉपियाँ हैं, दो अलग कामों के लिए।</li>
    <li><strong>Scan searchable नहीं हो जाता।</strong> PDF/A-1b में बदला हुआ scan किया पन्ना एक वैध आर्काइवल फ़ाइल है जिसके भीतर text की तस्वीर है। शब्द चाहिए तो पहले पहचान कराइए। फ़र्क़ को <a href="/hi/blog/pdf-to-word-vs-ocr-which-to-use/">कब OCR और कब सीधी conversion</a> वाली गाइड समझाती है।</li>
    <li><strong>क्वालिटी नहीं सुधरती।</strong> धुँधला scan बेहतरीन तरीक़े से आर्काइव होकर भी हमेशा धुँधला scan ही रहेगा।</li>
  </ul>

  <h2>अक्सर पूछे जाने वाले सवाल</h2>

  <h3>क्या PDF/A को वापस सामान्य PDF में बदल सकते हैं?</h3>
  <p>ज़रूरत ही नहीं है। PDF/A फ़ाइल पहले से एक वैध PDF है और हर जगह खुलती है। संपादित करेंगे तो आमतौर पर अनुपालन टूट जाता है, और यह ठीक है, बशर्ते आर्काइव कॉपी अछूती रखें और बदलाव के बाद दोबारा convert कर लें।</p>

  <h3>क्या PDF/A-3, PDF/A-2 से बेहतर है क्योंकि नंबर बड़ा है?</h3>
  <p>नहीं। ज़्यादातर लोगों के लिए इकलौता मायने रखने वाला फ़र्क़ यह है कि तीसरे हिस्से में कोई भी फ़ाइल embed हो सकती है। कई अभिलेखागार इसे पसंद नहीं करते, क्योंकि भीतर रखी spreadsheet ख़ुद एक dependency है जिसकी भविष्य में पठनीयता की गारंटी कोई नहीं देता। जो माँगा गया हो वही वर्ज़न लीजिए, और न माँगा गया हो तो 2b।</p>

  <h3>Scan convert तो हो गया पर text अब भी खोजा नहीं जा रहा, क्यों?</h3>
  <p>क्योंकि scan एक इमेज है, और इमेज को आर्काइव करने से इमेज ही बचती है। पहले <a href="/hi/image/to-text/">text recognition</a> या <a href="/hi/scanned-pdf-to-word/">scanned PDF से Word</a> चलाइए, फिर उस नतीजे को आर्काइवल फ़ॉर्मेट में बदलिए।</p>

  <h3>क्या रोज़मर्रा के ऑफ़िस दस्तावेज़ों के लिए PDF/A चाहिए?</h3>
  <p>आमतौर पर नहीं। जो invoice भेजकर आप भूल जाएँगे, उसके लिए सामान्य PDF काफ़ी है। आर्काइवल फ़ॉर्मेट तब कमाई करता है जब दस्तावेज़ को retention अवधि, क़ानूनी प्रक्रिया या संस्थागत repository झेलनी हो, या जब किसी ने साफ़ शब्दों में माँगा हो।</p>

  <h3>क्या PDF/A फ़ाइल को edit होने से रोक देगा?</h3>
  <p>नहीं। यह read-only नहीं है और न ही किसी ताले में है। editor वाला कोई भी व्यक्ति उसे बाक़ी PDF की तरह बदल सकता है। मानक समय के साथ सही दिखने की गारंटी देता है, अपरिवर्तनीयता की नहीं।</p>

  <h3>अगर फिर भी फ़ाइल रिजेक्ट हो जाए तो?</h3>
  <p>तीन चीज़ें क्रम से देखिए: कहीं किसी ख़ास हिस्से और स्तर की माँग तो नहीं थी, जैसे 2b की जगह 1b; फ़ाइल पर पासवर्ड तो नहीं रह गया; और validator असली ग़लती क्या बता रहा है। व्यवहार में पहला बिंदु ही ज़्यादातर अस्वीकृतियों की वजह निकलता है।</p>

  <h2>अपनी फ़ाइल बदलिए</h2>

  <p>अगर कोई फ़ॉर्म आर्काइवल कॉपी का इंतज़ार कर रहा है, तो <a href="/hi/pdf-to-pdfa/">PDF से PDF/A कनवर्टर</a> 1b, 2b और 3b तीनों levels संभालता है और डाउनलोड से पहले अपना नतीजा ख़ुद जाँचता है। यह Convertica Premium का हिस्सा है, बाक़ी <a href="/hi/premium-tools/">premium टूल्स</a> के साथ। फ़ाइल तैयार करना मुफ़्त है: <a href="/hi/pdf-security/unlock/">पासवर्ड हटाना</a>, <a href="/hi/pdf-organize/compress/">compress करना</a> और <a href="/hi/pdf-organize/merge/">पन्नों को एक दस्तावेज़ में जोड़ना</a>, और बाक़ी सब <a href="/hi/all-tools/">पूरी टूल सूची</a> में है।</p>
