content_hi: |
  आपके कंप्यूटर पर Word उन्हीं फ़ॉन्ट से टेक्स्ट बनाता है जो आपके कंप्यूटर पर इंस्टॉल हैं। ऑनलाइन कन्वर्टर एक सर्वर पर चलता है, और वह सिर्फ़ उन्हीं फ़ॉन्ट से टेक्स्ट बना सकता है जो उस सर्वर पर हैं, साथ में वे फ़ॉन्ट जो ख़ुद डॉक्यूमेंट के अंदर रखे हों। अगर आपका फ़ॉन्ट इन दोनों में से कहीं नहीं है, तो कन्वर्टर उसकी जगह कोई और फ़ॉन्ट चुन लेता है। इस गाइड की हर बात इसी एक तथ्य से निकलती है।

  हमने जाँचा कि <a href="/hi/word-to-pdf/">Word to PDF कन्वर्टर</a> आम Office फ़ॉन्ट, कस्टम फ़ॉन्ट और अरबी डॉक्यूमेंट के साथ क्या करता है। नीचे बताया है कि क्या होता है, और आप क्या कर सकते हैं।

  <h2>वे फ़ॉन्ट जिनकी जगह बिल्कुल जुड़वाँ फ़ॉन्ट आते हैं</h2>

  <p>सबसे आम Office फ़ॉन्ट Linux सर्वर पर नहीं होते, लेकिन उनके मुफ़्त जुड़वाँ फ़ॉन्ट हैं जिनमें हर अक्षर की चौड़ाई बिल्कुल वही है। इनमें लिखा टेक्स्ट ठीक उन्हीं जगहों पर अगली लाइन में जाता है, इसलिए आपके पेज ब्रेक और लाइनों की लंबाई वैसी ही रहती है:</p>

  <ul>
    <li><strong>Arial</strong> → Liberation Sans</li>
    <li><strong>Times New Roman</strong> → Liberation Serif</li>
    <li><strong>Courier New</strong> → Liberation Mono</li>
    <li><strong>Calibri</strong> → Carlito</li>
    <li><strong>Cambria</strong> → Caladea</li>
  </ul>

  <p>ध्यान से देखें तो अक्षरों की बनावट थोड़ी अलग है, लेकिन 12 पेज का डॉक्यूमेंट 12 पेज का ही रहता है। Microsoft के दो नए फ़ॉन्ट का कोई बिल्कुल जुड़वाँ नहीं है: <strong>Aptos</strong> (Office का नया डिफ़ॉल्ट) की जगह Carlito और <strong>Segoe UI</strong> की जगह Liberation Sans आता है, जिनकी चौड़ाई सबसे क़रीब है, इसलिए लाइनें थोड़ी खिसक सकती हैं।</p>

  <h2>वे फ़ॉन्ट जिनकी जगह कुछ अलग आ जाता है</h2>

  <p>बाकी कोई भी फ़ॉन्ट, चाहे ब्रांड फ़ॉन्ट हो, शादी के कार्ड के लिए लिखावट जैसा फ़ॉन्ट हो, या CV के लिए डाउनलोड किया गया फ़ॉन्ट, सर्वर उसे नहीं जानता। कन्वर्टर उसकी जगह मिलता-जुलता स्टाइल लगाता है (sans की जगह sans, serif की जगह serif), और नतीजा आमतौर पर ज़्यादा सादा दिखता है और उसकी लंबाई भी बदल जाती है।</p>

  <p>यह ऐसी चीज़ नहीं जिसे कोई कन्वर्टर अंदाज़े से सुलझा ले। फ़ॉन्ट की फ़ाइल को डॉक्यूमेंट के साथ ही आना होगा।</p>

  <h2>समाधान: फ़ॉन्ट को Word फ़ाइल में embed करें</h2>

  <p>Word डॉक्यूमेंट में इस्तेमाल हुए फ़ॉन्ट .docx फ़ाइल के अंदर रख सकता है। हमने इसे जाँचा: जिस डॉक्यूमेंट में ऐसा फ़ॉन्ट embed था जो सर्वर पर नहीं है, वह कन्वर्टर से ठीक उसी फ़ॉन्ट में निकला। embed किए बिना वही डॉक्यूमेंट किसी विकल्प फ़ॉन्ट में निकला।</p>

  <ol>
    <li>Word में <strong>File</strong>, <strong>Options</strong>, <strong>Save</strong> पर जाएँ।</li>
    <li>"Preserve fidelity when sharing this document" के नीचे <strong>Embed fonts in the file</strong> पर टिक करें।</li>
    <li>फ़ाइल छोटी रखने के लिए <strong>Embed only the characters used in the document</strong> पर टिक करें। PDF के लिए इतना ही काफ़ी है।</li>
    <li>अगर आपका फ़ॉन्ट Windows के साथ आया था (Traditional Arabic, Sakkal Majalla, Segoe UI और ऐसे ही दूसरे), तो <strong>Do not embed common system fonts</strong> से टिक हटा दें। वरना Word मान लेता है कि ये सबके पास पहले से हैं और इन्हें छोड़ देता है।</li>
    <li>डॉक्यूमेंट सेव करें, फिर उसे बदलें।</li>
  </ol>

  <p>Mac पर, Word for Mac में यही विकल्प <strong>Word</strong>, <strong>Preferences</strong>, <strong>Save</strong> के नीचे है। कुछ कमर्शियल फ़ॉन्ट का लाइसेंस embed करने की इजाज़त नहीं देता; Word ऐसे फ़ॉन्ट चुपचाप छोड़ देता है, और उनकी जगह फिर भी दूसरा फ़ॉन्ट आएगा।</p>

  <h2>अरबी डॉक्यूमेंट</h2>

  <p>फ़ॉन्ट की गड़बड़ी सबसे ज़्यादा अरबी में दिखती है, इसलिए हमने इसे अलग से दस आम फ़ॉन्ट वाले एक डॉक्यूमेंट पर जाँचा।</p>

  <ul>
    <li><strong>टेक्स्ट अपने आप में सुरक्षित है।</strong> अक्षर सही तरह जुड़ते हैं, लाइनें दाएँ से बाएँ चलती हैं, और अरबी-भारतीय अंक (٢٠٢٦) पश्चिमी अंकों (1500) के बगल में वैसे ही रहते हैं।</li>
    <li><strong>Windows के अरबी फ़ॉन्ट सर्वर पर नहीं हैं।</strong> Traditional Arabic, Simplified Arabic, Sakkal Majalla और Arabic Typesetting की जगह <strong>Noto Naskh Arabic</strong> आता है, जो नस्ख़ शैली का फ़ॉन्ट है और इन फ़ॉन्ट जैसा ही दिखता है। Arial, Tahoma या Calibri में लिखे अरबी टेक्स्ट के लिए <strong>Noto Sans Arabic</strong> इस्तेमाल होता है, जो उनकी सादी शैली से मेल खाता है।</li>
    <li><strong>लाइनें थोड़ी अलग जगहों पर टूट सकती हैं,</strong> क्योंकि विकल्प वाले अक्षरों की चौड़ाई बिल्कुल वही नहीं है। एक पेज में कसकर फ़िट किया गया फ़ॉर्म दूसरे पेज पर खिसक सकता है।</li>
    <li><strong>बिल्कुल मूल जैसा लुक चाहिए,</strong> तो ऊपर बताए तरीक़े से फ़ॉन्ट embed करें, और "Do not embed common system fonts" से टिक हटाना न भूलें, क्योंकि अरबी फ़ॉन्ट Windows के सिस्टम फ़ॉन्ट हैं।</li>
  </ul>

  <h2>दूसरा रास्ता: Word का अपना PDF एक्सपोर्ट</h2>

  <p>अगर आपके पास उसी कंप्यूटर पर Word है जिस पर फ़ॉन्ट इंस्टॉल हैं, तो <strong>File</strong>, <strong>Save As</strong>, <strong>PDF</strong> सीधे उन्हीं फ़ॉन्ट का इस्तेमाल करता है। जब यह मुमकिन हो, तो यही सबसे भरोसेमंद तरीक़ा है। ऑनलाइन कन्वर्टर तब काम आता है जब आप फ़ोन पर हों, किसी साझा कंप्यूटर पर हों, या ऐसी मशीन पर जिसमें Word नहीं है।</p>

  <h2>PDF में कौन से फ़ॉन्ट पहुँचे, यह कैसे जाँचें</h2>

  <p>PDF को Adobe Acrobat Reader में खोलें, फिर <strong>File</strong>, <strong>Properties</strong>, <strong>Fonts</strong> टैब। फ़ाइल का हर फ़ॉन्ट वहाँ लिस्ट होता है। अगर जहाँ आपने Arial लगाया था वहाँ Liberation Sans दिखे, तो वह अपेक्षित जुड़वाँ है। अगर अपने ब्रांड फ़ॉन्ट की जगह कोई विकल्प फ़ॉन्ट दिखे, तो उसे embed करें और फिर से बदलें।</p>

  <h2>अक्सर पूछे जाने वाले सवाल</h2>

  <h3>मेरी PDF में Word डॉक्यूमेंट से ज़्यादा पेज क्यों हैं?</h3>
  <p>चौड़े अक्षरों वाला विकल्प फ़ॉन्ट लाइनों को जल्दी तोड़ देता है, और टेक्स्ट लंबा हो जाता है। ऊपर दिए Office फ़ॉन्ट के साथ ऐसा नहीं होता। कस्टम फ़ॉन्ट के साथ हो सकता है, और यह उन्हें embed करने की एक और वजह है।</p>

  <h3>क्या फ़ॉन्ट embed करने से Word फ़ाइल बहुत बड़ी हो जाती है?</h3>
  <p>"Embed only the characters used" के साथ आमतौर पर हर फ़ॉन्ट पर कुछ दसियों से लेकर कुछ सौ किलोबाइट तक बढ़ते हैं। हर अक्षर वाला पूरा फ़ॉन्ट, ख़ासकर कोई CJK या अरबी फ़ॉन्ट, कई मेगाबाइट जोड़ सकता है।</p>

  <h3>क्या PDF में मेरा अरबी टेक्स्ट खोजा और कॉपी किया जा सकता है?</h3>
  <p>हाँ। कन्वर्टर असली टेक्स्ट लिखता है, टेक्स्ट की तस्वीरें नहीं, इसलिए आप उसे खोज भी सकते हैं और कॉपी भी कर सकते हैं।</p>

  <h3>क्या हिंदी, रूसी या चीनी टेक्स्ट सही बचेगा?</h3>
  <p>सिरिलिक और ग्रीक Office फ़ॉन्ट के जुड़वाँ फ़ॉन्ट में शामिल हैं। देवनागरी, यानी आपका हिंदी टेक्स्ट, और दूसरी लिपियाँ Noto फ़ॉन्ट से बनाई जाती हैं। अरबी की तरह ही, अगर हिंदी फ़ॉन्ट का ठीक वही डिज़ाइन मायने रखता है, तो मूल फ़ॉन्ट embed करें।</p>

  <h2>अपना डॉक्यूमेंट बदलें</h2>

  <p>फ़ॉन्ट असामान्य हों तो उन्हें embed करें, सेव करें और फ़ाइल को <a href="/hi/word-to-pdf/">Word to PDF कन्वर्टर</a> में डालें। लेआउट, टेबल और इमेज की पूरी तस्वीर के लिए देखें <a href="/hi/blog/word-to-pdf-converter-online-free-2025/">Word से हर बार साफ़ PDF कैसे पाएँ</a>।</p>
