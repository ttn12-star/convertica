content_hi: |
  फ़ाइल के साथ सब कुछ सही किया जा सकता है और आख़िरी दस सेकंड में खरीदार फिर भी छूट सकता है। डिलीवरी डिजिटल प्रोडक्ट का वह हिस्सा है जिसे विक्रेता संयोग से डिज़ाइन करते हैं: फ़ाइलें चार थीं, आपने ज़िप कर दिया, और अब आपके खरीदारों का एक हिस्सा उसी डिवाइस पर अपनी खरीद नहीं खोल पाता जिससे उसने पैसे दिए।

  तीन फ़ैसले लगभग सब ढक लेते हैं।

  <h2>फ़ैसला 1: एक फ़ाइल या आर्काइव</h2>

  <p>प्रवृत्ति सब कुछ बंडल करने की होती है। जहाँ मुमकिन हो, विरोध करें, क्योंकि आर्काइव खरीदारों के अच्छे-खासे हिस्से के लिए असली अड़चन है।</p>

  <table>
    <thead>
      <tr><th>एक PDF भेजें जब</th><th>आर्काइव भेजें जब</th></tr>
    </thead>
    <tbody>
      <tr><td>प्रोडक्ट एक ही चीज़ एक ही नाप में है</td><td>आपके पास कई कागज़ी नाप या रंग विकल्प हैं</td></tr>
      <tr><td>आप प्रति-फ़ाइल सीमा में आ जाते हैं</td><td>वरना आप प्लैटफ़ॉर्म की फ़ाइल-संख्या सीमा पार कर जाएँगे</td></tr>
      <tr><td>आपका ज़्यादातर ट्रैफ़िक मोबाइल है</td><td>प्रोडक्ट सचमुच एक सेट है जिसे खरीदार छाँटेगा</td></tr>
    </tbody>
  </table>

  <p>अगर आपके पास दो-तीन फ़ाइलें हैं और प्लैटफ़ॉर्म दो-तीन की अनुमति देता है, तो अलग-अलग अपलोड करें। खरीदार जिसे चाहे उस पर टैप करता है और बात ख़त्म। यह उससे सख़्ती से बेहतर है कि सबको आर्काइव निकालने पर मजबूर किया जाए, उसी फ़ाइल तक पहुँचने के लिए।</p>

  <h2>फ़ैसला 2: फ़ोन क्या करता है</h2>

  <p>खरीदारों का बड़ा हिस्सा खरीद फ़ोन पर खोलता है, अक्सर भुगतान के एक मिनट के भीतर, अक्सर कहीं खड़े-खड़े। आर्काइव के साथ वह व्यक्ति क्या भुगतता है:</p>

  <ul>
    <li><strong>पुराने Android और iOS को एक अतिरिक्त कदम चाहिए</strong> डाउनलोड किए आर्काइव से पढ़ने लायक PDF तक पहुँचने के लिए। नए संस्करण संभाल लेते हैं, पर उस वाक्य में "नए" शब्द बहुत बोझ ढो रहा है, और आपके सभी खरीदारों के फ़ोन नए नहीं हैं।</li>
    <li><strong>निकाली गई फ़ाइलें अक्सर एक ही सपाट डायरेक्टरी में गिरती हैं</strong>, यानी आपकी फ़ोल्डर बनावट गायब हो जाती है। अगर दो फ़ाइलें सिर्फ़ अपने फ़ोल्डर से अलग थीं, तो अब वे अलग नहीं हैं।</li>
    <li><strong>मोबाइल डेटा पर 40 MB का डाउनलोड</strong> एक ठहराव है, और ठहराव वही जगह है जहाँ लोग टैब बंद करते हैं और लौटने का इरादा रखते हैं।</li>
  </ul>

  <p>इसका मतलब यह नहीं कि आर्काइव कभी न इस्तेमाल करें। मतलब यह है: अगर करते हैं, तो फ़ाइलों के नाम ऐसे रखें कि वे निकालने के बाद भी टिकें, और डाउनलोड इतना छोटा रखें कि वह रास्ते में पूरा हो जाए।</p>

  <h2>फ़ैसला 3: वज़न, हर फ़ाइल का</h2>

  <p>प्लैटफ़ॉर्म की सीमाएँ हर फ़ाइल पर गिनी जाती हैं, बंडल पर नहीं, और यही अंतर आपकी पैकिंग तय करता है। मार्केटप्लेस आम तौर पर हर डिजिटल फ़ाइल को लगभग 20 MB और हर लिस्टिंग में फ़ाइलों की संख्या को पाँच तक सीमित करते हैं, इसलिए तीन रंगों में चार नापों का बंडल आर्काइव बनना ही है, चाहें या न चाहें। बंडल उनके इर्द-गिर्द बनाने से पहले अपने प्लैटफ़ॉर्म के मौजूदा आँकड़े देख लें।</p>

  <p>अगर आप सीमा से ऊपर हैं, तो कंप्रेशन पकड़ने से पहले वजह ढूँढें। सिर्फ़ टेक्स्ट वाली PDF का वज़न नाममात्र होता है; 30 MB का प्लानर इसलिए 30 MB है क्योंकि पूरे पेज की पृष्ठभूमि या कागज़ का टेक्सचर है। उस टेक्सचर की जगह सपाट रंग रखने से फ़ाइल आम तौर पर कई गुना छोटी हो जाती है और घर के प्रिंटर पर कुछ दिखने लायक नुकसान नहीं होता। और तभी <a href="/hi/pdf-organize/compress/">PDF कंप्रेसर</a> लें, जो टेक्स्ट और वेक्टर को पूरी क्वालिटी में रखता है और तस्वीरों को दोबारा कंप्रेस करता है, और नतीजे पर भरोसा करने से पहले एक पेज छापें।</p>

  <h2>आर्काइव पर पासवर्ड लगाएँ?</h2>

  <p>आप <a href="/hi/archive/protect/">ZIP पर पासवर्ड लगा</a> सकते हैं, और पैसे वाली डाउनलोड के लिए आम तौर पर नहीं लगाना चाहिए। गणित निर्दयी है: अब पासवर्ड हर खरीदार को चाहिए, यानी वह लिस्टिंग के विवरण या डिलीवरी ईमेल में रहता है, यानी वह कुछ भी नहीं बचाता, और साथ ही खरीदारों का एक हिस्सा उसे ठीक से नहीं डाल पाएगा और आपको लिखेगा।</p>

  <p>जहाँ मतलब बनता है, वे मौके संकरे हैं: फ़ाइल किसी एक तय क्लाइंट को जा रही हो, रिलीज़ से पहले की कॉपी किसी समीक्षक को, या ऐसा बंडल जो आप प्लैटफ़ॉर्म से बाहर किसी विशेष व्यक्ति को भेज रहे हों। <a href="/hi/blog/how-to-password-protect-a-zip-file/">ZIP आर्काइव पर पासवर्ड</a> वाली हमारी नोट यंत्र-विधि बताती है, और सुरक्षा असल में क्या देती है, यह बड़ा सवाल <a href="/hi/blog/stop-buyers-editing-reselling-your-pdf/">खरीदार को PDF बदलने और दोबारा बेचने से क्या रोकता है</a> में है। संक्षेप में: प्रोडक्ट के लिए लाइसेंस पेज काम करता है, पासवर्ड नहीं।</p>

  <h2>खरीदार को पहले क्या दिखना चाहिए</h2>

  <p>मान लीजिए खरीदार सब कुछ डाउनलोड फ़ोल्डर में निकालेगा और कुछ नहीं पढ़ेगा। उसी व्यक्ति के लिए डिज़ाइन कीजिए:</p>

  <ul>
    <li><strong>फ़ाइल के नाम जो प्रोडक्ट और वेरिएंट बताएँ</strong> और बस। <code>weekly-planner-A4.pdf</code>, न कि <code>final_v3.pdf</code>।</li>
    <li><strong>एक छोटा निर्देश पेज</strong>, और सिर्फ़ एक। अगर आप चार PDF के साथ <code>READ ME FIRST.txt</code> नाम की टेक्स्ट फ़ाइल रखते हैं, तो ज़्यादातर लोग उसे नहीं पढ़ेंगे, इसलिए ज़रूरी पंक्ति PDF के अंदर भी दोहराएँ।</li>
    <li><strong>छपाई का निर्देश, एक बार और साफ़-साफ़।</strong> 100 प्रतिशत पर, असली नाप में, स्केलिंग बंद करके छापें। यह एक पंक्ति इस लेख की किसी भी बात से ज़्यादा शिकायतें रोकती है।</li>
  </ul>

  <h2>दोबारा भेजने का अनुरोध</h2>

  <p>यह हमेशा आता है: खरीदार ने फ़ाइल खो दी, फ़ोन बदल लिया, या समय बीत चुके लिंक से टकरा गया। अपना जवाब पहले तय कर लें, रात ग्यारह बजे सोचने के बजाय।</p>

  <ul>
    <li><strong>अपने प्लैटफ़ॉर्म की लिंक नीति जानिए।</strong> कहीं लिंक ख़त्म हो जाते हैं, कहीं डाउनलोड की गिनती होती है, कहीं वे तब तक रहते हैं जब तक खाता है। यह जाने बिना खरीदार को जवाब नहीं दिया जा सकता।</li>
    <li><strong>हर वर्ज़न की भेजी गई ठीक फ़ाइल रखिए।</strong> अगर आपने दो वर्ज़न भेजे हैं, तो जानना होगा कि उस खरीदार ने कौन सा खरीदा। यहीं प्रकाशन-पूर्व जाँच का वर्ज़न निशान वसूल होता है।</li>
    <li><strong>हाँ कहिए और आगे बढ़िए।</strong> फ़ाइल दोबारा भेजना आपको कुछ नहीं पड़ता और उस इंसान की सद्भावना खरीदता है जो पहले ही भुगतान कर चुका है। बहस एक रिव्यू की कीमत पर आती है।</li>
  </ul>

  <h2>डिलीवरी चेकलिस्ट</h2>

  <table>
    <thead>
      <tr><th>जाँच</th><th>क्यों</th></tr>
    </thead>
    <tbody>
      <tr><td>अलग-अलग फ़ाइलें, अगर प्लैटफ़ॉर्म संख्या की अनुमति दे</td><td>आर्काइव का कदम पूरी तरह हटा देती हैं</td></tr>
      <tr><td>हर फ़ाइल प्रति-फ़ाइल सीमा के नीचे</td><td>सीमा हर फ़ाइल पर है, बंडल पर नहीं</td></tr>
      <tr><td>निकालने के बाद भी फ़ाइल नाम समझ आते हैं</td><td>फ़ोल्डर बनावट गायब हो जाती है</td></tr>
      <tr><td>डाउनलोड फ़ोन पर दो टैप में खुलता है</td><td>पहली बार खोलने की ज़्यादातर घटनाएँ वहीं होती हैं</td></tr>
      <tr><td>एक निर्देश पेज, छपाई का स्केल बताया गया</td><td>सबसे आम शिकायत रोकता है</td></tr>
      <tr><td>पासवर्ड नहीं, जब तक कोई तय पानेवाला न हो</td><td>कुछ नहीं बचाता, संदेश पैदा करता है</td></tr>
      <tr><td>आप लिंक की समय-सीमा नीति जानते हैं</td><td>आपसे यह पूछा जाएगा</td></tr>
      <tr><td>आप भेजी गई फ़ाइल वर्ज़न के हिसाब से रखते हैं</td><td>दोबारा भेजने के लिए सही कॉपी चाहिए</td></tr>
    </tbody>
  </table>

  <p>अगर आपने अभी फ़ाइल और लिस्टिंग पर चक्कर नहीं लगाया, तो वह पहले आता है: हमारी <a href="/hi/blog/digital-product-pdf-checklist-before-you-publish/">प्रकाशन-पूर्व चेकलिस्ट</a> वह दरवाज़ा है, और <a href="/hi/blog/sell-printable-pdf-on-etsy/">बेचने के लिए प्रिंटेबल PDF तैयार करना</a> खुद फ़ाइल को ढकती है।</p>

  <h2>आप जो फ़ाइल अपलोड करते हैं उसका क्या होता है</h2>

  <p>हमारे टूल सर्वर पर चलते हैं, इसलिए फ़ाइल अपलोड होती है। काम पूरा होते ही वह मिटा दी जाती है, और डाउनलोड लिंक सिर्फ़ आपका है। कुछ भी इंडेक्स, संग्रहित या ट्रेनिंग में इस्तेमाल नहीं होता। <a href="/hi/blog/is-convertica-safe-pdf-file-security-privacy-explained/">Convertica आपकी फ़ाइलों के साथ कैसे बरतता है</a> वाली नोट में रखने के नियम लिखे हैं।</p>

  <h2>अक्सर पूछे जाने वाले सवाल</h2>

  <h3>क्या ज़िप सचमुच इतनी अड़चन है?</h3>
  <p>कंप्यूटर पर नहीं। फ़ोन पर यह एक अतिरिक्त कदम है जिसे कुछ खरीदार पूरा नहीं करेंगे, और फ़ोन वही जगह है जहाँ पहली बार खोलने की बहुत घटनाएँ होती हैं। बात यह नहीं कि आर्काइव बुरे हैं, बात यह है कि वे फ़ैसला होने चाहिए, डिफ़ॉल्ट नहीं। अगर दो अलग फ़ाइलें प्लैटफ़ॉर्म के नियमों में आती हैं, तो दो अलग फ़ाइलें दें।</p>

  <h3>डाउनलोड का कुल वज़न कितना समझदारी है?</h3>
  <p>इतना छोटा कि मोबाइल डेटा पर पूरा हो जाए और खरीदार यह न सोचने लगे कि अटक गया। प्रिंटेबल के लिए ज़्यादातर प्रोडक्ट में यह एक अंक के मेगाबाइट हैं। अगर आप उससे बहुत ऊपर हैं, तो वजह लगभग हमेशा कोई तस्वीर है, और उसे ढूँढना उसके आसपास कंप्रेस करने से बेहतर है।</p>

  <h3>read-me फ़ाइल रखनी चाहिए?</h3>
  <p>एक, छोटी, और अहम पंक्ति PDF के अंदर भी दोहराएँ, क्योंकि चार PDF के साथ रखी टेक्स्ट फ़ाइल ज़्यादातर बिना पढ़ी रह जाती है। अहम पंक्ति छपाई का स्केल है।</p>

  <h3>क्या डाउनलोड लिंक साझा करना रोका जा सकता है?</h3>
  <p>अर्थपूर्ण ढंग से नहीं, और नुकसान कम ही वहाँ से आता है। प्लैटफ़ॉर्म के लिंक आम तौर पर ऑर्डर से बँधे होते हैं, और जो साझा करने पर उतर आया, वह फ़ाइल साझा करेगा, लिंक नहीं। मेहनत लाइसेंस पेज पर लगाएँ।</p>

  <h3>खरीदार कहता है फ़ाइल नहीं खुलती। पहले क्या पूछें?</h3>
  <p>कौन सा डिवाइस, और आर्काइव निकाला या नहीं। ये दो सवाल "नहीं खुलती" वाली ज़्यादातर रिपोर्टें सुलझा देते हैं, क्योंकि आम जवाब पुराना फ़ोन और बिना निकाला ZIP होते हैं। अगला सवाल रीडर का है, क्योंकि ब्राउज़र का प्रीव्यू कभी-कभी उस फ़ाइल पर गिर जाता है जो PDF ऐप में ठीक खुलती है।</p>

  <h3>A4 और US Letter अलग-अलग देने चाहिए?</h3>
  <p>अगर प्लैटफ़ॉर्म की फ़ाइल-संख्या सीमा अनुमति दे, तो हाँ, और फ़ाइल के नाम में लेबल लगाएँ। नाप के सवाल का यह सबसे साफ़ संभव जवाब है, और खरीदार को गलत फ़ाइल खोलने से बचाता है। दोनों देने का तर्क <a href="/hi/blog/a4-vs-us-letter-printable-sizes/">A4 या US Letter</a> में है।</p>

  <h2>अपनी डिलीवरी ठीक कीजिए</h2>

  <p>अपना ही सबसे हाल का ऑर्डर वैसे खोलिए जैसे खरीदार खोलता, फ़ोन पर, और पढ़ने लायक पेज तक टैप गिनिए। अगर दो से ज़्यादा हैं, तो इलाज आम तौर पर आर्काइव को अलग फ़ाइलों में तोड़ना या उनके नाम ऐसे बदलना है कि वे अकेले भी समझ आएँ। अगर आर्काइव सचमुच चाहिए और उसे किसी तय पानेवाले के लिए बंद करना है, तब <a href="/hi/archive/protect/">ZIP पर पासवर्ड लगाइए</a>, और तभी। बाकी सब <a href="/hi/all-tools/">सभी टूल</a> में है।</p>
