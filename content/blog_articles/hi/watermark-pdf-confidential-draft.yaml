  आख़िरी पंक्ति पर ध्यान दीजिए। अगर आप आम CONFIDENTIAL की जगह लिखते हैं Confidential - prepared for John Smith, Acme Corp, तो उस कॉपी से हुआ कोई भी लीक सीधे उसी व्यक्ति तक पहुँचता है। फ़ोटोग्राफ़र और छपाई से पहले के न्यूज़रूम दशकों से यही करते आए हैं। हर व्यक्ति पर तीस सेकंड ज़्यादा लगते हैं, और लीक करने की सामाजिक कीमत कई गुना बढ़ जाती है।

  <h2>बाद में वॉटरमार्क हटाना</h2>

  सौदा पक्का होने पर आपको साफ़ फ़ाइल चाहिए। इसका एक ही सही तरीक़ा है: मूल फ़ाइल से दोबारा बनाइए।

  <ol>
    <li>वॉटरमार्क लगाने से पहले बिना मुहर वाली मूल फ़ाइल बचा कर रखिए।</li>
    <li>दस्तावेज़ मंज़ूर हो जाए, तो मूल फ़ाइल पर <code>FINAL</code> की मुहर लगाइए, या चलन के हिसाब से वॉटरमार्क पूरा हटा दीजिए।</li>
    <li>नई साफ़ फ़ाइल बाँटिए, ड्राफ़्ट का वह वर्शन नहीं जिससे वॉटरमार्क खुरचा गया हो।</li>
  </ol>

  जिन दस्तावेज़ों के मालिक आप नहीं हैं, उनसे वॉटरमार्क हटाने का टूल हम जान-बूझकर नहीं देते। दूसरों की PDF से वॉटरमार्क हटाना लगभग हमेशा कॉपीराइट, NDA या भेजने वाले की शर्तों का उल्लंघन होता है, और हम उस काम को आसान नहीं बनाना चाहते।

  <h2>अक्सर पूछे जाने वाले सवाल</h2>

  <h3>CONFIDENTIAL वॉटरमार्क पर कितनी ओपैसिटी रखूँ?</h3>
  <p>30 से 40% सबसे सही रहती है। इतने पर वह हल्के बैकग्राउंड पर साफ़ पढ़ा जाता है और काले-सफ़ेद प्रिंट में भी बचा रहता है, नीचे का टेक्स्ट ढके बिना। 25% से नीचे भरे हुए पन्नों पर ग़ायब हो जाता है, 50% से ऊपर पढ़ने में अड़चन डालता है।</p>

  <h3>क्या मैं सिर्फ़ चुनिंदा पन्नों पर वॉटरमार्क लगा सकता हूँ?</h3>
  <p>हाँ, और इसकी वाजिब वजहें भी होती हैं (कवर पन्ना छोड़ देना, परिशिष्ट बिना मुहर रखना)। फिर भी अधूरा वॉटरमार्क स्क्रीनशॉट से आसानी से मात खा जाता है, इसलिए लेआउट की कोई ख़ास वजह न हो तो हर पन्ने पर लगाइए।</p>

  <h3>छपने पर वॉटरमार्क दिखेगा?</h3>
  <p>हाँ। वॉटरमार्क पन्ने की सामग्री का हिस्सा है, व्यूअर की ऊपरी परत नहीं, इसलिए वह ठीक वैसा ही छपता है जैसा स्क्रीन पर दिखता है। काले-सफ़ेद प्रिंट में बीच वाला स्लेटी उम्मीद से थोड़ा गहरा आता है; छपाई का इरादा हो तो ओपैसिटी 5% घटा दीजिए। कुछ प्रिंट ड्राइवर में वॉटरमार्क छोड़ देने का विकल्प भी होता है, जो दफ़्तर के कुछ प्रिंटर पर पहले से चालू रहता है, इसलिए बड़ी छपाई से पहले एक पन्ना जाँच लीजिए।</p>

  <h3>वॉटरमार्क लगाने से PDF कॉपी होना रुक जाता है?</h3>
  <p>नहीं। वॉटरमार्क सिर्फ़ दिखने वाली रोकटोक है। कॉपी या छपाई रोकनी है तो वॉटरमार्क के साथ अनुमति वाला पासवर्ड लगाइए, जो नियम मानने वाले व्यूअर में उन कामों को बंद कर देता है।</p>

  <h3>टेक्स्ट की जगह लोगो लगा सकता हूँ?</h3>
  <p>हाँ। सबसे साफ़ नतीजे के लिए पारदर्शी बैकग्राउंड वाला PNG लीजिए। उसे भी उसी वजह से 30 से 40% ओपैसिटी पर तिरछा रखिए। डिज़ाइन और फ़ोटोग्राफ़ी के प्रूफ़ पर लोगो वॉटरमार्क आम चलन है।</p>

  <h2>अभी आज़माइए</h2>

  <p>अपने ड्राफ़्ट, प्रस्ताव या प्रूफ़ पर एक मिनट से कम में हैसियत की साफ़ मुहर लगाइए और इस शंका के बिना भेजिए कि सामने वाला इसे अंतिम वर्शन समझ लेगा। <a href="/hi/pdf-edit/add-watermark/">वॉटरमार्क टूल खोलें →</a> और यहाँ आए हैं तो बाक़ी <a href="/hi/all-tools/">सभी PDF टूल</a> भी देख लीजिए।</p>
