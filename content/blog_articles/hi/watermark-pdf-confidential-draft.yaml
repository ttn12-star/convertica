excerpt_hi: "कॉन्ट्रैक्ट का ड्राफ़्ट या कोई संवेदनशील प्रस्ताव भेज रहे हैं? हर पन्ने पर तिरछा वॉटरमार्क आपको कानूनी और दिखने वाली, दोनों तरह की सुरक्षा देता है, बशर्ते आप उसकी सेटिंग ठीक रखें।"
content_hi: |
  वॉटरमार्क सुरक्षा का नरम रूप है। यह ठाने हुए बदनीयत आदमी को नहीं रोकेगा, लेकिन तीन काम पक्के तौर पर करता है: पढ़ने वाले को बता देता है कि दस्तावेज़ अंतिम नहीं है, स्क्रीनशॉट या फ़ोटोकॉपी को साफ़ पहचान में लाने लायक बना देता है, और उस आम आदत पर लगाम लगाता है कि फ़ाइल आगे बढ़ा दी जाए। कॉन्ट्रैक्ट के ड्राफ़्ट, अंदरूनी प्रस्ताव या डिज़ाइन प्रूफ़ के लिए आम तौर पर इतनी ही रोक चाहिए होती है।

  यह गाइड Convertica के <a href="/hi/pdf-edit/add-watermark/">PDF पर वॉटरमार्क लगाने वाले टूल</a> से PDF के हर पन्ने पर CONFIDENTIAL या DRAFT का वॉटरमार्क लगाने का पूरा तरीक़ा बताती है, उन सेटिंग के साथ जो असल में पेशेवर दिखती हैं। साथ में वह हिस्सा भी है जिसे ज़्यादातर लेख छोड़ देते हैं: वॉटरमार्क रोकटोक है, एन्क्रिप्शन नहीं, और उसे असली ताले के साथ कब जोड़ना चाहिए।

  <figure><img src="/static/blog/images/tool-watermark-hero.jpg" alt="Convertica का वॉटरमार्क टूल, टेक्स्ट, ओपैसिटी और घुमाव के कंट्रोल के साथ" width="1280" height="800" loading="lazy"></figure>

  <h2>वॉटरमार्क असल में कब चाहिए</h2>

  वॉटरमार्क दस्तावेज़ की हैसियत बताता है। इसे तब लगाइए जब वह हैसियत ही आधी बात हो:

  <ul>
    <li><strong>कॉन्ट्रैक्ट के ड्राफ़्ट।</strong> हर पन्ने पर <code>DRAFT</code> की मुहर शुरुआती वर्शन को दस्तख़त हुए अंतिम दस्तावेज़ समझ लिए जाने से बचाती है। कई लीगल टीमों के पास वही किस्सा है, जहाँ DRAFT खरीद विभाग तक पहुँच गया, वॉटरमार्क हटाने की बात किसी को याद नहीं रही, और उसी पर दस्तख़त होकर वही असली अनुबंध बन गया।</li>
    <li><strong>NDA के तहत दी गई सामग्री।</strong> <code>CONFIDENTIAL</code> दस्तावेज़ की कानूनी स्थिति को मज़बूत करता है और लीक हुए किसी भी स्क्रीनशॉट को लीक करने वाले के ही ख़िलाफ़ सबूत बना देता है।</li>
    <li><strong>सिर्फ़ अंदरूनी इस्तेमाल की चीज़ें।</strong> बोर्ड मेमो या रणनीति की प्रस्तुतियों पर <code>INTERNAL USE ONLY</code> ग़लती से आगे भेज देने की गुंजाइश घटा देता है।</li>
    <li><strong>फ़ोटोग्राफ़र और डिज़ाइनर के प्रूफ़।</strong> हर झलक पर तिरछा टेक्स्ट क्लाइंट को पैसा देने से पहले काम इस्तेमाल करने से रोकता है।</li>
    <li><strong>मंज़ूरी से पहले की रिपोर्ट।</strong> <code>PENDING REVIEW</code> ड्राफ़्ट को आधिकारिक आँकड़े की तरह उद्धृत होने से बचाता है।</li>
    <li><strong>मुक़दमे की तैयारी वाले ड्राफ़्ट।</strong> दलीलों पर <code>DRAFT - ATTORNEY WORK PRODUCT</code> लिख देने से, वे ग़लती से बाहर निकल जाएँ तो भी उनकी हैसियत साफ़ रहती है।</li>
  </ul>

  <blockquote class="callout">अगर पढ़ने वाला आपकी फ़ाइल को अंतिम वर्शन समझ सकता है, तो उस पर वॉटरमार्क होना चाहिए।</blockquote>

  <h2>टेक्स्ट वॉटरमार्क या इमेज वॉटरमार्क</h2>

  चुनने के लिए दो रूप हैं, और कभी-कभी दोनों:

  <table>
    <thead>
      <tr><th>किस्म</th><th>किसके लिए सही</th><th>कीमत क्या चुकानी पड़ती है</th></tr>
    </thead>
    <tbody>
      <tr><td>टेक्स्ट वॉटरमार्क</td><td>हैसियत बताने वाले शब्द: DRAFT, CONFIDENTIAL, INTERNAL</td><td>सादा है, लेकिन साफ़ पढ़ा जाता है और फ़ाइल पर बोझ नहीं डालता</td></tr>
      <tr><td>इमेज वॉटरमार्क (लोगो)</td><td>मालिकाना हक़ जताना: प्रूफ़ पर कंपनी का लोगो</td><td>देखने में जँचता है, फ़ाइल का साइज़ बढ़ाता है, साफ़ पारदर्शी PNG चाहिए</td></tr>
      <tr><td>दोनों साथ</td><td>संवेदनशील क्लाइंट काम: लोगो के साथ DRAFT</td><td>सेटअप में ज़्यादा मेहनत, संकेत सबसे मज़बूत</td></tr>
    </tbody>
  </table>

  टेक्स्ट काफ़ी है जब बात प्रक्रिया की हो (यह अंतिम वर्शन नहीं है)। लोगो तब सही है जब बात मालिकाना हक़ की हो (यह काम हमारा है, जब तक आप बिल नहीं चुकाते)। रोज़ के ड्राफ़्ट पर दोनों लगाना ज़रूरत से ज़्यादा है, लेकिन डिज़ाइन और फ़ोटोग्राफ़ी की डिलीवरी में यही चलन है।

  लोगो फ़ाइलों पर एक ख़ास पेच: अगर आपका लोगो PNG असली पारदर्शी परत के बजाय सफ़ेद चौकोर बैकग्राउंड के साथ बना है, तो वॉटरमार्क हर पन्ने पर एक दिखने वाले सफ़ेद डिब्बे के अंदर बैठ जाएगा, जो वॉटरमार्क न होने से भी बुरा लगता है। PNG को किसी ऐसे व्यूअर में खोलिए जो पारदर्शिता दिखाता है (macOS पर Preview, Windows पर IrfanView का tile view) और देख लीजिए कि लोगो के चारों तरफ़ सफ़ेद नहीं, शतरंज जैसे खाने दिख रहे हैं।

  <h2>कदम-दर-कदम: टेक्स्ट वॉटरमार्क लगाना</h2>

  वे सेटिंग, जो असल में पेशेवर दिखती हैं:

  <figure><img src="/static/blog/images/tool-watermark-options.jpg" alt="PDF के हर पन्ने पर लगा तिरछा CONFIDENTIAL वॉटरमार्क" width="1280" height="800" loading="lazy"></figure>

  <ol>
    <li><a href="/hi/pdf-edit/add-watermark/">वॉटरमार्क टूल</a> खोलिए और अपनी फ़ाइल अपलोड कीजिए।</li>
    <li>वॉटरमार्क की किस्म <strong>Text</strong> पर कर दीजिए।</li>
    <li>वॉटरमार्क का टेक्स्ट लिखिए। बड़े अक्षरों में रखिए: <code>DRAFT</code>, <code>CONFIDENTIAL</code>, या अपनी कंपनी का नाम।</li>
    <li>फ़ॉन्ट कोई सादा सैन्स-सेरिफ़ (Arial या Helvetica) चुनिए और आकार बड़ा रखिए: A4 पर 60 से 80 pt।</li>
    <li>रंग बीच वाला स्लेटी (करीब #888) रखिए, ताकि हल्के पन्नों पर वॉटरमार्क पढ़ा जाए और गहरी तस्वीरों पर काला धब्बा न बने।</li>
    <li>ओपैसिटी <strong>30 से 40%</strong> रखिए। 25% से नीचे छपने पर दिखना मुश्किल हो जाता है, 50% से ऊपर नीचे के टेक्स्ट को पढ़ने में अड़चन डालता है।</li>
    <li>घुमाव <strong>45 डिग्री</strong> यानी तिरछा रखिए। यह सीधे टेक्स्ट से ज़्यादा जगह ढकता है और गोपनीयता की मुहरों का जमा हुआ चलन भी यही है।</li>
    <li>सिर्फ़ पहले पन्ने पर नहीं, <strong>सभी पन्नों</strong> पर लगाइए।</li>
    <li>नतीजा देख लीजिए। अगर वॉटरमार्क टेक्स्ट के पीछे बैठा है, काम हो गया। अगर वह दस्तख़त की लाइन ढक रहा है, ओपैसिटी 25% पर ले आइए।</li>
    <li>फ़ाइल डाउनलोड कर लीजिए।</li>
  </ol>

  डाउनलोड के बाद एक छोटी जाँच फ़ायदे की है: फ़ाइल उस व्यूअर में खोलिए जो आपका पाने वाला इस्तेमाल करेगा, सिर्फ़ उसमें नहीं जिसमें आपने वॉटरमार्क लगाया। Foxit और Nitro Reader के कुछ पुराने वर्शन वॉटरमार्क को Acrobat से थोड़ा बड़ा दिखाते हैं, जिससे तिरछा टेक्स्ट पन्ने के किनारे से बाहर निकल सकता है। अगर सामने वाला दफ़्तर की उस मशीन पर है जिसमें पुराना PDF रीडर चलता है, तो वही वर्शन तय करेगा कि वॉटरमार्क ठीक दिख रहा है या नहीं।

  <h2>कानूनी वज़न के लिए बेहतर तरीक़े</h2>

  किसी विवाद में वॉटरमार्क का वज़न तब बढ़ता है जब वह हर जगह एक जैसा और साफ़ दिखता हो। काम के नियम:

  <ul>
    <li><strong>ओपैसिटी 30 से 40%।</strong> किसी भी बैकग्राउंड पर पढ़ा जाएगा, और ऊपर की परत जैसा ही लगेगा।</li>
    <li><strong>तिरछी जगह।</strong> ऊपर या नीचे की पट्टी से ज़्यादा जगह ढकता है और स्क्रीनशॉट काटे जाने पर भी बचा रहता है।</li>
    <li><strong>हर पन्ने पर लगाइए।</strong> सिर्फ़ पहले पन्ने का वॉटरमार्क आधे-अधूरे स्क्रीनशॉट को न्योता देता है, जो बिना मुहर के दिखते हैं।</li>
    <li><strong>बिना वॉटरमार्क वाली मूल फ़ाइल बचा कर रखिए।</strong> असली फ़ाइल अलग से सहेजिए। सौदा पक्का होने पर आप साफ़ वर्शन बनाकर देते हैं, वॉटरमार्क खुरचने का काम नहीं करते।</li>
    <li><strong>शब्द तय कर लीजिए।</strong> एक ही वाक्यांश चुनिए (DRAFT - NOT FOR EXECUTION या CONFIDENTIAL) और उसी पर टिकिए। बदलते हुए शब्द जल्दबाज़ी में गढ़े लगते हैं और संकेत कमज़ोर करते हैं।</li>
    <li><strong>वॉटरमार्क पर तारीख़ डालिए।</strong> DRAFT - 2026-04-28 से साफ़ हो जाता है कि सामने वाला कौन सा रिवीज़न देख रहा है, और यह बहाना ख़त्म हो जाता है कि मैंने जो वर्शन देखा था उसमें कुछ और लिखा था।</li>
    <li><strong>अक्षरों का रूप मत बदलिए।</strong> एक ही सेट में कहीं Confidential और कहीं CONFIDENTIAL हो, तो लगता है एक दूसरे का ड्राफ़्ट है।</li>
  </ul>

  कई हिस्सों वाले दस्तावेज़ में पहले <a href="/hi/pdf-organize/merge/">सभी ड्राफ़्ट पन्नों को एक फ़ाइल में जोड़</a> लीजिए, फिर पूरे बंडल पर एक बार वॉटरमार्क लगाइए। हर हिस्से पर अलग-अलग वॉटरमार्क लगाने से नतीजा साफ़ आता है।

  <h2>वॉटरमार्क एन्क्रिप्शन नहीं है</h2>

  यह वही हिस्सा है जिसे PDF पर वॉटरमार्क कैसे लगाएँ वाले ज़्यादातर लेख छोड़ देते हैं, क्योंकि यह बेचने में असुविधाजनक है। वॉटरमार्क दिखने वाली रोकटोक है। यह ये काम नहीं करता:

  <ul>
    <li>सामने वाले को PDF से टेक्स्ट कॉपी करने से रोकना।</li>
    <li>स्क्रीनशॉट रोकना, उन कटे स्क्रीनशॉट समेत जिनमें एक पैराग्राफ़ ही बचा हो।</li>
    <li>फ़ाइल की सामग्री एन्क्रिप्ट करना।</li>
    <li>इमेज एडिटर वाले ठाने हुए आदमी को इसे हटाने से रोकना (धीरे और अधूरे ढंग से, पर हटा लेगा)।</li>
    <li>अच्छे OCR से बच जाना, जो पूरा टेक्स्ट पढ़कर नई फ़ाइल में उतार दे।</li>
  </ul>

  जो यह करता है, वह सामाजिक और कानूनी ज़मीन तैयार करना है। बिना वॉटरमार्क लीक हुआ ड्राफ़्ट भोली भूल मानी जा सकती है। हर पन्ने पर <code>CONFIDENTIAL</code> लिखा वही ड्राफ़्ट लीक हो, तो यह उस NDA का साफ़ उल्लंघन है जिस पर सामने वाले ने दस्तख़त किए थे, और वकील जब हर्ज़ाना तय कर रहे हों तो यही फ़र्क़ काम आता है।

  वाक़ई संवेदनशील सामग्री पर वॉटरमार्क को असली सुरक्षा से जोड़िए: <a href="/hi/pdf-security/protect/">दस्तावेज़ पर पासवर्ड भी लगाइए</a>, AES-256 एन्क्रिप्शन के साथ, और पासवर्ड फ़ाइल से अलग रास्ते से भेजिए। वॉटरमार्क और पासवर्ड, यह वही स्तर है जिसकी ज़्यादातर लीगल और फ़ाइनैंस टीमें बोर्ड की सामग्री और बिना दस्तख़त वाले व्यापारिक समझौतों पर उम्मीद करती हैं। और साफ़ कहें तो इस स्तर पर भी भरोसा सामने वाले पर ही है। ऐसी कोई तकनीक नहीं जो अंदर के आदमी को फ़ोन के कैमरे से स्क्रीन उतारने से रोक दे। वॉटरमार्क और पासवर्ड का मतलब नेकनीयती और रोकटोक है, छेड़छाड़ से पूरी सुरक्षा नहीं।

