      </tr>
    </tbody>
  </table>

  जो कोई फ़ैक्स पर 99% का वादा करता है, उसने या जाँचा नहीं है या कुछ बेच रहा है। उम्मीद यह रखिए कि पढ़कर सुधारना पड़ेगा, यह नहीं कि नतीजा सीधे आगे भेज दूँगा।

  एक ख़ास पेच: बिल नंबर और रेफ़रेंस कोड वहीं हैं जहाँ OCR की ग़लती सबसे भारी पड़ती है। पैराग्राफ़ के बीच एक अंक ग़लत पढ़ा जाना माफ़ है; Invoice 1023841 में एक अंक ग़लत हो जाए तो भुगतान दूसरे खाते में चला जाता है। OCR के नतीजे में सारे नंबर मूल फ़ाइल से मिला लीजिए।

  <h2>OCR से पहले की सफ़ाई, जो सटीकता बढ़ा देती है</h2>

  पाँच मिनट की तैयारी बाद की सफ़ाई आधी कर देती है:

  <ul>
    <li><strong>तिरछे पन्ने सीधे कीजिए।</strong> OCR इंजन मानकर चलते हैं कि टेक्स्ट सीधा है। 90 डिग्री घूमा पन्ना बकवास लौटाता है या कुछ भी नहीं। इसलिए पहले <a href="/hi/pdf-edit/rotate/">पन्ने घुमाकर सीधे कर लीजिए</a>।</li>
    <li><strong>ज़्यादा हाशिया काट दीजिए।</strong> चौड़े सफ़ेद किनारे ढाँचा पढ़ने वाले को भरमाते हैं कि एक कॉलम दो हैं। जहाँ से टेक्स्ट असल में शुरू होता है, वहाँ तक <a href="/hi/pdf-edit/crop/">हाशिया काट दीजिए</a>।</li>
    <li><strong>कंट्रास्ट बढ़ाइए।</strong> फीके स्कैन को PDF बनाने से पहले स्कैनर के सॉफ़्टवेयर या किसी इमेज एडिटर में कंट्रास्ट बढ़ा देने से फ़ायदा होता है। पूरे सफ़ेद पर पूरा काला टेक्स्ट सबसे अच्छी हालत है।</li>
    <li><strong>टेढ़ापन सीधा कीजिए।</strong> दो-तीन डिग्री की तिरछाई भी सटीकता गिरा देती है। ज़्यादातर स्कैनर सॉफ़्टवेयर में यह अपने आप करने का विकल्प है, और वह चलाने लायक है।</li>
    <li><strong>हो सके तो स्कैन ही स्लेटी या काले-सफ़ेद में कीजिए।</strong> रंग की परत (दफ़्तर की फ़ोटोकॉपी में आने वाली पीली झाईं) कंट्रास्ट को ऐसे खिसका देती है कि पहचानने वाला भटक जाता है।</li>
    <li><strong>स्कैन से पहले स्टेपल और सलवटें हटा दीजिए।</strong> बात मामूली लगती है, पर मुड़े पन्ने छाया की लकीरें बनाते हैं, जिन्हें OCR रेखांकन या तालिका की लाइन समझ लेता है।</li>
  </ul>

  <h2>OCR के बाद की जाँच-सूची</h2>

  .docx आ जाए, तो गंभीरता से एडिट करने से पहले दो-तीन बार ढूँढो-और-बदलो चला लीजिए। अंग्रेज़ी दस्तावेज़ों में OCR की सबसे आम ग़लतियाँ ये हैं:

  <ul>
    <li><code>rn</code> बार-बार <code>m</code> बन जाता है, और उल्टा भी होता है। modern जैसे शब्द ढूँढकर देखिए।</li>
    <li><code>l</code> (छोटा एल) और <code>1</code> (एक) की अदला-बदली। बिल नंबर और तारीख़ों में सबसे आम।</li>
    <li><code>0</code> (शून्य) और <code>O</code> (बड़ा ओ) कोड और आईडी के अंदर उलट जाते हैं।</li>
    <li>तिरछे उद्धरण चिह्न सीधे हो जाते हैं या उलटा, और उद्धरण टूट जाते हैं।</li>
    <li>लंबी डैश दो हाइफ़न या हाइफ़न-खाली जगह-हाइफ़न में बदल जाती है।</li>
    <li>हर पन्ने के ऊपर-नीचे लिखी पंक्तियाँ बीच के टेक्स्ट में घुल जाती हैं। उन्हें एक बार हटाइए और Word का असली हेडर इस्तेमाल कीजिए।</li>
    <li>बुलेट वाली सूचियाँ सादे पैराग्राफ़ बन जाती हैं, जिनके आगे शाब्दिक • या भटका हुआ o लगा होता है।</li>
    <li>लाइन के आख़िर में टूटे शब्द (mer- और अगली लाइन पर chant) कभी-कभी असली हाइफ़न बनकर बचे रह जाते हैं। हाइफ़न के बाद खाली जगह ढूँढकर सुधार लीजिए।</li>
  </ul>

  तालिकाएँ लगभग हमेशा हाथ से बनानी पड़ती हैं। अगर मूल फ़ाइल में वह डेटा है जो आप आगे स्प्रेडशीट में ही चाहते हैं, तो Word से गुज़रने के बजाय <a href="/hi/pdf-to-excel/">सीधे Excel में निकाल लेना</a> तेज़ पड़ सकता है।

  एक बात अलग से: दस्तख़त और मुहरें OCR से पार नहीं उतरतीं। वे छोटी तस्वीरों की तरह आती हैं, अक्सर कटी हुई, कभी-कभी पूरी ग़ायब। अगर दस्तावेज़ की कानूनी कीमत दस्तख़त पर टिकी है, तो OCR वाला Word आपकी काम चलाने की कॉपी है, आधिकारिक रिकॉर्ड नहीं। असली रिकॉर्ड मूल PDF ही रहेगी।

  <h2>OCR कब फ़ायदे का नहीं है</h2>

  कभी-कभी सही जवाब यह होता है कि OCR चलाकर सुधारने के बजाय दोबारा टाइप कर लीजिए। यह सीमा दस्तावेज़ की लंबाई और स्कैन की हालत पर टिकी है:

  <ul>
    <li><strong>साफ़ छपाई का एक पन्ने से कम:</strong> दोबारा टाइप करना अक्सर OCR चलाने, डाउनलोड करने, Word खोलने और पढ़कर सुधारने से तेज़ है।</li>
    <li><strong>साफ़ छपाई के एक से दस पन्ने:</strong> OCR जीतता है, सफ़ाई के साथ भी।</li>
    <li><strong>ख़राब फ़ैक्स के दस या ज़्यादा पन्ने:</strong> समय के हिसाब से OCR जीतता है, पर सफ़ाई उबाऊ होगी। इसे पूरा काम मानकर चलिए, पाँच मिनट का नहीं।</li>
    <li><strong>हाथ से लिखा कुछ भी:</strong> दोबारा टाइप कीजिए, जब तक दस्तावेज़ सैकड़ों पन्नों का न हो और दूसरा रास्ता उसे डिजिटल रूप में रखना ही छोड़ देना हो।</li>
    <li><strong>अंकों का डेटा:</strong> नंबर दोबारा टाइप करना, OCR के हर अंक की जाँच करने से तेज़ है, और वह जाँच छोड़ी नहीं जा सकती अगर सटीकता मायने रखती है।</li>
  </ul>

  गोपनीयता की एक और बात: कोई मेडिकल रिकॉर्ड या गवाही का लेखा जिसे आप वेब सेवा से OCR कराते हैं, वह थोड़ी देर के लिए किसी और के सर्वर पर रहा है, चाहे वह सर्वर उसे फ़ौरन मिटा भी दे। HIPAA, GDPR की ख़ास श्रेणी के डेटा, या वकील-क्लाइंट की गोपनीयता वाले दस्तावेज़ों पर OCR अपने ही कंप्यूटर पर चलाइए, Tesseract या ABBYY FineReader जैसे टूल से। पाँच मिनट की सेटिंग मन की शांति के लायक है।

  <h2>अक्सर पूछे जाने वाले सवाल</h2>

  <h3>रूपांतरण के बाद मेरा Word दस्तावेज़ ख़ाली क्यों आता है?</h3>
  <p>लगभग हमेशा इसलिए कि आपने स्कैन PDF पर OCR के बिना चलने वाला कन्वर्टर चलाया। उसे कोई टेक्स्ट परत नहीं मिली, इसलिए उसने पन्नों की तस्वीरें रख दीं और एडिट होने वाला टेक्स्ट नहीं बना। फ़ाइल को OCR वाले रास्ते से दोबारा चलाइए।</p>

  <h3>क्या OCR हाथ से लिखे नोट पढ़ लेता है?</h3>
  <p>कभी-कभी, और ख़राब तरीक़े से। हाथ की लिखाई पर OCR नए मॉडल से सुधरा है, लेकिन असल लिखाई पर सटीकता अब भी 30 से 70% के बीच झूलती है। किसी ज़रूरी चीज़ के लिए दोबारा टाइप करना, OCR का नतीजा सुधारने से तेज़ पड़ता है। अलग-अलग बड़े अक्षरों में लिखी लिखाई (जैसे फ़ॉर्म में भरी जाती है) घसीट से बहुत बेहतर पढ़ी जाती है।</p>

  <h3>OCR कौन सी भाषाएँ पढ़ लेता है?</h3>
  <p>ज़्यादातर इंजन, Convertica का इंजन भी, सभी बड़ी यूरोपीय भाषाएँ पढ़ लेते हैं: अंग्रेज़ी, स्पैनिश, फ़्रेंच, जर्मन, इतालवी, पुर्तगाली, रूसी, पोलिश और कई और। मात्राओं वाली या ग़ैर-लातीनी लिपियों के लिए मूल भाषा ख़ुद चुनिए। मिली-जुली भाषा वाले दस्तावेज़ (अंग्रेज़ी में बीच-बीच में फ़्रेंच उद्धरण) तब सबसे अच्छे आते हैं जब मुख्य भाषा चुनी गई हो।</p>

  <h3>तालिकाएँ उलट-पुलट टेक्स्ट क्यों बन जाती हैं?</h3>
  <p>OCR बाएँ से दाएँ और ऊपर से नीचे पढ़ता है, और तालिका के खाने इस बहाव को तोड़ देते हैं। पहली पंक्ति के तीसरे खाने के अंक दूसरी पंक्ति के पहले खाने के बगल में जा सकते हैं। तालिका वाले डेटा के लिए सीधे Excel में बदलकर वहाँ तालिका बनाना, Word में सुधारने से तेज़ रहता है।</p>

  <h3>क्या OCR वाला रूपांतरण गोपनीय रहता है?</h3>
  <p>भरोसेमंद ब्राउज़र टूल फ़ाइल को थोड़ी देर के सत्र में पढ़ते हैं और उसके तुरंत बाद मिटा देते हैं। संवेदनशील दस्तावेज़ अपलोड करने से पहले उस टूल की प्राइवेसी पॉलिसी पढ़ लीजिए। बहुत गोपनीय सामग्री पर वेब सेवा की जगह अपने कंप्यूटर पर OCR (Tesseract, ABBYY) चलाने पर सोचिए।</p>

  <h3>पचास पन्नों के स्कैन पर OCR कितना समय लेता है?</h3>
  <p>अच्छी सेवा पर करीब दो से पाँच मिनट, तस्वीरों के रेज़ोल्यूशन और सर्वर के बोझ के हिसाब से। 600 DPI के स्कैन 300 DPI से साफ़ तौर पर ज़्यादा समय लेते हैं और नतीजा बेहतर नहीं देते।</p>

  <h2>अभी आज़माइए</h2>

  <p>दोबारा टाइप करना छोड़िए। अपना स्कैन <a href="/hi/pdf-to-word/">PDF से Word कन्वर्टर</a> पर डालिए, मूल भाषा चुनिए, और एक मिनट बाद आप Word में एडिट कर रहे होंगे। बस नतीजा आगे भेजने से पहले एक बार पढ़कर देखने का समय रख लीजिए।</p>
