slug: convert-scanned-pdf-to-editable-word
title_hi: "स्कैन की गई PDF को एडिट होने वाले Word में कैसे बदलें (OCR के नुस्ख़ों के साथ)"
meta_title_hi: "स्कैन PDF को एडिट होने वाले Word में बदलें | Convertica"
meta_description_hi: "स्कैन की गई PDF दरअसल टेक्स्ट की तस्वीरें हैं। OCR उन्हें एडिट होने वाले Word में कैसे बदलता है, कितनी सटीकता मिलती है, और कौन सी सफ़ाई ज़रूरी है।"
meta_keywords_hi: "स्कैन PDF को Word में बदलें, OCR से PDF को Word, एडिट होने वाली PDF, स्कैन को docx बनाएँ, scanned pdf to word hindi"
excerpt_hi: "अगर आपकी PDF में टेक्स्ट चुनने पर सिर्फ़ खाली जगह चुनी जाती है, तो आपके पास स्कैन है, और आम कन्वर्टर की जगह OCR चाहिए। उससे क्या उम्मीद रखनी है, यह पूरा हिसाब है।"
content_hi: |
  सामने खुली PDF पर यह आज़माइए: किसी पैराग्राफ़ पर माउस दबाकर खींचिए, जैसे टेक्स्ट कॉपी करने वाले हों। अगर कर्सर एक-एक शब्द चुनता है, तो PDF डिजिटल है और आम कन्वर्टर काम कर देगा। अगर पूरे पन्ने के चारों तरफ़ एक बड़ा चौकोर चुना जाता है, तो आपके पास स्कैन है, यानी हर पन्ना असल में काग़ज़ की तस्वीर है, और आम PDF से Word वाला टूल आपको तस्वीरों से भरा Word दस्तावेज़ लौटाएगा, टेक्स्ट वाला नहीं।

  यहाँ OCR की ज़रूरत पड़ती है। OCR तस्वीर के बिंदुओं को पढ़कर उन्हें असली अक्षरों, शब्दों और पैराग्राफ़ में दोबारा खड़ा करता है। ठीक से हो जाए तो एडिट होने वाली .docx मिलती है। ठीक से न हो तो गड्डमड्ड टेक्स्ट मिलता है और एक घंटा कॉमा, खाली जगहें और rn को m पढ़ लेने जैसी ग़लतियाँ सुधारने में जाता है। यह फ़र्क़ ज़्यादातर मूल फ़ाइल तय करती है, और कुछ हद तक वे चीज़ें जो आपके हाथ में हैं।

  <figure><img src="/static/blog/images/tool-pdf-to-word-hero.jpg" alt="Convertica का PDF से Word कन्वर्टर, OCR के लिए स्कैन किया दस्तावेज़ लेते हुए" width="1280" height="800" loading="lazy"></figure>

  <h2>कैसे पहचानें कि PDF स्कैन की हुई है</h2>

  चार छोटी जाँचें:

  <ul>
    <li><strong>टेक्स्ट चुनकर देखिए।</strong> कोई एक शब्द चुनने की कोशिश कीजिए। अगर पूरा पन्ना एक चुने जाने वाले चौकोर में बदल जाता है, तो पन्ना तस्वीर है।</li>
    <li><strong>फ़ाइल का साइज़।</strong> दस पन्नों की टेक्स्ट PDF आम तौर पर 100 से 500 KB होती है। दस पन्नों की स्कैन PDF अक्सर 5 से 30 MB, क्योंकि हर पन्ना ऊँचे रेज़ोल्यूशन की तस्वीर है।</li>
    <li><strong>देखने में मिलने वाले निशान।</strong> स्कैन में छींटे, हल्का टेढ़ापन, फीके किनारे और काग़ज़ की बुनावट दिखती है। सीधे कंप्यूटर पर बनी PDF में किनारे साफ़ होते हैं और बैकग्राउंड में कोई कचरा नहीं होता।</li>
    <li><strong>कर्सर का रूप।</strong> टेक्स्ट पर कर्सर ले जाइए। डिजिटल PDF में वह टेक्स्ट पर खड़ी लकीर और तस्वीरों पर तीर बन जाता है। स्कैन में हर जगह तीर ही रहता है, क्योंकि वहाँ सब तस्वीर है।</li>
  </ul>

  मिली-जुली PDF भी होती हैं, जहाँ किसी ने कॉन्ट्रैक्ट स्कैन किया और आख़िर में दस्तख़त का डिजिटल पन्ना जोड़ दिया। OCR डिजिटल पन्ना छोड़ देता है (वहाँ ज़रूरत नहीं) और सिर्फ़ स्कैन वाले पन्ने पढ़ता है। किसी बड़ी फ़ाइल को एक ही किस्म का मान लेने से पहले उसके दो-तीन अलग पन्नों पर टेक्स्ट चुनकर देख लीजिए।

  <h2>OCR असल में क्या करता है</h2>

  OCR अक्षरों की शक्ल पहचानने का काम है। इंजन बिंदुओं के झुंड देखता है, उन्हें लाखों अक्षर-तस्वीरों पर सिखाए गए मॉडल से मिलाता है, और सबसे संभावित अक्षर के साथ अपने भरोसे का दर्जा भी बताता है। आजकल के इंजन आसपास के संदर्भ का भी सहारा लेते हैं: अगर उसे 80% भरोसा है कि अगला शब्द agreement है और तीसरा अक्षर r और n के बीच अटका है, तो वह r चुन लेगा, क्योंकि agreement असली शब्द है।

  सटीकता पर सबसे ज़्यादा असर दो सेटिंग का पड़ता है:

  <ul>
    <li><strong>मूल भाषा।</strong> फ़्रेंच दस्तावेज़ पर अंग्रेज़ी के लिए सिखाया मॉडल मात्राओं वाले अक्षर ग़लत पढ़ेगा और आम शब्दों में गड़बड़ करेगा। टूल पूछे तो भाषा हमेशा ख़ुद चुनिए।</li>
    <li><strong>स्कैन का DPI।</strong> साफ़ OCR के लिए 300 DPI सबसे नीचे की सीमा है। 200 DPI बड़े अक्षरों पर चल जाता है, पर छोटे फ़ुटनोट पर लड़खड़ाता है। 150 से नीचे सटीकता तेज़ी से गिर जाती है।</li>
  </ul>

  एक तीसरी बात, जिस पर लोग कम सोचते हैं: कंट्रास्ट। OCR स्याही और काग़ज़ के बीच के अंतर पर चलता है। फ़ोटोकॉपी की फ़ोटोकॉपी में DPI काग़ज़ पर 300 रह सकता है और नतीजा फिर भी लुगदी आएगा, क्योंकि अंतर इतना कम है कि पहचानने वाले को अक्षरों के किनारे ही नहीं मिलते। नए इंजन इसे पुराने से बेहतर सँभालते हैं, लेकिन Tesseract के पुराने वर्शन (4.0 से पहले का कुछ भी, जो 2018 में आया) कम कंट्रास्ट पर अब भी लड़खड़ाते हैं।

  <h2>कदम-दर-कदम: स्कैन PDF से Word</h2>

  <figure><img src="/static/blog/images/tool-pdf-to-word-options.jpg" alt="OCR वाली PDF से Word रूपांतरण, स्कैन को एडिट होने वाली .docx में बदलते हुए" width="1280" height="800" loading="lazy"></figure>

  <ol>
    <li><a href="/hi/pdf-to-word/">PDF को Word में बदलने वाला टूल</a> खोलिए और अपना स्कैन अपलोड कीजिए। टेक्स्ट चुनने पर कुछ न मिले, तो टूल ख़ुद पहचान लेता है कि OCR चलाना है।</li>
    <li>मूल भाषा चुनिए, ताकि पहचानने वाला सही शब्दकोश उठाए। अंग्रेज़ी, स्पैनिश, जर्मन, फ़्रेंच, इतालवी, पुर्तगाली, रूसी और पोलिश, सब भाषा साफ़ बता देने पर बेहतर नतीजे देती हैं।</li>
    <li>रूपांतरण चलाइए। दस पन्नों का स्कैन तस्वीरों की जटिलता के हिसाब से करीब 30 से 90 सेकंड लेता है। सौ पन्नों का पुलिंदा कई मिनट चल सकता है।</li>
    <li>.docx डाउनलोड कीजिए और Word में खोलिए। बाक़ी पर भरोसा करने से पहले पहला पन्ना मूल PDF से मिलाकर देख लीजिए।</li>
  </ol>

  <blockquote class="callout">मूल स्कैन PDF हमेशा बचा कर रखिए। OCR कोई पन्ना बिगाड़ दे, तो आपको मिलान करने के लिए असली फ़ाइल चाहिए, अंदाज़ा नहीं कि वह अटपटा शब्द क्या होना चाहिए था।</blockquote>

  नतीजे पर भरोसा करने से पहले एक जाँच काम की है: .docx को Word में खोलकर फ़ॉर्मैटिंग के निशान दिखा दीजिए (Windows पर Ctrl+Shift+8, macOS पर Cmd+8)। अगर हर लाइन के आख़िर में पैराग्राफ़ का निशान दिख रहा है, क्योंकि OCR ने हर दिखने वाली लाइन को अलग पैराग्राफ़ समझ लिया, तो एडिटिंग शुरू करने से पहले ढूँढो-और-बदलो से यह ठीक कर लीजिए। तरीक़ा सीधा है: पहले एक पैराग्राफ़ निशान को खाली जगह से बदलिए, फिर दो निशानों को एक से। यह अकेली आदत किसी भी OCR सेटिंग से ज़्यादा समय बचाती है।

  <h2>सटीकता की सही उम्मीद</h2>

  99% सटीकता वाले दावे सफ़ेद काग़ज़ पर साफ़ छपे टेक्स्ट और 300 DPI को मानकर बनते हैं। असल दस्तावेज़ इससे बहुत अलग होते हैं। असल में क्या मिलता है:

  <table>
    <thead>
      <tr>
        <th>दस्तावेज़ की किस्म</th>
        <th>आम OCR सटीकता</th>
        <th>कितनी सफ़ाई करनी पड़ेगी</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>साफ़ छपा टेक्स्ट, नया दस्तावेज़</td>
