      </tr>
      <tr>
        <td>फ़ैक्स या फ़ोटोकॉपी</td>
        <td>80 से 90%</td>
        <td>पन्ना-दर-पन्ना पढ़कर सुधारना</td>
      </tr>
      <tr>
        <td>टाइपराइटर या 2000 से पहले की छपाई</td>
        <td>75 से 90%</td>
        <td>ठीक-ठाक मेहनत, ख़ासकर 1 और l के लिए</td>
      </tr>
      <tr>
        <td>हाथ की लिखाई</td>
        <td>30 से 70%, बहुत ऊपर-नीचे</td>
