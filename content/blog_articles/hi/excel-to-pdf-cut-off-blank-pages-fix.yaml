content_hi: |
  स्प्रेडशीट एक अंतहीन ग्रिड है। PDF तय साइज़ के काग़ज़ों का एक ढेर है। Excel से PDF की हर समस्या असल में यही है कि कन्वर्टर अंदाज़ा लगाता है कि आपका ग्रिड कहाँ ख़त्म होता है और उसे पेजों में कैसे काटे, और अंदाज़ा ग़लत निकलता है।

  अच्छी बात यह है कि ये ग़लत अंदाज़े कुछ गिने-चुने कारणों से आते हैं। नीचे अपना कारण ढूँढें, फ़ाइल में एक बार ठीक करें, और उस फ़ाइल का हर अगला एक्सपोर्ट सही निकलेगा।

  <h2>1. कॉलम अलग पेज पर चले जाते हैं</h2>

  <p><strong>क्या दिखता है:</strong> पेज 1 पर कॉलम A से F हैं, और कॉलम G से K अकेले पेज 4 पर आते हैं, सारी रो के बाद, बिना किसी रो लेबल के।</p>

  <p><strong>क्यों:</strong> डिफ़ॉल्ट रूप से शीट 100% साइज़ पर प्रिंट होती है। अगर टेबल काग़ज़ से चौड़ी है, तो जो कॉलम नहीं समाते वे अपने अलग पेजों पर चले जाते हैं, जो रो के पहले हिस्से के बाद प्रिंट होते हैं। "मेरी आधी शीट गायब है" वाला असर यही है: शीट गायब नहीं है, वह तीन पेज बाद है।</p>

  <p><strong>Excel में समाधान:</strong> Page Layout टैब में <strong>Scale to Fit</strong> ग्रुप। <strong>Width</strong> को "1 page" पर सेट करें और <strong>Height</strong> को "Automatic" ही रहने दें। अब टेबल बस उतनी सिकुड़ेगी जितने में वह चौड़ाई में समा जाए, और नीचे जितने पेज चाहिए उतने लेगी। चौड़ी टेबल के लिए <strong>Orientation</strong> को Landscape भी कर दें, इससे कुछ भी सिकोड़ने से पहले ही लगभग 40% ज़्यादा चौड़ाई मिल जाती है।</p>

  <p>लंबी टेबल पर width और height दोनों को 1 page पर सेट न करें। इससे 300 रो एक ही पेज में ठूँस दी जाती हैं, और आप अगली समस्या में पहुँच जाते हैं।</p>

  <p><a href="/hi/excel-to-pdf/">Excel to PDF कन्वर्टर</a> चौड़ाई वाला काम ख़ुद कर देता है: जब तक फ़ाइल में पहले से अपनी प्रिंट स्केलिंग न हो, वह सारे कॉलम पेज की चौड़ाई में फ़िट कर देता है और चौड़ी टेबल को landscape में घुमा देता है। हमारी जाँच में 25 कॉलम की एक टेबल, जो साधारण कन्वर्ज़न में चार पेज बन रही थी, एक ही landscape पेज पर आ गई।</p>

  <h2>2. दर्जनों (या हज़ारों) खाली पेज</h2>

  <p><strong>क्या दिखता है:</strong> आपका डेटा दो पेज का है और PDF में 40 पेज हैं, लगभग सब खाली। या डेटा का एक पेज और उसके बाद ऐसे पेज जिन पर ग्रिड लाइनों के सिवा कुछ नहीं।</p>

  <p><strong>क्यों:</strong> कन्वर्टर उस आख़िरी सेल तक सब कुछ प्रिंट करता है जिसे वह इस्तेमाल हुआ मानता है। अक्सर यह आपके डेटा की आख़िरी रो नहीं होती। आम कारण:</p>

  <ul>
    <li>बहुत नीचे या दाईं ओर किसी सेल में टाइप किया गया एक स्पेस, जिसे आप भूल गए;</li>
    <li>रो 5000 तक कॉपी किया गया फ़ॉर्मूला जो ख़ाली स्ट्रिंग लौटाता है (<code>=IF(A2="","",...)</code>);</li>
    <li>ख़ुद Excel में, पूरी रो या पूरे कॉलम पर लगा बॉर्डर या फ़िल कलर, जिसे Excel भी इस्तेमाल हुआ गिनता है।</li>
  </ul>

  <p><strong>कैसे ढूँढें:</strong> किसी भी सेल पर क्लिक करें और <strong>Ctrl+End</strong> दबाएँ (Mac पर Cmd+Fn+Right arrow)। Excel उस जगह के नीचे-दाएँ कोने पर पहुँच जाता है जिसे वह used range मानता है। अगर वह सेल AZ4000 है और आपकी टेबल F120 पर ख़त्म होती है, तो बीच का सारा हिस्सा ही खाली पेज बन रहा है।</p>

  <p><strong>समाधान:</strong> अपनी टेबल के नीचे की रो चुनें (पहली ख़ाली रो के नंबर पर क्लिक करें, फिर Ctrl+Shift+Down arrow), राइट-क्लिक करें, <strong>Delete</strong>। दाईं ओर के कॉलम के साथ भी यही करें। फिर फ़ाइल सेव करें: Excel used range को सिर्फ़ सेव करने पर दोबारा गिनता है। सेल पर Delete key दबाना काफ़ी नहीं है, क्योंकि वह वैल्यू हटाता है और फ़ॉर्मेटिंग छोड़ देता है; आपको रो और कॉलम वाला Delete कमांड चाहिए।</p>

  <p><strong>या Print Area सेट करें</strong>, फिर बाकी शीट से कोई फ़र्क़ नहीं पड़ता: टेबल चुनें, Page Layout, Print Area, Set Print Area।</p>

  <p>Excel to PDF कन्वर्टर उन सेल को अनदेखा करता है जिन पर सिर्फ़ फ़िल या बॉर्डर लगा है। जिस वर्कबुक में फ़ॉर्मूले नहीं हैं, उसमें वह टेबल के बाद पड़े भूले हुए स्पेस भी ख़ाली कर देता है, ताकि वे खाली पेज न बनाएँ। उसी रो में टेक्स्ट के ठीक बाद वाला स्पेस बना रहता है, क्योंकि लोग अक्सर इसी तरह लंबे नोट को अगले कॉलम में फैलने से रोकते हैं। फ़ॉर्मूले वाली वर्कबुक जैसी है वैसी ही बदली जाती है, क्योंकि हो सकता है कोई फ़ॉर्मूला उन सेल को गिन रहा हो, इसलिए उनके लिए ऊपर बताई गई Ctrl+End वाली सफ़ाई ही सही तरीक़ा है। आपका ख़ुद सेट किया Print Area हमेशा सबसे ऊपर रहता है।</p>

  <h2>3. सब कुछ समा गया, पर टेक्स्ट बेहद छोटा है</h2>

  <p><strong>क्या दिखता है:</strong> एक पेज, सारे कॉलम मौजूद, और फ़ॉन्ट इतना छोटा जितना किसी क़ानूनी शर्तों वाली लाइन का होता है।</p>

  <p>इसके दो कारण होते हैं। या तो शीट सच में बहुत चौड़ी है (40 या 50 कॉलम एक पेज की चौड़ाई में हमेशा छोटे ही दिखेंगे), या दाईं ओर दूर पड़े किसी भूले हुए सेल (कारण 2 देखें) की वजह से कन्वर्टर ने 52 कॉलम फ़िट किए जबकि आपके पास 6 हैं। पहले Ctrl+End जाँचें, यह सबसे आसान जाँच है।</p>

  <p>अगर टेबल सच में चौड़ी है, तो तय करें कि कौन सा समझौता आपको मंज़ूर है:</p>

  <ul>
    <li>Landscape और fit to width: A4 पर लगभग 20 से 25 सामान्य कॉलम तक पढ़ने लायक रहता है।</li>
    <li>एक्सपोर्ट से पहले वे कॉलम छिपा दें जिनकी PDF में किसी को ज़रूरत नहीं। छिपे कॉलम प्रिंट नहीं होते।</li>
    <li>टेबल बाँट दें: कॉलम के हर समूह को अलग शीट पर रखें, हर एक में ID कॉलम दोहराया जाए (देखें <a href="/hi/blog/excel-to-pdf-repeat-header-row-every-page/">हेडर रो और कॉलम दोहराना</a>)।</li>
    <li>कन्वर्टर के लेआउट विकल्पों में "Keep original size" चुनें: टेक्स्ट पूरे साइज़ में, और कॉलम अतिरिक्त पेजों पर आगे चलते हैं, यानी विकल्प 1 का उल्टा।</li>
  </ul>

  <h2>4. हैश मार्क (####) या शब्द के बीच कटा टेक्स्ट</h2>

  <p><strong>क्या दिखता है:</strong> जहाँ नंबर या तारीख़ होनी चाहिए वहाँ <code>#####</code>, या कोई वाक्य जो सेल के किनारे पर रुक जाता है।</p>

  <p><strong>क्यों:</strong> PDF ठीक वही दिखाती है जो प्रिंटआउट में आता। जो नंबर अपने कॉलम में नहीं समाता, वह स्क्रीन और काग़ज़ दोनों पर हैश मार्क बनकर दिखता है। जो टेक्स्ट नहीं समाता, वह सेल के किनारे पर कट जाता है जब भी दाईं ओर वाले सेल में कुछ लिखा हो।</p>

  <p><strong>समाधान:</strong> कॉलम चौड़ा करें (कॉलम के अक्षर के दाएँ किनारे पर डबल-क्लिक करने से वह अपने आप फ़िट हो जाता है), या लंबे टेक्स्ट वाले सेल में Wrap Text चालू करें ताकि वे नीचे की ओर बढ़ें। 100% ज़ूम पर जाँचें; 85% पर कोई कॉलम स्क्रीन पर ठीक दिख सकता है और प्रिंट में फिर भी #### दिखा सकता है।</p>

  <h2>5. टेबल पेज के कोने में अटकी है</h2>

  <p>पतली टेबल डिफ़ॉल्ट रूप से ऊपर-बाएँ कोने में प्रिंट होती है, जो इनवॉइस या फ़ॉर्म पर अजीब लगता है। Page Layout, Margins, <strong>Custom Margins</strong>, फिर "Center on page" के नीचे <strong>Horizontally</strong> पर टिक करें। एक पेज के फ़ॉर्म के लिए Vertically पर भी टिक करें। यह सेटिंग फ़ाइल में सेव होती है, इसलिए PDF इसे अपना लेती है।</p>

  <p>इससे जुड़ी एक और हैरानी काग़ज़ के साइज़ की है। US Letter के लिए सेट की गई शीट को A4 पर प्रिंट करें (या उल्टा), तो नीचे एक पट्टी बढ़ या घट जाती है और आख़िरी रो अकेली एक पेज पर जा सकती है। अमेरिका, कनाडा, मेक्सिको और लैटिन अमेरिका के कई दूसरे देशों में Letter चलता है; बाकी लगभग हर जगह A4। भारत में भी A4 ही चलता है। सटीक माप हमारी <a href="/hi/blog/a4-vs-us-letter-printable-sizes/">A4 बनाम Letter गाइड</a> में हैं। जब फ़ाइल में यह नहीं लिखा होता कि उसे कौन सा काग़ज़ चाहिए, तो कन्वर्टर A4 इस्तेमाल करता है।</p>

  <h2>6. PDF में कुछ शीटें गायब हैं</h2>

  <p>Excel का File, Save As, PDF सिर्फ़ सक्रिय शीट सेव करता है, जब तक आप <strong>Options</strong> खोलकर "Entire workbook" न चुनें। सेव करने से पहले कई टैब चुन लेना भी काम करता है। ऑनलाइन कन्वर्टर वर्कबुक की हर दिखने वाली शीट लेता है, और हर शीट नए पेज से शुरू होती है। छिपी शीटें छोड़ दी जाती हैं, इसलिए जो भी शामिल करना हो उसे unhide कर दें।</p>

  <h2>पाँच मिनट की प्री-फ़्लाइट जाँच</h2>

  <ol>
    <li>हर शीट पर Ctrl+End। असली टेबल के बाद की रो और कॉलम डिलीट करें, फिर सेव करें।</li>
    <li>View, <strong>Page Break Preview</strong>। नीली लाइनें ठीक-ठीक दिखाती हैं कि पेज कहाँ बँटेंगे; ब्रेक खिसकाने के लिए उन्हें ड्रैग करें।</li>
    <li>Scale to Fit: width 1 page, height Automatic। चौड़ी टेबल हो तो Landscape।</li>
    <li>टेबल कई पेजों में जाती हो तो Print Titles।</li>
    <li>File, Print प्रीव्यू में सारे पेज स्क्रॉल करके देखें। वहाँ जो दिखता है, वही PDF में आता है।</li>
  </ol>

  <h2>अक्सर पूछे जाने वाले सवाल</h2>

  <h3>मेरी PDF Excel के अपने Save as PDF से अलग क्यों दिखती है?</h3>
  <p>Excel आपके प्रिंटर ड्राइवर और इंस्टॉल किए गए फ़ॉन्ट से रेंडर करता है; ऑनलाइन कन्वर्टर सर्वर पर अपने फ़ॉन्ट के साथ और बिना प्रिंटर के रेंडर करता है। फ़ाइल में सेव लेआउट सेटिंग (print area, scaling, orientation, margins, print titles) दोनों मानते हैं। नतीजे ज़्यादातर तब अलग होते हैं जब फ़ाइल डिफ़ॉल्ट सेटिंग पर निर्भर हो, या ऐसा फ़ॉन्ट इस्तेमाल करे जो सर्वर पर नहीं है।</p>

  <h3>क्या पहले से कटी हुई PDF ठीक की जा सकती है?</h3>
  <p>PDF को एडिट करके नहीं: जो हिस्सा गायब है वह कभी बना ही नहीं था। स्प्रेडशीट ठीक करें और फिर से बदलें। अगर मूल फ़ाइल नहीं रही, तो <a href="/hi/pdf-to-excel/">PDF को वापस Excel में बदलें</a>, उसे सुधारें और एक बार फिर एक्सपोर्ट करें।</p>

  <h3>Print Preview में Excel 1 पेज दिखाता है, पर PDF में ज़्यादा पेज क्यों हैं?</h3>
  <p>आमतौर पर PDF किसी दूसरी शीट से बनी थी, या Print Preview सिर्फ़ चुने हुए हिस्से को दिखा रहा था। देखें कि कौन सी शीट सक्रिय है, और यह कि "Print Selection" चुना हुआ न हो।</p>

  <h3>क्या छिपी रो PDF में आती हैं?</h3>
  <p>नहीं। छिपी रो और कॉलम छिपे ही रहते हैं, Excel के अपने एक्सपोर्ट में भी और कन्वर्टर में भी।</p>

  <h3>क्या कन्वर्टर मेरे फ़ॉर्मूले या चार्ट बिगाड़ देगा?</h3>
  <p>नहीं। PDF में फ़ॉर्मूलों से निकली वैल्यू और चार्ट वैसे ही दिखते हैं जैसे बने थे। मूल स्प्रेडशीट में कोई बदलाव नहीं होता; आपको एक नई PDF मिलती है।</p>

  <h2>अब बदलें</h2>

  <p>प्री-फ़्लाइट जाँच कर लें, फिर फ़ाइल को <a href="/hi/excel-to-pdf/">Excel to PDF कन्वर्टर</a> में डालें। अगर समस्या बस इतनी है कि पेज 2 से आगे कॉलम के नाम नहीं हैं, तो देखें <a href="/hi/blog/excel-to-pdf-repeat-header-row-every-page/">हेडर रो हर पेज पर कैसे दोहराएँ</a>, और पूरी चेकलिस्ट के लिए <a href="/hi/blog/convert-excel-to-pdf-keep-formatting/">फ़ॉर्मेटिंग खोए बिना Excel को PDF में बदलना</a>।</p>
