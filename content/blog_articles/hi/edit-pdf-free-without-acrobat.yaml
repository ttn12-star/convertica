excerpt_hi: "PDF एडिट करना पाँच अलग-अलग कामों का नाम है, और Acrobat सबका पैसा लेता है। कौन सा मुफ़्त टूल कौन सा काम करता है, और वह एक हालत जहाँ PDF एडिट करने के बजाय उसे Word में बदलना चाहिए।"
content_hi: |
  PDF एडिट करना खोजिए और पहला नतीजा Adobe का वह पन्ना होगा जो मुफ़्त आज़माने का न्योता देता है, और वह आज़माना चुपचाप सब्सक्रिप्शन बन जाता है। चिढ़ाने वाली बात यह है कि ज़्यादातर लोगों को पूरे Acrobat Pro के औज़ारों के आसपास की भी ज़रूरत नहीं होती। उन्हें एक ख़ास काम करना होता है: कोई टाइपिंग की ग़लती सुधारनी है, दस्तख़त लगाने हैं, कोई पन्ना हटाना है, या भेजने से पहले एक फ़ोन नंबर काला करना है। इनमें से हर काम मुफ़्त है, बशर्ते पता हो कि कौन सा टूल कौन सा काम करता है।

  उलझन इसलिए है कि PDF एडिट करना एक काम नहीं है। यह कम से कम पाँच काम हैं, और वे बिल्कुल अलग-अलग तरीक़ों से होते हैं। यह गाइड उन्हें अलग करती है, ताकि आप सीधे अपने काम पर पहुँच जाएँ, और उस एक हालत की तरफ़ भी इशारा करती है जहाँ PDF को एडिट करना ही पूरी तरह ग़लत क़दम है।

  <figure><img src="/static/blog/images/tool-sign-hero.jpg" alt="Convertica का PDF पर दस्तख़त करने वाला टूल, फ़ाइल डालने की जगह के साथ" width="1280" height="800" loading="lazy"></figure>

  <h2>PDF एडिट करना, यानी पाँच में से कोई एक बात</h2>

  कोई टूल खोलने से पहले तय कीजिए कि आप असल में इनमें से कौन सा काम कर रहे हैं। ग़लत खाना चुन लेना ही वह वजह है जिससे लोग मान बैठते हैं कि उन्हें Acrobat चाहिए।

  <ul>
    <li><strong>पन्नों पर काम</strong>: क्रम बदलना, घुमाना, हटाना या बाँटना। टेक्स्ट और ढाँचा जैसा है वैसा रहता है; आप सिर्फ़ पूरे पन्ने आगे-पीछे या बाहर कर रहे हैं।</li>
    <li><strong>ऊपर कुछ जोड़ना</strong>: दस्तख़त, तारीख़, शुरुआती अक्षर, मुहर, वॉटरमार्क या पन्ना संख्या। आप मौजूदा पन्ने के ऊपर नई चीज़ें रख रहे हैं, नीचे जो है उसे छेड़ नहीं रहे।</li>
    <li><strong>कुछ छिपाना</strong>: फ़ाइल भेजने से पहले किसी नंबर, नाम या पैराग्राफ़ को ढकना या हटाना।</li>
    <li><strong>फ़ॉर्म भरना</strong>: किसी आवेदन, कॉन्ट्रैक्ट या सरकारी फ़ॉर्म के ख़ाली ख़ानों में लिखना।</li>
    <li><strong>मूल टेक्स्ट बदलना</strong>: किसी और के लिखे पैराग्राफ़ में शब्द वाक़ई बदल देना।</li>
  </ul>

  <blockquote class="callout">पहले चार काम किसी भी ब्राउज़र में तेज़ और मुफ़्त हैं। सिर्फ़ पाँचवाँ, यानी PDF के अंदर किसी और का लिखा बदलना, वाक़ई मुश्किल है, और वहाँ भी एक मुफ़्त रास्ता है जो Acrobat का पैसा देने से बेहतर है।</blockquote>

  <h2>पन्नों पर काम: क्रम, घुमाव, हटाना</h2>

  यही सबसे आम माँग है और सबसे आसान भी। PDF पन्नों की एक तरतीब है, और उस तरतीब को बदलने से किसी पन्ने की सामग्री नहीं छिड़ती। आप एक ही जगह <a href="/hi/pdf-organize/organize/">पन्ने व्यवस्थित</a> कर सकते हैं, क्रम के लिए खींचिए, हटाने के लिए दबाइए, और जो तिरछे आए उन्हें सीधा कर दीजिए, फिर साफ़ फ़ाइल बना लीजिए।

  इनमें से कोई एक ही काम है, तो अलग टूल तेज़ पड़ते हैं: स्कैन तिरछा आया हो तो <a href="/hi/pdf-edit/rotate/">पन्ने हमेशा के लिए घुमा</a> लीजिए, या लंबे दस्तावेज़ से पन्ने हटाने वाला टूल चला लीजिए। कुछ इंस्टॉल नहीं करना पड़ता, और जो पन्ने आप रखते हैं उनमें से किसी की गुणवत्ता नहीं घटती।

  <h2>दस्तख़त, तारीख़ या पन्ना संख्या जोड़ना</h2>

  मेरा दस्तख़त लगा दो का मतलब लगभग कभी दस्तावेज़ बदलना नहीं होता, मतलब होता है उसके ऊपर एक नई चीज़ रखना। <a href="/hi/pdf-edit/sign/">दस्तख़त वाले टूल</a> से दस्तख़त बनाइए, लिखिए या चढ़ाइए, और जहाँ जाना है वहाँ रख दीजिए। यही ऊपर परत रखने वाला तरीक़ा कुछ और काम भी कर देता है:

  <ul>
    <li>हर पन्ने पर <a href="/hi/pdf-edit/add-watermark/">गोपनीय या ड्राफ़्ट का वॉटरमार्क</a> लगाना।</li>
    <li>किसी रिपोर्ट या जुड़ी फ़ाइल में <a href="/hi/pdf-edit/add-page-numbers/">पन्ना संख्या</a> डालना।</li>
    <li>ख़ाली हाशिये में तारीख़ या छोटी टिप्पणी लिखना।</li>
  </ul>

  ये चीज़ें पन्ने के ऊपर की परत पर बैठती हैं, इसलिए मूल टेक्स्ट को कभी नहीं छेड़तीं। ठीक इसीलिए Acrobat की ज़रूरत नहीं पड़ती: आप PDF दोबारा नहीं लिख रहे, उस पर निशान लगा रहे हैं।

  <h2>सामग्री ठीक तरीक़े से छिपाना</h2>

  यहाँ एक ख़तरनाक जाल है। कई मुफ़्त टूल में किसी संवेदनशील नंबर पर काली पट्टी खींचने से वह सिर्फ़ आँख से ओझल होता है, टेक्स्ट फ़ाइल में बना रहता है, और कोई भी उसे कॉपी कर सकता है या पट्टी हटा सकता है। असली छिपाना अंदर पड़े डेटा को हटाता है।

  <figure><img src="/static/blog/images/tool-crop-options.jpg" alt="PDF के पन्ने के हिस्से काटने या छिपाने के लिए इस्तेमाल होने वाले विकल्प" width="1280" height="800" loading="lazy"></figure>

  अगर सिर्फ़ कोई हाशिया, ऊपर की पट्टी या किनारे का हिस्सा हटाना है, तो <a href="/hi/pdf-edit/crop/">पन्ना काट देना</a> उस हिस्से को वाक़ई अलग कर देता है। बीच के टेक्स्ट के लिए सबसे सुरक्षित मुफ़्त तरीक़ा यह है कि सामग्री ढकने के बाद दस्तावेज़ को सपाट कर दीजिए, ताकि परतें एक हो जाएँ और छिपा टेक्स्ट फिर बाहर न निकाला जा सके। जहाँ दाँव बड़ा हो, कानूनी, मेडिकल या आर्थिक काग़ज़, वहाँ नतीजा खोलकर उस टेक्स्ट को चुनने की कोशिश कीजिए जिसे आपने छिपाया था। अगर वह चुना जा रहा है, तो वह गया नहीं है।

  <h2>फ़ॉर्म भरना</h2>

  PDF फ़ॉर्म दो तरह के होते हैं। जिनमें असली ख़ाने होते हैं, उन पर दबाकर सीधे लिखा जा सकता है, और आजकल के ज़्यादातर ब्राउज़र यह ख़ुद कर लेते हैं, इसलिए अलग टूल की ज़रूरत ही नहीं पड़ती। सपाट फ़ॉर्म बस स्कैन या छपे ढाँचे होते हैं, उनमें कोई ख़ाना नहीं होता; उनके लिए ऐसा टूल लीजिए जो पन्ने पर कहीं भी टेक्स्ट का डिब्बा रखने दे, जवाब लिखने दे और फ़ाइल बना दे। दस्तख़त और भरने वाला टूल दोनों काम कर देता है: ख़ाली जगहों पर लिखिए, दस्तख़त जोड़िए, काम ख़त्म।

  <blockquote class="callout">फ़ॉर्म तस्वीर या स्कैन के रूप में आया है, तो उसे सपाट फ़ॉर्म मानिए। दबाने के लिए कोई ख़ाना नहीं है, आप तस्वीर के ऊपर की परत पर लिख रहे हैं।</blockquote>

  <h2>मुश्किल वाला काम: मूल टेक्स्ट बदलना</h2>

  किसी और के लिखे पैराग्राफ़ में असली शब्द बदलना वही एक काम है जो आपको Acrobat चाहिए वाली धाक के लायक है। PDF टेक्स्ट को पैराग्राफ़ की तरह नहीं रखती; वह अक्षरों को अपनी-अपनी जगह पर रखती है, इसलिए एक शब्द बदलने का मतलब है उसके आसपास सब कुछ फिर से बिठाना। PDF के अंदर लिखने वाले मुफ़्त टूल मौजूद हैं, पर वे उसी पल लड़खड़ाते हैं जब फ़ॉन्ट फ़ाइल के अंदर न हो या ढाँचा जटिल हो, और नतीजा अक्सर जोड़-तोड़ किया हुआ दिखता है।

  एक शब्द से बड़े किसी भी बदलाव के लिए बेहतर मुफ़्त रास्ता यह है: <a href="/hi/pdf-to-word/">PDF को Word में बदलिए</a>, असली वर्ड प्रोसेसर में टेक्स्ट ठीक से बदलिए, जहाँ लाइनें अपने आप बैठ जाती हैं, और फिर वापस PDF बना लीजिए। अक्षर-दर-अक्षर जोड़ लगाने वाले टूल से लड़ने के बजाय आपको साफ़, अपने ढंग की एडिटिंग मिलती है। एक शर्त स्कैन दस्तावेज़ों की है: PDF अगर टेक्स्ट की तस्वीर है, तो बदलते समय OCR चाहिए, ताकि एडिट करने के लिए असली अक्षर मिलें।

  <h2>Acrobat न लेने पर क्या छूटता है</h2>

  सौदे पर साफ़ रहिए: Acrobat Pro कुछ ऐसे काम करता है जो ब्राउज़र टूल नहीं करते, जैसे छपाई से पहले की गहरी जाँच, दिव्यांगों के लिए दस्तावेज़ की पूरी टैगिंग, और सैकड़ों फ़ाइलों पर एक साथ लिखे हुए नियमों से बदलाव। अगर आपका काम पेशेवर छपाई या नियम-पालन का है, तो वह पैसा वसूल हो जाता है। रोज़ के मुझे इस एक PDF को ठीक करना है वाले काम के लिए वह ज़रूरत से ज़्यादा है, और ऊपर बताए मुफ़्त टूल पूरा काम बिना खाते के कर देते हैं।

  फ़ैसले का छोटा रास्ता:

  <ul>
    <li>पन्ने आगे-पीछे करने या हटाने हैं तो पन्नों वाले टूल, मुफ़्त।</li>
    <li>दस्तख़त, तारीख़, वॉटरमार्क, पन्ना संख्या तो परत वाले टूल, मुफ़्त।</li>
    <li>कुछ छिपाना या काटना है तो काटना या सपाट करना, मुफ़्त।</li>
    <li>फ़ॉर्म भरना है तो दस्तख़त और भरने वाला टूल, मुफ़्त।</li>
    <li>पैराग्राफ़ दोबारा लिखने हैं तो Word में बदलिए, मुफ़्त।</li>
    <li>छपाई की तैयारी या नियम-पालन का काम, यही Acrobat की असली जगह है।</li>
  </ul>

  <h2>प्राइवेसी पर एक बात</h2>

  आप जो भी बदलें, याद रखिए कि किसी वेब टूल पर चढ़ाते ही फ़ाइल आपके डिवाइस से बाहर जाती है। भरोसेमंद ब्राउज़र टूल फ़ाइल पढ़कर थोड़ी देर बाद मिटा देते हैं, फिर भी वाक़ई संवेदनशील मूल फ़ाइलें उन सेवाओं पर मत चढ़ाइए जिन्हें आप पहचानते नहीं। एक-दो निजी काग़ज़ों में यह कम दिक्क़त है; कारोबार की गोपनीय फ़ाइलों में पहले उस टूल की नीति पढ़ लीजिए, और जो हिस्सा ढका है उसे आगे भेजने से पहले फ़ाइल सपाट कर दीजिए।

  <h2>अक्सर पूछे जाने वाले सवाल</h2>

  <h3>क्या खाता बनाए बिना PDF मुफ़्त में एडिट कर सकता हूँ?</h3>
  <p>हाँ। पन्नों का काम, दस्तख़त, वॉटरमार्क, पन्ना संख्या, काटना और फ़ॉर्म भरना, सब मुफ़्त ब्राउज़र टूल में बिना रजिस्ट्रेशन मिलता है। सिर्फ़ छपाई की तैयारी और नियम-पालन वाली ख़ास सुविधाएँ Acrobat Pro के पैसे के पीछे हैं।</p>

  <h3>PDF में असली टेक्स्ट मुफ़्त में कैसे बदलूँ?</h3>
  <p>एक शब्द के सुधार पर ब्राउज़र वाला एडिटर चल जाता है। उससे बड़े किसी भी बदलाव पर PDF को Word में बदलिए, अपने वर्ड प्रोसेसर में लिखिए, जहाँ ढाँचा अपने आप बैठता है, और फिर वापस PDF बना लीजिए। यह PDF के अंदर अक्षर जोड़ने से साफ़ रहता है।</p>

  <h3>टेक्स्ट पर काली पट्टी खींचना उसे हटाने के बराबर है?</h3>
  <p>नहीं, और यही आम ग़लती है। कई टूल में खींची गई पट्टी टेक्स्ट को सिर्फ़ आँख से ओझल करती है; अक्षर फ़ाइल में बने रहते हैं और कॉपी किए जा सकते हैं। डेटा हटाने के लिए उस हिस्से को काट दीजिए या दस्तावेज़ सपाट कर दीजिए, और फिर पक्का कर लीजिए कि वह टेक्स्ट अब चुना नहीं जा रहा।</p>

  <h3>स्कैन की हुई PDF एडिट कर सकता हूँ?</h3>
  <p>सिर्फ़ OCR के बाद। स्कैन टेक्स्ट की तस्वीर है, इसलिए जब तक OCR उस तस्वीर को असली अक्षरों में नहीं बदल देता, बदलने के लिए कुछ नहीं होता। पहले स्कैन को OCR वाले रास्ते से चलाइए, फिर उस टेक्स्ट को बदलिए।</p>

  <h3>टेक्स्ट बदलने के बाद मेरी PDF ज़रा भद्दी क्यों लगती है?</h3>
  <p>PDF के अंदर लिखने वाले टूल अक्षरों को दोबारा जमाते हैं, और मूल फ़ॉन्ट फ़ाइल में न हो तो उससे मिलता-जुलता फ़ॉन्ट रख देते हैं, जिससे बीच की जगहें खिसक जाती हैं। यही PDF के अंदर लिखने की बुनियादी सीमा है, और यही वजह है कि बड़े बदलावों पर Word में बदलना साफ़ नतीजा देता है।</p>

  <h2>अभी आज़माइए</h2>

  <p>सॉफ़्टवेयर नहीं, काम चुनिए। अपनी फ़ाइल ब्राउज़र में <a href="/hi/pdf-organize/organize/">व्यवस्थित</a> कीजिए, <a href="/hi/pdf-edit/sign/">दस्तख़त और भरने</a> वाला टूल लीजिए, या <a href="/hi/pdf-edit/flatten/">सपाट</a> कर दीजिए। और अपने काम का ठीक औज़ार ढूँढने के लिए <a href="/hi/all-tools/">सभी PDF टूल</a> देख लीजिए। कोई Acrobat नहीं, कोई खाता नहीं।</p>
