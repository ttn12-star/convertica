excerpt_hi: "आपको PDF के आँकड़े स्प्रेडशीट में चाहिए, पर कॉपी करने पर सब कुछ एक बेतरतीब कॉलम में उड़ेल जाता है। PDF को Excel में ऐसे बदलिए कि पंक्तियाँ और कॉलम वहीं पहुँचें जहाँ उन्हें होना चाहिए, और स्कैन फ़ाइलों का क्या करें।"
content_hi: |
  कोई सप्लायर दाम की सूची PDF में भेजता है। आपका बैंक स्टेटमेंट PDF में देता है। कोई रिपोर्ट इनबॉक्स में आती है जिसमें ठीक वही तालिका है जो चाहिए, पर एक ऐसे दस्तावेज़ में बंद जिसे बदला नहीं जा सकता। आप तालिका चुनते हैं, कॉपी करते हैं, Excel में चिपकाते हैं, और सब कुछ आपस में जुड़े अक्षरों के एक अकेले कॉलम में ढह जाता है। PDF को ठीक से बदल लेना उन पंक्तियों और कॉलम को वापस असली ख़ानों में डाल देता है। यह कैसे करें, और जो फ़ाइलें पलटकर लड़ती हैं उन्हें कैसे सँभालें।

  <h2>कॉपी करने पर तालिका बिगड़ क्यों जाती है</h2>

  <p>PDF तालिका सहेजती ही नहीं है। वह पन्ने पर तय जगहों पर अक्षर सहेजती है, और उनके इर्द-गिर्द खिंची लकीरें, जिन्हें आपकी आँख जाल की तरह पढ़ लेती है। कॉपी करते समय अक्षर पढ़ने के क्रम में पकड़ में आ जाते हैं पर वह जाल खो जाता है, इसलिए कॉलम एक-दूसरे में घुल जाते हैं और आँकड़े ग़लत नामों के सामने आ खड़े होते हैं। सही तरीक़े से बदलना अलग ढंग से चलता है: वह देखता है कि हर आँकड़ा कहाँ बैठा है, कॉलम दोबारा बनाता है, और असली स्प्रेडशीट फिर खड़ी करता है, जहाँ हर आँकड़ा अपने ही ख़ाने में उतरता है।</p>

  <h2>पहले देखिए कि आपके पास किस किस्म की PDF है</h2>

  <p>यही एक जाँच आगे की सारी बातें तय कर देती है, इसलिए उस पर दस सेकंड लगाना सही है। PDF खोलिए और कर्सर से कोई एक आँकड़ा चुनने की कोशिश कीजिए।</p>

  <ul>
    <li><strong>अगर अक्षर चुने जाते हैं,</strong> तो आपके पास असली PDF है। आँकड़े सच में अक्षर हैं, और बदलना साफ़ तथा सटीक रहेगा।</li>
    <li><strong>अगर कुछ नहीं चुना जाता और पन्ना तस्वीर की तरह बरतता है,</strong> तो आपके पास स्कैन PDF है। तालिका एक तस्वीर है, इसलिए आँकड़ों को ख़ाने बनने से पहले OCR से पढ़ना पड़ता है। यह फिर भी चलता है, बस पहचान का एक कदम और नतीजे पर थोड़ी और नज़र चाहिए।</li>
  </ul>

  <h2>PDF को Excel में बदलिए</h2>

  <figure><img src="/static/blog/images/tool-pdf-to-excel.jpg" alt="Convertica का PDF से Excel कन्वर्टर, बदलने के लिए तैयार दस्तावेज़ के साथ" width="1280" height="800" loading="lazy"></figure>

  <ol>
    <li><a href="/hi/pdf-to-excel/">PDF से Excel</a> कन्वर्टर खोलिए और अपनी फ़ाइल चढ़ाइए (25 MB तक)।</li>
    <li>उसे तैयार होने दीजिए। असली PDF पर यह जल्दी होता है। स्कैन पर वह पहले अक्षर पढ़ता है, जिसमें कुछ और वक़्त लगता है।</li>
    <li>XLSX फ़ाइल डाउनलोड कीजिए और उसे Excel, Google Sheets या LibreOffice Calc में खोलिए। आपकी पंक्तियाँ और कॉलम अब असली ख़ाने हैं, जिन्हें आप क्रम में लगा सकते हैं, छाँट सकते हैं और जोड़ सकते हैं।</li>
  </ol>

  <p>आपकी चढ़ाई गई फ़ाइलें थोड़ी देर बाद सर्वर से हटा दी जाती हैं, जो तब मायने रखता है जब वह तालिका किसी बैंक स्टेटमेंट या तनख़्वाह की रिपोर्ट की हो।</p>

  <h2>बदलने के बाद सफ़ाई</h2>

  <p>अच्छे नतीजे को भी कभी हल्के हाथ की ज़रूरत पड़ती है, ख़ासकर घनी या स्कैन की गई तालिकाओं पर। कुछ छोटे सुधार लगभग सब सँभाल लेते हैं:</p>

  <ul>
    <li><strong>जुड़े हुए कॉलम।</strong> दो कॉलम एक में उतर गए हैं, तो उसे चुनिए और Excel के Data में Text to Columns से उन्हें खाली जगह या कॉमा पर अलग कर दीजिए।</li>
    <li><strong>अक्षरों की तरह सहेजे आँकड़े।</strong> कोई कॉलम जुड़ ही नहीं रहा, तो Excel उसे अक्षर मान रहा है। उसे चुनिए और छोटे चेतावनी वाले निशान से, या Data में जाकर, उन्हें वापस असली अंक बना दीजिए।</li>
    <li><strong>एक फ़ालतू शीर्षक पंक्ति।</strong> कई पन्नों की तालिका में हर पन्ने का शीर्षक बीच में घुस सकता है। भटकी पंक्तियाँ मिटा दीजिए और काम हो गया।</li>
    <li><strong>स्कैन फ़ाइलें।</strong> स्कैन से बने नतीजे हमेशा जाँच लीजिए। OCR किसी धुँधले 8 को 3 पढ़ सकता है, इसलिए जोड़ पर भरोसा करने से पहले हर कॉलम पर नज़र डाल लीजिए।</li>
  </ul>

  <h2>XLSX या CSV: कौन सा चुनें</h2>

  <p>XLSX ही सही दस्तूर है। वह सजावट, कई शीट और Excel से जुड़ी हर चीज़ रखता है, और स्प्रेडशीट से ज़्यादातर लोगों का मतलब यही होता है। CSV की तरफ़ सिर्फ़ तब जाइए जब आँकड़े कहीं और डालने हों, किसी हिसाब के सॉफ़्टवेयर, डेटाबेस या वेब ऐप में, जो सादी कॉमा वाली फ़ाइल चाहता है। CSV हल्का है और हर जगह चलता है, पर उसमें सिर्फ़ कच्चे आँकड़े होते हैं, न सजावट न फ़ॉर्मूला। नतीजा ख़ुद Excel में खोल रहे हैं, तो XLSX पर ही रहिए।</p>

  <h2>एक असली उदाहरण: स्टेटमेंट को जोड़ने लायक बनाना</h2>

  <p>मान लीजिए आप किसी छोटे कारोबार का हिसाब सँभालते हैं और हर सप्लायर का स्टेटमेंट PDF में आता है। उन्हें दोबारा टाइप करना धीमा है और ग़लतियाँ न्योता देता है, और एक ग़लत अंक पूरा मिलान बिगाड़ देता है। इसके बजाय हर स्टेटमेंट को Excel में बदल लेना आपको वे कॉलम देता है जिन्हें आप जोड़ सकते हैं, तारीख़ से छाँट सकते हैं, और सीधे अपनी हिसाब की शीट में चिपका सकते हैं। जो एक घंटे की सावधान टाइपिंग थी, वह कुछ मिनट का काम और एक झटपट जाँच बन जाती है। और अगर आपका काम उलटी तरफ़ भी चलता है, यानी कोई शीट तय दस्तावेज़ बनाकर भेजनी है, तो <a href="/hi/excel-to-pdf/">Excel से PDF</a> कन्वर्टर वह चक्कर पूरा कर देता है।</p>

  <h2>अक्सर पूछे जाने वाले सवाल</h2>

  <h3>मेरे फ़ॉर्मूला बदलने में बचेंगे?</h3>
  <p>नहीं, और यह होना ही था। PDF सिर्फ़ निकले हुए आँकड़े रखती है, उनके पीछे के फ़ॉर्मूला नहीं, इसलिए आपको वही अंक वापस मिलते हैं जैसे वे दिख रहे थे। चलते-फिरते फ़ॉर्मूला चाहिए, तो बदले हुए आँकड़ों के ऊपर उन्हें Excel में दोबारा बना लीजिए, जो सब कुछ दोबारा टाइप करने से कहीं तेज़ है।</p>

  <h3>स्कैन की हुई PDF को Excel में बदल सकता हूँ?</h3>
  <p>हाँ। टूल OCR से अक्षर पढ़ता है और जो पहचानता है उससे तालिका दोबारा खड़ी करता है। सटीकता इस पर टिकी है कि स्कैन कितना साफ़ है, इसलिए तेज़ और सीधा स्कैन अच्छा बदलता है, जबकि धुँधले या तिरछे स्कैन को ज़्यादा जाँच चाहिए। स्कैन से बना नतीजा आँकड़ों पर भरोसा करने से पहले ज़रूर देख लीजिए।</p>

  <h3>PDF में कई तालिकाएँ या कई पन्ने हों तो?</h3>
  <p>कई पन्नों की तालिका ठीक बदलती है और शीट पर आगे तक चलती रहती है। किसी दस्तावेज़ में कई अलग तालिकाएँ हों, तो नतीजा देख लीजिए और उन्हें अलग रखना है तो अलग शीट या हिस्सों में बाँट दीजिए।</p>

  <h3>फ़ाइल के साइज़ की कोई हद है?</h3>
  <p>एक फ़ाइल 25 MB तक हो सकती है, जो ज़्यादातर स्टेटमेंट और रिपोर्ट के लिए काफ़ी है। कोई स्कैन PDF उससे बड़ी है, तो उसे पहले छोटा कर लेना आम तौर पर अक्षरों को बिगाड़े बिना उसे हद के नीचे ले आता है।</p>

  <h3>कुछ इंस्टॉल करना पड़ेगा?</h3>
  <p>नहीं। यह काम आपके ब्राउज़र में होता है, इसलिए न कुछ डाउनलोड करना है, न सेट करना। आपको बस PDF चाहिए और वह स्प्रेडशीट सॉफ़्टवेयर जो आप नतीजा खोलने के लिए पहले से इस्तेमाल करते हैं।</p>

  <h2>अभी आज़माइए</h2>

  <p>जो तालिका आपको चाहिए वह अभी किसी PDF में फँसी है, तो उसे <a href="/hi/pdf-to-excel/">PDF से Excel</a> कन्वर्टर पर चढ़ाइए और लौटकर आई स्प्रेडशीट खोल लीजिए। और कभी उलटा चाहिए, यानी तैयार शीट को साफ़-सुथरे, न बदले जाने वाले दस्तावेज़ में बदलना, तो <a href="/hi/excel-to-pdf/">Excel से PDF</a> वह तरफ़ भी उतनी ही जल्दी सँभाल लेता है।</p>
