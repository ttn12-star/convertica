slug: convert-excel-to-pdf-keep-formatting
title_hi: "Excel को PDF में कैसे बदलें, सजावट, हेडर और छपाई का दायरा बिगाड़े बिना"
meta_title_hi: "Excel से PDF, सजावट बिगाड़े बिना | Convertica"
meta_description_hi: "स्प्रेडशीट आठ पन्नों पर कट जाने वाली आम मुसीबत से बचिए। PDF बनाने से पहले छपाई का दायरा, एक पन्ने में समाना और दोहराने वाले हेडर ठीक कीजिए।"
meta_keywords_hi: "Excel से PDF, xlsx को PDF, स्प्रेडशीट को PDF, Excel को PDF सहेजें, excel to pdf hindi"
excerpt_hi: "Excel से PDF की ज़्यादातर गाइड ठीक वही हिस्सा छोड़ देती हैं जो मायने रखता है: छपाई का दायरा तय करना, ताकि आपकी शीट आठ अटपटे, आधे-ख़ाली पन्नों पर न कट जाए।"
content_hi: |
  वह ईमेल लगभग सबको मिला है: बारह टैब वाली फ़ाइल सीधे PDF में बदली हुई, पंक्तियाँ नौ पन्नों पर बिखरी, कॉलम बीच से कटे, और हेडर सिर्फ़ पहले पन्ने पर। इलाज कोई बेहतर कन्वर्टर नहीं है। इलाज है Excel के अंदर, बदलने का बटन दबाने से पहले, बीस सेकंड की तैयारी।

  यह गाइड वही तैयारी बताती है जो साफ़, छपने लायक PDF को स्प्रेडशीट की दुर्घटना से अलग करती है, और साथ में वह सीधा रास्ता भी, जब आपकी फ़ाइल पहले से ठीक बनी हुई है।

  <h2>Excel से PDF अक्सर बिगड़ता क्यों है</h2>

  <figure><img src="/static/blog/images/tool-excel-to-pdf-hero.jpg" alt="Convertica का Excel से PDF कन्वर्टर, फ़ाइल अपलोड करने की जगह के साथ" width="1280" height="800" loading="lazy"></figure>
  <p>Excel आपकी शीट को दस्तावेज़ की तरह नहीं देखता, जैसे Word देखता है। यहाँ कोई तय पन्ना नहीं होता। जाल असल में अनंत है, और PDF बनाते समय तय करना पड़ता है कि कहाँ काटा जाए। पहले से तय जवाब अच्छे नहीं होते:</p>
  <ul>
    <li>छपाई का पूरा दायरा वह सब मान लिया जाता है जो आपने कभी छुआ है, उस अकेली खानापूरी समेत जो कॉलम AZ में कभी लिखकर आप भूल गए थे।</li>
    <li>पन्ना कहाँ ख़त्म होगा, यह गणित तय करता है, और वह गणित पंक्तियों के तार्किक समूहों से मेल नहीं खाता।</li>
    <li>हेडर की पंक्तियाँ अपने आप नहीं दोहराई जातीं। दूसरे पन्ने से आगे आँकड़े बिना सिर-पैर के ढेर जैसे लगते हैं।</li>
    <li>छिपे कॉलम ठीक से छिपे न हों, तो कुछ वर्शन में आज भी छप जाते हैं।</li>
  </ul>
  <p>नतीजा वह PDF है जो स्क्रीन पर दिखने वाली साफ़-सुथरी शीट जैसा बिल्कुल नहीं लगता।</p>

  <h2>बदलने से पहले Excel में तैयारी</h2>
  <p>इन चार सेटिंग पर दो मिनट लगाइए और बदलना अपने आप मामूली काम रह जाता है।</p>

  <h3>1. छपाई का दायरा तय कीजिए</h3>
  <p>ठीक वही हिस्सा चुनिए जो PDF में चाहिए। Excel में <code>Page Layout &gt; Print Area &gt; Set Print Area</code> पर जाइए। इसके बाद सिर्फ़ वही हिस्सा बाहर आएगा। अगर दाईं तरफ़ कोई छोटा ग्राफ़ या टिप्पणी है जिसे आप नहीं छापना चाहते, यह एक कदम उसे हटा देता है।</p>

  <h3>2. चौड़ाई एक पन्ने में समाइए</h3>
  <p>चौड़ी शीट ही PDF आठ पन्नों पर कट गया वाली शिकायतों की सबसे बड़ी वजह हैं। Page Layout में Scale to Fit वाला हिस्सा ढूँढिए और <code>Width: 1 page</code>, <code>Height: Automatic</code> कर दीजिए। नतीजा वह PDF है जिसमें हर कॉलम चौड़ाई में समा जाता है और आँकड़े ज़रूरत के मुताबिक़ नीचे के पन्नों पर बहते जाते हैं। शीट को असल में इसी तरह छपना चाहिए।</p>
  <p>अगर शीट इतनी चौड़ी है कि एक पन्ने में समाने पर अक्षर सूक्ष्मदर्शी वाले हो जाएँ, तो यह इशारा है कि पन्ना आड़ा (landscape) कर लीजिए, या आँकड़ों को दो PDF में बाँट दीजिए, जिनमें अलग-अलग कॉलम आएँ।</p>

  <h3>3. हेडर हर पन्ने पर दोहराइए</h3>
  <p>यही सबसे ज़्यादा छूटने वाला कदम है। <code>Page Layout &gt; Print Titles</code> खोलिए और <code>Rows to repeat at top</code> में पहली पंक्ति चुनिए (या जो भी पंक्तियाँ आपका हेडर बनाती हैं)। अब हर पन्ना उन्हीं कॉलम के नामों से शुरू होगा। पढ़ने वाले को यह याद करने के लिए पहले पन्ने पर लौटना नहीं पड़ेगा कि कॉलम F में क्या था।</p>

  <h3>4. जो कॉलम नहीं चाहिए: छिपाइए या मिटाइए</h3>
  <p>जिनकी बाद में ज़रूरत पड़ सकती है, उन्हें छिपाइए (कॉलम के अक्षर पर दायाँ क्लिक, Hide)। जिनके बारे में पक्का है कि कचरा हैं, उन्हें मिटा दीजिए। छिपे कॉलम छपाई के दायरे से बाहर रहते हैं, बशर्ते आप छिपाने के बाद दायरा तय करें। अगर आपने पहले दायरा तय किया और फिर कॉलम छिपाए, तो नतीजा वर्शन के हिसाब से बदल सकता है। सुरक्षित रहने के लिए छिपाने या दिखाने के बाद छपाई का दायरा दोबारा तय कर लीजिए।</p>

  <h2>कदम-दर-कदम: Convertica से बदलना</h2>

  <figure><img src="/static/blog/images/tool-excel-to-pdf-options.jpg" alt="Convertica पर Excel से PDF बदलने के कदम और विकल्प" width="1280" height="800" loading="lazy"></figure>
  <p>शीट तैयार हो जाए, तो बदलना ही सबसे आसान हिस्सा है। तीन कदम में <a href="/hi/excel-to-pdf/">Excel को PDF में बदल</a> सकते हैं:</p>
  <ol>
    <li><strong>.xlsx फ़ाइल अपलोड कीजिए।</strong> अपलोड की जगह पर खींचकर छोड़ दीजिए। पुरानी .xls फ़ाइलें भी चलती हैं।</li>
    <li><strong>पूछे जाने पर पन्ने की दिशा चुनिए।</strong> लंबे और सँकरे आँकड़ों के लिए खड़ा पन्ना; चौड़ी तालिकाओं के लिए आड़ा।</li>
    <li><strong>PDF डाउनलोड कीजिए।</strong> उसे एक बार खोलकर देख लीजिए कि पन्ने वहीं टूटे जहाँ आपने सोचा था, और काम हो गया।</li>
  </ol>
  <blockquote class="callout">अगर PDF अब भी ग़लत दिख रहा है, तो गड़बड़ लगभग हमेशा Excel में है, छपाई का दायरा, पैमाना या दोहराने वाली पंक्तियाँ, कन्वर्टर में नहीं। फ़ाइल दोबारा खोलिए, सेटिंग ठीक कीजिए, और फिर से बना लीजिए।</blockquote>

  <h2>कई शीट वाली फ़ाइलें</h2>
  <p>पाँच टैब वाली फ़ाइल एक सवाल खड़ा करती है: आपको हर शीट की अलग PDF चाहिए, या पाँचों एक ही फ़ाइल में?</p>
  <ul>
    <li><strong>हर शीट की अलग PDF</strong> तब सही है जब हर टैब अपने आप में एक चीज़ है, अलग-अलग लोगों के लिए अलग रिपोर्ट। तब नाम मायने रखने लगता है; <code>YYYY-MM-DD_workbook_sheet-name.pdf</code> किसी भी फ़ोल्डर में साफ़ पढ़ा जाता है।</li>
    <li><strong>सारी शीट एक PDF में</strong> तब सही है जब टैब मिलकर एक पुलिंदा बनते हैं (कवर, सारांश, ब्यौरा, परिशिष्ट)। अगर कन्वर्टर हर शीट अलग बनाता है, तो आप दूसरे कदम में <a href="/hi/pdf-organize/merge/">कई शीट को एक PDF में जोड़</a> सकते हैं।</li>
  </ul>
  <p>दोनों हालत में हर उस शीट पर छपाई का दायरा तय कीजिए जिसे आप बदलने वाले हैं। ख़ाली टैब से ख़ाली पन्ना बनेगा; कॉलम AZ में पड़ी भटकी खानापूरी से लगभग ख़ाली पन्ना बनेगा, जिसमें वह अकेली खानापूरी हवा में तैरती दिखेगी।</p>

  <h2>आम गड़बड़ियाँ और उनका इलाज</h2>
  <p>अगर बने हुए PDF में अब भी दिक्क़तें हैं, तो लक्षण आम तौर पर किसी एक Excel सेटिंग की तरफ़ इशारा करता है:</p>
  <table>
    <thead>
      <tr><th>लक्षण</th><th>संभावित वजह</th><th>इलाज</th></tr>
    </thead>
    <tbody>
      <tr><td>सबसे दाईं तरफ़ का कॉलम कटा हुआ है</td><td>चौड़ाई एक पन्ने में समाने पर सेट नहीं है</td><td>Page Layout, Width: 1 page</td></tr>
      <tr><td>दूसरे पन्ने से आगे हेडर नहीं दिख रहे</td><td>दोहराने वाली पंक्तियाँ तय नहीं हैं</td><td>Page Layout, Print Titles, Rows to repeat at top</td></tr>
      <tr><td>आँकड़ों के बीच बेतरतीब ख़ाली पन्ने</td><td>दिखने वाले हिस्से के बाहर भटकी खानापूरी या सजावट</td><td>उन्हें मिटाकर छपाई का दायरा दोबारा तय कीजिए</td></tr>
