    </tbody>
  </table>

  <h2>Excel कब रखें और PDF कब भेजें</h2>
  <p>PDF तब सही है जब फ़ाइल सिर्फ़ पढ़ी जानी है: कोटेशन, दस्तख़त हुई रिपोर्ट, टैक्स के काग़ज़, बोर्ड की सामग्री। PDF ढाँचा जैसा है वैसा रखती है, ग़लती से बदलाव नहीं होने देती, और उस पर दस्तख़त या वॉटरमार्क लगाना आसान है।</p>
  <p>Excel तब सही है जब सामने वाले को छाँटना, क्रम लगाना या हिसाब दोबारा करना है। जिस आदमी को मान बदलने हैं, उसे मॉडल की PDF भेजना उसे सब कुछ दोबारा टाइप करने पर मजबूर करता है। अगर PDF पहले भेज चुके हैं और सामने वाले को आँकड़े चाहिए, तो <a href="/hi/pdf-to-excel/">PDF को वापस Excel में बदल</a> सकते हैं, पर इस आने-जाने में छोटी ग़लतियाँ घुस जाती हैं, और यह पहली बार में सही फ़ॉर्मैट भेजने का घटिया विकल्प है।</p>
  <p>काम का दस्तूर: औपचारिक रिकॉर्ड के लिए PDF भेजिए, और सामने वाले को बदलाव करना हो तो .xlsx अलग से लगा दीजिए। PDF वह है जो आर्काइव होती है; .xlsx काम करने की फ़ाइल है।</p>

  <h2>एक बात और: फ़ाइल का साइज़</h2>
  <p>Excel से बनी PDF हैरान करने वाली भारी हो सकती है, ख़ासकर चार्ट और शर्तों वाली सजावट के साथ। नतीजा ईमेल से भेजना है, तो भेजने से पहले उसे छोटा कर लीजिए, ताकि वह सामने वाले की सीमा से टकराकर लौट न आए। <a href="/hi/blog/compress-pdf-for-email-under-25mb/">ईमेल के लिए छोटा करने की गाइड</a> बताती है कि कितना साइज़ रखना है, और <a href="/hi/pdf-organize/compress/">छोटा करने वाला टूल</a> असली काम कर देता है।</p>

  <h2>अक्सर पूछे जाने वाले सवाल</h2>
  <h3>मेरी शीट पन्नों पर अटपटे ढंग से क्यों कट जाती है?</h3>
  <p>लगभग हमेशा इसलिए कि छपाई का दायरा बहुत चौड़ा है और एक पन्ने में समाना सेट नहीं है। Page Layout खोलिए, Width को 1 page कीजिए, और दोबारा बनाइए। नतीजा पढ़ने लायक न बचे, तो पन्ना आड़ा कर लीजिए या आँकड़ों को दो PDF में बाँट दीजिए।</p>
  <h3>क्या फ़ाइल की सारी शीट एक साथ बदल सकता हूँ?</h3>
  <p>हाँ। कन्वर्टर कई टैब वाली फ़ाइलें सँभाल लेता है। पहले से वह हर उस शीट को एक ही PDF में डालता है जिसमें आँकड़े हैं। हर शीट की अलग PDF चाहिए, तो हर शीट का छपाई का दायरा तय कीजिए और हर टैब पर एक बार बदलिए, या बाद में नतीजा बाँट लीजिए।</p>
  <h3>चार्ट और फ़ॉर्मूला ठीक से बदलेंगे?</h3>
  <p>चार्ट तस्वीरों की तरह बदलते हैं, यानी जो Excel में दिखता है वही PDF में मिलता है। फ़ॉर्मूला अपने उस वक़्त के मान पर गिने जाते हैं। टूटी कड़ियाँ (#REF!, #NAME?) PDF में भी दिखेंगी, इसलिए उन्हें पहले Excel में ठीक कीजिए, या मान चिपकाकर सपाट कर दीजिए।</p>
  <h3>हेडर हर पन्ने पर कैसे दोहराऊँ?</h3>
  <p>Excel में Page Layout, Print Titles पर जाइए, Rows to repeat at top में क्लिक कीजिए, और अपनी हेडर पंक्तियाँ चुन लीजिए। सहेजिए और दोबारा बनाइए। यह सेटिंग हर शीट की अलग होती है, इसलिए हर उस टैब पर लगाइए जिसे आप बदलने वाले हैं।</p>
  <h3>मेरी PDF Excel फ़ाइल से इतनी भारी क्यों है?</h3>
  <p>PDF में फ़ॉन्ट अंदर रखे जाते हैं, चार्ट तस्वीर बन जाते हैं, और हर पन्ना अपनी अलग चीज़ होता है। 200 KB की Excel फ़ाइल से बिना किसी गड़बड़ी के 3 MB की PDF बन सकती है। साइज़ ईमेल के लिए दिक्क़त है, तो बनने के बाद PDF छोटी कर लीजिए, आँकड़े और गुणवत्ता वही रहती है, सिर्फ़ जगह घटती है।</p>

  <h2>अभी आज़माइए</h2>
  <p>छपाई का दायरा तय कीजिए, एक पन्ने में समाना चुनिए, दोहराने वाली पंक्तियाँ लगाइए, फिर PDF बनाइए। Excel के अंदर के दो मिनट, आठ पन्नों पर कटी शीट भेजने की शर्मिंदगी बचा देते हैं। <a href="/hi/excel-to-pdf/">Excel से PDF टूल खोलें →</a></p>
