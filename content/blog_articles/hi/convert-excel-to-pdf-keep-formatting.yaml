      <tr><td>चार्ट पन्नों के बीच कट जाते हैं</td><td>अपने आप पड़ा पन्ना-विराम चार्ट को बीच से काट रहा है</td><td>चार्ट के ऊपर हाथ से पन्ना-विराम डालिए, या चार्ट सरका दीजिए</td></tr>
