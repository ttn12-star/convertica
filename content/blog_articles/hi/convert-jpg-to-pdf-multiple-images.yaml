title_hi: "JPG को PDF में कैसे बदलें: कई तस्वीरों को एक फ़ाइल में जोड़िए"
meta_title_hi: "कई तस्वीरों को एक PDF में जोड़ें | Convertica"
meta_description_hi: "एक फ़ोटो हो या JPG का पूरा ढेर, ब्राउज़र में ही मुफ़्त एक PDF बना लीजिए। पन्नों का क्रम, गुणवत्ता, साइज़ के नुस्ख़े, और स्कैन तथा रसीदों का हिसाब।"
meta_keywords_hi: "JPG को PDF में बदलें, तस्वीरों को एक PDF में जोड़ें, कई JPG से PDF, फ़ोटो से PDF, jpg to pdf hindi, इमेज से PDF"
excerpt_hi: "फ़ोटो खींचा हुआ कॉन्ट्रैक्ट, रसीदों का ढेर, तस्वीरों के रूप में सहेजे स्कैन पन्ने, देर-सबेर सबको एक साफ़ PDF बनना ही पड़ता है। यह मुफ़्त में, सही क्रम और सही गुणवत्ता पर कैसे करें।"
content_hi: |
  फ़ोन ने सबको स्कैनर चलाने वाला बना दिया है: यहाँ फ़ोटो खींचा कॉन्ट्रैक्ट, वहाँ तीन रसीदें, पिछली मीटिंग का व्हाइटबोर्ड। दिक्क़त भेजने में आती है। ईमेल की कड़ी में ग्यारह बिखरी JPG कोई नहीं चाहता, सब एक PDF चाहते हैं, पन्ने क्रम में, जो ठीक से छपे भी। यह गाइड बताती है कि यही काम मुफ़्त में और कुछ इंस्टॉल किए बिना कैसे हो।

  <h2>एक JPG बदलिए, या पचास तक को एक PDF में जोड़िए</h2>

  <figure><img src="/static/blog/images/tool-jpg-to-pdf-hero.jpg" alt="Convertica के JPG से PDF कन्वर्टर का अपलोड पन्ना" width="1280" height="800" loading="lazy"></figure>

  <ol>
    <li><a href="/hi/jpg-to-pdf/">JPG से PDF</a> कन्वर्टर खोलिए और अपनी तस्वीरें जोड़िए। एक फ़ाइल से एक पन्ने की PDF बनती है; कई फ़ाइलें एक ही दस्तावेज़ में जुड़ जाती हैं, हर तस्वीर एक पन्ना, एक बार में पचास तक।</li>
    <li><strong>क्रम मायने रखता है:</strong> तस्वीरें उसी क्रम में पन्ने बनती हैं जिसमें आप उन्हें जोड़ते हैं। चुनने से पहले फ़ाइलों के नाम <em>01.jpg, 02.jpg, 03.jpg</em> रख दीजिए और क्रम अपने आप सध जाएगा।</li>
    <li>ज़रूरत हो तो गुणवत्ता की सेटिंग तय कीजिए (इस पर आगे विस्तार से), और <strong>बदलें</strong> दबा दीजिए।</li>
    <li>तैयार PDF डाउनलोड कर लीजिए, बिना वॉटरमार्क और बिना रजिस्ट्रेशन।</li>
  </ol>

  <p>हर तस्वीर एक A4 पन्ने पर बीच में रखी जाती है, ठीक हाशिये के साथ, ताकि नतीजा तस्वीरों का ढेर न लगे, दस्तावेज़ लगे। खड़ी और आड़ी, दोनों तरह की तस्वीरें अपने आप बैठ जाती हैं, वे पन्ने के हिसाब से छोटी-बड़ी होती हैं, कटती कभी नहीं।</p>

  <h2>गुणवत्ता की सही सेटिंग चुनना</h2>

  <figure><img src="/static/blog/images/tool-jpg-to-pdf-options.jpg" alt="JPG से PDF कन्वर्टर में गुणवत्ता के विकल्प" width="1280" height="800" loading="lazy"></figure>

  <p>गुणवत्ता की सेटिंग (60 से 95, पहले से 85) तय करती है कि PDF के अंदर तस्वीरें कितनी दबाई जाएँगी:</p>

  <ul>
    <li><strong>85 (पहले से चुनी)</strong> लगभग हर काम के लिए सही है। दस्तावेज़ पढ़े जाते रहते हैं, तस्वीरें साफ़ रहती हैं, और फ़ाइल का साइज़ भी काबू में।</li>
    <li><strong>90 और ऊपर</strong> उन तस्वीरों के लिए, जिन्हें ग़ौर से देखा जाएगा: पोर्टफ़ोलियो का काम, सामान की तस्वीरें, या कुछ भी जो बड़े आकार में छप सकता है। 90 से ऊपर कन्वर्टर उन तस्वीरों को दोबारा दबाता ही नहीं जो पहले से साफ़ JPG हैं, यानी असली बिंदु जैसे हैं वैसे बचे रहते हैं।</li>
    <li><strong>60 से 75</strong> ईमेल के लिहाज़ से, जब मूल तस्वीरें बहुत भारी हों। 12 मेगापिक्सल की दस फ़ोन तस्वीरें ऊँची गुणवत्ता पर आसानी से 30 MB की PDF बना देती हैं; सेटिंग घटाने से वह काबू में आ जाती है।</li>
  </ul>

  <p>अगर PDF फिर भी अटैचमेंट की हद के लिए भारी निकले, तो उसे बाद में <a href="/hi/pdf-organize/compress/">छोटा करने वाले टूल</a> से गुज़ार दीजिए। मँझोली गुणवत्ता और छोटा करना, दोनों मिलकर तस्वीरों वाली ज़्यादातर PDF को ईमेल की आम हद के नीचे ले आते हैं।</p>

  <h2>लोग इसे असल में किस काम में लगाते हैं</h2>

  <ul>
    <li><strong>ख़र्च की रिपोर्ट।</strong> महीने भर की काग़ज़ी रसीदों की फ़ोटो लेकर एक PDF में जोड़ देना बिखरी तस्वीरों के फ़ोल्डर से कहीं बेहतर फ़ाइल बनाता है, और हिसाब वाले आपको दुआ देंगे।</li>
    <li><strong>फ़ोटो खींचे दस्तावेज़।</strong> फ़ोन से पन्ना-दर-पन्ना खींचा कॉन्ट्रैक्ट या फ़ॉर्म एक क्रम वाला, छपने लायक दस्तावेज़ बन जाता है।</li>
    <li><strong>असाइनमेंट और आवेदन।</strong> कई पोर्टल ठीक एक ही फ़ाइल लेते हैं। दस फ़ोटो खींचे पन्ने और एक अपलोड का ख़ाना, इलाज यही है।</li>
    <li><strong>पोर्टफ़ोलियो और मूड बोर्ड।</strong> तय क्रम में चुनी हुई तस्वीरें, जिन्हें चैट ऐप न दबा सकते हैं न आगे-पीछे कर सकते हैं।</li>
    <li><strong>सहेजकर रखना।</strong> नाम में तारीख़ वाली PDF दो साल बाद कोई रसीद ढूँढने में कैमरा रोल को हरा देती है।</li>
  </ul>

  <h2>फ़ोन की तस्वीरों से साफ़ नतीजा पाना</h2>

  <ul>
    <li>दस्तावेज़ सामने से खींचिए और फ़्रेम भर दीजिए। तस्वीर पन्ने पर जैसी है वैसी रखी जाती है, इसलिए तिरछी फ़ोटो तिरछी ही रहेगी।</li>
    <li>एक जैसी, फैली हुई रोशनी फ़्लैश से बेहतर है। चमकदार काग़ज़ पर पड़ी चमक ही वह सबसे आम वजह है जिससे फ़ोटो खींचा पन्ना छपाई में पढ़ा नहीं जाता।</li>
    <li>बदलने से पहले फ़ालतू हिस्सा (मेज़ के किनारे, उँगलियाँ) काट दीजिए; पन्ने पर दस्तावेज़ होना चाहिए, उसके आसपास का कमरा नहीं।</li>
    <li>iPhone की तस्वीरें HEIC में हैं? पहले उन्हें <a href="/hi/image/heic-to-jpg/">HEIC से JPG</a> टूल से बदल लीजिए, फिर जोड़िए।</li>
  </ul>

  <h2>अक्सर पूछे जाने वाले सवाल</h2>

  <h3>यह वाक़ई मुफ़्त है? कोई वॉटरमार्क?</h3>
  <p>JPG को PDF में बदलना मुफ़्त है, बिना वॉटरमार्क और बिना रजिस्ट्रेशन। मुफ़्त स्तर पर हर तस्वीर के साइज़ की एक हद है; प्रीमियम उसे बढ़ा देता है।</p>

  <h3>एक बार में कितनी तस्वीरें जोड़ सकता हूँ?</h3>
  <p>एक बार में पचास तक, और हर तस्वीर PDF का एक पन्ना बनती है। इससे ज़्यादा चाहिए? ढेर को दो हिस्सों में बाँटिए और बनी PDF को <a href="/hi/pdf-organize/merge/">जोड़ने वाले टूल</a> से मिला लीजिए।</p>

  <h3>अपलोड के बाद पन्नों का क्रम बदल सकता हूँ?</h3>
  <p>पन्ने उसी क्रम में रहते हैं जिसमें तस्वीरें जोड़ी गईं। भरोसे की आदत यही है कि चुनने से पहले नामों में नंबर लगा दीजिए। तैयार PDF में क्रम बदलना हो, तो <a href="/hi/pdf-organize/organize/">व्यवस्थित करने वाला टूल</a> पन्ने खींचकर लगाने देता है।</p>

  <h3>क्या यह PNG या दूसरे फ़ॉर्मैट पर चलता है?</h3>
  <p>यह टूल JPG और JPEG लेता है। PNG, WebP या दूसरे फ़ॉर्मैट के लिए उन्हें पहले <a href="/hi/image/convert/">तस्वीर बदलने वाले टूल</a> से JPG बना लीजिए, या एक ही तस्वीर हो तो वहीं से सीधे PDF बना लीजिए।</p>

  <h3>फ़ोटो खींचे दस्तावेज़ में टेक्स्ट ढूँढा जा सकेगा?</h3>
  <p>नहीं, PDF में टेक्स्ट की तस्वीरें हैं, टेक्स्ट नहीं। शब्द ढूँढने, कॉपी करने या बदलने हैं, तो नतीजे को <a href="/hi/scanned-pdf-to-word/">स्कैन PDF से Word</a> वाले OCR टूल से गुज़ारिए, जो अक्षर पहचानकर एडिट होने वाली फ़ाइल देता है।</p>

  <h3>मेरा डेटा सुरक्षित है?</h3>
  <p>फ़ाइलें बदलने के लिए पढ़ी जाती हैं और थोड़ी देर बाद तय सफ़ाई में हट जाती हैं। किसी भी ऑनलाइन सेवा की तरह, बहुत संवेदनशील सामग्री चढ़ाने से पहले प्राइवेसी पॉलिसी देख लीजिए।</p>

  <h2>अभी आज़माइए</h2>

  <p>फ़ोटो खींचे पन्नों वाला वह फ़ोल्डर उठाइए, फ़ाइलों पर नंबर लगाइए, और उन्हें <a href="/hi/jpg-to-pdf/">JPG से PDF</a> कन्वर्टर में डाल दीजिए। तीस सेकंड बाद आपके पास वही होगा जो सबको चाहिए था: एक फ़ाइल, पन्ने क्रम में, भेजने के लिए तैयार।</p>
