content_hi: |
  कुछ कन्वर्ज़न हर हफ़्ते लौट आते हैं। वही सप्लायर के बिल, जिन्हें आर्काइव लायक PDF बनना है। वही बैंक स्टेटमेंट, जिन्हें स्प्रेडशीट में उतरना है। और फोन से आई तस्वीरों का वही बंडल, जिसे दफ़्तर में कोई खोल नहीं पाता।

  अकेला काम कुछ क्लिक का है। पन्ना खोलिए, लोड होने का इंतज़ार कीजिए, फाइल चढ़ाइए, वही एक सेटिंग लगाइए, नतीजा उतारिए। सोमवार की सुबह यही आठ बार कीजिए और बीस मिनट उन पन्नों पर निकल जाते हैं जो ज़ुबानी याद हैं।

  PDF Workbench यही हिस्सा आपकी सुबह से निकाल देता है। टूल एक बार बोर्ड पर सजा लीजिए, फिर कन्वर्ज़न का मतलब है एक ड्रॉप।

  <h2>पूरा PDF Workbench एक विचार में: टाइल</h2>

  <p>बोर्ड एक जाली है, और उस पर हर खाना एक टाइल। टाइल का मतलब है एक कन्वर्टर, साथ में उसके लिए सहेजी गई सेटिंग। उस पर फाइल छोड़िए, या क्लिक करके चुनिए, और कन्वर्ज़न उन्हीं सेटिंग से चल पड़ता है। कोई फॉर्म, कोई दूसरा पन्ना नहीं। नतीजा नीचे डाउनलोड बटन वाली पंक्ति बनकर आता है, और पिछले तीन नतीजे दिखते रहते हैं।</p>

  <p>एक बोर्ड पर एक बार में एक ही कन्वर्ज़न चलता है। यह जान-बूझकर है: तीन टाइलों पर तीन फाइलें छोड़िए और वे भेजने के क्रम में लौटती हैं।</p>

  <figure><img src="/static/images/blog/workbench-board.jpg" alt="Convertica Workbench का एक बोर्ड, नाम लेखा, जिस पर PDF से Word, Word से PDF और PDF से Excel की टाइलें हैं और एक टाइल पर पूरा हुआ कन्वर्ज़न डाउनलोड बटन के साथ दिख रहा है" width="1280" height="800" loading="lazy"></figure>

  <h2>दो मिनट में पहला बोर्ड</h2>

  <ol>
    <li><strong>बोर्ड खोलिए।</strong> <a href="/hi/workbench/">Workbench</a> पर जाइए। कुछ इंस्टॉल नहीं करना, आज़माने के लिए अकाउंट भी नहीं। यह सभी टूल वाले मेनू, अकाउंट के मेनू और पन्ने के फ़ुटर से भी खुलता है।</li>
    <li><strong>"विजेट जोड़ें" दबाइए।</strong> खोजने लायक सूची दो हिस्सों में खुलती है। <em>मेरे प्रीसेट</em> में टूल पेजों पर सहेजे गए आपके वर्कफ़्लो, आपकी सेटिंग के साथ। <em>कन्वर्टर</em> में हर वह टूल जो फाइल लेकर फाइल लौटाता है, आज तेईस: <a href="/hi/pdf-to-word/">PDF से Word</a> और <a href="/hi/word-to-pdf/">Word से PDF</a>, Excel तथा PowerPoint से PDF, PDF से HTML, टेक्स्ट, Markdown, EPUB और JPG, PDF/A, HEIC से JPG, तस्वीर छोटी करने वाला टूल और ICO वाले टूल।</li>
    <li><strong>फाइल छोड़िए।</strong> टाइल कन्वर्ज़न चलाकर नीचे नतीजे की पंक्ति दिखा देती है। बड़ी फाइलें अपने आप पीछे चलने वाले रास्ते पर जाती हैं, और चलते कन्वर्ज़न पर "बैकग्राउंड में जारी रखें" चुनकर आप काम आगे बढ़ा सकते हैं।</li>
    <li><strong>डाउनलोड कीजिए।</strong> नया नतीजा आने तक डाउनलोड का बटन बना रहता है, और उससे पिछले दो नीचे टिके रहते हैं।</li>
    <li><strong>टाइल को अपनी सेटिंग सिखाइए।</strong> टाइल का मेनू खोलिए, "टूल पेज पर कॉन्फ़िगर करें" चुनिए, और टूल का पन्ना उसी टाइल की सेटिंग लिए खुलता है। जो बदलना है बदलिए, <strong>वर्कफ़्लो सहेजें</strong> दबाइए, और टाइल नया रूप अपना लेती है। PDF से Word के लिए OCR इसी तरह चालू होता है, और पन्ने का नाप हर बार का फ़ैसला बनना बंद कर देता है। <a href="/hi/saved-workflows/">सहेजे गए वर्कफ़्लो</a> वाला पन्ना यही समझाता है।</li>
  </ol>

  <figure><img src="/static/images/blog/workbench-picker.jpg" alt="Workbench बोर्ड पर विजेट जोड़ें की सूची, शब्द word से छनी हुई, जिसमें मेरे प्रीसेट के नीचे OCR वाला सहेजा गया प्रीसेट और उसके नीचे PDF से Word तथा Word से PDF कन्वर्टर दिख रहे हैं" width="1280" height="800" loading="lazy"></figure>

  <p>दो चीज़ें जान-बूझकर टाइल नहीं बनतीं। जिन टूल में काम स्क्रीन पर होता है (दस्तख़त, टेक्स्ट जोड़ना, काटना, पन्ने जमाना, तुलना) उन्हें आपके हाथ और एक झलक चाहिए, इसलिए वे अपने पन्नों पर रहते हैं। और जिस टूल को ऐसा चुनाव चाहिए जिसका अंदाज़ा वह नहीं लगा सकता, जैसे तस्वीर बदलने वाला टूल जो नतीजे का फ़ॉर्मैट पूछता है, वह "टूल पेज पर सेट करें" दिखा देता है।</p>

  <h2>टेम्पलेट: Office, स्कैन, छवियाँ</h2>

  <p>खाली बोर्ड तीन शुरुआती रास्ते सुझाता है, और नया बोर्ड बनाने वाली परत भी वही:</p>

  <ul>
    <li><strong>Office</strong>: Word से PDF, PDF से Word, Excel से PDF, PowerPoint से PDF।</li>
    <li><strong>स्कैन</strong>: तस्वीर से टेक्स्ट, PDF से टेक्स्ट, PDF से Word।</li>
    <li><strong>छवियाँ</strong>: HEIC से JPG, तस्वीर छोटी करना, PDF से JPG।</li>
  </ul>

  <p>एक चुनिए, या खाली से शुरू कीजिए। टेम्पलेट बस बढ़त है: उसकी हर टाइल बदली या हटाई जा सकती है।</p>

  <h2>कई बोर्ड, और एडिट मोड</h2>

  <p>ऊपर बाईं ओर का चुनाव-बटन बोर्डों के बीच ले जाता है (फोन पर वहीं का अपना चुनाव-पर्दा), और बगल का बोर्ड मेनू नाम बदलने, डिफ़ॉल्ट बनाने, नकल बनाने और मिटाने का काम करता है।</p>

  <p>क्रम बदलने का काम एडिट मोड में होता है। ऊपर की पट्टी में <strong>संपादित करें</strong> दबाइए और हर टाइल पर खींचने की पकड़, नाम लिखने का खाना और हटाने का × आ जाता है। टाइलें अपने काम के क्रम में खींच लीजिए, "PDF से Word" का नाम बदलकर "स्कैन किए बिल" कर दीजिए, फिर "पूर्ण" दबाइए। एडिट मोड के बाहर भी टाइल का मेनू नाप S, M या L, बाईं ओर, दाईं ओर और हटाएँ देता रहता है।</p>

  <figure><img src="/static/images/blog/workbench-edit.jpg" alt="एडिट मोड में Workbench: हर टाइल पर खींचने की पकड़, नाम बदलने का खाना और हटाने का लाल बटन, और ऊपर की पट्टी में पूर्ण वाला बटन" width="1280" height="800" loading="lazy"></figure>

  <h2>लोग इसे किन तीन तरीकों से चलाते हैं</h2>

  <p><strong>बहीखाता संभालने वाली।</strong> महीने का अंत नाम का बोर्ड, तीन टाइलें। सप्लायर के बिल <a href="/hi/pdf-to-pdfa/">PDF से PDF/A</a> वाली टाइल पर उतरते हैं, क्योंकि आर्काइव इसके सिवा कुछ लेता नहीं। बैंक स्टेटमेंट <a href="/hi/pdf-to-excel/">PDF से Excel</a> पर जाते हैं, ताकि आँकड़े दोबारा टाइप न करने पड़ें, और तीसरी टाइल स्कैन की रसीदों से टेक्स्ट खींच लेती है। बीस फाइलें, बीस ड्रॉप, सेटिंग छुए बिना।</p>

  <p><strong>दफ़्तर का सहायक।</strong> जो अटैचमेंट बनकर बाहर जाता है, वह पहले बोर्ड से गुज़रता है। Word के मसौदे और स्लाइड PDF बन जाते हैं, ताकि पढ़ने वाले को वही सजावट दिखे जो लिखने वाले को दिखी थी, और बिक्री टीम के फोन से आई तस्वीरें Windows लैपटॉप तक पहुँचने से पहले <a href="/hi/image/heic-to-jpg/">HEIC से JPG</a> से निकल आती हैं। पहले हर फ़ॉर्मैट का अलग टैब। अब दिन भर एक ही।</p>

  <p><strong>शिक्षक।</strong> पढ़ाने की सामग्री किताब के पन्ने की तस्वीर बनकर आती है, और उसे फेरबदल लायक टेक्स्ट बनना है। <a href="/hi/image/to-text/">तस्वीर से टेक्स्ट</a> वाली टाइल पढ़ने का काम करती है, PDF से Word वाली टाइल पुराने स्कैन संभालती है, और Word से PDF वाली टाइल तैयार पाठ उस रूप में भेजती है जो स्कूल के हर प्रिंटर पर एक जैसा छपता है।</p>

