  <p>बिना अकाउंट मिलने वाली तीन टाइलें यह देखने के लिए काफ़ी हैं कि तरीका आपसे मेल खाता है या नहीं। Premium असल में सिंक जोड़ता है: बोर्ड और प्रीसेट अकाउंट पर रहते हैं, इसलिए मेज़ पर बनाया बोर्ड लैपटॉप और फोन पर पहले से मिलता है, वही टाइलें, वही सेटिंग। PDF से PDF/A आज एक ही कन्वर्टर है जो Premium तक सीमित है, बाकी सबको उस पर PRO का निशान दिखता है। दाम <a href="/hi/pricing/">कीमत वाले पन्ने</a> पर दिए हैं।</p>

  <h2>आपकी फाइलों का क्या होता है</h2>

  <p>बोर्ड आपके दस्तावेज़ कभी नहीं रखता। वह टूल के नाम, टाइलों का क्रम और सेटिंग रखता है, कुछ किलोबाइट लिखावट। तुरंत हो जाने वाले कन्वर्ज़न सीधे ब्राउज़र को लौटते हैं और कुछ टिकता नहीं। बड़ी फाइलें पीछे चलती हैं और करीब एक घंटे बाद मिट जाती हैं, ठीक जैसे टूल के पन्नों पर। टैब बंद कीजिए और बिल कहीं नहीं बचते; बोर्ड अगली बार वहीं मिलता है।</p>

  <h2>आम सवाल</h2>

  <h3>क्या Workbench मुफ़्त है?</h3>
  <p>हाँ, और बिना लॉग इन किए भी: एक बोर्ड, तीन टाइलें, आपके ब्राउज़र में। फ्री अकाउंट छह टाइलें देता है, Premium बीस-बीस टाइलों वाले पाँच बोर्ड, अकाउंट पर सिंक। हर स्तर में क्या है, यह <a href="/hi/workbench/about/">Workbench का परिचय</a> गिनाता है।</p>

  <h3>कौन से टूल टाइल बन सकते हैं?</h3>
  <p>वह सब जो फाइल लेकर फाइल लौटाता है, आज तेईस कन्वर्टर। जिन टूल में स्क्रीन पर आपकी दख़ल चाहिए (दस्तख़त, टेक्स्ट जोड़ना, काटना, पन्ने जमाना, तुलना) वे टाइल नहीं बनते, क्योंकि अकेली फाइल उन्हें नहीं बता सकती कि दस्तख़त कहाँ रखना है।</p>

  <h3>टाइल की सेटिंग कैसे बदलूँ?</h3>
  <p>टाइल का मेनू खोलिए और "टूल पेज पर कॉन्फ़िगर करें" चुनिए। टूल का पन्ना उस टाइल की मौजूदा सेटिंग लिए खुलता है, जो बदलना है बदलिए और वर्कफ़्लो सहेजें दबा दीजिए। उसके बाद हर ड्रॉप पर टाइल नई सेटिंग से चलती है।</p>

  <h3>क्या यह फोन पर चलता है?</h3>
  <p>हाँ। जाली एक ही कॉलम में सिमट जाती है, बोर्ड बदलने वाला बटन फोन का अपना चुनाव-पर्दा बन जाता है, और टाइल पर उँगली रखने से फाइल चुनने का पर्दा खुलता है, तस्वीरें या क्लाउड ड्राइव। माउस से खींचना ज़्यादा आराम देता है, पर यहाँ कुछ भी डेस्कटॉप-भर का नहीं।</p>

  <h3>क्या आप मेरी फाइलें रखते हैं?</h3>
  <p>नहीं। तुरंत हो जाने वाले कन्वर्ज़न सीधे ब्राउज़र को लौटते हैं और कहीं रखे नहीं जाते; पीछे चलने वाली कतार से गुज़री फाइलें करीब एक घंटे बाद मिट जाती हैं। बोर्ड को इतना ही याद रहता है कि आपने कौन से टूल चुने और उन्हें कैसे सजाया।</p>

  <h2>अपना बोर्ड खोलिए</h2>

  <p>समझने का सबसे तेज़ रास्ता एक बोर्ड बना लेना है। <a href="/hi/workbench/">Workbench</a> खोलिए, वे दो-तीन कन्वर्टर जोड़िए जो आप सबसे ज़्यादा चलाते हैं, और पहली टाइल पर एक फाइल छोड़ दीजिए। पहले किसी को करते देखना हो तो <a href="https://www.youtube.com/watch?v=Dcj_bE15UWQ" target="_blank" rel="noopener">YouTube पर दो मिनट का पूरा चक्कर</a> मौजूद है, और बाकी सवालों का जवाब <a href="/hi/workbench/about/">Workbench वाला पन्ना</a> देता है।</p>
