content_hi: |
  आप PDF खोलने जाते हैं और वह एक लाइन दिखाने से पहले ही पासवर्ड माँग लेती है। या वह तुरंत खुल जाती है, सब सामान्य दिखता है, और फिर चुपचाप मना कर देती है जब आप कोई पैराग्राफ़ कॉपी करने या छापने जाते हैं। दोनों सुरक्षित फ़ाइलें हैं, पर दोनों पर बिल्कुल अलग तरह के ताले लगे हैं, और इलाज इस पर टिका है कि आपका पाला किस ताले से पड़ा है। यह गाइड वह फ़र्क़ आसान शब्दों में समझाती है और बताती है कि जिस फ़ाइल पर आपका हक़ है, उससे पासवर्ड कैसे हटाएँ।

  <h2>PDF के लिए बंद होने का मतलब क्या है</h2>

  <p>एक PDF दो अलग पासवर्ड रख सकती है, और ज़्यादातर उलझन दोनों को एक मान लेने से पैदा होती है।</p>

  <ul>
    <li><strong>खोलने वाला पासवर्ड</strong> (जिसे यूज़र पासवर्ड भी कहते हैं)। इसके बिना फ़ाइल खुलेगी ही नहीं। सामग्री एन्क्रिप्ट होती है, इसलिए सही पासवर्ड डाले बिना रीडर के पास दिखाने को कुछ नहीं होता। यही वह पासवर्ड है जो फ़ाइल पर दबाते ही सामने आ जाता है।</li>
    <li><strong>मालिकाना पासवर्ड</strong> (जिसे अनुमति वाला पासवर्ड भी कहते हैं)। फ़ाइल बिना कुछ पूछे खुल जाती है, पर बनाने वाले ने कुछ काम बंद कर रखे होते हैं: अक्षर कॉपी करना, छापना, बदलना, फ़ॉर्म भरना, या पन्ने निकालना। आप उसे पढ़ सकते हैं, फिर भी ज़रूरत के बटन बुझे रहते हैं।</li>
  </ul>

  <p>एक ही PDF में इनमें से एक, दूसरा, या दोनों हो सकते हैं। आपके पास कौन सा है यह जानते ही पता चल जाता है कि कितना काम बचा है। जिस फ़ाइल को आप पहले से खोल पा रहे हैं, उससे मालिकाना पासवर्ड हटाना तेज़ है। जो खोलने वाला पासवर्ड आप जानते ही नहीं, उसे पार करना अलग बात है, और अक्सर बनावट के हिसाब से नामुमकिन, क्योंकि एन्क्रिप्शन का पूरा मक़सद वही है।</p>

  <h2>पहली हालत: पासवर्ड पता है, पर बार-बार पूछे जाने से तंग आ चुके हैं</h2>

  <p>यही सबसे आम हालत है। किसी साथी ने पासवर्ड भेजा, या आपने ख़ुद लगाया, और अब हर बार फ़ाइल खुलते वक़्त उसे लिखते-लिखते परेशान हैं। आपको साफ़ कॉपी चाहिए, जिसमें कोई पासवर्ड ही न हो।</p>

  <figure><img src="/static/blog/images/tool-unlock.jpg" alt="Convertica का ताला खोलने वाला टूल, पासवर्ड हटाने के लिए तैयार फ़ाइल के साथ" width="1280" height="800" loading="lazy"></figure>

  <ol>
    <li><a href="/hi/pdf-security/unlock/">ताला खोलने वाला टूल</a> खोलिए और फ़ाइल चढ़ाइए।</li>
    <li>PDF में खोलने वाला पासवर्ड है, तो पूछे जाने पर वह लिख दीजिए। सामग्री पढ़ने के लिए टूल को उसकी वैसे ही ज़रूरत है जैसे आपके रीडर को होती है।</li>
    <li>नतीजा डाउनलोड कर लीजिए। यह वही दस्तावेज़ है, जिसमें से पासवर्ड निकाल दिया गया है, इसलिए वह सीधे खुलता है और कॉपी, छपाई तथा बदलाव सामान्य ढंग से चलने देता है।</li>
  </ol>

  <p>पूरा काम कुछ सेकंड में होता है, और चढ़ाई गई फ़ाइल थोड़ी देर बाद सर्वर से हटा दी जाती है, इसलिए आपका कोई संवेदनशील दस्तावेज़ कहीं पड़ा नहीं रहता।</p>

  <h2>दूसरी हालत: फ़ाइल खुलती है, पर कॉपी, छपाई या बदलाव रोक देती है</h2>

  <p>यहाँ PDF में सिर्फ़ मालिकाना पासवर्ड है। आप उसे पढ़ सकते हैं, यानी आपके पास पहुँच पहले से जायज़ है, पर बनाने वाले ने कुछ काम बंद कर दिए हैं। अगर यह आपका ही दस्तावेज़ है, या ऐसा है जिस पर काम करने की आपको इजाज़त है, तो ये पाबंदियाँ हटाना सीधा है: उसे उसी <a href="/hi/pdf-security/unlock/">ताला खोलने वाले टूल</a> से चलाइए और अनुमति वापस लौटी कॉपी डाउनलोड कर लीजिए। कोई पासवर्ड नहीं पूछा जाता, क्योंकि आपको उसे खोलने से पहले कभी रोका ही नहीं गया था।</p>

  <p>इस किस्म पर एक साफ़ बात। मालिकाना पासवर्ड की पाबंदियाँ कभी मज़बूत सुरक्षा थीं ही नहीं। कई PDF रीडर उन्हें अनदेखा कर देते हैं, और फ़ॉर्मैट ख़ुद उन्हें दीवार की जगह एक गुज़ारिश की तरह लेता है। इसलिए अगर मक़सद किसी दस्तावेज़ को वाक़ई बचाना है, तो पाबंदियाँ ग़लत औज़ार हैं। सही तरीक़ा नीचे लिखा है।</p>

  <h2>तीसरी हालत: फ़ाइल आपकी है, पर खोलने वाला पासवर्ड भूल गए</h2>

  <p>यह मुश्किल हालत है, और यहाँ हक़ीक़त में रहना काम आता है। अगर PDF पर आजकल की एन्क्रिप्शन वाला असली खोलने का पासवर्ड लगा है, तो उस पासवर्ड के बिना सामग्री पढ़ी ही नहीं जा सकती। कोई छिपा बटन नहीं है, और जो साइट सेकंडों में मज़बूत एन्क्रिप्शन तोड़ने का दावा करती है, वह या झूठ बोल रही है या पर्दे के पीछे हर आम पासवर्ड आज़मा रही है, जो सिर्फ़ कमज़ोर पासवर्ड पर चलता है।</p>

  <p>इसलिए कुछ और करने से पहले अपने कदम दोबारा देख लीजिए:</p>

  <ul>
    <li>जिस ईमेल या संदेश के साथ फ़ाइल आई थी उसे देखिए। खोलने वाला पासवर्ड अक्सर दस्तावेज़ के साथ ही भेजा जाता है।</li>
    <li>अपने पासवर्ड मैनेजर में देखिए। पासवर्ड आपने लगाया था, तो वहाँ सहेजा हो सकता है।</li>
    <li>जिसने फ़ाइल बनाई या भेजी, उससे पूछिए। दफ़्तर के काग़ज़ों में बनाने वाला या IT टीम आम तौर पर खुली कॉपी दोबारा दे सकती है।</li>
    <li>अगर PDF आपने ख़ुद किसी और सॉफ़्टवेयर से बनाई थी, तो बंद फ़ाइल से लड़ने के बजाय उसे मूल फ़ाइल से दोबारा बना लीजिए।</li>
  </ul>

  <p>अगर पासवर्ड वाक़ई जा चुका है और एन्क्रिप्शन असली है, तो समझदारी इसमें है कि फ़ाइल पर हमला करने के बजाय मूल स्रोत से नई कॉपी ले ली जाए। यह किसी टूल की कमी नहीं है, एन्क्रिप्शन को इसी तरह काम करना चाहिए।</p>

  <h2>PDF का ताला खोलना कानूनी है?</h2>

  <p>पासवर्ड हटाना ठीक है, जब दस्तावेज़ आपका हो या उसे खोलने की इजाज़त आपके पास हो: आपके अपने स्कैन, वे फ़ाइलें जो क्लाइंट ने काम के लिए भेजी हैं, आपकी टीम की रिपोर्ट। यह ठीक नहीं है कि किसी और की गोपनीय फ़ाइल, किसी ख़रीदी जाने वाली किताब, या ऐसी किसी चीज़ की सुरक्षा तोड़ी जाए जिस तक पहुँचने का हक़ आपके पास नहीं था। टूल यह मानकर चलता है कि फ़ाइल पर आपका हक़ है, और उस भरोसे को निभाना आपके ज़िम्मे है।</p>

  <h2>ताला खुलने के बाद: उसे सही तरीक़े से सुरक्षित रखिए</h2>

  <p>अगर आपने पासवर्ड सिर्फ़ रोज़ का काम आसान करने के लिए हटाया है पर फ़ाइल अब भी संवेदनशील है, तो उसे खुला मत छोड़िए। <a href="/hi/pdf-security/protect/">पासवर्ड वाले टूल</a> से उस पर मज़बूत खोलने वाला पासवर्ड ठीक से दोबारा लगाइए, और वह पासवर्ड फ़ाइल से अलग रास्ते से भेजिए। इससे आपको मालिकाना पासवर्ड की कमज़ोर, आसानी से अनदेखी होने वाली पाबंदियों की जगह असली एन्क्रिप्शन मिलती है। अगर आप अक्सर गोपनीय PDF ईमेल करते हैं, तो <a href="/hi/blog/password-protect-pdf-before-emailing/">ईमेल से पहले PDF पर पासवर्ड लगाने की गाइड</a> इसे सुरक्षित ढंग से करने का पूरा तरीक़ा बताती है।</p>

  <h2>अक्सर पूछे जाने वाले सवाल</h2>

  <h3>ताला खोलने और एन्क्रिप्शन हटाने में क्या फ़र्क़ है?</h3>
  <p>ये एक ही नतीजे को दो तरफ़ से कहते हैं। एन्क्रिप्शन हटाने का मतलब है सही पासवर्ड की मदद से बंद सामग्री को वापस पढ़ने लायक बनाना। ताला खोलना उसी बात का रोज़ का शब्द है: ऐसी फ़ाइल जो आज़ादी से खुले और कॉपी, छपाई तथा बदलाव करने दे। खोलने वाला पासवर्ड हटाने के लिए वह पासवर्ड चाहिए; सिर्फ़ मालिकाना पाबंदियाँ हटाने के लिए नहीं।</p>

  <h3>क्या PDF का पासवर्ड बिना जाने हटा सकता हूँ?</h3>
  <p>सिर्फ़ मालिकाना पाबंदियाँ, और वह भी इसलिए कि वे कभी असली एन्क्रिप्शन थीं ही नहीं। आजकल की एन्क्रिप्शन वाला असली खोलने का पासवर्ड उस पासवर्ड के बिना नहीं हटाया जा सकता। फ़ाइल आपकी है, तो उसके बजाय मूल स्रोत से साफ़ कॉपी ले लीजिए।</p>

  <h3>ताला खुलने से दस्तावेज़ ख़ुद बदल जाएगा?</h3>
  <p>नहीं। अक्षर, तस्वीरें, ढाँचा और पन्ने ठीक वैसे ही रहते हैं जैसे थे। बदलती सिर्फ़ यह बात है कि पासवर्ड और पाबंदियाँ चली जाती हैं, इसलिए फ़ाइल आम PDF की तरह बरतने लगती है।</p>

  <h3>क्या एक साथ कई PDF का ताला खोल सकता हूँ?</h3>
  <p>प्रीमियम वाले एक-एक फ़ाइल चढ़ाने के बजाय पूरा ढेर एक साथ चला सकते हैं, जो तब काम आता है जब रिपोर्टों का पूरा फ़ोल्डर एक ही पाबंदी लिए हो। एक फ़ाइल के लिए आम टूल ही काफ़ी है।</p>

  <h3>गोपनीय PDF का ताला ऑनलाइन खोलना सुरक्षित है?</h3>
  <p>चढ़ाई गई फ़ाइलें काम पूरा होने के थोड़ी देर बाद सर्वर से मिटा दी जाती हैं, इसलिए वे न सहेजी जाती हैं न साझा। जिस दस्तावेज़ को आपकी मशीन से बाहर कभी नहीं जाना चाहिए, उसके लिए सबसे सुरक्षित रास्ता हमेशा यही है कि बनाने वाले से ही बिना पासवर्ड वाली कॉपी ले ली जाए। रोज़ की अपनी फ़ाइलों पर ऑनलाइन ताला खोलना तेज़ और साफ़ है।</p>

  <h2>अभी आज़माइए</h2>

  <p>अगर आपकी मेज़ पर पड़ी कोई PDF वही पासवर्ड माँगती रहती है जो आप पहले से जानते हैं, या खुल तो जाती है पर एक लाइन कॉपी नहीं करने देती, तो उसे <a href="/hi/pdf-security/unlock/">ताला खोलने वाले टूल</a> में डालिए और साफ़ कॉपी डाउनलोड कर लीजिए। और फ़ाइल को अब भी सुरक्षा चाहिए, तो <a href="/hi/pdf-security/protect/">पासवर्ड वाले टूल</a> से एक ठीक पासवर्ड वापस लगा दीजिए, ताकि वह आपके रास्ते में आए बिना सुरक्षित बनी रहे।</p>
