meta_keywords_hi: "PDF के पन्नों का क्रम बदलें, PDF पन्ने आगे-पीछे करें, PDF का क्रम, PDF व्यवस्थित करें, reorder pdf pages hindi"
excerpt_hi: "अगर आपने कभी एक भटके पन्ने को ठीक जगह लाने के लिए PDF छापी, दोबारा स्कैन की और फिर चढ़ाई है, तो यह गाइड वही तेज़ इलाज है जो सालों पहले मिल जाना चाहिए था।"
content_hi: |
  जिसने भी काग़ज़ों का ढेर स्कैन किया है और पन्ने उलटे क्रम में आते देखे हैं, वह यह झुँझलाहट जानता है। आप फ़ाइल छापते हैं, काग़ज़ फिर से जमाते हैं, दोबारा स्कैन करते हैं, और दुआ करते हैं कि इस बार क्रम टिक जाए। अच्छी ख़बर यह है कि इसे ठीक करने के लिए Acrobat, कोई सॉफ़्टवेयर, या पूरा कंप्यूटर भी नहीं चाहिए। एक ब्राउज़र टैब और माउस (या अँगूठा) काफ़ी है।

  यह गाइड बताती है कि PDF के पन्ने खींचकर क्रम में कैसे लगाएँ, और साथ के वे काम भी, जो लगभग हमेशा उसी बैठक में आ जाते हैं।

  <figure><img src="/static/blog/images/tool-organize-hero.jpg" alt="Convertica का व्यवस्थित करने वाला टूल, खींचकर क्रम बदलने के लिए छोटी तस्वीरों के साथ" width="1280" height="800" loading="lazy"></figure>

  <h2>पन्नों का क्रम कब बदलना पड़ता है</h2>
  <p>यह काम पीछे कहीं चुपचाप पड़ा रहता है, और फिर अचानक ज़रूरी हो जाता है। सबसे आम हालात हर पेशे में हैरान करने वाली तरह एक जैसे हैं:</p>
  <ul>
    <li>दो-तीन फ़ाइलें जोड़ीं और अब परिशिष्ट कवर चिट्ठी से पहले बैठा है।</li>
    <li>स्कैनर ने पन्ने उम्मीद से ज़रा अलग क्रम में निकाल दिए (दूसरा पन्ना अगले काग़ज़ के साथ चिपक गया, फ़ीडर की जानी-पहचानी गड़बड़)।</li>
    <li>समीक्षा से पहले प्रस्तुति का क्रम आख़िरी वक़्त पर बदलना है।</li>
    <li>क्लाइंट ने सारांश सबसे पहले माँगा, चाहे वह लिखा सबसे आख़िर में गया था।</li>
    <li>कॉन्ट्रैक्ट के कई हिस्से तार्किक क्रम के बजाय वर्णक्रम में जुड़ गए।</li>
    <li>मुनीम ने सुधार के साथ टैक्स का पुलिंदा लौटाया, और आपको सुधरा पन्ना ठीक वहीं डालना है जहाँ पुराना था।</li>
  </ul>
  <p>हर हालत में सबसे तेज़ रास्ता यही है कि फ़ाइल दोबारा बनाने के बजाय <a href="/hi/pdf-organize/organize/">पन्ने देखकर व्यवस्थित</a> कर लीजिए।</p>

  <h2>कदम-दर-कदम: खींचकर क्रम बदलना</h2>
  <p>यह तरीक़ा जान-बूझकर PowerPoint या Keynote में स्लाइड आगे-पीछे करने जैसा रखा गया है, ताकि आपकी बनी हुई आदत यहाँ भी काम आए।</p>

  <figure><img src="/static/blog/images/tool-organize-options.jpg" alt="PDF के पन्नों की छोटी तस्वीरें खींचकर किसी भी क्रम में लगाना" width="1280" height="800" loading="lazy"></figure>

  <ol>
    <li><strong>PDF अपलोड कीजिए।</strong> व्यवस्थित करने वाला टूल खोलिए और फ़ाइल अपलोड की जगह पर छोड़ दीजिए। तीन पन्नों के कॉन्ट्रैक्ट से दो सौ पन्नों की रिपोर्ट तक, सब चलता है।</li>
    <li><strong>छोटी तस्वीरों का इंतज़ार कीजिए।</strong> हर पन्ना एक छोटी झलक के रूप में बनता है, मौजूदा क्रम में गिनती के साथ। बड़ी फ़ाइलों में कुछ सेकंड लगते हैं; यह टूल का तस्वीरें बनाना है, अटकना नहीं।</li>
    <li><strong>पन्ने उनकी नई जगह पर खींचिए।</strong> छोटी तस्वीर दबाकर पकड़िए, उसे दो दूसरी तस्वीरों के बीच ले जाइए, और छोड़ दीजिए। गिनती फ़ौरन बदल जाती है, इसलिए नया क्रम सामने दिखता रहता है।</li>
    <li><strong>लागू कीजिए और डाउनलोड कीजिए।</strong> बटन दबाइए और टूल PDF को नए क्रम में बना देता है। नतीजा नई फ़ाइल है, आपकी मूल फ़ाइल जैसी थी वैसी रहती है।</li>
  </ol>
  <blockquote class="callout">पन्ना ग़लत जगह छूट जाए, तो उसे फिर खींच लीजिए। यहाँ बीच में कुछ सहेजा नहीं जाता, इसलिए डाउनलोड दबाने तक कुछ भी पक्का नहीं होता।</blockquote>

  <h3>छोटी तस्वीरें असल में क्या दिखाती हैं</h3>
  <p>पन्ना तेज़ रखने के लिए छोटी तस्वीरें कम रेज़ोल्यूशन पर बनती हैं, इसलिए बहुत छोटा टेक्स्ट झलक में पढ़ा नहीं जाता। यह होना ही है। आप तस्वीरें पन्ना पहचानने के लिए देख रहे हैं, पढ़ने के लिए नहीं। अगर दो पन्ने इस आकार में एक जैसे लगें (अध्याय के शीर्षक पन्नों या बार-बार आने वाले अलगाव पन्नों के साथ आम बात), तो उन्हें बड़ा करने के लिए कर्सर ले जाइए या दबाइए।</p>

  <p>यह भी जानने लायक: पहले पन्ने की तस्वीर बाक़ी से पहले बनती है। पहला पन्ना ठीक दिखे पर आगे की तस्वीरें अभी बन रही हों, तो फ़ाइल पर राय बनाने से पहले कुछ सेकंड और दे दीजिए। कई लोग जल्दी खींचना शुरू कर देते हैं, जो तस्वीर चाहिए थी वह चूक जाते हैं, और ग़लत पन्ना ग़लत जगह पहुँच जाता है।</p>

  <h2>एक ही बार में क्रम, हटाना और घुमाना</h2>
  <p>असल ज़िंदगी की सफ़ाई एक ही काम नहीं होती। आम तौर पर आप क्रम बदलना चाहते हैं, ख़ाली कवर पन्ना हटाना चाहते हैं, और तिरछे आए दो स्कैन सीधे करना चाहते हैं। तीन अलग टूल चलाने का मतलब है तीन अपलोड, तीन डाउनलोड, और यह भूलने के तीन मौक़े कि सबसे नई फ़ाइल कौन सी है। बहुत लोगों के फ़ोल्डर में <code>document_v2.pdf</code>, <code>document_v2_rotated.pdf</code> और <code>document_v2_rotated_clean.pdf</code> साथ-साथ पड़े मिलते हैं, और असली कौन सी है यह जानने के लिए हर एक खोलनी पड़ती है।</p>
  <p>व्यवस्थित करने वाले टूल में आप तीनों काम उसी एक जगह कर सकते हैं:</p>
  <ul>
    <li><strong>क्रम</strong> पन्ने खींचकर।</li>
    <li><strong>हटाना</strong> तस्वीर पर बने कूड़े के छोटे निशान से।</li>
    <li><strong>घुमाना</strong> उसी तस्वीर पर घुमाने के निशान से, या सब कुछ तिरछा आया हो तो एक बार में सब पर। सिर्फ़ कुछ पन्ने घुमाने हैं, तो अलग टूल में <a href="/hi/pdf-edit/rotate/">तिरछे पन्ने सीधे कर</a> सकते हैं।</li>
  </ul>
  <p>एक ही बार में करने का मतलब है एक ही आख़िरी फ़ाइल, एक ही बार नाम, और अधूरी बीच की फ़ाइलों से भरा डाउनलोड फ़ोल्डर नहीं।</p>

  <h2>जोड़ने से पहले क्रम लगाना, बाद में सुधारने से बेहतर है</h2>
  <p>कई PDF को एक में जोड़ना है, तो पहले जोड़ने वाले पन्ने पर दस सेकंड लगाकर फ़ाइलों का क्रम ठीक कर लीजिए। जोड़ने वाला टूल फ़ाइलें उसी क्रम में लगाता है जिसमें आपने रखी हैं, इसलिए बटन दबाने से पहले फ़ाइलों की टाइलें खींचकर <a href="/hi/pdf-organize/merge/">PDF सही क्रम में जोड़</a> सकते हैं।</p>
  <p>जोड़ने के बाद क्रम सुधारना भी ठीक है, ऊपर बताया खींचने वाला तरीक़ा यही करता है, पर तब आपको ज़्यादा पन्ने हिलाने पड़ेंगे। सात-सात पन्नों की तीन फ़ाइलों से बनी बीस पन्नों की फ़ाइल में, तीन फ़ाइलों का क्रम पहले लगाने का मतलब है तीन बार खींचना, उन्नीस बार के बजाय। बात वही है जो छपाई की दुकानें दशकों से मानती आई हैं: जिल्द बाँधने से पहले काग़ज़ जमाइए, बाद में नहीं।</p>

  <h3>एक बार क्रम, कई बार सुधार</h3>
  <p>जो दस्तावेज़ कई बार समीक्षा से गुज़रता है, उसमें क्रम एक बार शुरू में लगाइए, जब हिस्सों का तर्क तय हो जाए, और उसके बाद के सारे बदलाव वहीं करते जाइए। हर बार क्रम फिर लगाना धीरे-धीरे खिसकाव लाता है, और दस्तावेज़ ऐसे मिले-जुले क्रम में पहुँच जाता है जो किसी ने माँगा ही नहीं था।</p>

  <h2>मोबाइल और कंप्यूटर, दोनों पर</h2>
  <p>PDF के पन्नों का क्रम बदलना उन गिने-चुने कामों में है जो फ़ोन पर वाक़ई अच्छा चलता है। आप बड़ी टाइलें खींच रहे हैं, बारीक टेक्स्ट नहीं चुन रहे, इसलिए छूने वाली स्क्रीन कुछ मामलों में माउस से बेहतर पड़ती है।</p>
  <h3>फ़ोन या टैबलेट पर</h3>
  <ul>
    <li>छोटी तस्वीर को दबाकर रखिए, जब तक वह उठ जाए (ज़्यादातर ब्राउज़र में करीब 300 मिलीसेकंड; iOS का Safari कभी ज़रा धीमा)।</li>
    <li>उँगली से नई जगह तक खींचिए। किनारे पर पहुँचते ही जाल अपने आप सरकने लगता है।</li>
    <li>तस्वीरें पहचानने के लिए बहुत छोटी हों, तो दो उँगलियों से बड़ा कर लीजिए।</li>
    <li>अपने आप सरकना उछलता लगे, तो उँगली उठाइए, हाथ से सरकाइए, और फिर पन्ना पकड़िए।</li>
  </ul>
  <h3>कंप्यूटर पर</h3>
  <ul>
    <li>माउस से दबाकर खींचिए, जैसे फ़ाइल मैनेजर में फ़ाइल सरकाते हैं।</li>
    <li>कई तस्वीरें एक साथ चुनने के लिए Shift दबाए रखिए (जहाँ यह चलता है) और कई पन्ने एक बार में सरका दीजिए।</li>
    <li>स्क्रीन पर सब कुछ छोटा दिख रहा है, तो जाल बड़ा करने के लिए ब्राउज़र का ज़ूम (Ctrl या Cmd के साथ प्लस) बढ़ा लीजिए।</li>
    <li>ट्रैकपैड वालों के लिए: दो उँगलियों से सरकाना तस्वीरों के जाल के अंदर भी चलता है, इसलिए लंबी PDF में मनचाहा पन्ना एक ही झटके की दूरी पर है।</li>
  </ul>

  <h2>नतीजा ठीक से सहेजना</h2>
  <p>यह टूल हमेशा नई फ़ाइल बनाता है। मूल फ़ाइल पर नहीं लिखता। यह जान-बूझकर है, ताकि दो दिन बाद मन बदल जाए तो असली फ़ाइल आपकी डिस्क या क्लाउड ड्राइव पर वैसी ही पड़ी हो।</p>
  <p>कुछ छोटी आदतें उस जानी-पहचानी मुसीबत से बचा देती हैं कि सबसे नई फ़ाइल कहाँ है:</p>
  <ul>
    <li>डाउनलोड हुई फ़ाइल के नाम में <code>_reordered</code> या <code>_v02</code> जोड़ दीजिए।</li>
    <li>जब तक पक्का न हो जाए कि क्रम सही है, मूल फ़ाइल रखिए। मिटाइए बाद में, तुरंत नहीं।</li>
    <li>उसी फ़ाइल का क्रम फिर बदलें, तो ऊपर लिखने के बजाय नंबर बढ़ाते जाइए।</li>
    <li>समीक्षक कई हों, तो नाम में बदलाव की तारीख़ रखिए (<code>contract_2026-04-28.pdf</code>), सिर्फ़ v2 नहीं, ताकि उनकी टिप्पणियाँ उसी फ़ाइल से मेल खाएँ जिस पर वे लिखी गई हैं।</li>
  </ul>
  <p>इस पर और विस्तार से <a href="/hi/blog/pdf-naming-conventions-best-practices/">PDF के नाम रखने की गाइड</a> में लिखा है, जो एक प्रोजेक्ट से आगे भी काम आने वाले तरीक़े बताती है।</p>

  <h2>अगर नतीजे को बाँटना भी है</h2>
  <p>कभी-कभी क्रम लगाते हुए पता चलता है कि यह दस्तावेज़ असल में दो दस्तावेज़ों को ठूँसकर बनाया गया था। सब कुछ क्रम में आ जाने के बाद <a href="/hi/pdf-organize/split/">हिस्सों में बाँटना</a> उलझी फ़ाइल में से बाँटने से बहुत आसान है। पहले क्रम, फिर बाँटना, बाद में आप ख़ुद को शाबाशी देंगे।</p>

  <h2>अक्सर पूछे जाने वाले सवाल</h2>
  <h3>क्या फ़ोन पर पन्नों का क्रम बदल सकता हूँ?</h3>
  <p>हाँ। तस्वीरों का जाल छूने के लिए ही बना है: पन्ना उठाने के लिए दबाकर रखिए, उँगली से खींचिए, और नई जगह छोड़ दीजिए। iOS का Safari, Android का Chrome और टैबलेट के ब्राउज़र, सब चलते हैं। जाल के लिए जगह बढ़ाने के लिए फ़ोन आड़ा कर लेना अच्छा रहता है।</p>
  <h3>क्रम बदलने से पन्ना संख्या अपने आप बदल जाएगी?</h3>
  <p>नहीं। पन्ने पर छपी संख्या वहीं रहती है जहाँ छपी थी। क्रम बदलना सिर्फ़ पन्नों की तरतीब बदलता है, उन पर लिखा टेक्स्ट नहीं। नई संख्या चाहिए तो बाद में पन्ना संख्या डालने वाला टूल चला लीजिए।</p>
  <h3>पन्ना ग़लत जगह छूट जाए तो वापस ला सकता हूँ?</h3>
  <p>उसे फिर से सही जगह खींच लीजिए। डाउनलोड दबाने तक डिस्क पर कुछ नहीं लिखा जाता, इसलिए पूरा सत्र एक ड्राफ़्ट जैसा है जिसे आप जितनी बार चाहें बदल सकते हैं। ब्राउज़र का टैब बंद कर देना पूरा सत्र छोड़ देना है; लौटाने के लिए कुछ सहेजा नहीं जाता।</p>
  <h3>क्या यह पासवर्ड वाली PDF पर चलता है?</h3>
  <p>सीधे नहीं, क्योंकि तस्वीरें बनाने के लिए टूल को पन्ने पढ़ने पड़ते हैं। PDF आपकी है तो पहले खोल लीजिए, क्रम बदलिए, और नतीजे पर पासवर्ड फिर लगा दीजिए। दस्तावेज़ आपका नहीं है, तो मालिक से बिना पासवर्ड वाली कॉपी माँगिए।</p>
  <h3>क्रम बदलना और पन्ना हटाना एक साथ कर सकता हूँ?</h3>
  <p>हाँ। व्यवस्थित करने वाला टूल दोनों काम एक ही जगह देता है, इसलिए आप पन्ने सही क्रम में खींच सकते हैं और जिन्हें छोड़ना है उन पर कूड़े का निशान दबा सकते हैं। दोनों बदलाव एक ही नई फ़ाइल में उतरते हैं।</p>

  <h2>अभी आज़माइए</h2>
  <p>पन्नों का क्रम ठीक करने के लिए छापना और दोबारा स्कैन करना बंद कीजिए। अपनी PDF चढ़ाइए, पन्ने वहाँ खींचिए जहाँ उन्हें होना चाहिए था, और एक मिनट से कम में साफ़ फ़ाइल डाउनलोड कर लीजिए। <a href="/hi/pdf-organize/organize/">PDF व्यवस्थित करने वाला टूल खोलें →</a></p>
