slug: convert-pdf-to-jpg-and-back
title_hi: "गुणवत्ता बिगाड़े बिना PDF को JPG में (और JPG को वापस PDF में) कैसे बदलें"
meta_title_hi: "PDF से JPG और वापस, मुफ़्त | Convertica"
meta_description_hi: "PDF को JPG तस्वीरों में बदलिए और तस्वीरों से PDF दोबारा बनाइए, सही तरीक़े से। रेज़ोल्यूशन की सेटिंग, PNG कब बेहतर है, और पन्नों का क्रम कैसे बचाएँ।"
meta_keywords_hi: "PDF से JPG, JPG से PDF, PDF को तस्वीर में बदलें, PDF से JPG मुफ़्त, तस्वीरों से PDF, pdf to jpg hindi"
excerpt_hi: "PDF को JPG में और वापस बदलना मामूली लगता है, जब तक टेक्स्ट धुँधला न हो जाए या पन्ने उलटे क्रम में न निकलें। इलाज दो सेटिंग हैं जिन्हें ज़्यादातर टूल छिपा देते हैं: बाहर जाते वक़्त रेज़ोल्यूशन, और वापस आते वक़्त क्रम।"
content_hi: |
  PDF को JPG में बदलने की दो रोज़मर्रा वजहें हैं: आपको एक पन्ना वहाँ डालना है जहाँ सिर्फ़ तस्वीरें चलती हैं, जैसे कोई ऑनलाइन बाज़ार, सोशल पोस्ट या चैट ऐप, या आपको कोई पन्ना किसी स्लाइड या दस्तावेज़ में तस्वीर की तरह चिपकाना है। और उतनी ही आम है उलटी यात्रा: आपके पास फ़ोन की तस्वीरों या स्कैन का ढेर है और उसे पंद्रह अलग अटैचमेंट के बजाय एक साफ़ PDF बनाना है।

  दोनों तरफ़ का काम मुफ़्त है और सेकंडों का है। साफ़ नतीजे को धुँधली, उलटी-पुलटी गड़बड़ से जो अलग करता है, वे दो सेटिंग हैं जिन्हें ज़्यादातर टूल छिपा देते हैं। उन्हें ठीक कर लीजिए और आप इसके बारे में फिर कभी नहीं सोचेंगे।

  <figure><img src="/static/blog/images/tool-pdf-to-jpg-hero.jpg" alt="Convertica का PDF से JPG कन्वर्टर, फ़ाइल अपलोड की जगह के साथ" width="1280" height="800" loading="lazy"></figure>

  <h2>PDF से JPG: रेज़ोल्यूशन का फ़ैसला</h2>

  जब आप PDF का पन्ना JPG बनाते हैं, तो टूल उस पन्ने को चुने हुए रेज़ोल्यूशन पर एक तस्वीर की तरह बनाता है, जिसे DPI में नापा जाता है। यही एक आँकड़ा तय करता है कि आपका टेक्स्ट साफ़ रहेगा या लुगदी बन जाएगा।

  <ul>
    <li><strong>72 से 96 DPI</strong>, सिर्फ़ स्क्रीन के लिए। छोटी झलक के लिए ठीक, छोटे अक्षरों वाली किसी भी चीज़ के लिए बहुत हल्का।</li>
    <li><strong>150 DPI</strong>, स्क्रीन पर भेजने के लिए सबसे सही। टेक्स्ट फ़ोन और मॉनिटर पर साफ़ पढ़ा जाता है और फ़ाइल हल्की रहती है।</li>
    <li><strong>300 DPI</strong>, छपाई की गुणवत्ता। तस्वीर छपेगी या उसे बड़ा करके देखा जाएगा, तो यही लीजिए। फ़ाइल भारी होती है, पर अक्षर और बारीक लकीरें साफ़ रहती हैं।</li>
  </ul>

  <blockquote class="callout">अगर आपकी JPG धुँधली दिख रही है, तो आपने लगभग पक्का बहुत कम DPI पर बनाई है। स्क्रीन के लिए 150 पर या छपाई के लिए 300 पर दोबारा बनाइए; कम रेज़ोल्यूशन की तस्वीर बाद में साफ़ नहीं की जा सकती।</blockquote>

  कई पन्नों की PDF से हर पन्ने की एक JPG बनती है। पहले तय कर लीजिए कि आपको हर पन्ना चाहिए या एक ही। चालीस पन्नों की रिपोर्ट को चालीस तस्वीरों में बदल देना, जब चाहिए था सिर्फ़ तीसरा पन्ना, यहाँ समय गँवाने का सबसे आम तरीक़ा है। ज़्यादातर टूल बदलने से पहले पन्नों की गिनती चुनने देते हैं।

  <h2>JPG या PNG? यह सोचने से ज़्यादा मायने रखता है</h2>

  JPG और PNG अलग तरह से दबाते हैं, और दस्तावेज़ों में यह फ़र्क़ दिखता है। JPG गँवाकर दबाता है, जो फ़ोटो के लिए बढ़िया है पर सफ़ेद पर काले तेज़ अक्षरों के चारों तरफ़ हल्की परछाई बना देता है, और ज़्यादातर दस्तावेज़ बने ही उसी चीज़ से हैं। PNG कुछ नहीं गँवाता और अक्षरों के किनारे छुरी जैसे साफ़ रखता है।

  <figure><img src="/static/blog/images/tool-pdf-to-jpg-options.jpg" alt="PDF से JPG के विकल्प, पन्नों की गिनती और रेज़ोल्यूशन समेत" width="1280" height="800" loading="lazy"></figure>

  काम का नियम: पन्ना ज़्यादातर टेक्स्ट या लकीरों का है (कॉन्ट्रैक्ट, बिल, नक़्शे), तो PNG लीजिए। ज़्यादातर फ़ोटो या भरे-पूरे ग्राफ़िक का है, तो JPG बिना दिखने वाले नुक़सान के कहीं हल्की फ़ाइल देता है। कोई टूल सिर्फ़ JPG देता है, तो अक्षरों की परछाई की भरपाई के लिए DPI एक पायदान बढ़ा दीजिए।

  <h2>JPG से वापस PDF: क्रम बचाइए</h2>

  तस्वीरों से PDF दोबारा बनाना वही जगह है जहाँ चीज़ें चुपचाप बिगड़ती हैं। जाल है नाम के हिसाब से लगने वाला क्रम। अगर आपकी तस्वीरों के नाम <code>IMG_2, IMG_10, IMG_1</code> हैं, तो कई टूल उन्हें वर्णक्रम में लगा देते हैं, जिससे <code>IMG_10</code> पहले आ जाता है और <code>IMG_2</code> बाद में। पन्ने आगे-पीछे हो जाते हैं।

  <figure><img src="/static/blog/images/tool-jpg-to-pdf-hero.jpg" alt="Convertica का JPG से PDF टूल, कई तस्वीरों को एक दस्तावेज़ में जोड़ते हुए" width="1280" height="800" loading="lazy"></figure>

  बिना चौंकाने वाले नतीजों के <a href="/hi/jpg-to-pdf/">तस्वीरों को एक PDF में जोड़ने</a> का तरीक़ा:

  <ol>
    <li>सारी तस्वीरें एक-एक करके नहीं, एक साथ चढ़ाइए।</li>
    <li>फ़ाइल बनाने से पहले झलक में क्रम देख लीजिए। जो तस्वीर जगह से हटी हो, उसे खींचकर सही जगह लगा दीजिए।</li>
    <li>तस्वीरें अलग-अलग नाप की हैं, तो पन्ने का एक जैसा आकार तय कीजिए, वरना खड़ा स्कैन और आड़ी फ़ोटो मिलकर बेमेल पन्ने बनाते हैं।</li>
    <li>फ़ाइल बनाइए, और एक बार नीचे तक देख लीजिए कि क्रम ठीक पढ़ा जा रहा है।</li>
  </ol>

  रसीदों का ढेर, फ़ोटो खींचा कई पन्नों का कॉन्ट्रैक्ट, या बच्चे का होमवर्क, इन सबको एक ऐसी फ़ाइल में बदलने का यह तेज़ रास्ता है जिसे टीचर या मुनीम असल में खोल सके।

  <h2>आम हालात</h2>

  <h3>PDF का एक पन्ना किसी बाज़ार या सोशल ऐप पर डालना</h3>
  <p>ऑनलाइन बाज़ार और सोशल ऐप PDF नामंज़ूर करते हैं पर तस्वीरें ले लेते हैं। जो पन्ना चाहिए, बस उसे 150 DPI पर JPG बना लीजिए, और वह किसी भी फ़ोटो की तरह चढ़ जाएगा। बहुत टेक्स्ट वाले परचे के लिए PNG लीजिए, ताकि कोई बड़ा करके देखे तो छोटे अक्षर भी पढ़े जाएँ।</p>

  <h3>दस्तावेज़ की फ़ोन तस्वीरों को PDF बनाना</h3>
  <p>हर पन्ना एक जैसी रोशनी में खींचिए, सारी तस्वीरें एक साथ चढ़ाइए, झलक में क्रम ठीक कीजिए, और फ़ाइल बना लीजिए। तस्वीरें भारी हैं तो बनी PDF भी भारी होगी, उसे ईमेल के लायक बनाने के लिए बाद में <a href="/hi/pdf-organize/compress/">PDF छोटी कर लीजिए</a>।</p>

  <h3>ऐसे ऐप को स्कैन भेजना जो सिर्फ़ तस्वीरें लेता है</h3>
  <p>कुछ चैट और अपलोड के ख़ाने JPG लेते हैं, PDF नहीं। हर पन्ना 150 DPI पर JPG बनाइए और तस्वीरें भेज दीजिए, या सामने वाले को एक ही दस्तावेज़ चाहिए तो बाद में उन्हें जोड़ लीजिए।</p>

  <h2>गुणवत्ता और साइज़ के नुस्ख़े</h2>

  <ul>
    <li>PDF से JPG और फिर वापस PDF, यह चक्कर हर बार सामग्री दोबारा दबाता है। एक ही फ़ाइल को बार-बार आगे-पीछे मत घुमाइए; मूल PDF रखिए और ज़रूरत पड़ने पर उसी से तस्वीरें बना लीजिए।</li>
    <li>फ़ोन से सीधे आई तस्वीरें अक्सर चार हज़ार बिंदु चौड़ी होती हैं, जो किसी दस्तावेज़ की ज़रूरत से कहीं ज़्यादा है। उन्हें पहले PDF बनाना और फिर छोटा करना, आम तौर पर बिना दिखने वाले नुक़सान के फ़ाइल कई गुना हल्की कर देता है।</li>
    <li>स्कैन से PDF बना ली है और अब उसमें टेक्स्ट ढूँढना या कॉपी करना है, तो उस पर OCR चला लीजिए। टेक्स्ट की तस्वीरों में तब तक कुछ ढूँढा नहीं जा सकता।</li>
  </ul>

  <h2>अक्सर पूछे जाने वाले सवाल</h2>

  <h3>गुणवत्ता बिगाड़े बिना PDF को JPG कैसे बनाऊँ?</h3>
  <p>छपाई के लिए 300 DPI पर और स्क्रीन के लिए 150 DPI पर बनाइए। PDF से JPG में गुणवत्ता बहुत कम रेज़ोल्यूशन चुनने से घटती है, बदलने से नहीं। टेक्स्ट से भरे पन्नों पर PNG किनारे JPG से बेहतर बचाता है।</p>

  <h3>दस्तावेज़ों के लिए JPG या PNG, कौन बेहतर है?</h3>
  <p>टेक्स्ट और लकीरों के लिए PNG, क्योंकि वह कुछ गँवाए बिना किनारे साफ़ रखता है। फ़ोटो के लिए JPG, क्योंकि वह लगातार रंग बदलने वाली तस्वीरों पर बिना दिखने वाले नुक़सान के कहीं हल्की फ़ाइल बनाता है।</p>

  <h3>कई JPG को सही क्रम में एक PDF में कैसे जोड़ूँ?</h3>
  <p>सारी तस्वीरें एक साथ चढ़ाइए, और फ़ाइल बनाने से पहले झलक में क्रम देखकर ठीक कर लीजिए। नाम के क्रम पर भरोसा मत कीजिए; वर्णक्रम IMG_10 को IMG_2 से पहले रख देता है और पन्ने गड्डमड्ड कर देता है।</p>

  <h3>तस्वीरों से बनाने के बाद मेरी PDF इतनी भारी क्यों है?</h3>
  <p>फ़ोन की तस्वीरें बहुत ऊँचे रेज़ोल्यूशन की होती हैं, इसलिए उनसे बनी PDF भी वही वज़न लिए आती है। तैयार PDF छोटी कर लीजिए, या छपाई वाली गुणवत्ता नहीं चाहिए तो बदलने से पहले तस्वीरों का नाप घटा दीजिए।</p>

  <h3>PDF का सिर्फ़ एक पन्ना तस्वीर बना सकता हूँ?</h3>
  <p>हाँ। बदलने से पहले पन्नों की गिनती तय कर दीजिए, ताकि पूरे दस्तावेज़ के हर पन्ने की तस्वीर बनने के बजाय आपको वही पन्ना मिले जो चाहिए।</p>

  <h2>अभी आज़माइए</h2>

  <p>तस्वीरों की तरफ़ जा रहे हैं? <a href="/hi/pdf-to-jpg/">PDF से JPG टूल</a> खोलिए। दस्तावेज़ की तरफ़ लौट रहे हैं? सब कुछ क्रम में जोड़ने के लिए <a href="/hi/jpg-to-pdf/">JPG से PDF</a> लीजिए, या बाक़ी कामों के लिए <a href="/hi/all-tools/">सभी PDF टूल</a> देख लीजिए।</p>
