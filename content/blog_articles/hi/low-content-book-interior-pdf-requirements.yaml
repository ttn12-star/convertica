content_hi: |
  low-content प्रकाशन इस मायने में अनोखा है कि रचनात्मक हिस्सा अक्सर सबसे आसान निकलता है। लाइन वाला जर्नल एक ग्रिड है, पहेली की किताब एक स्क्रिप्ट का आउटपुट। लोग अपलोड पर अटकते हैं, और अस्वीकृति की सूचना अपनी बात कम ही ठीक से समझाती है।

  अच्छी खबर यह है कि वजहों की सूची छोटी है, यांत्रिक है और अलग-अलग छपाई सेवाओं में एक जैसी है। इन पाँच चीज़ों को सही कर दें और फ़ाइल पास हो जाएगी। नीचे के ठोस आँकड़े लिखने के समय की सबसे बड़ी सेवा की स्पेसिफ़िकेशन के मुताबिक हैं; अपने trim size के लिए हमेशा मौजूदा स्पेक देख लें, क्योंकि इन्हें बदला जाता है।

  <h2>1. पेज का नाप ठीक trim size होना चाहिए</h2>

  <p>यह सबसे आम अस्वीकृति है और सबसे आसानी से टलने वाली। अगर किताब 6 गुणा 9 इंच है, तो PDF का हर पेज 6 गुणा 9 इंच होना चाहिए। US Letter पेजों पर सजाई गई 6 गुणा 9 की किताब अपने-आप लौटा दी जाती है, चाहे सामग्री बीच में 6 गुणा 9 के क्षेत्र में ही बैठी हो।</p>

  <p>पेंच ब्लीड में है। अगर कोई भी तत्व पेज के किनारे तक जाता है, तो ब्लीड चाहिए, और ब्लीड पेज का नाप बदल देता है: ऊपर, नीचे और बाहरी किनारे पर 0.125 इंच जोड़ें। ब्लीड वाला 6 गुणा 9 इंटीरियर 6.125 गुणा 9.25 इंच बन जाता है। ध्यान दें कि भीतरी किनारे को कुछ नहीं जुड़ता, क्योंकि वह किनारा सिला जाता है, काटा नहीं जाता।</p>

  <p>अगर आपका इंटीरियर सादी लाइनें, बिंदु या ऐसा टेक्स्ट है जो किनारे से बहुत पहले रुक जाता है, तो ब्लीड की ज़रूरत ही नहीं, और पेज का नाप सीधे trim size है। ज़्यादातर जर्नल और प्लानर यहीं आते हैं, और इसी से वे आसान मामला बन जाते हैं।</p>

  <p>एक ईमानदार सीमा जानने लायक: तैयार PDF को किताब के trim size में बदलना ऐसा काम नहीं जो पेज-नाप बदलने वाला टूल आपके लिए कर दे। हमारा <a href="/hi/pdf-edit/page-size/">PDF पेज साइज़ बदलने वाला टूल</a> A4, US Letter और Legal संभालता है, यानी दफ़्तरी कागज़ी मानक, न कि 6 गुणा 9 या 8.5 गुणा 11 जैसे trim size जिनकी छपाई सेवा अपेक्षा करती है। किताब के इंटीरियर के लिए पेज का नाप उसी फ़ाइल में तय करें जिसमें आपने डिज़ाइन किया। अगर हाथ में बस गलत नाप की तैयार PDF है, तो आप बदल नहीं रहे, दोबारा बना रहे हैं।</p>

  <h2>2. गटर मार्जिन पेज संख्या के साथ बढ़ना चाहिए</h2>

  <p>भीतरी मार्जिन, वह जो रीढ़ की तरफ़ है, वही शर्त है जिसे लोग भूल जाते हैं, और वही ऐसी किताब देती है जिसमें टेक्स्ट जिल्द में समा जाता है।</p>

  <p>मोटी किताबें रीढ़ पर ज़्यादा मुड़ती हैं, इसलिए भीतरी किनारे को ज़्यादा निगलती हैं। लिहाज़ा शर्त बढ़ती जाती है:</p>

  <table>
    <thead>
      <tr><th>इंटीरियर के पेज</th><th>न्यूनतम भीतरी (गटर) मार्जिन</th></tr>
    </thead>
    <tbody>
      <tr><td>लगभग 150 तक</td><td>0.375 इंच</td></tr>
      <tr><td>लगभग 150 से 300</td><td>0.5 इंच</td></tr>
      <tr><td>लगभग 300 से 500</td><td>0.625 इंच</td></tr>
      <tr><td>लगभग 500 से 700</td><td>0.75 इंच</td></tr>
      <tr><td>लगभग 700 से ज़्यादा</td><td>0.875 इंच</td></tr>
    </tbody>
  </table>

  <p>बाकी तीन किनारे आसान हैं: कम से कम 0.25 इंच, और ब्लीड वाले पेजों पर 0.375 इंच। दोनों को लक्ष्य नहीं, न्यूनतम मानिए। 0.5 इंच बाहरी मार्जिन वाला जर्नल सोचा-समझा लगता है; ठीक 0.25 वाला ऐसा लगता है जो बस किसी तरह पास हुआ।</p>

  <p>चूँकि गटर पक्ष बदलता है, बायाँ और दायाँ पेज एक ही लेआउट नहीं हैं। अगर आपके टूल में दर्पण मार्जिन या आमने-सामने पेज का विकल्प है, इस्तेमाल करें। हर पेज को एक जैसा बनाना ऐसी किताब पाने का पक्का तरीका है जिसके सम पेज ठीक हैं और विषम पेज रीढ़ के पास पढ़े नहीं जाते।</p>

  <h2>3. फ़ॉन्ट एम्बेड होने चाहिए</h2>

  <p>बिना एम्बेड फ़ॉन्ट वाला इंटीरियर या तो लौटा दिया जाता है, या इससे बुरा, बदले हुए टाइप के साथ छपता है जो आपकी सावधानी से सेट की गई स्पेसिंग को दोबारा बहा देता है। यह चुपचाप होने वाली नाकामी है: आपकी मशीन पर फ़ाइल सही दिखती है क्योंकि फ़ॉन्ट वहाँ इंस्टॉल है।</p>

  <p>हर गंभीर एक्सपोर्ट डायलॉग में फ़ॉन्ट एम्बेड करने का विकल्प होता है, और ब्राउज़र वाले टूल यह अपने-आप करते हैं। मान न लें, जाँचें: PDF खोलें, दस्तावेज़ प्रॉपर्टीज़ देखें, फ़ॉन्ट टैब ढूँढें और पक्का करें कि हर प्रविष्टि पर Embedded या Embedded Subset लिखा है। अगर कोई फ़ॉन्ट लाइसेंस की वजह से एम्बेड होने से इनकार करता है, तो उस टेक्स्ट को आउटलाइन में बदल दें।</p>

  <h2>4. पारदर्शिता समतल करनी होगी</h2>

  <p>जीवित पारदर्शिता, छायाएँ, ब्लेंड मोड और आधी-अपारदर्शी लेयर छपाई के चरण पर हैरानियों का आम स्रोत हैं: असर या गायब हो जाता है, या स्लेटी डिब्बे में बदल जाता है। छपाई सेवाएँ इसे समतल मांगती हैं, और अपलोड से पहले समतल कर देना उससे सुरक्षित है कि कन्वर्टर सही अंदाज़ा लगा ले।</p>

  <p><a href="/hi/pdf-edit/flatten/">PDF फ़्लैटन करना</a> लेयर और इंटरैक्टिव तत्वों को स्थिर पेज सामग्री में मिला देता है, साथ ही फ़ॉर्म फ़ील्ड और एनोटेशन हटा देता है जिनकी छपी किताब में जगह नहीं। यह तस्वीरें दोबारा सैंपल नहीं करता, इसलिए छपाई का रिज़ॉल्यूशन प्रभावित नहीं होता। और सख़्त, संग्रह-स्तर के नतीजे के लिए <a href="/hi/pdf-to-pdfa/">PDF/A में बदलना</a> बनावट से ही एम्बेड फ़ॉन्ट और आत्मनिर्भर सामग्री मांगता है, और यह उपयोगी दोहरी जाँच है, तब भी जब सेवा PDF/A अलग से न मांगे। <a href="/hi/blog/what-is-pdf-a-and-how-to-convert/">PDF/A क्या है</a> वाली हमारी नोट बताती है कि मानक क्या गारंटी देता है और क्या नहीं।</p>

  <h2>5. एकल पेज, दो-पेज फैलाव नहीं</h2>

  <p>एक पेज प्रति पेज एक्सपोर्ट करें। दो पेजों का फैलाव एक चौड़े पेज के रूप में निकाला जाए तो वह गलत नाप के एक विशाल पेज की तरह पढ़ा जाता है और लौटा दिया जाता है। यह उन लोगों को पकड़ता है जिन्होंने स्क्रीन पर आमने-सामने पेज दिखने वाले टूल में डिज़ाइन किया: दिखावा फैलाव है, एक्सपोर्ट एकल होना चाहिए।</p>

  <p>यही बात कट मार्क और रजिस्टर मार्क पर लागू होती है। वे व्यावसायिक छपाई के काम की चीज़ें हैं, प्रिंट-ऑन-डिमांड अपलोड की नहीं, और जो सेवा अपने निशानों से काटती है, वह आपके निशानों को खुशी-खुशी सामग्री की तरह छाप देगी।</p>

  <h2>पेज नंबर, और कब छोड़ देना</h2>

  <p>low-content किताबें यहाँ बँट जाती हैं। लाइन वाले जर्नल में आम तौर पर नंबर नहीं होने चाहिए, क्योंकि खरीदार पेज किसी भी क्रम में इस्तेमाल कर सकता है और नंबर दृश्य शोर है। पहेली की किताब, वर्कबुक और जिसमें भी सूची होती है, उसे चाहिए।</p>

  <p>अगर जोड़ते हैं, तो पेजों का क्रम अंतिम होने के बाद <a href="/hi/pdf-edit/add-page-numbers/">पेज नंबर जोड़ें</a> से करें, और ऊपर बताए सुरक्षित मार्जिन के अंदर। कट किनारे से 0.2 इंच पर बैठा नंबर सबसे पहले गायब होता है। यह भी याद रखें कि अगर हर पेज के बाहरी किनारे पर नंबर चाहिए तो जगह बदलनी होगी, और <a href="/hi/blog/add-page-numbers-to-pdf/">नंबरिंग की हमारी गाइड</a> में शुरुआती पेज छोड़ने के लिए ऑफ़सेट हैं।</p>

  <h2>अपलोड से पहले की जाँच</h2>

  <table>
    <thead>
      <tr><th>क्या जाँचें</th><th>कैसे</th></tr>
    </thead>
    <tbody>
      <tr><td>हर पेज ठीक trim size (ब्लीड हो तो जोड़कर)</td><td>PDF खोलकर नाप पढ़ें; पहला, बीच का और आख़िरी पेज मिलाएँ</td></tr>
      <tr><td>गटर मार्जिन पेज संख्या से मेल खाता है</td><td>ऊपर की तालिका से मिलाएँ, बायाँ और दायाँ पेज अलग-अलग देखें</td></tr>
      <tr><td>बाकी मार्जिन कम से कम 0.25 इंच, ब्लीड के साथ 0.375</td><td>कट किनारे से नापें, ब्लीड किनारे से नहीं</td></tr>
      <tr><td>फ़ॉन्ट एम्बेड हैं</td><td>दस्तावेज़ प्रॉपर्टीज़, फ़ॉन्ट टैब, हर जगह Embedded</td></tr>
      <tr><td>कोई जीवित पारदर्शिता, लेयर, फ़ॉर्म फ़ील्ड नहीं</td><td>फ़्लैटन करें, फिर देखें कि क्लिक से कुछ नहीं चुना जाता</td></tr>
      <tr><td>एकल पेज, कोई फैलाव या कट मार्क नहीं</td><td>फ़ाइल स्क्रॉल करें: हर पेज किताब का एक पेज हो</td></tr>
      <tr><td>पेज संख्या सम और सेवा के न्यूनतम से ऊपर</td><td>ज़्यादातर सेवाएँ कम से कम 24 इंटीरियर पेज और सम कुल चाहती हैं</td></tr>
    </tbody>
  </table>

  <p>आख़िरी पंक्ति ज़रूरत से ज़्यादा लोगों को पकड़ती है। छपाई सम पेज संख्या मांगती है क्योंकि पेज शीट में आते हैं, और सेवाएँ एक न्यूनतम तय करती हैं जिससे नीचे किताब सिली नहीं जा सकती। सामग्री काटने के बजाय एक खाली पेज जोड़ें।</p>

  <h2>आप जो फ़ाइल अपलोड करते हैं उसका क्या होता है</h2>

  <p>हमारे टूल सर्वर पर चलते हैं, इसलिए फ़ाइल अपलोड होती है। काम पूरा होते ही वह मिटा दी जाती है, और डाउनलोड लिंक सिर्फ़ आपका है। कुछ भी इंडेक्स, संग्रहित या ट्रेनिंग में इस्तेमाल नहीं होता। अगर पांडुलिपि अप्रकाशित है, तो <a href="/hi/blog/is-convertica-safe-pdf-file-security-privacy-explained/">Convertica आपकी फ़ाइलों के साथ कैसे बरतता है</a> वाली नोट में रखने के नियम लिखे हैं।</p>

  <h2>अक्सर पूछे जाने वाले सवाल</h2>

  <h3>लाइन वाले जर्नल को ब्लीड चाहिए?</h3>
  <p>लगभग कभी नहीं। ब्लीड इसलिए है कि किनारे तक जाने वाला चित्र कटाई में बच जाए, और जिस जर्नल की लाइनें मार्जिन के भीतर ही रुक जाती हैं, उसके किनारे पर बचाने को कुछ नहीं। ब्लीड छोड़ दें, पेज का नाप trim size के बराबर रखें, और आपने गणित की एक पूरी श्रेणी की गलतियाँ हटा दीं।</p>

  <h3>क्या A4 इंटीरियर को 6 गुणा 9 की किताब में बदला जा सकता है?</h3>
  <p>ऐसे नहीं कि अच्छी किताब बने। अनुपात अलग हैं, यानी कुछ न कुछ स्केल या काटना पड़ेगा, और आपके सावधानी से सेट किए मार्जिन गटर की शर्त से मेल खाना बंद कर देंगे। इंटीरियर को डिज़ाइन टूल में trim size पर दोबारा बनाएँ। यही वह एक जगह है जहाँ दोबारा वर्तनी कन्वर्ज़न से लड़ने से सचमुच तेज़ है।</p>

  <h3>पेज संख्या का कौन सा न्यूनतम मानकर चलें?</h3>
  <p>ज़्यादातर प्रिंट-ऑन-डिमांड सेवाएँ कम से कम 24 इंटीरियर पेज चाहती हैं, और सभी सम कुल चाहती हैं। low-content किताबों के लिए यह आसान है, पर जनरेट की गई पहेली के 100 पेजों पर रुकने से पहले उस सेवा की शर्त देख लें, क्योंकि आपका चुना गोल नंबर किसी सीमा से एक पेज नीचे हो सकता है।</p>

  <h3>इंटीरियर PDF/A होना ही चाहिए?</h3>
  <p>आम तौर पर ज़रूरी नहीं, कभी उपयोगी। इंटीरियर को <a href="/hi/pdf-to-pdfa/">PDF/A में बदलने</a> की कीमत यह है कि मानक ठीक उन्हीं चीज़ों को मना करता है जो छपाई में दिक्कत देती हैं: बिना एम्बेड फ़ॉन्ट और फ़ाइल के बाहर किसी चीज़ पर निर्भर सामग्री। इसे जाँच का कदम मानिए, शर्त नहीं।</p>

  <h3>फ़ाइल क्यों लौटा दी गई, जब मुझे तो ठीक लगती है?</h3>
  <p>संभावना के क्रम में: पेज का नाप ठीक trim size नहीं है, गटर पेज संख्या के लिहाज़ से पतला है, फ़ॉन्ट एम्बेड नहीं हैं, या आपने फैलाव एक्सपोर्ट किए। चारों स्क्रीन पर ठीक दिखते हैं, इसीलिए वही आम चार हैं। इसी क्रम में जाँचें।</p>

  <h3>किताब के इंटीरियर में दुकान का नाम या लाइसेंस पेज डालूँ?</h3>
  <p>किताब में कॉपीराइट पेज सामान्य और अपेक्षित है, उस प्रिंटेबल डाउनलोड के उलट जहाँ लाइसेंस पेज ज़्यादा काम करता है। उसे शुरुआती पेजों में रखें और हर पेज पर फ़ुटर न डालें: 120 पेजों पर दुकान के पते वाली छपी किताब टेम्प्लेट जैसी पढ़ी जाती है, और यही वह छाप है जिससे low-content प्रकाशक को बचना चाहिए।</p>

  <h2>इंटीरियर तैयार करें</h2>

  <p>कुछ भी बनाने से पहले डिज़ाइन टूल में पेज का नाप तय करें, दर्पण मार्जिन चालू करें, फिर एक्सपोर्ट को <a href="/hi/pdf-edit/flatten/">फ़्लैटन</a> करें और फ़ॉन्ट टैब देखें। सख़्त जाँच चाहिए तो उसे <a href="/hi/pdf-to-pdfa/">PDF/A</a> से गुज़ारें और देखें कि शिकायत आती है या नहीं। अगर किताबों के साथ प्रिंटेबल भी बेचते हैं, तो हमारी गाइड <a href="/hi/blog/sell-printable-pdf-on-etsy/">बेचने के लिए प्रिंटेबल PDF कैसे तैयार करें</a> और <a href="/hi/blog/stop-buyers-editing-reselling-your-pdf/">फ़ाइल सुरक्षा असल में क्या देती है</a> वाली नोट वह पक्ष संभालती हैं। बाकी सब <a href="/hi/all-tools/">सभी टूल</a> में है।</p>
