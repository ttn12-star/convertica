content_hi: |
  प्रकाशित करने का बटन दबाने से ठीक पहले एक पल आता है जब सब कुछ पूरा लगता है। डिज़ाइन तैयार, फ़ाइल जाँची हुई, मॉकअप बने हुए। गलती पकड़ने का यह सबसे सस्ता पल है, और सबसे ज़्यादा छोड़ा जाने वाला।

  नीचे की जाँचें जानबूझकर फ़ाइल को नहीं छूतीं। पेज का नाप, रिज़ॉल्यूशन, एम्बेड फ़ॉन्ट और वज़न हमारी गाइड <a href="/hi/blog/sell-printable-pdf-on-etsy/">बेचने के लिए प्रिंटेबल PDF कैसे तैयार करें</a> में हैं, और अगर आपका प्रोडक्ट दो कागज़ी मानकों में जाता है, तो <a href="/hi/blog/a4-vs-us-letter-printable-sizes/">A4 और US Letter का फ़ैसला</a> भी वहीं है। मान लेते हैं वह काम हो चुका। आगे वह सब है जो फ़ाइल के चारों तरफ़ है, और बचे हुए रिफंड वहीं रहते हैं।

  <h2>1. बंडल उसी तरह खोलिए जैसे खरीदार खोलेगा</h2>

  <p>अपने डेस्कटॉप का फ़ोल्डर नहीं। ठीक वही जो दिया जाता है। अगर प्लैटफ़ॉर्म प्रीव्यू देता है तो वहाँ से डाउनलोड करें, या ज़िप को अपने ही ईमेल पर भेजकर ईमेल से खोलें।</p>

  <ul>
    <li><strong>फ़ोन पर।</strong> खरीदारों का बड़ा हिस्सा डाउनलोड पहले फ़ोन पर खोलता है, और फ़ोन पर ज़िप उससे बुरा अनुभव है जितना आपको याद है। अगर फ़ोन से आपकी फ़ाइल तक दो टैप में नहीं पहुँचा जा सकता, तो संदेशों की तैयारी रखें।</li>
    <li><strong>फ़ोल्डर की बनावट के बिना।</strong> बहुत लोग सब कुछ एक ही डायरेक्टरी में निकाल लेते हैं। अगर आपकी फ़ाइलें सिर्फ़ फ़ोल्डर के नाम से अलग थीं, तो अब वे अलग नहीं हैं।</li>
    <li><strong>अपने फ़ॉन्ट के बिना।</strong> किसी और का डिवाइस ही एम्बेड फ़ॉन्ट की असली जाँच है, और उसकी कीमत किसी दोस्त को एक संदेश है।</li>
  </ul>

  <h2>2. फ़ाइलों के नाम रखिए, फ़ोल्डरों के नहीं</h2>

  <p>हर फ़ाइल नाम संदर्भ के बाहर, छह महीने बाद, चार सौ और चीज़ों वाली डाउनलोड डायरेक्टरी में भी समझ आना चाहिए। यानी: प्रोडक्ट, वेरिएंट, और बस।</p>

  <p>अच्छा: <code>weekly-planner-A4-portrait.pdf</code>। बुरा: <code>final_v3.pdf</code>, <code>Untitled-1.pdf</code>, या ऐसा नाम जिसमें आपके भीतरी रिवीज़न नंबर हों। ऐसे अक्षरों से बचें जो सिस्टमों के बीच बदमाशी करते हैं, छोटे अक्षर रखें और स्पेस की जगह हाइफ़न। <a href="/hi/blog/pdf-naming-conventions-best-practices/">फ़ाइल नाम रखने के तरीके</a> वाली हमारी नोट दस्तावेज़ों के लिए लिखी है, पर नियम वही हैं।</p>

  <h2>3. अंदर दो अतिरिक्त पेज रखिए</h2>

  <p>दो पेज जो आपको कुछ नहीं पड़ते और सपोर्ट के ज़्यादातर संदेश हटा देते हैं:</p>

  <ul>
    <li><strong>लाइसेंस पेज।</strong> सरल भाषा, एक पेज: खरीदार क्या कर सकता है, क्या नहीं, व्यावसायिक उपयोग शामिल है या नहीं, और आपसे संपर्क कैसे करें। <a href="/hi/blog/stop-buyers-editing-reselling-your-pdf/">फ़ाइल सुरक्षा असल में क्या देती है</a> वाली नोट बताती है कि यह पेज किसी भी तकनीकी उपाय से ज़्यादा काम करता है।</li>
    <li><strong>छपाई का एक पेज।</strong> 100 प्रतिशत पर, असली नाप में, स्केलिंग बंद करके छापें। कौन सा कागज़। कौन से पेज वैकल्पिक। यही एक पेज सबसे आम शिकायत हटा देता है: सही फ़ाइल, गलत स्केल में छपी।</li>
  </ul>

  <p>दोनों छोटे रखें। पाँच डॉलर के प्लानर में दस पेज की शर्तें चेतावनी की तरह पढ़ी जाती हैं।</p>

  <h2>4. जाँचिए कि लिस्टिंग सच बोलती है</h2>

  <p>अपना विवरण विरोधी की तरह पढ़िए। उसमें हर संख्या और हर संज्ञा एक वादा है:</p>

  <table>
    <thead>
      <tr><th>अगर लिस्टिंग कहती है</th><th>जाँचिए</th></tr>
    </thead>
    <tbody>
      <tr><td>"12 पेज"</td><td>फ़ाइल खोलकर गिनें। कवर और लाइसेंस पेज संख्या बदल देते हैं</td></tr>
      <tr><td>"A4 और US Letter शामिल"</td><td>दोनों फ़ाइलें असल में बंडल में हैं, और दोनों उसी नाप की हैं जिसका दावा है</td></tr>
      <tr><td>"एडिट किया जा सकता है"</td><td>उस टूल में एडिट होता है जो खरीदार के पास है, सिर्फ़ आपके पास नहीं</td></tr>
      <tr><td>"तुरंत डाउनलोड"</td><td>प्लैटफ़ॉर्म इस तरह की लिस्टिंग के लिए सचमुच तुरंत देता है</td></tr>
      <tr><td>"व्यावसायिक उपयोग की अनुमति"</td><td>फ़ाइल के अंदर लाइसेंस पेज भी वही कहता है</td></tr>
      <tr><td>"300 dpi"</td><td>तस्वीरें सचमुच वैसी हैं, अंतिम प्रिंट नाप पर</td></tr>
    </tbody>
  </table>

  <p>आख़िरी पंक्ति एक पल की हकदार है। जब मूल तस्वीर खींचकर बढ़ाई गई हो, तब 300 dpi का दावा वैसा ठोस और जाँचने योग्य वादा है जो सबसे गुस्सैल रिव्यू देता है, क्योंकि खरीदार उसे जाँच सकता है और आप बहस नहीं कर सकते।</p>

  <h2>5. फ़ाइल को चुपचाप एक वर्ज़न दीजिए</h2>

  <p>वर्ज़न का छोटा निशान कहीं अगोचर जगह रखें: फ़ाइल के मेटाडेटा में या लाइसेंस पेज पर छोटे कद में। फ़ाइल के नाम में नहीं, जहाँ वह अधूरा लगता है।</p>

  <p>पचासवीं बिक्री के बाद आपको गलती मिलेगी। तब वर्ज़न नंबर बताएगा कि शिकायत करने वाले खरीदार के पास पुरानी फ़ाइल है या नहीं, आपको बताने देगा कि क्या बदला, और यह सोचने से बचाएगा कि आपकी डिस्क पर कौन सी कॉपी है। तीस सेकंड का काम, जो ठीक एक बार और महँगे तरीके से वसूल हो जाता है।</p>

  <h2>6. आख़िरी यांत्रिक चक्कर लगाइए</h2>

  <p>छोटा, और हर बिंदु कुछ असली पकड़ता है:</p>

  <ul>
    <li><strong>जो देना है उसे फ़्लैटन कीजिए।</strong> <a href="/hi/pdf-edit/flatten/">फ़्लैटन</a> उन लेयर और आवारा फ़ॉर्म फ़ील्ड को हटाता है जिन्हें खरीदार खिसका सकता है, और फ़ाइल जल्दी खुलती है। यह सिर्फ़ तब छोड़ें जब प्रोडक्ट भरने के लिए है।</li>
    <li><strong>पेजों का क्रम और नंबरिंग जाँचिए।</strong> कई पेज का सेट है तो <a href="/hi/pdf-edit/add-page-numbers/">नंबरिंग</a> सबसे आख़िर में, क्रम फ़ाइनल होने के बाद।</li>
    <li><strong>वज़न को प्लैटफ़ॉर्म की सीमा से मिलाइए</strong> हर फ़ाइल का, बंडल का नहीं, और <a href="/hi/pdf-organize/compress/">कंप्रेस</a> सिर्फ़ मजबूरी में।</li>
    <li><strong>वह मेटाडेटा हटाइए जो भेजने का इरादा नहीं था।</strong> एक्सपोर्ट के लेखक और सॉफ़्टवेयर फ़ील्ड अक्सर आपका असली नाम या किसी असंबंधित क्लाइंट के प्रोजेक्ट का नाम ढोते हैं।</li>
    <li><strong>एक बार फिर पूरा खोलिए।</strong> सरसरी नज़र नहीं। सातवें स्थान पर छूटा खाली पेज अब ढूँढना रिव्यू में मिलने से आसान है।</li>
  </ul>

  <h2>7. पहली बिक्रियों के बाद</h2>

  <p>प्रकाशन जाँच का अंत नहीं। पहले हफ़्ते में दो चीज़ें करने लायक:</p>

  <ul>
    <li><strong>अपना ही प्रोडक्ट खरीदिए</strong>, अगर प्लैटफ़ॉर्म देता है, या किसी से कहिए। भुगतान से खुली फ़ाइल तक का पूरा रास्ता वही एक जाँच है जो खुद प्लैटफ़ॉर्म का बरताव ढकती है, जो आपके नियंत्रण में नहीं और जो बदलता रहता है।</li>
    <li><strong>पहले सवालों को बग-रिपोर्ट की तरह पढ़िए।</strong> खरीदारों के पहले तीन संदेश ठीक-ठीक बता देंगे कि आपकी लिस्टिंग या निर्देश का कौन सा हिस्सा अस्पष्ट है। लिस्टिंग सुधारिए, वही सवाल हमेशा जवाब देते न रहिए।</li>
  </ul>

  <h2>पूरा दरवाज़ा एक तालिका में</h2>

  <table>
    <thead>
      <tr><th>जाँच</th><th>क्या पकड़ती है</th></tr>
    </thead>
    <tbody>
      <tr><td>दिया गया बंडल फ़ोन पर खोलना</td><td>ज़िप की अड़चन, न खुलने वाली फ़ाइलें, गायब हिस्से</td></tr>
      <tr><td>सब कुछ एक फ़ोल्डर में निकालना</td><td>वे नाम जो सिर्फ़ फ़ोल्डर के अंदर काम करते थे</td></tr>
      <tr><td>अपने फ़ॉन्ट के बिना डिवाइस पर खोलना</td><td>बिना एम्बेड फ़ॉन्ट, बिगड़ी वर्तनी</td></tr>
      <tr><td>अंदर लाइसेंस पेज और छपाई निर्देश</td><td>सपोर्ट के ज़्यादातर संदेश और लाइसेंस विवाद</td></tr>
      <tr><td>लिस्टिंग का हर दावा फ़ाइल से मिलाया</td><td>वे रिव्यू जिनसे बहस नहीं की जा सकती</td></tr>
      <tr><td>वर्ज़न का निशान दर्ज</td><td>यह न जानना कि खरीदार के पास कौन सी कॉपी है</td></tr>
      <tr><td>फ़्लैटन, क्रम, नंबर, सीमा के भीतर वज़न</td><td>आकस्मिक बदलाव, अपलोड की अस्वीकृति</td></tr>
      <tr><td>मेटाडेटा साफ़</td><td>अपना असली नाम या क्लाइंट का प्रोजेक्ट भेज देना</td></tr>
      <tr><td>फ़ाइल शुरू से आख़िर तक पढ़ी</td><td>खाली पेज, दोहरा पेज, शीर्षक की अशुद्धि</td></tr>
    </tbody>
  </table>

  <h2>आप जो फ़ाइल अपलोड करते हैं उसका क्या होता है</h2>

  <p>हमारे टूल सर्वर पर चलते हैं, इसलिए फ़ाइल अपलोड होती है। काम पूरा होते ही वह मिटा दी जाती है, और डाउनलोड लिंक सिर्फ़ आपका है। कुछ भी इंडेक्स, संग्रहित या ट्रेनिंग में इस्तेमाल नहीं होता। बिना लॉन्च हुए प्रोडक्ट के लिए <a href="/hi/blog/is-convertica-safe-pdf-file-security-privacy-explained/">Convertica आपकी फ़ाइलों के साथ कैसे बरतता है</a> वाली नोट में रखने के नियम हैं।</p>

  <h2>अक्सर पूछे जाने वाले सवाल</h2>

  <h3>इसमें कितना समय लगना चाहिए?</h3>
  <p>एक फ़ाइल वाले प्रोडक्ट के लिए बीस मिनट, कई नापों वाले बंडल के लिए एक घंटे के करीब। पूरे काम में ये सचमुच सबसे सस्ते बीस मिनट हैं, क्योंकि सूची का हर बिंदु प्रकाशन के बाद ठीक करने पर कई गुना पड़ता है।</p>

  <h3>सस्ते प्रिंटेबल में भी लाइसेंस पेज ज़रूरी है?</h3>
  <p>हाँ, और सस्ते में तो ज़्यादा। कम कीमत के प्रोडक्ट लापरवाही से खरीदे और लापरवाही से दोबारा इस्तेमाल किए जाते हैं, ज़्यादातर उन लोगों से जो पक्का नहीं जानते कि उन्हें क्या करने की अनुमति है। सरल भाषा का एक पेज वह अनिश्चितता हटा देता है, और यही वह दस्तावेज़ है जिस पर आप कभी कॉपी की शिकायत करते समय उँगली रखेंगे।</p>

  <h3>वर्ज़न नंबर खरीदार को दिखना चाहिए?</h3>
  <p>बस थोड़ा। लाइसेंस पेज पर छोटे कद में या फ़ाइल के मेटाडेटा में ठीक है। फ़ाइल के नाम या कवर पर वर्ज़न तैयार प्रोडक्ट को कच्चा दिखाता है और यह सवाल बुलाता है कि पहले वर्ज़न में क्या गलत था।</p>

  <h3>बिक्री शुरू होने के बाद गलती मिली तो क्या करूँ?</h3>
  <p>फ़ाइल ठीक करें, वर्ज़न बढ़ाएँ, प्लैटफ़ॉर्म पर बदलें, और अगर गलती इस्तेमाल पर असर डालती है, न कि सिर्फ़ दिखने पर, तो खरीदारों को लिखें। ज़्यादातर प्लैटफ़ॉर्म डिजिटल फ़ाइल वहीं अपडेट करने देते हैं, और जिन खरीदारों को बिना मांगे सुधरी प्रति मिलती है, वे उनसे बेहतर रिव्यू देते हैं जिन्होंने समस्या ही नहीं देखी।</p>

  <h3>अपना प्रोडक्ट खरीदना सार्थक है?</h3>
  <p>हर प्रोडक्ट प्रकार पर एक बार, हाँ। आप अपनी फ़ाइल नहीं, प्लैटफ़ॉर्म जाँच रहे हैं: रसीद का ईमेल, लिंक की समय-सीमा, फ़ाइल उसी नाम से आती है या नहीं। वह रास्ता ऐसे टूटता है जो विक्रेता के डैशबोर्ड से कभी नहीं दिखेगा।</p>

  <h3>मेटाडेटा से कितना हटाना चाहिए?</h3>
  <p>लेखक, शीर्षक और कोई भी सॉफ़्टवेयर या टेम्प्लेट फ़ील्ड। एक्सपोर्ट अक्सर उस टेम्प्लेट का नाम ढोता है जो आपने खरीदा, पिछले क्लाइंट के प्रोजेक्ट का नाम, या दुकान के नाम से बेचते समय आपका कानूनी नाम। इनमें से कोई मदद नहीं करता, और एक तो सचमुच शर्मिंदा कर सकता है।</p>

  <h2>दरवाज़ा पार कीजिए</h2>

  <p>जो प्रोडक्ट प्रकाशित करने वाले थे, उस पर एक से छह बिंदु अभी, क्रम से कीजिए। ज़्यादातर फ़ाइलों को <a href="/hi/pdf-edit/flatten/">फ़्लैटन</a> चाहिए और बस; काम आम तौर पर बंडल और लिस्टिंग मांगते हैं। अगर आपका प्रोडक्ट किताब का इंटीरियर है, प्रिंटेबल नहीं, तो शर्तें अलग और सख़्त हैं: देखिए <a href="/hi/blog/low-content-book-interior-pdf-requirements/">low-content किताब का इंटीरियर कैसा होना चाहिए</a>। बाकी सब <a href="/hi/all-tools/">सभी टूल</a> में है।</p>
