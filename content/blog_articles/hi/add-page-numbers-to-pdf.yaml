slug: add-page-numbers-to-pdf
title_hi: "PDF में पन्ना संख्या कैसे डालें (और कवर पन्ना कैसे छोड़ें)"
meta_title_hi: "PDF में पन्ना संख्या डालें, मुफ़्त | Convertica"
meta_description_hi: "किसी भी PDF में सेकंडों में पन्ना संख्या डालिए: जगह और रूप चुनिए, किसी भी संख्या से शुरू कीजिए, और कवर पन्ना छोड़कर गिनती सही जगह से शुरू कीजिए।"
meta_keywords_hi: "PDF में पन्ना संख्या डालें, PDF के पन्ने गिनें, PDF पन्ना नंबर, bates numbering, पन्ना संख्या मुफ़्त, कवर पन्ना छोड़ें"
excerpt_hi: "पन्ना संख्या तब तक मामूली लगती है, जब तक आप पाँच दस्तावेज़ों को साठ पन्नों के एक पुलिंदे में जोड़ न दें, जिसमें किसी चीज़ का हवाला देने का कोई तरीक़ा ही न हो। उन्हें साफ़-सुथरे ढंग से डालने का, और गिनती कवर के बाद शुरू करने का तरीक़ा।"
content_hi: |
  आप एक आवेदन के लिए चिट्ठी, सीवी और तीन सहायक काग़ज़ों को एक PDF में जोड़ते हैं, भेज देते हैं, और सामने से जवाब आता है: बजट का ज़िक्र कहाँ किया है? इशारा करने के लिए कोई पन्ना संख्या ही नहीं है। पन्ना संख्या सजावट की मामूली बात लगती है, ठीक उस पल तक जब किसी को लंबे दस्तावेज़ में एक ख़ास पन्ना बताना पड़े, और तब उसकी कमी वाक़ई खलती है।

  किसी बनी हुई PDF में इसे डालने में करीब बीस सेकंड लगते हैं। सोचने लायक बस तीन बातें हैं: संख्या कहाँ आए, किस रूप में आए, और कवर पन्ना गिना जाए या नहीं। यह गाइड तीनों बताती है, साथ में कानूनी दुनिया का रूप (Bates numbering) और वह जुड़े पुलिंदे वाला मामला, जहाँ पन्ना संख्या सबसे ज़्यादा काम आती है।

  <figure><img src="/static/blog/images/tool-page-numbers-hero.jpg" alt="Convertica का पन्ना संख्या डालने वाला टूल, फ़ाइल अपलोड की जगह के साथ" width="1280" height="800" loading="lazy"></figure>

  <h2>PDF बन जाने के बाद संख्या क्यों डालें</h2>

  अगर दस्तावेज़ आपने Word या Google Docs में लिखा है, तो संख्या वहीं डाल सकते थे। पर गिनती की ज़्यादातर दिक्क़तें वहाँ से नहीं आतीं। वे उन PDF से आती हैं जो आपने लिखी नहीं हैं या जिन्हें आसानी से दोबारा नहीं बदला जा सकता:

  <ul>
    <li>वह पुलिंदा जो आपने <a href="/hi/pdf-organize/merge/">कई फ़ाइलों से जोड़ा</a>, जिसमें हर फ़ाइल की अपनी गिनती थी या कोई नहीं थी।</li>
    <li>स्कैन किया दस्तावेज़, जो सिर्फ़ PDF के रूप में मौजूद है।</li>
    <li>वह फ़ाइल जो किसी और ने भेजी है और मीटिंग से पहले उसमें एक जैसे हवाले चाहिए।</li>
  </ul>

  इन सबमें मूल फ़ाइल दोबारा बदलना मुमकिन नहीं, इसलिए आप तैयार PDF पर संख्या छाप देते हैं। पन्ना संख्या वाला टूल ठीक यही करता है, वह पन्ने की सामग्री को छुए बिना हाशिये में एक परत जोड़ देता है।

  <h2>कदम-दर-कदम: PDF पर संख्या डालना</h2>

  <figure><img src="/static/blog/images/tool-page-numbers-options.jpg" alt="पन्ना संख्या के विकल्प: जगह, रूप और शुरुआती संख्या" width="1280" height="800" loading="lazy"></figure>

  <a href="/hi/pdf-edit/add-page-numbers/">ऑनलाइन पन्ना संख्या डालने</a> के लिए:

  <ol>
    <li>PDF अपलोड कीजिए। झलक में दिख जाता है कि संख्या कहाँ आएगी।</li>
    <li>जगह चुनिए। नीचे बीच में सुरक्षित दस्तूर है; नीचे दाईं तरफ़ उन दस्तावेज़ों पर जँचता है जिनकी जिल्द बाईं तरफ़ बँधेगी।</li>
    <li>रूप चुनिए। सादा 1 सबसे साफ़ है; बीस में से पहला पन्ना पढ़ने वाले को बताता है कि कितना बचा है; 1/20 बीच का छोटा रास्ता है।</li>
    <li>शुरुआती संख्या और वह पहला पन्ना तय कीजिए जिस पर संख्या छपेगी (नीचे देखिए)।</li>
    <li>लागू कीजिए और डाउनलोड कर लीजिए। एक बार नीचे तक देख लीजिए कि संख्या पहले से मौजूद टेक्स्ट से टकरा नहीं रही।</li>
  </ol>

  <h2>कवर पन्ने का सवाल</h2>

  सबसे आम ग़लती कवर पर भी संख्या डाल देना है। शीर्षक के पन्ने या विषय-सूची पर आम तौर पर 1 नहीं दिखना चाहिए, गिनती पहले असली पन्ने से शुरू होनी चाहिए। टूल इसे दो अलग सेटिंग से सँभालते हैं, जिन्हें लोग अक्सर एक समझ लेते हैं:

  <ul>
    <li><strong>पहला पन्ना जिस पर संख्या छपे</strong>, यह टूल को बताता है कि पहले पन्ने (कवर) पर कुछ न छापे और दूसरे पन्ने से शुरू करे।</li>
    <li><strong>शुरुआती संख्या</strong>, यह टूल को बताता है कि पहली बार कौन सा अंक छापना है। इसे 1 रखिए, ताकि पहला असली पन्ना 1 पढ़े, 2 नहीं।</li>
  </ul>

  <blockquote class="callout">बिना संख्या वाला कवर और 1 से शुरू होने वाली सामग्री पाने के लिए: पहला पन्ना छोड़िए, और शुरुआती संख्या 1 रखिए। दोनों बदलिए, सिर्फ़ एक बदलने की वजह से ही लोगों की सामग्री 2 से शुरू हो जाती है।</blockquote>

  यही बात उन दस्तावेज़ों पर भी लागू है जिनमें शुरू के कई पन्ने भूमिका के हैं। एक कवर और दो पन्नों की विषय-सूची वाली रिपोर्ट पहले तीन पन्ने छोड़ सकती है और छपी गिनती चौथे पन्ने पर 1 से शुरू कर सकती है।

  <h2>कानूनी काग़ज़ों की Bates numbering</h2>

  वकीलों के दफ़्तर इसका सख़्त रूप इस्तेमाल करते हैं, जिसे Bates numbering कहते हैं, यानी पूरे सेट के हर पन्ने पर एक अलग, क्रम वाला पहचान अंक, अक्सर आगे एक शब्द के साथ, जैसे <code>SHARMA-000123</code>. यह इसलिए है कि अदालत में सौंपे गए हज़ारों पन्नों में से किसी एक पन्ने का हवाला बिना उलझन दिया जा सके। अगर आप अनुलग्नक या अदालत का सेट तैयार कर रहे हैं, तो आगे शब्द जोड़ने और तय चौड़ाई की संख्या (आगे शून्य) वाला विकल्प देखिए, ताकि पहचान अंक साफ़ क्रम में लगें। रोज़मर्रा के काग़ज़ों में सादी गिनती ही चाहिए।

  <h2>जुड़े पुलिंदे पर संख्या डालना</h2>

  पन्ना संख्या अपनी कीमत सबसे ज़्यादा जुड़े दस्तावेज़ों पर वसूल करती है। क्रम मायने रखता है: <strong>पहले जोड़िए, फिर संख्या डालिए</strong>। अगर आपने अलग-अलग फ़ाइलों पर संख्या डालकर उन्हें जोड़ा, तो एक ही पुलिंदे में तीन बार पहला पन्ना मिलेगा। जोड़ने के बाद संख्या डालने से पूरा दस्तावेज़ शुरू से आख़िर तक एक ही लगातार गिनती लिए रहता है।

  अगर बाद में कोई पन्ना जोड़ें या हटाएँ, तो छपी संख्याएँ सुधारने के बजाय गिनती दोबारा चला दीजिए। टूल पूरी फ़ाइल एक जैसी गिन देगा, जबकि हाथ से सुधारने पर बीच में एक ख़ाली जगह रह जाती है।

  <h2>संख्या पढ़ने लायक रखना</h2>

  <ul>
    <li><strong>हाशिये का ध्यान रखिए।</strong> दस्तावेज़ में नीचे पहले से कुछ लिखा है, तो संख्या किसी कोने में रखिए, ताकि दोनों एक-दूसरे पर न चढ़ें।</li>
    <li><strong>रंग-रूप मिलाइए।</strong> मूल टेक्स्ट के रंग में छोटा, सादा फ़ॉन्ट सोचा-समझा लगता है; बड़ा मोटा अंक ऊपर से चिपकाया हुआ लगता है।</li>
    <li><strong>आड़े पन्ने जाँच लीजिए।</strong> मिली-जुली दिशा वाली फ़ाइल में देख लीजिए कि घूमे पन्नों पर भी संख्या ठीक जगह बैठ रही है।</li>
    <li><strong>जिल्द के लिए जगह छोड़िए।</strong> दस्तावेज़ छपकर बँधेगा, तो संख्या बँधने वाले किनारे से दूर रखिए।</li>
  </ul>

  <h2>अक्सर पूछे जाने वाले सवाल</h2>

  <h3>PDF में पन्ना संख्या मुफ़्त में कैसे डालूँ?</h3>
  <p>फ़ाइल पन्ना संख्या वाले टूल पर चढ़ाइए, जगह और रूप चुनिए, शुरुआती संख्या तय कीजिए, और डाउनलोड कर लीजिए। यह पन्ने की सामग्री बदले बिना हाशिये में एक परत जोड़ता है, और इसके लिए न सॉफ़्टवेयर चाहिए, न खाता।</p>

  <h3>कवर पन्ने के बाद गिनती कैसे शुरू करूँ?</h3>
  <p>पहला पन्ना जिस पर संख्या छपे, उसे दूसरा पन्ना कर दीजिए, ताकि कवर ख़ाली रहे, और शुरुआती संख्या 1 रखिए, ताकि पहला असली पन्ना 1 पढ़े। दोनों सेटिंग बदलिए; सिर्फ़ एक बदलने से सामग्री 2 से शुरू रह जाती है।</p>

  <h3>सिर्फ़ 1 के बजाय बीस में से पहला पन्ना दिखा सकता हूँ?</h3>
  <p>हाँ। ज़्यादातर टूल में कुल पन्नों वाली गिनती का रूप भी होता है। लंबे दस्तावेज़ों में यह काम का है, क्योंकि पढ़ने वाले को पता रहता है कि कितना बचा है।</p>

  <h3>फ़ाइलें जोड़ने से पहले संख्या डालूँ या बाद में?</h3>
  <p>बाद में। पहले दस्तावेज़ों को एक PDF में जोड़िए, फिर जुड़ी फ़ाइल पर संख्या डालिए, ताकि गिनती एक ही लगातार क्रम में रहे। जोड़ने से पहले संख्या डालने पर कई बार पहला पन्ना बन जाता है।</p>

  <h3>Bates numbering क्या है?</h3>
  <p>यह कानूनी काम में चलने वाला तरीक़ा है, जो पूरे सेट के हर पन्ने पर एक अलग, क्रम वाला पहचान अंक छापता है, अक्सर आगे एक शब्द और शून्य के साथ, जैसे SHARMA-000123, ताकि किसी भी पन्ने का हवाला बिना उलझन दिया जा सके। इसके लिए आगे शब्द जोड़ने और तय चौड़ाई वाला टूल लीजिए।</p>

  <h2>अभी आज़माइए</h2>

  <p><a href="/hi/pdf-edit/add-page-numbers/">पन्ना संख्या वाला टूल</a> खोलिए, जगह और शुरुआती पन्ना तय कीजिए, और सेकंडों में साफ़ गिनती छाप दीजिए। पहले पुलिंदा बना रहे हैं? <a href="/hi/pdf-organize/merge/">फ़ाइलें जोड़िए</a>, फिर संख्या डालिए, या <a href="/hi/all-tools/">सभी PDF टूल</a> देख लीजिए।</p>
