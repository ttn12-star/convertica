excerpt_hi: "कोई आपको iPhone से तस्वीर भेजता है और Windows उसे खोल ही नहीं पाता। फ़ाइल HEIC है, यानी Apple का जगह बचाने वाला फ़ॉर्मैट। वह क्या है, और उसे हर जगह खुलने वाली JPG में बदलने के सबसे तेज़ तरीक़े।"
content_hi: |
  कोई आपको छुट्टियों की तस्वीरें भेजता है, या आप iPhone से Windows लैपटॉप पर तस्वीरें ले आते हैं, और फ़ाइलें खुलने से मना कर देती हैं। नाम के आख़िर में <strong>.heic</strong> लगा है, झलक ख़ाली है, और तस्वीर देखने वाला ऐप कोई कोडेक ख़रीदने का सुझाव दे रहा है। कुछ टूटा नहीं है, आपका सामना बस Apple के फ़ॉर्मैट से हुआ है। यह गाइड बताती है कि HEIC क्या है, आपका iPhone उसे क्यों इस्तेमाल करता है, और उससे आम JPG निकालने के तीन काम के तरीक़े।

  <h2>HEIC क्या है, और iPhone उसे क्यों लेता है</h2>

  <p>HEIC (High Efficiency Image Container, जो HEIF मानक पर बना है) 2017 में iOS 11 के बाद से iPhone के कैमरे का पहले से चुना फ़ॉर्मैट है। Apple ने उसे एक वजह से चुना: उसी दिखने वाली गुणवत्ता पर HEIC तस्वीर JPG से लगभग आधी जगह लेती है। हज़ारों तस्वीरों वाले फ़ोन में यह बहुत बड़ी बचत है, और इसीलिए आपका फ़ोन HEIC में खींचता है, जब तक आप उसे कुछ और न कहें।</p>

  <p>दिक्क़त हर जगह चलने की है। JPG तीस साल से हर जगह है; HEIC नहीं। Windows को उसे खोलने के लिए पैसे वाले कोडेक चाहिए, पुराने Android फ़ोन लड़खड़ाते हैं, कई वेबसाइट और सरकारी पोर्टल उसे चढ़ाने ही नहीं देते, और छपाई की ज़्यादातर मशीनों ने उसका नाम भी नहीं सुना।</p>

  <h2>तरीक़ा 1: ऑनलाइन बदलिए (जो फ़ाइलें पहले से पड़ी हैं)</h2>

  <figure><img src="/static/blog/images/tool-heic-to-jpg-hero.jpg" alt="Convertica के HEIC से JPG कन्वर्टर का अपलोड पन्ना" width="1280" height="800" loading="lazy"></figure>

  <p>जब HEIC फ़ाइल पहले से आपके कंप्यूटर पर है, ईमेल से आई हो, फ़ोन से लाई हो, या क्लाउड से उतारी हो, तो ब्राउज़र में बदल लेना सबसे छोटा रास्ता है:</p>

  <ol>
    <li><a href="/hi/image/heic-to-jpg/">HEIC से JPG</a> कन्वर्टर खोलिए और अपनी .heic या .heif फ़ाइल चढ़ा दीजिए (25 MB तक)।</li>
    <li>नतीजा चुनिए: हर जगह चलने के लिए <strong>JPG</strong>, कुछ गँवाए बिना चाहिए तो <strong>PNG</strong>, या तस्वीर को दस्तावेज़ की तरह भेजना है तो <strong>PDF</strong>।</li>
    <li>बनी फ़ाइल डाउनलोड कर लीजिए। वह Windows के किसी भी वर्शन में, हर दफ़्तरी सॉफ़्टवेयर में खुलती है, और कहीं भी चढ़ जाती है।</li>
  </ol>

  <figure><img src="/static/blog/images/tool-heic-to-jpg-options.jpg" alt="HEIC से JPG कन्वर्टर में नतीजे के फ़ॉर्मैट के विकल्प" width="1280" height="800" loading="lazy"></figure>

  <p>एक-एक तस्वीर बदलना मुफ़्त है, बिना रजिस्ट्रेशन, एक रोज़ की हद के साथ, और प्रीमियम वाले एक बार में दस HEIC तस्वीरें बदल सकते हैं, जो पूरा एल्बम JPG बनाने में काम आता है। और अगर आप चाहते हैं कि HEIC फ़ाइलें बनें ही नहीं, तो नीचे के दो तरीक़े इसे iPhone पर ही हल कर देते हैं।</p>

  <h2>तरीक़ा 2: iPhone से कहिए कि JPG में खींचे (मुफ़्त, आगे की तस्वीरों के लिए)</h2>

  <p>अगर HEIC बार-बार रास्ता रोकता है, तो फ़ोन में ही कैमरे का फ़ॉर्मैट बदल दीजिए:</p>

  <ol>
    <li><strong>सेटिंग्स</strong> खोलिए और <strong>कैमरा</strong> पर जाइए।</li>
    <li><strong>फ़ॉर्मैट्स</strong> दबाइए।</li>
    <li>High Efficiency की जगह <strong>सबसे संगत (Most Compatible)</strong> चुन लीजिए।</li>
  </ol>

  <p>अब से कैमरा सीधे JPG सहेजेगा। कीमत साफ़ है: तस्वीरें लगभग दुगनी जगह लेंगी, और नए iPhone पर 48 मेगापिक्सल वाले कुछ ढंग सीमित हो सकते हैं। बहुत लोग जगह बचाने के लिए HEIC चालू ही रखते हैं और सिर्फ़ तब एक-दो तस्वीरें बदलते हैं जब कहीं JPG माँगी जाए।</p>

  <h2>तरीक़ा 3: iPhone की अपनी तरकीब (मुफ़्त, एक बार में एक तस्वीर)</h2>

  <p>iOS की दो चुपचाप चलने वाली आदतें पूरा बदलना ही बचा सकती हैं:</p>

  <ul>
    <li><strong>ईमेल और कई मैसेंजर अपने आप बदल देते हैं।</strong> Mail से तस्वीर भेजिए और वह आम तौर पर JPG बनकर पहुँचती है, HEIC नहीं।</li>
    <li><strong>कॉपी-पेस्ट भी बदल देता है।</strong> फ़ोटो ऐप में तस्वीरें चुनिए, शेयर दबाइए, फिर <strong>फ़ोटो कॉपी करें</strong>, और उन्हें किसी फ़ोल्डर या दस्तावेज़ में चिपका दीजिए, iOS JPG ही देता है।</li>
  </ul>

  <p>एक सेटिंग केबल से लाने का रास्ता भी ठीक कर देती है: <strong>सेटिंग्स, फ़ोटो, Mac या PC में ट्रांसफ़र करें, अपने आप</strong>। यह चालू हो तो केबल से लाई तस्वीरें चलने लायक फ़ॉर्मैट में पहुँचती हैं, चाहे फ़ोन पर वे HEIC में ही रखी हों।</p>

  <h2>HEIC को JPG बनाने से गुणवत्ता घटती है?</h2>

  <p>तकनीकी रूप से तस्वीर दोबारा बनती है, इसलिए थोड़ा दबाव फिर पड़ता है। असल में, ऊँची गुणवत्ता की सेटिंग पर फ़र्क़ दिखता ही नहीं, बिंदुओं तक बड़ा करके साथ-साथ रखे बिना आप उसे पकड़ नहीं पाएँगे। दो बातें जानने लायक हैं:</p>

  <ul>
    <li>JPG उस HEIC से <strong>भारी</strong> होगी जिससे वह बनी है, अक्सर लगभग दुगनी। यह बढ़ी हुई गुणवत्ता नहीं है; बस JPG कम कुशल तरीक़े से दबाता है। ठीक इसी वजह से Apple ने उसे छोड़ा था।</li>
    <li>तस्वीर पर आगे बहुत काम होना है, तो उसकी जगह <strong>PNG</strong> बनाइए। PNG कुछ गँवाता नहीं, इसलिए बार-बार सहेजने पर ख़राबी जमा नहीं होती।</li>
  </ul>

  <h2>कौन सा नतीजा चुनें: JPG, PNG या PDF</h2>

  <ul>
    <li><strong>JPG</strong>, यही आम जवाब है। तीनों में सबसे हल्की, हर जगह खुलती है, और वेब, चैट या दफ़्तरी दस्तावेज़ों में जाने वाली तस्वीरों के लिए सही।</li>
    <li><strong>PNG</strong>, कुछ गँवाए बिना और भारी। तस्वीरों पर आगे काम करना हो, या कोई अपलोड का ख़ाना PNG पर अड़ जाए, तब लीजिए।</li>
    <li><strong>PDF</strong>, जब तस्वीर को दस्तावेज़ की तरह चलना है: बीमे का दावा, रसीद, या फ़ोन से खींचा दस्तख़त वाला पन्ना। कई तस्वीरें एक ही दस्तावेज़ में जानी हैं, तो उन्हें <a href="/hi/jpg-to-pdf/">JPG से PDF</a> टूल से बदलिए, वह कई तस्वीरों को एक PDF में जोड़ देता है।</li>
  </ul>

  <h2>अक्सर पूछे जाने वाले सवाल</h2>

  <h3>Windows HEIC खोलने के लिए पैसे क्यों माँगता है?</h3>
  <p>जिस HEVC कोडेक पर HEIC टिका है, उसे Microsoft पैसे वाले जोड़ के रूप में देता है, इसलिए नया Windows इस फ़ॉर्मैट को पढ़ ही नहीं पाता। फ़ाइल को JPG बना लेना पूरी दिक्क़त को किनारे कर देता है, न कुछ इंस्टॉल करना, न ख़रीदना।</p>

  <h3>बदलने में तस्वीर का ब्यौरा बचता है?</h3>
  <p>तस्वीर ख़ुद साफ़-साफ़ बदल जाती है। कुछ ब्यौरा (जगह, कैमरे की सेटिंग) रास्ते में छूट सकता है, इसलिए अगर आपके काम में यह ब्यौरा मायने रखता है, तो मूल फ़ाइल मिटाने से पहले नई फ़ाइल जाँच लीजिए।</p>

  <h3>पूरा एल्बम एक साथ बदल सकता हूँ?</h3>
  <p>प्रीमियम वाले एक बार में दस HEIC फ़ाइलें चढ़ाकर ZIP में नतीजा पा सकते हैं। सैकड़ों तस्वीरों के लिए बेहतर रास्ता iPhone पर ही है: कैमरा सबसे संगत पर कर दीजिए, या केबल से अपने आप बदलने वाली सेटिंग चालू कर लीजिए, ताकि बदलने की ज़रूरत ही न पड़े।</p>

  <h3>HEIC और HEIF में क्या फ़र्क़ है?</h3>
  <p>HEIF मानक है; HEIC उसका वह ख़ास रूप है जो Apple इस्तेमाल करता है (HEVC से दबाया गया HEIF डिब्बा)। बदलने के लिहाज़ से दोनों एक जैसे चलते हैं, और टूल दोनों नाम स्वीकार करता है।</p>

  <h3>HEIC, JPG से बेहतर है?</h3>
  <p>सहेजने के फ़ॉर्मैट के तौर पर हाँ, वही गुणवत्ता लगभग आधी जगह में, साथ में 10-बिट रंग और लाइव फ़ोटो। भेजने के फ़ॉर्मैट के तौर पर नहीं, दुनिया अब भी JPG ही बोलती है। समझदार तरीक़ा यही है: फ़ोन पर HEIC, भेजने के लिए JPG, और ऊपर बताए रास्ते ठीक यही देते हैं।</p>

  <h2>अभी आज़माइए</h2>

  <p>अगर कोई HEIC फ़ाइल अभी आपके कंप्यूटर पर पड़ी खुलने से मना कर रही है, तो उसे <a href="/hi/image/heic-to-jpg/">HEIC से JPG कन्वर्टर</a> में डालिए, JPG चुनिए, और सेकंडों में काम हो गया। और अगर यह हर हफ़्ते होता है, तो उन्हीं सेकंडों में से एक ख़र्च करके iPhone का कैमरा सबसे संगत पर कर दीजिए, आगे आप ख़ुद को शाबाशी देंगे।</p>
