content_hi: |
  प्रिंटेबल प्रोडक्ट पर आने वाले हैरान करने वाली संख्या में एक-स्टार रिव्यू के पीछे एक छोटा-सा गणित है। A4 का नाप 210 गुणा 297 मिमी है। US Letter का नाप 215.9 गुणा 279.4 मिमी है। Letter करीब 6 मिमी चौड़ा और करीब 18 मिमी छोटा है। ये एक ही आकार के दो नाप नहीं हैं: अनुपात खुद अलग हैं, 1:1.41 के मुकाबले 1:1.29।

  नतीजा वही हिस्सा है जो लोग चूक जाते हैं। ऐसा कोई प्रतिशत नहीं जिस पर छापकर एक दूसरा बन जाए। A4 डिज़ाइन को Letter की चौड़ाई तक स्केल करें, वह अब भी बहुत ऊँचा है। ऊँचाई के हिसाब से स्केल करें, वह चौड़ाई भरना बंद कर देता है। "बस पेज में फ़िट करके छाप लो" वाली हर तरकीब असल में यह चुनाव है कि इन दो समझौतों में से कौन सा खरीदार को मिलेगा, और यह चुनाव चुपचाप उसका प्रिंटर ड्राइवर करता है।

  <h2>कौन क्या इस्तेमाल करता है</h2>

  <p>बँटवारा भौगोलिक है और लगभग पूरा:</p>

  <ul>
    <li><strong>US Letter</strong> अमेरिका, कनाडा में, और आम तौर पर मेक्सिको, फ़िलीपींस, चिली तथा मध्य और दक्षिण अमेरिका के हिस्सों में।</li>
    <li><strong>A4</strong> बाकी हर जगह, यानी भारत, पूरे यूरोप, एशिया के बड़े हिस्से, अफ़्रीका, ऑस्ट्रेलिया और बाकी दक्षिण अमेरिका में। यह ISO 216 मानक है।</li>
    <li><strong>स्थानीय जोड़ भी हैं।</strong> F4, जिसे फ़ोलियो भी कहते हैं, 215 गुणा 330 मिमी, इंडोनेशिया और दक्षिण-पूर्व एशिया के हिस्सों में अब भी आम है, और Legal, 215.9 गुणा 355.6 मिमी, उत्तर अमेरिकी दफ़्तरों में अनुबंधों के लिए दिखता है।</li>
  </ul>

  <p>अगर आप डिजिटल प्रोडक्ट बेचते हैं, तो इसका मतलब है कि सिर्फ़ A4 देने वाली दुकान चुपचाप अपनी उत्तर अमेरिकी बिक्री खो देती है, और सिर्फ़ Letter देने वाली दुकान दुनिया का बड़ा हिस्सा खो देती है। इन दोनों नुकसानों में से कोई भी आपके एनालिटिक्स में रिफंड बनकर नहीं आता: खरीदार बस खरीदता नहीं, या एक बार खरीदकर मार्जिन के बारे में रिव्यू छोड़ जाता है।</p>

  <h2>जब खरीदार गलत नाप छापता है तो असल में क्या होता है</h2>

  <p>लगभग हर PDF रीडर डिफ़ॉल्ट रूप से "fit to printable area" जैसा कुछ चुनता है। Letter कागज़ वाले खरीदार को A4 फ़ाइल दें, और यह सेटिंग वही एक काम करेगी जो वह कर सकती है: पेज को करीब 94 प्रतिशत तक छोटा करके ऊँचाई फ़िट करेगी और उसे बीच में रखेगी। दिखने वाले नतीजे:</p>

  <table>
    <thead>
      <tr><th>आपने जो बनाया</th><th>खरीदार को जो मिला</th></tr>
    </thead>
    <tbody>
      <tr><td>A4 के लिए बनी प्लानर की ग्रिड</td><td>वही ग्रिड 94 प्रतिशत पर, और किनारों पर असमान सफ़ेद पट्टियाँ</td></tr>
      <tr><td>किसी फ़्रेम के नाप की वॉल आर्ट</td><td>हर मानक फ़्रेम नाप से कुछ मिलीमीटर छोटी चीज़</td></tr>
      <tr><td>स्टिकर या कार्ड की काटने वाली लाइनें</td><td>लाइनें जो कटिंग मैट या डाई से मेल नहीं खातीं</td></tr>
      <tr><td>छेद वाली प्लानर शीट</td><td>छेद जो रिंग से चूक जाते हैं, क्योंकि मार्जिन खिसक गया</td></tr>
      <tr><td>11 पॉइंट का मुख्य टेक्स्ट</td><td>करीब 10.3 पॉइंट का टेक्स्ट, जो "सस्ता" लगता है और किसी को पता नहीं क्यों</td></tr>
    </tbody>
  </table>

  <p>सिर्फ़ टेक्स्ट वाली वर्कशीट के लिए इसका ज़्यादा मतलब नहीं। लेकिन जिस चीज़ को खरीदार नापता, काटता, फ़्रेम करता या बाइंड करता है, उसके लिए यही पूरा प्रोडक्ट है।</p>

  <h2>मार्जिन ही एक डिज़ाइन को दो बनाता है</h2>

  <p>संख्याओं से निकला काम का नतीजा यह है। A4 से Letter जाते हुए आप 17.6 मिमी ऊँचाई खोते हैं, यानी सामग्री बीच में रहे तो ऊपर 8.8 और नीचे 8.8 मिमी। Letter से A4 जाते हुए आप 5.9 मिमी चौड़ाई खोते हैं, यानी हर तरफ़ करीब 3 मिमी।</p>

  <p>तो जिस डिज़ाइन में हर ज़रूरी चीज़ किनारे से कम से कम 10 से 12 मिमी अंदर है, वह दोनों दिशाओं में पूरे नाप में यह सफ़र झेल लेता है। जिस डिज़ाइन में बॉर्डर किनारे से 4 मिमी पर है, वह किसी भी दिशा में नहीं झेलता। शुरुआत में लिया यह एक फ़ैसला ही दो बाज़ारों के लिए एक फ़ाइल और हमेशा संभालने वाली दो फ़ाइलों के बीच का अंतर है।</p>

  <p>संयोग से यह वही मार्जिन है जो घर के प्रिंटर को हर हाल में चाहिए, क्योंकि घरेलू उपकरण कागज़ के बाहरी कुछ मिलीमीटर पर स्याही नहीं डाल सकते। हमारी गाइड <a href="/hi/blog/sell-printable-pdf-on-etsy/">बेचने के लिए प्रिंटेबल PDF कैसे तैयार करें</a> में यह न छपने वाला किनारा और अपलोड से पहले की बाकी जाँचें हैं।</p>

  <h2>तरीका: डिज़ाइन एक बार, एक्सपोर्ट दो बार</h2>

  <p>अगर जिस फ़ाइल में आपने डिज़ाइन किया वह अब भी है, तो यही सही रास्ता है और इससे बेहतर कुछ नहीं:</p>

  <ol>
    <li><strong>A4 में डिज़ाइन करें</strong> और 12 मिमी का सुरक्षित मार्जिन रखें। ज़्यादा ऊँचे और सँकरे आकार से शुरू करना आसान दिशा है, क्योंकि Letter पर मिलने वाली अतिरिक्त चौड़ाई सहज पच जाती है और जो ऊँचाई घटती है वह आपके मार्जिन के अंदर ही है।</li>
    <li><strong>आर्टबोर्ड की Letter में नकल बनाएँ</strong> और लेआउट को दोबारा बीच में आने दें। जाँचना बस ऊर्ध्वाधर है: हेडर और फ़ुटर के पास 8.8 मिमी कम जगह है।</li>
    <li><strong>दोनों एक्सपोर्ट करें</strong> एम्बेड किए फ़ॉन्ट के साथ, और नाम ऐसे रखें जो संदर्भ के बाहर भी साफ़ हों: <code>weekly-planner-A4.pdf</code> और <code>weekly-planner-US-Letter.pdf</code>।</li>
  </ol>

  <p>नए अनुपात के लिए सचमुच दोबारा वर्तनी सिर्फ़ असली डिज़ाइन टूल कर सकता है, इसलिए यह रास्ता किसी भी कन्वर्ज़न से बेहतर है। पैराग्राफ़ दोबारा बह सकते हैं, ग्रिड को एक पंक्ति मिल सकती है, फ़ुटर खिसक सकता है।</p>

  <h2>जब स्रोत फ़ाइल ही न बची हो</h2>

  <p>आम असहज हालत: आपने कमर्शियल लाइसेंस वाला टेम्प्लेट खरीदा, फ़ाइल किसी से मिली, या ओरिजिनल पुराने लैपटॉप के साथ चला गया। हाथ में बस बनी हुई PDF है, और बनी हुई PDF तैयार पेजों का ब्यौरा होती है। उसे कोई दोबारा वर्तनी नहीं कर सकता।</p>

  <p>हाँ, उसे दूसरे कागज़ पर रखा जा सकता है, और यह इसके बाद का सबसे अच्छा काम है। <a href="/hi/pdf-edit/page-size/">PDF पेज साइज़ बदलें</a> मौजूदा पेजों को दूसरे कागज़ी मानक पर रख देता है। दो बातें इसे उपयोगी बनाती हैं, खतरनाक नहीं:</p>

  <ul>
    <li><strong>यह देखता है कि सामग्री असल में कहाँ है।</strong> चूँकि A4 से Letter में ऊपर-नीचे 8.8 मिमी लगते हैं, 12 मिमी मार्जिन वाली फ़ाइल के पास गुंजाइश है और वह ठीक 100 प्रतिशत पर रहती है। छपाई के नाप सही रहते हैं, और जो चीज़ें नापी जाती हैं उनके लिए यही सारा मतलब है।</li>
    <li><strong>जब मजबूरी हो तो यह काटने के बजाय छोटा करता है।</strong> किनारे तक जाते डिज़ाइन के पास गुंजाइश नहीं होती, इसलिए वह उतना ही छोटा होता है जितने से सब बचा रहे, बजाय आपकी बॉर्डर के 9 मिमी खोने के। स्केल पूरे दस्तावेज़ पर एक ही लगता है, इसलिए कई पेज वाला सेट पेज-दर-पेज मेल खाता रहता है।</li>
  </ul>

  <p>इसे क्रॉप टूल से करने की कोशिश न करें। <a href="/hi/pdf-edit/crop/">क्रॉप</a> पेज को छोटे आयत तक काटता है, इसलिए A4 डिज़ाइन पर Letter के आकार का बॉक्स रखने से आपको Letter-आकार की खिड़की मिलेगी जिसमें पेज का निचला हिस्सा गायब है। क्रॉप उन मार्जिन को हटाने के लिए है जो आपको नहीं चाहिए, कागज़ी मानक बदलने के लिए नहीं।</p>

  <h2>खरीदार को क्या बताना है</h2>

  <p>बाकी बची लगभग सारी दिक्कत पैकिंग में रहती है। कुछ आदतें उसे लगभग पूरा हटा देती हैं:</p>

  <ul>
    <li><strong>दोनों नाप डाउनलोड में रखें</strong> और यह लिस्टिंग के विवरण में लिखें, सिर्फ़ तस्वीरों में नहीं। खरीदार विवरण से छानते हैं।</li>
    <li><strong>फ़ाइलों के नाम रखें, फ़ोल्डरों के नहीं।</strong> लोग ज़िप खोलते हैं और फ़ोल्डर की बनावट तुरंत खो देते हैं।</li>
    <li><strong>निर्देश की एक लाइन जोड़ें:</strong> 100 प्रतिशत पर, असली नाप में, स्केलिंग बंद करके छापें। यही एक वाक्य सबसे ज़्यादा सपोर्ट संदेश रोकता है, क्योंकि यह रीडर को सही फ़ाइल चुपचाप छोटा करने से रोकता है।</li>
    <li><strong>बताएँ कि पहले कौन सा नाप बनाया</strong>, अगर दोनों में ऐसा कोई फ़र्क है जो खरीदार को दिख सकता है। यहाँ ईमानदारी मुफ़्त है और रिव्यू को पहले ही रोक देती है।</li>
  </ul>

  <p>अगर सेट दो-तीन फ़ाइलों से बड़ा हो जाए, तो एक आर्काइव व्यवस्था रखता है और आपको प्लैटफ़ॉर्म की फ़ाइल-गिनती की सीमा के अंदर रखता है; <a href="/hi/blog/pdf-naming-conventions-best-practices/">फ़ाइल नाम रखने के तरीके</a> वाली हमारी नोट दस्तावेज़ों के लिए लिखी है, पर नियम बिल्कुल वैसे ही लागू होते हैं।</p>

  <h2>छोटी संदर्भ तालिका</h2>

  <table>
    <thead>
      <tr><th>नाप</th><th>मिलीमीटर</th><th>इंच</th><th>अनुपात</th></tr>
    </thead>
    <tbody>
      <tr><td>A4</td><td>210 × 297</td><td>8.27 × 11.69</td><td>1:1.414</td></tr>
      <tr><td>US Letter</td><td>215.9 × 279.4</td><td>8.5 × 11</td><td>1:1.294</td></tr>
      <tr><td>Legal</td><td>215.9 × 355.6</td><td>8.5 × 14</td><td>1:1.647</td></tr>
      <tr><td>A5</td><td>148 × 210</td><td>5.83 × 8.27</td><td>1:1.414</td></tr>
      <tr><td>F4 / फ़ोलियो</td><td>215 × 330</td><td>8.46 × 12.99</td><td>1:1.535</td></tr>
    </tbody>
  </table>

  <p>अनुपात वाले कॉलम पर दूसरी नज़र डालने लायक है। A4 और A5 का अनुपात एक है, इसीलिए A4 शीट को आधा करने पर बिल्कुल सही A5 बनता है और इसीलिए A सीरीज़ के दस्तावेज़ आपस में साफ़-सुथरे स्केल होते हैं। Letter का अनुपात किसी से मेल नहीं खाता, और ठीक इसी वजह से उसे A सीरीज़ के किसी नाप में स्केल नहीं किया जा सकता।</p>

  <h2>आप जो फ़ाइल अपलोड करते हैं उसका क्या होता है</h2>

  <p>हमारे टूल सर्वर पर चलते हैं, इसलिए फ़ाइल अपलोड होती है। काम पूरा होते ही वह मिटा दी जाती है, और डाउनलोड लिंक सिर्फ़ आपका है। कुछ भी इंडेक्स, संग्रहित या ट्रेनिंग में इस्तेमाल नहीं होता। <a href="/hi/blog/is-convertica-safe-pdf-file-security-privacy-explained/">Convertica आपकी फ़ाइलों के साथ कैसे बरतता है</a> वाली नोट में रखने के नियम लिखे हैं, अगर आप किसी बिना लॉन्च हुई चीज़ पर काम कर रहे हैं।</p>

  <h2>अक्सर पूछे जाने वाले सवाल</h2>

  <h3>क्या मैं A4 को Letter कागज़ पर सीधे छाप सकता हूँ?</h3>
  <p>छाप सकते हैं, और सादे टेक्स्ट दस्तावेज़ के लिए यह ठीक है। प्रिंट डायलॉग पेज को करीब 94 प्रतिशत तक छोटा करके बीच में रख देगा, जिससे कुछ कद घटता है और असमान सफ़ेद मार्जिन बनते हैं। जिसे नापा, काटा, फ़्रेम या पंच किया जाता है, उसके लिए यह मंज़ूर नहीं, और जिसे आप बेचते हैं उसके लिए यह अपनी बारी का इंतज़ार करता रिव्यू है।</p>

  <h3>पहले किस नाप में डिज़ाइन करूँ?</h3>
  <p>ज़्यादातर मामलों में A4 में। यह दुनिया के बड़े हिस्से का मानक है और ज़्यादा माफ़ करने वाला शुरुआती बिंदु: Letter में जाने पर चौड़ाई मिलती है, जो आसान है, और ऊँचाई घटती है, जिसे आपका सुरक्षित मार्जिन पहले ही ढक लेता है। Letter से शुरू करें सिर्फ़ तब, जब आपकी ऑडियंस ख़ास तौर पर उत्तर अमेरिकी हो।</p>

  <h3>A4 से Letter का बदलाव बिना नुकसान होता है?</h3>
  <p>पेज की सामग्री का हाँ। दूसरे कागज़ पर रखना मौजूदा वेक्टर सामग्री को नए कागज़ पर रखता है, इसलिए टेक्स्ट और लाइन आर्ट वेक्टर रहते हैं और पहले जितने ही साफ़ छपते हैं। जो नहीं बचता वह है वर्तनी का इरादा: नए अनुपात के लिए कुछ दोबारा नहीं बहता और तत्व दोबारा नहीं जमते, और अगर आपकी सामग्री के पास मार्जिन की गुंजाइश नहीं है तो कटने से बचाने के लिए उसे छोटा करना पड़ता है।</p>

  <h3>A5, Legal या F4 का क्या?</h3>
  <p>A5 ठीक A4 का आधा है और उसका अनुपात एक ही है, इसलिए A सीरीज़ के अंदर बदलाव साफ़ रहते हैं। Legal, A4 और Letter दोनों से काफ़ी ऊँचा है, इसलिए उस पर रखी सामग्री बीच में उदार मार्जिन के साथ बैठती है, कटती नहीं। F4 की ऊँचाई A4 और Legal के बीच है, और उसे देना तभी सार्थक है जब आप उन बाज़ारों में बेचते हैं जहाँ वह आम है।</p>

  <h3>हर नाप के लिए अलग लिस्टिंग तस्वीरें चाहिए?</h3>
  <p>नहीं, और आम तौर पर इससे लिस्टिंग बस भर जाती है। मॉकअप का एक सेट और विवरण में एक साफ़ लाइन कि A4 और US Letter दोनों शामिल हैं, बेहतर काम करती है। जो असल में मदद करता है वह है आख़िरी प्रीव्यू तस्वीर पर एक छोटी पर्ची, जिसमें डाउनलोड की सामग्री की सूची हो।</p>

  <h3>मेरे डिज़ाइन में किनारे तक भरा बैकग्राउंड है। अब क्या?</h3>
  <p>यह मान लें कि पूरे नाप में वह नहीं बदलेगा, क्योंकि उसके पास कहीं भी मार्जिन की गुंजाइश नहीं है। या तो रखते समय उसे छोटा करें, जिससे पतले सफ़ेद किनारे आएँगे जो घर का प्रिंटर हर हाल में जोड़ देता, या दोनों मानकों के लिए सचमुच अलग फ़ाइलें बनाए रखें। किनारे तक भरा फ़ॉर्मैट और घरेलू छपाई कभी आरामदेह जोड़ी नहीं रहे।</p>

  <h2>अपने नाप चुनें</h2>

  <p>कुछ भी बनाने से पहले तय कर लें कि किन दो मानकों को सहारा देंगे, और 12 मिमी मार्जिन रखें ताकि यह फ़ैसला सस्ता बना रहे। अगर हाथ में बनी हुई PDF है और स्रोत फ़ाइल नहीं, तो उसे <a href="/hi/pdf-edit/page-size/">PDF पेज साइज़ बदलें</a> से गुज़ारें, एक पेज 100 प्रतिशत पर छापें और भेजने से पहले चारों किनारे देख लें। बाकी सब <a href="/hi/all-tools/">सभी टूल</a> में है।</p>
