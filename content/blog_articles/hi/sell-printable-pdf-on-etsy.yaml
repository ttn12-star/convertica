content_hi: |
  जिस प्रिंटेबल पर रिफंड मांगा जाता है, वह लगभग कभी भद्दा प्रिंटेबल नहीं होता। स्क्रीन पर डिज़ाइन ठीक था। हुआ कुछ और: खरीदार ने उसे Windows लैपटॉप पर खोला और सुंदर फ़ॉन्ट Times New Roman बन गया। या उसने प्रिंट निकाला और बॉर्डर दो तरफ़ से कट गया। या जो चित्र ब्राउज़र में साफ़ दिख रहा था, वह इंकजेट से धुँधला और पिक्सेल भरा निकला। या Etsy ने अपलोड ही नहीं लिया, क्योंकि फ़ाइल 34 MB की थी।

  मतलब यह कि दुकान की रेटिंग जो काम असल में बचाता है, वह डिज़ाइन पूरा होने के बाद शुरू होता है। वह काम नीरस है: पेज साइज़, रिज़ॉल्यूशन, मार्जिन, फ़ॉन्ट, वज़न। हर चीज़ अपने ख़ास तरीके से टूटती है, और हर एक की जाँच दो मिनट में हो जाती है। नीचे वही क्रम है जिसमें ये आमतौर पर धोखा देती हैं।

  <h2>खरीदार आपकी फ़ाइल के साथ असल में क्या करता है</h2>

  <p>नीचे की सारी शर्तें एक ही जगह से निकलती हैं, इसलिए दूसरी तरफ़ बैठे इंसान की तस्वीर साफ़ होनी चाहिए। आपका खरीदार प्रेस नहीं है। वह:</p>

  <ul>
    <li><strong>घर पर प्रिंट करता है</strong>, इंकजेट या सस्ते लेज़र प्रिंटर से, जो कागज़ के किनारे तक छाप ही नहीं सकता।</li>
    <li><strong>वही कागज़ इस्तेमाल करता है जो उसके देश में बिकता है।</strong> भारत और लगभग पूरी दुनिया में A4, अमेरिका और कनाडा में US Letter। ये अलग अनुपात हैं, सिर्फ़ अलग नाप नहीं।</li>
    <li><strong>फ़ाइल उसी चीज़ में खोलता है जो हाथ में है</strong>, और वह अब अक्सर फ़ोन या टैबलेट होता है, और PDF रीडर जो Acrobat नहीं है।</li>
    <li><strong>दिक्कत के बारे में आपको लिखेगा नहीं।</strong> वह रिफंड मांगेगा या रिव्यू छोड़ देगा, और दोनों की कीमत उस एक बिक्री से ज़्यादा है।</li>
  </ul>

  <p>इन सब के लिए PDF सही फ़ॉर्मैट है, क्योंकि वह अपना लेआउट अपने साथ लेकर चलता है। यही उसका जाल भी है: वह ठीक वही लेआउट लेकर चलता है जो आपने दिया, उन हिस्सों समेत जो सिर्फ़ आपकी मशीन पर चल रहे थे।</p>

  <h2>पेज साइज़: अनुपात सबसे पहले तय होता है</h2>

  <p>A4 का नाप 210 गुणा 297 मिमी है। US Letter का 216 गुणा 279 मिमी। Letter ज़्यादा चौड़ा और कम लंबा है। कोई स्केल फ़ैक्टर एक को दूसरा नहीं बना सकता, इसलिए "पेज में फ़िट करके प्रिंट कर लो" वाली सलाह से प्लानर में असमान सफ़ेद पट्टियाँ आती हैं और वॉल आर्ट के किनारे कट जाते हैं।</p>

  <p>ईमानदार विकल्प दो हैं: एक साइज़ चुनें और लिस्टिंग में साफ़ लिखें, या दोनों दें। जमी हुई ज़्यादातर दुकानें दोनों देती हैं, क्योंकि सिर्फ़ A4 वाली दुकान चुपचाप अपना अमेरिकी ट्रैफ़िक खो देती है, और सिर्फ़ Letter वाली बाकी सबको।</p>

  <p>दोनों देने का मतलब है डिज़ाइन टूल से दो फ़ाइलें एक्सपोर्ट करना। तैयार PDF को क्रॉप या स्केल करके दूसरा साइज़ बनाने की कोशिश न करें: क्रॉप पेज को छोटे आयत तक काटता है, तो आपको A4 डिज़ाइन पर Letter के अनुपात की खिड़की मिलेगी जिसमें नीचे का हिस्सा गायब है। हमारा <a href="/hi/pdf-edit/crop/">PDF क्रॉप</a> दस्तावेज़ से फ़ालतू मार्जिन हटाने के लिए है, एक कागज़ी मानक को दूसरे में बदलने के लिए नहीं। डिज़ाइन टूल से दो बार एक्सपोर्ट करना अब भी सबसे अच्छा रास्ता है, क्योंकि दूसरे अनुपात के लिए असल में दोबारा वर्तनी सिर्फ़ मूल फ़ाइल ही कर सकती है। जब वह फ़ाइल आपके पास न हो, या आपने तैयार टेम्प्लेट खरीदा हो, तो <a href="/hi/pdf-edit/page-size/">PDF पेज साइज़ बदलें</a> इसके बाद का सबसे अच्छा काम करता है: पेजों को दूसरे कागज़ पर ले जाता है और, चूँकि Letter पर A4 ऊपर-नीचे 8.8 मिमी खोता है, जब आपके मार्जिन गुंजाइश देते हैं तो पूरा नाप बनाए रखता है और जब नहीं देते तो उतना ही छोटा करता है। यह कभी नहीं काटता। नीचे बताया 10 से 12 मिमी का मार्जिन रखने की व्यावहारिक वजह भी यही है।</p>

  <h2>300 dpi, और स्क्रीन आपको क्यों धोखा देती है</h2>

  <p>स्क्रीन पर करीब 100 पिक्सेल प्रति इंच होते हैं। कागज़ उससे लगभग तीन गुना बारीक ब्यौरा दिखाता है। इसलिए जो तस्वीर ब्राउज़र में पूरे ज़ूम पर बिल्कुल साफ़ लगती है, वह छपने पर साफ़ तौर पर धुँधली निकल सकती है, और मॉनिटर पर इसे पकड़ने का कोई तरीका नहीं है।</p>

  <p>नियम यह है: अंतिम प्रिंट साइज़ पर 300 dpi। व्यवहार में:</p>

  <ul>
    <li><strong>20 गुणा 25 सेमी की वॉल आर्ट</strong> के लिए स्रोत तस्वीर करीब 2400 गुणा 3000 पिक्सेल चाहिए। अगर मूल तस्वीर 1000 पिक्सेल चौड़ी है, तो कोई एक्सपोर्ट सेटिंग उसे नहीं बचाएगी।</li>
    <li><strong>टेक्स्ट और आकृतियाँ इसमें नहीं गिनतीं।</strong> PDF में फ़ॉन्ट, लाइनें और वेक्टर चित्र रिज़ॉल्यूशन से आज़ाद होते हैं और उतना ही अच्छा छपते हैं जितना प्रिंटर कर सकता है। पूरा टेक्स्ट और लाइनों से बना प्लानर हमेशा साफ़ निकलेगा।</li>
    <li><strong>जोखिम सिर्फ़ रैस्टर पर है।</strong> फ़ोटो, टेक्सचर, वॉटरकलर तत्व, स्कैन की गई लिखाई, और जो कुछ आपने JPG या PNG के रूप में लिया।</li>
  </ul>

  <p>अगर आप ब्राउज़र वाले एडिटर में बनाते हैं, तो डिफ़ॉल्ट की जगह सबसे ऊँची उपलब्ध क्वालिटी पर एक्सपोर्ट करें: डिफ़ॉल्ट आमतौर पर स्क्रीन पर साझा करने के हिसाब से सेट होता है।</p>

  <h2>न छपने वाला किनारा और वह मार्जिन जो वह थोप देता है</h2>

  <p>घर का प्रिंटर कागज़ को खींचने के लिए रोलर से पकड़ता है, इसलिए बाहरी कुछ मिलीमीटर पर स्याही नहीं डाल सकता। मॉडल के हिसाब से यह मरा हुआ हिस्सा हर तरफ़ करीब 3 से 6 मिमी होता है, और निकलने वाले किनारे पर उससे ज़्यादा।</p>

  <p>इससे दो नतीजे निकलते हैं, जिन पर लगभग हर नया विक्रेता ठोकर खाता है:</p>

  <ul>
    <li><strong>किनारे तक भरा बैकग्राउंड घर पर नहीं चलता।</strong> जिस डिज़ाइन में रंग पेज के किनारे तक जाता है, वह पतली सफ़ेद पट्टियों के साथ छपता है, और वे आमतौर पर असमान होती हैं। अगर डिज़ाइन को किनारे तक रंग चाहिए ही, तो लिस्टिंग में लिख दें कि फ़ाइल प्रेस के लिए बनी है।</li>
    <li><strong>हर ज़रूरी चीज़ अंदर खींचनी होगी।</strong> टेक्स्ट, पेज नंबर, चेकबॉक्स और काटने की लाइनें किनारे से कम से कम 10 से 12 मिमी अंदर रखें। इससे नज़दीक जो है, वह अनजान प्रिंटर पर तुक्का है।</li>
  </ul>

  <p>इस समस्या का दूसरा आधा हिस्सा खरीदार के प्रिंट डायलॉग में बैठा है। ज़्यादातर रीडर डिफ़ॉल्ट रूप से "fit to printable area" चुनते हैं, जो चुपचाप पेज को कुछ प्रतिशत छोटा करके बीच में रख देता है। प्लानर में यह दिखता नहीं। जिस चीज़ को खरीदार काटेगा या बाइंड करेगा, उसमें यह असली दिक्कत है, तो निर्देशों में एक लाइन जोड़ दें: 100 प्रतिशत पर, असली नाप में, स्केलिंग बंद करके प्रिंट करें।</p>

  <h2>फ़ॉन्ट: एम्बेड करें या आकृतियों में बदलें</h2>

  <p>फ़ाइल की सबसे आम खराबी वह फ़ॉन्ट है जो PDF में गया ही नहीं। आपकी मशीन पर वह इंस्टॉल है, इसलिए फ़ाइल सही दिखती है। खरीदार की मशीन पर रीडर उसे ढूँढ नहीं पाता और कोई दूसरा फ़ॉन्ट रख देता है, जिससे हर लाइन दोबारा बहती है और वह पूरा लेआउट टूट जाता है जिस पर आपने पूरा वीकेंड लगाया।</p>

  <p>बचने के दो तरीके, पसंद के क्रम में:</p>

  <ul>
    <li><strong>एक्सपोर्ट के समय फ़ॉन्ट एम्बेड करें।</strong> हर गंभीर डिज़ाइन टूल में यह विकल्प है, और ब्राउज़र वाले टूल यह अपने आप करते हैं। जाँच आसान है: PDF खोलें और दस्तावेज़ प्रॉपर्टीज़ देखें, वहाँ फ़ॉन्ट वाला टैब होता है, और हर फ़ॉन्ट के आगे "Embedded" या "Embedded Subset" लिखा होना चाहिए।</li>
    <li><strong>टेक्स्ट को आउटलाइन में बदलें</strong> एक्सपोर्ट से पहले। अक्षर वेक्टर आकृतियाँ बन जाते हैं, तो किसी फ़ॉन्ट की ज़रूरत ही नहीं रहती। यह पक्का तरीका है और वापस नहीं पलटता, इसलिए एडिट होने वाली मास्टर फ़ाइल अलग रखें।</li>
  </ul>

  <p>ऐसी मशीन पर जाँचें जहाँ आपके फ़ॉन्ट इंस्टॉल न हों, या किसी और से फ़ाइल खुलवाएँ। अपने कंप्यूटर पर खोल लेना कुछ साबित नहीं करता: आपका कंप्यूटर वही एक जगह है जहाँ वह चलना पक्का है।</p>

  <h2>फ़ाइल फ़्लैटन करें, पर उससे मिलने वाली चीज़ के बारे में ईमानदार रहें</h2>

  <p>लेयर, फ़ॉर्म फ़ील्ड, एनोटेशन और एडिट होने वाले टेक्स्ट ऑब्जेक्ट, ये सब वे चीज़ें हैं जिन्हें खरीदार गलती से खिसका सकता है, और जो फ़ाइल को ज़रूरत से भारी बनाती हैं। <a href="/hi/pdf-edit/flatten/">PDF फ़्लैटन करना</a> इन सबको एक स्थिर पेज में मिला देता है। नतीजा जल्दी खुलता है, अजीब रीडरों में भी अंदाज़े के मुताबिक छपता है, और भटके हुए क्लिक से अपनी जगह नहीं छोड़ता।</p>

  <p>फ़्लैटन जो नहीं करता, वह है किसी को आपका काम दोबारा बेचने से रोकना। पासवर्ड भी नहीं रोकता। जो पेज प्रिंट कर सकता है, वह उसकी फ़ोटो ले सकता है, और जिस PDF को खरीदार खोल सकता है, उसका स्क्रीनशॉट भी ले सकता है। फ़्लैटन फ़ाइल की सफ़ाई है, कॉपीराइट की पहरेदारी नहीं। हाँ, वह रोज़मर्रा की दुर्घटना ज़रूर रोकता है: खरीदार टेक्स्ट बॉक्स खींच देता है और फिर पूछता है कि आपकी फ़ाइल खराब क्यों है।</p>

  <p>अगर आप लापरवाह एडिटिंग भी रोकना चाहते हैं, तो <a href="/hi/pdf-security/protect/">PDF की अनुमतियाँ</a> एडिट और कॉपी पर रोक लगा सकती हैं और फ़ाइल पढ़ने-छापने के लिए खुली रहती है। इसे स्पीड ब्रेकर मानिए। <a href="/hi/blog/password-protect-pdf-before-emailing/">PDF पासवर्ड असल में क्या बचाता है</a> पर हमारी गाइड दोनों तरह के पासवर्ड का फ़र्क खोलकर बताती है, और किसी एक पर भरोसा करने से पहले यह जानना ठीक रहेगा।</p>

  <h2>फ़ाइल का वज़न: असली सीमा Etsy की 20 MB है</h2>

  <p>यह लिखते समय Etsy हर डिजिटल फ़ाइल 20 MB तक लेता है, और एक लिस्टिंग में पाँच फ़ाइल तक। यही संख्या, आपका डिज़ाइन नहीं, तय करती है कि बंडल कैसे बनेगा। तीन व्यावहारिक नतीजे:</p>

  <ul>
    <li><strong>कई साइज़ वाला बंडल पाँच फ़ाइलों की सीमा तुरंत पार कर जाता है।</strong> चार पेज साइज़ गुणा तीन रंग विकल्प बराबर बारह फ़ाइलें। इसका मानक जवाब ZIP है: एक आर्काइव आपके पाँच में से एक जगह लेता है, और खरीदार उसे किसी भी प्लैटफ़ॉर्म पर खोल लेता है।</li>
    <li><strong>भारी प्लानर तस्वीरों की वजह से भारी होता है।</strong> सिर्फ़ टेक्स्ट वाली PDF का वज़न नाममात्र होता है। अगर 40 पेज का प्लानर 30 MB का है, तो पूरे पेज की कोई पृष्ठभूमि या टेक्सचर यह कर रहा है।</li>
    <li><strong>कंप्रेस सबसे आख़िर में करें, और नतीजा कागज़ पर देखें।</strong> हमारा <a href="/hi/pdf-organize/compress/">PDF कंप्रेसर</a> टेक्स्ट और वेक्टर को पूरी क्वालिटी में रखता है और तस्वीरों को दोबारा कंप्रेस करता है, जो टेक्स्ट भरे प्लानर के लिए ठीक सौदा है और फ़ोटो वाली वॉल आर्ट के लिए ठीक उलटा। आर्ट के लिए एक पेज पहले और बाद में छापकर देखें। अगर दिखने वाले नुकसान के बिना सीमा में नहीं आ रहे, तो लिस्टिंग बाँट दें।</li>
  </ul>

  <p>अगर आपने आर्काइव का रास्ता चुना है और डाउनलोड को ही बंद रखना चाहते हैं, तो <a href="/hi/archive/protect/">ZIP पर पासवर्ड</a> लगाया जा सकता है, हालाँकि पैसे वाले डाउनलोड में यह जितना रोकता है उससे ज़्यादा सपोर्ट संदेश पैदा करता है।</p>

  <h2>कई पेज वाले प्रोडक्ट में पेज नंबर चाहिए</h2>

  <p>जो भी प्रोडक्ट खरीदार एक सेट की तरह छापता है, यानी प्लानर, वर्कबुक, वर्कशीट पैक, उसमें पेज नंबर चाहिए। उनके बिना, जिसने 40 पेज छापे और ढेर बिखेर दिया, उसके पास उसे दोबारा जमाने का कोई रास्ता नहीं है, और यह आपकी समस्या बन जाती है।</p>

  <p>नंबर सबसे अंत में डालें, जब पेजों का क्रम पक्का हो जाए, <a href="/hi/pdf-edit/add-page-numbers/">पेज नंबर जोड़ें</a> से। उन्हें ऊपर बताए सुरक्षित हिस्से के अंदर रखें, क्योंकि किनारे से 5 मिमी दूर का नंबर प्रिंटर सबसे पहले खाता है। <a href="/hi/blog/add-page-numbers-to-pdf/">नंबरिंग की पूरी गाइड</a> में जगह और शुरुआती गिनती के बारे में है, अगर कवर पेज छोड़ना हो।</p>

  <h2>लिस्टिंग के लिए झलक, प्रोडक्ट नहीं</h2>

  <p>लिस्टिंग की तस्वीरें प्रोडक्ट दिखानी चाहिए, प्रोडक्ट होनी नहीं चाहिए। साफ़ मॉकअप के लिए एक पेज को <a href="/hi/pdf-to-jpg/">PDF से JPG</a> से तस्वीर बनाकर निकालें, और अगर पैसे वाली वर्कबुक के अंदर के पेज दिखाने हैं, तो पहले उन्हें <a href="/hi/pdf-edit/add-watermark/">वॉटरमार्क जोड़ें</a> से गुज़ारें। <a href="/hi/blog/watermark-pdf-confidential-draft/">PDF पर वॉटरमार्क</a> वाली हमारी नोट में जगह और पारदर्शिता की बात है: झलक के लिए वॉटरमार्क पढ़ा जाने लायक चाहिए, लेकिन इतना गाढ़ा नहीं कि खरीदार डिज़ाइन ही न आँक सके।</p>

