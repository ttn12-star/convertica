  <p>एक बार यह करने में दस मिनट लगते हैं। रिफंड की मांग आने के बाद यही करने में दस मिनट और वह रिव्यू लगता है जिसे आप मिटा नहीं सकते।</p>

  <h2>आप जो फ़ाइल अपलोड करते हैं उसका क्या होता है</h2>

  <p>हमारे टूल सर्वर पर चलते हैं, इसलिए फ़ाइल अपलोड होती है। काम पूरा होते ही वह मिटा दी जाती है, और डाउनलोड लिंक सिर्फ़ आपका है। कुछ भी इंडेक्स, संग्रहित या ट्रेनिंग में इस्तेमाल नहीं होता। बिना लॉन्च हुए प्रोडक्ट के लिए कुछ विक्रेताओं को फिर भी झिझक होती है, और यह जायज़ है: <a href="/hi/blog/is-convertica-safe-pdf-file-security-privacy-explained/">Convertica आपकी फ़ाइलों के साथ कैसे बरतता है</a> वाली नोट में रखने के नियम लिखे हैं, ताकि आप खुद तय कर सकें।</p>

  <h2>अक्सर पूछे जाने वाले सवाल</h2>

  <h3>A4 में बेचूँ या US Letter में?</h3>
  <p>अगर हो सके तो दोनों दें, और डाउनलोड के अंदर साफ़ लेबल लगाएँ। अगर एक चुनना ही पड़े, तो ट्रैफ़िक के हिसाब से चुनें: दुनिया के बड़े हिस्से के लिए A4, अमेरिका और कनाडा पर टिकी दुकान के लिए US Letter। जो नहीं करना है वह यह है कि एक साइज़ दें और उसके बारे में चुप रहें, क्योंकि तब दुनिया के उस आधे हिस्से से रिफंड की मांग आती है जिसके हाथ में दूसरा कागज़ है।</p>

  <h3>प्रिंटेबल में ब्लीड चाहिए?</h3>
  <p>घर पर छपने वाले प्रोडक्ट के लिए नहीं, और ब्लीड जोड़ने से आमतौर पर हालत बिगड़ती है: ब्लीड वाला डिज़ाइन मानकर चलता है कि छपने के बाद कटाई होगी, और आपके खरीदार के पास कटर नहीं है। इसके बजाय पेज के नाप पर सुरक्षित मार्जिन के साथ डिज़ाइन करें। ब्लीड तभी मायने रखता है जब आप प्रेस वाला संस्करण अलग से बेचते हैं, और वह अलग फ़ाइल होनी चाहिए।</p>

  <h3>क्या मैं खरीदारों को अपनी PDF दोबारा बेचने से रोक सकता हूँ?</h3>
  <p>तकनीकी रूप से नहीं। जो फ़ाइल खरीदार खोल और छाप सकता है, उसकी नकल हो सकती है। अनुमतियाँ और पासवर्ड सिर्फ़ लापरवाह एडिटिंग रोकते हैं, इससे ज़्यादा कुछ नहीं। जो असल में काम करता है वह नीरस जोड़ है: फ़ाइल के अंदर एक लाइसेंस पेज जिसमें लिखा हो कि खरीदार क्या कर सकता है और क्या नहीं, और नकल मिलने पर प्लैटफ़ॉर्म की शिकायत प्रक्रिया।</p>

  <h3>मेरा प्लानर 45 MB का है। पहले क्या काटूँ?</h3>
  <p>तस्वीरें ढूँढें। पूरे पेज की पृष्ठभूमि, कागज़ का टेक्सचर या फ़ोटो वाला कवर लगभग हमेशा पूरा वज़न समझा देते हैं, और टेक्सचर की जगह सपाट रंग या हल्का वेक्टर पैटर्न रखने से फ़ाइल कई गुना छोटी हो जाती है। कंप्रेस उसके बाद, और छपे पेज को देखकर।</p>

  <h3>एक PDF दूँ या ZIP?</h3>
  <p>एक PDF, अगर प्रोडक्ट एक ही चीज़ एक ही साइज़ में है, क्योंकि हर अतिरिक्त कदम उन खरीदारों को गँवाता है जो डाउनलोड फ़ोन पर खोल रहे हैं। ZIP जैसे ही कई साइज़ या रंग विकल्प आ जाएँ, क्योंकि वह आपको पाँच फ़ाइलों की सीमा में रखता है और नाम व्यवस्थित रखता है। बंडल बनाएँ तो फ़ाइलों के नाम ऐसे रखें जो संदर्भ के बाहर भी समझ आएँ: <a href="/hi/blog/pdf-naming-conventions-best-practices/">फ़ाइल नाम रखने के तरीके</a> वाली हमारी नोट दस्तावेज़ों के लिए लिखी है, पर यहाँ बिल्कुल लागू होती है।</p>

  <h3>फ़्लैटन करने से प्रिंट क्वालिटी घटती है?</h3>
  <p>नहीं। फ़्लैटन लेयर और इंटरैक्टिव तत्वों को स्थिर पेज सामग्री में मिलाता है; वह तस्वीरों को दोबारा सैंपल नहीं करता और रिज़ॉल्यूशन नहीं बदलता। क्वालिटी कंप्रेशन से जाती है, और वह अलग फ़ैसला है।</p>

  <h2>फ़ाइल तैयार करें</h2>

  <p>जो प्रोडक्ट लिस्ट होने के सबसे करीब है, उसे अभी आठ बिंदुओं से गुज़ारें, विवरण लिखने से पहले। ज़्यादातर फ़ाइलों में दो सुधार चाहिए: <a href="/hi/pdf-edit/flatten/">फ़्लैटन</a> और, कई पेज वाले सेट में, <a href="/hi/pdf-edit/add-page-numbers/">पेज नंबर</a>। कंप्रेस सिर्फ़ तब जब प्लैटफ़ॉर्म मजबूर करे, <a href="/hi/pdf-organize/compress/">PDF कंप्रेसर</a> से, और नतीजे पर भरोसा करने से पहले एक पेज छापकर देखें। बाकी सब <a href="/hi/all-tools/">सभी टूल</a> में है।</p>
