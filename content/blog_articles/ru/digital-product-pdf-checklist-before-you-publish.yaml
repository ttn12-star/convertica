content_ru: |
  Есть момент прямо перед нажатием «опубликовать», когда всё выглядит законченным. Дизайн готов, файл проверен, мокапы сделаны. Это самый дешёвый момент, чтобы поймать ошибку, и самый часто пропускаемый.

  Проверки ниже намеренно не касаются самого файла. Формат страницы, разрешение, встроенные шрифты и вес разобраны в нашем гайде <a href="/ru/blog/sell-printable-pdf-on-etsy/">как подготовить ПДФ для продажи</a>, а если товар едет в двух бумажных стандартах, то <a href="/ru/blog/a4-vs-us-letter-printable-sizes/">решение про A4 и US Letter</a> тоже там. Считаем, что эта работа сделана. Дальше идёт всё вокруг файла, а именно там живут оставшиеся возвраты.

  <h2>1. Откройте комплект так, как это сделает покупатель</h2>

  <p>Не папку на своём рабочем столе. Именно то, что выдаётся. Скачайте через предпросмотр площадки, если он есть, или отправьте архив себе на почту и откройте из письма.</p>

  <ul>
    <li><strong>С телефона.</strong> Большая доля покупателей открывает загрузку сначала на телефоне, а архив на телефоне это худший опыт, чем вам помнится. Если с телефона до вашего файла не добраться в два касания, ждите сообщений.</li>
    <li><strong>Без структуры папок.</strong> Многие распаковывают всё в одну директорию. Если ваши файлы различались только именем папки, теперь они не различаются.</li>
    <li><strong>Без ваших шрифтов.</strong> Чужое устройство это единственная настоящая проверка встроенных шрифтов, и она стоит одного сообщения знакомому.</li>
  </ul>

  <h2>2. Подписывайте файлы, а не папки</h2>

  <p>Каждое имя файла должно быть понятно вне контекста, через полгода, в папке загрузок с четырьмястами других вещей. То есть: товар, вариант и ничего больше.</p>

  <p>Хорошо: <code>weekly-planner-A4-portrait.pdf</code>. Плохо: <code>final_v3.pdf</code>, <code>Untitled-1.pdf</code> или имя с вашими внутренними номерами ревизий. Избегайте символов, которые плохо себя ведут в разных системах, держите нижний регистр и дефисы вместо пробелов. Наша заметка про <a href="/ru/blog/pdf-naming-conventions-best-practices/">правила именования файлов</a> написана про документы, но правила те же.</p>

  <h2>3. Положите внутрь две дополнительные страницы</h2>

  <p>Две страницы, которые ничего вам не стоят и снимают большую часть сообщений в поддержку:</p>

  <ul>
    <li><strong>Страница лицензии.</strong> Простым языком, одна страница: что покупателю можно, что нельзя, входит ли коммерческое использование и как с вами связаться. В нашей заметке о том, <a href="/ru/blog/stop-buyers-editing-reselling-your-pdf/">что реально даёт защита файла</a>, объяснено, почему эта страница работает лучше любой технической меры.</li>
    <li><strong>Одна страница про печать.</strong> Печатать в 100 процентов, фактический размер, масштабирование выключено. Какая бумага. Какие страницы опциональны. Именно эта страница убирает самую частую жалобу: правильный файл, напечатанный не в том масштабе.</li>
  </ul>

  <p>Держите обе короткими. Десять страниц условий в планере за пять долларов читаются как тревожный сигнал.</p>

  <h2>4. Проверьте, что описание лота правда</h2>

  <p>Прочитайте своё описание как противник. Каждое число и каждое существительное в нём это обещание:</p>

  <table>
    <thead>
      <tr><th>Если в лоте написано</th><th>Проверьте</th></tr>
    </thead>
    <tbody>
      <tr><td>«12 страниц»</td><td>Откройте файл и посчитайте. Обложка и страница лицензии меняют число</td></tr>
      <tr><td>«A4 и US Letter в комплекте»</td><td>Оба файла реально в архиве, и оба того формата, который заявлен</td></tr>
      <tr><td>«Редактируемый»</td><td>Редактируемый в том инструменте, который есть у покупателя, а не только у вас</td></tr>
      <tr><td>«Мгновенная загрузка»</td><td>Площадка действительно выдаёт мгновенно для этого типа лота</td></tr>
      <tr><td>«Коммерческое использование разрешено»</td><td>Страница лицензии внутри файла говорит то же самое</td></tr>
      <tr><td>«300 dpi»</td><td>Картинки действительно такие, в итоговом размере печати</td></tr>
    </tbody>
  </table>

  <p>Последняя строка заслуживает секунды внимания. Заявить 300 dpi, когда исходник был растянут, это тот самый конкретный и проверяемый тип обещания, который даёт самые злые отзывы: покупатель может это проверить, а вы не можете спорить.</p>

  <h2>5. Дайте файлу версию, тихо</h2>

  <p>Поставьте небольшую отметку версии где-то незаметно: в метаданных файла или мелким кеглем на странице лицензии. Не в имени файла, где это выглядит незаконченным.</p>

  <p>Вы найдёте ошибку после пятидесятой продажи. И тогда номер версии скажет, старый ли файл у жалующегося покупателя, позволит объяснить, что изменилось, и избавит от вопроса, какая копия лежит у вас на диске. Это тридцать секунд работы, которые окупаются ровно один раз и дорого.</p>

  <h2>6. Сделайте финальный механический проход</h2>

  <p>Коротко, и каждый пункт что-то реально ловит:</p>

  <ul>
    <li><strong>Сведите то, что отдаёте.</strong> <a href="/ru/pdf-edit/flatten/">Сведение</a> убирает слои и случайные поля форм, которые покупатель может сдвинуть, и ускоряет открытие. Пропустите только если товар предполагается заполнять.</li>
    <li><strong>Проверьте порядок страниц и нумерацию.</strong> Если это многостраничный набор, <a href="/ru/pdf-edit/add-page-numbers/">нумерация</a> ставится последней, после финального порядка.</li>
    <li><strong>Сверьте вес с лимитом площадки</strong> по каждому файлу, а не по комплекту, и <a href="/ru/pdf-organize/compress/">сжимайте</a> только если приходится.</li>
    <li><strong>Уберите метаданные, которые не собирались отдавать.</strong> Поля автора и названия программы из экспорта часто несут ваше настоящее имя или название проекта постороннего клиента.</li>
    <li><strong>Откройте ещё раз, целиком.</strong> Не пролистывая. Пустую страницу на седьмой позиции проще найти сейчас, чем в отзыве.</li>
  </ul>

  <h2>7. После первых продаж</h2>

  <p>Публикация это ещё не конец проверки. Две вещи стоит сделать в первую неделю:</p>

  <ul>
    <li><strong>Купите свой товар сами</strong>, если площадка позволяет, или попросите кого-нибудь. Полный путь от оплаты до открытого файла это единственная проверка, которая покрывает поведение самой площадки, а его вы не контролируете и оно меняется.</li>
    <li><strong>Читайте первые вопросы как баг-репорты.</strong> Первые три сообщения покупателей точно скажут, какая часть описания или инструкции непонятна. Правьте описание, а не отвечайте на один вопрос вечно.</li>
  </ul>

  <h2>Весь рубеж одной таблицей</h2>

  <table>
    <thead>
      <tr><th>Проверка</th><th>Что ловит</th></tr>
    </thead>
    <tbody>
      <tr><td>Открыть выданный комплект с телефона</td><td>Трение архива, неоткрываемые файлы, недостающие части</td></tr>
      <tr><td>Распаковать всё в одну папку</td><td>Имена файлов, работавшие только внутри папок</td></tr>
      <tr><td>Открыть на устройстве без ваших шрифтов</td><td>Невстроенные шрифты, разъехавшуюся вёрстку</td></tr>
      <tr><td>Страница лицензии и инструкция по печати внутри</td><td>Большинство сообщений в поддержку и споров о лицензии</td></tr>
      <tr><td>Каждое обещание лота сверено с файлом</td><td>Отзывы, с которыми нельзя спорить</td></tr>
      <tr><td>Отметка версии записана</td><td>Незнание, какая копия у покупателя</td></tr>
      <tr><td>Сведено, порядок, нумерация, вес в лимите</td><td>Случайные правки, отказ загрузки</td></tr>
      <tr><td>Метаданные подчищены</td><td>Отдачу своего настоящего имени или названия чужого проекта</td></tr>
      <tr><td>Файл прочитан от начала до конца</td><td>Пустую страницу, дубль, опечатку в заголовке</td></tr>
    </tbody>
  </table>

  <h2>Что происходит с файлом, который вы загружаете</h2>

  <p>Наши инструменты работают на сервере, то есть файл загружается. Он удаляется сразу после завершения задачи, а ссылка на скачивание принадлежит только вам. Ничего не индексируется, не хранится и не используется для обучения. Для неопубликованного товара в заметке о том, <a href="/ru/blog/is-convertica-safe-pdf-file-security-privacy-explained/">как Convertica обращается с вашими файлами</a>, расписаны правила хранения.</p>

  <h2>Частые вопросы</h2>

  <h3>Сколько это должно занять?</h3>
  <p>Двадцать минут для товара из одного файла, ближе к часу для комплекта с несколькими форматами. Это буквально самые дешёвые двадцать минут во всём процессе, потому что любой пункт списка стоит кратно больше, если исправлять после публикации.</p>

  <h3>Нужна ли страница лицензии в дешёвом печатном шаблоне?</h3>
  <p>Да, и там даже нужнее. Дешёвые товары покупают небрежно и переиспользуют небрежно, в основном люди, не уверенные, что им можно. Одна страница простым языком снимает эту неопределённость, и это тот документ, на который вы покажете, если придётся жаловаться на копию.</p>

  <h3>Номер версии должен быть виден покупателю?</h3>
  <p>Едва. Мелким кеглем на странице лицензии или в метаданных файла это правильно. Версия в имени файла или на обложке делает готовый товар похожим на черновик и вызывает вопросы, что было не так с первой версией.</p>

  <h3>Что делать, если нашёл ошибку после начала продаж?</h3>
  <p>Починить файл, поднять версию, заменить его на площадке и написать покупателям, если ошибка влияет на использование, а не только на вид. Большинство площадок позволяет обновить цифровой файл на месте, а покупатели, которым без запроса прислали исправленную версию, обычно оставляют лучшие отзывы, чем те, кто проблемы и не видел.</p>

  <h3>Стоит ли покупать свой товар?</h3>
  <p>По одному разу на тип товара да. Вы проверяете не файл, а площадку: письмо с чеком, срок жизни ссылки, приходит ли файл с тем именем, которое вы дали. Этот путь ломается так, как из кабинета продавца никогда не увидишь.</p>

  <h3>Сколько чистить в метаданных?</h3>
  <p>Автора, заголовок и любые поля программы или шаблона. Экспорт нередко тащит название шаблона, который вы купили, имя проекта предыдущего клиента или ваше юридическое имя, когда вы продаёте под названием магазина. Ничего из этого не помогает, а одно из этого может по-настоящему поставить в неловкое положение.</p>

  <h2>Пройдите рубеж</h2>

  <p>Возьмите товар, который собирались публиковать, и сделайте пункты с первого по шестой сейчас, по порядку. Большинству файлов нужно <a href="/ru/pdf-edit/flatten/">сведение</a> и больше ничего; доработки обычно требуют комплект и описание. Если ваш товар это интерьер книги, а не печатный шаблон, требования там другие и строже: смотрите <a href="/ru/blog/low-content-book-interior-pdf-requirements/">каким должен быть интерьер low-content книги</a>. Остальное лежит во <a href="/ru/all-tools/">всех инструментах</a>.</p>
