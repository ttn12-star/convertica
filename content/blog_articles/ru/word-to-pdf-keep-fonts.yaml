content_ru: |
  Word (Ворд) на вашем компьютере рисует текст шрифтами, которые установлены на этом компьютере. Онлайн-конвертер работает на сервере и может рисовать только теми шрифтами, что есть на сервере, плюс теми, что едут внутри самого документа. Если вашего шрифта нет ни там, ни там, конвертер подбирает замену. Поэтому при переводе Ворд в ПДФ и меняется шрифт, и всё остальное в этой статье вытекает из этого факта.

  Мы проверили, как <a href="/ru/word-to-pdf/">конвертер Word в PDF</a> обращается с распространёнными шрифтами Office, нестандартными шрифтами и арабскими документами. Вот что происходит и что с этим можно сделать.

  <h2>Шрифты, которые заменяются точными двойниками</h2>

  <p>Самых популярных шрифтов Office на Linux-сервере нет, но у них есть бесплатные двойники с той же шириной символов. Текст, набранный ими, переносится ровно в тех же местах, так что разрывы страниц и длина строк не меняются:</p>

  <ul>
    <li><strong>Arial</strong> → Liberation Sans</li>
    <li><strong>Times New Roman</strong> → Liberation Serif</li>
    <li><strong>Courier New</strong> → Liberation Mono</li>
    <li><strong>Calibri</strong> → Carlito</li>
    <li><strong>Cambria</strong> → Caladea</li>
  </ul>

  <p>Если присмотреться, форма букв немного отличается, но документ на 12 страниц останется на 12 страниц. У двух новых шрифтов Microsoft точного двойника нет: <strong>Aptos</strong> (новый шрифт Office по умолчанию) заменяется на Carlito, а <strong>Segoe UI</strong> на Liberation Sans. Это самые близкие по ширине варианты, поэтому строки могут слегка сдвинуться.</p>

  <h2>Шрифты, которые заменяются чем-то другим</h2>

  <p>Всё остальное, будь то фирменный шрифт, рукописный шрифт для приглашения или шрифт, скачанный для резюме, серверу незнаком. Конвертер подставляет похожий стиль (рубленый вместо рубленого, с засечками вместо шрифта с засечками), и результат обычно выглядит проще и получается другой длины.</p>

  <p>Угадать нужный шрифт конвертер не может. Файл шрифта должен приехать вместе с документом.</p>

  <h2>Решение: внедрить шрифты в файл Word</h2>

  <p>Word умеет хранить используемые в документе шрифты прямо внутри файла .docx. Мы это проверили: документ со внедрённым шрифтом, которого на сервере нет, вышел из конвертера именно этим шрифтом. Без внедрения тот же документ вышел запасным шрифтом.</p>

  <ol>
    <li>В Word откройте <strong>«Файл»</strong> → <strong>«Параметры»</strong> → <strong>«Сохранение»</strong>.</li>
    <li>В блоке о сохранении качества при совместном использовании документа отметьте <strong>«Внедрить шрифты в файл»</strong>.</li>
    <li>Отметьте <strong>«Внедрять только знаки, используемые в документе»</strong>, чтобы файл остался небольшим. Для PDF больше ничего и не нужно.</li>
    <li>Снимите галочку <strong>«Не внедрять обычные системные шрифты»</strong>, если ваш шрифт поставляется с Windows (Traditional Arabic, Sakkal Majalla, Segoe UI и подобные). Иначе Word решит, что они и так есть у всех, и не положит их в файл.</li>
    <li>Сохраните документ и только потом конвертируйте.</li>
  </ol>

  <p>В Word для Mac та же настройка находится в меню <strong>«Word»</strong> → <strong>«Параметры»</strong> → <strong>«Сохранение»</strong>. Лицензия некоторых коммерческих шрифтов запрещает внедрение; такие шрифты Word молча пропускает, и они всё равно будут заменены.</p>

  <h2>Арабские документы</h2>

  <p>На арабском проблемы со шрифтами заметнее всего, поэтому мы проверили его отдельно, на документе с десятью распространёнными шрифтами.</p>

  <ul>
    <li><strong>Сам текст не страдает.</strong> Буквы соединяются правильно, строки идут справа налево, а арабско-индийские цифры (٢٠٢٦) остаются как есть рядом с западными (1500).</li>
    <li><strong>Арабских шрифтов Windows на сервере нет.</strong> Traditional Arabic, Simplified Arabic, Sakkal Majalla и Arabic Typesetting заменяются на <strong>Noto Naskh Arabic</strong>, шрифт в стиле насх, близкий к ним по виду. Арабский текст, набранный Arial, Tahoma или Calibri, выводится шрифтом <strong>Noto Sans Arabic</strong>, который соответствует их более простому стилю.</li>
    <li><strong>Строки могут переноситься в немного других местах,</strong> потому что буквы замены не совпадают по ширине в точности. Плотно свёрстанный одностраничный бланк может переползти на вторую страницу.</li>
    <li><strong>Чтобы получить в точности исходный вид,</strong> внедрите шрифты, как описано выше, и не забудьте снять галочку «Не внедрять обычные системные шрифты»: арабские шрифты как раз системные шрифты Windows.</li>
  </ul>

  <h2>Другой путь: экспорт в PDF из самого Word</h2>

  <p>Если у вас есть Word на компьютере, где установлены нужные шрифты, <strong>«Файл»</strong> → <strong>«Сохранить как»</strong> → <strong>PDF</strong> использует эти шрифты напрямую. Когда такая возможность есть, это самый точный вариант. Онлайн-конвертер выручает, когда вы с телефона, за чужим компьютером или на машине без Word.</p>

  <h2>Как проверить, какие шрифты попали в PDF</h2>

  <p>Откройте PDF в Adobe Acrobat Reader, затем <strong>«Файл»</strong> → <strong>«Свойства»</strong>, вкладка <strong>«Шрифты»</strong>. Там перечислены все шрифты файла. Если вместо Arial стоит Liberation Sans, это ожидаемый двойник. Если на месте фирменного шрифта оказался запасной, внедрите шрифт и сконвертируйте заново.</p>

  <h2>Частые вопросы</h2>

  <h3>Почему в PDF больше страниц, чем в документе Word?</h3>
  <p>Если у шрифта замены буквы шире, строки переносятся раньше и текст растягивается. Со шрифтами Office из списка выше такого не бывает. С нестандартными шрифтами бывает, и это ещё одна причина их внедрять.</p>

  <h3>Сильно ли внедрение шрифтов увеличивает файл Word?</h3>
  <p>С настройкой «Внедрять только знаки, используемые в документе» обычно добавляется от десятков до нескольких сотен килобайт на шрифт. Полный шрифт со всеми символами, особенно китайский, японский, корейский или арабский, может добавить несколько мегабайт.</p>

  <h3>Можно ли искать и копировать арабский текст в PDF?</h3>
  <p>Да. Конвертер записывает настоящий текст, а не картинки с текстом, так что по нему работают поиск и копирование.</p>

  <h3>Переживёт ли конвертацию текст на хинди, русском или китайском?</h3>
  <p>Кириллицу и греческий покрывают двойники шрифтов Office. Деванагари и другие письменности рисуются шрифтами Noto. Как и с арабским, если важен именно исходный рисунок шрифта, внедрите его.</p>

  <h2>Конвертируйте документ</h2>

  <p>Внедрите шрифты, если они необычные, сохраните файл и перетащите его в <a href="/ru/word-to-pdf/">конвертер Word в PDF</a>. Подробнее о макете, таблицах и изображениях читайте в статье о том, <a href="/ru/blog/word-to-pdf-converter-online-free-2025/">как каждый раз получать из Word аккуратный PDF</a>.</p>
