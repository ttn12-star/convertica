content_ru: |
  Рано или поздно каждый продавец цифрового файла задаёт один и тот же вопрос, обычно обнаружив свой планер на чужом сайте: как запретить людям это править и как запретить перепродавать?

  Честный ответ неприятный, но полезный. Часть мер действительно работает, и решают они настоящую проблему, которая не является воровством. Другие выглядят защитой, а по сути ближе к вежливой просьбе. И вообще ничто в формате ПДФ не останавливает человека с кнопкой скриншота, если он решил. Разложить эти три кучки по разным полкам значит не потратить выходные на меры, которые ничего не защищают, и заняться той горсткой, которая окупается.

  <h2>Два вида пароля в ПДФ и почему разница важна</h2>

  <p>ПДФ десятилетиями поддерживает два совершенно разных пароля, и почти вся путаница вокруг защиты растёт из того, что их считают одним.</p>

  <table>
    <thead>
      <tr><th></th><th>Пароль открытия</th><th>Пароль владельца</th></tr>
    </thead>
    <tbody>
      <tr><td>Ещё называют</td><td>Пароль на документ, user password</td><td>Пароль прав, мастер-пароль</td></tr>
      <tr><td>Что делает</td><td>Шифрует файл. Без него содержимое прочитать нельзя вообще</td><td>Выставляет флаги, просящие просмотрщик ограничить печать, копирование или правку</td></tr>
      <tr><td>Чем обеспечен</td><td>Математикой</td><td>Добросовестностью программы-просмотрщика</td></tr>
      <tr><td>Для чего годится</td><td>Отправить конфиденциальный документ одному адресату</td><td>Отбить небрежную правку файла, который люди должны читать</td></tr>
      <tr><td>Годится для платной загрузки</td><td>Нет. Покупателю нужно его открыть</td><td>Едва-едва, как лежачий полицейский</td></tr>
    </tbody>
  </table>

  <p>Последняя строка здесь и есть главная. Пароль открытия это настоящее шифрование, но на товаре его не применить: покупателю надо открыть файл, значит пароль придётся ему отдать, и защиты больше нет. В нашей заметке о том, <a href="/ru/blog/password-protect-pdf-before-emailing/">что на самом деле защищает пароль на ПДФ</a>, разница между двумя видами разобрана подробнее, если вы ещё и конфиденциальные документы рассылаете.</p>

  <p>Пароль владельца это то, что имеют в виду, когда говорят «запретить редактирование». Он записывает в файл флаги прав, и любой добросовестный просмотрщик их соблюдает. Слово «добросовестный» тащит на себе всю фразу. Флаги это не шифрование содержимого, а приложенная к нему записка. Просмотрщики, которые решают записку проигнорировать, находятся элементарно, поэтому <a href="/ru/blog/unlock-pdf-remove-password/">снятие ограничений с ПДФ</a> существует и работает.</p>

  <h2>Что права доступа действительно дают</h2>

  <p>Значит, права бесполезны? Нет, но их ценность не та, которую обычно ожидают. <a href="/ru/pdf-security/protect/">Выставление прав доступа в PDF</a> надёжно достигает трёх вещей:</p>

  <ul>
    <li><strong>Останавливает бытовую аварию.</strong> Покупатель открывает планер, куда-то кликает, сдвигает текстовый блок на 3 мм и потом пишет вам, почему у вас файл битый. Это реальные и частые расходы на поддержку.</li>
    <li><strong>Фиксирует намерение.</strong> Тот, кто снял ограничение, осознанно обошёл препятствие. В споре это принципиально другая позиция, чем «файл был открыт, я и подумал, что можно».</li>
    <li><strong>Отсеивает ленивых.</strong> Большинство тех, кто небрежно переиспользовал бы файл, не пойдёт искать инструмент. Доля меньше, чем хотелось бы, но не нулевая.</li>
  </ul>

  <p>Чего права не делают, так это не защищают содержимое. Кто может прочитать файл, тот может снять скриншот, а кто может его напечатать, тот может напечатать в новый ПДФ. Относитесь к правам как к лежачему полицейскому, отмеряйте на них силы соответственно и никогда не пишите покупателю, что файл «нельзя» скопировать.</p>

  <h2>Сведение: защита, которой реально пользуются</h2>

  <p>Если делать с файлом перед продажей только одно, то <a href="/ru/pdf-edit/flatten/">свести его</a>. Слои, поля форм, комментарии и живые текстовые объекты это всё то, что покупатель может сдвинуть. Сведение собирает их в статичное содержимое страницы, и результат быстрее открывается и предсказуемее печатается в тех странных просмотрщиках, которыми люди реально пользуются.</p>

  <p>Только формулируйте точно, что это такое. Сведение это гигиена файла, а не защита авторских прав. Оно предотвращает аварию, а не копию. И качество печати оно не снижает: слои и интерактивные элементы сливаются без пересчёта картинок, поэтому ничего не размывается. Качество может стоить сжатие, но это отдельное решение.</p>

  <p>Одна оговорка, которую стоит знать: если ваш товар предполагается заполнять на экране, заполняемый планер или форма, сводить его нельзя. Вы уберёте саму фичу. Продавайте заполняемую версию как есть, а если предлагаете ещё и печатную, сводите её.</p>

  <h2>Водяные знаки: полезны на превью, неловки на товаре</h2>

  <p>Водяной знак это единственная мера, ценность которой целиком зависит от того, на какой файл он лёг.</p>

  <ul>
    <li><strong>На страницах превью он ровно к месту.</strong> Покажите две внутренние страницы рабочей тетради с читаемым знаком поверх, и получите маркетинговый эффект, не отдав товар. <a href="/ru/pdf-edit/add-watermark/">Добавление водяного знака</a> занимает минуту, а в нашей заметке про <a href="/ru/blog/watermark-pdf-confidential-draft/">положение и прозрачность</a> разобрано, как сделать его читаемым, не похоронив дизайн.</li>
    <li><strong>На платном файле подумайте дважды.</strong> Видимый знак на товаре, за который заплатили, читается как недоверие и портит постер, который собирались повесить. Продавцам, которые так делают, про это пишут в отзывах.</li>
    <li><strong>Персональный знак это другой инструмент.</strong> Штамп с именем покупателя или номером заказа на его копии действительно отбивает желание делиться, потому что утёкший файл указывает на человека. Но это требует генерировать файл на каждый заказ, то есть систему выдачи, а не галочку. Оправдано для дорогих файлов, избыточно для планера за три доллара.</li>
  </ul>

  <h2>Что реально снижает перепродажу</h2>

  <p>Ни одна техническая мера выше перепродажу не остановит. А эти снижают, насколько это вообще возможно:</p>

  <ol>
    <li><strong>Страница лицензии внутри файла.</strong> Одна страница простым языком: что покупателю можно, что нельзя, входит ли коммерческое использование и как с вами связаться. Это самая ценная вещь в списке. Она снимает добросовестную путаницу, а это большая часть проблемы, и это тот документ, на который вы показываете, когда жалуетесь на копию.</li>
    <li><strong>Ваше имя и адрес магазина в колонтитуле.</strong> Не как защита, а как атрибуция. Файл, который ходит по рукам с вашим именем, это маркетинг, за который вы не платили, и происхождение становится очевидным.</li>
    <li><strong>Механизм жалоб площадки.</strong> Маркетплейсы действительно снимают нарушающие лоты и действуют быстрее, когда вы можете показать дату своего лота и условия лицензии. Скучно и работает.</li>
    <li><strong>Сделать копию менее привлекательной, чем оригинал.</strong> Бесплатные обновления, история версий, дополнительные форматы, поддержка. Пиратский файл это снимок, а живой товар нет.</li>
  </ol>

  <p>Есть ещё стратегический момент, который легко упустить на злости. Те, кто раздаёт дешёвый цифровой файл, в основном и не собирались его покупать, а силы, потраченные на борьбу с ними, это силы, не потраченные на лот, фотографии или следующий товар. Отмерьте на защиту фиксированную небольшую долю и идите дальше.</p>

  <h2>А настоящий DRM?</h2>

  <p>Настоящий DRM, когда файл звонит домой и его можно отозвать, существует и применяется для дорогих корпоративных и академических материалов. Он требует платформы, сервера лицензий и просмотрщика, который покупатель обязан установить. Для печатного шаблона, макета или рабочей тетради он проваливается по своей же логике: ваш покупатель хочет напечатать это на домашнем принтере, а любой формат, который позволяет напечатать, позволяет и сохранить. Не ищите плагин, который обещает иное.</p>

  <h2>Разумный дефолт</h2>

  <table>
    <thead>
      <tr><th>Товар</th><th>Что делать</th></tr>
    </thead>
    <tbody>
      <tr><td>Печатный планер, постер, рабочий лист</td><td>Свести, страница лицензии, атрибуция в колонтитуле. Пароли пропустить</td></tr>
      <tr><td>Заполняемая форма или цифровой планер</td><td>Не сводить. Страница лицензии, права доступа против структурных правок</td></tr>
      <tr><td>Страницы превью для лота</td><td>Водяной знак, низкое разрешение, всего пара страниц</td></tr>
      <tr><td>Дорогой шаблон или тетрадь к курсу</td><td>Рассмотреть персонализацию под заказ и заложить трудозатраты на выдачу</td></tr>
      <tr><td>Конфиденциальный документ клиента</td><td>Пароль открытия, отправленный отдельным каналом. Единственный случай, где шифрование это правильный ответ</td></tr>
    </tbody>
  </table>

  <p>Если вы готовите файл к продаже впервые, остальная работа перед загрузкой важнее защиты: формат страницы, разрешение, встроенные шрифты и вес это то, из-за чего приходят возвраты. В нашем разборе <a href="/ru/blog/sell-printable-pdf-on-etsy/">как подготовить ПДФ для продажи</a> пройден весь чеклист, а <a href="/ru/blog/a4-vs-us-letter-printable-sizes/">выбор между A4 и US Letter</a> закрывает решение про формат, из-за которого больше всего жалоб.</p>

  <h2>Что происходит с файлом, который вы загружаете</h2>

  <p>Наши инструменты работают на сервере, то есть файл загружается. Он удаляется сразу после завершения задачи, а ссылка на скачивание принадлежит только вам. Ничего не индексируется, не хранится и не используется для обучения. Если вы защищаете что-то неопубликованное, в заметке о том, <a href="/ru/blog/is-convertica-safe-pdf-file-security-privacy-explained/">как Convertica обращается с вашими файлами</a>, расписаны правила хранения.</p>

  <h2>Частые вопросы</h2>

  <h3>Можно сделать ПДФ полностью нередактируемым?</h3>
  <p>Можно сделать правку неудобной, и это стоит делать, а невозможной сделать нельзя. Сведение убирает простые ручки, права добавляют флаг, который большинство просмотрщиков соблюдает. Настроенный человек всё равно растеризует страницы, перепечатает текст или снимет ограничения инструментом. Цельтесь в «никаких аварий и никакого небрежного переиспользования» и попадёте; цельтесь в «невозможно» и потеряете выходные.</p>

  <h3>Пароль остановит тех, кто делится моим товаром?</h3>
  <p>Нет, и создаст новую проблему. Пароль открытия придётся выдать каждому покупателю, после чего он публичный, а вы добавили себе поддержку впустую. Пароль владельца открытие вообще не ограничивает. Пароли живут на конфиденциальных документах с известным адресатом, а не на товарах.</p>

  <h3>Законно ли снимать ограничения с моего ПДФ?</h3>
  <p>Снять ограничения с файла, которым владеешь, для собственного использования обычно ничем не примечательно. Сделать это, чтобы распространять или перепродавать вашу работу, в большинстве юрисдикций нарушение авторского права независимо от того, как файл был защищён, и именно поэтому страница лицензии и механизм жалоб важнее флагов.</p>

  <h3>Ставить водяной знак на файл, за который заплатили?</h3>
  <p>Как правило нет. Это сигнал недоверия и порча всего, что предполагалось повесить или вставить в рамку. Исключения это страницы превью, где водяной знак ровно тот инструмент, что нужен, и дорогие файлы, где вы штампуете на копии данные конкретного покупателя, чтобы утечку можно было отследить.</p>

  <h3>Сведение теряет качество или что-то ломает?</h3>
  <p>Картинки оно не пересчитывает и разрешение не меняет, поэтому на качество печати не влияет. Что оно ломает намеренно, так это интерактивность: поля форм перестают заполняться, комментарии перестают правиться. Держите редактируемый исходник и не сводите товар, у которого главная ценность в том, что его можно заполнять.</p>

  <h3>Что вообще должно быть на странице лицензии?</h3>
  <p>Одна страница простым языком: файл для личного использования покупателем; печатать для себя можно сколько угодно; перепродавать, распространять или использовать коммерчески без отдельной лицензии нельзя; вот как связаться за такой лицензией. Прямое перечисление разрешённого предотвращает больше нарушений, чем любая техническая мера, потому что большая часть нарушений это честная неопределённость.</p>

  <h2>Защитите файл и идите дальше</h2>

  <p>Возьмите товар, который собираетесь выложить, прогоните через <a href="/ru/pdf-edit/flatten/">сведение</a>, добавьте страницу лицензии и название магазина в колонтитул, и остановитесь. Если нужны ещё и <a href="/ru/pdf-security/protect/">права доступа</a>, добавьте их, понимая их цену. А потом потратьте остаток дня на лот, который принесёт больше денег, чем любой замок. Остальное лежит во <a href="/ru/all-tools/">всех инструментах</a>.</p>
