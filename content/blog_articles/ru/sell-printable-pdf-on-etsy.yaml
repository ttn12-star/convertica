content_ru: |
  Шаблон, за который просят вернуть деньги, почти никогда не бывает некрасивым. На экране дизайн был в порядке. Случилось другое: покупатель открыл файл на ноутбуке с Windows, и изящный шрифт превратился в Times New Roman. Или распечатал, и рамку срезало с двух сторон. Или картинка, которая в браузере выглядела чёткой, вышла из струйника мылом. Или Etsy просто отказался принимать файл, потому что в нём 34 МБ.

  Получается, работа, которая реально защищает рейтинг магазина, начинается уже после дизайна. Она скучная: формат страницы, разрешение, поля, шрифты, вес. Каждый пункт ломается по-своему, и каждый проверяется за пару минут. Ниже они идут в том порядке, в котором обычно и подводят.

  <h2>Что покупатель на самом деле делает с файлом</h2>

  <p>Все требования ниже растут из одного места, поэтому стоит представить человека на другом конце сделки предметно. Ваш покупатель не типография. Он:</p>

  <ul>
    <li><strong>Печатает дома</strong>, на струйнике или недорогом лазернике, который физически не умеет печатать до края листа.</li>
    <li><strong>Берёт бумагу, которую продают в его стране.</strong> A4 почти везде, US Letter в США и Канаде. Это разные пропорции, а не просто разный размер.</li>
    <li><strong>Открывает файл в том, что есть под рукой</strong>, а это всё чаще телефон или планшет и просмотрщик, который не Acrobat.</li>
    <li><strong>Не станет вам писать про проблему.</strong> Он либо запросит возврат, либо оставит отзыв, и любой из этих вариантов дороже самой продажи.</li>
  </ul>

  <p>ПДФ для всего этого формат правильный, потому что несёт вёрстку в себе. В этом же и ловушка: он несёт ровно ту вёрстку, которую вы ему отдали, включая куски, работавшие только на вашей машине.</p>

  <h2>Формат страницы: пропорции выбираются до всего остального</h2>

  <p>A4 это 210 на 297 мм. US Letter это 216 на 279 мм. Letter шире и короче. Никакой коэффициент масштаба не превращает один в другой, поэтому совет «печатайте с подгонкой под лист» даёт планер с неровными белыми полосами и постер с обрезанными краями.</p>

  <p>Честных вариантов два: выбрать один формат и прямо сказать об этом в описании лота, либо отдавать оба. Большинство работающих магазинов отдают оба, потому что магазин только с A4 тихо теряет американский трафик, а магазин только с Letter теряет всех остальных.</p>

  <p>Отдавать оба означает выгрузить два файла из редактора. Не пытайтесь получить второй формат обрезкой или масштабированием готового ПДФ: обрезка уменьшает страницу до меньшего прямоугольника, и вы получите окно формата Letter в макет A4, где внизу не хватает содержимого. Наша <a href="/ru/pdf-edit/crop/">обрезка PDF</a> нужна, чтобы убрать лишние поля в документе, а не чтобы переводить один бумажный стандарт в другой. Выгрузить дважды из редактора по-прежнему лучший вариант: только исходный файл умеет по-настоящему переверстаться под другие пропорции. Если этого файла уже нет или вы купили готовый шаблон, <a href="/ru/pdf-edit/page-size/">изменение размера страницы PDF</a> делает следующее по качеству: перекладывает страницы на другой лист и, поскольку A4 теряет на Letter 8,8 мм сверху и снизу, сохраняет полный размер, когда ваши поля это позволяют, и уменьшает ровно настолько, когда не позволяют. Оно никогда не обрезает. Это же и практическая причина держать поле 10–12 мм, о котором ниже.</p>

  <h2>300 dpi, и почему экран вас обманывает</h2>

  <p>У экрана порядка 100 точек на дюйм. Бумага различает деталь примерно втрое мельче. Поэтому картинка, которая при полном увеличении в браузере кажется идеально резкой, на печати может выйти заметно мягкой, и заметить это на мониторе нельзя никак.</p>

  <p>Правило простое: 300 dpi в итоговом размере печати. На практике это значит:</p>

  <ul>
    <li><strong>Постеру 20 на 25 см</strong> нужен исходник примерно 2400 на 3000 пикселей. Если оригинал шириной 1000 пикселей, никакие настройки экспорта его не спасут.</li>
    <li><strong>Текст и фигуры не в счёт.</strong> Шрифт, линии и векторные иллюстрации в ПДФ не зависят от разрешения и печатаются так хорошо, как умеет принтер. Планер, собранный целиком из текста и линеек, всегда выйдет резким.</li>
    <li><strong>Рискует только растр.</strong> Фотографии, текстуры, акварельные элементы, отсканированные надписи и всё, что вы нашли в виде JPG или PNG.</li>
  </ul>

  <p>Если собираете макет в браузерном редакторе, выгружайте на максимальном качестве, а не на настройке по умолчанию: дефолт обычно рассчитан на просмотр с экрана.</p>

  <h2>Непечатаемый край и поля, которые он навязывает</h2>

  <p>Домашний принтер держит лист роликами, чтобы его протянуть, поэтому не может положить краску на несколько миллиметров по краю. В зависимости от модели эта мёртвая зона составляет примерно 3–6 мм с каждой стороны и больше по задней кромке.</p>

  <p>Отсюда два следствия, на которых спотыкается почти каждый начинающий продавец:</p>

  <ul>
    <li><strong>Фон навылет дома не работает.</strong> Макет, где цвет уходит за край листа, печатается с тонкими белыми полями, и обычно неровными. Если дизайн без заливки до края не живёт, честно напишите в лоте, что файл рассчитан на типографию.</li>
    <li><strong>Всё важное нужно отодвинуть внутрь.</strong> Текст, номера страниц, чекбоксы и линии отреза держите минимум в 10–12 мм от края. Всё, что ближе, на незнакомом принтере уже лотерея.</li>
  </ul>

  <p>Вторая половина этой проблемы живёт в диалоге печати у покупателя. Большинство просмотрщиков по умолчанию выбирают «вписать в область печати», и это молча уменьшает страницу на несколько процентов и центрирует её. Для планера незаметно. Для всего, что покупатель будет вырезать или сшивать, ощутимо, поэтому добавьте в инструкцию одну строку: печатать в 100 процентов, фактический размер, масштабирование выключено.</p>

  <h2>Шрифты: встроить или превратить в кривые</h2>

  <p>Самая частая поломка файла это шрифт, который не попал в ПДФ. На вашей машине он установлен, поэтому всё выглядит правильно. На компьютере покупателя просмотрщик его не находит и подставляет другой, а это заново перебивает каждую строку и разрушает вёрстку, на которую вы потратили выходные.</p>

  <p>Два способа не попасть, в порядке предпочтения:</p>

  <ul>
    <li><strong>Встроить шрифты при экспорте.</strong> Такая галочка есть в любом серьёзном редакторе, а браузерные делают это сами. Проверить просто: откройте ПДФ и посмотрите свойства документа, там есть вкладка со шрифтами, и напротив каждого должно стоять «Встроен» или «Встроено подмножество».</li>
    <li><strong>Перевести текст в кривые</strong> перед экспортом. Буквы становятся векторными фигурами, и шрифт не нужен вообще. Способ железобетонный и необратимый, поэтому держите отдельно исходник, который ещё можно править.</li>
  </ul>

  <p>Проверяйте на машине, где ваших шрифтов нет, или попросите кого-нибудь открыть файл. Открыть его на своём компьютере не доказывает ничего: ваш компьютер это единственное место, где он гарантированно работает.</p>

  <h2>Сведите файл, но не обманывайтесь насчёт того, что это даёт</h2>

  <p>Слои, поля форм, комментарии и редактируемые текстовые объекты это всё то, что покупатель может случайно сдвинуть, и то, что делает файл тяжелее, чем нужно. <a href="/ru/pdf-edit/flatten/">Сведение ПДФ</a> собирает всё это в одну статичную страницу. Результат быстрее открывается, предсказуемее печатается в странных просмотрщиках и не съезжает от случайного клика.</p>

  <p>Чего сведение не делает, так это не мешает перепродавать вашу работу. Пароль тоже не мешает. Кто может распечатать страницу, тот может её сфотографировать, а ПДФ, который покупатель открывает, он же может и снять скриншотом. Сведение это гигиена файла, а не защита авторских прав. Зато оно реально предотвращает бытовую аварию: покупатель тянет текстовый блок, а потом спрашивает, почему у вас файл битый.</p>

  <p>Если хочется дополнительно отсечь случайные правки, <a href="/ru/pdf-security/protect/">права доступа в PDF</a> умеют запретить редактирование и копирование, оставив файл открытым для чтения и печати. Относитесь к этому как к лежачему полицейскому. В нашем разборе про то, <a href="/ru/blog/password-protect-pdf-before-emailing/">что на самом деле защищает пароль на ПДФ</a>, разница между двумя видами пароля разложена подробно, и знать её стоит до того, как полагаться на любой из них.</p>

  <h2>Вес файла: настоящее ограничение это 20 МБ у Etsy</h2>

  <p>На момент написания Etsy принимает цифровые файлы до 20 МБ каждый, не больше пяти файлов на лот. Именно это число, а не ваш дизайн, определяет, как собирать комплект. Три практических следствия:</p>

  <ul>
    <li><strong>Комплект на несколько форматов вылетает за пять файлов моментально.</strong> Четыре формата на три цветовые версии это двенадцать файлов. Стандартный ответ ZIP: архив занимает один слот из пяти, а распаковать его умеет любая система.</li>
    <li><strong>Тяжёлый планер тяжёлый из-за картинок.</strong> ПДФ из одного текста весит копейки. Если в планере на 40 страниц набралось 30 МБ, значит, там работает подложка на всю страницу или текстура.</li>
    <li><strong>Сжимайте последним шагом и проверяйте результат на бумаге.</strong> Наш <a href="/ru/pdf-organize/compress/">сжиматель PDF</a> оставляет текст и вектор в полном качестве и пережимает картинки, а это ровно правильный обмен для текстового планера и ровно неправильный для фотографического постера. Для арта распечатайте страницу до и после и посмотрите глазами. Если уложиться без видимых потерь не получается, лучше разделите лот.</li>
  </ul>

  <p>Если пошли путём архива и хотите закрыть саму загрузку, можно <a href="/ru/archive/protect/">поставить пароль на ZIP</a>, хотя для платного товара это обычно порождает больше сообщений в поддержку, чем предотвращает.</p>

  <h2>Многостраничным товарам нужны номера страниц</h2>

  <p>Любой товар, который покупатель печатает комплектом, то есть планеры, рабочие тетради, наборы прописей, требует нумерации. Без неё человек, который распечатал 40 страниц и рассыпал стопку, никак не соберёт её обратно, и это станет вашей проблемой.</p>

  <p>Ставьте номера в самом конце, когда порядок страниц уже финальный, через <a href="/ru/pdf-edit/add-page-numbers/">добавление номеров страниц</a>. Держите их внутри безопасной зоны из раздела выше, потому что номер в 5 мм от края принтер съедает первым. В <a href="/ru/blog/add-page-numbers-to-pdf/">подробном разборе нумерации</a> есть про позицию и стартовый отсчёт, если нужно пропустить обложку.</p>

  <h2>Превью для лота, а не сам товар</h2>

  <p>Картинки в лоте должны показывать товар, не будучи товаром. Выгрузите страницу картинкой через <a href="/ru/pdf-to-jpg/">PDF в JPG</a> для аккуратного мокапа, а если хотите показать внутренние страницы платной тетради, сначала прогоните их через <a href="/ru/pdf-edit/add-watermark/">водяной знак</a>. В нашей заметке про <a href="/ru/blog/watermark-pdf-confidential-draft/">водяные знаки на ПДФ</a> разобраны положение и прозрачность: для превью знак нужен читаемый, но не настолько плотный, чтобы покупатель не смог оценить дизайн.</p>

  <h2>Проверка из восьми пунктов перед загрузкой</h2>

