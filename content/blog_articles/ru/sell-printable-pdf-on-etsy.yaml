  <p>Один прогон занимает десять минут. Тот же прогон после запроса на возврат занимает десять минут плюс отзыв, который уже не удалить.</p>

  <h2>Что происходит с файлом, который вы загружаете</h2>

  <p>Наши инструменты работают на сервере, то есть файл загружается. Он удаляется сразу после завершения задачи, а ссылка на скачивание принадлежит только вам. Ничего не индексируется, не хранится и не используется для обучения. Для неопубликованных товаров кому-то всё равно неспокойно, и это нормально: в заметке о том, <a href="/ru/blog/is-convertica-safe-pdf-file-security-privacy-explained/">как Convertica обращается с вашими файлами</a>, правила хранения расписаны, чтобы можно было решить самому.</p>

  <h2>Частые вопросы</h2>

  <h3>Продавать в A4 или в US Letter?</h3>
  <p>Если можете, отдавайте оба и понятно подпишите их внутри архива. Если приходится выбирать, ориентируйтесь на источник трафика: A4 для большей части мира, US Letter для магазина, нацеленного на США и Канаду. Чего делать нельзя, так это отдать один формат и промолчать: это превращается в запрос возврата от той половины мира, у которой в руках другая бумага.</p>

  <h3>Нужны ли вылеты на печатном шаблоне?</h3>
  <p>Для домашней печати нет, и добавление вылетов обычно делает хуже: макет с вылетами предполагает подрезку после печати, а у покупателя резака нет. Вместо этого рисуйте по формату с безопасным полем. Вылеты нужны только если вы отдельно продаёте версию для типографии, и тогда это отдельный файл.</p>

  <h3>Можно ли запретить покупателям перепродавать мой ПДФ?</h3>
  <p>Технически нет. Любой файл, который покупатель может открыть и распечатать, можно скопировать. Права доступа и пароли останавливают только случайную правку. Работает скучная комбинация: страница с лицензией внутри файла, где написано, что покупателю можно и чего нельзя, плюс механизм жалоб площадки, когда вы находите копию.</p>

  <h3>Планер весит 45 МБ. Что резать первым?</h3>
  <p>Искать картинки. Подложка на всю страницу, бумажная текстура или фотографическая обложка почти всегда объясняют весь вес, и замена текстуры на плоский цвет или аккуратный векторный паттерн срезает файл в разы. Сжатие только после этого, и с проверкой распечатанной страницы.</p>

  <h3>Отдавать один ПДФ или ZIP?</h3>
  <p>Один ПДФ, если товар это одна вещь в одном формате: каждый лишний шаг теряет покупателей, которые открывают загрузку с телефона. ZIP как только появляются несколько форматов или цветовых версий, потому что архив держит вас внутри лимита на пять файлов и наводит порядок в названиях. Если собираете комплект, называйте файлы так, чтобы они были понятны вне контекста: наша заметка про <a href="/ru/blog/pdf-naming-conventions-best-practices/">правила именования файлов</a> написана про документы, но подходит один в один.</p>

  <h3>Сведение снижает качество печати?</h3>
  <p>Нет. Сведение собирает слои и интерактивные элементы в статичное содержимое страницы, оно не пересчитывает картинки и не меняет разрешение. Качество может стоить сжатие, но это отдельное решение.</p>

  <h2>Подготовьте файл</h2>

  <p>Возьмите товар, который ближе всего к публикации, и прогоните по восьми пунктам сейчас, до того как писать описание. Большинству файлов нужны две правки: <a href="/ru/pdf-edit/flatten/">свести</a> и, для многостраничных наборов, <a href="/ru/pdf-edit/add-page-numbers/">поставить номера страниц</a>. Сжимать только если заставляет площадка, через <a href="/ru/pdf-organize/compress/">сжатие PDF</a>, и с распечатанной страницей перед глазами. Остальное лежит во <a href="/ru/all-tools/">всех инструментах</a>.</p>
