  summary: "Руководство по симптомам для файлов HEIC, которые не открываются, разбитое по платформам, потому что каждая ломается по-своему. Windows: встроенному приложению «Фотографии» нужны бесплатные HEIF Image Extensions плюс платные HEVC Video Extensions, и отсутствие кодека выглядит как серый прямоугольник или невнятная ошибка. Android: поддержка появилась в версии 10, старые телефоны и многие галереи формат не декодируют. macOS: поддержка есть с High Sierra, но 10-битный HEIC с новых айфонов всё ещё может не открыться на старой машине. Также объясняется, почему файл из мессенджера иногда приходит в JPEG, а иногда в HEIC, и когда сконвертировать быстрее, чем чинить систему."
