content_ru: |
  Файл HEIC, который на айфоне открывается мгновенно, в другом месте может быть совершенно безжизненным, и причина у каждой системы своя. Поэтому вместо общего списка починок начните с поиска своего симптома.

  <h2>Windows: кодек, за который Microsoft берёт деньги</h2>

  <p>Самый частый и самый раздражающий случай, потому что решение состоит из двух половин и бесплатна только одна.</p>

  <p>Windows 10 и 11 умеют показывать HEIC, но только при установленных двух компонентах:</p>

  <ul>
    <li><strong>HEIF Image Extensions.</strong> Бесплатно в Microsoft Store. Отвечает за контейнер.</li>
    <li><strong>HEVC Video Extensions.</strong> Платно, Microsoft просит за него небольшую сумму. Отвечает за собственно декодирование картинки, потому что изображения в HEIC закодированы кодеком HEVC.</li>
  </ul>

  <p>Поставите только первый и получите ровно то полурабочее состояние, которое все описывают: миниатюры вроде появились, а при открытии файла ошибка или пустой серый прямоугольник. Контейнер понят, картинка внутри нет.</p>

  <p>Есть нюанс, который стоит знать. На части компьютеров расширение HEVC уже лицензировано производителем, поэтому один коллега открывает файл без проблем, а другой нет, при внешне одинаковой версии Windows.</p>

  <h3>Симптомы и что они означают в Windows</h3>

  <ul>
    <li><strong>Серый прямоугольник или «не удаётся отобразить».</strong> HEIF стоит, HEVC нет.</li>
    <li><strong>У файла пустой значок, «Фотографии» вообще его не берут.</strong> Не установлено ни одно расширение.</li>
    <li><strong>Миниатюры в проводнике есть, в просмотрщике пусто.</strong> То же, что первый случай: миниатюра берётся из встроенного превью, а не из полного декодирования.</li>
    <li><strong>«Фотографии» открывают, но редактирование падает.</strong> Декодирование работает, конвейер редактирования формат не поддерживает. Конвертируйте перед правкой.</li>
  </ul>

  <p>Если вам нужна только картинка, сконвертировать быстрее, чем покупать и ставить кодек. <a href="/ru/image/heic-to-jpg/">Конвертер HEIC в JPG</a> работает в браузере и отдаёт файл, который Windows понимает с девяностых.</p>

  <h2>Android: всё зависит от версии</h2>

  <p>Системная поддержка HEIF появилась в Android 10. До неё в системе нет ничего, что декодирует формат, и файл просто нечитаем без приложения со своим декодером.</p>

  <p>Но и на Android 10 и новее поддержка неоднородна. Система декодировать умеет, а вот галереи и файловые менеджеры сами решают, пользоваться этим или нет. Поэтому встречается ситуация, когда Google Фото снимок показывает, а штатная галерея того же телефона нет.</p>

  <p>Проверять стоит в таком порядке:</p>

  <ul>
    <li>Откройте файл в Google Фото или другом приложении, про которое известно, что оно работает с HEIF, прежде чем решать, что телефон не может.</li>
    <li>Посмотрите версию Android. Ниже 10 ни одно приложение, опирающееся на системный декодер, не справится, нужно со своим.</li>
    <li>Если файл пришёл из мессенджера, посмотрите на расширение. Часть приложений конвертирует на входе, часть нет, отсюда и ситуация, когда одно фото от того же отправителя открывается, а другое нет.</li>
  </ul>

  <h2>macOS: обычно нормально, с одним исключением</h2>

  <p>Маки работают с HEIC со времён High Sierra, поэтому файл, не открывающийся на более-менее современном маке, это редкость. Если такое случилось, причина обычно одна из этих:</p>

  <ul>
    <li><strong>Старая macOS.</strong> Всё, что до High Sierra, поддержки не имеет вообще.</li>
    <li><strong>10-битный HEIC.</strong> Новые айфоны умеют писать 10-битные файлы, и машины постарше, которые обычный HEIC берут, на этих спотыкаются. На телефоне открывается, на маке нет, и в тексте ошибки об этом ни слова.</li>
    <li><strong>Стороннее приложение вместо системного.</strong> Просмотр и Фото используют системный декодер. Старый графический редактор может и не использовать.</li>
  </ul>

  <h2>Почему одно фото открывается, а следующее нет</h2>

  <p>Из-за этого люди решают, что файл повреждён, хотя он цел. Два обычных объяснения:</p>

  <p><strong>Отправляющее приложение часть файлов сконвертировало, часть нет.</strong> Несколько мессенджеров переводят HEIC в JPEG при отправке «как фото» и пропускают оригинал при отправке «как файл». Тот же отправитель, тот же телефон, разный результат, и зависит целиком от того, какую кнопку нажали.</p>

  <p><strong>Снимок сделан в другом режиме.</strong> Live Photos, портретные кадры и серии хранятся иначе, и просмотрщик, справляющийся с обычным HEIC, может отказать одному из них.</p>

  <p>Прежде чем считать файл битым, посмотрите на расширение и размер. Файл в несколько килобайт действительно битый. Файл на два мегабайта в порядке, а не в порядке ваш просмотрщик.</p>

  <h2>Как убрать проблему в источнике</h2>

  <p>Если снимаете вы сами и упираетесь в это регулярно, настройка на айфоне лежит в разделе «Камера», «Форматы». «Высокая эффективность» пишет HEIC, «Наиболее совместимые» пишет JPEG.</p>

  <p>Прежде чем переключать, взвесьте: файлы JPEG примерно в 1,8 раза тяжелее при той же видимой картинке, мы замерили это подробно в <a href="/ru/blog/heic-vs-jpeg-quality-and-size/">сравнении HEIC и JPEG</a>. Смена настройки камеры стоит вам места на каждом снимке навсегда ради того, чтобы избежать редкой конвертации. Большинству это невыгодный обмен.</p>

  <p>Есть и промежуточный вариант, о котором забывают. Продолжайте снимать в HEIC, а «Перенос на Mac или ПК» поставьте на «Автоматически» вместо «Переносить оригиналы». Тогда телефон конвертирует на выходе, и снимки приезжают уже в JPEG, а хранятся по-прежнему.</p>

  <h2>Частые вопросы</h2>

  <h3>Почему Windows берёт деньги за HEVC Video Extensions?</h3>
  <p>HEVC это запатентованный кодек с лицензионными отчислениями, и Microsoft перекладывает их на пользователя. Расширение HEIF Image Extensions, отвечающее за контейнер, бесплатно, но само по себе показать картинку не может.</p>

  <h3>Я поставил расширение, а файл всё равно не открывается.</h3>
  <p>Скорее всего вы поставили HEIF Image Extensions, но не HEVC Video Extensions. Эта комбинация даёт ровно такой результат: файл распознан, но не декодируется.</p>

  <h3>Можно открыть HEIC вообще ничего не устанавливая?</h3>
  <p>Да. Сконвертируйте в браузере и откройте JPEG, который поддерживают все системы. Обычно это быстрее установки кодека, и это единственный вариант на машине, куда нельзя ставить софт.</p>

  <h3>На андроиде Google Фото снимок показывает, а галерея нет.</h3>
  <p>Приложения сами решают, пользоваться ли системным декодером HEIF. Google Фото пользуется, часть фирменных галерей нет. С файлом всё хорошо.</p>

  <h3>Миниатюры HEIC видны, а сами изображения не открываются?</h3>
  <p>Миниатюры часто берутся из маленького превью внутри файла, которому декодирование HEVC не нужно. Видимая миниатюра говорит, что файл цел, а не что ваша система умеет его декодировать.</p>

  <h3>Конвертация в JPEG испортит качество?</h3>
  <p>Нет. Мы это замерили: PSNR от 42 до 52 дБ и SSIM выше 0,995, это далеко за порогом, где разницу видно. Платите вы размером файла, а не качеством картинки.</p>

  <h2>Когда нужна просто картинка</h2>

  <p>Ставить кодеки имеет смысл, если вы работаете с такими файлами ежедневно. Ради десятка снимков от родственника конвертация занимает секунды: закиньте их в <a href="/ru/image/heic-to-jpg/">конвертер HEIC в JPG</a> и получите файлы, которые открываются везде. Тот же инструмент пишет PNG, когда нужна прозрачность, и PDF (ПДФ), когда адресату нужен документ, а не картинка. Если результат всё ещё тяжеловат для формы загрузки, <a href="/ru/image/optimize/">оптимизатор изображений</a> его ужмёт.</p>
