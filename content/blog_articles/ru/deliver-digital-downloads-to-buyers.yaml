content_ru: |
  С файлом можно всё сделать правильно и всё равно потерять покупателя в последние десять секунд. Выдача это та часть цифрового товара, которую продавцы проектируют случайно: файлов было четыре, вы их заархивировали, и теперь часть покупателей не может открыть покупку на том устройстве, с которого её оплатила.

  Почти всё закрывается тремя решениями.

  <h2>Решение 1: один файл или архив</h2>

  <p>Инстинкт говорит сложить всё вместе. Сопротивляйтесь, когда можно, потому что архив это реальное препятствие для ощутимой доли покупателей.</p>

  <table>
    <thead>
      <tr><th>Один ПДФ, когда</th><th>Архив, когда</th></tr>
    </thead>
    <tbody>
      <tr><td>Товар это одна вещь в одном формате</td><td>У вас несколько бумажных форматов или цветовых версий</td></tr>
      <tr><td>Вы влезаете в лимит на один файл</td><td>Иначе вы вылезете за лимит площадки по числу файлов</td></tr>
      <tr><td>Большая часть трафика мобильная</td><td>Товар действительно набор, который покупатель будет разбирать</td></tr>
    </tbody>
  </table>

  <p>Если у вас два-три файла и площадка позволяет два-три файла, загрузите их отдельно. Покупатель нажимает на нужный и всё. Это строго лучше, чем заставлять всех распаковывать архив, чтобы добраться до того же файла.</p>

  <h2>Решение 2: что делает телефон</h2>

  <p>Большая доля покупателей открывает покупку на телефоне, часто в течение минуты после оплаты, часто стоя где-то. Что этот человек переживает с архивом:</p>

  <ul>
    <li><strong>Старым Android и iOS нужен лишний шаг</strong>, чтобы дойти от скачанного архива до читаемого ПДФ. Свежие версии справляются, но слово «свежие» в этой фразе тащит много, а у ваших покупателей не у всех новые телефоны.</li>
    <li><strong>Распакованные файлы часто ложатся в одну плоскую папку</strong>, и ваша структура каталогов исчезает. Если два файла различались только папкой, теперь они не различаются.</li>
    <li><strong>Загрузка на 40 МБ по мобильному интернету</strong> это пауза, а пауза это место, где закрывают вкладку и собираются вернуться.</li>
  </ul>

  <p>Из этого не следует «никогда не использовать архив». Следует: если используете, назовите файлы так, чтобы они выжили распаковку, и держите загрузку достаточно маленькой, чтобы она докачалась в электричке.</p>

  <h2>Решение 3: вес, на каждый файл</h2>

  <p>Лимиты площадок считаются на файл, а не на комплект, и именно это различие определяет упаковку. Маркетплейсы обычно ограничивают каждый цифровой файл примерно 20 МБ, а число файлов на лот пятью, поэтому комплект из четырёх форматов в трёх цветах обязан стать архивом, хотите вы того или нет. Сверьтесь с актуальными числами своей площадки, прежде чем строить комплект вокруг них.</p>

  <p>Если вы за лимитом, ищите причину, прежде чем хватать сжатие. ПДФ из одного текста весит копейки, а планер на 30 МБ весит столько из-за подложки на всю страницу или бумажной текстуры. Замена этой текстуры на плоский цвет обычно срезает файл в разы и ничего не стоит на домашней печати. И только потом берите <a href="/ru/pdf-organize/compress/">сжатие PDF</a>, которое держит текст и вектор в полном качестве и пережимает картинки, и распечатайте одну страницу, прежде чем доверять результату.</p>

  <h2>Ставить ли пароль на архив?</h2>

  <p>Можно <a href="/ru/archive/protect/">поставить пароль на ZIP</a>, и для платной загрузки обычно не стоит. Арифметика недобрая: пароль теперь нужен каждому покупателю, значит он живёт в описании лота или в письме с выдачей, значит он ничего не защищает, а при этом часть покупателей не сумеет его правильно ввести и напишет вам.</p>

  <p>Случаи, где смысл есть, узкие: файл уходит одному конкретному клиенту, предрелизная копия обозревателю или комплект, который вы отправляете вне площадки конкретному человеку. В нашей заметке про <a href="/ru/blog/how-to-password-protect-a-zip-file/">пароль на ZIP-архив</a> разобрана механика, а более широкий вопрос о том, что вообще даёт защита, разобран в <a href="/ru/blog/stop-buyers-editing-reselling-your-pdf/">что мешает покупателю править и перепродавать ПДФ</a>. Коротко: для товаров работает страница лицензии, а не пароль.</p>

  <h2>Что покупатель должен увидеть первым</h2>

  <p>Считайте, что покупатель распакует всё в папку загрузок и ничего не прочитает. Проектируйте под этого человека:</p>

  <ul>
    <li><strong>Имена файлов, называющие товар и вариант</strong> и больше ничего. <code>weekly-planner-A4.pdf</code>, а не <code>final_v3.pdf</code>.</li>
    <li><strong>Одна короткая страница-инструкция</strong>, и только одна. Если вы кладёте текстовый файл <code>READ ME FIRST.txt</code> рядом с четырьмя ПДФ, большинство его не прочтёт, поэтому важную строку продублируйте внутри самого ПДФ.</li>
    <li><strong>Инструкция по печати, сказанная один раз и прямо.</strong> Печатать в 100 процентов, фактический размер, масштабирование выключено. Эта одна строка предотвращает больше жалоб, чем всё остальное в этой статье.</li>
  </ul>

  <h2>Запрос повторной выдачи</h2>

  <p>Он приходит всегда: покупатель потерял файл, сменил телефон или упёрся в истёкшую ссылку. Решите свой ответ заранее, а не сочиняйте его в одиннадцать вечера.</p>

  <ul>
    <li><strong>Знайте политику ссылок своей площадки.</strong> Где-то ссылки истекают, где-то есть счётчик скачиваний, где-то они живут, пока жив аккаунт. Без этого знания покупателю не ответить.</li>
    <li><strong>Храните точный выданный файл по каждой версии.</strong> Если вы отдавали две версии, нужно понимать, какую купил этот покупатель. Вот здесь и окупается отметка версии из предпусковой проверки.</li>
    <li><strong>Говорите «да» и идите дальше.</strong> Переслать файл вам ничего не стоит и покупает лояльность у того, кто уже заплатил. Спорить стоит отзыва.</li>
  </ul>

  <h2>Чеклист выдачи</h2>

  <table>
    <thead>
      <tr><th>Проверка</th><th>Зачем</th></tr>
    </thead>
    <tbody>
      <tr><td>Отдельные файлы, если площадка позволяет по количеству</td><td>Убирает шаг с архивом целиком</td></tr>
      <tr><td>Каждый файл под лимитом на файл</td><td>Лимит считается на файл, а не на комплект</td></tr>
      <tr><td>Имена файлов осмысленны после распаковки</td><td>Структура папок исчезает</td></tr>
      <tr><td>Загрузка открывается на телефоне в два касания</td><td>Именно там происходит большинство первых открытий</td></tr>
      <tr><td>Одна страница инструкции, масштаб печати указан</td><td>Снимает самую частую жалобу</td></tr>
      <tr><td>Без пароля, если нет конкретного адресата</td><td>Ничего не защищает, порождает сообщения</td></tr>
      <tr><td>Вы знаете политику истечения ссылок</td><td>Вас об этом спросят</td></tr>
      <tr><td>Вы храните выданный файл по версиям</td><td>Для повторной выдачи нужна правильная копия</td></tr>
    </tbody>
  </table>

  <p>Если вы ещё не прошли проход по файлу и лоту, то он идёт раньше: наш <a href="/ru/blog/digital-product-pdf-checklist-before-you-publish/">предпусковой чеклист</a> это тот рубеж, а <a href="/ru/blog/sell-printable-pdf-on-etsy/">подготовка ПДФ для продажи</a> закрывает сам файл.</p>

  <h2>Что происходит с файлом, который вы загружаете</h2>

  <p>Наши инструменты работают на сервере, то есть файл загружается. Он удаляется сразу после завершения задачи, а ссылка на скачивание принадлежит только вам. Ничего не индексируется, не хранится и не используется для обучения. В заметке о том, <a href="/ru/blog/is-convertica-safe-pdf-file-security-privacy-explained/">как Convertica обращается с вашими файлами</a>, расписаны правила хранения.</p>

  <h2>Частые вопросы</h2>

  <h3>Неужели архив это такое трение?</h3>
  <p>На компьютере нет. На телефоне это лишний шаг, который часть покупателей не доведёт до конца, а телефон это место, где происходит много первых открытий. Смысл не в том, что архивы плохи, а в том, что они должны быть решением, а не дефолтом. Если два отдельных файла вписываются в правила площадки, отдавайте два отдельных файла.</p>

  <h3>Какой общий вес загрузки разумен?</h3>
  <p>Достаточно маленький, чтобы докачался по мобильному интернету, и покупатель не начал думать, не завис ли он. Для печатного шаблона это единицы мегабайт у большинства товаров. Если вы сильно выше, причина почти всегда картинка, и найти её лучше, чем сжимать вокруг неё.</p>

  <h3>Нужен ли файл read-me?</h3>
  <p>Один, короткий, и продублируйте критичную строку внутри самого ПДФ, потому что текстовый файл рядом с четырьмя ПДФ в основном остаётся непрочитанным. Критичная строка это масштаб печати.</p>

  <h3>Можно ли запретить делиться ссылкой на скачивание?</h3>
  <p>Осмысленно нет, и потери редко приходят оттуда. Ссылки площадок обычно привязаны к заказу, а тот, кто решил поделиться, поделится файлом, а не ссылкой. Потратьте силы на страницу лицензии.</p>

  <h3>Покупатель пишет, что файл не открывается. Что спросить первым?</h3>
  <p>Какое устройство и распаковал ли он архив. Эти два вопроса закрывают большинство сообщений «не открывается», потому что обычные ответы это старый телефон и нераспакованный ZIP. Следующий вопрос про просмотрщик: предпросмотр в браузере иногда падает на файле, который в PDF-приложении открывается нормально.</p>

  <h3>Нужно ли отдавать A4 и US Letter отдельно?</h3>
  <p>Если лимит площадки по числу файлов позволяет, да, и подпишите их в имени файла. Это самый понятный возможный ответ на вопрос про формат, и он спасает покупателя от открытия не того файла. Почему стоит отдавать оба, разобрано в <a href="/ru/blog/a4-vs-us-letter-printable-sizes/">A4 или US Letter</a>.</p>

  <h2>Почините свою выдачу</h2>

  <p>Откройте собственный последний заказ так, как это сделал бы покупатель, с телефона, и посчитайте касания до читаемой страницы. Если их больше двух, лечится это обычно разделением архива на отдельные файлы или переименованием так, чтобы они были понятны сами по себе. Если архив всё же нужен и его надо закрыть под конкретного адресата, тогда <a href="/ru/archive/protect/">ставьте пароль на ZIP</a>, и только тогда. Остальное лежит во <a href="/ru/all-tools/">всех инструментах</a>.</p>
