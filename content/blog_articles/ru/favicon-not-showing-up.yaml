content_ru: |
  Иконку нарисовали, на сервер положили, тег в шапку добавили, а во вкладке браузера всё тот же серый листок. Классическая ситуация: вроде всё правильно, и вроде ничего не работает. Именно поэтому люди перезаливают один и тот же файл по шесть раз.

  Хорошая новость в том, что реальных причин мало. Идите по списку сверху вниз, порядок соответствует тому, как часто каждая из них оказывается виноватой. Большинство останавливается на втором пункте.

  <h2>Нулевой шаг: убедитесь, что файл вообще на месте</h2>

  <p>Прежде чем трогать что-то ещё, откройте иконку по её собственному адресу. Просто вбейте в адресную строку:</p>

  <p><code>https://вашсайт.ru/favicon.ico</code></p>

  <p>Должна открыться сама картинка на белом фоне. Вместо этого может произойти три вещи, и каждая указывает в свою сторону:</p>

  <ul>
    <li><strong>Страница 404.</strong> Файл лежит не там, где вы думаете. Переходите сразу к разделу про пути.</li>
    <li><strong>Открылась главная страница.</strong> Сервер молча заворачивает неизвестные адреса обратно на сайт. Значит, файла нет, а фреймворк это прикрывает. Лечится так же, как 404, но по коду ответа вы бы этого не заметили.</li>
    <li><strong>Значок битой картинки.</strong> Файл есть, но браузер не может его прочитать. Это история про переименование, она ниже.</li>
  </ul>

  <p>Если иконка по прямой ссылке открывается нормально, с файлом всё в порядке, и проблема либо в кеше, либо в разметке.</p>

  <h2>Причина 1: кеш, и он хуже, чем кажется</h2>

  <p>Браузеры кешируют фавиконы гораздо агрессивнее, чем всё остальное. Обычная перезагрузка их не перезапрашивает. Жёсткая перезагрузка в большинстве браузеров тоже. Хранилище иконок живёт отдельно от обычного кеша страниц и переживает то, что по вашим ожиданиям должно было его очистить.</p>

  <p>Поэтому не верьте перезагрузке. Проверяйте иначе:</p>

  <ul>
    <li>Откройте сайт в приватном окне. Свежий профиль, пустое хранилище иконок.</li>
    <li>Или откройте адрес иконки напрямую, а потом перезагрузите страницу.</li>
    <li>Или посмотрите с телефона либо из браузера, которым вы этот сайт никогда не открывали.</li>
  </ul>

  <p>Если в приватном окне иконка есть, а в обычном нет, ответ уже получен. Ничего не сломано. Ваш браузер просто держится за старую картинку и отпустит её сам за несколько дней.</p>

  <p>Отдельная оговорка, если перед сайтом стоит CDN. Cloudflare и аналоги кешируют иконку и на своей стороне, и очистка вашего браузера туда не дотянется. Сбросьте файл в панели CDN, потом проверяйте в приватном окне.</p>

  <h2>Причина 2: путь в теге link</h2>

  <p>Вот на этом спотыкаются чаще всего, и почти всегда виноват относительный путь. Смотрите:</p>

  <p><code>&lt;link rel="icon" href="favicon.ico"&gt;</code></p>

  <p>На главной он раскрывается в <code>/favicon.ico</code> и работает. На странице <code>/blog/moya-statya/</code> он раскрывается в <code>/blog/moya-statya/favicon.ico</code>, а такого файла нет. Иконка то появляется, то исчезает, и это выглядит случайным, пока не заметишь закономерность.</p>

  <p>Всегда пишите путь от корня, со слешем в начале:</p>

  <p><code>&lt;link rel="icon" href="/favicon.ico"&gt;</code></p>

  <p>Заодно проверьте, что тег стоит внутри <code>&lt;head&gt;</code>. Оказавшийся в теле страницы link просто игнорируется, и никто вас об этом не предупредит.</p>

  <h2>Причина 3: файл переименовали, а не сконвертировали</h2>

  <p>Если переименовать <code>logo.png</code> в <code>favicon.ico</code>, файл не станет иконкой. Он станет PNG с обманчивым именем. Некоторые браузеры милосердны и покажут его всё равно, и вот это самое неприятное: у вас работает, а у посетителя с другим браузером нет, и вы этот баг никогда не увидите.</p>

  <p>ICO это контейнер со своим заголовком. Внутри может лежать несколько размеров сразу, ради этого формат и дожил до наших дней. У PNG такой структуры нет вообще.</p>

  <p>Конвертируйте нормально, а не переименовывайте. <a href="/ru/image/png-to-ico/">Конвертер PNG в ICO</a> собирает настоящий многоразмерный ICO, а <a href="/ru/image/svg-to-ico/">SVG в ICO</a> делает то же самое из вектора. Если нужен весь комплект сразу, включая PNG-размеры и иконку для Apple, <a href="/ru/image/favicon-generator/">генератор фавиконов</a> соберёт полный пакет из одной загрузки.</p>

  <h2>Причина 4: иконка лежит не в корне</h2>

  <p>Когда тега нет, браузер ищет <code>/favicon.ico</code> в самом верху домена. Если сайт живёт в подпапке или вы выложили его как проектную страницу, а не на корень домена, автоматический запрос промахивается.</p>

  <p>Особенно часто это на статическом хостинге. У сайта по адресу <code>username.github.io/project/</code> корень это <code>username.github.io</code>, туда автоматический запрос и уходит. Вашу иконку в папке проекта никто не спрашивает.</p>

  <p>Выхода два: положить файл в настоящий корень домена или явно указать его реальное место тегом link. Явный тег надёжнее, и он вам всё равно понадобится, как только размеров станет больше одного.</p>

  <h2>Причина 5: сервер отдаёт не то</h2>

  <p>Некоторые конфигурации возвращают HTML-страницу ошибки со статусом 200. Браузер просит иконку, получает страницу и не показывает ничего. А поскольку статус говорит «успех», во вкладке сети с первого взгляда всё выглядит нормально.</p>

  <p>Посмотрите, что приходит на самом деле:</p>

  <p><code>curl -I https://вашсайт.ru/favicon.ico</code></p>

  <p>Для ICO нужен <code>content-type: image/x-icon</code> или <code>image/vnd.microsoft.icon</code>, для PNG-иконки <code>image/png</code>. Если видите <code>text/html</code>, сервер отдаёт страницу, а не файл.</p>

  <p>Заодно загляните в <code>robots.txt</code>. Закрытая папка с иконками браузеру не помешает, а вот поисковику помешает, и это важно для следующего раздела.</p>

  <h2>Причина 6: движок сайта подставляет свой тег</h2>

  <p>WordPress, Shopify, Squarespace и Wix вставляют собственную разметку фавикона из настроек темы. Если вы руками добавили свой тег в шаблон, тегов стало два, и обычно побеждает тот, что подставил движок, потому что он идёт в шапке ниже.</p>

  <p>Посмотрите исходный код готовой страницы, а не шаблона, и поищите <code>rel="icon"</code>. Нашли больше одного, уберите свой и задайте иконку через штатное поле движка. В WordPress это «Значок сайта» в настройках внешнего вида, и он хочет квадратную картинку от 512 пикселей.</p>

  <h2>Причина 7: у выдачи Google свои сроки</h2>

  <p>Это уже другая проблема в том же костюме. В браузере иконка видна, а рядом со ссылкой в поиске её нет, и сколько кеш ни чисти, ничего не меняется.</p>

  <p>У Google отдельный кеш фавиконов, который обновляется по своему графику. Несколько недель это норма. Кнопки «ускорить» не существует. Что в ваших силах, так это убрать всё, что помешает обновлению, когда оно дойдёт:</p>

  <ul>
    <li>Иконка должна быть доступна Googlebot, то есть не за robots.txt и не за авторизацией.</li>
    <li>Она должна быть квадратной и не меньше 48 на 48 пикселей. Меньшие просто игнорируются.</li>
    <li>Одна и та же иконка должна действовать на весь сайт и быть объявлена на главной.</li>
    <li>Адрес файла должен быть стабильным. Смена имени при каждом деплое обнуляет отсчёт.</li>
  </ul>

  <p>Когда это выполнено, остаётся только терпение.</p>

  <h2>Короткий чеклист</h2>

  <ul>
    <li>Открывается ли иконка по прямому адресу?</li>
    <li>Проверили в приватном окне, прежде чем делать выводы?</li>
    <li>Путь в <code>href</code> абсолютный, со слешем в начале?</li>
    <li>Тег внутри <code>&lt;head&gt;</code> и он единственный?</li>
    <li>Файл сконвертирован в ICO, а не переименован?</li>
    <li><code>curl -I</code> возвращает тип картинки, а не HTML?</li>
    <li>Если есть CDN, сбросили кеш на его стороне?</li>
    <li>Для поиска: иконка квадратная, от 48 пикселей и открыта роботу?</li>
  </ul>

  <h2>Частые вопросы</h2>

  <h3>Почему фавикон виден на одних страницах и пропадает на других?</h3>
  <p>Относительный путь в теге link. Он раскрывается относительно текущего адреса, поэтому на главной ведёт куда надо, а на вложенных страницах в пустоту. Замените <code>href="favicon.ico"</code> на <code>href="/favicon.ico"</code>.</p>

  <h3>Я почистил кеш, а иконка всё равно старая.</h3>
  <p>Очистка истории не всегда очищает хранилище фавиконов, браузер держит его отдельно. Проверьте в приватном окне, отдаётся ли новая иконка. Если там она есть, с файлом всё хорошо, и обычный профиль скоро подтянется.</p>

  <h3>Нужен ли favicon.ico, если уже есть PNG-иконки?</h3>
  <p>Пусть будет. Браузеры запрашивают <code>/favicon.ico</code> в корне даже когда вы объявили PNG, и часть инструментов и краулеров ищет его по имени. Несколько килобайт того стоят.</p>

  <h3>Можно просто переименовать PNG в .ico?</h3>
  <p>Нет, хотя в вашем браузере это может сработать. У ICO своя структура контейнера. Сконвертируйте файл по-настоящему, и вы избавитесь от бага, который видит только часть посетителей.</p>

  <h3>Сколько ждать появления иконки в Google?</h3>
  <p>Обычно несколько недель, и попросить быстрее нельзя. Убедитесь, что иконка квадратная, от 48 пикселей, доступна роботу и объявлена на главной, и оставьте её в покое.</p>

  <h3>Почему во вкладке чётко, а на домашнем экране телефона размыто?</h3>
  <p>Домашний экран берёт иконку гораздо большего размера, на iOS это 180 пикселей, и растягивает вашу маленькую. Нужен отдельный <code>apple-touch-icon</code> нужного размера, а не один крохотный файл на все случаи.</p>

  <h2>Проще собрать комплект заново</h2>

  <p>Если вы уже какое-то время латаете один файл иконки, обычно быстрее пересобрать весь набор, чем продолжать его отлаживать. Загрузите логотип в <a href="/ru/image/favicon-generator/">генератор фавиконов</a>, и получите все размеры, которые спрашивает браузер, настоящий многоразмерный ICO, иконку для Apple и готовый HTML. Для одиночных конвертаций есть <a href="/ru/image/png-to-ico/">PNG в ICO</a>, <a href="/ru/image/jpg-to-ico/">JPG в ICO</a> и <a href="/ru/image/webp-to-ico/">WebP в ICO</a>, а <a href="/ru/image/ico-to-png/">ICO в PNG</a> работает в обратную сторону, когда надо заглянуть внутрь существующей иконки. Если нужны не починки, а теория про размеры и разметку, это в <a href="/ru/blog/how-to-create-a-favicon/">полном руководстве по созданию фавикона</a>.</p>
