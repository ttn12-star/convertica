content_ru: |
  Low-content публикация тем и необычна, что творческая часть часто оказывается самой простой. Дневник в линейку это сетка, книга головоломок это вывод скрипта. Спотыкаются люди на загрузке, а уведомление об отказе редко объясняет себя внятно.

  Хорошая новость в том, что список причин короткий, механический и одинаковый у разных сервисов печати. Сделайте правильно пять вещей, и файл пройдёт. Конкретные числа ниже соответствуют спецификации крупнейшего сервиса на момент написания; всегда сверяйтесь с актуальной для вашего trim size, потому что их пересматривают.

  <h2>1. Формат страницы обязан точно равняться trim size</h2>

  <p>Это самая частая причина отказа и самая легко устранимая. Если книга 6 на 9 дюймов, каждая страница ПДФ обязана быть 6 на 9 дюймов. Книга 6 на 9, свёрстанная на страницах US Letter, отклоняется автоматически, даже если содержимое лежит внутри области 6 на 9 посередине.</p>

  <p>Тонкость в вылетах. Если какой-то элемент уходит под край страницы, вылеты нужны, а вылеты меняют формат страницы: добавьте 0,125 дюйма сверху, снизу и по внешнему краю. Интерьер 6 на 9 с вылетами становится 6,125 на 9,25 дюйма. Заметьте, что внутреннему краю не добавляется ничего, потому что этот край сшивается, а не подрезается.</p>

  <p>Если интерьер это просто линейки, точки или текст, который заканчивается далеко от края, вылеты не нужны вообще, и формат страницы просто равен trim size. Большинство дневников и планеров попадает сюда, и это делает их простым случаем.</p>

  <p>Честное ограничение, о котором стоит знать: перевести готовый ПДФ в книжный trim size инструмент смены формата за вас не может. Наш <a href="/ru/pdf-edit/page-size/">инструмент изменения размера страницы</a> работает с A4, US Letter и Legal, то есть с офисными бумажными стандартами, а не с trim size вроде 6 на 9 или 8,5 на 11, которых ждёт типография. Для книжного интерьера задавайте формат страницы в том файле, где вы верстали. Если на руках только готовый ПДФ не того формата, вы не конвертируете, а пересобираете.</p>

  <h2>2. Корешковое поле обязано расти с объёмом</h2>

  <p>Внутреннее поле, то, что у корешка, это требование, о котором забывают, и именно оно даёт книгу, где текст уходит в переплёт.</p>

  <p>Толстые книги сильнее выгибаются у корешка, поэтому съедают больше внутреннего края. Требование поэтому масштабируется:</p>

  <table>
    <thead>
      <tr><th>Страниц в интерьере</th><th>Минимальное внутреннее (корешковое) поле</th></tr>
    </thead>
    <tbody>
      <tr><td>до примерно 150</td><td>0,375 дюйма</td></tr>
      <tr><td>примерно 150–300</td><td>0,5 дюйма</td></tr>
      <tr><td>примерно 300–500</td><td>0,625 дюйма</td></tr>
      <tr><td>примерно 500–700</td><td>0,75 дюйма</td></tr>
      <tr><td>больше примерно 700</td><td>0,875 дюйма</td></tr>
    </tbody>
  </table>

  <p>Остальные три края проще: минимум 0,25 дюйма, и 0,375 дюйма на страницах с вылетами. Относитесь к обоим числам как к минимумам, а не как к цели. Дневник с внешними полями 0,5 дюйма выглядит осознанным, а с ровно 0,25 выглядит еле прошедшим.</p>

  <p>Поскольку корешок меняет сторону, левая и правая страницы это не одна и та же вёрстка. Если в редакторе есть зеркальные поля или режим разворотов, включите. Собирать все страницы одинаково это верный способ получить книгу, где чётные страницы в порядке, а нечётные у корешка не читаются.</p>

  <h2>3. Шрифты обязаны быть встроены</h2>

  <p>Интерьер с невстроенными шрифтами либо отклоняют, либо, что хуже, печатают с подменённой гарнитурой, которая перебивает всю вашу аккуратную выключку. Это молчаливый сбой: на вашей машине файл выглядит правильно, потому что шрифт там установлен.</p>

  <p>В любом серьёзном диалоге экспорта есть галочка встраивания шрифтов, а браузерные инструменты делают это сами. Проверяйте, а не предполагайте: откройте ПДФ, посмотрите свойства документа, найдите вкладку шрифтов и убедитесь, что у каждого написано «Встроен» или «Встроено подмножество». Если шрифт отказывается встраиваться из-за лицензии, переведите этот текст в кривые.</p>

  <h2>4. Прозрачность надо свести</h2>

  <p>Живая прозрачность, тени, режимы наложения и полупрозрачные слои это частый источник неожиданностей на печати: эффект либо исчезает, либо превращается в серый прямоугольник. Типографии просят её сведённой, и надёжнее свести до загрузки, а не надеяться, что конвертер угадает.</p>

  <p><a href="/ru/pdf-edit/flatten/">Сведение ПДФ</a> собирает слои и интерактивные элементы в статичное содержимое страницы, попутно убирая поля форм и комментарии, которым в печатном интерьере не место. Картинки оно не пересчитывает, поэтому разрешение печати не страдает. Для более строгого, архивного результата <a href="/ru/pdf-to-pdfa/">конвертация в PDF/A</a> по устройству требует встроенных шрифтов и самодостаточного содержимого, и это полезная перестраховочная проверка, даже когда сервис PDF/A конкретно не требует. В нашей заметке о том, <a href="/ru/blog/what-is-pdf-a-and-how-to-convert/">что такое PDF/A</a>, разобрано, что стандарт гарантирует, а что нет.</p>

  <h2>5. Одиночные страницы, а не развороты</h2>

  <p>Выгружайте по одной странице на страницу. Разворот из двух страниц, выгруженный одной широкой, читается как одна огромная страница неверного формата и отклоняется. На это попадаются те, кто верстал в редакторе с видимыми разворотами: вид это развороты, а экспорт обязан быть одиночным.</p>

  <p>То же касается меток реза и приводки. Они принадлежат промышленной печати, а не загрузке в print-on-demand, и сервис, который подрезает по своим меткам, охотно напечатает ваши как содержимое.</p>

  <h2>Номера страниц и когда без них</h2>

  <p>Low-content книги здесь расходятся. Дневнику в линейку номера обычно не нужны, потому что покупатель может использовать страницы в любом порядке, и номер это визуальный шум. Книге головоломок, рабочей тетради и всему, где есть содержание, они нужны.</p>

  <p>Если ставите, делайте это после того, как порядок страниц финальный, через <a href="/ru/pdf-edit/add-page-numbers/">добавление номеров страниц</a>, и внутри безопасных полей выше. Номер в 0,2 дюйма от края реза исчезает первым. Помните также, что положение обязано чередоваться, если хотите номера по внешнему краю каждой страницы, а в нашем <a href="/ru/blog/add-page-numbers-to-pdf/">разборе нумерации</a> есть про смещения для пропуска первых страниц.</p>

  <h2>Проверка перед загрузкой</h2>

  <table>
    <thead>
      <tr><th>Что проверяем</th><th>Как</th></tr>
    </thead>
    <tbody>
      <tr><td>Каждая страница точно равна trim size (плюс вылеты, если есть)</td><td>Открыть ПДФ и прочитать размеры; сверить первую, среднюю и последнюю</td></tr>
      <tr><td>Корешковое поле соответствует объёму</td><td>Сверить с таблицей выше, проверив левую и правую страницы отдельно</td></tr>
      <tr><td>Остальные поля минимум 0,25 дюйма, или 0,375 с вылетами</td><td>Мерить от края реза, а не от края вылета</td></tr>
      <tr><td>Шрифты встроены</td><td>Свойства документа, вкладка шрифтов, везде «Встроен»</td></tr>
      <tr><td>Нет живой прозрачности, слоёв, полей форм</td><td>Свести, потом убедиться, что по клику ничего не выделяется</td></tr>
      <tr><td>Одиночные страницы, без разворотов и меток реза</td><td>Пролистать файл: каждая страница это одна страница книги</td></tr>
      <tr><td>Число страниц чётное и не меньше минимума сервиса</td><td>Большинство сервисов хочет минимум 24 страницы интерьера и чётный итог</td></tr>
    </tbody>
  </table>

  <p>Последняя строка ловит больше людей, чем должна бы. Печать требует чётного числа страниц, потому что страницы идут листами, а сервисы ставят минимум, ниже которого книгу не сшить. Добавьте пустую страницу, а не режьте содержимое.</p>

  <h2>Что происходит с файлом, который вы загружаете</h2>

  <p>Наши инструменты работают на сервере, то есть файл загружается. Он удаляется сразу после завершения задачи, а ссылка на скачивание принадлежит только вам. Ничего не индексируется, не хранится и не используется для обучения. В заметке о том, <a href="/ru/blog/is-convertica-safe-pdf-file-security-privacy-explained/">как Convertica обращается с вашими файлами</a>, расписаны правила хранения, если рукопись не опубликована.</p>

  <h2>Частые вопросы</h2>

  <h3>Нужны ли вылеты дневнику в линейку?</h3>
  <p>Почти никогда. Вылеты существуют, чтобы иллюстрация до края пережила подрезку, а у дневника, где линейки заканчиваются далеко внутри полей, у края нечего защищать. Пропустите вылеты, оставьте формат страницы равным trim size, и вы убрали целый класс арифметических ошибок.</p>

  <h3>Можно перевести интерьер A4 в книгу 6 на 9?</h3>
  <p>Не так, чтобы получилась хорошая книга. Пропорции разные, значит что-то придётся отмасштабировать или обрезать, а ваши аккуратно выставленные поля перестанут соответствовать требованию к корешку. Пересоберите интерьер под trim size в редакторе. Это тот единственный случай, где переверстать реально быстрее, чем бороться с конвертацией.</p>

  <h3>На какой минимум по числу страниц рассчитывать?</h3>
  <p>Большинство сервисов печати по требованию хочет минимум 24 страницы интерьера, и все хотят чётный итог. Для low-content книг это легко, но сверьтесь с конкретным сервисом, прежде чем остановиться на 100 страницах сгенерированной головоломки: круглое число, которое вы выбрали, может оказаться на одну страницу ниже порога.</p>

  <h3>Интерьер обязан быть PDF/A?</h3>
  <p>Обычно не обязан, иногда полезен. Ценность прогона интерьера через <a href="/ru/pdf-to-pdfa/">конвертацию в PDF/A</a> в том, что стандарт запрещает как раз то, что вызывает проблемы на печати: невстроенные шрифты и содержимое, зависящее от чего-то за пределами файла. Считайте это шагом проверки, а не требованием.</p>

  <h3>Почему файл отклонили, если на вид он в порядке?</h3>
  <p>В порядке вероятности: формат страницы не равен точно trim size, корешок слишком тонкий для объёма, шрифты не встроены, или вы выгрузили развороты. Все четыре на экране выглядят нормально, именно поэтому они и есть та самая четвёрка. Проверяйте в этом порядке.</p>

  <h3>Ставить название магазина или страницу лицензии в интерьер книги?</h3>
  <p>Страница с копирайтом в книге нормальна и ожидаема, в отличие от печатной загрузки, где страница лицензии работает больше. Держите её в первых страницах и не ставьте колонтитул на каждой: печатная книга с адресом магазина на всех 120 страницах читается как шаблон, а это ровно то впечатление, которого low-content издателю стоит избегать.</p>

  <h2>Готовьте интерьер</h2>

  <p>Задайте формат страницы в редакторе до того, как начнёте рисовать, включите зеркальные поля, затем <a href="/ru/pdf-edit/flatten/">сведите</a> выгрузку и проверьте вкладку шрифтов. Если хочется строгой валидации, прогоните через <a href="/ru/pdf-to-pdfa/">PDF/A</a> и посмотрите, будет ли он жаловаться. Если вы параллельно продаёте печатные шаблоны, наш разбор <a href="/ru/blog/sell-printable-pdf-on-etsy/">как подготовить ПДФ для продажи</a> и заметка о том, <a href="/ru/blog/stop-buyers-editing-reselling-your-pdf/">что реально даёт защита файла</a>, закрывают эту сторону. Остальное лежит во <a href="/ru/all-tools/">всех инструментах</a>.</p>
