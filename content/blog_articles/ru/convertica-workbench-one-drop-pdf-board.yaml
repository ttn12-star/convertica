content_ru: |
  Есть конвертации, которые возвращаются каждую неделю. Те же счета от поставщиков, которые должны лечь в архив как PDF/A. Те же банковские выписки, из которых цифры потом перебивают в таблицу руками. Та же пачка фотографий с телефона, которую в офисе никто не может открыть.

  По отдельности каждая занимает пару минут. Открыть страницу инструмента, дождаться загрузки, выбрать файл, поставить ту самую галочку, которую ставите всегда, скачать результат. Повторите это восемь раз в понедельник утром, и двадцать минут ушли на экраны, которые вы знаете наизусть.

  PDF Workbench убирает эту часть утра. Инструменты настраиваются один раз на доске, и дальше конвертация сводится к одному движению: файл на плитку.

  <h2>Вся идея PDF Workbench в одном слове: плитка</h2>

  <p>Доска это сетка. Каждая клетка на ней плитка, а плитка это один конвертер плюс настройки, которые вы для него сохранили. Бросаете файл на плитку или щёлкаете по ней и выбираете файл, и конвертация запускается сразу с этими настройками. Никакой формы, никакого повторного выбора опций, никакой второй страницы. Результат появляется под плиткой строкой с кнопкой скачивания, и последние три результата остаются на виду, пока вы работаете дальше. Файл можно забрать ещё раз, не запуская конвертацию заново.</p>

  <p>На доске одновременно идёт одна конвертация. Так задумано: бросьте три файла на три плитки, и они вернутся в том порядке, в котором вы их отправили, а не наперегонки.</p>

  <figure><img src="/static/images/blog/workbench-board.jpg" alt="Доска Convertica Workbench с названием «Бухгалтерия» и плитками PDF в Word, Word в PDF и PDF в Excel, на одной из них готовый результат с кнопкой скачивания" width="1280" height="800" loading="lazy"></figure>

  <h2>Соберите первую доску за две минуты</h2>

  <ol>
    <li><strong>Откройте доску.</strong> Зайдите в <a href="/ru/workbench/">Workbench</a>. Ставить ничего не нужно, аккаунт для пробы тоже. Ссылка есть в меню «Все инструменты», в меню аккаунта и в подвале сайта.</li>
    <li><strong>Нажмите «Добавить виджет».</strong> Откроется список с поиском и двумя группами. В «Моих пресетах» лежат рабочие процессы, которые вы уже сохранили на страницах инструментов, вместе с вашими настройками. В «Конвертерах» собрано всё, что принимает файл и отдаёт файл, сегодня их 23: <a href="/ru/pdf-to-word/">PDF в Word</a> (в поиске это чаще набирают как «пдф в ворд») и <a href="/ru/word-to-pdf/">Word в PDF</a>, Excel и PowerPoint в PDF, PDF в HTML, текст, Markdown, EPUB и JPG, PDF/A, HEIC в JPG, оптимизатор изображений и инструменты для ICO. Наберите пару букв и отметьте нужное.</li>
    <li><strong>Бросьте файл.</strong> Плитка примет его, запустит конвертацию и покажет строку с результатом снизу. Большие файлы сами уходят в фоновый режим, а пока конвертация идёт, можно выбрать «Продолжить в фоне» и заняться другим делом.</li>
    <li><strong>Скачайте.</strong> Кнопка скачивания живёт в строке, пока её не заменит новый результат, а два предыдущих остаются ниже.</li>
    <li><strong>Научите плитку своим настройкам.</strong> Откройте меню плитки, выберите «Настроить на странице инструмента», и страница откроется с настройками именно этой плитки. Меняете что нужно, нажимаете <strong>«Сохранить рабочий процесс»</strong>, и плитка запоминает новую версию. Так включается OCR для PDF в Word, а размер страницы перестаёт быть решением каждый раз. Подробнее об этой механике на странице <a href="/ru/saved-workflows/">сохранённых рабочих процессов</a>.</li>
  </ol>

  <figure><img src="/static/images/blog/workbench-picker.jpg" alt="Список «Добавить виджет» на доске Workbench, отфильтрованный по слову «word»: сохранённый пресет с OCR в разделе «Мои пресеты» и конвертеры PDF в Word и Word в PDF ниже" width="1280" height="800" loading="lazy"></figure>

  <p>Двух вещей на доске нет, и это осознанно. Инструменты, где работа идёт на экране (подпись, добавление текста, обрезка, сборка страниц, сравнение), требуют ваших рук и превью, поэтому остаются на своих страницах. А инструмент с выбором, который нельзя угадать, например «Конвертировать изображение» с выходным форматом, показывает «Настроить на странице инструмента» и один раз отправляет вас туда.</p>

  <h2>Шаблоны: Office, Сканы, Изображения</h2>

  <p>Пустая доска предлагает три готовых старта, и то же самое предлагает окно новой доски:</p>

  <ul>
    <li><strong>Office</strong>: Word в PDF, PDF в Word, Excel в PDF, PowerPoint в PDF.</li>
    <li><strong>Сканы</strong>: изображение в текст, PDF в текст, PDF в Word.</li>
    <li><strong>Изображения</strong>: HEIC в JPG, оптимизация изображения, PDF в JPG.</li>
  </ul>

  <p>Выберите один или начните с пустой доски. Шаблон это только фора: любую созданную им плитку можно перенастроить или убрать.</p>

  <h2>Несколько досок и режим редактирования</h2>

  <p>Одна доска закрывает многое, но работа делится на разные по форме куски. Переключатель слева сверху ходит между досками (на телефоне это родной системный список), а меню доски рядом умеет переименовать, сделать доску основной, продублировать или удалить. Дублирование это быстрый способ сделать вариант: скопируйте доску, которой доверяете, и поменяйте те две плитки, что отличаются.</p>

  <p>Переставляют плитки в режиме редактирования. Нажмите <strong>«Редактировать»</strong> в верхней панели, и у каждой плитки появится ручка для перетаскивания, заголовок станет полем ввода, а рядом возникнет крестик для удаления. Перетащите плитки в тот порядок, в котором вы реально работаете, переименуйте «PDF в Word» в «Сканы счетов», чтобы узнавать её взглядом, и нажмите «Готово». Вне режима редактирования меню плитки по-прежнему даёт размер S, M или L, сдвиг влево, сдвиг вправо и удаление.</p>

  <figure><img src="/static/images/blog/workbench-edit.jpg" alt="Workbench в режиме редактирования: у каждой плитки видна ручка для перетаскивания, поле с названием и красная кнопка удаления, в верхней панели кнопка «Готово»" width="1280" height="800" loading="lazy"></figure>

  <h2>Три способа этим пользоваться</h2>

  <p><strong>Бухгалтер.</strong> Доска называется «Закрытие месяца», на ней три плитки. Счета от поставщиков падают на плитку <a href="/ru/pdf-to-pdfa/">PDF в PDF/A</a>, потому что архив другого формата не принимает. Банковские выписки идут на <a href="/ru/pdf-to-excel/">PDF в Excel</a>, чтобы цифры сверяли, а не набирали заново (да, тот самый «пдф в эксель»). Третья плитка вытаскивает текст из сканов чеков. Двадцать файлов, двадцать движений, ни одной настройки по пути.</p>

  <p><strong>Помощник руководителя.</strong> Всё, что уходит из офиса вложением, сначала проходит через одну доску. Черновики в Ворде и презентации превращаются в PDF, чтобы получатель увидел ту же вёрстку, что и автор, а фотографии, которые отдел продаж присылает с телефонов, идут через <a href="/ru/image/heic-to-jpg/">HEIC в JPG</a>, прежде чем попадут к кому-то с ноутбуком на Windows. Раньше на каждый формат была своя вкладка браузера. Теперь одна, открытая весь день.</p>

  <p><strong>Преподаватель.</strong> Раздатки приходят фотографиями страницы учебника, а нужны текстом, который можно править. Плитка <a href="/ru/image/to-text/">изображение в текст</a> читает снимки, плитка PDF в Word разбирается со старыми сканами рабочих листов, а плитка Word в PDF отправляет готовую версию обратно в формате, который одинаково печатается на любом школьном принтере.</p>

  <h2>Бесплатно, аккаунт, Premium</h2>

  <table>
    <thead>
      <tr><th>Тариф</th><th>Досок</th><th>Плиток на доску</th><th>Где хранится</th></tr>
    </thead>
    <tbody>
      <tr><td>Без аккаунта</td><td>1</td><td>3</td><td>В браузере</td></tr>
      <tr><td>Бесплатный аккаунт</td><td>1</td><td>6</td><td>В браузере</td></tr>
      <tr><td>Premium</td><td>5</td><td>20</td><td>Синхронизируется с аккаунтом</td></tr>
    </tbody>
  </table>

  <p>Трёх плиток без аккаунта хватает, чтобы понять, ложится ли идея на вашу работу. Главное, что добавляет Premium, это синхронизация: доски и пресеты живут в аккаунте, поэтому доска, собранная за рабочим столом, уже на месте и на ноутбуке, и на телефоне, с теми же плитками и настройками. Единственный конвертер, который сегодня остаётся премиальным, это PDF в PDF/A, у остальных он помечен значком PRO. Цены на <a href="/ru/pricing/">странице тарифов</a>.</p>

  <h2>Что происходит с файлами</h2>

  <p>Доска не хранит ваши документы. Она хранит названия инструментов, порядок плиток и настройки, несколько килобайт текста. Быстрые конвертации отдаются прямо в браузер, и ничего не остаётся. Файлы покрупнее считаются в фоне и удаляются примерно через час, ровно как на страницах инструментов. Закройте вкладку, и счетов уже нет, а доска, которая их сконвертировала, будет на месте в следующий раз.</p>

  <h2>Частые вопросы</h2>

  <h3>Workbench бесплатный?</h3>
  <p>Да, и работать можно вообще без входа: одна доска, три плитки, всё лежит в браузере. Бесплатный аккаунт поднимает лимит до шести плиток, Premium даёт пять досок по двадцать плиток с синхронизацией в аккаунт. Что входит в каждый тариф, перечислено на <a href="/ru/workbench/about/">обзорной странице Workbench</a>.</p>

  <h3>Какие инструменты могут стать плиткой?</h3>
  <p>Любые, которые принимают файл и отдают файл, сегодня это 23 конвертера. Редакторы, где нужен ваш ввод на экране (подпись, добавление текста, обрезка, сборка страниц, сравнение), плитками не становятся: по одному брошенному файлу непонятно, куда ставить подпись.</p>

  <h3>Как поменять настройки плитки?</h3>
  <p>Откройте меню плитки и выберите «Настроить на странице инструмента». Страница инструмента откроется с текущими настройками этой плитки, вы меняете что нужно и нажимаете «Сохранить рабочий процесс». Дальше плитка использует новые настройки при каждом брошенном файле.</p>

  <h3>Это работает на телефоне?</h3>
  <p>Да. Сетка складывается в одну колонку, переключатель досок становится системным списком выбора, а нажатие на плитку открывает выбор файла, обычно галерею или облачный диск. Мышкой перетаскивать приятнее, но ничего здесь не требует компьютера.</p>

  <h3>Вы храните мои файлы?</h3>
  <p>Нет. Быстрые конвертации возвращаются прямо в браузер и не сохраняются, а файлы, которым нужна фоновая очередь, удаляются примерно через час. Сама доска помнит только то, какие инструменты вы выбрали и как их настроили.</p>

  <h2>Откройте свою доску</h2>

  <p>Быстрее всего понять это, собрав доску своими руками. Откройте <a href="/ru/workbench/">Workbench</a>, добавьте два или три конвертера, которыми пользуетесь чаще всего, и бросьте файл на первый. Если хочется сначала посмотреть, как это делает кто-то другой, есть <a href="https://youtu.be/Dcj_bE15UWQ" target="_blank" rel="noopener">двухминутный разбор на YouTube</a>, а остальное объясняет <a href="/ru/workbench/about/">страница Workbench</a>.</p>
