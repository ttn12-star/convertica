content_ru: |
  Лист Excel (Экселя) это бесконечная сетка. PDF (ПДФ) это стопка листов бумаги фиксированного размера. Любая проблема при сохранении Эксель в ПДФ сводится к тому, что конвертер пытается понять, где кончается ваша сетка и как нарезать её на страницы, и угадывает неправильно.

  Хорошая новость в том, что причин ошибок немного. Найдите свою ниже, исправьте её один раз в файле, и все следующие экспорты этого файла будут выходить нормально.

  <h2>1. Столбцы уезжают на отдельную страницу</h2>

  <p><strong>Что видно:</strong> на первой странице столбцы с A по F, а столбцы с G по K появляются в одиночестве на четвёртой странице, после всех строк, и без подписей строк.</p>

  <p><strong>Почему:</strong> по умолчанию лист печатается в масштабе 100%. Если таблица шире бумаги, не поместившиеся столбцы уходят на свои страницы и печатаются после первого блока строк. Отсюда эффект «половина листа пропала»: она не пропала, она тремя страницами дальше.</p>

  <p><strong>Как исправить в Excel:</strong> вкладка «Разметка страницы», группа <strong>«Вписать»</strong>. В поле <strong>«Ширина»</strong> поставьте «1 страница», а <strong>«Высоту»</strong> оставьте «Авто». Таблица сожмётся ровно настолько, чтобы влезть по ширине, а вниз займёт столько страниц, сколько нужно. Для широкой таблицы ещё и переключите <strong>«Ориентацию»</strong> на «Альбомная»: это даёт примерно на 40% больше ширины, прежде чем что-то придётся уменьшать.</p>

  <p>Не ставьте на длинной таблице и ширину, и высоту в 1 страницу. Так 300 строк втиснутся в один лист, и вы получите следующую проблему.</p>

  <p><a href="/ru/excel-to-pdf/">Конвертер Excel в PDF</a> делает часть с шириной сам: если в файле нет собственного масштаба печати, он вписывает все столбцы в ширину страницы и разворачивает широкие таблицы в альбомную ориентацию. В наших тестах таблица на 25 столбцов, которая при обычной конвертации расползалась на четыре страницы, уместилась на одну альбомную.</p>

  <h2>2. Десятки (или тысячи) пустых страниц</h2>

  <p><strong>Что видно:</strong> данные занимают две страницы, а в PDF их 40, и почти все пустые. Или одна страница с данными, а за ней страницы, где только линии сетки.</p>

  <p><strong>Почему:</strong> конвертер печатает всё до последней ячейки, которую считает занятой. Часто это вовсе не последняя строка ваших данных. Обычные виновники:</p>

  <ul>
    <li>пробел, когда-то набранный в ячейке далеко внизу или справа и забытый;</li>
    <li>формула, протянутая до строки 5000 и возвращающая пустую строку (<code>=ЕСЛИ(A2="";"";...)</code>);</li>
    <li>в самом Excel граница или заливка, применённая к целым строкам или столбцам: Excel тоже считает такие ячейки занятыми.</li>
  </ul>

  <p><strong>Как найти:</strong> щёлкните любую ячейку и нажмите <strong>Ctrl+End</strong> (на Mac Cmd+Fn+стрелка вправо). Excel перепрыгнет в правый нижний угол того, что он считает используемым диапазоном. Если это ячейка AZ4000, а ваша таблица кончается на F120, всё между ними и превращается в пустые страницы.</p>

  <p><strong>Как исправить:</strong> выделите строки под таблицей (щёлкните номер первой пустой строки, затем Ctrl+Shift+стрелка вниз), правой кнопкой мыши, <strong>«Удалить»</strong>. То же сделайте со столбцами справа. Затем сохраните файл: Excel пересчитывает используемый диапазон только при сохранении. Нажать клавишу Delete на ячейках недостаточно, она стирает значения, но оставляет форматирование. Нужна именно команда удаления строк и столбцов.</p>

  <p><strong>Или задайте область печати</strong>, и остальной лист перестанет иметь значение: выделите таблицу, «Разметка страницы» → «Область печати» → «Задать».</p>

  <p>Конвертер Excel в PDF не обращает внимания на ячейки, в которых есть только заливка или граница. В книге без формул он заодно очищает случайные пробелы за концом таблицы, и они перестают плодить пустые страницы. Пробел сразу после текста в той же строке остаётся: так обычно не дают длинной заметке залезть в соседний столбец. Книги с формулами конвертируются как есть, ведь формула может ссылаться на эти ячейки, так что для них по-прежнему нужна чистка через Ctrl+End, описанная выше. Область печати, заданная вами, всегда главнее.</p>

  <h2>3. Всё влезло, но текст микроскопический</h2>

  <p><strong>Что видно:</strong> одна страница, все столбцы на месте, а шрифт как у мелкого текста в договоре.</p>

  <p>Причины две. Либо лист действительно очень широкий (40 или 50 столбцов в ширину одной страницы всегда будут мелкими), либо случайная ячейка далеко справа (см. причину 2) заставила конвертер вписывать 52 столбца, хотя у вас их 6. Сначала проверьте Ctrl+End, это дешевле.</p>

  <p>Если таблица и правда широкая, выберите, чем пожертвовать:</p>

  <ul>
    <li>Альбомная ориентация плюс вписывание по ширине: читается примерно до 20 или 25 обычных столбцов на A4.</li>
    <li>Скройте перед экспортом столбцы, которые в PDF никому не нужны. Скрытые столбцы не печатаются.</li>
    <li>Разделите таблицу: каждую группу столбцов на свой лист, в каждом повторите столбец с номером (см. <a href="/ru/blog/excel-to-pdf-repeat-header-row-every-page/">как повторять строки и столбцы заголовков</a>).</li>
    <li>Выберите в настройках макета конвертера «Сохранить исходный размер»: текст в полный размер, а столбцы продолжаются на дополнительных страницах, то есть вариант 1 наоборот.</li>
  </ul>

  <h2>4. Решётки (####) или текст обрезан на полуслове</h2>

  <p><strong>Что видно:</strong> <code>#####</code> там, где должно быть число или дата, или фраза, которая обрывается на границе ячейки. Чаще всего это узкие столбцы при сохранении Excel в PDF.</p>

  <p><strong>Почему:</strong> PDF показывает ровно то, что вышло бы на печати. Число, которое не влезает в столбец, отображается решётками и на экране, и на бумаге. Текст, который не влезает, обрезается по краю ячейки, если в соседней ячейке справа что-то есть.</p>

  <p><strong>Как исправить:</strong> расширьте столбец (двойной щелчок по правой границе буквы столбца подберёт ширину автоматически) или включите «Перенос текста» для длинных текстовых ячеек, чтобы они росли вниз. Проверяйте при масштабе 100%: при 85% столбец может нормально выглядеть на экране и всё равно показать #### при печати.</p>

  <h2>5. Таблица прижата к углу страницы</h2>

  <p>Узкая таблица по умолчанию печатается в левом верхнем углу, и на счёте или бланке это смотрится странно. «Разметка страницы» → «Поля» → <strong>«Настраиваемые поля»</strong>, затем в блоке «Центрировать на странице» отметьте <strong>«горизонтально»</strong>. Для одностраничного бланка отметьте и «вертикально». Настройка сохраняется в файле, так что PDF её подхватит.</p>

  <p>Похожий сюрприз связан с размером бумаги. Лист, настроенный под американский Letter и напечатанный на A4 (или наоборот), получает или теряет полоску внизу, и последняя строка может уехать на отдельную страницу. В США, Канаде, Мексике и ещё нескольких странах Латинской Америки стандарт Letter, почти во всём остальном мире, включая Россию, A4. Точные размеры есть в нашей статье <a href="/ru/blog/a4-vs-us-letter-printable-sizes/">A4 или Letter</a>. Если в файле не указано, какая нужна бумага, конвертер использует A4.</p>

  <h2>6. Часть листов не попала в PDF</h2>

  <p>«Файл» → «Сохранить как» → PDF в Excel сохраняет только активный лист, если не открыть <strong>«Параметры»</strong> и не выбрать «Всю книгу». Можно и просто выделить несколько листов перед сохранением. Онлайн-конвертер берёт все видимые листы книги, каждый с новой страницы. Скрытые листы пропускаются, так что покажите всё, что должно попасть в файл.</p>

  <h2>Проверка перед экспортом за пять минут</h2>

  <ol>
    <li>Ctrl+End на каждом листе. Удалите строки и столбцы за пределами настоящей таблицы, сохраните.</li>
    <li>«Вид» → <strong>«Страничный режим»</strong>. Синие линии показывают, где именно разорвутся страницы; перетащите линию, чтобы сдвинуть разрыв.</li>
    <li>«Вписать»: ширина 1 страница, высота «Авто». Для широкой таблицы альбомная ориентация.</li>
    <li>«Печатать заголовки», если таблица занимает несколько страниц.</li>
    <li>«Файл» → «Печать», пролистайте предпросмотр до конца. Что видно там, то и попадёт в PDF.</li>
  </ol>

  <h2>Частые вопросы</h2>

  <h3>Почему мой PDF выглядит не так, как при сохранении в PDF из самого Excel?</h3>
  <p>Excel рисует страницы через драйвер вашего принтера и установленные у вас шрифты, а онлайн-конвертер работает на сервере со своими шрифтами и без принтера. Настройки макета, сохранённые в файле (область печати, масштаб, ориентация, поля, сквозные строки), учитывают оба. Расхождения бывают в основном тогда, когда файл полагается на настройки по умолчанию или использует шрифт, которого нет на сервере.</p>

  <h3>Можно ли исправить PDF, который уже обрезан?</h3>
  <p>Правкой самого PDF нельзя: недостающая часть просто не была нарисована. Исправьте таблицу и сконвертируйте заново. Если оригинала не осталось, <a href="/ru/pdf-to-excel/">переведите PDF обратно в Excel</a>, почините и экспортируйте ещё раз.</p>

  <h3>Почему в предпросмотре Excel одна страница, а в PDF больше?</h3>
  <p>Обычно PDF сделан с другого листа или предпросмотр показывал только выделенный фрагмент. Проверьте, какой лист активен, и что не выбран вариант «Напечатать выделенный фрагмент».</p>

  <h3>Попадают ли скрытые строки в PDF?</h3>
  <p>Нет. Скрытые строки и столбцы остаются скрытыми и при экспорте из самого Excel, и в конвертере.</p>

  <h3>Не сломает ли конвертер формулы или диаграммы?</h3>
  <p>Нет. В PDF будут значения, которые посчитали формулы, и диаграммы в том виде, в каком они нарисованы. Исходная таблица не меняется, вы получаете новый PDF.</p>

  <h2>Конвертируйте</h2>

  <p>Пройдитесь по проверке перед экспортом и перетащите файл в <a href="/ru/excel-to-pdf/">конвертер Excel в PDF</a>. Если беда только в том, что со второй страницы нет названий столбцов, смотрите, <a href="/ru/blog/excel-to-pdf-repeat-header-row-every-page/">как повторить строку заголовка на каждой странице</a>, а более полный чек-лист собран в статье о том, <a href="/ru/blog/convert-excel-to-pdf-keep-formatting/">как перевести Excel в PDF без потери форматирования</a>.</p>
