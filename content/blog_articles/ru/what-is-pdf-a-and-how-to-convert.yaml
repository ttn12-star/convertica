content_ru: |
  Про PDF/A обычно узнают в неудачный момент: форма загрузки выплёвывает файл обратно и сообщает, что принимаются только документы в архивном формате. Обиднее всего, что с самим ПДФ всё в порядке. Он открывается, печатается, годами уходил по почте без единой претензии. Просто он нарушает правила, о существовании которых вы не догадывались.

  Разберём, что это за правила, кому и зачем они понадобились и как быстрее всего получить файл, который примут.

  <h2>PDF/A это не отдельный формат</h2>

  <p>Первое, что стоит усвоить: файл PDF/A остаётся файлом PDF. То же расширение, те же программы, то же открытие двойным щелчком. Архивным его делает соблюдение более строгого набора правил, описанного в стандарте ISO 19005. В России этот стандарт принят как ГОСТ Р 54989-2012, и именно на него ссылаются требования к долговременному хранению электронных документов.</p>

  <p>У всех этих правил одна цель: документ должен выглядеть точно так же через двадцать лет, на компьютере, который ещё не спроектировали, без доступа в интернет.</p>

  <p>А значит, из файла нужно убрать всё, что зависит от внешнего мира. Обычный ПДФ имеет право написать «набрать этот абзац шрифтом Helvetica» и понадеяться, что шрифт найдётся в системе. В 2045 году он может не найтись, текст переберётся другим шрифтом и вёрстка поедет. Обычный ПДФ может подтягивать картинку по ссылке, выполнять скрипт, проигрывать видео. Всё это зависимости, а зависимости со временем протухают.</p>

  <h2>Что конкретно требует стандарт</h2>

  <ul>
    <li><strong>Все шрифты внедрены в файл.</strong> Начертания букв лежат внутри документа, поэтому текст отрисовывается одинаково независимо от того, установлен шрифт в системе или нет.</li>
    <li><strong>Цвет описан аппаратно-независимо.</strong> В файл кладётся цветовой профиль ICC, который однозначно объясняет любой будущей программе, что означает конкретный оттенок, вместо того чтобы оставлять это на усмотрение монитора.</li>
    <li><strong>Никакого шифрования.</strong> ПДФ с паролем не может быть PDF/A. Архив, который невозможно открыть без пароля, который никто уже не помнит, это не архив.</li>
    <li><strong>Никаких скриптов, звука, видео и запуска внешних программ.</strong> Всё исполняемое и всё, что разворачивается во времени, запрещено.</li>
    <li><strong>Никаких внешних ссылок на содержимое.</strong> Картинки, шрифты и данные лежат внутри файла и не подгружаются при открытии.</li>
    <li><strong>Стандартизированные метаданные.</strong> Файл несёт метаданные XMP, где записано, какой версии и какому уровню он соответствует, чтобы валидатор проверял его по правильному своду правил.</li>
  </ul>

  <p>Обратите внимание, чего в списке нет: размера файла, количества страниц, качества картинок и того, ищется ли текст поиском. PDF/A отвечает за долговечность, а не за компактность и аккуратность.</p>

  <h2>Какая версия нужна: PDF/A-1, 2 или 3</h2>

  <p>У стандарта три части, и они дополняют друг друга, а не соперничают. Более новая версия здесь не означает автоматически лучшую: значение имеет то, что именно просит принимающая сторона.</p>

  <ul>
    <li><strong>PDF/A-1</strong> (2005) самая строгая и самая широко признанная. Она опирается на старый PDF 1.4 и запрещает прозрачность и слои, поэтому современный документ с дизайном после конвертации может заметно «сплющиться». Если ведомство вообще называет версию, обычно это она.</li>
    <li><strong>PDF/A-2</strong> (2011) построена на PDF 1.7. Разрешает прозрачность, слои и сжатие JPEG 2000, а также позволяет вкладывать внутрь другие файлы PDF/A. Для большинства задач это разумный выбор по умолчанию: гарантии сохранности те же, а вероятность, что документ изменит вид, заметно ниже.</li>
    <li><strong>PDF/A-3</strong> (2012) это PDF/A-2 плюс одно важное отличие: внутрь можно вложить <em>любой</em> файл, а не только PDF/A. На этом построены стандарты электронных счетов, где машиночитаемый XML лежит внутри читаемого человеком документа. Если такая задача перед вами не стоит, третья часть не нужна.</li>
  </ul>

  <h3>Буква после цифры</h3>

  <p>Уровни записываются как 1b, 2b, 2u, 2a. Буква говорит о том, сколько структуры несёт файл:</p>

  <ul>
    <li><strong>b (basic)</strong> гарантирует визуальное воспроизведение. Страница всегда будет выглядеть правильно. Именно это подразумевает подавляющее большинство требований.</li>
    <li><strong>u (unicode)</strong> добавляет гарантию, что весь текст корректно сопоставлен с Юникодом, то есть его можно надёжно извлечь и найти поиском.</li>
    <li><strong>a (accessible)</strong> добавляет полную разметку: порядок чтения, структуру, альтернативный текст для изображений. Этого требует законодательство о доступности, и ни один конвертер не создаст такую разметку из плоского скана. Настоящий уровень a получается из хорошо размеченного исходного документа, а не из шага конвертации.</li>
  </ul>

  <p>Если уровень вам не назвали, берите <strong>PDF/A-2b</strong>. Он закрывает обычное требование «нужен PDF/A» с наименьшими потерями для внешнего вида.</p>

  <h2>Кто обычно требует архивный формат</h2>

  <ul>
    <li><strong>Суды и системы электронной подачи документов.</strong> Требование к архивному формату встречается в правилах подачи и у нас, и в зарубежных судебных порталах.</li>
    <li><strong>Госорганы и делопроизводство.</strong> Правила долговременного хранения электронных документов прямо опираются на ГОСТ Р 54989. Если документ уходит в дело со сроком хранения, рано или поздно всплывёт вопрос о формате.</li>
    <li><strong>Вузы и научные репозитории.</strong> Порталы приёма диссертаций и выпускных работ часто просят архивный PDF, чтобы работа читалась и через десятилетия после защиты.</li>
    <li><strong>Архивы организаций и аудит.</strong> Везде, где регламент говорит «хранить пять лет», кто-нибудь однажды спросит, чем это обеспечено.</li>
    <li><strong>Электронный документооборот со счетами.</strong> Здесь нужна именно третья часть, со структурированными данными внутри читаемого документа.</li>
  </ul>

  <h2>Как конвертировать ПДФ в PDF/A</h2>

  <p>Сама конвертация быстрая. По сути вы просите программу внедрить всё, что раньше подтягивалось со стороны, приложить цветовой профиль, вычистить запрещённое и записать метаданные, объявляющие результат соответствующим стандарту.</p>

  <ol>
    <li>Откройте <a href="/ru/pdf-to-pdfa/">конвертер PDF в PDF/A</a> и загрузите файл.</li>
    <li>Выберите уровень соответствия. Доступны PDF/A-1b, 2b и 3b. Берите 2b, если не сказано иное.</li>
    <li>Запустите конвертацию и скачайте результат.</li>
    <li>Откройте файл и просмотрите его. Конвертация может изменить вид документа, и тридцать секунд на проверку стоит потратить до того, как вы куда-то его отправите.</li>
  </ol>

  <p>Одну вещь надо решить заранее: если на ПДФ стоит пароль, снимите его перед конвертацией, потому что шифрование и PDF/A несовместимы. Как это сделать, описано в инструкции о том, <a href="/ru/blog/unlock-pdf-remove-password/">как снять пароль со своего PDF</a>. Слово «своего» здесь ключевое: пароль нужно знать.</p>

  <h2>Как убедиться, что файл действительно PDF/A</h2>

  <p>Файл, который только заявляет о соответствии, бесполезен, если принимающая система с ним не согласится. Проверять можно на трёх уровнях, и глубина проверки должна соответствовать цене ошибки.</p>

  <ul>
    <li><strong>Откройте в любой читалке ПДФ.</strong> Большинство программ показывают вверху полоску о том, что документ открыт в режиме PDF/A. Нет полоски, нет и заявленного соответствия.</li>
    <li><strong>Посмотрите свойства документа.</strong> В метаданных будет указана часть стандарта и уровень, на которые претендует файл.</li>
    <li><strong>Прогоните настоящий валидатор.</strong> veraPDF это бесплатная эталонная реализация проверки. Для диссертации или судебного документа прогоните её один раз: это минута работы и ровно та же проверка, которую, скорее всего, делает система на приёме.</li>
  </ul>

  <p>Наш конвертер проверяет результат структурно ещё до выдачи: убеждается, что цветовой профиль на месте, а заявленный уровень соответствует запрошенному. Это ловит неудавшуюся конвертацию, но не заменяет полный аудит по ISO 19005. Для юридически значимых документов один прогон через veraPDF лишним не будет.</p>

  <h2>Почему документ иногда меняется после конвертации</h2>

  <ul>
    <li><strong>Прозрачность «сплющилась».</strong> При конвертации в PDF/A-1b прозрачность убирается, потому что в PDF 1.4 её нет. Мягкие тени, свечения и полупрозрачные плашки запекаются в непрозрачные пиксели. Если в документе есть современная вёрстка, возьмите 2b и проблема исчезнет.</li>
    <li><strong>Подменился шрифт.</strong> Если исходный ПДФ ссылался на шрифт, не внедряя его, конвертер обязан что-то внедрить и подставляет ближайший похожий. Межбуквенные расстояния и переносы строк могут поехать. Лечится на стороне источника: пересохраните исходный документ с внедрением шрифтов.</li>
    <li><strong>Файл потяжелел.</strong> Так и должно быть. Внедрённые шрифты и цветовой профиль занимают место. Если размер мешает, прогоните результат через <a href="/ru/pdf-organize/compress/">сжатие PDF</a> и проверьте соответствие заново: агрессивное сжатие способно его сломать.</li>
    <li><strong>Пропали интерактивные элементы.</strong> Поля форм, скрипты и мультимедиа не являются архивным содержимым. Если нужно сохранить заполненные значения, сведите форму до конвертации, чтобы ответы стали частью страницы.</li>
    <li><strong>Конвертация вообще не запустилась.</strong> Почти всегда это шифрование. Снимите пароль и повторите.</li>
  </ul>

  <h2>Чего PDF/A не делает</h2>

  <ul>
    <li><strong>Это не подпись и не доказательство подлинности.</strong> Стандарт обещает, что файл будет одинаково отображаться в будущем, но ничего не говорит о том, кто его создал и не менял ли его кто-то. Для этого нужна <a href="/ru/pdf-edit/sign/">подпись документа</a>.</li>
    <li><strong>Это не защита.</strong> Скорее наоборот: шифрование запрещено. Если документ надо и заархивировать, и защитить, это две разные копии с двумя разными задачами.</li>
    <li><strong>Скан не станет искомым.</strong> Отсканированная страница, переведённая в PDF/A-1b, это корректный архивный файл с картинкой текста внутри. Если нужны слова, сначала распознавание. Разницу разбирает заметка о том, <a href="/ru/blog/pdf-to-word-vs-ocr-which-to-use/">когда нужен OCR, а когда обычная конвертация</a>.</li>
    <li><strong>Качество не улучшится.</strong> Мутный скан, идеально заархивированный, останется мутным сканом навсегда.</li>
  </ul>

  <h2>Частые вопросы</h2>

  <h3>Можно ли превратить PDF/A обратно в обычный ПДФ?</h3>
  <p>Этого не требуется. Файл PDF/A и так является полноценным PDF и открывается везде. Если вы его отредактируете, соответствие стандарту обычно теряется, и это нормально: держите архивную копию нетронутой, а после правок конвертируйте заново.</p>

  <h3>PDF/A-3 лучше, чем PDF/A-2, раз цифра больше?</h3>
  <p>Нет. Для большинства задач единственное значимое отличие в том, что в третью часть можно вложить произвольные файлы. Некоторые архивы это как раз не любят: вложенная таблица становится зависимостью, читаемость которой в будущем никто не гарантирует. Берите ту версию, которую попросили, а если не просили, то 2b.</p>

  <h3>Почему скан конвертировался, но текст в нём по-прежнему не ищется?</h3>
  <p>Потому что скан это изображение, а архивация изображения сохраняет изображение. Сначала прогоните <a href="/ru/image/to-text/">распознавание текста</a> или <a href="/ru/scanned-pdf-to-word/">конвертацию скана в Word</a>, а уже результат переводите в архивный формат.</p>

  <h3>Нужен ли PDF/A для обычных рабочих документов?</h3>
  <p>Как правило нет. Для счёта, который вы отправите и забудете, достаточно обычного ПДФ. Архивный формат оправдывает себя, когда документ должен пережить срок хранения, судебный процесс или институциональный репозиторий, либо когда его прямо потребовали.</p>

  <h3>Запретит ли PDF/A редактировать файл?</h3>
  <p>Нет. Он не только для чтения и ничем не заблокирован. Любой человек с редактором изменит его так же, как обычный PDF. Стандарт гарантирует точность отображения во времени, а не неизменность.</p>

  <h3>Что делать, если файл всё равно не приняли?</h3>
  <p>Проверьте три вещи по порядку: не просили ли конкретную часть и уровень, например 1b вместо 2b; не остался ли на файле пароль; и что говорит валидатор о реальных ошибках. На практике первый пункт объясняет большинство отказов.</p>

  <h2>Конвертировать файл</h2>

  <p>Если форма ждёт архивную копию, <a href="/ru/pdf-to-pdfa/">конвертер PDF в PDF/A</a> поддерживает уровни 1b, 2b и 3b и проверяет собственный результат до выдачи. Он входит в Convertica Premium вместе с остальным <a href="/ru/premium-tools/">набором премиум-инструментов</a>. Подготовить файл можно бесплатно: <a href="/ru/pdf-security/unlock/">снять пароль</a>, <a href="/ru/pdf-organize/compress/">сжать</a> и <a href="/ru/pdf-organize/merge/">объединить страницы в один документ</a>, а остальное найдётся в <a href="/ru/all-tools/">полном списке инструментов</a>.</p>
