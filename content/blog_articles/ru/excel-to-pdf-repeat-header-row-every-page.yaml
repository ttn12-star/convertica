content_ru: |
  Вы отправляете прайс-лист или журнал успеваемости на 30 страниц в PDF, и через пару минут приходит ответ: «а на пятой странице какой столбец что значит?». Шапка таблицы есть только на первой странице, дальше сплошные цифры без подписей.

  В Excel (Экселе) можно повторять строку заголовка на каждой печатной странице, а PDF (ПДФ) для Экселя и есть печатная страница. Настройка называется «Печатать заголовки». Занимает она около тридцати секунд, хранится внутри файла, и любой нормальный конвертер Эксель в ПДФ её потом учитывает.

  <h2>Сначала о двух способах, которые не работают</h2>

  <p><strong>«Закрепить области».</strong> Почти все начинают с неё, потому что на экране она делает ровно то, что нужно: верхняя строка стоит на месте, пока вы листаете вниз. Но это настройка вида. Она управляет окном программы, а не бумагой, и PDF её просто не замечает. Можно закрепить первую строку и всё равно получить шапку только на первой странице.</p>

  <p><strong>Оформить диапазон как таблицу.</strong> Умная таблица Excel («Вставка» → «Таблица») при прокрутке показывает названия столбцов вместо букв A, B, C. История та же: это экранный приём, при печати названия не повторяются.</p>

  <p>И ещё одна частая путаница. <em>Колонтитул</em> («Вставка» → «Колонтитулы») это совсем другое: строка текста в верхнем поле страницы, например название отчёта или номер страницы. Он повторяется на каждой странице, но выровнять в нём названия по столбцам не получится. Нам же нужно, чтобы повторялась <em>строка</em> самого листа.</p>

  <h2>Как включить «Печатать заголовки» в Excel для Windows</h2>

  <ol>
    <li>Откройте лист и перейдите на вкладку <strong>«Разметка страницы»</strong>.</li>
    <li>Нажмите <strong>«Печатать заголовки»</strong>. Откроется окно «Параметры страницы» на вкладке «Лист».</li>
    <li>Щёлкните в поле <strong>«Сквозные строки»</strong>, затем щёлкните по номеру строки с шапкой на самом листе. Excel подставит <code>$1:$1</code>. Если шапка занимает две строки (скажем, строка с названием и строка с именами столбцов), протяните мышью по обеим, получится <code>$1:$2</code>.</li>
    <li>Если таблица ещё и широкая и уезжает на дополнительные страницы вправо, сделайте то же самое в поле <strong>«Сквозные столбцы»</strong> для столбца, который подписывает каждую строку: номер, артикул или название товара.</li>
    <li>Нажмите «ОК». Проверьте через «Файл» → «Печать»: в предпросмотре вторая страница теперь должна начинаться с шапки.</li>
  </ol>

  <p>Настройка хранится в книге, поэтому после неё сохраните файл. Именно это и важно для будущей конвертации в PDF.</p>

  <h2>Excel для Mac</h2>

  <p>Смысл тот же, путь чуть другой: вкладка <strong>«Разметка страницы»</strong>, затем <strong>«Печатать заголовки»</strong> и то же поле «Сквозные строки». В старых версиях для Mac это меню «Файл» → «Параметры страницы» → «Лист». В файле результат получается одинаковый.</p>

  <h2>Google Таблицы</h2>

  <p>Здесь повтор шапки привязан к закреплению, так что это единственное место, где закрепление действительно помогает. Закрепите строку заголовка («Вид» → «Закрепить» → «1 строку»), затем откройте «Файл» → «Печать». В разделе <strong>«Верхний и нижний колонтитулы»</strong> отметьте <strong>«Повторять закреплённые строки»</strong>. Скачивайте PDF прямо с этого же экрана печати.</p>

  <p>Если вместо этого вы скачиваете таблицу в .xlsx и конвертируете где-то ещё, сначала задайте «Печатать заголовки» в Excel или Calc. При экспорте закреплённые строки не превращаются в сквозные.</p>

  <h2>LibreOffice Calc</h2>

  <p>Откройте <strong>«Формат» → «Диапазоны печати» → «Изменить»</strong>. В поле <strong>«Повторять строки»</strong> выберите вариант «задано пользователем» и введите <code>$1</code> (или <code>$1:$2</code> для двух строк). В файлы .xlsx Calc сохраняет это как полноценные сквозные строки Excel, так что настройка переезжает вместе с файлом.</p>

  <h2>Книги с несколькими листами</h2>

  <p>«Печатать заголовки» задаются для листа, а не для всей книги. Если в файле по листу на каждый месяц, каждому листу нужна своя настройка, и повторять на разных листах можно разные строки. Отсюда и ситуация, когда в январе шапка есть на каждой странице, а в феврале только на первой.</p>

  <p>Как пройтись по двенадцати листам быстрее: настройте первый лист, потом повторите то же на остальных. Кнопки «применить ко всем листам» для сквозных строк в Excel нет, даже если листы сгруппированы, так что на большую книгу заложите минуту.</p>

  <h2>Конвертация файла в PDF</h2>

  <p>Когда сквозные строки сохранены в файле, конвертировать его можно чем угодно. Мы проверили это на <a href="/ru/excel-to-pdf/">конвертере Excel в PDF</a> на таблице из 120 строк, которая занимает три страницы: с настроенными заголовками все три страницы начинаются с шапки, без них шапка только на первой. Заодно конвертер по умолчанию вписывает широкие таблицы в ширину страницы, так что повторяющуюся шапку ещё и можно прочитать.</p>

  <p>Если удобнее штатный путь Excel, подойдёт «Файл» → «Сохранить как» → PDF. Только загляните там в кнопку «Параметры»: по умолчанию Excel сохраняет лишь активный лист, и для книги из нескольких листов нужно выбрать «Всю книгу».</p>

  <h2>Если шапка всё равно не повторяется</h2>

  <ul>
    <li><strong>Настройка стоит на другом листе.</strong> Перейдите на тот лист, который конвертируете, и снова откройте «Печатать заголовки». Пустое поле значит, что на этом листе ничего не задано.</li>
    <li><strong>Файл сохранён как .csv.</strong> CSV хранит только значения: ни сквозных строк, ни ширины столбцов, ничего. Сохраните в .xlsx.</li>
    <li><strong>Вы конвертировали старый файл .xls.</strong> Сквозные строки работают и там, но если какой-то сервис капризничает, откройте файл и пересохраните в .xlsx. Это ничего не стоит.</li>
  </ul>

  <h2>Частые вопросы</h2>

  <h3>Можно ли повторить шапку в уже готовом PDF?</h3>
  <p>По сути нет. PDF хранит страницы такими, какими они нарисованы, понятия «повторять эту строку» внутри него нет. Вернитесь к таблице, настройте «Печатать заголовки» и сконвертируйте заново. Если у вас остался только PDF, сначала переведите его <a href="/ru/pdf-to-excel/">обратно в Excel</a>, поправьте там и экспортируйте ещё раз.</p>

  <h3>Можно ли сделать на каждой странице свою шапку?</h3>
  <p>В пределах одного листа нельзя: сквозные строки одинаковы на всех страницах. Разнесите таблицы с разными заголовками по отдельным листам и задайте каждому листу свои сквозные строки.</p>

  <h3>Влияет ли «Закрепить области» на PDF хоть когда-нибудь?</h3>
  <p>В Excel и Calc нет. В Google Таблицах только если отметить «Повторять закреплённые строки» в настройках печати.</p>

  <h3>Как оставить первый столбец на каждой странице широкой таблицы?</h3>
  <p>Используйте поле <strong>«Сквозные столбцы»</strong> в том же окне «Печатать заголовки». Работает так же, как со строками, только по горизонтали.</p>

  <h3>Сохранит ли PDF мои фильтры и скрытые строки?</h3>
  <p>Скрытые строки останутся скрытыми, обычно это и нужно. Кнопок фильтра в PDF не бывает: в файл попадут те строки, которые были видны в момент сохранения.</p>

  <h2>Попробуйте</h2>

  <p>Настройте «Печатать заголовки», сохраните файл и перетащите его в <a href="/ru/excel-to-pdf/">конвертер Excel в PDF</a>. Если таблица к тому же обрезается по краю страницы или обрастает пустыми листами, всё остальное разобрано в статье о том, <a href="/ru/blog/excel-to-pdf-cut-off-blank-pages-fix/">почему Excel в PDF обрезает столбцы</a>, а полный чек-лист есть в руководстве о том, <a href="/ru/blog/convert-excel-to-pdf-keep-formatting/">как сохранить форматирование Excel в PDF</a>.</p>
