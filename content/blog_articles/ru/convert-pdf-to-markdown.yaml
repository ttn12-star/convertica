content_ru: |
  Знакомая история: текст из ПДФ срочно нужен в другом месте. Выделяем страницу, копируем, вставляем в редактор и получаем полотно строк с переносами посреди слов, номерами страниц между абзацами, заголовками, которые перестали быть заголовками, и таблицей, приехавшей одним вертикальным столбиком цифр. Десять минут ручной правки, и готова половина одной страницы.

  Markdown как раз тот формат, который ждут почти все места, куда этот текст едет. Сайты документации, генераторы статики, вики, файлы README, хранилища Obsidian и Notion, пайплайны для нейросетей читают маркдаун без переходников. Поэтому правильный ход не копипаст, а конвертация: превратить ПДФ в файл `.md`, где сохранены иерархия заголовков и таблицы, и потратить пять минут на вычитку вместо часа на перепечатывание.

  <h2>Что даёт Markdown и чего не даёт PDF</h2>

  <p>PDF это описание печатной страницы. Он знает, где стоит каждая буква, каким шрифтом и какого размера. Он почти не знает, что вот эта строка была заголовком, что три строки составляли список, а сетка цифр была таблицей. Эта информация существует только визуально, поэтому копирование из ПДФ и даёт текст без структуры.</p>

  <p>Markdown устроен ровно наоборот. Он ничего не знает про внешний вид страницы, зато структуру называет прямо: <code>#</code> это заголовок, <code>-</code> элемент списка, вертикальные черты собирают таблицу. Отсюда его свойства:</p>

  <ul>
    <li><strong>Переносимость.</strong> Файл <code>.md</code> открывается в любом текстовом редакторе и вставляется почти в любой современный инструмент без мусорного форматирования.</li>
    <li><strong>Понятная история изменений.</strong> Положите файл в Git, и каждая будущая правка будет читаемым построчным диффом, чего с двоичным ПДФ не добиться.</li>
    <li><strong>Свободная вёрстка.</strong> Один и тот же текст удобно читается на телефоне, в терминале и на сайте документации, потому что он не привязан к формату страницы.</li>
    <li><strong>Дружелюбие к машинам.</strong> Поиск, скрипты и языковые модели опираются на явную структуру, а не угадывают её по координатам.</li>
  </ul>

  <h2>Зачем это делают в 2026 году</h2>

  <p>Сценарии за пару лет заметно сместились. Сейчас почти всё закрывают четыре:</p>

  <ul>
    <li><strong>Скормить документ модели.</strong> Требования, инструкции, договоры и статьи приходят в ПДФ, а маркдаун это самый дешёвый и чистый вариант отдать их нейросети или положить в поисковый индекс.</li>
    <li><strong>Перевезти старую документацию.</strong> Десять лет инструкций в ПДФ рано или поздно переезжают на сайт документации или в вики, и это переезд в Markdown.</li>
    <li><strong>Личные заметки.</strong> Obsidian, Logseq, Joplin это хранилища маркдауна. Отчёты и научные статьи попадают туда в виде <code>.md</code> или не попадают вовсе.</li>
    <li><strong>Цитировать и переиспользовать.</strong> Вытащить таблицу из отчёта в задачу, changelog или пост элементарно, когда таблица уже в маркдауне, и мучительно, когда это скриншот.</li>
  </ul>

  <h2>Как перевести PDF в Markdown за три шага</h2>

  <figure><img src="/static/images/tools/pdf-to-markdown.jpg" alt="Конвертер Convertica PDF в Markdown с загруженным файлом" width="1280" height="800" loading="lazy"></figure>

  <ol>
    <li>Откройте <a href="/ru/pdf-to-markdown/">конвертер PDF в Markdown</a> и перетащите файл. Бесплатно принимаются файлы до 15 МБ, с Premium предел поднимается до 100 МБ.</li>
    <li>Для обычного документа оставьте включёнными <strong>распознавание заголовков</strong> и <strong>сохранение таблиц</strong>. Первое переводит визуальные уровни заголовков в <code>#</code>, <code>##</code> и <code>###</code>, второе превращает найденные сетки в таблицы маркдауна.</li>
    <li>Запустите конвертацию и скачайте файл <code>.md</code>. Он открывается в любом редакторе, и документ сразу читается как текст.</li>
  </ol>

  <p>Конвертация текстовая, поэтому быстрая, и для нескольких документов в день аккаунт не нужен: без регистрации доступно 10 конвертаций в сутки, бесплатный аккаунт поднимает лимит до 40, Premium снимает его совсем.</p>

  <h2>Как выглядит результат</h2>

  <p>Возьмём одностраничный отчёт с заголовком, вводной строкой, таблицей из трёх столбцов и разделом с примечаниями. Вот что вернётся, без единой правки:</p>

  <pre><code># Квартальный отчёт

  Выручка по регионам, все суммы в тысячах рублей.

  | Регион | I кв | II кв |
  | --- | --- | --- |
  | Москва | 120 | 138 |
  | Урал | 95 | 102 |

  ## Примечания

  Во втором квартале рост на Урале замедлился из-за календаря праздников.</code></pre>

  <p>Про длинные файлы полезно знать две детали:</p>

  <ul>
    <li><strong>Метки страниц.</strong> В документе больше одной страницы появляются заголовок вида <code>## Page 2</code> и горизонтальная линия между страницами, так что всегда понятно, откуда взят фрагмент. В сплошном тексте эти метки обычно удаляют, а в архивной подшивке или юридическом файле именно их и хотят сохранить.</li>
    <li><strong>Пустые страницы подписаны.</strong> Страница без извлекаемого текста превращается в строку <code>_No extractable text on this page._</code>, а не исчезает молча. Если такая строка повторяется, у вас скан, и нужен путь через OCR ниже.</li>
  </ul>

  <h2>Что переживает конвертацию, а что нет</h2>

  <p>Здесь большинство инструкций замолкает. Любая конвертация ПДФ в маркдаун это восстановление структуры по визуальным признакам: что-то получается отлично, а что-то невозможно в принципе. Понимание границ экономит время на проверке не тех мест:</p>

  <table>
    <thead>
      <tr><th>Элемент</th><th>Результат</th><th>Чего ждать</th></tr>
    </thead>
    <tbody>
      <tr><td>Основной текст и порядок чтения</td><td>Надёжно</td><td>Абзацы идут в том порядке, в котором расположены на странице</td></tr>
      <tr><td>Заголовки</td><td>Обычно верно</td><td>Определяются по размеру шрифта, поэтому документ с аккуратной типографикой раскладывается по уровням <code>#</code> чисто</td></tr>
      <tr><td>Таблицы с линиями сетки</td><td>Обычно верно</td><td>Выгружаются как таблицы маркдауна, объединённые и вложенные ячейки распрямляются</td></tr>
      <tr><td>Списки с маркерами</td><td>Частично</td><td>Текст сохраняется, но маркеры приезжают символами, а не разметкой <code>-</code></td></tr>
      <tr><td>Полужирный и курсив</td><td>Нет</td><td>Выделения внутри абзаца не восстанавливаются, только уровни заголовков</td></tr>
      <tr><td>Картинки и графики</td><td>Нет</td><td>В текстовой выгрузке изображений нет, их придётся достать отдельно</td></tr>
      <tr><td>Гиперссылки</td><td>Нет</td><td>Видимые адреса остаются текстом, ссылки, спрятанные под словами, теряются</td></tr>
      <tr><td>Сноски, колонтитулы</td><td>Каша</td><td>Для ПДФ это обычный текст на странице, поэтому он оказывается там, где стоял</td></tr>
      <tr><td>Вёрстка в две колонки</td><td>Рискованно</td><td>Научные и газетные макеты могут перемешать колонки, проверьте первую страницу перед тем как доверять остальным</td></tr>
      <tr><td>Сканы</td><td>Нет</td><td>Без текстового слоя извлекать нечего, сначала OCR</td></tr>
    </tbody>
  </table>

  <p>Простое правило: если текст в ПДФ выделяется мышью, конвертация сработает. Если выделение ничего не даёт, перед вами картинка, и нужен следующий раздел.</p>

  <h2>Если у вас скан, начните с распознавания</h2>

  <p>У отсканированного или сфотографированного документа нет текстового слоя, есть только пиксели. Конвертация такого файла даст строку <code>_No extractable text_</code> и ничего больше, и это честный ответ, а не сбой. Сначала нужно оптическое распознавание:</p>

  <ul>
    <li>Для отсканированного документа подойдёт <a href="/ru/scanned-pdf-to-word/">скан PDF в Word</a>: он делает OCR и отдаёт редактируемый файл, который сохраняется в маркдаун прямо из редактора.</li>
    <li>Для одной страницы, скриншота или фотографии быстрее <a href="/ru/image/to-text/">распознавание текста с картинки</a>: вернётся обычный текст, структуру которого вы разложите руками.</li>
    <li>Не понимаете, что у вас за файл? Разбор <a href="/ru/blog/pdf-to-word-vs-ocr-which-to-use/">PDF в Word или OCR</a> объясняет, как отличить за десять секунд, а материал про <a href="/ru/blog/how-to-extract-text-from-an-image/">извлечение текста из изображения</a> разбирает точность распознавания.</li>
  </ul>

  <h2>Пятиминутная правка, после которой результат можно публиковать</h2>

  <p>Готовый документ не отдаёт ни один конвертер, этот тоже. Хорошая новость в том, что правка механическая и почти вся делается поиском с заменой:</p>

  <ol>
    <li><strong>Уберите обвязку.</strong> Колонтитулы, номера страниц и пометки о конфиденциальности повторяются на каждой странице и удаляются первыми.</li>
    <li><strong>Склейте разорванные строки.</strong> В вёрстке под печать внутри предложений стоят жёсткие переносы. Найдите дефис перед переводом строки, чтобы собрать разрезанные слова, затем склейте остальные строки внутри абзацев.</li>
    <li><strong>Поправьте уровни заголовков.</strong> Определение по размеру шрифта даёт разумные уровни, но если в документе название и заголовки разделов оформлены одинаково, придётся вручную поднять или опустить несколько решёток.</li>
    <li><strong>Превратите символы в списки.</strong> Замените ведущие маркеры на <code>- </code>, чтобы отрисовщик считал строки элементами списка.</li>
    <li><strong>Проверьте таблицы.</strong> Убедитесь, что число столбцов совпадает с оригиналом и ни одна строка не потеряла ячейку. Широкие таблицы страдают чаще всего.</li>
    <li><strong>Решите судьбу меток страниц:</strong> удалить, если нужен сплошной документ, или оставить, если важна привязка к странице оригинала.</li>
  </ol>

  <p>Пять минут на десять страниц это честный обмен на час перепечатывания, и в отличие от перепечатывания он не добавляет новых опечаток в цифры.</p>

  <h2>Markdown, текст, Word или HTML: что выбрать</h2>

  <p>Маркдаун нужен не всегда. Формат выгрузки зависит от того, что произойдёт с текстом дальше:</p>

  <table>
    <thead>
      <tr><th>Задача</th><th>Формат</th><th>Почему</th></tr>
    </thead>
    <tbody>
      <tr><td>Документация, заметки, Git, контекст для ИИ</td><td><a href="/ru/pdf-to-markdown/">Markdown</a></td><td>Структура сохраняется и остаётся читаемой в виде обычного текста</td></tr>
      <tr><td>Только слова, без структуры</td><td><a href="/ru/pdf-to-text/">Текст</a></td><td>Самый простой вывод для поиска, скриптов и быстрого grep</td></tr>
      <tr><td>Продолжать редактировать с форматированием</td><td><a href="/ru/pdf-to-word/">Word</a></td><td>Сохраняет вид документа, даёт правки и комментарии</td></tr>
      <tr><td>Опубликовать в вебе как есть</td><td><a href="/ru/pdf-to-html/">HTML</a></td><td>Открывается в браузере без сборки</td></tr>
      <tr><td>Цифры, которые надо пересчитать</td><td><a href="/ru/pdf-to-excel/">Excel</a></td><td>Ячейки остаются ячейками, формулы работают</td></tr>
    </tbody>
  </table>

  <h2>Как отдать маркдаун нейросети и не сжечь контекст</h2>

  <p>Если текст едет в языковую модель или в поисковый индекс, несколько привычек заметно улучшают ответы:</p>

  <ul>
    <li><strong>Сохраните заголовки.</strong> Это самый дешёвый признак для нарезки на фрагменты. Разбивка по границам <code>##</code> даёт разделы, каждый из которых осмыслен сам по себе, и это лучше нарезки по тысяче символов посреди фразы.</li>
    <li><strong>Сначала уберите повторяющуюся обвязку.</strong> Колонтитул на всех шестидесяти страницах это шестьдесят почти одинаковых фрагментов, которые конкурируют с содержательными в векторном поиске, и оплаченные токены в промпте.</li>
    <li><strong>Оставьте таблицы таблицами.</strong> Таблица на вертикальных чертах читается моделью как строки и столбцы. Те же числа, размазанные по абзацу, провоцируют её связать не то значение не с той подписью.</li>
    <li><strong>Конвертируйте по документу, а не по архиву.</strong> Один файл <code>.md</code> на один ПДФ сохраняет прослеживаемость, и всегда понятно, откуда взялся ответ.</li>
    <li><strong>Проверяйте важные цифры.</strong> Конвертация механическая, но распрямлённая объединённая ячейка способна сдвинуть значение в соседний столбец, и модель за вас это не заметит. Числа, на основании которых вы принимаете решения, сверяйте с оригиналом.</li>
  </ul>

  <h2>Что происходит с загруженным файлом</h2>

  <p>Конвертация идёт на сервере, значит ПДФ загружается. Он удаляется сразу после того, как конвертация закончилась, а ссылка на скачивание доступна только вам. Ничего не индексируется, не читается и не используется для обучения. Если вы переводите внутреннюю документацию или материалы клиента, правила хранения разобраны в заметке <a href="/ru/blog/is-convertica-safe-pdf-file-security-privacy-explained/">о том, как Convertica обращается с файлами</a>, а для документов под строгими обязательствами о конфиденциальности осторожность и локальный инструмент по-прежнему верный рефлекс.</p>

  <h2>Частые вопросы</h2>

  <h3>Сохранятся ли таблицы?</h3>
  <p>Таблицы с видимыми линиями сетки обычно превращаются в полноценные таблицы маркдауна вместе со строкой заголовка. Точность падает на объединённых ячейках, вложенных таблицах и таблицах, которые держатся на пробелах, а не на линиях: линий нет, определять нечего. Широкие таблицы проверяйте первыми, простые сетки почти всегда верны.</p>

  <h3>Почему заголовки стали обычными абзацами?</h3>
  <p>Заголовки определяются по типографике: текст заметно крупнее основного становится заголовком. Если в документе заголовки отличаются только полужирным или цветом при том же размере, определять нечего. Оставьте распознавание включённым, сконвертируйте и поднимите несколько заголовков вручную.</p>

  <h3>Сохраняются ли полужирный и курсив?</h3>
  <p>Нет. Восстанавливаются только уровни заголовков и структура таблиц, выделения внутри абзаца нет. Если выделения важны, конвертируйте в <a href="/ru/pdf-to-word/">Word</a>: там оформление символов переносится.</p>

  <h3>Можно ли сконвертировать книгу или инструкцию на 300 страниц?</h3>
  <p>Да, в пределах размера файла: 15 МБ бесплатно и 100 МБ с Premium. Большие текстовые ПДФ обычно заметно легче. Если объёмный документ обрабатывается долго, конвертацию можно отправить в фон и получить результат письмом, не сторожа вкладку.</p>

  <h3>Markdown правда лучше обычного текста для ИИ?</h3>
  <p>Для чего-то длиннее страницы да. Обычный текст даёт модели слова без иерархии, маркдаун даёт заголовки для нарезки и таблицы, которые всё ещё читаются как таблицы. Именно структура позволяет поисковой части вернуть цельный раздел, а не случайный кусок символов.</p>

  <h3>Вся страница вернулась одной огромной строкой таблицы. Что это было?</h3>
  <p>Так раньше вело себя ПДФ, свёрстанное в рамке на всю страницу: рамка выглядит как таблица из одной ячейки. Теперь конвертер отказывается от таблиц в один столбец и оставляет текст абзацами, так что повториться это не должно. Если конкретный файл всё же ведёт себя странно, сконвертируйте его ещё раз с выключенным сохранением таблиц.</p>

  <h2>Попробуйте на своём файле</h2>

  <p>Возьмите документ, который давно собирались перенести в заметки или в документацию, и прогоните через <a href="/ru/pdf-to-markdown/">конвертер PDF в Markdown</a>. Оставьте распознавание заголовков включённым, сверьте первую страницу с оригиналом и сделайте пятиминутную правку. Если окажется, что это скан, начните со <a href="/ru/scanned-pdf-to-word/">скана PDF в Word</a>. Остальное собрано в разделе <a href="/ru/all-tools/">все инструменты</a>.</p>
