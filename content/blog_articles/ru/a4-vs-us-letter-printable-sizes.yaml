content_ru: |
  За удивительным количеством отзывов на одну звезду у печатных шаблонов стоит несложная арифметика. A4 это 210 на 297 мм. US Letter это 215,9 на 279,4 мм. Letter примерно на 6 мм шире и примерно на 18 мм короче. Это не два размера одной формы: у них разные пропорции, 1:1,41 против 1:1,29.

  Следствие как раз и упускают. Не существует процента, при котором один печатается как другой. Отмасштабируйте макет A4 под ширину Letter, и он всё ещё слишком высокий. Отмасштабируйте под высоту, и он больше не заполняет ширину. Любой совет «печатайте с подгонкой под лист» это выбор, какой из двух компромиссов достанется покупателю, сделанный молча его драйвером принтера.

  <h2>Кто чем пользуется</h2>

  <p>Разделение географическое и почти абсолютное:</p>

  <ul>
    <li><strong>US Letter</strong> в США, Канаде, часто в Мексике, на Филиппинах, в Чили и части Центральной и Южной Америки.</li>
    <li><strong>A4</strong> по сути везде остальном, включая всю Европу, большую часть Азии, Африку, Австралию и остальную Южную Америку. Это стандарт ISO 216.</li>
    <li><strong>Есть локальные добавки.</strong> F4, он же фолио, 215 на 330 мм, до сих пор распространён в Индонезии и части Юго-Восточной Азии, а Legal, 215,9 на 355,6 мм, встречается в североамериканских офисах под договоры.</li>
  </ul>

  <p>Для продавца цифровых товаров это значит, что магазин только с A4 тихо теряет североамериканские продажи, а магазин только с Letter теряет большую часть мира. Ни та ни другая потеря не приходит в аналитику как возврат: покупатель просто не покупает, либо покупает один раз и оставляет отзыв про поля.</p>

  <h2>Что реально происходит, когда покупатель печатает не тот формат</h2>

  <p>Почти любой просмотрщик ПДФ по умолчанию выбирает что-то вроде «вписать в область печати». Дайте покупателю с бумагой Letter файл в A4, и эта настройка сделает единственное, что может: уменьшит страницу примерно до 94 процентов, чтобы влезла высота, и поставит по центру. Видимые результаты:</p>

  <table>
    <thead>
      <tr><th>Что вы нарисовали</th><th>Что получил покупатель</th></tr>
    </thead>
    <tbody>
      <tr><td>Сетку планера под A4</td><td>Ту же сетку в 94 процента и неровные белые полосы по бокам</td></tr>
      <tr><td>Постер под конкретную рамку</td><td>Нечто на пару миллиметров меньше любого стандартного размера рамки</td></tr>
      <tr><td>Линии отреза для наклеек или карточек</td><td>Линии, которые больше не совпадают с ковриком для резки или с вырубкой</td></tr>
      <tr><td>Страницу планера под перфорацию</td><td>Отверстия мимо кольцевого механизма, потому что поле сдвинулось</td></tr>
      <tr><td>Основной текст 11 пунктов</td><td>Текст примерно 10,3 пункта, который читается как «дешёвый», и никто не понимает почему</td></tr>
    </tbody>
  </table>

  <p>Для текстовой рабочей страницы всё это почти неважно. Для всего, что покупатель измеряет, режет, вставляет в рамку или сшивает, это и есть весь товар.</p>

  <h2>Поле это то, что превращает один макет в два</h2>

  <p>Вот полезное следствие из чисел. При переходе с A4 на Letter вы теряете 17,6 мм высоты, то есть по 8,8 мм сверху и снизу, если содержимое остаётся по центру. При переходе с Letter на A4 вы теряете 5,9 мм ширины, примерно по 3 мм с каждой стороны.</p>

  <p>Значит макет, в котором всё важное отодвинуто минимум на 10–12 мм от края, переживает переход в обе стороны в полном размере. Макет с рамкой в 4 мм от края не переживает ни в одну. Это единственное решение, принятое в самом начале, и есть разница между одним файлом на два рынка и двумя файлами, которые придётся поддерживать всегда.</p>

  <p>Кстати, это то же поле, которое нужно домашнему принтеру и так: бытовые принтеры не умеют класть краску на несколько миллиметров по краю листа. В нашем разборе про то, <a href="/ru/blog/sell-printable-pdf-on-etsy/">как подготовить ПДФ для продажи</a>, этот непечатаемый край и остальные проверки перед загрузкой расписаны подробно.</p>

  <h2>Рабочий процесс: рисуем один раз, выгружаем дважды</h2>

  <p>Если файл, в котором вы рисовали, всё ещё есть, это правильный путь, и лучше него нет ничего:</p>

  <ol>
    <li><strong>Рисуйте в A4</strong> с безопасным полем 12 мм. Начинать с более высокой и узкой формы проще: лишнюю ширину, которая появится на Letter, легко впитать, а теряемая высота уже внутри вашего поля.</li>
    <li><strong>Продублируйте артборд в Letter</strong> и дайте вёрстке перецентрироваться. Проверять надо только вертикаль: у колонтитулов стало на 8,8 мм меньше места.</li>
    <li><strong>Выгрузите оба</strong> со встроенными шрифтами и назовите так, чтобы вне контекста было понятно: <code>weekly-planner-A4.pdf</code> и <code>weekly-planner-US-Letter.pdf</code>.</li>
  </ol>

  <p>По-настоящему переверстать под новые пропорции умеет только реальный редактор, поэтому этот путь бьёт любую конвертацию. Абзацы могут перетечь, сетка может получить лишнюю строку, колонтитул может переехать.</p>

  <h2>Когда исходника уже нет</h2>

  <p>Частый неудобный случай: вы купили шаблон с коммерческой лицензией, файл достался вам по наследству, или оригинал уехал вместе со старым ноутбуком. На руках только готовый ПДФ, а готовый ПДФ описывает готовые страницы. Переверстать его нельзя ничем.</p>

  <p>Зато его можно переложить, и это следующее по качеству. <a href="/ru/pdf-edit/page-size/">Изменение размера страницы PDF</a> кладёт существующие страницы на другой бумажный стандарт. Две детали делают это применимым, а не опасным:</p>

  <ul>
    <li><strong>Оно измеряет, где содержимое на самом деле.</strong> Поскольку A4 в Letter стоит 8,8 мм сверху и снизу, у файла с полем 12 мм есть запас, и он остаётся ровно в 100 процентах. Печатные размеры сохраняются точными, а для всего измеряемого в этом и весь смысл.</li>
    <li><strong>Когда иначе никак, оно уменьшает, а не обрезает.</strong> У макета, уходящего под край, запаса нет, поэтому он уменьшается ровно настолько, чтобы всё сохранить, вместо потери 9 мм вашей рамки. Масштаб один на весь документ, поэтому многостраничный набор по-прежнему совпадает от листа к листу.</li>
  </ul>

  <p>Не пытайтесь сделать это обрезкой. <a href="/ru/pdf-edit/crop/">Обрезка</a> уменьшает страницу до меньшего прямоугольника, поэтому окно в пропорции Letter поверх макета A4 даст вам Letter-окно, у которого не хватает низа страницы. Обрезка нужна, чтобы убрать ненужные поля, а не чтобы менять бумажный стандарт.</p>

  <h2>Что сказать покупателю</h2>

  <p>Основная оставшаяся трудность живёт в упаковке. Несколько привычек убирают почти всю:</p>

  <ul>
    <li><strong>Положите оба формата в загрузку</strong> и напишите об этом в описании лота, а не только на картинках. Покупатели фильтруют по описанию.</li>
    <li><strong>Подписывайте файлы, а не папки.</strong> Люди распаковывают архив и мгновенно теряют структуру папок.</li>
    <li><strong>Добавьте одну строку инструкции:</strong> печатать в 100 процентов, фактический размер, масштабирование выключено. Именно это предложение предотвращает больше всего сообщений в поддержку, потому что мешает просмотрщику молча уменьшить правильный файл.</li>
    <li><strong>Скажите, какой формат был первым</strong>, если два файла хоть чем-то отличаются заметно для покупателя. Честность здесь ничего не стоит и снимает отзыв заранее.</li>
  </ul>

  <p>Если комплект вырос больше пары файлов, один архив держит порядок и удерживает вас внутри лимита площадки на число файлов; наша заметка про <a href="/ru/blog/pdf-naming-conventions-best-practices/">правила именования файлов</a> написана про документы, но правила переносятся один в один.</p>

  <h2>Короткая справка</h2>

  <table>
    <thead>
      <tr><th>Формат</th><th>Миллиметры</th><th>Дюймы</th><th>Пропорция</th></tr>
    </thead>
    <tbody>
      <tr><td>A4</td><td>210 × 297</td><td>8,27 × 11,69</td><td>1:1,414</td></tr>
      <tr><td>US Letter</td><td>215,9 × 279,4</td><td>8,5 × 11</td><td>1:1,294</td></tr>
      <tr><td>Legal</td><td>215,9 × 355,6</td><td>8,5 × 14</td><td>1:1,647</td></tr>
      <tr><td>A5</td><td>148 × 210</td><td>5,83 × 8,27</td><td>1:1,414</td></tr>
      <tr><td>F4 / фолио</td><td>215 × 330</td><td>8,46 × 12,99</td><td>1:1,535</td></tr>
    </tbody>
  </table>

  <p>На колонку с пропорцией стоит посмотреть второй раз. У A4 и A5 она общая, поэтому лист A4, сложенный вдвое, даёт идеальный A5, и поэтому документы серии A чисто масштабируются между собой. У Letter пропорция не совпадает ни с чем, и именно поэтому его нельзя отмасштабировать в размер серии A.</p>

  <h2>Что происходит с файлом, который вы загружаете</h2>

  <p>Наши инструменты работают на сервере, то есть файл загружается. Он удаляется сразу после завершения задачи, а ссылка на скачивание принадлежит только вам. Ничего не индексируется, не хранится и не используется для обучения. В заметке о том, <a href="/ru/blog/is-convertica-safe-pdf-file-security-privacy-explained/">как Convertica обращается с вашими файлами</a>, правила хранения расписаны, если вы работаете над чем-то неопубликованным.</p>

  <h2>Частые вопросы</h2>

  <h3>Можно просто напечатать A4 на бумаге Letter?</h3>
  <p>Можно, и для обычного текстового документа это нормально. Диалог печати уменьшит страницу примерно до 94 процентов и поставит по центру, что стоит вам немного кегля и даёт неровные белые поля. Для всего, что измеряют, режут, вставляют в рамку или перфорируют, это неприемлемо, а для товара на продажу это отзыв, который просто ждёт своей очереди.</p>

  <h3>В каком формате рисовать первым?</h3>
  <p>В большинстве случаев в A4. Это стандарт для большей части мира и более щадящая отправная точка: переход в Letter добавляет ширину, что легко, и отнимает высоту, которую ваше безопасное поле уже покрывает. Начинать с Letter стоит только если аудитория именно североамериканская.</p>

  <h3>Перевод A4 в Letter происходит без потерь?</h3>
  <p>Содержимое страницы да. Перекладывание помещает существующее векторное содержимое на новый лист, поэтому текст и линейная графика остаются вектором и печатаются так же резко. Не сохраняется замысел вёрстки: ничего не перетекает и не перестраивается под новые пропорции, а если у содержимого нет запаса по полям, его придётся уменьшить, чтобы не обрезать.</p>

  <h3>А что с A5, Legal или F4?</h3>
  <p>A5 это ровно половина A4 с той же пропорцией, поэтому конвертации внутри серии A чистые. Legal заметно выше и A4, и Letter, поэтому переложенное на него содержимое встаёт по центру с щедрыми полями, а не обрезается. F4 по высоте между A4 и Legal, и предлагать его стоит только если вы продаёте на рынки, где он распространён.</p>

  <h3>Нужны отдельные картинки лота под каждый формат?</h3>
  <p>Нет, и обычно это только засоряет лот. Один набор мокапов плюс понятная строка в описании, что внутри и A4, и US Letter, работает лучше. Что действительно помогает, так это небольшая пометка на последней картинке превью со списком того, что лежит в загрузке.</p>

  <h3>У меня макет с фоном навылет. Что делать?</h3>
  <p>Принять, что в полном размере он не переведётся: у него нигде нет запаса по полям. Либо уменьшать при перекладывании, что добавит тонкие белые поля, которые домашний принтер добавил бы и так, либо держать по-настоящему отдельные файлы под два стандарта. Фон навылет и домашняя печать никогда не были удобной парой.</p>

  <h2>Выберите форматы</h2>

  <p>Решите, какие два стандарта поддерживаете, до того как начнёте рисовать, и держите поле 12 мм, чтобы решение осталось дешёвым. Если на руках готовый ПДФ и никакого исходника, прогоните его через <a href="/ru/pdf-edit/page-size/">изменение размера страницы PDF</a>, распечатайте одну страницу в 100 процентов и проверьте все четыре края, прежде чем отдавать. Остальное лежит во <a href="/ru/all-tools/">всех инструментах</a>.</p>
