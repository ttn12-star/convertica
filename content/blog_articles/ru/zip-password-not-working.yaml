content_ru: |
  У этой проблемы два варианта, и причины у них противоположные. Поэтому первое, что стоит сделать, это понять, какой из двух у вас.

  В первом варианте архив открывается сразу и ничего не спрашивает, хотя вы уверены, что ставили пароль. Во втором он спрашивает, вы вводите пароль, в котором не сомневаетесь, и получаете отказ.

  Ни то, ни другое не невезение. У обоих есть простое объяснение.

  <h2>Вариант первый: архив вообще не спрашивает пароль</h2>

  <p>Он встречается чаще, и ответ почти всегда один: файл никто не шифровал. Что-то его запаковало и молча пропустило шаг с паролем.</p>

  <p>Обычный виновник это проводник Windows. Правый клик, «Отправить», «Сжатая ZIP-папка» это путь, которым идёт большинство, и он создаёт обычный архив без единого места, где можно задать пароль. Проводник умеет <em>читать</em> зашифрованный ZIP, который сделал кто-то другой, и честно спросит пароль при открытии. Создавать зашифрованные архивы он не умеет. Именно эта асимметрия и сбивает с толку: вы ведь уже открывали на этой машине защищённые архивы, значит, функция вроде бы есть.</p>

  <p>Её нет и не было. Windows поддерживает ZIP со времён XP и за все эти годы так и не добавила туда шифрование. Если вы пользовались только встроенным меню, пароля на вашем архиве нет, что бы вы ни вводили.</p>

  <p>Есть старый приём, который многие помнят: задать пароль изнутри окна сжатой папки. Он существовал в Windows XP, потом его убрали, и он не вернулся.</p>

  <p>Лечится переходом на то, что действительно шифрует: отдельная программа либо <a href="/ru/archive/protect/">инструмент защиты ZIP</a>, который ставит настоящий пароль и использует AES-256, а не устаревшую схему.</p>

  <h3>Как убедиться, что архив правда зашифрован</h3>

  <p>Две быстрые проверки:</p>

  <ul>
    <li>Откройте его тем, что умеет шифрование, например 7-Zip на Windows. Если он показал содержимое и распаковал без запроса, пароля нет.</li>
    <li>На размер файла не смотрите. Шифрование почти не меняет размер, так что этот признак ничего не говорит.</li>
  </ul>

  <p>Надёжный сигнал это поведение, а не внешний вид. Зашифрованный ЗИП спрашивает до распаковки.</p>

  <h2>Вариант второй: пароль отвергают</h2>

  <p>Здесь архив действительно зашифрован, и что-то не так в самой попытке. Три причины закрывают почти все случаи.</p>

  <h3>Причина A: программа не понимает шифрование</h3>

  <p>В ZIP под одним словом «пароль» живут две разные схемы шифрования.</p>

  <p><strong>ZipCrypto</strong> это исходная схема 1989 года. Её поддерживают все, и она достаточно слаба, чтобы ломаться атакой на известный открытый текст за считаные минуты. <strong>AES-256</strong> появился позже, он по-настоящему стойкий, и поддерживают его не везде.</p>

  <p>Вот в этом зазоре и живут отказы. Архив, зашифрованный AES-256, открытый старой программой или мобильным файловым менеджером, который знает только легаси-схему, выдаст ошибку неверного пароля при совершенно правильном пароле. Программа не сообщает, что пароль неправильный. Она сообщает, что не может расшифровать, просто формулировка вводит в заблуждение.</p>

  <p>Если попали на это, попробуйте 7-Zip на Windows или Keka на macOS. Оба умеют AES-256. Если тот же пароль там подошёл, ответ найден.</p>

  <h3>Причина B: вы вводите не тот пароль, который думаете</h3>

  <p>Менее экзотично и случается чаще, чем кажется:</p>

  <ul>
    <li><strong>Раскладка клавиатуры.</strong> Пароль, заданный в русской, польской или арабской раскладке и набранный в другой, даёт другие символы на тех же клавишах. Наберите его сперва в обычном текстовом поле и посмотрите.</li>
    <li><strong>Не-ASCII символы.</strong> Буквы с диакритикой и всё за пределами базовой латиницы разные программы кодируют по-разному. Пароль с é или ż может работать только в той программе, которая делала архив.</li>
    <li><strong>Пробел в конце.</strong> При копировании пароля из переписки или письма он цепляется постоянно. И он считается.</li>
    <li><strong>Похожие символы.</strong> Заглавная i, строчная L и единица во многих шрифтах неразличимы, как и ноль с заглавной O.</li>
  </ul>

  <p>Где можно, вставляйте пароль, а не набирайте, и сначала вставьте в видимое поле, чтобы посмотреть, что именно у вас в буфере.</p>

  <h3>Причина C: архив повреждён</h3>

  <p>ZIP, обрезанный прерванной загрузкой или почтовым шлюзом, иногда падает именно ошибкой пароля, а не ошибкой целостности. Если файл пришёл почтой или мессенджером, скачайте его заново из первоисточника и сравните размеры, прежде чем делать выводы про пароль.</p>

  <h2>Почему в одних архивах имена файлов видны, а в других нет</h2>

  <p>Это сбивает с толку тех, кто ждёт от шифрования принципа «всё или ничего». В ZIP два уровня:</p>

  <ul>
    <li><strong>Содержимое зашифровано, имена видны.</strong> Так почти везде по умолчанию. Любой может открыть архив и прочитать список файлов с именами и размерами. Распаковать не сможет. Утекает при этом больше, чем принято думать: <code>зарплаты-2026-финал.xlsx</code> рассказывает историю и сам по себе.</li>
    <li><strong>Имена тоже зашифрованы.</strong> Опция есть не везде, обычно называется шифрованием имён файлов или заголовка. Такой архив не показывает вообще ничего, пока не введён пароль.</li>
  </ul>

  <p>Если вы открыли архив и увидели список файлов без всякого запроса, это ещё не значит, что содержимое не защищено. Попробуйте распаковать один файл. Вот тогда и появится запрос.</p>

  <h2>По системам</h2>

  <ul>
    <li><strong>Windows.</strong> Проводник читает зашифрованные архивы и никогда их не создаёт. Чтобы сделать такой, нужна отдельная программа или онлайн-инструмент. Чтобы надёжно открыть AES-256, берите 7-Zip, а не проводник.</li>
    <li><strong>macOS.</strong> Штатная утилита архивации в Finder тоже пакует без шифрования. Команда <code>zip -e</code> в терминале шифрует, но слабой легаси-схемой. Для AES нужна сторонняя программа.</li>
    <li><strong>Android.</strong> Всё зависит от файлового менеджера. Многие умеют только ZipCrypto, и это частый источник ложной ошибки о неверном пароле.</li>
    <li><strong>iOS.</strong> Встроенные «Файлы» пакуют и распаковывают, но зашифрованные архивы не делают. Нужно приложение.</li>
  </ul>

  <h2>Если пароль потерян по-настоящему</h2>

  <p>Здесь стоит сказать прямо. Для архива с AES-256 и вменяемым паролем восстановления не существует. В этом и смысл шифрования. Программы, обещающие мгновенное восстановление, либо подбирают по словарю, что работает только на слабых паролях, либо бьют по устаревшему ZipCrypto, где есть настоящая криптографическая слабость.</p>

  <p>Поэтому прежде чем платить за восстановление, выясните, какая схема в вашем архиве. Если AES, ни один продукт не поможет, и честный ответ это вернуться к тому, кто создавал файл.</p>

  <p>Если архив ваш и вы просто хотите сменить или снять пароль, <a href="/ru/archive/unlock/">инструмент снятия пароля с ZIP</a> принимает архив и текущий пароль и отдаёт обычный.</p>

  <h2>Частые вопросы</h2>

  <h3>Почему в Windows 10 и 11 нельзя поставить пароль на ZIP?</h3>
  <p>Потому что такой функции в Windows никогда не было. Встроенное сжатие делает только обычные архивы. Открывать зашифрованные, сделанные где-то ещё, оно умеет, отсюда и ощущение, что умеет и создавать.</p>

  <h3>Мой ZIP открывается, не спрашивая пароль, который я ставил.</h3>
  <p>Пароль не применился. То, чем вы паковали папку, пропустило шифрование, почти наверняка это меню правого клика в Windows. Пересоберите архив тем, что шифрует.</p>

  <h3>7-Zip пишет, что пароль неверный, а я уверен, что верный.</h3>
  <p>Сначала проверьте пароль посимвольно в обычном текстовом поле, глядя на пробел в конце и на раскладку. Если он точно правильный, архив может быть повреждён, попробуйте скачать заново.</p>

  <h3>Защищённый паролем ZIP это вообще безопасно?</h3>
  <p>Зависит от схемы. AES-256 стойкий. Устаревший ZipCrypto нет, он ломается быстро, если атакующий знает часть содержимого. Если архив важный, убедитесь, что в нём AES.</p>

  <h3>Имена файлов видны без пароля. Он вообще зашифрован?</h3>
  <p>Скорее всего да, просто на обычном уровне, где содержимое зашифровано, а список нет. Попробуйте распаковать файл и посмотрите, спросит ли. Если имена тоже надо спрятать, нужен инструмент с шифрованием имён.</p>

  <h3>Можно открыть зашифрованный архив на телефоне?</h3>
  <p>Иногда. Многие мобильные менеджеры поддерживают только устаревшую схему, поэтому AES-архив падает с обманчивой ошибкой пароля. Приложение, где AES заявлен явно, или распаковка на компьютере снимают вопрос.</p>

  <h2>Сделайте архив, который сработает с первого раза</h2>

  <p>Если вы отправляете что-то, чему нужен пароль, обойдите встроенное сжатие стороной. <a href="/ru/archive/protect/">Инструмент защиты ZIP</a> шифрует по AES-256 прямо в браузере, и получатель получит архив, который действительно спрашивает пароль, а <a href="/ru/archive/unlock/">снятие пароля с ZIP</a> уберёт пароль с уже готового архива. Если речь про одну картинку, а не про папку, <a href="/ru/image/password-protect-image/">защита изображения паролем</a> делает это напрямую.</p>
