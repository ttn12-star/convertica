content_ru: |
  За HEIC тянутся два утверждения. Что файлы примерно вдвое легче JPEG и что конвертация стоит вам качества. Первое повторяют так часто, что никто не проверяет. Второе пугает достаточно, чтобы люди годами хранили оригиналы, которые больше никогда не откроют.

  Мы замерили и то, и другое. Семь фотографий на 12 мегапикселей, это разрешение, которое пишет основная камера айфона, закодированы в HEIC и сконвертированы в JPEG ровно теми настройками, что стоят у нас: качество 90, оптимизация включена. Размеры зафиксированы, качество измерено по PSNR и SSIM, а не на глаз.

  <h2>Цифры</h2>

  <table>
    <tr><th>Снимок</th><th>HEIC</th><th>JPEG к90</th><th>Рост</th><th>PSNR</th><th>SSIM</th></tr>
    <tr><td>Кот на снегу, много деталей</td><td>0,73 МБ</td><td>1,73 МБ</td><td>2,36x</td><td>47,8 дБ</td><td>0,9954</td></tr>
    <tr><td>Портрет, мягкий фон</td><td>1,44 МБ</td><td>2,42 МБ</td><td>1,68x</td><td>44,3 дБ</td><td>0,9967</td></tr>
    <tr><td>Уличная сцена</td><td>1,20 МБ</td><td>2,23 МБ</td><td>1,85x</td><td>44,1 дБ</td><td>0,9965</td></tr>
    <tr><td>Пейзаж, открытое небо</td><td>0,90 МБ</td><td>1,71 МБ</td><td>1,90x</td><td>48,0 дБ</td><td>0,9983</td></tr>
    <tr><td>Плоский сюжет, мало фактуры</td><td>0,30 МБ</td><td>0,70 МБ</td><td>2,32x</td><td>51,8 дБ</td><td>0,9986</td></tr>
    <tr><td>Листва, плотная фактура</td><td>1,70 МБ</td><td>2,82 МБ</td><td>1,66x</td><td>42,5 дБ</td><td>0,9969</td></tr>
    <tr><td>Толпа, мелкие детали</td><td>2,14 МБ</td><td>3,44 МБ</td><td>1,61x</td><td>43,0 дБ</td><td>0,9971</td></tr>
    <tr><td><strong>Все семь</strong></td><td><strong>8,42 МБ</strong></td><td><strong>15,05 МБ</strong></td><td><strong>1,79x</strong></td><td></td><td></td></tr>
  </table>

  <p>Из таблицы следует две вещи.</p>

  <h3>Разница в размере реальная, и она не ровно вдвое</h3>

  <p>По набору JPEG вышел в 1,79 раза тяжелее исходного HEIC. Расхожее «вдвое легче» достаточно близко, чтобы им пользоваться, но разброс важен: от 1,61 на плотно текстурированном снимке толпы до 2,36 на контрастном кадре кота на снегу.</p>

  <p>Закономерность видна сразу, как её заметишь. Преимущество HEIC максимально на кадрах с гладкими областями и чистыми краями, потому что его сжатие справляется с ними куда лучше старого подхода JPEG. На фотографиях, забитых мелкой шумной фактурой, тяжело обоим, и разрыв сокращается.</p>

  <p>На практике: тысяча снимков, которые занимают на телефоне 8 ГБ, в JPEG займут около 14 ГБ. Вот настоящая цена смены формата.</p>

  <h3>Потеря качества невидима</h3>

  <p>Тут опасение оказывается напрасным. PSNR по набору от 42,5 до 51,8 дБ, SSIM от 0,9954 до 0,9986.</p>

  <p>Для ориентира: PSNR выше 40 дБ принято считать визуально неразличимым, а SSIM выше 0,99 означает, что структурная разница между двумя изображениями это ошибка округления. Наш худший результат, 42,5 дБ на самом густом кадре с листвой, всё равно уверенно внутри этого диапазона. Вы не найдёте разницу глазами, и человек, которому вы отправите снимок, тоже.</p>

  <p>Честный вывод такой: конвертация HEIC в JPEG стоит вам места на диске, а не качества картинки.</p>

  <h2>Какое качество выставлять</h2>

  <p>У нас по умолчанию 90, именно его измеряет таблица выше. Мы прогнали те же снимки на 80 и 70, чтобы понять, что даёт эта настройка:</p>

  <table>
    <tr><th>Качество JPEG</th><th>Суммарный размер, семь снимков</th><th>К размеру HEIC</th></tr>
    <tr><td>90 (по умолчанию)</td><td>15,05 МБ</td><td>1,79x</td></tr>
    <tr><td>80</td><td>11,61 МБ</td><td>1,38x</td></tr>
    <tr><td>70</td><td>10,03 МБ</td><td>1,19x</td></tr>
  </table>

  <p>Переход с 90 на 80 убирает почти четверть веса. На большинстве фотографий этот шаг всё ещё трудно заметить без разглядывания пикселей, поэтому 80 разумный выбор, когда вы отправляете пачку почтой или заливаете на сайт.</p>

  <p>Оставляйте 90, если снимок пойдёт в печать, на дальнейшую обработку или в архив. Каждое сохранение JPEG теряет данные, поэтому файл, который вы будете править, должен стартовать настолько высоко, насколько можете себе позволить.</p>

  <h2>Почему сконвертированный снимок иногда правда выглядит размытым</h2>

  <p>Замеры говорят, что шаг конвертации чистый, и при этом «heic в jpg размыто» это реальная и частая жалоба. Одно другому не противоречит, потому что размытие обычно приходит из другого места цепочки.</p>

  <ul>
    <li><strong>Конвертер уменьшил изображение.</strong> Часть бесплатных сервисов молча режет вывод до 1920 пикселей по ширине или меньше. Снимок на 12 мегапикселей, ужатый до веб-превью, поплывёт при первом же увеличении. Смотрите на размер в пикселях, а не только на вес файла.</li>
    <li><strong>Вы смотрите на превью, а не на файл.</strong> Просмотрщики и веб-галереи часто сперва показывают кешированную версию низкого разрешения. Откройте файл нормально, прежде чем судить.</li>
    <li><strong>Мессенджер пережал его заново.</strong> Отправка фото через чат почти всегда означает второй, гораздо более жёсткий проход сжатия. Конвертация была в порядке, доставка нет. Отправляйте файлом или документом, а не фотографией.</li>
    <li><strong>Качество выставили очень низко.</strong> Ниже примерно 60 артефакты JPEG становятся видны на коже и градиентах. Если сервис не даёт выбора, вы не знаете, что он применил.</li>
  </ul>

  <p>Если результат нашего <a href="/ru/image/heic-to-jpg/">конвертера HEIC в JPG</a> имеет тот же размер в пикселях, что и оригинал, и всё равно выглядит мягко, значит, мягкость была в самом снимке.</p>

  <h2>HEIF и HEIC это не совсем одно слово</h2>

  <p>Мелочь, которая путает. HEIF это формат-контейнер, стандартизованный в составе MPEG-H. HEIC получается, когда в этом контейнере лежат изображения, закодированные HEVC, а именно это и пишут устройства Apple. То есть любой HEIC это HEIF, но не любой HEIF это HEIC.</p>

  <p>В быту разница почти не важна, и инструменты, принимающие одно, обычно принимают и другое. Она всплывает только когда что-то отказывает вашему файлу по расширению, а не по содержимому.</p>

  <h2>Так продолжать ли снимать в HEIC</h2>

  <p>Большинству да. Вы получаете примерно на 45 процентов более лёгкие файлы при той же видимой картинке, а современные устройства Apple работают с форматом нативно везде. Как только нужно поделиться с Windows, старым андроидом, типографией или формой загрузки на сайте, конвертируйте копию.</p>

  <p>Чего точно не стоит делать, так это навсегда переключать камеру на JPEG из-за того, что один сайт однажды не принял загрузку. За это решение вы будете платить на каждом снимке ради задачи, которая решается одной конвертацией.</p>

  <p>Обратную привычку тоже стоит бросить: хранить и HEIC, и JPEG-копию всего подряд. Замеры выше показывают, что в JPEG по сути та же картинка. Держите оригинал, а JPEG делайте тогда, когда он кому-то понадобился.</p>

  <h2>Как мы это мерили</h2>

  <p>Для тех, кто захочет повторить. Семь фотографий с разными сюжетами приведены к 4032 на 3024 пикселя, это 12 мегапикселей основной камеры айфона. Каждая закодирована в HEIC библиотекой libheif с качеством 50, примерно там сидит кодировщик камеры Apple. Затем каждый HEIC декодирован и сохранён в JPEG через Pillow с качеством 90 и включённой оптимизацией, тем же путём, которым идёт наш конвертер.</p>

  <p>PSNR и SSIM посчитаны между декодированным HEIC и получившимся JPEG, поэтому цифры описывают именно шаг конвертации, а не кодирование в HEIC. Это и есть число, которое интересует человека, конвертирующего свои снимки.</p>

  <h2>Частые вопросы</h2>

  <h3>HEIC правда вдвое легче JPEG?</h3>
  <p>Почти. По нашим замерам JPEG вышел в среднем в 1,79 раза тяжелее, то есть HEIC это примерно 56 процентов от веса JPEG. Разброс по снимкам от 1,61 до 2,36 раза в зависимости от того, сколько мелкой фактуры в кадре.</p>

  <h3>Теряется ли качество при конвертации HEIC в JPG?</h3>
  <p>Формально да, визуально нет. Мы намерили PSNR от 42 до 52 дБ и SSIM выше 0,995, это далеко за порогом, где разницу можно увидеть. Реальная цена конвертации это размер файла, а не качество картинки.</p>

  <h3>С каким качеством JPEG конвертировать?</h3>
  <p>Берите 90 для всего, что пойдёт в печать, на правку или в архив. Берите 80, когда отправляете пачку почтой или заливаете на сайт и хотите файлы полегче: эта настройка срезает около четверти веса и остаётся трудноотличимой.</p>

  <h3>Почему мой снимок после конвертации размытый?</h3>
  <p>Почти всегда потому, что его что-то уменьшило, либо мессенджер сжал его ещё раз на выходе. Сравните размер результата в пикселях с оригиналом. Если совпадает, конвертация тут ни при чём.</p>

  <h3>Чем HEIF отличается от HEIC?</h3>
  <p>HEIF это контейнер, HEIC это тот же контейнер с изображениями в кодировке HEVC, именно их пишут устройства Apple. Любой HEIC это HEIF. Большинство инструментов считает их взаимозаменяемыми.</p>

  <h3>Может, конвертировать в PNG, чтобы вообще без потерь?</h3>
  <p>Только если вам действительно нужен вывод без потерь, потому что PNG с фотографией огромен, часто в несколько раз тяжелее JPEG. Для фотографий разумный выбор это JPEG с высоким качеством, а PNG для графики, скриншотов и картинок с прозрачностью.</p>

  <h2>Конвертируйте по необходимости, а не по умолчанию</h2>

  <p>Когда сайт, коллега или машина на Windows не принимает ваш снимок, прогоните его через <a href="/ru/image/heic-to-jpg/">конвертер HEIC в JPG</a>, а оригинал оставьте на месте. Если адресату нужен один документ, а не картинка, тот же инструмент пишет PDF (ПДФ), а <a href="/ru/image/optimize/">оптимизатор изображений</a> ужмёт результат ещё, если файл всё ещё великоват. Про практическую сторону, как открывать эти файлы на Windows и андроиде, есть <a href="/ru/blog/convert-heic-to-jpg-iphone-photos/">отдельное руководство по HEIC на других устройствах</a>.</p>
