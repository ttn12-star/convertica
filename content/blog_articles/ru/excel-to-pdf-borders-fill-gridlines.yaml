content_ru: |
  Экран рисует любую границу шириной в один пиксель, какой бы тип линии вы ни выбрали. Бумага и PDF (ПДФ) рисуют её настоящей толщиной. Поэтому таблица, которая в Excel (Экселе) выглядит изящно, в PDF может оказаться расчерченной фломастером. При этом ничего не сломалось: вы просто видите ту толщину, которая у этого типа линии была всегда. Если вы сохраняете Эксель в ПДФ и границы становятся жирными, дело именно в этом.

  Мы замерили, во что превращается каждый тип линии, когда файл обрабатывает <a href="/ru/excel-to-pdf/">конвертер Excel в PDF</a>, и от этого уже шли к решениям.

  <h2>Какой толщины на самом деле печатается каждая граница</h2>

  <ul>
    <li><strong>Самая тонкая линия</strong> (первая в списке типов): около 0,1 pt. Практически тоньше принтер нарисовать не может.</li>
    <li><strong>Тонкая сплошная</strong> (её Excel ставит, когда вы просто жмёте кнопку «Границы»): 0,75 pt. Именно её и называют «жирной».</li>
    <li><strong>Средняя</strong>: 1,75 pt, больше чем вдвое толще тонкой.</li>
  </ul>

  <p>Для сравнения: линейки таблиц в печатной книге обычно от 0,25 до 0,5 pt. То есть граница Excel по умолчанию тяжелее, чем в большинстве напечатанных таблиц, а на плотном листе, где каждая ячейка обведена, это быстро набегает.</p>

  <h2>Как уменьшить толщину границ: самая тонкая линия</h2>

  <ol>
    <li>Выделите таблицу.</li>
    <li>Правая кнопка мыши, <strong>«Формат ячеек»</strong>, вкладка <strong>«Граница»</strong>.</li>
    <li>В списке <strong>«Тип линии»</strong> выберите первую линию под вариантом «Нет». На экране она похожа на мелкий пунктир, но это и есть самая тонкая линия, и печатается она сплошной и очень тонкой.</li>
    <li>Нажмите <strong>«Внешние»</strong> и <strong>«Внутренние»</strong> (или отдельные края, которые нужны), затем «ОК».</li>
  </ol>

  <p>Компромисс, который на бумаге смотрится хорошо: самая тонкая линия внутри таблицы, тонкая по внешнему контуру и под строкой заголовка.</p>

  <h2>Сетка: печатать или нет</h2>

  <p>Бледно-серая сетка, которую вы видите в Excel, это не границы, и по умолчанию она не печатается. Если у таблицы нет границ, в PDF не будет вообще никаких линий, и многих это удивляет.</p>

  <p>Чтобы сетка печаталась: вкладка <strong>«Разметка страницы»</strong>, группа <strong>«Параметры листа»</strong>, в блоке «Сетка» отметьте <strong>«Печать»</strong>. В наших тестах она выходит линиями 0,1 pt, как самая тонкая граница, так что это самый быстрый способ получить лёгкую сетку на большом листе. Конвертер эту настройку учитывает.</p>

  <p>Нужно обратное, чистый лист совсем без линий? Проверьте, что «Печать» в блоке «Сетка» не отмечена, а у ячеек нет границ.</p>

  <h2>Цвет заливки и цветной текст</h2>

  <p>Заливка хорошо смотрится на экране и в цветном PDF, но расходует краску, а на чёрно-белом принтере может превратиться в грязно-серые пятна. Есть два способа сохранить Excel в PDF без цвета заливки:</p>

  <ul>
    <li><strong>Чёрно-белый режим самого Excel.</strong> «Разметка страницы» → «Параметры страницы», вкладка <strong>«Лист»</strong>, отметьте <strong>«Черно-белая»</strong>. Если потом сохранить через «Файл» → «Сохранить как» → PDF в самом Excel, заливка пропадёт, а текст будет чёрным, при этом в самом файле цвета останутся.</li>
    <li><strong>Для онлайн-конвертера уберите саму заливку.</strong> Мы проверили чёрно-белую настройку на нашем конвертере, и она не применяется: заливка и цветной текст остаются в PDF. Поэтому, если конвертируете онлайн, сделайте копию листа, выделите таблицу, «Главная» → <strong>«Цвет заливки»</strong> → <strong>«Нет заливки»</strong>, а цвет шрифта поставьте «Авто». Потом конвертируйте копию.</li>
  </ul>

  <h2>Линии жирные только в вашем просмотрщике PDF</h2>

  <p>Бывает, что с PDF всё в порядке, а преувеличивает программа просмотра. В Adobe Acrobat и Reader есть настройка «Установки» → «Отображение страницы» → <strong>«Улучшать тонкие линии»</strong> (Enhance thin lines): с ней любая тонкая линия рисуется толщиной минимум в пиксель при любом масштабе. На масштабе 50% страница с самыми тонкими линиями тогда выглядит так, будто её расчертили маркером. Поставьте масштаб 100% или снимите галочку: если линии стали тонкими, файл с самого начала был в порядке. На печать эта настройка не влияет.</p>

  <h2>Что ещё утолщает линии</h2>

  <ul>
    <li><strong>Масштаб печати больше 100%.</strong> Если в «Параметрах страницы» масштаб установлен на 120%, все границы тоже станут на 20% толще. Вписывание по ширине страницы обычно лист уменьшает, а значит, линии становятся тоньше, а не толще.</li>
    <li><strong>Двойные границы на стыке ячеек.</strong> Если у одной ячейки есть правая граница, а у соседней левая, они рисуются друг поверх друга. Обычно это безвредно, но со средней линией выглядит особенно тяжело. Задавайте границы сразу всему диапазону, а не по одной ячейке.</li>
    <li><strong>Узкие столбцы.</strong> Линии от них толще не становятся, но таблица выглядит тесной: когда текст еле влезает, линии кажутся тяжелее. Если чуть расширить столбцы, станет и читаться легче, и выглядеть лучше.</li>
  </ul>

  <h2>Частые вопросы</h2>

  <h3>Почему в предпросмотре печати Excel границы нормальные, а в PDF жирные?</h3>
  <p>Предпросмотр уменьшен под размер экрана, поэтому линия в 0,75 pt там занимает один пиксель. PDF на масштабе 100% показывает настоящую толщину. Уменьшите PDF до того же размера, и они будут выглядеть одинаково.</p>

  <h3>Можно ли сделать границы тоньше в уже готовом PDF?</h3>
  <p>На практике нет: линии нарисованы прямо на странице. Поменяйте тип линии в таблице и сконвертируйте заново.</p>

  <h3>Сохраняет ли конвертер цвет границ?</h3>
  <p>Да. Цвет границ, заливка и цвет шрифта остаются такими, как в файле.</p>

  <h3>Будут ли самые тонкие линии видны на дешёвом принтере?</h3>
  <p>Да. При 0,1 pt лазерный или струйный принтер рисует самую тонкую линию, на какую способен, и её хорошо видно. Если линии должны пережить факс или ксерокопию, берите тонкую сплошную.</p>

  <h2>Попробуйте</h2>

  <p>Переведите границы на самую тонкую линию, решите, что делать с сеткой и заливкой, сохраните файл и сконвертируйте его в <a href="/ru/excel-to-pdf/">конвертере Excel в PDF</a>. Если таблица к тому же вылезает за край страницы или обрастает пустыми листами, загляните в статью о том, <a href="/ru/blog/excel-to-pdf-cut-off-blank-pages-fix/">почему Excel в PDF обрезает столбцы</a>, а для длинной таблицы пригодится инструкция, <a href="/ru/blog/excel-to-pdf-repeat-header-row-every-page/">как повторять строку заголовка на каждой странице</a>.</p>
