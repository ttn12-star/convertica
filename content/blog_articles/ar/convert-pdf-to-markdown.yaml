content_ar: |
  هناك نوع محدد من الضيق يرافق الحاجة إلى نص محتجز داخل ملف PDF. تحدّد الصفحة، تنسخها، تلصقها في المحرر، فتظهر كتلة أسطر فيها شرطات في منتصف الكلمات، وأرقام صفحات محشورة بين الفقرات، وعناوين فقدت كل ما يدل على أنها عناوين، وجدول وصل على هيئة عمود واحد طويل من الأرقام. بعد عشر دقائق من التنظيف تكون قد أنجزت نصف صفحة.

  Markdown هو الصيغة التي تنتظرها فعليًا معظم تلك الأماكن. مواقع التوثيق ومولدات المواقع الساكنة والويكي وملفات README ومكتبات Obsidian و Notion ومسارات نماذج اللغة كلها تقرأ الماركداون مباشرة. لذا فالحركة المفيدة ليست النسخ واللصق بل التحويل: اجعل من ملف PDF ملفًا بامتداد `.md` يحفظ تدرّج العناوين والجداول، ثم اصرف خمس دقائق في المراجعة بدل ساعة في إعادة الكتابة.

  <h2>ما يقدّمه Markdown ولا يقدر عليه PDF</h2>

  <p>ملف PDF وصف لصفحة مطبوعة. يعرف موضع كل حرف ونوع خطه وحجمه، ولا يعرف تقريبًا أن ذلك السطر كان عنوانًا، وأن ثلاثة أسطر شكّلت قائمة، وأن شبكة الأرقام كانت جدولًا. هذه المعلومة موجودة بصريًا فقط، ولهذا يعطيك النسخ من PDF نصًا بلا بنية.</p>

  <p>الماركداون يعقد المقايضة المعاكسة. لا فكرة لديه عن شكل صفحتك، لكنه يسمّي البنية صراحة: <code>#</code> عنوان، و<code>-</code> عنصر قائمة، والخطوط العمودية تبني جدولًا. وهذا يجعله:</p>

  <ul>
    <li><strong>قابلًا للنقل.</strong> ملف <code>.md</code> يفتح في أي محرر نصوص ويُلصق في أي أداة حديثة تقريبًا دون أن يحمل معه فوضى التنسيق.</li>
    <li><strong>واضح التاريخ.</strong> ضعه في Git وسيصبح كل تغيير لاحق فرقًا مقروءًا سطرًا بسطر، وهو أمر مستحيل مع ملف PDF ثنائي.</li>
    <li><strong>مرنًا في العرض.</strong> النص نفسه يُقرأ بارتياح على الهاتف وفي الطرفية وعلى موقع توثيق، لأن لا شيء فيه مربوط بمقاس صفحة.</li>
    <li><strong>صديقًا للآلة.</strong> البحث والسكربتات ونماذج اللغة تستفيد من بنية معلنة بدل تخمينها من الإحداثيات.</li>
  </ul>

  <h2>لماذا يفعل الناس ذلك في 2026</h2>

  <p>تغيّرت الدوافع خلال عامين. اليوم تكفي أربعة أسباب لتفسير معظم الحالات:</p>

  <ul>
    <li><strong>تقديم المستند لنموذج ذكاء اصطناعي.</strong> المواصفات والأدلة والعقود والأبحاث تصل بصيغة PDF، ونسخة الماركداون هي أرخص وأنظف ما يمكن تسليمه لنموذج أو إضافته إلى فهرس بحث.</li>
    <li><strong>نقل التوثيق القديم.</strong> عشر سنوات من الأدلة بصيغة PDF تنتقل في النهاية إلى موقع توثيق أو ويكي، وهذا الانتقال يكون إلى Markdown.</li>
    <li><strong>الملاحظات الشخصية.</strong> Obsidian و Logseq و Joplin مكتبات ماركداون. التقارير والأبحاث تدخل إليها بصيغة <code>.md</code> أو لا تدخل أبدًا.</li>
    <li><strong>الاقتباس وإعادة الاستخدام.</strong> نقل جدول من تقرير إلى تذكرة عمل أو سجل تغييرات أو مقال أمر بسيط عندما يكون الجدول ماركداون، ومؤلم عندما يكون صورة.</li>
  </ul>

  <h2>كيف تحوّل PDF إلى Markdown في ثلاث خطوات</h2>

  <figure><img src="/static/images/tools/pdf-to-markdown.jpg" alt="محوّل Convertica من PDF إلى Markdown وملف جاهز للتحويل" width="1280" height="800" loading="lazy"></figure>

  <ol>
    <li>افتح <a href="/ar/pdf-to-markdown/">محوّل PDF إلى Markdown</a> وأسقط ملفك فيه. التحويل المجاني يقبل ملفات حتى 15 ميجابايت، وباقة Premium ترفع الحد إلى 100 ميجابايت.</li>
    <li>في المستند العادي اترك خيار <strong>كشف العناوين</strong> وخيار <strong>الحفاظ على الجداول</strong> مفعّلين. الأول يترجم مستويات العناوين المرئية إلى <code>#</code> و<code>##</code> و<code>###</code>، والثاني يحوّل الشبكات المكتشفة إلى جداول ماركداون.</li>
    <li>نفّذ التحويل ونزّل ملف <code>.md</code>. يفتح في أي محرر ويصبح المستند كله قابلًا للقراءة كنص.</li>
  </ol>

  <p>التحويل نصي، لذا فهو سريع، ولا يحتاج حسابًا لبضعة مستندات في اليوم: بدون تسجيل تحصل على 10 تحويلات يوميًا، والحساب المجاني يرفعها إلى 40، وباقة Premium تلغي الحد.</p>

  <h2>كيف يبدو الناتج</h2>

  <p>خذ تقريرًا من صفحة واحدة فيه عنوان وسطر تقديمي وجدول من ثلاثة أعمدة وقسم ملاحظات. هذا ما يعود، دون أي تعديل:</p>

  <pre><code># التقرير الربعي

  الإيرادات حسب المنطقة، جميع الأرقام بآلاف الدولارات.

  | المنطقة | الربع الأول | الربع الثاني |
  | --- | --- | --- |
  | الرياض | 120 | 138 |
  | دبي | 95 | 102 |

  ## ملاحظات

  تباطأ النمو في دبي خلال الربع الثاني بسبب تقويم الأعياد.</code></pre>

  <p>قبل تحويل ملف طويل يفيد معرفة أمرين:</p>

  <ul>
    <li><strong>علامات الصفحات.</strong> المستند الذي يزيد على صفحة واحدة يحصل على عنوان مثل <code>## Page 2</code> وخط أفقي بين الصفحات، فتعرف دائمًا من أين جاء مقطع بعينه. في نص متصل تُحذف هذه العلامات عادة، وفي أرشيف ممسوح ضوئيًا أو ملف قانوني تكون هي بالضبط ما تريد الاحتفاظ به.</li>
    <li><strong>الصفحات الفارغة موسومة.</strong> الصفحة التي لا نص قابل للاستخراج فيها تتحول إلى سطر <code>_No extractable text on this page._</code> بدل أن تختفي بصمت. وتكرار هذا السطر يعني أن ملفك ممسوح ضوئيًا وتحتاج مسار OCR الوارد أدناه.</li>
  </ul>

  <h2>ما ينجو من التحويل وما لا ينجو</h2>

  <p>هنا تصمت معظم الأدلة. كل تحويل من PDF إلى ماركداون هو إعادة بناء للبنية من قرائن بصرية: يجيد بعض الأمور تمامًا، ويستحيل عليه بعضها بحكم التصميم. معرفة الحدود توفّر عليك تدقيق الأجزاء الخاطئة:</p>

  <table>
    <thead>
      <tr><th>العنصر</th><th>النتيجة</th><th>ما يمكن توقعه</th></tr>
    </thead>
    <tbody>
      <tr><td>النص الأساسي وترتيب القراءة</td><td>موثوق</td><td>الفقرات تعود بالترتيب الذي رُصفت به على الصفحة</td></tr>
      <tr><td>العناوين</td><td>صحيحة غالبًا</td><td>تُكتشف من حجم الخط، فالمستند ذو الطباعة المنسجمة ينعكس بنظافة على مستويات <code>#</code></td></tr>
      <tr><td>الجداول ذات الخطوط الظاهرة</td><td>صحيحة غالبًا</td><td>تُصدَّر كجداول ماركداون، والخلايا المدمجة والمتداخلة تُسطَّح</td></tr>
      <tr><td>القوائم النقطية</td><td>جزئيًا</td><td>النص ينجو، لكن الرموز النقطية تصل كمحارف لا كصيغة <code>-</code></td></tr>
      <tr><td>الخط العريض والمائل</td><td>لا</td><td>التوكيد داخل الفقرة لا يُعاد بناؤه، مستويات العناوين وحدها تعود</td></tr>
      <tr><td>الصور والرسوم</td><td>لا</td><td>الإخراج النصي لا يحتوي صورًا، استخرجها بشكل منفصل إن احتجتها</td></tr>
      <tr><td>الروابط</td><td>لا</td><td>العناوين المكتوبة تبقى نصًا، والروابط المخبأة خلف الكلمات تُفقد</td></tr>
      <tr><td>الحواشي ورأس الصفحة وتذييلها</td><td>مبعثرة</td><td>هي نص عادي على الصفحة بالنسبة إلى PDF، فتهبط حيث كانت</td></tr>
      <tr><td>التنسيق بعمودين</td><td>محفوف بالمخاطر</td><td>تخطيطات الأبحاث والصحف قد تشابك الأعمدة، راجع الصفحة الأولى قبل الثقة بالباقي</td></tr>
      <tr><td>الصفحات الممسوحة ضوئيًا</td><td>لا</td><td>بلا طبقة نصية لا شيء لاستخراجه. OCR أولًا</td></tr>
    </tbody>
  </table>

  <p>قاعدة سريعة: إذا كنت تستطيع تحديد النص في قارئ PDF فسينجح التحويل. وإذا لم يفعل التحديد شيئًا فما بين يديك صورة، وتحتاج القسم التالي.</p>

  <h2>إذا كان ملفك ممسوحًا ضوئيًا فابدأ بـ OCR</h2>

  <p>المستند الممسوح ضوئيًا أو المصوَّر لا يملك طبقة نصية، بل بكسلات فقط. تحويله إلى ماركداون ينتج سطر <code>_No extractable text_</code> ولا شيء غيره، وهذه إجابة صادقة لا خلل. أنت بحاجة إلى التعرّف الضوئي على الحروف أولًا:</p>

  <ul>
    <li>للمستند الممسوح ضوئيًا استخدم <a href="/ar/scanned-pdf-to-word/">تحويل PDF الممسوح إلى Word</a>: يشغّل OCR ويعيد ملفًا قابلًا للتحرير يمكنك حفظه ماركداون من محررك.</li>
    <li>لصفحة واحدة أو لقطة شاشة أو صورة، يكون <a href="/ar/image/to-text/">استخراج النص من صورة</a> أسرع، ويعيد نصًا عاديًا ترتّب بنيته بنفسك.</li>
    <li>لا تعرف أي نوع بين يديك؟ دليل <a href="/ar/blog/pdf-to-word-vs-ocr-which-to-use/">PDF إلى Word أم OCR</a> يشرح كيف تميّزهما في عشر ثوان، ومقال <a href="/ar/blog/how-to-extract-text-from-an-image/">استخراج النص من صورة</a> يناقش الدقة.</li>
  </ul>

  <h2>مراجعة خمس دقائق تجعل الناتج صالحًا للنشر</h2>

  <p>لا يسلّمك أي محوّل مستندًا نهائيًا، وهذا المحوّل كذلك. الخبر الجيد أن المراجعة ميكانيكية وتُنجز كلها تقريبًا بالبحث والاستبدال:</p>

  <ol>
    <li><strong>احذف الأثاث.</strong> رؤوس الصفحات وتذييلاتها وأرقامها وإشعارات السرية تتكرر في كل صفحة، وهي أول ما يُحذف.</li>
    <li><strong>أعد وصل الأسطر المقطوعة.</strong> النص المهيّأ للطباعة يحمل فواصل أسطر قاسية داخل الجمل. ابحث عن شرطة تليها نهاية سطر لتلحم الكلمات المشطورة، ثم صِل بقية الأسطر داخل كل فقرة.</li>
    <li><strong>صحّح مستويات العناوين.</strong> الكشف بحجم الخط يعطي مستويات معقولة، لكن مستندًا يعطي العنوان الرئيسي وعناوين الأقسام الشكل نفسه سيحتاج مرورًا واحدًا لرفع أو تنزيل بضع علامات <code>#</code>.</li>
    <li><strong>حوّل الرموز إلى قوائم.</strong> استبدل الرموز النقطية في بداية الأسطر بـ <code>- </code> ليتعامل معها العارض كعناصر قائمة.</li>
    <li><strong>دقّق الجداول.</strong> تأكد من أن عدد الأعمدة يطابق الأصل وأن أي صف لم يفقد خلية. الجداول العريضة هي الأكثر تأثرًا.</li>
    <li><strong>احسم أمر علامات الصفحات:</strong> احذفها إذا أردت مستندًا متصلًا، وأبقها إذا كان مصدر المقطع مهمًا.</li>
  </ol>

  <p>خمس دقائق لكل عشر صفحات مقايضة عادلة مقابل ساعة من إعادة الكتابة، وهي على خلاف إعادة الكتابة لا تضيف أخطاء جديدة إلى الأرقام.</p>

  <h2>Markdown أو نص عادي أو Word أو HTML: كيف تختار</h2>

  <p>الماركداون ليس الجواب دائمًا. الصيغة المناسبة تعتمد على ما سيحدث للنص بعد ذلك:</p>

  <table>
    <thead>
      <tr><th>الهدف</th><th>الصيغة</th><th>السبب</th></tr>
    </thead>
    <tbody>
      <tr><td>توثيق وملاحظات وGit وسياق للذكاء الاصطناعي</td><td><a href="/ar/pdf-to-markdown/">Markdown</a></td><td>البنية محفوظة وتبقى مقروءة كنص عادي</td></tr>
      <tr><td>الكلمات وحدها بلا بنية</td><td><a href="/ar/pdf-to-text/">نص</a></td><td>أبسط إخراج ممكن للبحث والسكربتات وفحص سريع</td></tr>
      <tr><td>متابعة التحرير بالتنسيق</td><td><a href="/ar/pdf-to-word/">Word</a></td><td>يحفظ الشكل ويسمح بتتبع التغييرات والتعليقات</td></tr>
      <tr><td>النشر على الويب كما هو</td><td><a href="/ar/pdf-to-html/">HTML</a></td><td>يفتح في المتصفح بلا أي خطوة بناء</td></tr>
      <tr><td>أرقام ستعيد حسابها</td><td><a href="/ar/pdf-to-excel/">Excel</a></td><td>الخلايا تبقى خلايا، فتعمل المعادلات</td></tr>
    </tbody>
  </table>

  <h2>كيف تسلّم الماركداون لنموذج ذكاء اصطناعي دون تبديد السياق</h2>

  <p>إذا كانت المحطة التالية نموذج لغة أو فهرس استرجاع، فبعض العادات تفرق كثيرًا في جودة الأجوبة:</p>

  <ul>
    <li><strong>أبقِ العناوين.</strong> هي أرخص إشارة ممكنة لتقطيع المستند. التقطيع عند حدود <code>##</code> يعطي أقسامًا يفهم كل منها بمفرده، وهذا أفضل من قطع كل ألف محرف في منتصف جملة.</li>
    <li><strong>احذف الأثاث المتكرر أولًا.</strong> تذييل يتكرر في ستين صفحة يعني ستين مقطعًا شبه متطابق ينافس المحتوى الحقيقي في البحث الشعاعي، وتوكينات مدفوعة داخل الطلب.</li>
    <li><strong>اترك الجداول جداول.</strong> الجدول المبني على الخطوط العمودية يُقرأ لدى النموذج صفوفًا وأعمدة. أما الأرقام نفسها مذوّبة في فقرة فتدفعه إلى ربط الرقم الخطأ بالعنوان الخطأ.</li>
    <li><strong>حوّل مستندًا مستندًا، لا الأرشيف كله.</strong> ملف <code>.md</code> واحد لكل PDF يحفظ إمكان التتبع، فتستطيع الإشارة إلى مصدر أي جواب.</li>
    <li><strong>تحقق من الأرقام المهمة.</strong> التحويل ميكانيكي، لكن خلية مدمجة سُطّحت قد تزحف بقيمة إلى العمود المجاور، ولن يلاحظ ذلك أي نموذج بالنيابة عنك. راجع الأرقام التي ستبني عليها قرارًا مع ملف PDF الأصلي.</li>
  </ul>

  <h2>ماذا يحدث للملف الذي ترفعه</h2>

  <p>التحويل يجري على السيرفر، أي أن ملف PDF يُرفع فعلًا. يُحذف مباشرة بعد انتهاء التحويل، ورابط التنزيل لك وحدك. لا شيء يُفهرس أو يُقرأ أو يُستخدم في تدريب نماذج. وإذا كنت تحوّل توثيقًا داخليًا أو مواد عميل، فملاحظتنا عن <a href="/ar/blog/is-convertica-safe-pdf-file-security-privacy-explained/">كيف تتعامل Convertica مع ملفاتك</a> تشرح قواعد الاحتفاظ بالتفصيل؛ أما المستندات الخاضعة لالتزامات سرية صارمة فالأداة المحلية تبقى الغريزة الصحيحة معها.</p>

  <h2>أسئلة شائعة</h2>

  <h3>هل تنجو جداولي من التحويل؟</h3>
  <p>الجداول ذات خطوط الشبكة الظاهرة تتحول عادة إلى جداول ماركداون كاملة مع صف الرأس. تنخفض الدقة مع الخلايا المدمجة والجداول المتداخلة والجداول التي تقوم على المسافات لا على الخطوط، لأن لا خطوط ليكتشفها المحوّل. راجع الجداول العريضة أولًا، فالشبكات البسيطة صحيحة في شبه كل الحالات.</p>

  <h3>لماذا خرجت عناويني فقرات عادية؟</h3>
  <p>الكشف يعتمد على الطباعة: النص الأكبر بشكل واضح من نص المتن يصبح عنوانًا. أما المستند الذي تتميز عناوينه بالخط العريض أو باللون فقط وبالحجم نفسه، فلا يمنح المحوّل ما يكتشفه. أبقِ الكشف مفعّلًا، حوّل، ثم ارفع العناوين القليلة يدويًا.</p>

  <h3>هل يُحفظ الخط العريض والمائل؟</h3>
  <p>لا. تُعاد بناء مستويات العناوين وبنية الجداول فقط، أما التوكيد داخل الفقرة فلا. إن كان التوكيد مهمًا لك فحوّل إلى <a href="/ar/pdf-to-word/">Word</a> حيث ينتقل تنسيق الحروف.</p>

  <h3>هل يمكنني تحويل كتاب أو دليل من 300 صفحة؟</h3>
  <p>نعم، داخل حد الحجم: 15 ميجابايت في الخطة المجانية و100 ميجابايت مع Premium. ملفات PDF الكبيرة المكوّنة من نص فقط تكون عادة أخف من ذلك بكثير. وإذا استغرق مستند ضخم وقتًا، يمكن تشغيل التحويل في الخلفية وإرسال الناتج إليك بالبريد بدل انتظار التبويب مفتوحًا.</p>

  <h3>هل Markdown أفضل من النص العادي للذكاء الاصطناعي؟</h3>
  <p>لأي شيء أطول من صفحة، نعم. النص العادي يعطي النموذج كلمات بلا تدرّج، والماركداون يعطيه عناوين للتقطيع وجداول لا تزال تُقرأ كجداول. هذه البنية هي ما يتيح لنظام الاسترجاع إعادة قسم متماسك بدل شريحة عشوائية من المحارف.</p>

  <h3>عادت صفحتي كاملة على شكل صف جدول عملاق. ما الذي حدث؟</h3>
  <p>كان هذا يحدث مع ملفات PDF المرصوفة داخل إطار يغطي الصفحة، لأن الإطار يشبه جدولًا بخلية واحدة. المحوّل الآن يرفض الجداول ذات العمود الواحد ويترك النص فقرات، فلا يُفترض أن يتكرر. وإذا استمر ملف معيّن في التصرف بغرابة فحوّله مرة أخرى مع تعطيل الحفاظ على الجداول.</p>

  <h2>جرّبه على ملفك</h2>

  <p>خذ المستند الذي تنوي منذ وقت طويل نقله إلى ملاحظاتك أو إلى موقع توثيقك، ومرّره على <a href="/ar/pdf-to-markdown/">محوّل PDF إلى Markdown</a>. أبقِ كشف العناوين مفعّلًا، قارن الصفحة الأولى بالأصل، ثم أنجز مراجعة الخمس دقائق. وإذا اتضح أن الملف ممسوح ضوئيًا فابدأ من <a href="/ar/scanned-pdf-to-word/">تحويل PDF الممسوح إلى Word</a>. وما بقي تجده في <a href="/ar/all-tools/">جميع الأدوات</a>.</p>
