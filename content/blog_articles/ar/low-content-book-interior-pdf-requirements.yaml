  target_audience: "من ينشر كتب low-content (دفاتر، مذكرات، مخططات، كتب ألغاز وتلوين) عبر الطباعة حسب الطلب، ويحتاج أن يمرّ ملف المتن من المراجعة في المحاولة الأولى."
content_ar: |
  النشر بنمط low-content غريب في أن الجزء الإبداعي غالباً هو الأسهل. فالمذكرة المسطّرة شبكة، وكتاب الألغاز مُخرَج سكربت. ما يوقف الناس هو الرفع، وإشعار الرفض قلّما يشرح نفسه جيداً.

  والخبر الجيد أن قائمة الأسباب قصيرة وميكانيكية ومتشابهة بين خدمات الطباعة. اضبط هذه الخمسة ويمرّ الملف. والأرقام المحددة أدناه تتبع مواصفات أكبر خدمة عند كتابة هذا المقال؛ راجع دائماً المواصفة السارية لمقاس قطعك، لأن هذه الأرقام تُنقَّح.

  <h2>1. مقاس الصفحة يجب أن يكون مقاس القطع بالضبط</h2>

  <p>هذا أكثر أسباب الرفض شيوعاً وأسهلها تجنباً. إذا كان كتابك 6 في 9 بوصات، فكل صفحة في ملف PDF يجب أن تقيس 6 في 9 بوصات. وكتاب 6 في 9 مُصفّح على صفحات US Letter يُرفض تلقائياً، وإن كان المحتوى داخل مساحة 6 في 9 في الوسط.</p>

  <p>التعقيد في هامش النزيف. فإذا وصل أي عنصر إلى حافة الصفحة فأنت تحتاج نزيفاً، والنزيف يغيّر مقاس الصفحة: أضف 0.125 بوصة أعلى وأسفل وعلى الحافة الخارجية. فمتن 6 في 9 مع النزيف يصبح 6.125 في 9.25 بوصة. ولاحظ أن الحافة الداخلية لا تحصل على شيء، لأن تلك الحافة تُجلَّد ولا تُقطَع.</p>

  <p>وإذا كان متنك مجرد سطور أو نقاط أو نص يتوقف قبل الحافة بمسافة مريحة، فلا تحتاج نزيفاً إطلاقاً، ومقاس الصفحة هو مقاس القطع نفسه. ومعظم المذكرات والمخططات تقع هنا، وهذا ما يجعلها الحالة السهلة.</p>

  <p>قيد صادق يستحق المعرفة: تحويل ملف PDF منتهٍ إلى مقاس قطع كتاب ليس شيئاً تفعله أداة مقاس الصفحة عنك. فأداة <a href="/ar/pdf-edit/page-size/">تغيير مقاس صفحة PDF</a> عندنا تتعامل مع A4 وUS Letter وLegal، وهي معايير ورق مكتبي، لا مقاسات قطع مثل 6 في 9 أو 8.5 في 11 التي تتوقعها خدمة الطباعة. لمتن كتاب اضبط مقاس الصفحة في الملف الذي صممت فيه. وإذا كان بحوزتك ملف PDF منتهٍ بالمقاس الخطأ فأنت لا تحوّل بل تعيد البناء.</p>

  <h2>2. هامش التجليد يجب أن يكبر مع عدد الصفحات</h2>

  <p>الهامش الداخلي، الملاصق للكعب، هو الشرط الذي يُنسى، وهو الذي ينتج كتاباً يغرق فيه النص داخل التجليد.</p>

  <p>الكتب الأسمك تتقوّس أكثر عند الكعب، فتأكل من الحافة الداخلية أكثر. ولذلك يتدرّج الشرط:</p>

  <table>
    <thead>
      <tr><th>صفحات المتن</th><th>أدنى هامش داخلي (تجليد)</th></tr>
    </thead>
    <tbody>
      <tr><td>حتى نحو 150</td><td>0.375 بوصة</td></tr>
      <tr><td>نحو 150 إلى 300</td><td>0.5 بوصة</td></tr>
      <tr><td>نحو 300 إلى 500</td><td>0.625 بوصة</td></tr>
      <tr><td>نحو 500 إلى 700</td><td>0.75 بوصة</td></tr>
      <tr><td>أكثر من نحو 700</td><td>0.875 بوصة</td></tr>
    </tbody>
  </table>

  <p>والحواف الثلاث الأخرى أبسط: 0.25 بوصة على الأقل، وترتفع إلى 0.375 بوصة في الصفحات التي تستخدم النزيف. تعامل مع الرقمين كحدّين أدنى لا كهدف. فمذكرة بهوامش خارجية 0.5 بوصة تبدو مقصودة، وأخرى بـ 0.25 بالضبط تبدو كأنها مرّت بالكاد.</p>

  <p>ولأن هامش التجليد يبدّل الجهة، فالصفحة اليسرى واليمنى ليستا التصفيح نفسه. وإذا كان في برنامجك خيار الهوامش المتناظرة أو الصفحات المتقابلة فاستخدمه. وبناء كل الصفحات بشكل متطابق هو الطريق المؤكد إلى كتاب صفحاته الزوجية سليمة والفردية غير مقروءة قرب الكعب.</p>

  <h2>3. الخطوط يجب أن تكون مضمَّنة</h2>

  <p>المتن بخطوط غير مضمَّنة إما يُرفض، أو الأسوأ، يُطبع بحرف بديل يعيد صبّ كل التباعد الذي ضبطته بعناية. وهذا فشل صامت: الملف يبدو صحيحاً على جهازك لأن الخط مثبَّت هناك.</p>

  <p>كل نافذة تصدير جدية فيها خيار تضمين الخطوط، وأدوات المتصفح تفعله تلقائياً. تحقّق ولا تفترض: افتح ملف PDF، وانظر خصائص المستند، وابحث عن تبويب الخطوط، وتأكد أن كل مدخل مكتوب أمامه «مضمَّن» أو «مجموعة فرعية مضمَّنة». وإذا رفض خط أن يُضمَّن بسبب ترخيصه فحوّل ذلك النص إلى مسارات.</p>

  <h2>4. الشفافية يجب تسطيحها</h2>

  <p>الشفافية الحيّة والظلال وأنماط الدمج والطبقات نصف المعتمة مصدر شائع للمفاجآت في مرحلة الطباعة: فالتأثير إما يختفي أو يتحول إلى مستطيل رمادي. وخدمات الطباعة تطلبها مسطّحة، والأسلم أن تسطّح قبل الرفع لا أن تأمل أن يخمّن المحوّل صحيحاً.</p>

  <p><a href="/ar/pdf-edit/flatten/">تسطيح ملف PDF</a> يدمج الطبقات والعناصر التفاعلية في محتوى صفحة ثابت، ويزيل في الطريق حقول النماذج والتعليقات التي لا مكان لها في متن مطبوع. ولا يعيد تشكيل الصور، فدقة الطباعة لا تتأثر. ولمخرج أكثر صرامة بمستوى أرشيفي، فإن <a href="/ar/pdf-to-pdfa/">التحويل إلى PDF/A</a> يفرض بحكم تصميمه خطوطاً مضمَّنة ومحتوى مكتفياً بذاته، وهذا فحص احتياطي مفيد حتى عندما لا تطلب الخدمة PDF/A تحديداً. ومقالنا عن <a href="/ar/blog/what-is-pdf-a-and-how-to-convert/">ما هو PDF/A</a> يشرح ما يضمنه المعيار وما لا يضمنه.</p>

  <h2>5. صفحات مفردة لا مزدوجة</h2>

  <p>صدّر صفحة واحدة لكل صفحة. فالصفحة المزدوجة المصدَّرة كصفحة عريضة واحدة تُقرأ كصفحة ضخمة بمقاس خاطئ وتُرفض. وهذا يوقع من صمّم في برنامج تصفيح تظهر فيه الصفحات المتقابلة على الشاشة: العرض مزدوج، والتصدير يجب أن يكون مفرداً.</p>

  <p>والأمر نفسه ينطبق على علامات القص وعلامات التسجيل. فهي تنتمي إلى أعمال المطابع التجارية لا إلى رفع الطباعة حسب الطلب، والخدمة التي تقصّ وفق علاماتها الخاصة ستطبع علاماتك بسرور كأنها محتوى.</p>

  <h2>أرقام الصفحات ومتى تُترك</h2>

  <p>كتب low-content تنقسم هنا. فالمذكرة المسطّرة عادة لا ينبغي أن تحمل أرقام صفحات، لأن المشتري قد يستخدم الصفحات بأي ترتيب والرقم ضجيج بصري. أما كتاب الألغاز وكتاب التدريب وكل ما فيه فهرس فيحتاجها.</p>

  <p>وإذا أضفتها فافعل ذلك بعد أن يصبح ترتيب الصفحات نهائياً، عبر <a href="/ar/pdf-edit/add-page-numbers/">إضافة أرقام الصفحات</a>، وداخل الهوامش الآمنة أعلاه. فالرقم الذي يجلس على 0.2 بوصة من حافة القص هو أول ما يختفي. وتذكّر أيضاً أن الموضع يجب أن يتبادل إن أردت الأرقام على الحافة الخارجية لكل صفحة، و<a href="/ar/blog/add-page-numbers-to-pdf/">شرحنا للترقيم</a> يغطي الإزاحات لتجاوز الصفحات الأولى.</p>

  <h2>الفحص قبل الرفع</h2>

  <table>
    <thead>
      <tr><th>ما تفحصه</th><th>كيف</th></tr>
    </thead>
    <tbody>
      <tr><td>كل صفحة بمقاس القطع بالضبط (زائد النزيف إن وُجد)</td><td>افتح الملف واقرأ الأبعاد؛ تأكد من الأولى وواحدة في الوسط والأخيرة</td></tr>
      <tr><td>هامش التجليد يوافق عدد الصفحات</td><td>قارن بالجدول أعلاه، وافحص صفحة يسرى وصفحة يمنى على حدة</td></tr>
      <tr><td>باقي الهوامش 0.25 بوصة على الأقل، أو 0.375 مع النزيف</td><td>قِس من حافة القص لا من حافة النزيف</td></tr>
      <tr><td>الخطوط مضمَّنة</td><td>خصائص المستند، تبويب الخطوط، الكل «مضمَّن»</td></tr>
      <tr><td>لا شفافية حيّة ولا طبقات ولا حقول نماذج</td><td>سطّح، ثم تأكد أن النقر لا يحدّد شيئاً</td></tr>
      <tr><td>صفحات مفردة، بلا مزدوجات ولا علامات قص</td><td>تصفّح الملف: كل صفحة صفحة كتاب واحدة</td></tr>
      <tr><td>عدد الصفحات زوجي وفوق حدّ الخدمة الأدنى</td><td>معظم الخدمات تريد 24 صفحة متن على الأقل ومجموعاً زوجياً</td></tr>
    </tbody>
  </table>

  <p>الصف الأخير يوقع أكثر مما ينبغي. فالطباعة تشترط عدد صفحات زوجياً لأن الصفحات تأتي في أفرخ، والخدمات تضع حداً أدنى لا يمكن تجليد الكتاب تحته. أضف صفحة فارغة ولا تقتطع محتوى.</p>

  <h2>ماذا يحدث للملف الذي ترفعه</h2>

  <p>أدواتنا تعمل على الخادم، فالملف يُرفع. ويُحذف بمجرد انتهاء المهمة، ورابط التنزيل لك وحدك. لا شيء يُفهرس أو يُحفظ أو يُعاد استخدامه للتدريب. ومقالنا عن <a href="/ar/blog/is-convertica-safe-pdf-file-security-privacy-explained/">كيف تتعامل Convertica مع ملفاتك</a> يبيّن قواعد الاحتفاظ إن كانت المخطوطة غير منشورة.</p>

  <h2>أسئلة متكررة</h2>

  <h3>هل تحتاج المذكرة المسطّرة هامش نزيف؟</h3>
  <p>لا تكاد. هامش النزيف موجود ليبقى الرسم الممتد إلى الحافة سليماً بعد القص، والمذكرة التي تتوقف سطورها داخل الهوامش بمسافة مريحة لا شيء لديها عند الحافة يستحق الحماية. تجاوز النزيف، واجعل مقاس الصفحة مساوياً لمقاس القطع، وتكون قد أزلت فئة كاملة من الأخطاء الحسابية.</p>

  <h3>هل أستطيع تحويل متن A4 إلى كتاب 6 في 9؟</h3>
  <p>ليس بطريقة تنتج كتاباً جيداً. النسب مختلفة، فلا بد أن يُحجَّم شيء أو يُقتطع، وهوامشك المضبوطة بعناية تتوقف عن مطابقة شرط التجليد. أعد بناء المتن على مقاس القطع في برنامج التصميم. وهذا هو الموضع الوحيد الذي يكون فيه إعادة التصفيح أسرع فعلاً من مصارعة تحويل.</p>

  <h3>ما الحدّ الأدنى لعدد الصفحات الذي أخطط له؟</h3>
  <p>معظم خدمات الطباعة حسب الطلب تريد 24 صفحة متن على الأقل، وكلها تريد مجموعاً زوجياً. ولكتب low-content ذلك سهل، لكن راجع الخدمة المحددة قبل أن تستقر على 100 صفحة من لغز مولَّد، فالرقم المستدير الذي اخترته قد يكون أقل من عتبة بصفحة واحدة.</p>

  <h3>هل يجب أن يكون المتن PDF/A؟</h3>
  <p>غير مطلوب عادة، ومفيد أحياناً. قيمة تمرير المتن على <a href="/ar/pdf-to-pdfa/">تحويل PDF/A</a> أن المعيار يحرّم تحديداً ما يسبب مشاكل الطباعة: الخطوط غير المضمَّنة والمحتوى الذي يعتمد على أي شيء خارج الملف. تعامل معه كخطوة تحقّق لا كشرط.</p>

  <h3>لماذا رُفض ملفي وهو يبدو سليماً لي؟</h3>
  <p>بترتيب الاحتمال: مقاس الصفحة لا يساوي مقاس القطع بالضبط، أو هامش التجليد أرقّ مما يسمح عدد الصفحات، أو الخطوط غير مضمَّنة، أو أنك صدّرت صفحات مزدوجة. والأربعة تبدو سليمة على الشاشة، ولهذا بالضبط هي الأربعة الشائعة. افحصها بهذا الترتيب.</p>

  <h3>هل أضع اسم متجري أو صفحة ترخيص في متن الكتاب؟</h3>
  <p>صفحة حقوق النشر عادية ومتوقعة في كتاب، بخلاف تنزيل قابل للطباعة حيث تعمل صفحة الترخيص أكثر. أبقِها في الصفحات الأولى، ولا تضف تذييلاً في كل صفحة: كتاب مطبوع يحمل عنوان متجرك في 120 صفحة يُقرأ كقالب، وهذا بالضبط الانطباع الذي يريد ناشر low-content تجنّبه.</p>

  <h2>جهّز المتن</h2>

  <p>اضبط مقاس الصفحة في برنامج التصميم قبل أن ترسم شيئاً، وفعّل الهوامش المتناظرة، ثم <a href="/ar/pdf-edit/flatten/">سطّح</a> المُخرَج وافحص تبويب الخطوط. وإن أردت تحققاً أصرم فمرّره على <a href="/ar/pdf-to-pdfa/">PDF/A</a> وانظر هل يعترض. وإذا كنت تبيع مطبوعات رقمية إلى جانب كتبك، فدليلنا عن <a href="/ar/blog/sell-printable-pdf-on-etsy/">تجهيز ملف PDF قابل للطباعة للبيع</a> ومقالنا عن <a href="/ar/blog/stop-buyers-editing-reselling-your-pdf/">ما تحققه حماية الملف فعلاً</a> يغطيان ذلك الجانب. وما تبقى موجود في <a href="/ar/all-tools/">كل الأدوات</a>.</p>
