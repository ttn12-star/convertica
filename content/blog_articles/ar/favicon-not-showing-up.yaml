content_ar: |
  صنعت الأيقونة، ورفعتها إلى الخادم، وأضفت الوسم في الترويسة، وما زال تبويب المتصفح يعرض تلك الورقة الفارغة. هذه واحدة من المشكلات التي يبدو فيها كل شيء صحيحًا ولا يعمل شيء، ولهذا بالضبط ينتهي الأمر بالناس إلى رفع الملف نفسه ست مرات.

  الخبر الجيد أن قائمة الأسباب الحقيقية قصيرة. اتبعها بالترتيب أدناه، لأن هذا الترتيب يطابق مدى تكرار كل سبب في الواقع. معظم الناس يتوقفون عند الخطوة الثانية.

  <h2>الخطوة صفر: تأكد أن الملف موجود فعلًا</h2>

  <p>قبل أن تلمس أي شيء آخر، افتح الأيقونة عبر رابطها المباشر. اكتبه في شريط العنوان:</p>

  <p><code>https://mawqiuk.com/favicon.ico</code></p>

  <p>يفترض أن ترى الصورة وحدها على خلفية بيضاء. بدلًا من ذلك قد تحدث ثلاثة أمور، وكل واحد منها يشير إلى اتجاه مختلف:</p>

  <ul>
    <li><strong>صفحة 404.</strong> الملف ليس حيث تظن. انتقل مباشرة إلى قسم المسارات.</li>
    <li><strong>تفتح الصفحة الرئيسية.</strong> الخادم يعيد توجيه العناوين غير المعروفة إلى الموقع بصمت، ما يعني أن الملف مفقود وأن إطار العمل يغطي عليه. العلاج نفسه علاج الـ404، لكنك ما كنت لتلاحظه من رمز الاستجابة.</li>
    <li><strong>أيقونة صورة معطوبة.</strong> الملف موجود لكن المتصفح لا يستطيع قراءته. تلك مشكلة إعادة التسمية، وهي أدناه.</li>
  </ul>

  <p>إن ظهرت الأيقونة صحيحة عبر رابطها المباشر، فالملف سليم والمشكلة إما في التخزين المؤقت وإما في الوسوم.</p>

  <h2>السبب الأول: التخزين المؤقت، وهو أسوأ مما تظن</h2>

  <p>المتصفحات تحتفظ بأيقونات المواقع بإصرار أكبر بكثير من أي ملف آخر. إعادة التحميل العادية لا تطلبها من جديد، والتحديث القسري كذلك في أغلب المتصفحات. مخزن الأيقونات منفصل عن ذاكرة الصفحات المؤقتة، وينجو من أشياء تتوقع أنها ستمسحه.</p>

  <p>لذلك لا تثق بإعادة التحميل. اختبر بطريقة أخرى:</p>

  <ul>
    <li>افتح الموقع في نافذة تصفح خاص. ملف تعريف جديد ومخزن أيقونات فارغ.</li>
    <li>أو افتح رابط الأيقونة مباشرة ثم أعد تحميل الصفحة.</li>
    <li>أو جرب من الهاتف، أو من متصفح لم تفتح به هذا الموقع من قبل.</li>
  </ul>

  <p>إن ظهرت الأيقونة في النافذة الخاصة ولم تظهر في العادية، فقد حصلت على الإجابة. لا شيء معطوب. متصفحك متمسك بالأيقونة القديمة وسيتركها من تلقاء نفسه خلال أيام.</p>

  <p>ملاحظة إن كانت أمام موقعك شبكة توصيل محتوى. كلاودفلير وما شابهها تحتفظ بالأيقونة عندها أيضًا، ومسح متصفحك لا يصل إلى هناك. امسح الملف من لوحة الشبكة ثم اختبر في نافذة خاصة.</p>

  <h2>السبب الثاني: المسار في وسم link</h2>

  <p>هنا يتعثر أكثر الناس، والسبب غالبًا مسار نسبي. انظر إلى هذا الوسم:</p>

  <p><code>&lt;link rel="icon" href="favicon.ico"&gt;</code></p>

  <p>في الصفحة الرئيسية يتحول إلى <code>/favicon.ico</code> فيعمل. وفي <code>/blog/maqali/</code> يتحول إلى <code>/blog/maqali/favicon.ico</code> وهو غير موجود. تظهر الأيقونة في بعض الصفحات وتختفي في غيرها، ويبدو الأمر عشوائيًا حتى تلاحظ النمط.</p>

  <p>استخدم دائمًا مسارًا يبدأ بشرطة مائلة:</p>

  <p><code>&lt;link rel="icon" href="/favicon.ico"&gt;</code></p>

  <p>وبما أنك هناك، تأكد أن الوسم داخل <code>&lt;head&gt;</code>. وسم link الذي انتهى به المطاف في جسم الصفحة يُتجاهل، ولا أحد ينبهك إلى ذلك.</p>

  <h2>السبب الثالث: الملف أعيدت تسميته ولم يُحوَّل</h2>

  <p>تغيير اسم <code>logo.png</code> إلى <code>favicon.ico</code> لا يجعله ملف ICO. يجعله ملف PNG باسم مضلل. بعض المتصفحات متسامحة وستعرضه على أي حال، وهنا تكمن القسوة: يعمل عندك ويفشل عند زائر يستخدم متصفحًا آخر، فلا ترى الخلل أبدًا.</p>

  <p>صيغة ICO حاوية لها ترويستها الخاصة، وتستطيع حمل عدة أحجام في ملف واحد، وهذا سبب بقائها حتى اليوم. أما PNG فلا يملك شيئًا من هذه البنية.</p>

  <p>حوِّل الملف تحويلًا حقيقيًا بدل إعادة التسمية. أداة <a href="/ar/image/png-to-ico/">تحويل PNG إلى ICO</a> تكتب ملف ICO حقيقيًا متعدد الأحجام، و<a href="/ar/image/svg-to-ico/">تحويل SVG إلى ICO</a> يفعل الشيء نفسه انطلاقًا من رسم متجهي. وإن أردت المجموعة كاملة دفعة واحدة، بما فيها أحجام PNG وأيقونة آبل، فإن <a href="/ar/image/favicon-generator/">مولد أيقونات المواقع</a> ينتج الحزمة كلها من رفعة واحدة.</p>

  <h2>السبب الرابع: الأيقونة ليست في جذر النطاق</h2>

  <p>حين لا يخبره أي وسم بغير ذلك، يبحث المتصفح عن <code>/favicon.ico</code> في أعلى النطاق. فإن كان موقعك يعيش في مجلد فرعي، أو نشرته كصفحة مشروع لا على جذر النطاق، فإن الطلب التلقائي يخطئ الهدف.</p>

  <p>هذا شائع في الاستضافة الثابتة. موقع يُقدَّم من <code>username.github.io/project/</code> جذره هو <code>username.github.io</code>، وإلى هناك يذهب الطلب. أما أيقونتك في مجلد المشروع فلا يطلبها أحد.</p>

  <p>أمامك مخرجان: ضع الملف في جذر النطاق الفعلي، أو صرّح بموقعه الحقيقي عبر وسم link صريح. الوسم الصريح أوثق، وستحتاج إليه على أي حال بمجرد أن يصير لديك أكثر من حجم.</p>

  <h2>السبب الخامس: الخادم يرسل شيئًا آخر</h2>

  <p>بعض الإعدادات تعيد صفحة خطأ بصيغة HTML مع رمز الحالة 200. يطلب المتصفح أيقونة فيستقبل صفحة ولا يعرض شيئًا. ولأن الحالة تقول إن الطلب نجح، لا يبدو شيء غريبًا في تبويب الشبكة من النظرة الأولى.</p>

  <p>تحقق مما يصل فعلًا:</p>

  <p><code>curl -I https://mawqiuk.com/favicon.ico</code></p>

  <p>تريد <code>content-type: image/x-icon</code> أو <code>image/vnd.microsoft.icon</code> لملف ICO، و<code>image/png</code> لأيقونة PNG. وإن رأيت <code>text/html</code> فالخادم يعيد صفحة لا ملفًا.</p>

  <p>وألقِ نظرة أيضًا على <code>robots.txt</code>. حجب المجلد الذي يحوي الأيقونات لا يوقف المتصفحات لكنه يوقف محركات البحث، وهذا مهم في القسم التالي.</p>

  <h2>السبب السادس: المنصة تتجاوز وسمك</h2>

  <p>ووردبريس وشوبيفاي وسكوير سبيس وويكس تحقن جميعها وسم الأيقونة الخاص بها من إعدادات القالب. فإن عدّلت قالبًا يدويًا وأضفت وسمًا ثانيًا، صار لديك وسمان، والفائز عادة هو وسم المنصة لأنه يأتي لاحقًا في الترويسة.</p>

  <p>اعرض مصدر الصفحة الناتجة لا قالبك، وابحث عن <code>rel="icon"</code>. إن وجدت أكثر من واحد، احذف وسمك واضبط الأيقونة من الحقل الخاص بالمنصة. في ووردبريس هو «أيقونة الموقع» ضمن المظهر، وهو يطلب صورة مربعة بـ512 بكسل على الأقل.</p>

  <h2>السبب السابع: نتائج جوجل لها جدولها الخاص</h2>

  <p>هذه مشكلة مختلفة ترتدي الثوب نفسه. الأيقونة تظهر في المتصفح ولا تظهر بجوار نتيجتك في البحث، ولا يغير مسح الذاكرة المؤقتة شيئًا مهما كررته.</p>

  <p>جوجل يحتفظ بذاكرة أيقونات منفصلة تتحدث وفق جدوله هو. بضعة أسابيع أمر طبيعي. لا يوجد زر للتعجيل. ما تستطيعه هو إزالة كل ما قد يعرقل التحديث حين يأتي:</p>

  <ul>
    <li>يجب أن تكون الأيقونة متاحة لعنكبوت جوجل، أي لا خلف قاعدة في robots.txt ولا خلف تسجيل دخول.</li>
    <li>يجب أن تكون مربعة وبمقاس 48 في 48 بكسل على الأقل. الأصغر يُتجاهل.</li>
    <li>ينبغي أن تسري الأيقونة نفسها على الموقع كله وأن يُصرَّح بها في الصفحة الرئيسية.</li>
    <li>ينبغي أن يبقى رابط الأيقونة ثابتًا. تغيير الاسم مع كل نشر يعيد العداد إلى الصفر.</li>
  </ul>

  <p>ومتى تحقق ذلك، لم يبق سوى الصبر.</p>

  <h2>قائمة تحقق سريعة</h2>

  <ul>
    <li>هل تفتح الأيقونة عبر رابطها المباشر؟</li>
    <li>هل اختبرت في نافذة خاصة قبل أن تستنتج شيئًا؟</li>
    <li>هل المسار في <code>href</code> مطلق ويبدأ بشرطة مائلة؟</li>
    <li>هل الوسم داخل <code>&lt;head&gt;</code> وهل هو الوحيد؟</li>
    <li>هل حُوِّل الملف إلى ICO ولم تُغيَّر تسميته فقط؟</li>
    <li>هل يعيد <code>curl -I</code> نوع صورة؟</li>
    <li>إن كانت هناك شبكة توصيل، هل مسحت ذاكرتها؟</li>
    <li>لنتائج البحث: هل الأيقونة مربعة وبـ48 بكسل فأكثر ومتاحة للزحف؟</li>
  </ul>

  <h2>أسئلة شائعة</h2>

  <h3>لماذا تظهر الأيقونة في بعض الصفحات دون غيرها؟</h3>
  <p>بسبب مسار نسبي في وسم link. يتحول بحسب العنوان الحالي، فيشير إلى موضع صحيح في الصفحة الرئيسية وإلى فراغ في الصفحات الأعمق. غيّر <code>href="favicon.ico"</code> إلى <code>href="/favicon.ico"</code>.</p>

  <h3>مسحت الذاكرة المؤقتة وما زالت الأيقونة القديمة تظهر.</h3>
  <p>مسح بيانات التصفح لا يفرغ دائمًا مخزن الأيقونات، فالمتصفح يحفظه على حدة. استخدم نافذة خاصة لتتأكد أن الأيقونة الجديدة تُقدَّم فعلًا. إن ظهرت هناك فملفك سليم، وملفك الشخصي المعتاد سيلحق قريبًا.</p>

  <h3>هل ما زلت بحاجة إلى favicon.ico مع وجود أيقونات PNG؟</h3>
  <p>أبقِه. المتصفحات تطلب <code>/favicon.ico</code> من الجذر حتى مع تصريحك بأيقونات PNG، وبعض الأدوات والزواحف تبحث عنه بالاسم. وجود الاثنين يكلف بضعة كيلوبايتات فقط.</p>

  <h3>هل يكفي تغيير امتداد ملف PNG إلى ico؟</h3>
  <p>لا، وإن بدا أنه يعمل في المتصفح الذي جربته. لصيغة ICO بنية حاوية خاصة بها. حوّل الملف تحويلًا حقيقيًا وستتخلص من خلل لا يراه سوى بعض الزوار.</p>

  <h3>كم أنتظر حتى تظهر الأيقونة في جوجل؟</h3>
  <p>أسابيع عادة، ولا سبيل لطلب ذلك أبكر. تأكد أن الأيقونة مربعة وبـ48 بكسل على الأقل ومتاحة للزحف ومصرَّح بها في الصفحة الرئيسية، ثم اتركها وشأنها.</p>

  <h3>لماذا تبدو واضحة في التبويب ومشوشة على شاشة الهاتف الرئيسية؟</h3>
  <p>الشاشة الرئيسية تستعمل أيقونة أكبر بكثير، 180 بكسل في آي أو إس، وهي تكبّر الأيقونة الصغيرة. تحتاج إلى <code>apple-touch-icon</code> مخصص بالمقاس الصحيح، لا إلى ملف واحد صغير يؤدي كل الأدوار.</p>

  <h2>ابدأ من مجموعة ملفات نظيفة</h2>

  <p>إن كنت ترقّع ملف أيقونة واحدًا منذ فترة، فإعادة توليد المجموعة كاملة أسرع عادة من مواصلة تنقيحه. ارفع شعارك إلى <a href="/ar/image/favicon-generator/">مولد أيقونات المواقع</a> لتحصل على كل الأحجام التي يطلبها المتصفح، وملف ICO حقيقي متعدد الأحجام، وأيقونة آبل، والكود الجاهز للصق. وللتحويلات المفردة هناك <a href="/ar/image/png-to-ico/">PNG إلى ICO</a> و<a href="/ar/image/jpg-to-ico/">JPG إلى ICO</a> و<a href="/ar/image/webp-to-ico/">WebP إلى ICO</a>، أما <a href="/ar/image/ico-to-png/">ICO إلى PNG</a> فيعمل في الاتجاه المعاكس حين تريد أن ترى ما بداخل أيقونة موجودة. وإن كنت تبحث عن الأساسيات حول المقاسات والوسوم لا عن الإصلاحات، فذلك في <a href="/ar/blog/how-to-create-a-favicon/">الدليل الكامل لإنشاء أيقونة الموقع</a>.</p>
