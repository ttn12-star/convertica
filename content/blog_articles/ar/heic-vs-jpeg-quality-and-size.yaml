content_ar: |
  تلاحق صيغة HEIC عبارتان في كل مكان. أن ملفاتها تعادل نصف حجم JPEG تقريبًا، وأن تحويلها يكلفك جودة. الأولى تتكرر كثيرًا حتى صار لا أحد يتحقق منها، والثانية تقلق الناس بما يكفي ليحتفظوا بأصول لن يفتحوها مرة أخرى.

  قسنا الاثنتين. سبع صور بدقة 12 ميجابكسل، وهي الدقة التي تكتبها الكاميرا الرئيسية في الآيفون، رُمّزت إلى HEIC ثم حُوّلت إلى JPEG بالإعدادات نفسها التي يستخدمها محوّلنا: جودة 90 مع تفعيل التحسين. سُجّلت الأحجام، وقيست الجودة بمقياسي PSNR و SSIM لا بالنظر.

  <h2>الأرقام</h2>

  <table>
    <tr><th>الصورة</th><th>HEIC</th><th>JPEG ج90</th><th>الزيادة</th><th>PSNR</th><th>SSIM</th></tr>
    <tr><td>قط على الثلج، تفاصيل كثيرة</td><td>0.73 م.ب</td><td>1.73 م.ب</td><td>2.36x</td><td>47.8 د.ب</td><td>0.9954</td></tr>
    <tr><td>بورتريه بخلفية ناعمة</td><td>1.44 م.ب</td><td>2.42 م.ب</td><td>1.68x</td><td>44.3 د.ب</td><td>0.9967</td></tr>
    <tr><td>مشهد من الشارع</td><td>1.20 م.ب</td><td>2.23 م.ب</td><td>1.85x</td><td>44.1 د.ب</td><td>0.9965</td></tr>
    <tr><td>منظر طبيعي بسماء مفتوحة</td><td>0.90 م.ب</td><td>1.71 م.ب</td><td>1.90x</td><td>48.0 د.ب</td><td>0.9983</td></tr>
    <tr><td>موضوع مسطح قليل الملمس</td><td>0.30 م.ب</td><td>0.70 م.ب</td><td>2.32x</td><td>51.8 د.ب</td><td>0.9986</td></tr>
    <tr><td>أوراق شجر كثيفة الملمس</td><td>1.70 م.ب</td><td>2.82 م.ب</td><td>1.66x</td><td>42.5 د.ب</td><td>0.9969</td></tr>
    <tr><td>حشد بتفاصيل دقيقة</td><td>2.14 م.ب</td><td>3.44 م.ب</td><td>1.61x</td><td>43.0 د.ب</td><td>0.9971</td></tr>
    <tr><td><strong>السبع مجتمعة</strong></td><td><strong>8.42 م.ب</strong></td><td><strong>15.05 م.ب</strong></td><td><strong>1.79x</strong></td><td></td><td></td></tr>
  </table>

  <p>من هذا الجدول يخرج أمران.</p>

  <h3>فارق الحجم حقيقي، وليس النصف بالضبط</h3>

  <p>عبر المجموعة كلها، جاء JPEG أكبر بـ1.79 مرة من أصل HEIC. عبارة «النصف» الشائعة قريبة بما يكفي للاستعمال، لكن المدى مهم: من 1.61 مرة في صورة حشد كثيفة الملمس إلى 2.36 مرة في لقطة عالية التباين لقط على الثلج.</p>

  <p>النمط يتضح بمجرد ملاحظته. تفوّق HEIC يبلغ ذروته في الصور ذات المساحات الناعمة والحواف النظيفة، لأن ضغطه يتعامل معها أفضل بكثير من أسلوب JPEG الأقدم. أما الصور المكتظة بملمس دقيق ومشوَّش فتُتعب الصيغتين معًا، فتضيق الفجوة.</p>

  <p>عمليًا: ألف صورة تشغل 8 جيجابايت على هاتفك ستشغل نحو 14 جيجابايت بصيغة JPEG. هذه هي الكلفة الفعلية لتغيير الصيغة.</p>

  <h3>فقد الجودة غير مرئي</h3>

  <p>هنا يتبين أن القلق في غير محله. تراوح PSNR في المجموعة بين 42.5 و51.8 ديسيبل، و SSIM بين 0.9954 و0.9986.</p>

  <p>وللمقارنة، يوصف PSNR فوق 40 ديسيبل عادة بأنه غير قابل للتمييز بصريًا، و SSIM فوق 0.99 يعني أن الفارق البنيوي بين صورتين مجرد خطأ تقريب. وأسوأ نتيجة عندنا، 42.5 ديسيبل في صورة الأوراق الأكثف، ما زالت داخل هذا النطاق بارتياح. لن تجد الفرق بالنظر، ولن يجده من ترسل إليه الصورة.</p>

  <p>فالخلاصة الصادقة أن تحويل HEIC إلى JPEG يكلفك مساحة تخزين، لا جودة صورة.</p>

  <h2>أي إعداد جودة تستعمل فعلًا</h2>

  <p>محوّلنا يستخدم الجودة 90 افتراضيًا، وهي ما يقيسه الجدول أعلاه. وقد مررنا الصور نفسها بجودتي 80 و70 لنرى ما يقدمه هذا الإعداد:</p>

  <table>
    <tr><th>جودة JPEG</th><th>الحجم الإجمالي لسبع صور</th><th>مقارنة بـHEIC</th></tr>
    <tr><td>90 (الافتراضي)</td><td>15.05 م.ب</td><td>1.79x</td></tr>
    <tr><td>80</td><td>11.61 م.ب</td><td>1.38x</td></tr>
    <tr><td>70</td><td>10.03 م.ب</td><td>1.19x</td></tr>
  </table>

  <p>النزول من 90 إلى 80 يزيل نحو ربع الحجم. وفي معظم الصور تبقى هذه الخطوة صعبة الملاحظة دون تدقيق في البكسلات، ما يجعل 80 خيارًا معقولًا حين ترسل دفعة بالبريد أو ترفعها إلى موقع.</p>

  <p>أبقِ الجودة عند 90 إن كانت الصورة ستُطبع أو ستُعدَّل لاحقًا أو ستُؤرشف. كل حفظ بصيغة JPEG يفقد بيانات، لذا الملف الذي ستعود إليه بالتعديل يجب أن يبدأ من أعلى ما تستطيع.</p>

  <h2>لماذا تبدو صورتك المحوَّلة مشوشة أحيانًا فعلًا</h2>

  <p>تقول القياسات إن خطوة التحويل نظيفة بصريًا، ومع ذلك تبقى شكوى «heic إلى jpg مشوشة» حقيقية ومتكررة. والأمران قد يصحان معًا، لأن التشويش يأتي عادة من موضع آخر في السلسلة.</p>

  <ul>
    <li><strong>المحوّل صغّر الصورة.</strong> بعض الأدوات المجانية تحدّ الناتج بصمت عند 1920 بكسل عرضًا أو أقل. وصورة بدقة 12 ميجابكسل مصغّرة إلى حجم مصغّرة ويب ستبدو رخوة عند أول تكبير. انظر إلى أبعاد الناتج بالبكسل لا إلى حجم الملف وحده.</li>
    <li><strong>أنت تنظر إلى معاينة لا إلى الملف.</strong> عارضات الصور ومعارض الويب تعرض غالبًا نسخة مخبأة منخفضة الدقة أولًا. افتح الملف كما ينبغي قبل أن تحكم عليه.</li>
    <li><strong>تطبيق مراسلة أعاد ضغطها.</strong> إرسال صورة عبر تطبيق محادثة يعني عادة جولة ضغط ثانية أقسى بكثير. التحويل كان سليمًا، والتسليم لم يكن. أرسلها ملفًا أو مستندًا لا صورة.</li>
    <li><strong>الجودة ضُبطت منخفضة جدًا.</strong> تحت 60 تقريبًا تظهر عيوب JPEG على درجات البشرة والتدرجات. وإن لم تمنحك الأداة خيارًا، فأنت لا تعرف ما استعملته.</li>
  </ul>

  <p>فإن كان ناتج <a href="/ar/image/heic-to-jpg/">محوّل HEIC إلى JPG</a> بالأبعاد نفسها بالبكسل مثل الأصل وما زال يبدو رخوًا، فالرخاوة كانت في الصورة أصلًا.</p>

  <h2>HEIF و HEIC ليستا الكلمة نفسها تمامًا</h2>

  <p>نقطة صغيرة تسبب الخلط. HEIF هي صيغة الحاوية، وهي معيار ضمن MPEG-H. أما HEIC فهو ما تحصل عليه حين تحمل تلك الحاوية صورًا مرمَّزة بـHEVC، وهو ما تنتجه أجهزة آبل. فكل ملف HEIC هو ملف HEIF، وليس كل HEIF هو HEIC.</p>

  <p>في الاستعمال اليومي نادرًا ما يهم هذا التمييز، والأدوات التي تقبل إحداهما تقبل الأخرى عادة. ولا يصبح مهمًا إلا حين يرفض برنامج ملفك بحسب الامتداد لا بحسب المحتوى.</p>

  <h2>هل تستمر إذن في التصوير بصيغة HEIC</h2>

  <p>لمعظم الناس نعم. تحصل على ملفات أصغر بنحو 45 بالمئة بالجودة المرئية نفسها، وأجهزة آبل الحديثة تتعامل مع الصيغة أصلًا في كل مكان. وحين تحتاج المشاركة مع ويندوز أو جهاز أندرويد قديم أو مطبعة أو نموذج رفع على موقع، حوّل نسخة.</p>

  <p>وما لا يستحق العناء هو تحويل الكاميرا إلى JPEG نهائيًا لأن موقعًا رفض رفع ملف مرة واحدة. ستدفع ثمن ذلك القرار في كل صورة تلتقطها، لحل مشكلة تُحسم بتحويل واحد.</p>

  <p>والعادة المعاكسة تستحق التخلي عنها أيضًا: الاحتفاظ بنسختي HEIC و JPEG لكل شيء. القياسات أعلاه تُظهر أن ملف JPEG يحمل الصورة نفسها جوهريًا. احتفظ بالأصل، واصنع JPEG حين يطلبه أحد.</p>

  <h2>كيف أجرينا القياس</h2>

  <p>لمن أراد إعادة التجربة. وُحِّدت سبع صور بمواضيع مختلفة على 4032 في 3024 بكسل، وهو ناتج 12 ميجابكسل للكاميرا الرئيسية في الآيفون. رُمّزت كل صورة إلى HEIC عبر مكتبة libheif بجودة 50، وهي المنطقة التي يقف عندها مرمِّز كاميرا آبل. ثم فُكّ ترميز كل ملف HEIC وحُفظ بصيغة JPEG عبر Pillow بجودة 90 مع تفعيل التحسين، وهو مسار الشيفرة نفسه الذي يشغّله محوّلنا.</p>

  <p>وحُسب PSNR و SSIM بين ملف HEIC بعد فك ترميزه وملف JPEG الناتج، فتصف الأرقام خطوة التحويل وحدها دون أن تشمل ترميز HEIC. وهذا هو الرقم الذي يهم من يحوّل صوره فعلًا.</p>

  <h2>أسئلة شائعة</h2>

  <h3>هل حجم HEIC نصف حجم JPEG حقًا؟</h3>
  <p>قريب من ذلك. في قياساتنا جاء JPEG أكبر بمعدل 1.79 مرة، أي أن HEIC نحو 56 بالمئة من حجم JPEG. وتراوح المدى بين الصور من 1.61 إلى 2.36 مرة بحسب كمية الملمس الدقيق في الصورة.</p>

  <h3>هل يفقد تحويل HEIC إلى JPG جودة؟</h3>
  <p>تقنيًا نعم، وبصريًا لا. قسنا PSNR بين 42 و52 ديسيبل و SSIM فوق 0.995، وهو أبعد بكثير من النقطة التي يمكن عندها رؤية الفرق. الكلفة الحقيقية للتحويل هي حجم الملف لا جودة الصورة.</p>

  <h3>بأي جودة JPEG أحوّل؟</h3>
  <p>استعمل 90 لكل ما سيُطبع أو يُعدَّل مجددًا أو يُؤرشف. واستعمل 80 حين ترسل أو ترفع دفعة وتريد ملفات أخف، فهذا الإعداد يقتطع نحو ربع الحجم ويبقى صعب التمييز.</p>

  <h3>لماذا تبدو صورتي مشوشة بعد التحويل؟</h3>
  <p>في الغالب لأن شيئًا ما صغّرها، أو لأن تطبيق مراسلة أعاد ضغطها عند الإرسال. قارن أبعاد الناتج بالبكسل مع الأصل. فإن تطابقا فليس التحويل هو السبب.</p>

  <h3>ما الفرق بين HEIF و HEIC؟</h3>
  <p>HEIF هي الحاوية، و HEIC هي الحاوية نفسها وبداخلها صور مرمَّزة بـHEVC، وهو ما تكتبه أجهزة آبل. فكل HEIC هو HEIF، ومعظم الأدوات تعاملهما على أنهما سواء.</p>

  <h3>هل أحوّل إلى PNG لتفادي الفقد؟</h3>
  <p>فقط إن كنت تحتاج فعلًا ناتجًا بلا فقد، لأن ملف PNG لصورة فوتوغرافية ضخم، وكثيرًا ما يبلغ أضعاف حجم JPEG. للصور الفوتوغرافية الخيار المعقول هو JPEG بجودة عالية، وتبقى PNG للرسوم ولقطات الشاشة والصور ذات الشفافية.</p>

  <h2>حوّل عند الحاجة لا افتراضيًا</h2>

  <p>حين يرفض موقع أو زميل أو جهاز يعمل بويندوز صورتك، مررها عبر <a href="/ar/image/heic-to-jpg/">محوّل HEIC إلى JPG</a> واترك الأصل في مكانه. وإن احتاجت الجهة مستندًا واحدًا بدل صورة، فالأداة نفسها تكتب ملف PDF، و<a href="/ar/image/optimize/">محسّن الصور</a> يقلّص الناتج أكثر حين يحتاج الملف إلى مزيد من التخفيف. أما الجانب العملي في فتح هذه الملفات على ويندوز وأندرويد فيغطيه <a href="/ar/blog/convert-heic-to-jpg-iphone-photos/">دليل HEIC على الأجهزة الأخرى</a>.</p>
