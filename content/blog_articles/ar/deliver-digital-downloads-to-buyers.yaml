meta_keywords_ar: "تسليم التنزيلات الرقمية, ملف pdf واحد أم zip, كلمة مرور zip, انتهاء صلاحية الرابط, التنزيل على الهاتف, تسليم منتج رقمي"
excerpt_ar: "تكاد كل شكوى تسليم ترجع إلى ثلاثة قرارات اتخذتها دون تفكير: أن ترسل ملفاً واحداً أم أرشيفاً، وكم يزن التنزيل، وما يلقاه المشتري في العشر ثوانٍ الأولى. لا واحد منها صعب، والثلاثة رخيصة الإصلاح، والخطأ فيها يولّد رسائل إلى الأبد."
