  summary: "كيف تصمّم تسليم منتج PDF بحيث لا يولّد رسائل دعم: متى يتفوق الملف الواحد على الأرشيف ومتى لا، ولماذا الأرشيف عقبة حقيقية على الهاتف، وكيف تبقي كل ملف تحت حد المنصة لكل ملف لا تحت مجموع الحزمة، ولماذا تكلّف كلمة المرور على تنزيل مدفوع أكثر مما تحمي، وكيف تسمّي الأشياء لتبقى مفهومة بعد فك الأرشيف، وكيف تجيب على طلب إعادة التسليم الذي يأتي دائماً."
