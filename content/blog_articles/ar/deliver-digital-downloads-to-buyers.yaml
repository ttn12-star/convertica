content_ar: |
  يمكنك أن تصيب في كل شيء يتعلق بالملف وتخسر المشتري في العشر ثوانٍ الأخيرة. فالتسليم هو الجزء من المنتج الرقمي الذي يصممه البائعون بالمصادفة: كانت الملفات أربعة فضغطتها في أرشيف، والآن حصة من مشتريك لا تستطيع فتح شرائها على الجهاز الذي دفعت به.

  ثلاثة قرارات تغطي هذا كله تقريباً.

  <h2>القرار 1: ملف واحد أم أرشيف</h2>

  <p>الغريزة تقول احزم كل شيء. قاوِمها حين تستطيع، لأن الأرشيف عقبة حقيقية لحصة معتبرة من المشترين.</p>

  <table>
    <thead>
      <tr><th>أرسل ملف PDF واحداً عندما</th><th>أرسل أرشيفاً عندما</th></tr>
    </thead>
    <tbody>
      <tr><td>يكون المنتج شيئاً واحداً بمقاس واحد</td><td>يكون لديك عدة مقاسات ورق أو تنويعات لونية</td></tr>
      <tr><td>تبقى داخل حد الحجم لكل ملف</td><td>تتجاوز وإلا عدد الملفات المسموح في المنصة</td></tr>
      <tr><td>يكون معظم زوارك من الهاتف</td><td>يكون المنتج فعلاً مجموعة سيفرزها المشتري</td></tr>
    </tbody>
  </table>

  <p>إذا كان لديك ملفان أو ثلاثة والمنصة تسمح بملفين أو ثلاثة، فارفعها منفصلة. يلمس المشتري الذي يريده وينتهي الأمر. وهذا أفضل قطعاً من إلزام الجميع بفك أرشيف للوصول إلى الملف نفسه.</p>

  <h2>القرار 2: ما يفعله الهاتف</h2>

  <p>حصة كبيرة من المشترين تفتح الشراء على الهاتف، غالباً في الدقيقة التالية للدفع، وغالباً وهي واقفة في مكان ما. وما يعيشه ذلك الشخص مع أرشيف:</p>

  <ul>
    <li><strong>إصدارات Android وiOS القديمة تحتاج خطوة إضافية</strong> للانتقال من أرشيف منزَّل إلى ملف PDF مقروء. الإصدارات الحديثة تتعامل معه، لكن كلمة «الحديثة» تحمل كثيراً في تلك الجملة، ولا يملك كل مشتريك هاتفاً جديداً.</li>
    <li><strong>الملفات المفكوكة تهبط غالباً في مجلد واحد مسطّح</strong>، فتختفي بنية مجلداتك. وإذا كان ملفان يتميزان بمجلدهما فقط، فهما الآن لا يتميزان.</li>
    <li><strong>تنزيل بحجم 40 ميجابايت على بيانات الهاتف</strong> توقّف، والتوقّف هو المكان الذي يغلق فيه الناس التبويب وهم ينوون العودة.</li>
  </ul>

  <p>لا يعني هذا ألّا تستخدم أرشيفاً أبداً. يعني: إن استخدمته، فسمِّ الملفات لتبقى مفهومة بعد الفك، وأبقِ التنزيل صغيراً بما يكفي لينتهي في رحلة قطار.</p>

  <h2>القرار 3: الحجم، لكل ملف</h2>

  <p>حدود المنصات تُحسب لكل ملف لا للحزمة، وهذا الفارق هو الذي يقرر تحزيمك. فالمنصات تحدّ عادة كل ملف رقمي بنحو 20 ميجابايت وعدد الملفات لكل إعلان بخمسة، ولذلك فإن حزمة من أربعة مقاسات في ثلاث تنويعات لونية يجب أن تصبح أرشيفاً شئت أم أبيت. راجع الأرقام السارية في منصتك قبل أن تبني حزمة حولها.</p>

  <p>وإذا تجاوزت الحد فابحث عن السبب قبل أن تمتد يدك إلى الضغط. فملف PDF من نص فقط وزنه لا يُذكر؛ ومخطط بحجم 30 ميجابايت وزنه كذلك بسبب خلفية بمقاس الصفحة أو ملمس ورقي. واستبدال ذلك الملمس بلون مسطح يقلّص الملف أضعافاً عادة ولا يكلّف شيئاً مرئياً على طابعة منزلية. وبعد ذلك فقط استخدم <a href="/ar/pdf-organize/compress/">ضاغط PDF</a>، الذي يبقي النص والرسوم المتجهة بجودة كاملة ويعيد ضغط الصور، واطبع صفحة قبل أن تثق بالنتيجة.</p>

  <h2>هل تحمي الأرشيف بكلمة مرور؟</h2>

  <p>يمكنك <a href="/ar/archive/protect/">حماية ملف ZIP بكلمة مرور</a>، ولتنزيل مدفوع لا ينبغي عادة. فالحساب قاسٍ: كل مشتر يحتاج الآن كلمة المرور، أي أنها تسكن في وصف الإعلان أو في بريد التسليم، أي أنها لا تحمي شيئاً، وفي الوقت نفسه ستفشل حصة من المشترين في إدخالها صحيحة فتراسلك.</p>

  <p>والحالات التي يكون فيها معنى ضيقة: ملف يذهب إلى عميل واحد بعينه، أو نسخة ما قبل الإصدار لمراجع، أو حزمة ترسلها خارج المنصة إلى شخص محدد. ومقالنا عن <a href="/ar/blog/how-to-password-protect-a-zip-file/">حماية أرشيف ZIP بكلمة مرور</a> يشرح الآلية، والسؤال الأوسع عمّا تحققه الحماية فعلاً في <a href="/ar/blog/stop-buyers-editing-reselling-your-pdf/">ما يمنع المشتري من تعديل ملفك أو إعادة بيعه</a>. باختصار: في المنتجات تعمل صفحة الترخيص لا كلمة المرور.</p>

  <h2>ما يجب أن يراه المشتري أولاً</h2>

  <p>افترض أن المشتري سيفكّ كل شيء في مجلد التنزيلات ولن يقرأ شيئاً. صمّم لذلك الشخص:</p>

  <ul>
    <li><strong>أسماء ملفات تذكر المنتج والصيغة</strong> ولا شيء غير ذلك. <code>weekly-planner-A4.pdf</code>، لا <code>final_v3.pdf</code>.</li>
    <li><strong>صفحة تعليمات قصيرة واحدة</strong>، وواحدة فقط. فإذا أرفقت ملفاً نصياً باسم <code>READ ME FIRST.txt</code> إلى جانب أربعة ملفات PDF فمعظم الناس لن يقرأه، فكرّر السطر المهم داخل ملف PDF نفسه.</li>
    <li><strong>تعليمة الطباعة، تُقال مرة وبوضوح.</strong> اطبع بنسبة 100 بالمئة، بالمقاس الفعلي، مع تعطيل التحجيم. هذا السطر الواحد يمنع شكاوى أكثر من أي شيء آخر في هذا المقال.</li>
  </ul>

  <h2>طلب إعادة التسليم</h2>

  <p>يأتي دائماً: مشتر فقد الملف، أو غيّر هاتفه، أو صادف رابطاً منتهياً. حدّد جوابك قبل أن يحدث، لا أن تبتكره في الحادية عشرة ليلاً.</p>

  <ul>
    <li><strong>اعرف سياسة الروابط في منصتك.</strong> بعضها ينتهي، وبعضها له عدّاد تنزيلات، وبعضها يبقى ما بقي الحساب. ولا يمكنك الإجابة على المشتري دون معرفة أيها.</li>
    <li><strong>احفظ الملف المُسلَّم بدقة، لكل إصدار.</strong> فإن كنت قد أرسلت إصدارين فعليك معرفة أيهما اشترى ذلك المشتري. وهنا تُسدَّد علامة الإصدار من فحصك قبل الإطلاق.</li>
    <li><strong>قل نعم وامضِ.</strong> إعادة إرسال ملف لا تكلّفك شيئاً وتشتري رضا شخص دفع بالفعل. أما الجدال فيكلّف تقييماً.</li>
  </ul>

  <h2>قائمة تحقق التسليم</h2>

  <table>
    <thead>
      <tr><th>الفحص</th><th>لماذا</th></tr>
    </thead>
    <tbody>
      <tr><td>ملفات منفصلة إن سمح عددها في المنصة</td><td>يزيل خطوة الأرشيف كلياً</td></tr>
      <tr><td>كل ملف تحت الحد لكل ملف</td><td>الحد لكل ملف لا للحزمة</td></tr>
      <tr><td>أسماء الملفات مفهومة بعد الفك</td><td>بنية المجلدات تختفي</td></tr>
      <tr><td>التنزيل يُفتح على الهاتف بلمستين</td><td>هناك تحدث معظم مرات الفتح الأولى</td></tr>
      <tr><td>صفحة تعليمات واحدة، ومقياس الطباعة مذكور</td><td>يمنع أكثر الشكاوى شيوعاً</td></tr>
      <tr><td>بلا كلمة مرور إلا مع مستلم محدد</td><td>لا تحمي شيئاً وتولّد رسائل</td></tr>
      <tr><td>تعرف سياسة انتهاء الروابط</td><td>سيُسألك عنها</td></tr>
      <tr><td>تحفظ الملف المُسلَّم لكل إصدار</td><td>إعادة التسليم تحتاج النسخة الصحيحة</td></tr>
    </tbody>
  </table>

  <p>وإذا لم تكن قد أجريت المرور على الملف والإعلان بعد، فهو يأتي قبل هذا: <a href="/ar/blog/digital-product-pdf-checklist-before-you-publish/">قائمتنا قبل الإطلاق</a> هي البوابة، و<a href="/ar/blog/sell-printable-pdf-on-etsy/">تجهيز ملف PDF قابل للطباعة للبيع</a> يغطي الملف نفسه.</p>

  <h2>ماذا يحدث للملف الذي ترفعه</h2>

  <p>أدواتنا تعمل على الخادم، فالملف يُرفع. ويُحذف بمجرد انتهاء المهمة، ورابط التنزيل لك وحدك. لا شيء يُفهرس أو يُحفظ أو يُعاد استخدامه للتدريب. ومقالنا عن <a href="/ar/blog/is-convertica-safe-pdf-file-security-privacy-explained/">كيف تتعامل Convertica مع ملفاتك</a> يبيّن قواعد الاحتفاظ.</p>

  <h2>أسئلة متكررة</h2>

  <h3>هل الأرشيف عقبة إلى هذا الحد فعلاً؟</h3>
  <p>على الحاسوب لا. أما على الهاتف فهو خطوة إضافية لن يكملها بعض المشترين، والهاتف هو حيث تحدث كثير من مرات الفتح الأولى. والمقصد ليس أن الأرشيفات سيئة، بل أنها يجب أن تكون قراراً لا وضعاً افتراضياً. فإن اتّسع نظام المنصة لملفين منفصلين، فسلّم ملفين منفصلين.</p>

  <h3>ما حجم التنزيل الكلي المعقول؟</h3>
  <p>صغير بما يكفي لينتهي على بيانات الهاتف دون أن يتساءل المشتري هل تعطّل. ولملف قابل للطباعة يعني ذلك ميجابايتات من رقم واحد في معظم المنتجات. وإذا كنت أعلى من ذلك بكثير فالسبب صورة في الغالب، وإيجادها أفضل من الضغط حولها.</p>

  <h3>هل أضمّن ملف تعليمات نصياً؟</h3>
  <p>واحداً قصيراً، وكرّر السطر الحرج داخل ملف PDF نفسه، لأن ملفاً نصياً إلى جانب أربعة ملفات PDF يبقى غير مقروء في الغالب. والسطر الحرج هو مقياس الطباعة.</p>

  <h3>هل أستطيع منع مشاركة رابط التنزيل؟</h3>
  <p>لا بشكل ذي معنى، ونادراً ما تأتي الخسارة من هناك. فروابط المنصات مرتبطة عادة بالطلب، ومن قرّر المشاركة سيشارك الملف لا الرابط. اصرف الجهد على صفحة الترخيص.</p>

  <h3>مشتر يقول إن الملف لا يُفتح. بماذا أسأل أولاً؟</h3>
  <p>أي جهاز، وهل فكّ الأرشيف. هذان السؤالان يحلّان الغالبية العظمى من تقارير «لا يُفتح»، لأن الجوابين المعتادين هاتف قديم وأرشيف لم يُفك. والسؤال التالي عن القارئ، فمعاينة المتصفح تفشل أحياناً على ملف يُفتح جيداً في تطبيق PDF.</p>

  <h3>هل أسلّم A4 وUS Letter منفصلين؟</h3>
  <p>إن سمح عدد الملفات في المنصة فنعم، وسمِّهما في اسم الملف. فهذا أوضح جواب ممكن على سؤال المقاس، ويعفي المشتري من فتح الملف الخطأ. والسبب في تقديم الاثنين موجود في <a href="/ar/blog/a4-vs-us-letter-printable-sizes/">A4 أم US Letter</a>.</p>

  <h2>أصلح تسليمك</h2>

  <p>افتح آخر طلب لك بنفسك كما يفعل المشتري، على الهاتف، وعُدّ اللمسات حتى تصل إلى صفحة مقروءة. فإن كانت أكثر من لمستين، فالعلاج عادة تفكيك الأرشيف إلى ملفات منفصلة أو إعادة تسميتها لتصبح مفهومة وحدها. وإذا احتجت الأرشيف فعلاً ولزم إغلاقه لمستلم محدد، فحينها <a href="/ar/archive/protect/">احمِ ملف ZIP</a>، وحينها فقط. وما تبقى موجود في <a href="/ar/all-tools/">كل الأدوات</a>.</p>
