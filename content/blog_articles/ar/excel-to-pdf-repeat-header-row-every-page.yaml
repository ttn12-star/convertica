  target_audience: "موظفو المكاتب والمحاسبون والمعلمون وكل من يرسل جداول Excel طويلة بصيغة PDF ثم يتلقى شكوى من أن الصفحة السابعة بلا أسماء أعمدة."
content_ar: |
  ترسل ملف PDF من 30 صفحة فيه قائمة أسعار أو سجل حضور، وبعد دقائق يصلك الرد: «أي عمود هو أي عمود في الصفحة 5؟». الصفحة الأولى فيها صف العناوين، وكل ما بعدها جدار من الأرقام بلا تسميات.

  يستطيع Excel أن يكرر صف العناوين في كل صفحة مطبوعة، وملف PDF في نظر Excel ليس إلا صفحة مطبوعة. اسم هذا الإعداد «طباعة العناوين» (Print Titles). يأخذ نحو ثلاثين ثانية، ويُحفظ داخل الملف نفسه، وما إن يُضبط حتى يحترمه أي محوّل PDF جيد.

  <h2>أولا: الحلان اللذان لا ينفعان</h2>

  <p><strong>تجميد الأجزاء (Freeze Panes).</strong> هذا ما يجربه الجميع تقريبا أولا، لأنه على الشاشة يفعل المطلوب بالضبط: يبقى الصف العلوي ثابتا وأنت تمرر. لكن تجميد الأجزاء إعداد عرض، يتحكم في نافذتك لا في الورق، ولذلك يتجاهله ملف PDF تماما. يمكنك تجميد الصف 1 وتبقى العناوين في الصفحة الأولى وحدها.</p>

  <p><strong>تنسيق النطاق كجدول.</strong> جدول Excel (إدراج، جدول) يعرض أسماء أعمدته مكان الحروف A وB وC أثناء التمرير. والقصة نفسها: هذه حيلة شاشة، والنسخة المطبوعة لا تكررها.</p>

  <p>ومصدر آخر للالتباس: <em>رأس الصفحة</em> (إدراج، الرأس والتذييل) شيء مختلف. هو سطر نص في الهامش العلوي، مثل عنوان تقرير أو رقم صفحة. يتكرر في كل صفحة، لكنه لا يستطيع حمل أسماء أعمدتك مصفوفة فوق الأعمدة. ما تريده هو <em>صف</em> من الورقة نفسها يتكرر.</p>

  <h2>ضبط طباعة العناوين في Excel على Windows</h2>

  <ol>
    <li>افتح الورقة وانتقل إلى علامة التبويب <strong>تخطيط الصفحة</strong>.</li>
    <li>انقر <strong>طباعة العناوين</strong>. تُفتح نافذة «إعداد الصفحة» على تبويب «ورقة».</li>
    <li>انقر داخل حقل <strong>صفوف للتكرار في الأعلى</strong> (Rows to repeat at top)، ثم انقر رقم صف العناوين في الورقة. يملأ Excel الحقل بـ <code>$1:$1</code>. وإذا كان رأس جدولك صفين (صف عنوان وصف أسماء أعمدة مثلا)، اسحب عبر الاثنين فتحصل على <code>$1:$2</code>.</li>
    <li>إذا كان الجدول عريضا أيضا ويمتد إلى صفحات إضافية جانبية، افعل الشيء نفسه في حقل <strong>أعمدة للتكرار</strong> (Columns to repeat at left) للعمود الذي يسمّي كل صف، كرقم تعريفي أو اسم منتج.</li>
    <li>انقر «موافق». وللتأكد افتح ملف، طباعة: يجب أن تبدأ الصفحة الثانية في المعاينة بصف العناوين.</li>
  </ol>

  <p>الإعداد محفوظ في المصنف، فاحفظ الملف بعد ضبطه. هذا هو الجزء المهم حين تحوّله إلى PDF لاحقا.</p>

  <h2>Excel على Mac</h2>

  <p>الفكرة نفسها بمسار مختلف قليلا: تبويب <strong>تخطيط الصفحة</strong>، ثم <strong>طباعة العناوين</strong>، ثم حقل «صفوف للتكرار في الأعلى» نفسه. في إصدارات Mac الأقدم تجده تحت ملف، إعداد الصفحة، ورقة. والنتيجة داخل الملف واحدة.</p>

  <h2>جداول بيانات Google</h2>

  <p>تربط جداول Google هذه الميزة بالتجميد، فهي المكان الوحيد الذي يفيد فيه التجميد فعلا. جمّد صف العناوين (عرض، تجميد، صف واحد)، ثم افتح ملف، طباعة. تحت <strong>الرؤوس والتذييلات</strong> فعّل خيار <strong>تكرار الصفوف المجمدة</strong>. ثم نزّل الملف بصيغة PDF من شاشة الطباعة نفسها.</p>

  <p>أما إذا نزّلت الجدول بصيغة .xlsx لتحوّله في مكان آخر، فاضبط طباعة العناوين في Excel أو Calc أولا. الصفوف المجمدة لا تتحول إلى عناوين طباعة عند التصدير.</p>

  <h2>LibreOffice Calc</h2>

  <p>اذهب إلى <strong>تنسيق، نطاقات الطباعة، تحرير</strong>. في خانة <strong>الصفوف المراد تكرارها</strong> اختر «معرّف من قبل المستخدم» واكتب <code>$1</code> (أو <code>$1:$2</code> لصفين). يحفظ Calc هذا الإعداد داخل ملفات .xlsx كعناوين طباعة Excel نظامية، فيسافر الإعداد مع الملف.</p>

  <h2>المصنفات التي تضم عدة أوراق</h2>

  <p>طباعة العناوين تخص الورقة لا المصنف. إذا كان في ملفك تبويب لكل شهر، فكل تبويب يحتاج إلى إعداده الخاص، ويمكن لكل منها أن يكرر صفا مختلفا. لهذا يرى بعض الناس العناوين في كل صفحات يناير، وفي الصفحة الأولى فقط من فبراير.</p>

  <p>أسرع طريق عبر اثني عشر تبويبا: اضبطه مرة على الورقة الأولى، ثم كرر الخطوات على البقية. لا يوجد في Excel زر «تطبيق على كل الأوراق» لطباعة العناوين، حتى عند تجميع الأوراق، فاحسب دقيقة أو نحوها للمصنف الكبير.</p>

  <h2>تحويل الملف إلى PDF</h2>

  <p>بعد حفظ طباعة العناوين في الملف، حوّله بالطريقة التي تفضلها. جرّبنا ذلك على <a href="/ar/excel-to-pdf/">محوّل Excel إلى PDF</a> بجدول من 120 صفا يمتد على ثلاث صفحات: مع ضبط طباعة العناوين بدأت الصفحات الثلاث كلها بصف العناوين، ومن دونه بدأت به الأولى فقط. والمحوّل يُبقي الجداول العريضة بعرض صفحة واحدة افتراضيا، فالعنوان الذي يتكرر يبقى أيضا عنوانا يمكن قراءته.</p>

  <p>وإذا كنت تفضل طريق Excel نفسه، فخيار ملف، حفظ باسم، PDF يعمل أيضا. فقط افحص زر «خيارات» هناك: افتراضيا يحفظ Excel الورقة النشطة وحدها، فالمصنف متعدد الأوراق يحتاج إلى اختيار «المصنف بأكمله».</p>

  <h2>إذا ظل صف العناوين لا يتكرر</h2>

  <ul>
    <li><strong>الإعداد مضبوط على ورقة أخرى.</strong> انقر التبويب الذي تحوّله فعلا وافتح طباعة العناوين من جديد. الحقل الفارغ يعني أن لا شيء مضبوط هناك.</li>
    <li><strong>الملف محفوظ بصيغة .csv.</strong> صيغة CSV تحتفظ بالقيم فقط: لا عناوين طباعة، ولا عرض أعمدة، ولا شيء آخر. احفظه بصيغة .xlsx.</li>
    <li><strong>حوّلت ملف .xls قديما.</strong> عناوين الطباعة تعمل فيه أيضا، لكن إن تصرفت أداة ما بغرابة، افتحه واحفظه بصيغة .xlsx أولا. لن يكلفك ذلك شيئا.</li>
  </ul>

  <h2>أسئلة شائعة</h2>

  <h3>هل يمكنني تكرار صف العناوين في ملف PDF جاهز؟</h3>
  <p>ليس فعلا. ملف PDF يخزن الصفحات كما رُسمت، ولا يوجد داخله مفهوم «كرر هذا الصف». ارجع إلى جدول البيانات، واضبط طباعة العناوين، وحوّل من جديد. وإذا لم يكن لديك سوى ملف PDF، فحوّله <a href="/ar/pdf-to-excel/">إلى Excel مجددا</a> أولا، وأصلحه هناك، ثم صدّره.</p>

  <h3>هل يمكن أن يكون لكل صفحة عنوان مختلف؟</h3>
  <p>داخل الورقة الواحدة لا: الصفوف المكررة هي نفسها في كل صفحة. ضع الجداول ذات العناوين المختلفة في أوراق منفصلة، وأعط كل ورقة إعداد طباعة العناوين الخاص بها.</p>

  <h3>هل يؤثر تجميد الأجزاء في ملف PDF أحيانا؟</h3>
  <p>في Excel وCalc لا. وفي جداول Google فقط حين تفعّل «تكرار الصفوف المجمدة» في إعدادات الطباعة.</p>

  <h3>كيف أُبقي العمود الأول في كل صفحة من جدول عريض؟</h3>
  <p>استخدم حقل <strong>أعمدة للتكرار</strong> في نافذة طباعة العناوين نفسها. يعمل تماما مثل نسخة الصفوف، لكن بالعرض.</p>

  <h3>هل يحتفظ ملف PDF المحوَّل بعوامل التصفية والصفوف المخفية؟</h3>
  <p>الصفوف المخفية تبقى مخفية، وهذا عادة ما تريده. أما أزرار التصفية فلا وجود لها في PDF: تحصل على الصفوف التي كانت ظاهرة لحظة حفظ الملف.</p>

  <h2>جرّبها بنفسك</h2>

  <p>اضبط طباعة العناوين، واحفظ، ثم أسقط الملف في <a href="/ar/excel-to-pdf/">محوّل Excel إلى PDF</a>. وإذا كان الجدول يخرج أيضا عن حافة الصفحة أو تلحقه صفحات فارغة، فدليلنا عن <a href="/ar/blog/excel-to-pdf-cut-off-blank-pages-fix/">الأعمدة المقطوعة عند تحويل Excel إلى PDF</a> يغطي الباقي، وفي مقال <a href="/ar/blog/convert-excel-to-pdf-keep-formatting/">تحويل Excel إلى PDF بنفس التنسيق</a> قائمة المراجعة الكاملة.</p>
