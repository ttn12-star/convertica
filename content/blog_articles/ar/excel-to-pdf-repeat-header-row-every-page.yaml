  summary: "يشرح لماذا يظهر صف عناوين الأعمدة في الصفحة الأولى فقط عند تصدير جدول طويل من Excel إلى PDF، ولماذا لا يحل تجميد الأجزاء ولا تنسيق النطاق كجدول هذه المشكلة، وكيف تُضبط طباعة العناوين (صفوف للتكرار في الأعلى وأعمدة للتكرار على الجانب) في Excel على Windows وMac وفي جداول بيانات Google وLibreOffice Calc. ويتناول ضبط الإعداد لكل ورقة على حدة في المصنفات متعددة الأوراق، والفرق بين صف العناوين ورأس الصفحة، ويؤكد أن الإعداد يبقى بعد التحويل بمحوّل Excel إلى PDF عبر الإنترنت."
