title_ar: "كيف تكرر صف العناوين في كل صفحة عند تحويل Excel إلى PDF"
meta_title_ar: "تكرار صف العناوين في كل صفحة PDF من Excel | Convertica"
meta_description_ar: "أسماء الأعمدة تظهر في الصفحة الأولى فقط من ملف PDF؟ تجميد الأجزاء ليس الحل. اضبط «طباعة العناوين» مرة واحدة فيتكرر صف العناوين في كل صفحة مع أي محوّل."
meta_keywords_ar: "تكرار صف العناوين في كل صفحة pdf, تحويل الاكسل الى pdf, تحويل excel إلى pdf بنفس التنسيق, طباعة العناوين excel, صفوف للتكرار في الأعلى, تثبيت العناوين في كل صفحة اكسل, تجميد الأجزاء pdf, تكرار رؤوس الأعمدة عند الطباعة"
excerpt_ar: "الصفحة الأولى من ملف PDF فيها أسماء الأعمدة، والصفحات من 2 إلى 40 أرقام بلا هوية. الإصلاح يستغرق ثلاثين ثانية، وهو ليس الحل الذي يجربه معظم الناس أولا."
