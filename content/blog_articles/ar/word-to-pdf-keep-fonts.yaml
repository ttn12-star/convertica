meta_description_ar: "الخط العربي يتغير عند تحويل Word إلى PDF؟ إليك لماذا يستبدل المحوّل الخطوط، وأيها يُستبدل بتوائم مطابقة، والإعداد في Word الذي يحافظ على خطك الأصلي."
meta_keywords_ar: "كيفية تحويل word إلى pdf مع الحفاظ على الخطوط, تحويل الوورد الى pdf بنفس الخط, الخط العربي يتغير عند تحويل word الى pdf, تضمين الخطوط في word, تحويل word إلى pdf بالخط العربي, traditional arabic pdf, الحفاظ على الخطوط في pdf"
excerpt_ar: "تحوّل خط العناوين إلى خط عادي باهت، أو خرج النص العربي بشكل مختلف عن الأصل. إليك ما يراه المحوّل وما لا يراه، والإعداد الوحيد في Word الذي يحل المشكلة."
