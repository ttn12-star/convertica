content_ar: |
  إن كنت تبحث عن طريقة لتحويل Word إلى PDF مع الحفاظ على الخطوط، فابدأ بهذه الحقيقة: Word على جهازك يرسم النص بالخطوط المثبتة على جهازك. أما المحوّل عبر الإنترنت فيعمل على خادم، ولا يستطيع الرسم إلا بالخطوط الموجودة على ذلك الخادم، إضافة إلى أي خط يسافر داخل المستند نفسه. وحين لا يكون خطك في أي من المكانين، يختار المحوّل بديلا. كل ما في هذا الدليل يتفرع من هذه الحقيقة وحدها.

  فحصنا كيف يتعامل <a href="/ar/word-to-pdf/">محوّل Word إلى PDF</a> مع خطوط Office الشائعة والخطوط المخصصة والمستندات العربية. وهذا ما يحدث، وما يمكنك فعله حياله.

  <h2>المستندات العربية: لماذا يتغير الخط العربي عند التحويل</h2>

  <p>في العربية تظهر مشكلات الخطوط أوضح من أي لغة أخرى، ولذلك اختبرناها على حدة بمستند يستخدم عشرة خطوط شائعة.</p>

  <ul>
    <li><strong>النص نفسه في أمان.</strong> الحروف تتصل اتصالا صحيحا، والأسطر تجري من اليمين إلى اليسار، والأرقام الهندية (٢٠٢٦) تبقى كما هي بجوار الأرقام الغربية (1500).</li>
    <li><strong>خطوط Windows العربية غير موجودة على الخادم.</strong> Traditional Arabic وSimplified Arabic وSakkal Majalla وArabic Typesetting تُستبدل بخط <strong>Noto Naskh Arabic</strong>، وهو تصميم نسخي قريب من مظهر تلك الخطوط. أما النص العربي المكتوب بخط Arial أو Tahoma أو Calibri فيستخدم <strong>Noto Sans Arabic</strong>، الذي يوافق طابعها الأبسط.</li>
    <li><strong>قد تنكسر الأسطر في مواضع مختلفة قليلا،</strong> لأن حروف الخط البديل ليست بالعرض نفسه تماما. فالنموذج المضبوط بإحكام على صفحة واحدة قد يفيض إلى صفحة ثانية.</li>
    <li><strong>للحصول على المظهر الأصلي بالضبط،</strong> ضمّن الخطوط كما هو موضح أدناه، ولا تنس إلغاء تحديد «عدم تضمين خطوط النظام الشائعة»، لأن الخطوط العربية من خطوط نظام Windows.</li>
  </ul>

  <h2>خطوط تُستبدل بتوائم مطابقة</h2>

  <p>أشهر خطوط Office غير موجودة على خادم Linux، لكن لها توائم مجانية رُسمت بعروض الحروف نفسها. النص المكتوب بها يلتف في المواضع نفسها تماما، فتبقى فواصل الصفحات وأطوال الأسطر في مكانها:</p>

  <ul>
    <li><strong>Arial</strong> → Liberation Sans</li>
    <li><strong>Times New Roman</strong> → Liberation Serif</li>
    <li><strong>Courier New</strong> → Liberation Mono</li>
    <li><strong>Calibri</strong> → Carlito</li>
    <li><strong>Cambria</strong> → Caladea</li>
  </ul>

  <p>أشكال الحروف تختلف قليلا إن دققت النظر، لكن المستند ذا الاثنتي عشرة صفحة يبقى اثنتي عشرة صفحة. وهناك خطان أحدث من Microsoft ليس لهما توأم مطابق: <strong>Aptos</strong> (الخط الافتراضي الجديد في Office) يُستبدل بخط Carlito، و<strong>Segoe UI</strong> بخط Liberation Sans، وهما أقرب العروض المتاحة، لذلك قد تتزحزح الأسطر قليلا.</p>

  <h2>خطوط تُستبدل بشيء مختلف</h2>

  <p>أي خط آخر، سواء كان خط علامة تجارية، أو خطا مزخرفا لبطاقة دعوة، أو خطا نزّلته لسيرتك الذاتية، لا يعرفه الخادم. فيلجأ المحوّل إلى نمط مشابه (خط بلا زوائد مكان مثيله، وخط بزوائد مكان مثيله)، وتبدو النتيجة عادة أبسط ويختلف طول النص.</p>

  <p>وهذا ليس أمرا يستطيع المحوّل تخمينه. ملف الخط يجب أن يرافق المستند.</p>

  <h2>الحل: تضمين الخطوط في ملف Word</h2>

  <p>يستطيع Word أن يحفظ الخطوط التي يستخدمها المستند داخل ملف .docx نفسه. وقد اختبرنا ذلك: مستند يحتوي خطا مضمّنا لا يملكه الخادم خرج من المحوّل بذلك الخط بالضبط. ومن دون التضمين خرج المستند نفسه بخط بديل.</p>

  <ol>
    <li>في Word، اذهب إلى <strong>ملف</strong>، ثم <strong>خيارات</strong>، ثم <strong>حفظ</strong>.</li>
    <li>تحت «الحفاظ على الدقة عند مشاركة هذا المستند»، حدد <strong>تضمين الخطوط في الملف</strong> (Embed fonts in the file).</li>
    <li>حدد <strong>تضمين الأحرف المستخدمة في المستند فقط</strong> ليبقى الملف صغيرا. ولملف PDF هذا كل ما تحتاجه.</li>
    <li>ألغِ تحديد <strong>عدم تضمين خطوط النظام الشائعة</strong> (Do not embed common system fonts) إن كان خطك قد جاء مع Windows (Traditional Arabic وSakkal Majalla وSegoe UI وما شابهها). وإلا افترض Word أن الجميع يملكونها فتركها خارج الملف.</li>
    <li>احفظ المستند، ثم حوّله.</li>
  </ol>

  <p>وعلى Mac يوجد الخيار نفسه في Word for Mac تحت <strong>Word</strong>، ثم <strong>تفضيلات</strong>، ثم <strong>حفظ</strong>. بعض الخطوط التجارية تمنع رخصتها التضمين؛ يتخطاها Word بصمت، وستظل تُستبدل.</p>

  <h2>الطريق الآخر: تصدير PDF من Word نفسه</h2>

  <p>إن كان Word متاحا على الجهاز الذي ثُبتت عليه الخطوط، فخيار <strong>ملف</strong>، <strong>حفظ باسم</strong>، <strong>PDF</strong> يستخدم تلك الخطوط مباشرة. وهو الخيار الأكثر أمانة للأصل متى أمكنك استخدامه. أما المحوّل عبر الإنترنت فهو الحل حين تكون على هاتف، أو حاسوب مشترك، أو جهاز بلا Word.</p>

  <h2>كيف تعرف الخطوط التي انتهت في ملف PDF</h2>

  <p>افتح ملف PDF في Adobe Acrobat Reader، ثم <strong>ملف</strong>، <strong>خصائص</strong>، تبويب <strong>الخطوط</strong>. ستجد قائمة بكل خط في الملف. إن رأيت Liberation Sans حيث استخدمت Arial، فهذا هو التوأم المتوقع. وإن رأيت خطا بديلا حيث كنت تنتظر خط علامتك التجارية، فضمّنه وحوّل من جديد.</p>

  <h2>أسئلة شائعة</h2>

  <h3>لماذا صار عدد صفحات ملف PDF أكبر من مستند Word؟</h3>
  <p>الخط البديل ذو الحروف الأعرض يجعل الأسطر تلتف أبكر، فيطول النص. ومع خطوط Office المذكورة أعلاه لا يحدث هذا. أما مع الخطوط المخصصة فقد يحدث، وهذا سبب إضافي لتضمينها.</p>

  <h3>هل يكبر ملف Word كثيرا عند تضمين الخطوط؟</h3>
  <p>مع خيار «تضمين الأحرف المستخدمة فقط» يضيف عادة من عشرات إلى بضع مئات من الكيلوبايتات لكل خط. أما الخط الكامل بكل حروفه، خصوصا الخطوط الصينية واليابانية والكورية أو العربية، فقد يضيف عدة ميغابايتات.</p>

  <h3>هل يمكن البحث في النص العربي ونسخه من ملف PDF؟</h3>
  <p>نعم. المحوّل يكتب نصا حقيقيا لا صورا للنص، فيمكنك البحث فيه ونسخه.</p>

  <h3>هل ينجو النص الهندي أو الروسي أو الصيني؟</h3>
  <p>الحروف السيريلية واليونانية تغطيها توائم خطوط Office. أما الديفاناغارية وأنظمة الكتابة الأخرى فتُرسم بخطوط Noto. وكما في العربية، ضمّن الخط الأصلي إن كان التصميم الدقيق مهما.</p>

  <h2>حوّل مستندك</h2>

  <p>ضمّن خطوطك إن كانت غير مألوفة، واحفظ، ثم أسقط الملف في <a href="/ar/word-to-pdf/">محوّل Word إلى PDF</a>. وللصورة الأشمل عن التخطيط والجداول والصور، اقرأ <a href="/ar/blog/word-to-pdf-converter-online-free-2025/">كيف تحصل على PDF نظيف من Word في كل مرة</a>.</p>
