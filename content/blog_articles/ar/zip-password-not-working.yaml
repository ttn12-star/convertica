content_ar: |
  لهذه المشكلة صورتان، وسببا كل منهما متعاكسان، فأول ما ينبغي فعله هو تحديد أيهما لديك.

  في الصورة الأولى يفتح الأرشيف فورًا ولا يسأل عن شيء، مع أنك واثق أنك وضعت كلمة مرور. وفي الثانية يسأل، فتكتب كلمة مرور تعرف أنها صحيحة، فيرفضها.

  لا واحدة منهما سوء حظ. لكل واحدة تفسير بسيط.

  <h2>الصورة الأولى: الأرشيف لا يسأل عن كلمة مرور إطلاقًا</h2>

  <p>هذه أكثر شيوعًا، والجواب في الغالب واحد: الملف لم يُشفَّر قط. شيء ما ضغطه وتخطى خطوة كلمة المرور بصمت.</p>

  <p>الجاني المعتاد هو مستكشف ويندوز. النقر بالزر الأيمن ثم «إرسال إلى» ثم «مجلد مضغوط» هو الطريق الذي يسلكه معظم الناس، وهو ينتج ملف ZIP عاديًا لا توجد في مساره أي خانة للتشفير. المستكشف يستطيع <em>قراءة</em> أرشيف مشفر صنعه شخص آخر، وسيطلب منك كلمة المرور عند فتحه. لكنه لا يستطيع <em>إنشاء</em> أرشيفات مشفرة. وهذا التفاوت هو مصدر الحيرة تحديدًا: فأنت فتحت على هذا الجهاز أرشيفات محمية من قبل، فافترضت أن الميزة موجودة.</p>

  <p>هي غير موجودة ولم تكن موجودة يومًا. يدعم ويندوز صيغة ZIP منذ إكس بي دون أن يضيف إليها التشفير طوال تلك السنوات. فإن كنت استعملت القائمة المدمجة وحدها، فأرشيفك بلا كلمة مرور مهما كتبت.</p>

  <p>وهناك حيلة قديمة يتذكرها كثيرون: ضبط كلمة المرور من داخل نافذة المجلد المضغوط. كانت موجودة في ويندوز إكس بي ثم أزيلت ولم تعد.</p>

  <p>العلاج هو استعمال ما يشفّر فعلًا: برنامج مخصص، أو <a href="/ar/archive/protect/">أداة حماية ملفات ZIP</a> التي تضع كلمة مرور حقيقية وتستخدم AES-256 بدل الصيغة القديمة.</p>

  <h3>كيف تتأكد أن الأرشيف مشفر بالفعل</h3>

  <p>فحصان سريعان:</p>

  <ul>
    <li>افتحه ببرنامج يدعم التشفير، مثل 7-Zip على ويندوز. فإن عرض المحتويات واستخرجها دون سؤال، فلا كلمة مرور عليه.</li>
    <li>لا تنظر إلى حجم الملف. التشفير لا يغير الحجم تقريبًا، فهذا المؤشر لا يقول شيئًا.</li>
  </ul>

  <p>العلامة الموثوقة هي السلوك لا المظهر. الأرشيف المشفر يسأل قبل أن يستخرج.</p>

  <h2>الصورة الثانية: كلمة المرور مرفوضة</h2>

  <p>هنا يكون الأرشيف مشفرًا حقًا، والخلل في المحاولة نفسها. ثلاثة أسباب تغطي معظم الحالات.</p>

  <h3>السبب الأول: البرنامج لا يفهم نوع التشفير</h3>

  <p>في صيغة ZIP نظامان مختلفان للتشفير تحت كلمة واحدة هي «كلمة المرور».</p>

  <p><strong>ZipCrypto</strong> هو الأصلي من عام 1989. تدعمه كل البرامج، وهو ضعيف بما يكفي ليُكسر بسرعة عبر هجوم النص المعروف. أما <strong>AES-256</strong> فجاء لاحقًا، وهو قوي فعلًا، وليس مدعومًا في كل مكان.</p>

  <p>في هذه الفجوة تعيش حالات الفشل. أرشيف مشفر بـAES-256 يُفتح ببرنامج قديم، أو بمدير ملفات على الهاتف لا ينفذ سوى النظام القديم، قد يعطي خطأ «كلمة مرور غير صحيحة» مع أن كلمة المرور سليمة تمامًا. البرنامج لا يخبرك أن كلمة المرور خاطئة، بل يخبرك أنه لا يستطيع فك التشفير، والرسالة وحدها مضللة.</p>

  <p>إن واجهت ذلك، جرّب 7-Zip على ويندوز أو Keka على ماك. كلاهما يتعامل مع AES-256. فإن نجحت كلمة المرور نفسها هناك، فقد وجدت الجواب.</p>

  <h3>السبب الثاني: كلمة المرور ليست ما تظن أنك تكتبه</h3>

  <p>أقل غرابة، وأكثر تكرارًا مما يتصور الناس:</p>

  <ul>
    <li><strong>تخطيط لوحة المفاتيح.</strong> كلمة مرور وُضعت بتخطيط عربي أو روسي أو بولندي ثم أُعيدت كتابتها بتخطيط آخر تعطي حروفًا مختلفة من المفاتيح نفسها. اكتبها أولًا في حقل نص عادي وانظر إليها.</li>
    <li><strong>حروف خارج ASCII.</strong> الحروف ذات العلامات وكل ما يخرج عن اللاتينية الأساسية تُرمَّز بطرق مختلفة بحسب البرنامج. كلمة مرور فيها é أو ż قد تعمل في البرنامج الذي أنشأ الأرشيف وحده.</li>
    <li><strong>مسافة في النهاية.</strong> نسخ كلمة المرور من محادثة أو بريد يجرّ معه مسافة بسهولة بالغة. وهي محسوبة.</li>
    <li><strong>حروف متشابهة.</strong> حرف i الكبير وحرف L الصغير والرقم واحد تتشابه في خطوط كثيرة، وكذلك الصفر وحرف O الكبير.</li>
  </ul>

  <p>حيثما أمكن، الصق ولا تكتب، والصق أولًا في حقل ظاهر لترى ما لديك بالضبط.</p>

  <h3>السبب الثالث: الأرشيف تالف</h3>

  <p>ملف ZIP اقتطعه تنزيل منقطع أو بوابة بريد قد يفشل على هيئة خطأ كلمة مرور بدل خطأ تلف. فإن وصلك الملف بالبريد أو بتطبيق محادثة، نزّله من المصدر مرة أخرى وقارن الأحجام قبل أن تحكم على كلمة المرور.</p>

  <h2>لماذا تظهر أسماء الملفات في بعض الأرشيفات دون غيرها</h2>

  <p>هذا يربك من يتوقع أن يكون التشفير إما كل شيء أو لا شيء. في ZIP مستويان:</p>

  <ul>
    <li><strong>المحتوى مشفر والأسماء ظاهرة.</strong> هذا هو الوضع الافتراضي في كل مكان تقريبًا. يستطيع أي شخص فتح الأرشيف وقراءة قائمة الملفات بأسمائها وأحجامها، لكنه لا يستطيع استخراجها. ويتسرب بذلك أكثر مما يُظن: اسم مثل <code>رواتب-2026-نهائي.xlsx</code> يروي القصة وحده.</li>
    <li><strong>الأسماء مشفرة أيضًا.</strong> خيار متاح في بعض البرامج، يوصف عادة بتشفير أسماء الملفات أو الترويسة. وعندها لا يعرض الأرشيف شيئًا حتى تُدخل كلمة المرور.</li>
  </ul>

  <p>فإن فتحت أرشيفًا ورأيت قائمة الملفات دون أن يُسأل عن شيء، فهذا لا يثبت أن المحتوى غير محمي. جرّب استخراج ملف واحد، وعندها يظهر الطلب.</p>

  <h2>نظامًا بنظام</h2>

  <ul>
    <li><strong>ويندوز.</strong> المستكشف يقرأ الأرشيفات المشفرة ولا ينشئها أبدًا. لصنع واحد تحتاج إلى برنامج منفصل أو أداة على الإنترنت. ولفتح أرشيف AES-256 بثقة استعمل 7-Zip لا المستكشف.</li>
    <li><strong>ماك.</strong> أداة الأرشفة في فايندر تضغط أيضًا بلا تشفير. وأمر <code>zip -e</code> في الطرفية يشفّر، لكن بالنظام القديم الضعيف. أما AES فيحتاج برنامجًا خارجيًا.</li>
    <li><strong>أندرويد.</strong> الأمر متروك كليًا لمدير الملفات. كثير منها يدعم ZipCrypto فقط، ومن هنا يأتي خطأ كلمة المرور الكاذب كثيرًا.</li>
    <li><strong>آي أو إس.</strong> تطبيق «الملفات» المدمج يضغط ويستخرج، لكنه لا ينشئ أرشيفات مشفرة. لذلك تحتاج تطبيقًا.</li>
  </ul>

  <h2>إن ضاعت كلمة المرور فعلًا</h2>

  <p>يحسن أن نكون صريحين هنا. بالنسبة لأرشيف مشفر بـAES-256 بكلمة مرور معقولة، لا وجود لأي استرجاع. وهذا هو الغرض من التشفير أصلًا. والبرامج التي تعلن استرجاعًا فوريًا إما تخمّن من قاموس، وهذا لا ينفع إلا مع كلمات المرور الضعيفة، وإما تستهدف ZipCrypto القديم حيث توجد ثغرة تشفيرية حقيقية.</p>

  <p>لذلك قبل أن تدفع مالًا لبرنامج استرجاع، اعرف أي نظام يستخدمه أرشيفك. فإن كان AES فلن يفيدك أي منتج، والجواب الصادق هو العودة إلى من أنشأ الملف.</p>

  <p>وإن كان الأرشيف لك وتريد فقط تغيير كلمة المرور أو إزالتها، فإن <a href="/ar/archive/unlock/">أداة إزالة كلمة مرور ZIP</a> تأخذ الأرشيف وكلمة المرور الحالية وتعيد لك ملفًا عاديًا.</p>

  <h2>أسئلة شائعة</h2>

  <h3>لماذا لا أستطيع وضع كلمة مرور على ملف ZIP في ويندوز 10 أو 11؟</h3>
  <p>لأن ويندوز لم يتضمن هذه الميزة قط. الضغط المدمج ينشئ أرشيفات عادية فقط. وهو يفتح الأرشيفات المشفرة المصنوعة في مكان آخر، ومن هنا يظن الناس أنه يستطيع صنعها.</p>

  <h3>ملف ZIP عندي يفتح دون أن يطلب كلمة المرور التي وضعتها.</h3>
  <p>كلمة المرور لم تُطبَّق. ما ضغط المجلد تخطى التشفير، وهو على الأرجح قائمة الزر الأيمن في ويندوز. أعد إنشاء الأرشيف ببرنامج يشفّر.</p>

  <h3>يقول 7-Zip إن كلمة المرور خاطئة وأنا واثق أنها صحيحة.</h3>
  <p>افحصها حرفًا حرفًا في حقل نص عادي أولًا، وانتبه للمسافة في النهاية ولاختلاف تخطيط لوحة المفاتيح. فإن كانت صحيحة قطعًا، فقد يكون الأرشيف تالفًا، فجرّب تنزيله مجددًا.</p>

  <h3>هل ملف ZIP المحمي بكلمة مرور آمن فعلًا؟</h3>
  <p>يعتمد على النظام المستخدم. AES-256 قوي. أما ZipCrypto القديم فلا، ويُكسر بسرعة متى عرف المهاجم جزءًا من المحتوى. فإن كان الأرشيف مهمًا فتأكد أنه يستخدم AES.</p>

  <h3>أسماء الملفات ظاهرة بلا كلمة مرور. هل هو مشفر أصلًا؟</h3>
  <p>على الأرجح نعم، لكن بالمستوى المعتاد حيث يُشفَّر المحتوى وتبقى القائمة ظاهرة. جرّب استخراج ملف وانظر هل يسأل. وإن أردت إخفاء الأسماء أيضًا فاستعمل أداة تشفّر أسماء الملفات.</p>

  <h3>هل يمكنني فتح أرشيف مشفر على الهاتف؟</h3>
  <p>أحيانًا. كثير من مديري الملفات على الهواتف يدعم النظام القديم فقط، فيفشل أرشيف AES برسالة كلمة مرور مضللة. وتطبيق يذكر دعم AES صراحة، أو الاستخراج على حاسوب، يجنبك المشكلة.</p>

  <h2>اصنع أرشيفًا يعمل من أول مرة</h2>

  <p>إن كنت سترسل شيئًا يحتاج كلمة مرور، فتجاوز الضغط المدمج تمامًا. <a href="/ar/archive/protect/">أداة حماية ZIP</a> تشفّر بـAES-256 داخل المتصفح، فيصل المستلم أرشيف يطلب كلمة المرور فعلًا، و<a href="/ar/archive/unlock/">إزالة كلمة مرور ZIP</a> تزيل كلمة المرور من أرشيف لديك سلفًا. وإن كان الأمر يخص صورة واحدة لا مجلدًا، فإن <a href="/ar/image/password-protect-image/">حماية الصورة بكلمة مرور</a> تفعل ذلك مباشرة.</p>
