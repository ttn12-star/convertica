content_ar: |
  هناك لحظة قبل الضغط على «نشر» يبدو فيها كل شيء منتهياً. التصميم جاهز، والملف مفحوص، ونماذج العرض مُعدّة. وهذه أرخص لحظة ممكنة لالتقاط خطأ، وأكثرها تخطياً.

  الفحوص أدناه تتجاوز الملف نفسه بشكل مقصود. فمقاس الصفحة والدقة والخطوط المضمَّنة والحجم مشروحة في دليلنا عن <a href="/ar/blog/sell-printable-pdf-on-etsy/">تجهيز ملف PDF قابل للطباعة للبيع</a>، وإذا كان منتجك يُسلَّم بمعياري ورق فإن <a href="/ar/blog/a4-vs-us-letter-printable-sizes/">قرار A4 وUS Letter</a> هناك أيضاً. لنفترض أن ذلك العمل تمّ. وما يلي هو كل ما يحيط بالملف، وهناك تسكن طلبات الاسترجاع المتبقية.

  <h2>1. افتح الحزمة كما سيفتحها المشتري</h2>

  <p>لا المجلد على سطح مكتبك. بل الشيء الذي يُسلَّم بالفعل. نزّله من معاينة المنصة إن وُجدت، أو أرسل الأرشيف إلى بريدك وافتحه من البريد.</p>

  <ul>
    <li><strong>على الهاتف.</strong> حصة كبيرة من المشترين تفتح التنزيل على الهاتف أولاً، والأرشيف على الهاتف تجربة أسوأ مما تتذكر. فإذا لم يكن الوصول إلى ملفك من الهاتف ممكناً بلمستين، فتوقّع رسائل.</li>
    <li><strong>بلا بنية المجلدات.</strong> كثيرون يفكّون كل شيء في مجلد واحد. فإذا كانت ملفاتك تتميز باسم المجلد فقط، فهي الآن لا تتميز.</li>
    <li><strong>بلا خطوطك.</strong> جهاز شخص آخر هو الاختبار الحقيقي الوحيد للخطوط المضمَّنة، وثمنه رسالة واحدة إلى صديق.</li>
  </ul>

  <h2>2. سمِّ الملفات لا المجلدات</h2>

  <p>كل اسم ملف يجب أن يكون مفهوماً خارج السياق، بعد ستة أشهر، في مجلد تنزيلات فيه أربع مئة شيء آخر. أي: المنتج، والصيغة، ولا شيء غير ذلك.</p>

  <p>جيد: <code>weekly-planner-A4-portrait.pdf</code>. سيئ: <code>final_v3.pdf</code> أو <code>Untitled-1.pdf</code> أو اسم يحمل أرقام مراجعاتك الداخلية. تجنّب المحارف التي تسيء التصرف بين الأنظمة، واستخدم الأحرف الصغيرة والشُرَط بدل المسافات. ومقالنا عن <a href="/ar/blog/pdf-naming-conventions-best-practices/">تسمية الملفات</a> مكتوب للمستندات، لكن القواعد متطابقة.</p>

  <h2>3. ضع صفحتين إضافيتين في الداخل</h2>

  <p>صفحتان لا تكلّفانك شيئاً وتمنعان معظم رسائل الدعم:</p>

  <ul>
    <li><strong>صفحة ترخيص.</strong> بلغة واضحة، صفحة واحدة: ما يجوز للمشتري، وما لا يجوز، وهل الاستخدام التجاري مشمول، وكيف يتصل بك. ومقالنا عن <a href="/ar/blog/stop-buyers-editing-reselling-your-pdf/">ما تحققه حماية الملف فعلاً</a> يشرح لماذا تعمل هذه الصفحة أكثر من أي إجراء تقني.</li>
    <li><strong>صفحة واحدة عن كيفية الطباعة.</strong> اطبع بنسبة 100 بالمئة، بالمقاس الفعلي، مع تعطيل التحجيم. وأي ورق. وأي الصفحات اختياري. هذه الصفحة وحدها تزيل أكثر الشكاوى شيوعاً: ملف صحيح مطبوع بمقياس خاطئ.</li>
  </ul>

  <p>أبقِ الصفحتين قصيرتين. فمستند شروط بعشر صفحات في مخطط بخمسة دولارات يُقرأ كعلامة تحذير.</p>

  <h2>4. تحقّق أن الإعلان يقول الحقيقة</h2>

  <p>اقرأ وصفك كخصم. فكل رقم وكل اسم فيه وعد:</p>

  <table>
    <thead>
      <tr><th>إذا قال الإعلان</th><th>تحقّق من</th></tr>
    </thead>
    <tbody>
      <tr><td>«12 صفحة»</td><td>افتح الملف وعُدّ. الغلاف وصفحة الترخيص يغيّران الرقم</td></tr>
      <tr><td>«A4 وUS Letter مضمّنان»</td><td>الملفان موجودان فعلاً في الحزمة، وكل منهما بالمقاس المعلن</td></tr>
      <tr><td>«قابل للتعديل»</td><td>قابل للتعديل في الأداة التي يملكها المشتري، لا في أداتك وحدها</td></tr>
      <tr><td>«تنزيل فوري»</td><td>المنصة تسلّم فورياً فعلاً لهذا النوع من الإعلانات</td></tr>
      <tr><td>«الاستخدام التجاري مسموح»</td><td>صفحة الترخيص داخل الملف تقول الشيء نفسه</td></tr>
      <tr><td>«300 نقطة في البوصة»</td><td>الصور كذلك فعلاً، عند مقاس الطباعة النهائي</td></tr>
    </tbody>
  </table>

  <p>الصف الأخير يستحق لحظة. فادعاء 300 نقطة في البوصة والصورة الأصلية مكبّرة هو نوع الوعد المحدد القابل للتحقق الذي ينتج أغضب التقييمات، لأن المشتري يستطيع التأكد وأنت لا تستطيع الجدال.</p>

  <h2>5. أعطِ الملف إصداراً، بهدوء</h2>

  <p>ضع علامة إصدار صغيرة في مكان غير لافت: في بيانات الملف الوصفية أو بخط صغير على صفحة الترخيص. لا في اسم الملف، حيث تبدو غير منتهية.</p>

  <p>ستجد خطأً بعد البيعة الخمسين. وحينها يخبرك رقم الإصدار هل المشتري المتشكّي يملك الملف القديم، ويتيح لك بيان ما تغيّر، ويعفيك من التساؤل أي نسخة على قرصك. ثلاثون ثانية من العمل تُسدَّد مرة واحدة بالضبط، وبثمن غالٍ.</p>

  <h2>6. أدِر المرور الميكانيكي الأخير</h2>

  <p>قصير، وكل بند فيه يلتقط شيئاً حقيقياً:</p>

  <ul>
    <li><strong>سطّح ما تسلّمه.</strong> <a href="/ar/pdf-edit/flatten/">التسطيح</a> يزيل الطبقات وحقول النماذج الشاردة التي قد يزيحها المشتري، ويجعل الملف يُفتح أسرع. تجاوز هذا فقط إذا كان المنتج يُقصد تعبئته.</li>
    <li><strong>افحص ترتيب الصفحات والترقيم.</strong> إذا كانت مجموعة متعددة الصفحات، فـ<a href="/ar/pdf-edit/add-page-numbers/">الترقيم</a> يأتي أخيراً، بعد أن يصبح الترتيب نهائياً.</li>
    <li><strong>طابق الحجم مع حد المنصة</strong> لكل ملف لا للحزمة، و<a href="/ar/pdf-organize/compress/">اضغط</a> فقط إذا اضطررت.</li>
    <li><strong>نظّف البيانات الوصفية التي لم تقصد إرسالها.</strong> حقول المؤلف وأسماء البرامج من التصدير كثيراً ما تحمل اسمك الحقيقي أو عنوان مشروع عميل لا علاقة له.</li>
    <li><strong>افتحه مرة أخرى، من أوله إلى آخره.</strong> لا تصفّحاً سريعاً. الصفحة الفارغة التي تركتها في الموضع السابع أسهل إيجاداً الآن من إيجادها في تقييم.</li>
  </ul>

  <h2>7. بعد البيعات الأولى</h2>

  <p>النشر ليس نهاية الفحص. أمران يستحقان العمل في الأسبوع الأول:</p>

  <ul>
    <li><strong>اشترِ منتجك بنفسك</strong> إن سمحت المنصة، أو اطلب من أحد. فالمسار الكامل من الدفع إلى الملف المفتوح هو الاختبار الوحيد الذي يغطي سلوك المنصة نفسها، وأنت لا تتحكم فيه وهو يتغير.</li>
    <li><strong>اقرأ الأسئلة الأولى كتقارير أخطاء.</strong> أول ثلاث رسائل من المشترين تخبرك بالضبط أي جزء من إعلانك أو تعليماتك غير واضح. أصلح الإعلان بدلاً من الإجابة على السؤال نفسه إلى الأبد.</li>
  </ul>

  <h2>البوابة كلها في جدول</h2>

  <table>
    <thead>
      <tr><th>الفحص</th><th>ما يلتقطه</th></tr>
    </thead>
    <tbody>
      <tr><td>فتح الحزمة المُسلَّمة على الهاتف</td><td>عناء الأرشيف، ملفات لا تُفتح، أجزاء ناقصة</td></tr>
      <tr><td>فك كل شيء في مجلد واحد</td><td>أسماء ملفات كانت تعمل داخل المجلدات فقط</td></tr>
      <tr><td>الفتح على جهاز بلا خطوطك</td><td>خطوط غير مضمَّنة، وتنسيق منهار</td></tr>
      <tr><td>صفحة الترخيص وتعليمات الطباعة في الداخل</td><td>معظم رسائل الدعم ومنازعات الترخيص</td></tr>
      <tr><td>كل ادعاء في الإعلان محقَّق مقابل الملف</td><td>التقييمات التي لا تستطيع الجدال فيها</td></tr>
      <tr><td>علامة الإصدار مسجَّلة</td><td>عدم معرفة أي نسخة بحوزة المشتري</td></tr>
      <tr><td>مسطَّح، مرتَّب، مرقَّم، داخل حد الحجم</td><td>تعديلات عارضة، ورفض الرفع</td></tr>
      <tr><td>البيانات الوصفية منظَّفة</td><td>إرسال اسمك الحقيقي أو عنوان مشروع عميل</td></tr>
      <tr><td>الملف مقروء من أوله إلى آخره</td><td>الصفحة الفارغة، والصفحة المكرّرة، والخطأ في العنوان</td></tr>
    </tbody>
  </table>

  <h2>ماذا يحدث للملف الذي ترفعه</h2>

  <p>أدواتنا تعمل على الخادم، فالملف يُرفع. ويُحذف بمجرد انتهاء المهمة، ورابط التنزيل لك وحدك. لا شيء يُفهرس أو يُحفظ أو يُعاد استخدامه للتدريب. ولمنتج لم يُطلق بعد، مقالنا عن <a href="/ar/blog/is-convertica-safe-pdf-file-security-privacy-explained/">كيف تتعامل Convertica مع ملفاتك</a> يبيّن قواعد الاحتفاظ.</p>

  <h2>أسئلة متكررة</h2>

  <h3>كم ينبغي أن يأخذ هذا؟</h3>
  <p>عشرون دقيقة لمنتج من ملف واحد، وأقرب إلى ساعة لحزمة بعدة مقاسات. وهي فعلاً أرخص عشرين دقيقة في العملية كلها، لأن كل بند في القائمة يكلّف أضعاف ذلك إذا أُصلح بعد النشر.</p>

  <h3>هل يحتاج ملف رخيص للطباعة صفحة ترخيص فعلاً؟</h3>
  <p>نعم، وفي الرخيص أكثر. فالمنتجات منخفضة الثمن تُشترى بعفوية وتُعاد استخداماً بعفوية، ومعظم فاعلي ذلك غير متأكدين مما يجوز لهم. صفحة واحدة بلغة واضحة تمنع الالتباس، وهي المستند الذي تشير إليه إن احتجت يوماً الإبلاغ عن نسخة.</p>

  <h3>هل يجب أن يرى المشتري رقم الإصدار؟</h3>
  <p>بالكاد. خط صغير على صفحة الترخيص أو في بيانات الملف الوصفية هو الصحيح. أما إصدار في اسم الملف أو على الغلاف فيجعل منتجاً منتهياً يبدو مسوّدة، ويدعو إلى السؤال عمّا كان معطلاً في الإصدار الأول.</p>

  <h3>ماذا أفعل إن وجدت خطأً بعد البيع؟</h3>
  <p>أصلح الملف، وارفع الإصدار، واستبدله على المنصة، وراسل المشترين إذا أثّر الخطأ على الاستخدام لا على الشكل وحده. معظم المنصات تسمح بتحديث ملف رقمي في مكانه، والمشترون الذين يصلهم إصدار مصحّح دون طلب يتركون تقييمات أفضل من الذين لم يروا مشكلة أبداً.</p>

  <h3>هل يستحق أن أشتري منتجي؟</h3>
  <p>مرة واحدة لكل نوع منتج، نعم. أنت لا تختبر ملفك بل تختبر المنصة: بريد الإيصال، وانتهاء صلاحية الرابط، وهل يصل الملف بالاسم الذي أعطيته. ذلك المسار يتعطّل بطرق لن تراها أبداً من لوحة البائع.</p>

  <h3>كم أنظّف من البيانات الوصفية؟</h3>
  <p>المؤلف والعنوان وأي حقول برنامج أو قالب. فمن الشائع أن يحمل التصدير اسم القالب الذي اشتريته، أو اسم مشروع عميل سابق، أو اسمك القانوني وأنت تبيع باسم متجر. لا شيء من ذلك يفيدك، وأحدها قد يُحرجك فعلاً.</p>

  <h2>اجتز البوابة</h2>

  <p>خذ المنتج الذي كنت ستنشره، وأنجز البنود من الأول إلى السادس الآن بالترتيب. معظم الملفات تحتاج <a href="/ar/pdf-edit/flatten/">التسطيح</a> ولا شيء غيره؛ وما يحتاج عملاً عادة هو الحزمة والإعلان. وإذا كان منتجك متن كتاب لا ملفاً للطباعة، فالمتطلبات مختلفة وأصرم: انظر <a href="/ar/blog/low-content-book-interior-pdf-requirements/">كيف يجب أن يكون متن كتاب low-content</a>. وما تبقى موجود في <a href="/ar/all-tools/">كل الأدوات</a>.</p>
