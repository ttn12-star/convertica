content_ar: |
  جدول البيانات شبكة لا نهاية لها، وملف PDF رزمة من أوراق بحجم ثابت. كل مشكلة في تحويل Excel إلى PDF هي في جوهرها محاولة من المحوّل أن يقرر أين تنتهي شبكتك وكيف يقطعها إلى صفحات، ثم يخطئ التقدير.

  الخبر الجيد أن هذه الأخطاء تأتي من قائمة قصيرة من الأسباب. ابحث عن سببك أدناه، وأصلحه مرة واحدة في الملف، فيخرج كل تصدير لاحق لهذا الملف سليما.

  <h2>1. الأعمدة تنتهي في صفحة منفصلة</h2>

  <p><strong>ما تراه:</strong> الصفحة الأولى فيها الأعمدة من A إلى F، والأعمدة من G إلى K تظهر وحدها في الصفحة الرابعة، بعد كل الصفوف، ومن دون تسميات الصفوف.</p>

  <p><strong>السبب:</strong> الورقة تُطبع افتراضيا بحجم 100%. فإن كان الجدول أعرض من الورق، ذهبت الأعمدة التي لا تتسع إلى صفحات خاصة بها تُطبع بعد الكتلة الأولى من الصفوف. هذا هو أثر «نصف الورقة مفقود»: هو ليس مفقودا، بل موجود بعد ثلاث صفحات.</p>

  <p><strong>الإصلاح في Excel:</strong> تبويب <strong>تخطيط الصفحة</strong>، مجموعة <strong>احتواء للطباعة</strong> (Scale to Fit). اضبط <strong>العرض</strong> على «صفحة واحدة» واترك <strong>الارتفاع</strong> على «تلقائي». سيتقلص الجدول بالقدر الذي يكفي ليتسع عرضيا، ويمتد نزولا على ما يحتاجه من صفحات. وللجدول العريض غيّر <strong>الاتجاه</strong> أيضا إلى أفقي، فهذا يمنحك عرضا إضافيا بنحو 40% قبل أن يضطر أي شيء إلى التقلص.</p>

  <p>تجنب ضبط العرض والارتفاع كليهما على صفحة واحدة في جدول طويل. هذا يحشر 300 صف في ورقة واحدة، فتقع في المشكلة التالية.</p>

  <p><a href="/ar/excel-to-pdf/">محوّل Excel إلى PDF</a> يتولى مسألة العرض عنك: ما لم يكن في الملف تحجيم طباعة خاص به، فإنه يحتوي كل الأعمدة في عرض الصفحة ويقلب الجداول العريضة إلى الوضع الأفقي. في اختباراتنا، جدول من 25 عمودا خرج في أربع صفحات بالتحويل العادي، واتسع في صفحة أفقية واحدة.</p>

  <h2>2. عشرات (أو آلاف) الصفحات الفارغة</h2>

  <p><strong>ما تراه:</strong> بياناتك تملأ صفحتين، وملف PDF فيه 40 صفحة، كلها تقريبا فارغة. أو صفحة بيانات واحدة تتبعها صفحات ليس فيها إلا خطوط الشبكة.</p>

  <p><strong>السبب:</strong> المحوّل يطبع كل شيء حتى آخر خلية يظن أنها مستخدمة، وكثيرا ما لا تكون هي آخر صف من بياناتك. المذنبون المعتادون:</p>

  <ul>
    <li>مسافة كُتبت في خلية بعيدة في الأسفل أو على الجانب ثم نُسيت؛</li>
    <li>صيغة نُسخت حتى الصف 5000 وتعيد نصا فارغا (<code>=IF(A2="","",...)</code>)؛</li>
    <li>في Excel نفسه، حد أو لون تعبئة طُبّق على صفوف أو أعمدة كاملة، فيعدّها Excel مستخدمة هي الأخرى.</li>
  </ul>

  <p><strong>كيف تجده:</strong> انقر أي خلية واضغط <strong>Ctrl+End</strong> (أو Cmd+Fn+السهم الأيمن على Mac). يقفز Excel إلى الزاوية السفلية الأخيرة مما يعدّه النطاق المستخدم. فإن كانت الخلية AZ4000 وجدولك ينتهي عند F120، فكل ما بينهما هو ما يتحول إلى صفحات فارغة.</p>

  <p><strong>الإصلاح:</strong> حدد الصفوف التي تحت جدولك (انقر رقم أول صف فارغ، ثم Ctrl+Shift+السهم للأسفل)، وانقر بزر الفأرة الأيمن، ثم <strong>حذف</strong>. وافعل الشيء نفسه مع الأعمدة الزائدة على الجانب. ثم احفظ الملف، فـ Excel لا يعيد حساب النطاق المستخدم إلا عند الحفظ. الضغط على مفتاح Delete فوق الخلايا لا يكفي، لأنه يمسح القيم ويُبقي التنسيق؛ أنت تحتاج إلى أمر حذف الصفوف والأعمدة نفسه.</p>

  <p><strong>أو اضبط ناحية طباعة</strong> فلا يعود باقي الورقة مهما: حدد الجدول، ثم تخطيط الصفحة، <strong>ناحية الطباعة</strong>، تعيين ناحية الطباعة.</p>

  <p>محوّل Excel إلى PDF يتجاهل الخلايا التي لا تحمل سوى لون تعبئة أو حد. وفي المصنف الخالي من الصيغ يفرّغ أيضا المسافات الشاردة الواقعة بعد نهاية جدولك، فتكف عن إنتاج صفحات فارغة. أما المسافة التي تأتي مباشرة بعد نص في الصف نفسه فتبقى، لأن الناس يستخدمونها لمنع ملاحظة طويلة من الامتداد إلى العمود التالي. والمصنفات التي تحتوي صيغا تُحوَّل كما هي تماما، لأن صيغة ما قد تكون تحسب تلك الخلايا، ولذلك يبقى تنظيف Ctrl+End المذكور أعلاه هو الطريق معها. وناحية الطباعة التي تضبطها بنفسك لها الكلمة الأخيرة دائما.</p>

  <h2>3. كل شيء يتسع، لكن النص مجهري</h2>

  <p><strong>ما تراه:</strong> صفحة واحدة، كل الأعمدة حاضرة، وحجم الخط كأنه بند إخلاء مسؤولية في عقد.</p>

  <p>هناك سببان. إما أن الورقة عريضة جدا فعلا (40 أو 50 عمودا ستبقى صغيرة دائما في عرض صفحة واحدة)، وإما أن خلية شاردة بعيدة على الجانب (انظر السبب 2) جعلت المحوّل يحتوي 52 عمودا وأنت لا تملك إلا 6. افحص Ctrl+End أولا، فهو الاحتمال الأرخص.</p>

  <p>وإن كان الجدول عريضا حقا، فاختر المقايضة التي تناسبك:</p>

  <ul>
    <li>الوضع الأفقي مع الاحتواء في العرض: مقروء حتى نحو 20 أو 25 عمودا عاديا على ورق A4.</li>
    <li>أخفِ الأعمدة التي لا يحتاجها أحد في ملف PDF قبل التصدير. الأعمدة المخفية لا تُطبع.</li>
    <li>قسّم الجدول: ضع كل مجموعة أعمدة في ورقة خاصة بها، مع تكرار عمود المعرّف في كل منها (انظر <a href="/ar/blog/excel-to-pdf-repeat-header-row-every-page/">تكرار صفوف وأعمدة العناوين</a>).</li>
    <li>اختر «الإبقاء على الحجم الأصلي» في خيارات التخطيط في المحوّل: نص بحجمه الكامل، وأعمدة تتابع في صفحات إضافية، أي عكس الخيار الأول.</li>
  </ul>

  <h2>4. علامات شباك (####) أو نص مقطوع في منتصف الكلمة</h2>

  <p><strong>ما تراه:</strong> <code>#####</code> مكان رقم أو تاريخ، أو جملة تتوقف عند حافة الخلية.</p>

  <p><strong>السبب:</strong> ملف PDF يعرض بالضبط ما ستعرضه النسخة المطبوعة. الرقم الذي لا يتسع لعموده يظهر علامات شباك، على الشاشة وعلى الورق. والنص الذي لا يتسع يُقطع عند حافة الخلية متى كانت الخلية المجاورة فيها شيء.</p>

  <p><strong>الإصلاح:</strong> وسّع العمود (انقر نقرا مزدوجا على حافة حرف العمود ليحتوي المحتوى تلقائيا)، أو فعّل التفاف النص في خلايا النصوص الطويلة لتنمو نزولا بدلا من ذلك. افحص بتكبير 100%؛ فعند 85% قد يبدو العمود سليما على الشاشة ثم يظهر #### عند الطباعة.</p>

  <h2>5. الجدول عالق في زاوية الصفحة</h2>

  <p>الجدول الضيق يُطبع افتراضيا في الزاوية العلوية، وهذا يبدو غريبا في فاتورة أو نموذج. افتح تخطيط الصفحة، الهوامش، <strong>هوامش مخصصة</strong>، ثم فعّل <strong>توسيط في الصفحة: أفقياً</strong>. وفعّل «عمودياً» أيضا لنموذج من صفحة واحدة. الإعداد يُحفظ في الملف، فيلتقطه ملف PDF.</p>

  <p>ومفاجأة قريبة من هذه هي حجم الورق. الورقة المضبوطة على US Letter حين تُطبع على A4 (أو العكس) تكسب أو تخسر شريطا في الأسفل، وقد يدفع ذلك آخر صف إلى صفحة وحده. في الولايات المتحدة وكندا والمكسيك وعدد من دول أمريكا اللاتينية الأخرى المعيار هو Letter، وفي كل مكان آخر تقريبا هو A4. في <a href="/ar/blog/a4-vs-us-letter-printable-sizes/">دليلنا للمقارنة بين A4 وLetter</a> المقاسات الدقيقة. وحين لا يحدد الملف الورق الذي يريده، يستخدم المحوّل A4.</p>

  <h2>6. بعض الأوراق مفقودة من ملف PDF</h2>

  <p>خيار ملف، حفظ باسم، PDF في Excel يحفظ الورقة النشطة وحدها، ما لم تفتح <strong>خيارات</strong> وتختار «المصنف بأكمله». وتحديد عدة تبويبات قبل الحفظ ينفع أيضا. أما المحوّل عبر الإنترنت فيأخذ كل ورقة ظاهرة في المصنف، وتبدأ كل واحدة في صفحة جديدة. الأوراق المخفية تُتخطى، فأظهر أي ورقة تريد إدراجها.</p>

  <h2>فحص ما قبل التصدير في خمس دقائق</h2>

  <ol>
    <li>Ctrl+End في كل ورقة. احذف الصفوف والأعمدة التي بعد الجدول الحقيقي، ثم احفظ.</li>
    <li>عرض، <strong>معاينة فواصل الصفحات</strong>. الخطوط الزرقاء تبين بالضبط أين ستنقسم الصفحات؛ اسحبها لتحريك الفاصل.</li>
    <li>احتواء للطباعة: العرض صفحة واحدة، والارتفاع تلقائي. والوضع الأفقي إن كان الجدول عريضا.</li>
    <li>طباعة العناوين إن كان الجدول يمتد على عدة صفحات.</li>
    <li>ملف، معاينة الطباعة، ومرّر عبر كل الصفحات. ما تراه هناك هو ما سيحصل عليه ملف PDF.</li>
  </ol>

  <h2>أسئلة شائعة</h2>

  <h3>لماذا يبدو ملف PDF مختلفا عما ينتجه «حفظ باسم PDF» في Excel نفسه؟</h3>
  <p>Excel يرسم الصفحات عبر برنامج تشغيل الطابعة والخطوط المثبتة على جهازك، أما المحوّل عبر الإنترنت فيرسمها على خادم بخطوطه الخاصة ومن دون طابعة. إعدادات التخطيط المحفوظة في الملف (ناحية الطباعة، والتحجيم، والاتجاه، والهوامش، وعناوين الطباعة) يحترمها الاثنان. وتختلف النتائج غالبا حين يعتمد الملف على الإعدادات الافتراضية، أو يستخدم خطا غير موجود على الخادم.</p>

  <h3>هل أستطيع إصلاح ملف PDF مقطوع بالفعل؟</h3>
  <p>ليس بتحرير ملف PDF: الجزء المفقود لم يُرسم أصلا. أصلح جدول البيانات وحوّل من جديد. وإن ضاع الأصل، <a href="/ar/pdf-to-excel/">فحوّل ملف PDF إلى Excel مجددا</a>، وأصلحه، ثم صدّره مرة أخرى.</p>

  <h3>لماذا تُظهر معاينة الطباعة في Excel صفحة واحدة بينما في ملف PDF أكثر؟</h3>
  <p>غالبا لأن ملف PDF صُنع من ورقة أخرى، أو لأن معاينة الطباعة كانت تعرض تحديدا فقط. تأكد من الورقة النشطة، ومن أن خيار «طباعة التحديد» غير مختار.</p>

  <h3>هل تظهر الصفوف المخفية في ملف PDF؟</h3>
  <p>لا. الصفوف والأعمدة المخفية تبقى مخفية، في تصدير Excel نفسه وفي المحوّل.</p>

  <h3>هل يفسد المحوّل الصيغ أو المخططات؟</h3>
  <p>لا. يعرض ملف PDF القيم التي أنتجتها الصيغ والمخططات كما رُسمت. لا يُعدَّل جدول البيانات الأصلي؛ تحصل على ملف PDF جديد.</p>

  <h2>حوّل ملفك</h2>

  <p>مرّ على فحص ما قبل التصدير، ثم أسقط الملف في <a href="/ar/excel-to-pdf/">محوّل Excel إلى PDF</a>. وإذا كانت المشكلة فقط أن الصفحات من الثانية فصاعدا بلا أسماء أعمدة، فانظر <a href="/ar/blog/excel-to-pdf-repeat-header-row-every-page/">كيف تكرر صف العناوين في كل صفحة</a>، وللقائمة الأشمل راجع <a href="/ar/blog/convert-excel-to-pdf-keep-formatting/">تحويل Excel إلى PDF دون فقدان التنسيق</a>.</p>
