content_ar: |
  ملف HEIC يفتح فورًا على الآيفون قد يكون جامدًا تمامًا في أي مكان آخر، والسبب يختلف باختلاف النظام. لذلك بدل قائمة حلول واحدة، ابدأ بمطابقة العَرَض.

  <h2>ويندوز: الترميز الذي تتقاضى مايكروسوفت ثمنه</h2>

  <p>هذه الحالة الأكثر شيوعًا والأكثر إزعاجًا، لأن الحل مقسوم نصفين ونصف واحد فقط مجاني.</p>

  <p>يستطيع ويندوز 10 و11 عرض ملفات HEIC، لكن بشرط تثبيت مكوّنين:</p>

  <ul>
    <li><strong>HEIF Image Extensions.</strong> مجانية في متجر مايكروسوفت، وتتولى الحاوية.</li>
    <li><strong>HEVC Video Extensions.</strong> غير مجانية، وتطلب مايكروسوفت مقابلًا صغيرًا. وهي تتولى فك ترميز الصورة نفسها، لأن صور HEIC مرمَّزة بـHEVC.</li>
  </ul>

  <p>ثبّت الأولى وحدها وستحصل على تلك الحالة نصف العاملة التي يصفها الجميع: قد تظهر المصغّرات، لكن فتح الملف يعطي خطأ أو مربعًا رماديًا فارغًا. الحاوية مفهومة، والصورة بداخلها لا.</p>

  <p>وثمة تفصيل يستحق المعرفة. بعض الأجهزة تأتي وامتداد HEVC مرخّص فيها من المصنّع، ولهذا يفتح زميل الملف بلا مشكلة ولا يفتحه آخر، مع أن إصدار ويندوز يبدو واحدًا.</p>

  <h3>الأعراض ومعناها على ويندوز</h3>

  <ul>
    <li><strong>مربع رمادي أو «تعذّر العرض».</strong> امتداد HEIF موجود و HEVC مفقود.</li>
    <li><strong>أيقونة فارغة وتطبيق الصور لا يفتحه إطلاقًا.</strong> لا امتداد مثبتًا أصلًا.</li>
    <li><strong>مصغّرات في مستكشف الملفات ولا شيء في العارض.</strong> مثل الحالة الأولى، فالمصغّرة تأتي من معاينة مضمّنة لا من فك ترميز كامل.</li>
    <li><strong>الصور تفتح الملف لكن التحرير يفشل.</strong> فك الترميز يعمل ومسار التحرير لا يدعم الصيغة. حوّل قبل التحرير.</li>
  </ul>

  <p>إن كنت تريد الصورة فحسب، فالتحويل أسرع من شراء ترميز وتثبيته. <a href="/ar/image/heic-to-jpg/">محوّل HEIC إلى JPG</a> يعمل داخل المتصفح ويمنحك ملفًا يفهمه ويندوز منذ التسعينيات.</p>

  <h2>أندرويد: الأمر رهن بإصدارك</h2>

  <p>حصل أندرويد على دعم HEIF على مستوى النظام في الإصدار 10. وقبل ذلك لا شيء في النظام يفك ترميزه، ويبقى الملف غير مقروء دون تطبيق يحمل فاكّ ترميز خاصًا به.</p>

  <p>وحتى في أندرويد 10 وما بعده ليس الدعم موحدًا. النظام يستطيع فك الترميز، لكن كل تطبيق معرض أو مدير ملفات يقرر بنفسه هل يستفيد من ذلك. لذا قد تصادف أن «صور جوجل» تعرض الصورة بينما معرض الهاتف نفسه لا يعرضها، على الجهاز ذاته.</p>

  <p>يستحسن الفحص بهذا الترتيب:</p>

  <ul>
    <li>افتح الملف في «صور جوجل» أو تطبيق معروف بتعامله مع HEIF قبل أن تستنتج أن الهاتف عاجز.</li>
    <li>تحقق من إصدار أندرويد. دون الإصدار 10 لن ينجح أي تطبيق يعتمد على فاكّ الترميز في النظام، وتحتاج إلى تطبيق بفاكّ ترميز خاص.</li>
    <li>إن وصلك الملف عبر تطبيق محادثة فانظر إلى الامتداد. بعض التطبيقات تحوّل عند الاستلام وبعضها لا، ومن هنا تفتح صورة من المرسل نفسه ولا تفتح أخرى.</li>
  </ul>

  <h2>ماك: سليم عادة، مع استثناء واحد</h2>

  <p>تتعامل أجهزة ماك مع HEIC منذ High Sierra، لذا فملف لا يفتح على ماك حديث نسبيًا أمر نادر. وإذا حدث فالسبب عادة أحد هذه:</p>

  <ul>
    <li><strong>إصدار ماك قديم.</strong> كل ما سبق High Sierra بلا دعم إطلاقًا.</li>
    <li><strong>HEIC بعمق 10 بت.</strong> الآيفونات الأحدث تكتب ملفات 10 بت، والأجهزة الأقدم التي تتعامل مع HEIC العادي قد تفشل معها. يفتح على الهاتف ويفشل على الماك، ولا تقول رسالة الخطأ شيئًا عن السبب.</li>
    <li><strong>تطبيق خارجي بدل النظام.</strong> «المعاينة» و«الصور» يستعملان فاكّ الترميز في النظام، أما برنامج رسوميات قديم فقد لا يستعمله.</li>
  </ul>

  <h2>لماذا تفتح صورة ولا تفتح التي تليها</h2>

  <p>هذا يدفع الناس إلى الحكم بتلف الملف وهو سليم. وهناك تفسيران عاديان:</p>

  <p><strong>التطبيق المرسِل حوّل بعض الملفات دون بعض.</strong> عدة تطبيقات محادثة تحوّل HEIC إلى JPEG عند الإرسال «كصورة» وتمرّر الأصل عند الإرسال «كملف». المرسِل نفسه والهاتف نفسه ونتيجة مختلفة، والأمر كله رهن الزر الذي ضغطه.</p>

  <p><strong>الصورة من وضع تصوير مختلف.</strong> صور Live Photos ولقطات البورتريه ولقطات التتابع تُخزَّن بطريقة أخرى، وعارض يتعامل مع HEIC عادي قد يرفض إحداها.</p>

  <p>قبل أن تفترض أن الملف معطوب، انظر إلى الامتداد والحجم. ملف بحجم بضعة كيلوبايتات معطوب فعلًا، أما ملف بحجم ميجابايتين فسليم والعارض هو المعطّل.</p>

  <h2>إيقاف المشكلة من المنبع</h2>

  <p>إن كنت أنت من يلتقط الصور وتصطدم بهذا باستمرار، فالإعداد في الآيفون تحت «الكاميرا» ثم «التنسيقات». خيار «كفاءة عالية» يكتب HEIC، وخيار «الأكثر توافقًا» يكتب JPEG.</p>

  <p>وقبل التبديل وازن الأمر: ملفات JPEG أكبر بنحو 1.8 مرة بالجودة المرئية نفسها، وقد قسنا ذلك بالتفصيل في <a href="/ar/blog/heic-vs-jpeg-quality-and-size/">مقارنة HEIC و JPEG</a>. تغيير إعداد الكاميرا يكلفك مساحة في كل صورة إلى الأبد، مقابل تجنّب تحويل عارض. وهذه مقايضة خاسرة لمعظم الناس.</p>

  <p>وهناك خيار وسط يغفل عنه كثيرون. استمر في التصوير بـHEIC، واضبط «النقل إلى ماك أو كمبيوتر» على «تلقائي» بدل «الاحتفاظ بالأصول». عندها يحوّل الهاتف عند الإخراج، فتصل الصور بصيغة JPEG دون تغيير طريقة تخزينها.</p>

  <h2>أسئلة شائعة</h2>

  <h3>لماذا يتقاضى ويندوز ثمن HEVC Video Extensions؟</h3>
  <p>لأن HEVC ترميز مسجّل ببراءات اختراع وعليه رسوم ترخيص تمرّرها مايكروسوفت إلى المستخدم. أما HEIF Image Extensions التي تتولى الحاوية فمجانية، لكنها وحدها لا تكفي لعرض الصورة.</p>

  <h3>ثبّتُّ الامتداد وما زال لا يفتح.</h3>
  <p>على الأرجح ثبّتَّ HEIF Image Extensions دون HEVC Video Extensions. وهذه التركيبة تنتج هذه النتيجة تحديدًا: الملف معروف لكن يتعذّر فك ترميزه.</p>

  <h3>هل أستطيع فتح HEIC دون تثبيت أي شيء؟</h3>
  <p>نعم. حوّله في المتصفح وافتح ملف JPEG الذي تدعمه كل الأنظمة أصلًا. وهذا أسرع عادة من تثبيت ترميز، وهو الخيار الوحيد على جهاز لا تستطيع تثبيت برامج عليه.</p>

  <h3>هاتفي يعرض الصورة في «صور جوجل» لا في المعرض.</h3>
  <p>كل تطبيق يقرر هل يستعمل فاكّ ترميز HEIF في النظام. «صور جوجل» يستعمله وبعض معارض المصنّعين لا. والملف سليم.</p>

  <h3>مصغّرات HEIC تظهر والصور تفشل؟</h3>
  <p>المصغّرات تأتي غالبًا من معاينة صغيرة مضمّنة داخل الملف لا تحتاج فك ترميز HEVC. ورؤية المصغّرة تخبرك أن الملف سليم، لا أن نظامك قادر على فك ترميزه.</p>

  <h3>هل يفسد التحويل إلى JPEG الجودة؟</h3>
  <p>لا. قسنا ذلك: PSNR بين 42 و52 ديسيبل و SSIM فوق 0.995، وهو أبعد من النقطة التي يُرى عندها الفرق. تدفع الثمن في حجم الملف لا في جودة الصورة.</p>

  <h2>حين تحتاج الصورة فقط</h2>

  <p>تثبيت الترميزات يستحق العناء إن كنت تتعامل مع هذه الملفات يوميًا. أما لحفنة صور من أحد الأقارب فالتحويل يستغرق ثوانٍ: ضعها في <a href="/ar/image/heic-to-jpg/">محوّل HEIC إلى JPG</a> لتحصل على ملفات تفتح في كل مكان. والأداة نفسها تكتب PNG حين تحتاج الحفاظ على الشفافية، وتكتب PDF حين يريد المستلم مستندًا لا صورة. وإن بقيت الملفات المحوَّلة ثقيلة على نموذج رفع، فإن <a href="/ar/image/optimize/">محسّن الصور</a> يخفّضها.</p>
