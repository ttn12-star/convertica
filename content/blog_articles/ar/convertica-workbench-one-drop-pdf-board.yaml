  summary: "يشرح المقال لوحة Workbench في Convertica: لوحة شخصية من مربعات، كل مربع فيها أداة تحويل واحدة مع الإعدادات المحفوظة لها، فيتحوّل التحويل المتكرر إلى إفلات ملف واحد. يعرّف اللوحة والمربع، ويشرح إضافة المربعات من قائمة «إضافة أداة» القابلة للبحث بمجموعتيها (إعداداتي المسبقة والمحولات)، وكيف تُغيَّر إعدادات مربع عبر «التكوين في صفحة الأداة» ثم حفظ سير العمل، ويتناول قوالب Office والمسح الضوئي والصور، وتعدّد اللوحات ووضع التحرير لإعادة الترتيب وإعادة التسمية، وثلاثة أمثلة عملية (محاسبة، مساعدة إدارية، تعليم)، والحدود الدقيقة للزائر بلا حساب وللحساب المجاني ولمشتركي Premium مع مزامنة اللوحات، وما يحدث للملفات بعد التحويل."
