content_ar: |
  هناك عمليات تحويل تعود كل أسبوع. فواتير الموردين نفسها التي يجب أن تنتهي ملفات أرشيفية بصيغة PDF/A. كشوف الحساب نفسها التي يجب أن تصل إلى جدول بيانات. الدفعة نفسها من صور الهاتف التي لا يفتحها أحد في المكتب.

  كل واحدة منها بضع نقرات فقط. تفتح صفحة الأداة، تنتظر تحميلها، ترفع الملف، تؤشّر على الخيار الذي تؤشّر عليه دائمًا، ثم تنزّل النتيجة. افعل ذلك ثماني مرات في صباح واحد وستجد أنك أنفقت عشرين دقيقة على شاشات تحفظها عن ظهر قلب.

  لوحة PDF في Workbench تُخرج هذا الجزء من صباحك. تُجهّز الأدوات مرة واحدة على لوحة، وبعدها يصير التحويل إفلات ملف واحد.

  <h2>لوحة PDF في فكرة واحدة: المربع</h2>

  <p>اللوحة شبكة. كل خانة فيها مربع، والمربع أداة تحويل واحدة زائد الإعدادات التي حفظتها لها. أفلِت ملفًا على المربع، أو انقره واختر ملفًا، فيجري التحويل بتلك الإعدادات. لا استمارة تملؤها، ولا خيارات تعيد اختيارها، ولا صفحة ثانية. تظهر النتيجة أسفل المربع في صف يحمل زرّ التنزيل، وتبقى آخر ثلاث نتائج ظاهرة وأنت تكمل عملك، فتستطيع أخذ ملف مرة أخرى دون تشغيل التحويل من جديد.</p>

  <p>يجري تحويل واحد في كل مرة على اللوحة، وهذا مقصود. أفلِت ثلاثة ملفات على ثلاثة مربعات فتعود إليك بالترتيب الذي أرسلته، بدل أن تتسابق فيما بينها.</p>

  <figure><img src="/static/images/blog/workbench-board.jpg" alt="لوحة Workbench باسم المحاسبة تحتوي مربعات PDF إلى Word وWord إلى PDF وPDF إلى Excel، وأحدها يعرض تحويلًا منتهيًا مع زرّ التنزيل" width="1280" height="800" loading="lazy"></figure>

  <h2>ابنِ لوحتك الأولى في دقيقتين</h2>

  <ol>
    <li><strong>افتح اللوحة.</strong> اذهب إلى <a href="/ar/workbench/">Workbench</a>. لا شيء تثبّته، ولا حساب تحتاجه للتجربة. تجد الرابط أيضًا في قائمة كل الأدوات، وفي قائمة الحساب، وفي تذييل الصفحة.</li>
    <li><strong>انقر «إضافة أداة».</strong> تُفتح قائمة قابلة للبحث فيها مجموعتان. <em>إعداداتي المسبقة</em> تضمّ ما حفظته سابقًا على صفحات الأدوات، بإعداداتك الخاصة مرفقة به. <em>المحولات</em> تضمّ كل أداة تأخذ ملفًا وتعيد ملفًا على الموقع، وعددها اليوم 23: <a href="/ar/pdf-to-word/">PDF إلى Word</a> و<a href="/ar/word-to-pdf/">Word إلى PDF</a>، وExcel وPowerPoint إلى PDF، ومن PDF إلى HTML ونص وMarkdown وEPUB وJPG، وPDF/A، وHEIC إلى JPG، ومحسّن الصور وأدوات ICO. اكتب بضعة أحرف وأشّر على ما تريد.</li>
    <li><strong>أفلِت ملفًا.</strong> يستقبله المربع، يجري التحويل، ويعرض صف النتيجة تحته. الملفات الكبيرة تأخذ مسار الخلفية من تلقاء نفسها، وأثناء تشغيل أي تحويل يمكنك اختيار «المتابعة في الخلفية» والمضيّ في شغلك.</li>
    <li><strong>نزّل النتيجة.</strong> يحتفظ الصف بزرّ التنزيل حتى تستبدله، ويبقى الصفّان السابقان أسفله.</li>
    <li><strong>علّم المربع إعداداتك.</strong> افتح قائمة المربع (⋯)، اختر «التكوين في صفحة الأداة»، فتُفتح صفحة الأداة وقد حُمّلت فيها إعدادات ذلك المربع. غيّر ما تحتاجه، وانقر <strong>حفظ سير العمل</strong>، فيحتفظ المربع بالنسخة الجديدة. هكذا يُشغَّل التعرّف الضوئي على الحروف في PDF إلى Word، وهكذا يتوقف مقاس الصفحة عن كونه قرارًا في كل مرة. صفحة <a href="/ar/saved-workflows/">سير العمل المحفوظ</a> تشرح هذا الجانب بتفصيل أوسع.</li>
  </ol>

  <figure><img src="/static/images/blog/workbench-picker.jpg" alt="قائمة «إضافة أداة» على لوحة Workbench بعد التصفية بكلمة word، تعرض إعدادًا محفوظًا للتعرّف الضوئي ضمن إعداداتي المسبقة وأسفله أداتا PDF إلى Word وWord إلى PDF" width="1280" height="800" loading="lazy"></figure>

  <p>هناك نوعان لا يصيران مربعات، وذلك بقرار مقصود. الأدوات التي يحدث عملها على الشاشة (التوقيع، إضافة نص، الاقتصاص، ترتيب الصفحات، المقارنة) تحتاج يديك ومعاينة أمامك، فتبقى في صفحاتها الخاصة. والأداة التي أمامها اختيار لا تستطيع تخمينه، مثل تحويل الصور الذي يسأل عن صيغة الخرج، تعرض «الإعداد في صفحة الأداة» وترسلك إلى هناك مرة واحدة.</p>

  <h2>القوالب: Office والمسح الضوئي والصور</h2>

  <p>اللوحة الفارغة تقترح عليك ثلاث نقاط بداية، ومثلها تفعل نافذة اللوحة الجديدة:</p>

  <ul>
    <li><strong>Office</strong>: Word إلى PDF، PDF إلى Word، Excel إلى PDF، PowerPoint إلى PDF.</li>
    <li><strong>المسح الضوئي</strong>: صورة إلى نص، PDF إلى نص، PDF إلى Word.</li>
    <li><strong>الصور</strong>: HEIC إلى JPG، تحسين الصور، PDF إلى JPG.</li>
  </ul>

  <p>اختر واحدًا منها، أو ابدأ بلوحة فارغة. القالب مجرّد بداية جاهزة: كل مربع ينشئه قابل لإعادة التكوين أو للحذف.</p>

  <h2>لوحات متعددة ووضع التحرير</h2>

  <p>لوحة واحدة تغطّي الكثير، لكن العمل ينقسم إلى أشكال مختلفة. مبدّل اللوحات في الأعلى ينقلك بينها (على الهاتف يظهر كقائمة النظام الأصلية)، وقائمة اللوحة بجواره تعيد التسمية، وتعيّن اللوحة افتراضية، وتنسخها، وتحذفها. النسخ أسرع طريق لصنع نسخة مختلفة: انسخ اللوحة التي تثق بها، ثم غيّر المربعين المختلفين فيها.</p>

  <p>إعادة الترتيب تحدث في وضع التحرير. انقر <strong>تحرير</strong> في الشريط العلوي فينمو لكل مربع مقبض سحب، ويتحوّل عنوانه إلى حقل كتابة، ويظهر × لإزالته. اسحب المربعات إلى الترتيب الذي تعمل به فعلًا، وأعد تسمية «PDF إلى Word» إلى «فواتير ممسوحة» لتعرفه بنظرة واحدة، ثم انقر «تم». وخارج وضع التحرير تبقى قائمة المربع تقدّم الحجم S أو M أو L، والتحريك يمينًا أو يسارًا، والإزالة.</p>

  <figure><img src="/static/images/blog/workbench-edit.jpg" alt="لوحة Workbench في وضع التحرير: كل مربع يعرض مقبض سحب وحقل عنوان قابلًا للتعديل وزرّ إزالة أحمر، مع زرّ «تم» في الشريط العلوي" width="1280" height="800" loading="lazy"></figure>

  <h2>ثلاث طرق يستخدمها الناس</h2>

  <p><strong>مسؤول الحسابات.</strong> لوحة اسمها «إغلاق الشهر»، وفيها ثلاثة مربعات. فواتير الموردين تهبط على مربع <a href="/ar/pdf-to-pdfa/">PDF إلى PDF/A</a>، لأن الأرشيف لا يقبل غير ذلك. وكشوف البنك تهبط على <a href="/ar/pdf-to-excel/">PDF إلى Excel</a> فتُطابَق الأرقام بدل إعادة كتابتها يدويًا. ومربع ثالث يستخرج النص من الإيصالات الممسوحة. عشرون ملفًا، عشرون إفلاتًا، وبلا لمس أي إعداد.</p>

  <p><strong>المساعدة الإدارية.</strong> كل ما يخرج من المكتب مرفقًا في بريد يمرّ على لوحة واحدة أولًا. مسوّدات Word وملفات العروض تصير PDF ليرى المستلم التنسيق نفسه الذي رآه كاتبه، وصور فريق المبيعات القادمة من هواتفهم تمرّ على <a href="/ar/image/heic-to-jpg/">HEIC إلى JPG</a> قبل أن تصل إلى أحد يعمل على لابتوب بويندوز. كان الأمر يستدعي تبويبًا لكل صيغة. الآن تبويب واحد مفتوح طول اليوم.</p>

  <p><strong>المعلّم.</strong> أوراق العمل تأتي صورًا لصفحة من كتاب، ويجب أن تصير نصًا قابلًا للتعديل. مربع <a href="/ar/image/to-text/">صورة إلى نص</a> يقوم بالقراءة، ومربع PDF إلى Word يتولّى أوراق المسح الضوئي الأقدم، ومربع Word إلى PDF يعيد النسخة النهائية إلى الخارج بصيغة تُطبع كما هي على كل طابعة في المدرسة.</p>

  <h2>مجانًا، أو بحساب، أو Premium</h2>

  <table>
    <thead>
      <tr><th>الخطة</th><th>اللوحات</th><th>المربعات لكل لوحة</th><th>مكان التخزين</th></tr>
    </thead>
    <tbody>
      <tr><td>بلا حساب</td><td>1</td><td>3</td><td>في متصفحك</td></tr>
      <tr><td>حساب مجاني</td><td>1</td><td>6</td><td>في متصفحك</td></tr>
      <tr><td>Premium</td><td>5</td><td>20</td><td>مزامنة مع حسابك</td></tr>
    </tbody>
  </table>

  <p>ثلاثة مربعات بلا حساب تكفي لتعرف إن كانت الفكرة تناسب طريقة عملك. ما يضيفه Premium حقًا هو المزامنة: اللوحات والإعدادات المسبقة تسكن في حسابك، فاللوحة التي بنيتها على مكتبك تكون جاهزة على اللابتوب وعلى الهاتف، بالمربعات نفسها والإعدادات نفسها. وأداة PDF إلى PDF/A هي أداة التحويل الوحيدة التي تبقى لمشتركي Premium اليوم، وتظهر لغيرهم بشعار PRO. الأسعار على <a href="/ar/pricing/">صفحة الأسعار</a>.</p>

  <h2>ما يحدث لملفاتك</h2>

  <p>اللوحة لا تخزّن مستنداتك أبدًا. تخزّن أسماء الأدوات وترتيب المربعات والإعدادات، أي بضعة كيلوبايتات من النصّ. التحويلات السريعة تُعاد إلى متصفحك مباشرة ولا يُحفظ منها شيء. والملفات الأكبر تُنجَز في الخلفية وتُحذف بعد ساعة تقريبًا، تمامًا كما يحدث على صفحات الأدوات. أغلق التبويب فتذهب الفواتير؛ وتبقى اللوحة التي حوّلتها موجودة في المرة القادمة.</p>

  <h2>أسئلة متكررة</h2>

  <h3>هل Workbench مجانية؟</h3>
  <p>نعم، وتستطيع استخدامها بلا تسجيل دخول: لوحة واحدة، ثلاثة مربعات، محفوظة في متصفحك. الحساب المجاني يرفع العدد إلى ستة مربعات، وPremium يمنحك خمس لوحات بعشرين مربعًا لكل واحدة، مع مزامنتها بحسابك. صفحة <a href="/ar/workbench/about/">التعريف بـ Workbench</a> تسرد ما تشمله كل خطة.</p>

  <h3>أي الأدوات تصلح لتكون مربعات؟</h3>
  <p>كل أداة تأخذ ملفًا وتعيد ملفًا، وعددها 23 أداة اليوم. أما الأدوات التي تحتاج تدخّلك على الشاشة (التوقيع، إضافة نص، الاقتصاص، ترتيب الصفحات، المقارنة) فليست مربعات، لأن الإفلات وحده لا يخبرها أين تضع التوقيع.</p>

  <h3>كيف أغيّر إعدادات مربع؟</h3>
  <p>افتح قائمة المربع واختر «التكوين في صفحة الأداة». تُفتح صفحة الأداة بإعدادات المربع الحالية، تغيّر ما تريد، ثم تنقر «حفظ سير العمل». يأخذ المربع الإعدادات الجديدة في كل إفلات بعد ذلك.</p>

  <h3>هل تعمل على الهاتف؟</h3>
  <p>نعم. تتراصف الشبكة في عمود واحد، ويصير مبدّل اللوحات قائمة الاختيار الأصلية في هاتفك، ولمس المربع يفتح منتقي الملفات، وعادةً يكون معرض صورك أو مساحة تخزين سحابية. السحب بالفأرة أريح، لكن لا شيء هنا مخصّص لسطح المكتب وحده.</p>

  <h3>هل تحتفظون بملفاتي؟</h3>
  <p>لا. التحويلات الفورية تعود إلى متصفحك مباشرة ولا تُخزَّن، والملفات التي تحتاج طابور الخلفية تُحذف بعد ساعة تقريبًا. واللوحة نفسها لا تتذكّر سوى الأدوات التي اخترتها وكيف كوّنتها.</p>

  <h2>افتح لوحتك</h2>

  <p>أسرع طريقة لفهم الفكرة أن تبني لوحة واحدة. افتح <a href="/ar/workbench/">Workbench</a>، وأضف أداتي التحويل أو الثلاث التي تستخدمها أكثر من غيرها، وأفلِت ملفًا على أوّلها. وإن فضّلت أن ترى أحدهم يفعل ذلك أولًا، فهناك <a href="https://www.youtube.com/watch?v=Dcj_bE15UWQ" target="_blank" rel="noopener">شرح مصوّر في دقيقتين على YouTube</a>، وصفحة <a href="/ar/workbench/about/">التعريف بـ Workbench</a> تجيب عن الباقي.</p>
