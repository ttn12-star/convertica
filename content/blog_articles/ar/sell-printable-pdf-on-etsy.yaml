content_ar: |
  الملف القابل للطباعة الذي ينتهي بطلب استرجاع ليس ملفاً قبيحاً في الغالب. التصميم كان جيداً على الشاشة. ما حدث شيء آخر: المشتري فتحه على حاسوب يعمل بنظام Windows فتحوّل الخط الأنيق إلى Times New Roman. أو طبعه فانقطع الإطار من جهتين. أو خرجت الرسمة التي كانت حادة في المتصفح باهتة ومبقّعة من الطابعة النافثة للحبر. أو رفض Etsy الرفع أصلاً لأن حجم الملف 34 ميجابايت.

  إذن العمل الذي يحمي تقييم متجرك فعلاً يبدأ بعد انتهاء التصميم. وهو عمل غير مبهر: مقاس الصفحة، والدقة، والهوامش، والخطوط، والحجم. كل عنصر منها يتعطل بطريقته الخاصة، وكل واحد يُفحص في دقيقتين. وهذا هو الترتيب الذي تتعطل فيه عادة.

  <h2>ماذا يفعل المشتري بملفك فعلاً</h2>

  <p>كل الشروط أدناه تنبع من مصدر واحد، لذا يستحق الأمر أن نتخيّل الشخص في الطرف الآخر بوضوح. مشتريك ليس مطبعة. هو شخص:</p>

  <ul>
    <li><strong>يطبع في المنزل</strong>، على طابعة نافثة للحبر أو ليزر رخيصة لا تستطيع فيزيائياً أن تطبع حتى حافة الورقة.</li>
    <li><strong>يستخدم الورق المتاح في بلده.</strong> مقاس A4 في معظم العالم بما فيه المنطقة العربية، ومقاس US Letter في الولايات المتحدة وكندا. هذه نسب مختلفة، لا مجرد مقاسات مختلفة.</li>
    <li><strong>يفتح الملف بما هو متاح لديه</strong>، وهذا يعني بشكل متزايد هاتفاً أو جهازاً لوحياً وقارئ PDF ليس Acrobat.</li>
    <li><strong>لن يراسلك بشأن المشكلة.</strong> سيطلب استرجاع المال أو سيكتب تقييماً، وكلاهما أغلى من قيمة البيعة نفسها.</li>
  </ul>

  <p>ملف PDF هو الصيغة الصحيحة لكل ذلك لأنه يحمل تنسيقه داخله. وهنا المصيدة أيضاً: هو يحمل التنسيق الذي أعطيته له بالضبط، بما في ذلك الأجزاء التي كانت تعمل على جهازك وحده.</p>

  <h2>مقاس الصفحة: النسبة تُختار قبل أي شيء آخر</h2>

  <p>مقاس A4 هو 210 في 297 مم. ومقاس US Letter هو 216 في 279 مم. أي أن Letter أعرض وأقصر. لا يوجد معامل تحجيم يحوّل أحدهما إلى الآخر، ولهذا فإن نصيحة «اطبعه مع الملاءمة للورقة» تنتج مخططاً بأشرطة بيضاء غير متساوية ولوحة جدارية بحواف مقطوعة.</p>

  <p>الخيارات الصادقة اثنان: أن تختار مقاساً واحداً وتذكره بوضوح في الإعلان، أو أن ترسل المقاسين. معظم المتاجر الراسخة ترسل المقاسين، لأن متجراً يبيع A4 فقط يخسر زواره الأمريكيين بصمت، ومتجراً يبيع Letter فقط يخسر الباقين جميعاً.</p>

  <p>إرسال المقاسين يعني تصدير ملفين من برنامج التصميم. لا تحاول تصنيع المقاس الثاني بقص ملف PDF جاهز أو تحجيمه: القص يقتطع الصفحة إلى مستطيل أصغر، فتحصل على نافذة بنسبة Letter فوق تصميم A4 مع محتوى ناقص في الأسفل. أداة <a href="/ar/pdf-edit/crop/">قص PDF</a> عندنا وظيفتها إزالة الهوامش الزائدة من مستند، لا تحويل معيار ورقي إلى آخر. ويبقى التصدير مرتين من برنامج التصميم هو الخيار الأفضل، لأن الملف الأصلي وحده يقدر على إعادة التنسيق فعلاً وفق النسب الأخرى. وعندما لا يكون ذلك الملف بحوزتك، أو تكون اشتريت قالباً جاهزاً، فإن <a href="/ar/pdf-edit/page-size/">تغيير مقاس صفحة PDF</a> يقوم بأفضل ما يليه: ينقل الصفحات إلى الورقة الأخرى، ولأن A4 يفقد 8.8 مم من أعلى وأسفل على Letter، فهو يحفظ المقاس الكامل عندما تترك هوامشك فسحة، ويصغّرها بأقل قدر عندما لا تترك. وهو لا يقتطع أبداً. وهذا أيضاً السبب العملي للحفاظ على هامش 10 إلى 12 مم الموصوف أدناه.</p>

  <h2>دقة 300 نقطة في البوصة، ولماذا تكذب عليك الشاشة</h2>

  <p>الشاشة نحو 100 بكسل في البوصة. والورق يفصل تفاصيل أدق بثلاثة أضعاف تقريباً. لذلك فإن صورة تبدو حادة تماماً عند التكبير الكامل في المتصفح قد تُطبع باهتة بشكل واضح، ولا توجد طريقة لملاحظة ذلك على شاشة.</p>

  <p>القاعدة هي 300 نقطة في البوصة عند مقاس الطباعة النهائي. عملياً:</p>

  <ul>
    <li><strong>لوحة جدارية بمقاس 20 في 25 سم</strong> تحتاج صورة مصدر بنحو 2400 في 3000 بكسل. وإذا كان الأصل بعرض 1000 بكسل، فلا إعداد تصدير سينجيه.</li>
    <li><strong>النصوص والأشكال مستثناة.</strong> الخط والخطوط الهندسية والرسوم المتجهة داخل PDF مستقلة عن الدقة وتُطبع بأفضل ما تقدر عليه الطابعة. المخطط المصنوع من نص وخطوط فقط سيخرج حاداً دائماً.</li>
    <li><strong>المعرّض للخطر هو الصور النقطية وحدها.</strong> الصور الفوتوغرافية، والملامس، وعناصر الألوان المائية، والكتابة الممسوحة ضوئياً، وكل ما وجدته بصيغة JPG أو PNG.</li>
  </ul>

  <p>إذا كنت تصمّم في محرر يعمل داخل المتصفح، فصدّر بأعلى جودة متاحة لا بالإعداد الافتراضي: الافتراضي مضبوط عادة للمشاركة على الشاشة.</p>

  <h2>الحافة غير القابلة للطباعة والهامش الذي تفرضه</h2>

  <p>طابعة المنزل تقبض الورقة بأسطوانات لتحرّكها، فلا تستطيع وضع الحبر على آخر مليمترات من الحافة. وبحسب الطراز تكون هذه المنطقة الميتة نحو 3 إلى 6 مم من كل جهة، وأكبر عند الحافة الخارجة.</p>

  <p>لهذا نتيجتان يتعثر بهما كل بائع جديد تقريباً:</p>

  <ul>
    <li><strong>الخلفيات الممتدة إلى الحافة لا تعمل في المنزل.</strong> التصميم الذي يمتد لونه إلى حافة الصفحة يُطبع بهوامش بيضاء رقيقة، وغير متساوية عادة. وإذا كان التصميم لا يقوم دون لون يصل إلى الحافة، فاذكر في الإعلان أن الملف موجّه للمطابع.</li>
    <li><strong>كل ما هو مهم يجب سحبه إلى الداخل.</strong> اجعل النص وأرقام الصفحات ومربعات التأشير وخطوط القص على مسافة 10 إلى 12 مم من الحافة على الأقل. وما هو أقرب من ذلك يصبح قرعة على طابعة مجهولة.</li>
  </ul>

  <p>النصف الآخر من هذه المشكلة يسكن في نافذة الطباعة عند المشتري. معظم القارئات تختار افتراضياً «الملاءمة لمنطقة الطباعة»، وهو ما يصغّر الصفحة بنسب قليلة بصمت ويوسّطها. في المخطط لا يُلاحظ هذا. أما في أي شيء سيقصّه المشتري أو يجلّده، فهي مشكلة حقيقية، لذا أضف سطراً واحداً إلى تعليماتك: اطبع بنسبة 100 بالمئة، بالمقاس الفعلي، مع تعطيل التحجيم.</p>

  <h2>الخطوط: ضمّنها أو حوّلها إلى أشكال</h2>

  <p>أشهر عطل في الملفات هو خط لم يدخل إلى ملف PDF. على جهازك هو مثبَّت، فيبدو الملف صحيحاً. وعلى جهاز المشتري لا يجده القارئ فيستبدله بخط آخر، وهذا يعيد صبّ كل سطر ويهدم التنسيق الذي أمضيت فيه عطلة أسبوع كاملة.</p>

  <p>طريقتان للسلامة، بحسب الأفضلية:</p>

  <ul>
    <li><strong>ضمّن الخطوط عند التصدير.</strong> هذا الخيار موجود في كل برنامج تصميم جدي، وأدوات المتصفح تفعله تلقائياً. والتحقق سهل: افتح ملف PDF وانظر في خصائص المستند، هناك تبويب للخطوط، ويجب أن يكون مكتوباً أمام كل خط «مضمَّن» أو «مجموعة فرعية مضمَّنة».</li>
    <li><strong>حوّل النص إلى مسارات</strong> قبل التصدير. تصبح الحروف أشكالاً متجهة، فلا حاجة إلى أي خط. الطريقة محكمة ولا رجعة فيها، فاحفظ ملفاً أصلياً قابلاً للتحرير على حدة.</li>
  </ul>

  <p>اختبر الملف على جهاز لا تحتوي خطوطك، أو اطلب من أحدهم أن يفتحه. فتحه على حاسوبك لا يثبت شيئاً: حاسوبك هو المكان الوحيد الذي يُضمن فيه أن يعمل.</p>

  <h2>سطّح الملف، وكن صادقاً بشأن ما يمنحه ذلك</h2>

  <p>الطبقات وحقول النماذج والتعليقات وكائنات النص القابلة للتحرير كلها أشياء قد يزيحها المشتري دون قصد، وأشياء تجعل الملف أثقل من اللازم. <a href="/ar/pdf-edit/flatten/">تسطيح ملف PDF</a> يدمجها كلها في صفحة ثابتة واحدة. النتيجة تُفتح أسرع، وتُطبع بشكل أكثر قابلية للتوقع في القارئات الغريبة، ولا تنزلح بنقرة طائشة.</p>

  <p>ما لا يفعله التسطيح هو منع أحد من إعادة بيع عملك. وكلمة المرور لا تمنع ذلك أيضاً. من يقدر على طباعة صفحة يقدر على تصويرها، وملف PDF الذي يستطيع المشتري فتحه يستطيع أخذ لقطة شاشة له. التسطيح نظافة للملف، لا حماية لحقوق النشر. أما ما يمنعه فعلاً فهو الحادث اليومي: المشتري يجرّ مربع نص، ثم يسألك لماذا ملفك معطوب.</p>

  <p>وإذا أردت أيضاً كبح التحرير العابر، فإن <a href="/ar/pdf-security/protect/">أذونات PDF</a> تستطيع تقييد التحرير والنسخ مع إبقاء الملف مفتوحاً للقراءة والطباعة. تعامل معها كمطبّ سرعة. وفي مقالنا عن <a href="/ar/blog/password-protect-pdf-before-emailing/">ما تحميه كلمة مرور PDF فعلاً</a> يُفصّل الفرق بين نوعي كلمة المرور، ويستحق أن تعرفه قبل أن تعتمد على أي منهما.</p>

  <h2>حجم الملف: القيد الحقيقي هو 20 ميجابايت في Etsy</h2>

  <p>عند كتابة هذا المقال يقبل Etsy ملفات رقمية حتى 20 ميجابايت للملف الواحد، وبحد أقصى خمسة ملفات للإعلان. هذا الرقم، لا تصميمك، هو ما يحدد طريقة تجميع الحزمة. ثلاث نتائج عملية:</p>

  <ul>
    <li><strong>الحزمة متعددة المقاسات تتجاوز الخمسة ملفات بسرعة.</strong> أربعة مقاسات في ثلاث تنويعات لونية تساوي اثني عشر ملفاً. والجواب المعتاد هو ملف ZIP: الأرشيف يشغل خانة واحدة من الخمس، ويستطيع المشترون فكّه على أي نظام.</li>
    <li><strong>المخطط الثقيل ثقيل بسبب الصور.</strong> ملف PDF المكوّن من نص فقط وزنه لا يُذكر. وإذا كان مخطط من 40 صفحة بحجم 30 ميجابايت، فهناك خلفية بمقاس الصفحة كاملة أو ملمس يفعل ذلك.</li>
    <li><strong>اضغط في الخطوة الأخيرة، وافحص النتيجة على الورق.</strong> <a href="/ar/pdf-organize/compress/">ضاغط PDF</a> عندنا يبقي النص والرسوم المتجهة بجودة كاملة ويعيد ضغط الصور، وهذه مقايضة صحيحة تماماً لمخطط مليء بالنص وخاطئة تماماً للوحة جدارية فوتوغرافية. للأعمال الفنية اطبع صفحة قبل وبعد وانظر بعينك. وإذا لم تستطع النزول تحت الحد دون خسارة مرئية، فقسّم الإعلان.</li>
  </ul>

  <p>وإذا سلكت طريق الأرشيف وأردت إغلاق التنزيل نفسه، يمكنك <a href="/ar/archive/protect/">حماية ملف ZIP بكلمة مرور</a>، رغم أن ذلك في التنزيلات المدفوعة يولّد رسائل دعم أكثر مما يمنع.</p>

  <h2>المنتجات متعددة الصفحات تحتاج أرقام صفحات</h2>

  <p>أي منتج يطبعه المشتري كمجموعة، أي المخططات وكتب التدريب وحزم أوراق العمل، يحتاج أرقام صفحات. فبدونها لا يجد من طبع 40 صفحة ثم أوقع الرزمة أي طريقة لإعادة ترتيبها، وهذا يصبح مشكلتك أنت.</p>

  <p>أضفها في النهاية، بعد أن يصبح ترتيب الصفحات نهائياً، عبر <a href="/ar/pdf-edit/add-page-numbers/">إضافة أرقام الصفحات</a>. وأبقها داخل المنطقة الآمنة المذكورة أعلاه، لأن رقماً على 5 مم من الحافة هو أول ما تأكله الطابعة. ويغطي <a href="/ar/blog/add-page-numbers-to-pdf/">الشرح الكامل للترقيم</a> الموضع وبداية العد إذا احتجت تجاوز صفحة الغلاف.</p>

  <h2>معاينات الإعلان، لا المنتج نفسه</h2>

  <p>صور إعلانك يجب أن تُظهر المنتج دون أن تكون المنتج. صدّر صفحة كصورة عبر <a href="/ar/pdf-to-jpg/">PDF إلى JPG</a> للحصول على نموذج عرض نظيف، وإذا أردت إظهار صفحات داخلية من كتاب تدريب مدفوع، فمرّرها أولاً على <a href="/ar/pdf-edit/add-watermark/">إضافة علامة مائية</a>. ومقالنا عن <a href="/ar/blog/watermark-pdf-confidential-draft/">العلامة المائية على PDF</a> يتناول الموضع ودرجة الشفافية: في المعاينة تريدها مقروءة لكن ليست كثيفة إلى حد يمنع المشتري من تقييم التصميم.</p>

  <h2>قائمة التحقق من ثماني نقاط قبل الرفع</h2>

  <table>
    <thead>
      <tr><th>ما تتحقق منه</th><th>كيف تتحقق</th><th>ما يمنعه ذلك</th></tr>
    </thead>
    <tbody>
      <tr><td>مقاس صفحة واحد في كل الصفحات</td><td>افتح الملف وتأكد أن الأبعاد متطابقة في كل مكان</td><td>صفحة شاردة بمقاس مختلف تُطبع محجَّمة</td></tr>
      <tr><td>الخطوط مضمَّنة</td><td>خصائص المستند، تبويب الخطوط، الكل «مضمَّن»</td><td>استبدال الخط وانهيار التنسيق</td></tr>
      <tr><td>الصور بدقة 300 نقطة عند المقاس النهائي</td><td>اطبع صفحة وانظر إليها في ضوء جيد</td><td>عمل فني باهت ومبقّع</td></tr>
      <tr><td>المحتوى داخل هامش 10 إلى 12 مم</td><td>اطبع بنسبة 100 بالمئة وافحص الحواف الأربع</td><td>إطارات مقطوعة وأرقام صفحات مفقودة</td></tr>
      <tr><td>الملف مسطَّح</td><td>النقر على الصفحة لا يحدّد شيئاً ولا يجرّه</td><td>إزاحة المشتري للعناصر دون قصد</td></tr>
      <tr><td>الحجم داخل حد المنصة</td><td>انظر إلى حجم كل ملف، لا حجم الحزمة</td><td>رفض الرفع في أسوأ لحظة</td></tr>
      <tr><td>الترقيم في المجموعات متعددة الصفحات</td><td>تصفّح الملف المصدَّر</td><td>عجز المشتري عن ترتيب الرزمة المطبوعة</td></tr>
      <tr><td>يُفتح على جهاز ليس جهازك</td><td>هاتف، أو حاسوب أحد معارفك</td><td>كل مشاكل الخطوط والقارئات مرة واحدة</td></tr>
    </tbody>
  </table>

  <p>تنفيذ هذا مرة واحدة يأخذ عشر دقائق. وتنفيذه بعد طلب استرجاع يأخذ عشر دقائق زائد تقييماً لا تستطيع حذفه.</p>

  <h2>ماذا يحدث للملف الذي ترفعه</h2>

  <p>أدواتنا تعمل على الخادم، فالملف يُرفع. ويُحذف بمجرد انتهاء المهمة، ورابط التنزيل لك وحدك. لا شيء يُفهرس أو يُحفظ أو يُعاد استخدامه للتدريب. ومع منتج لم يُطلق بعد يبقى بعض البائعين غير مرتاحين، وهذا منطقي: مقالنا عن <a href="/ar/blog/is-convertica-safe-pdf-file-security-privacy-explained/">كيف تتعامل Convertica مع ملفاتك</a> يشرح قواعد الاحتفاظ لتقرر بنفسك.</p>

  <h2>أسئلة متكررة</h2>

  <h3>أبيع بمقاس A4 أم US Letter؟</h3>
  <p>أرسل المقاسين إن استطعت، وسمّهما بوضوح داخل التنزيل. وإذا اضطررت للاختيار، فاختر حسب مصدر زوارك: A4 لمعظم العالم، وUS Letter لمتجر موجّه إلى الولايات المتحدة وكندا. أما ما لا يجوز فهو أن ترسل مقاساً واحداً وتصمت عنه، لأن ذلك يتحول إلى طلب استرجاع من نصف العالم الذي يحمل الورق الآخر.</p>

  <h3>هل يحتاج الملف القابل للطباعة إلى هامش نزيف؟</h3>
  <p>للمنتج المطبوع في المنزل لا، وإضافته تزيد الأمر سوءاً عادة: التصميم بهامش نزيف يفترض القص بعد الطباعة، ومشتريك لا يملك مقصلة. صمّم على مقاس الصفحة بهامش آمن بدلاً من ذلك. هامش النزيف يهم فقط إذا كنت تبيع أيضاً نسخة للمطابع، وحينها يجب أن تكون ملفاً منفصلاً.</p>

  <h3>هل أستطيع منع المشترين من إعادة بيع ملفي؟</h3>
  <p>تقنياً لا. أي ملف يستطيع المشتري فتحه وطباعته يمكن نسخه. الأذونات وكلمات المرور تكبح التحرير العابر ولا شيء أكثر. الذي يعمل فعلاً هو التركيبة المملة: صفحة ترخيص داخل الملف تبيّن ما يجوز للمشتري وما لا يجوز، وآلية الإبلاغ في المنصة عندما تجد نسخة منسوخة.</p>

  <h3>مخططي بحجم 45 ميجابايت. ماذا أقص أولاً؟</h3>
  <p>ابحث عن الصور. خلفية بمقاس الصفحة كاملة، أو ملمس ورقي، أو غلاف فوتوغرافي، تفسّر الحجم كله في الغالب، واستبدال الملمس بلون مسطح أو نمط متجه هادئ قد يقلّص الملف أضعافاً. والضغط بعد ذلك فقط، مع فحص صفحة مطبوعة.</p>

  <h3>أرسل ملف PDF واحداً أم ZIP؟</h3>
  <p>ملف PDF واحد إذا كان المنتج شيئاً واحداً بمقاس واحد، لأن كل خطوة إضافية تخسر المشترين الذين يفتحون التنزيل من الهاتف. وملف ZIP بمجرد أن تصبح لديك عدة مقاسات أو تنويعات لونية، لأنه يبقيك داخل حد الخمسة ملفات وينظّم الأسماء. وإذا جمّعت، فسمِّ الملفات بشكل مفهوم خارج السياق: مقالنا عن <a href="/ar/blog/pdf-naming-conventions-best-practices/">تسمية الملفات</a> مكتوب للمستندات، لكنه ينطبق حرفياً هنا.</p>

  <h3>هل يقلّل التسطيح جودة الطباعة؟</h3>
  <p>لا. التسطيح يدمج الطبقات والعناصر التفاعلية في محتوى صفحة ثابت؛ وهو لا يعيد تشكيل الصور ولا يغيّر الدقة. الذي قد يكلّف جودة هو الضغط، وذاك قرار منفصل.</p>

  <h2>جهّز الملف</h2>

  <p>خذ المنتج الأقرب إلى النشر ومرّره على النقاط الثماني الآن، قبل كتابة الوصف. معظم الملفات تحتاج تعديلين: <a href="/ar/pdf-edit/flatten/">التسطيح</a> و، في المجموعات متعددة الصفحات، <a href="/ar/pdf-edit/add-page-numbers/">أرقام الصفحات</a>. واضغط فقط إذا أجبرتك المنصة، عبر <a href="/ar/pdf-organize/compress/">ضاغط PDF</a>، ومع صفحة مطبوعة أمامك قبل أن تثق بالنتيجة. وما تبقى موجود في <a href="/ar/all-tools/">كل الأدوات</a>.</p>
