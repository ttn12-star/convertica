content_ar: |
  قلّما يقرأ أحد عن PDF/A بدافع الفضول. التعرف عليه يحدث عادة في لحظة غير سارة: نموذج الرفع يعيد الملف ويكتب أن المقبول هو المستندات بصيغة الأرشفة فقط. وأكثر ما يزعج في الأمر أن ملف PDF لديك ليس معطوبا. يفتح ويطبع، وظل يسافر عبر البريد سنوات دون شكوى. لكنه ببساطة يخالف قواعد لم تكن تعرف أنها موجودة.

  إليك ما هي هذه القواعد، ومن الذي احتاج إليها، وأقصر طريق من الملف الذي بين يديك إلى الملف الذي سيُقبل.

  <h2>PDF/A ليس صيغة مختلفة</h2>

  <p>أول ما ينبغي فهمه: ملف PDF/A هو ملف PDF. الامتداد نفسه، والبرامج نفسها، والنقر المزدوج نفسه. ما يجعله أرشيفيا هو التزامه بمجموعة قواعد أشد صرامة، منشورة في المعيار الدولي ISO 19005. وفي ممارسات الأرشفة الإلكترونية هذه هي الصيغة المعتمدة للوثائق التي يجب أن تبقى محفوظة عقودا.</p>

  <p>لكل هذه القواعد هدف واحد: أن يظهر المستند بعد عشرين سنة كما هو تماما، على حاسوب لم يصممه أحد بعد، وبلا اتصال بالإنترنت.</p>

  <p>وهذا يستبعد كل ما يعتمد على العالم الخارجي. ملف PDF العادي يحق له أن يكتب "اعرض هذه الفقرة بخط Helvetica" ويثق بأن الخط مثبت على جهاز القارئ. في عام 2045 قد لا يكون موجودا، فيعاد صف النص بخط آخر ويختل الإخراج كله. وملف PDF العادي يستطيع جلب صورة من رابط، وتشغيل برنامج نصي، وتشغيل مقطع فيديو. كل ذلك تبعيات، والتبعيات تتعفن مع الوقت.</p>

  <h2>ماذا يشترط المعيار بالضبط</h2>

  <ul>
    <li><strong>تضمين كل الخطوط داخل الملف.</strong> أشكال الحروف تسافر داخل المستند نفسه، فيظهر النص متطابقا سواء كان الخط مثبتا على الجهاز أم لا. وهذا يهم النصوص العربية بوجه خاص، لأن استبدال الخط يفسد التشكيل وتشابك الحروف.</li>
    <li><strong>وصف اللون بصورة مستقلة عن الجهاز.</strong> يحمل الملف ملف تعريف ألوان ICC يخبر أي برنامج مستقبلي بدقة ما تعنيه درجة لونية بعينها، بدل ترك الأمر للشاشة.</li>
    <li><strong>لا تشفير.</strong> ملف PDF محمي بكلمة مرور لا يمكن أن يكون PDF/A. الأرشيف الذي لا يُفتح دون كلمة مرور لم يعد أحد يذكرها ليس أرشيفا.</li>
    <li><strong>لا برمجة نصية ولا صوت ولا فيديو ولا تشغيل برامج.</strong> كل ما هو قابل للتنفيذ وكل ما يجري عبر الزمن ممنوع.</li>
    <li><strong>لا مراجع خارجية.</strong> الصور والخطوط والمحتوى كلها داخل الملف، ولا يُجلب شيء عند الفتح.</li>
    <li><strong>بيانات وصفية موحدة.</strong> يحمل الملف بيانات XMP تعلن أي جزء من المعيار وأي مستوى يدّعي مطابقته، حتى يفحصه المدقق بالقواعد الصحيحة.</li>
  </ul>

  <p>لاحظ ما ليس في القائمة: حجم الملف، وعدد الصفحات، وجودة الصور، وإمكانية البحث في النص. المعيار معني بالديمومة، لا بالخفة ولا بالترتيب.</p>

  <h2>أي إصدار تحتاج: PDF/A-1 أم 2 أم 3</h2>

  <p>للمعيار ثلاثة أجزاء يكمل بعضها بعضا ولا تتنافس. الأحدث هنا ليس أفضل تلقائيا، لأن المهم هو ما تطلبه الجهة المستقبِلة.</p>

  <ul>
    <li><strong>PDF/A-1</strong> (2005) هو الأشد والأوسع قبولا. يقوم على PDF 1.4 القديم ويمنع الشفافية والطبقات، ولذلك قد يبدو المستند ذو التصميم الحديث مسطحا بوضوح بعد التحويل. وإذا حددت جهة رسمية إصدارا بعينه فغالبا يكون هذا.</li>
    <li><strong>PDF/A-2</strong> (2011) يقوم على PDF 1.7. يسمح بالشفافية والطبقات وضغط JPEG 2000، ويتيح تضمين ملفات PDF/A أخرى داخله. وهو الخيار الافتراضي المعقول لمعظم الحالات: ضمانات الحفظ نفسها، واحتمال تغير شكل المستند أقل بكثير.</li>
    <li><strong>PDF/A-3</strong> (2012) هو PDF/A-2 مع فارق مهم واحد: يمكن تضمين <em>أي</em> ملف بداخله لا ملفات PDF/A فحسب. على هذا تقوم معايير الفوترة الإلكترونية، حيث يوضع ملف XML الذي تقرأه الآلة داخل مستند يقرأه الإنسان. وإن لم تكن لديك هذه الحاجة فلا حاجة لك بالجزء الثالث.</li>
  </ul>

  <h3>الحرف الذي يلي الرقم</h3>

  <p>تُكتب المستويات هكذا: 1b و2b و2u و2a. والحرف يدل على مقدار البنية التي يحملها الملف:</p>

  <ul>
    <li><strong>b (أساسي)</strong> يضمن إعادة الإظهار البصري. ستبدو الصفحة صحيحة دائما. وهذا ما تعنيه الغالبية العظمى من المتطلبات.</li>
    <li><strong>u (يونيكود)</strong> يضيف ضمانا بأن النص كله مرتبط بيونيكود ارتباطا صحيحا، فيمكن استخراجه والبحث فيه بثقة.</li>
    <li><strong>a (متاح للجميع)</strong> يضيف الوسم الكامل: ترتيب القراءة، والبنية، والنص البديل للصور. هذا ما تطلبه تشريعات إتاحة المحتوى، ولا يستطيع أي محول أن يستخرجه من صورة ممسوحة مسطحة. المستوى a الحقيقي يأتي من مستند مصدر موسوم جيدا، لا من خطوة تحويل.</li>
  </ul>

  <p>إن لم يحدد لك أحد المستوى فاختر <strong>PDF/A-2b</strong>. يلبي الشرط المعتاد "يجب أن يكون PDF/A" بأقل تدخل في شكل المستند.</p>

  <h2>من الذي يطلبه عمليا</h2>

  <ul>
    <li><strong>الجامعات والمستودعات البحثية.</strong> بوابات إيداع الرسائل والأطروحات تطلب صيغة الأرشفة كثيرا حتى يبقى العمل مقروءا بعد عقود من المناقشة.</li>
    <li><strong>الجهات الحكومية والخدمات الإلكترونية.</strong> قواعد حفظ الوثائق الإلكترونية لمدد طويلة تشير إلى الصيغة الأرشيفية. وإن قدمت شيئا إلكترونيا إلى جهة رسمية فستصادفه عاجلا أو آجلا.</li>
    <li><strong>المحاكم وأنظمة إيداع المذكرات.</strong> بوابات التقاضي الإلكتروني تشترط الصيغة الأرشيفية في قواعد الإيداع بصورة متزايدة.</li>
    <li><strong>إدارة المحفوظات والتدقيق.</strong> أينما نصت سياسة الحفظ على "تحتفظ سبع سنوات" سيسأل أحدهم يوما ما عن الضمان الذي يحقق ذلك.</li>
    <li><strong>الفوترة الإلكترونية.</strong> وهنا تحديدا يدخل PDF/A-3، ببيانات الفاتورة المهيكلة مضمّنة داخل مستند مقروء.</li>
  </ul>

  <h2>كيف تحوّل ملف PDF إلى PDF/A</h2>

  <p>التحويل نفسه سريع. ما تطلبه في جوهره أن يضمّن البرنامج كل ما كان يُجلب من الخارج، ويرفق ملف تعريف الألوان، وينظف الممنوعات، ويكتب البيانات الوصفية التي تعلن مطابقة النتيجة.</p>

  <ol>
    <li>افتح <a href="/ar/pdf-to-pdfa/">محول PDF إلى PDF/A</a> وارفع ملفك.</li>
    <li>اختر مستوى المطابقة. المتاح PDF/A-1b و2b و3b. خذ 2b ما لم يُطلب منك غير ذلك.</li>
    <li>شغّل التحويل ونزّل النتيجة.</li>
    <li>افتح الملف وراجعه. التحويل قد يغير الشكل، وثلاثون ثانية من الانتباه قبل تقديمه في أي مكان تستحق العناء.</li>
  </ol>

  <p>هناك أمر يُحسم قبل ذلك: إن كان على ملفك كلمة مرور فأزلها قبل التحويل، لأن التشفير والأرشفة لا يجتمعان. الطريقة موضحة في دليل <a href="/ar/blog/unlock-pdf-remove-password/">إزالة كلمة مرور من ملف تملكه</a>، وكلمة "تملكه" أساسية هنا لأنك تحتاج إلى معرفة كلمة المرور.</p>

  <h2>كيف تتأكد أن الملف PDF/A فعلا</h2>

  <p>الملف الذي يدّعي المطابقة فقط قليل النفع إذا خالفه النظام المستقبِل. التحقق يجري على ثلاثة مستويات، وينبغي أن يتناسب عمقه مع حجم المخاطرة.</p>

  <ul>
    <li><strong>افتحه في أي قارئ PDF.</strong> معظم البرامج تعرض شريطا في الأعلى يفيد بأن المستند في وضع PDF/A. لا شريط يعني لا إعلان مطابقة.</li>
    <li><strong>انظر في خصائص المستند.</strong> ستجد في البيانات الوصفية جزء المعيار والمستوى اللذين يدّعيهما الملف.</li>
    <li><strong>شغّل مدققا حقيقيا.</strong> برنامج veraPDF هو التطبيق المرجعي المجاني مفتوح المصدر. مع رسالة علمية أو مذكرة قضائية شغّله مرة واحدة. يستغرق دقيقة، وهو الفحص نفسه الذي يُرجح أن يجريه النظام في الطرف الآخر.</li>
  </ul>

  <p>محولنا يفحص النتيجة بنيويا قبل تسليمها إليك: يتأكد من وجود ملف تعريف الألوان ومن تطابق المستوى المعلن مع الذي طلبته. هذا يلتقط التحويل الفاشل، لكنه ليس تدقيقا كاملا وفق ISO 19005. أما المستندات ذات الأثر القانوني فمرور واحد عبر veraPDF يجعل نومك أهنأ.</p>

  <h2>حين يغير التحويل مستندك</h2>

  <ul>
    <li><strong>تسطحت الشفافية.</strong> التحويل إلى PDF/A-1b يزيل الشفافية لأن PDF 1.4 لا يعرفها. الظلال الناعمة والتوهجات والطبقات نصف الشفافة تُخبز في بكسلات معتمة. إن كان في مستندك تصميم حديث فاستعمل 2b وتختفي المشكلة.</li>
    <li><strong>استُبدل خط.</strong> إذا كان الملف الأصلي يشير إلى خط دون تضمينه فالمحول مضطر إلى تضمين شيء ما، فيختار الأقرب شبها. قد تتزحزح المسافات ومواضع نهايات الأسطر، والأثر أوضح في النصوص العربية. العلاج عند المنبع: صدّر المستند الأصلي مرة أخرى مع تضمين الخطوط.</li>
    <li><strong>كبر حجم الملف.</strong> هذا متوقع وليس عطلا. الخطوط المضمّنة وملف الألوان يشغلان مساحة حقيقية. إن أزعجك الحجم فمرر النتيجة على <a href="/ar/pdf-organize/compress/">ضغط PDF</a> ثم أعد التحقق، لأن الضغط العنيف قد ينقض المطابقة.</li>
    <li><strong>اختفت العناصر التفاعلية.</strong> حقول النماذج والبرامج النصية والوسائط ليست محتوى أرشيفيا. إن أردت الاحتفاظ بالقيم المعبأة فسطّح النموذج قبل التحويل حتى تصير الإجابات جزءا من الصفحة.</li>
    <li><strong>لم يبدأ التحويل أصلا.</strong> السبب في الغالب هو التشفير. أزل كلمة المرور وأعد المحاولة.</li>
  </ul>

  <h2>ما لا يفعله PDF/A</h2>

  <ul>
    <li><strong>ليس توقيعا ولا دليل أصالة.</strong> المعيار يعد بأن الملف سيظهر كما هو مستقبلا، ولا يقول شيئا عمن أنشأه ولا عما إذا كان أحد قد عدّله. لذلك تحتاج إلى <a href="/ar/pdf-edit/sign/">توقيع المستند</a>.</li>
    <li><strong>ليس حماية.</strong> بل العكس: التشفير ممنوع. وإذا لزم أرشفة المستند وحمايته معا فهاتان نسختان منفصلتان لمهمتين منفصلتين.</li>
    <li><strong>لا يجعل الصورة الممسوحة قابلة للبحث.</strong> صفحة ممسوحة محوَّلة إلى PDF/A-1b هي ملف أرشيفي سليم يحتوي صورة لنص. وإن أردت الكلمات فالتعرف الضوئي أولا. الفرق يشرحه مقال <a href="/ar/blog/pdf-to-word-vs-ocr-which-to-use/">متى تستخدم OCR ومتى التحويل المباشر</a>.</li>
    <li><strong>لا يحسّن الجودة.</strong> صورة ممسوحة ضبابية مؤرشفة بإتقان تبقى صورة ضبابية إلى الأبد.</li>
  </ul>

  <h2>أسئلة شائعة</h2>

  <h3>هل أستطيع إعادة ملف PDF/A إلى PDF عادي؟</h3>
  <p>لا حاجة إلى ذلك. ملف PDF/A هو أصلا ملف PDF صالح ويفتح في كل مكان. وإن حررته فغالبا تسقط مطابقته، ولا بأس بذلك ما دمت تحتفظ بالنسخة المؤرشفة سليمة وتعيد التحويل بعد التعديل.</p>

  <h3>هل PDF/A-3 أفضل من PDF/A-2 لأن الرقم أكبر؟</h3>
  <p>لا. الفارق الوحيد المهم لمعظم الناس أن الجزء الثالث يسمح بتضمين ملفات أيا كان نوعها. وبعض الأرشيفات تكره ذلك تحديدا، لأن جدول بيانات مضمّنا يصبح تبعية لا أحد يضمن قابليتها للقراءة مستقبلا. اختر الإصدار المطلوب منك، وإن لم يُطلب فاختر 2b.</p>

  <h3>لماذا تم تحويل الملف الممسوح لكن البحث في نصه ما زال متعذرا؟</h3>
  <p>لأن المسح صورة، وأرشفة الصورة تحفظ الصورة. شغّل أولا <a href="/ar/image/to-text/">استخراج النص من الصورة</a> أو <a href="/ar/scanned-pdf-to-word/">تحويل PDF الممسوح إلى Word</a>، ثم حوّل الناتج إلى صيغة الأرشفة.</p>

  <h3>هل أحتاج PDF/A لمستندات العمل الاعتيادية؟</h3>
  <p>غالبا لا. الفاتورة التي ترسلها وتنساها يكفيها PDF عادي. صيغة الأرشفة تستحق عناءها حين يلزم أن يعبر المستند مدة حفظ نظامية أو إجراء قضائيا أو مستودعا مؤسسيا، أو حين يطلبها أحدهم صراحة.</p>

  <h3>هل يمنع PDF/A تعديل الملف؟</h3>
  <p>لا. ليس للقراءة فقط وليس مقفلا. أي شخص لديه محرر يستطيع تغييره كأي ملف PDF. ما يضمنه المعيار هو أمانة العرض عبر الزمن، لا ثبات المحتوى.</p>

  <h3>وماذا لو رُفض الملف رغم ذلك؟</h3>
  <p>افحص ثلاثة أمور بالترتيب: هل كان المطلوب جزءا ومستوى بعينهما مثل 1b بدل 2b، وهل بقيت كلمة المرور على الملف، وماذا يقول المدقق عن الأخطاء الفعلية. عمليا يفسر الأمر الأول معظم حالات الرفض.</p>

  <h2>حوّل ملفك</h2>

  <p>إن كان هناك نموذج ينتظر النسخة الأرشيفية، فإن <a href="/ar/pdf-to-pdfa/">محول PDF إلى PDF/A</a> يدعم المستويات 1b و2b و3b ويفحص نتيجته بنفسه قبل التنزيل. وهو جزء من Convertica Premium مع بقية <a href="/ar/premium-tools/">أدوات النسخة المدفوعة</a>. أما تجهيز الملف فمجاني: <a href="/ar/pdf-security/unlock/">إزالة كلمة المرور</a> و<a href="/ar/pdf-organize/compress/">الضغط</a> و<a href="/ar/pdf-organize/merge/">دمج الصفحات في مستند واحد</a>، وبقية الأدوات في <a href="/ar/all-tools/">القائمة الكاملة</a>.</p>
