content_ar: |
  عاجلاً أو آجلاً يسأل كل بائع ملف رقمي السؤال نفسه، عادة بعد أن يجد مخططه على موقع شخص آخر: كيف أمنع الناس من تعديل هذا، وكيف أمنعهم من إعادة بيعه؟

  الجواب الصادق غير مريح لكنه مفيد. بعض الحمايات تعمل فعلاً، وما تحلّه مشكلة حقيقية ليست السرقة. وأخرى تبدو حماية وهي أقرب إلى طلب مؤدب. ولا شيء إطلاقاً في صيغة PDF يوقف شخصاً بزرّ لقطة الشاشة إذا صمّم. وفصل هذه الأكوام الثلاثة يوفّر عليك عطلة أسبوع تُهدر في إجراءات لا تحمي شيئاً، ويدلّك على الحصة القليلة التي تستحق.

  <h2>نوعا كلمة المرور في PDF ولماذا يهم الفرق</h2>

  <p>يدعم PDF منذ عقود كلمتي مرور مختلفتين تماماً، ومعظم الالتباس حول الحماية ينبع من التعامل معهما كشيء واحد.</p>

  <table>
    <thead>
      <tr><th></th><th>كلمة مرور الفتح</th><th>كلمة مرور المالك</th></tr>
    </thead>
    <tbody>
      <tr><td>تسمّى أيضاً</td><td>كلمة مرور المستند، user password</td><td>كلمة مرور الأذونات، الكلمة الرئيسية</td></tr>
      <tr><td>ماذا تفعل</td><td>تشفّر الملف. بدونها لا يمكن قراءة المحتوى إطلاقاً</td><td>تكتب رايات تطلب من القارئ تقييد الطباعة أو النسخ أو التعديل</td></tr>
      <tr><td>من يفرضها</td><td>الرياضيات</td><td>حسن نية برنامج القراءة</td></tr>
      <tr><td>تصلح لـ</td><td>إرسال مستند سري إلى مستلم واحد</td><td>ردع التعديل العابر على ملف يُقصد أن يُقرأ</td></tr>
      <tr><td>تصلح لتنزيل مدفوع</td><td>لا. على المشتري أن يفتحه</td><td>بالكاد، كمطبّ سرعة</td></tr>
    </tbody>
  </table>

  <p>الصف الأخير هو المهم هنا. كلمة مرور الفتح تشفير حقيقي، لكن لا يمكن استخدامها على منتج: مشتريك يجب أن يفتح الملف، فسيلزمك إعطاؤه الكلمة، وحينها انتهت الحماية. ومقالنا عن <a href="/ar/blog/password-protect-pdf-before-emailing/">ما تحميه كلمة مرور PDF فعلاً</a> يتوسع في النوعين إذا كنت ترسل مستندات سرية أيضاً.</p>

  <p>كلمة مرور المالك هي ما يقصده الناس بعبارة «منع التعديل». تكتب رايات أذونات في الملف، وكل قارئ حسن السلوك يحترمها. وعبارة «حسن السلوك» تحمل الجملة كلها. الرايات ليست تشفيراً للمحتوى؛ إنها ورقة ملحقة به. والقارئات التي تقرر تجاهل الورقة تُوجد في لمح البصر، ولهذا فإن <a href="/ar/blog/unlock-pdf-remove-password/">إزالة قيود PDF</a> موجودة وتعمل.</p>

  <h2>ما تمنحك الأذونات فعلاً</h2>

  <p>إذن هل الأذونات بلا قيمة؟ لا، لكن قيمتها غير التي يتوقعها معظم الناس. <a href="/ar/pdf-security/protect/">ضبط أذونات PDF</a> يحقق ثلاثة أمور بشكل موثوق:</p>

  <ul>
    <li><strong>يوقف الحادث العادي.</strong> المشتري الذي يفتح مخططك، ينقر في مكان ما، يجرّ مربع نص 3 مم ثم يراسلك ليسأل لماذا ملفك معطوب. هذه تكلفة دعم حقيقية ومتكررة.</li>
    <li><strong>يثبّت النية.</strong> من أزال قيداً فقد تجاوز شيئاً وهو يعلم. وفي أي نزاع، هذا موقف مختلف جوهرياً عن «كان الملف مفتوحاً فافترضت أنه يجوز».</li>
    <li><strong>يغربل المتكاسلين.</strong> معظم من كان سيعيد استخدام الملف بلا تفكير لن يذهب باحثاً عن أداة. نسبة أصغر مما تتمنى، لكنها ليست صفراً.</li>
  </ul>

  <p>وما لا تفعله هو حماية المحتوى. من يقدر على قراءة الملف يقدر على تصويره، ومن يقدر على طباعته يقدر على طباعته إلى ملف PDF جديد. تعامل مع الأذونات كمطبّ سرعة، وقدّر جهدك عليها بحسب ذلك، ولا تقل لمشتر أبداً إن الملف «لا يمكن» نسخه.</p>

  <h2>التسطيح: الحماية التي تُستخدم فعلاً</h2>

  <p>إذا كنت ستفعل شيئاً واحداً بالملف قبل بيعه، <a href="/ar/pdf-edit/flatten/">فسطّحه</a>. الطبقات وحقول النماذج والتعليقات وكائنات النص الحيّة كلها أشياء يمكن للمشتري إزاحتها. التسطيح يدمجها في محتوى صفحة ثابت، والنتيجة تُفتح أسرع وتُطبع بشكل أكثر قابلية للتوقع في القارئات الغريبة التي يستخدمها الناس فعلاً.</p>

  <p>لكن كن دقيقاً في تسمية ما هو. التسطيح نظافة للملف لا حماية لحقوق النشر. يمنع الحادث لا النسخة. ولا يقلّل جودة الطباعة: يدمج الطبقات والعناصر التفاعلية دون إعادة تشكيل الصور، فلا شيء يفقد حدّته. الذي قد يكلّف جودة هو الضغط، وذاك قرار منفصل.</p>

  <p>تحفّظ واحد يستحق المعرفة: إذا كان منتجك يُقصد تعبئته على الشاشة، مخطط قابل للتعبئة أو نموذج، فلا تسطّحه. ستكون قد أزلت الميزة نفسها. بِع النسخة القابلة للتعبئة كما هي، وإذا كنت تقدّم نسخة للطباعة أيضاً فسطّح تلك.</p>

  <h2>العلامات المائية: مفيدة في المعاينات، محرجة على المنتج</h2>

  <p>العلامة المائية هي الإجراء الوحيد الذي تتوقف قيمته كلياً على الملف الذي حلّت عليه.</p>

  <ul>
    <li><strong>على صفحات المعاينة هي في موضعها تماماً.</strong> اعرض صفحتين داخليتين من كتاب تدريب بعلامة مقروءة فوقهما فتحصل على الفائدة التسويقية دون تسليم المنتج. <a href="/ar/pdf-edit/add-watermark/">إضافة علامة مائية</a> تأخذ دقيقة، ومقالنا عن <a href="/ar/blog/watermark-pdf-confidential-draft/">الموضع ودرجة الشفافية</a> يشرح كيف تجعلها مقروءة دون دفن التصميم.</li>
    <li><strong>على الملف المدفوع فكّر مرتين.</strong> علامة ظاهرة على منتج دُفع ثمنه تُقرأ كعدم ثقة، وتفسد لوحة كان المشتري ينوي تعليقها. والبائعون الذين يفعلون هذا يُكتب لهم عنه في التقييمات.</li>
    <li><strong>العلامة الشخصية أداة أخرى.</strong> ختم اسم المشتري أو رقم طلبه على نسخته يردع المشاركة فعلاً، لأن الملف المسرَّب يشير إلى شخص. لكنه يتطلب توليد ملف لكل طلب، أي نظام تسليم لا مربع اختيار. يستحق في الملفات الغالية، ومبالغة في مخطط بثلاثة دولارات.</li>
  </ul>

  <h2>ما يقلّل إعادة البيع فعلاً</h2>

  <p>لا أحد من الإجراءات التقنية أعلاه يوقف إعادة البيع. أما هذه فتقلّلها، بقدر ما يستطيع أي شيء:</p>

  <ol>
    <li><strong>صفحة ترخيص داخل الملف.</strong> صفحة واحدة بلغة واضحة: ما يجوز للمشتري، وما لا يجوز، وهل الاستخدام التجاري مشمول، وكيف يتصل بك. هذا أعلى ما في القائمة قيمة. يحلّ الالتباس الصادق، وهو معظم المشكلة، وهو المستند الذي تشير إليه عند الإبلاغ عن نسخة.</li>
    <li><strong>اسمك وعنوان متجرك في التذييل.</strong> ليس كحماية بل كنسبة. ملف يدور باسمك تسويق لم تدفع ثمنه، ويجعل المنشأ واضحاً.</li>
    <li><strong>آلية الإبلاغ في المنصة.</strong> المنصات تُنزل الإعلانات المنتهكة فعلاً، وتتحرك أسرع عندما تستطيع إظهار تاريخ إعلانك وشروط الترخيص. غير لمّاع وفعّال.</li>
    <li><strong>جعل النسخة أقل جاذبية من الأصل.</strong> تحديثات مجانية، سجل إصدارات، مقاسات إضافية، دعم. الملف المقرصن لقطة ثابتة، والمنتج الحيّ ليس كذلك.</li>
  </ol>

  <p>وهناك نقطة استراتيجية يسهل تفويتها وأنت غاضب. من يعيد توزيع ملف رقمي رخيص لم يكن في الغالب سيشتريه أصلاً، والجهد الذي تصرفه في محاربته جهد لم يذهب إلى الإعلان أو الصور أو المنتج القادم. خصّص للحماية حصة صغيرة ثابتة وامضِ.</p>

  <h2>وماذا عن DRM الحقيقي؟</h2>

  <p>الـ DRM الحقيقي، حيث يتصل الملف بالخادم ويمكن إبطاله، موجود ويُستخدم للمواد المؤسسية والأكاديمية الغالية. يتطلب منصة وخادم تراخيص وقارئاً يجب على المشتري تثبيته. أما لملف قابل للطباعة أو قالب أو كتاب تدريب فهو يسقط بمنطقه ذاته: مشتريك يريد طباعته على طابعة منزلية، وأي صيغة تسمح بالطباعة تسمح بالاحتفاظ. لا تبحث عن إضافة تَعِد بغير ذلك.</p>

  <h2>افتراضي معقول</h2>

  <table>
    <thead>
      <tr><th>المنتج</th><th>ما تفعله</th></tr>
    </thead>
    <tbody>
      <tr><td>مخطط أو لوحة أو ورقة عمل للطباعة</td><td>تسطيح، صفحة ترخيص، نسبة في التذييل. تجاوز كلمات المرور</td></tr>
      <tr><td>نموذج قابل للتعبئة أو مخطط رقمي</td><td>لا تسطّح. صفحة ترخيص وأذونات ضد التغييرات البنيوية</td></tr>
      <tr><td>صفحات معاينة للإعلان</td><td>علامة مائية، دقة منخفضة، صفحات قليلة فقط</td></tr>
      <tr><td>قالب غالٍ أو كتاب تدريب لدورة</td><td>فكّر في التخصيص لكل طلب، واحسب كلفة التسليم</td></tr>
      <tr><td>مستند عميل سري</td><td>كلمة مرور فتح، مُرسلة بقناة منفصلة. الحالة الوحيدة التي يكون التشفير فيها الجواب الصحيح</td></tr>
    </tbody>
  </table>

  <p>وإذا كنت تجهّز ملفاً للبيع أول مرة، فبقية العمل قبل الرفع أهم من الحماية: مقاس الصفحة والدقة والخطوط المضمَّنة والحجم هي ما يولّد طلبات الاسترجاع. ودليلنا عن <a href="/ar/blog/sell-printable-pdf-on-etsy/">تجهيز ملف PDF قابل للطباعة للبيع</a> يمشي على القائمة كاملة، و<a href="/ar/blog/a4-vs-us-letter-printable-sizes/">الاختيار بين A4 وUS Letter</a> يحسم قرار المقاس الذي يسبّب أكثر الشكاوى.</p>

  <h2>ماذا يحدث للملف الذي ترفعه</h2>

  <p>أدواتنا تعمل على الخادم، فالملف يُرفع. ويُحذف بمجرد انتهاء المهمة، ورابط التنزيل لك وحدك. لا شيء يُفهرس أو يُحفظ أو يُعاد استخدامه للتدريب. وإذا كنت تحمي شيئاً لم يُطلق بعد، فمقالنا عن <a href="/ar/blog/is-convertica-safe-pdf-file-security-privacy-explained/">كيف تتعامل Convertica مع ملفاتك</a> يبيّن قواعد الاحتفاظ.</p>

  <h2>أسئلة متكررة</h2>

  <h3>هل أستطيع جعل ملف PDF غير قابل للتعديل تماماً؟</h3>
  <p>تستطيع جعل التعديل مزعجاً، وهذا يستحق، ولا تستطيع جعله مستحيلاً. التسطيح يزيل المقابض السهلة، والأذونات تضيف راية يحترمها معظم القارئات. ومن صمّم يستطيع رَستَرة الصفحات أو إعادة كتابة النص أو إزالة القيود بأداة. استهدف «لا حوادث ولا استخدام عابر» فستصل؛ واستهدف «مستحيل» فستخسر عطلة الأسبوع.</p>

  <h3>هل توقف كلمة المرور من يشارك منتجي؟</h3>
  <p>لا، وتخلق مشكلة جديدة. كلمة مرور الفتح سيلزم إعطاؤها لكل مشتر، وبعدها تصبح عامة وتكون قد أضفت عبء دعم بلا مقابل. وكلمة مرور المالك لا تقيّد الفتح إطلاقاً. مكان كلمات المرور المستندات السرية بمستلم معروف، لا المنتجات.</p>

  <h3>هل من القانوني أن يزيل أحدهم قيود ملفي؟</h3>
  <p>إزالة القيود من ملف يملكه لاستخدامه الشخصي أمر عادي غالباً. أما فعل ذلك لتوزيع عملك أو إعادة بيعه فهو انتهاك لحقوق النشر في معظم الأنظمة القانونية بغضّ النظر عن طريقة حماية الملف، ولهذا تحديداً تفوق صفحة الترخيص وآلية الإبلاغ الرايات أهمية.</p>

  <h3>هل أضع علامة مائية على الملف الذي دفع المشتري ثمنه؟</h3>
  <p>عموماً لا. فهي تشير إلى عدم ثقة وتفسد كل ما كان يُقصد عرضه. الاستثناءان هما صفحات المعاينة، حيث العلامة المائية هي الأداة الصحيحة تماماً، والملفات عالية القيمة حيث تختم على كل نسخة بيانات مشتريها ليكون التسريب قابلاً للتتبع.</p>

  <h3>هل يفقد التسطيح جودة أو يعطّل شيئاً؟</h3>
  <p>لا يعيد تشكيل الصور ولا يغيّر الدقة، فجودة الطباعة لا تتأثر. أما ما يعطّله بقصد فهو التفاعلية: حقول النماذج تتوقف عن التعبئة والتعليقات تتوقف عن التعديل. احفظ نسخة أصلية قابلة للتحرير، ولا تسطّح منتجاً قيمته أنه يُعبَّأ.</p>

  <h3>ماذا يجب أن تقول صفحة الترخيص فعلاً؟</h3>
  <p>صفحة واحدة بلغة واضحة: هذا الملف لاستخدام المشتري الشخصي؛ يجوز طبعه لنفسه بأي عدد؛ ولا يجوز إعادة بيعه أو توزيعه أو استخدامه تجارياً دون ترخيص منفصل؛ وهذه طريقة التواصل للحصول على ذلك الترخيص. تسمية الاستخدامات المسموحة صراحة تمنع سوء استخدام أكثر من أي إجراء تقني، لأن معظم سوء الاستخدام شكّ صادق.</p>

  <h2>احمِ الملف ثم امضِ</h2>

  <p>خذ المنتج الذي ستعرضه، ومرّره على <a href="/ar/pdf-edit/flatten/">التسطيح</a>، وأضف صفحة ترخيص واسم متجرك في التذييل، وتوقف عند ذلك. وإذا احتجت <a href="/ar/pdf-security/protect/">الأذونات</a> أيضاً فأضفها وأنت تعرف قيمتها. ثم أنفق بقية اليوم على الإعلان، فهو سيجني أكثر من أي قفل. وما تبقى موجود في <a href="/ar/all-tools/">كل الأدوات</a>.</p>
