excerpt_ar: "كل من يبيع منتجات رقمية يسأل في النهاية كيف يمنع المشتري من تعديل الملف أو إعادة بيعه. الجواب الصادق نصفان: بعض الإجراءات تمنع فعلاً الضرر العارض والتعديل غير المقصود، ولا شيء يمنع نسخة يريدها صاحبها. معرفة الفرق توفّر عليك دفع ثمن مسرحية DRM وتدلّك على الإجراءات التي تقلّل الخسارة حقاً."
