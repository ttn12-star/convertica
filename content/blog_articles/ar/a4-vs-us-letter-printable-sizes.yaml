  target_audience: "المصممون وبائعو المنتجات الرقمية القابلة للطباعة، وكل من يجهّز مستنداً سيُطبع في أكثر من بلد، ويحتاج الاختيار بين A4 وUS Letter ويريد تسليم المقاسين دون إعادة تصميم ولا قص."
content_ar: |
  خلف عدد مدهش من التقييمات بنجمة واحدة على المنتجات القابلة للطباعة يقف حساب بسيط. مقاس A4 هو 210 في 297 مم. ومقاس US Letter هو 215.9 في 279.4 مم. أي أن Letter أعرض بنحو 6 مم وأقصر بنحو 18 مم. وهذان ليسا مقاسين لشكل واحد: النسب نفسها مختلفة، 1:1.41 مقابل 1:1.29.

  والنتيجة هي الجزء الذي يفوت الناس. لا توجد نسبة طباعة تحوّل أحدهما إلى الآخر. حجّم تصميم A4 حتى يناسب عرض Letter وسيبقى أطول من اللازم. حجّمه حتى يناسب الارتفاع فلن يعود يملأ العرض. وكل نصيحة من نوع «اطبعه مع الملاءمة للصفحة» هي قرار بشأن أي من هذين التنازلين سيصل إلى المشتري، يتخذه بصمت مشغّل طابعته.

  <h2>من يستخدم ماذا</h2>

  <p>الانقسام جغرافي ويكاد يكون كاملاً:</p>

  <ul>
    <li><strong>US Letter</strong> في الولايات المتحدة وكندا، وشائع في المكسيك والفلبين وتشيلي وأجزاء من أمريكا الوسطى والجنوبية.</li>
    <li><strong>A4</strong> في كل مكان آخر عملياً، بما في ذلك المنطقة العربية وأوروبا بأكملها ومعظم آسيا وأفريقيا وأستراليا وبقية أمريكا الجنوبية. وهو معيار ISO 216.</li>
    <li><strong>هناك إضافات محلية.</strong> مقاس F4 المعروف أيضاً بـ folio، 215 في 330 مم، لا يزال شائعاً في إندونيسيا وأجزاء من جنوب شرق آسيا، ومقاس Legal، 215.9 في 355.6 مم، يظهر في مكاتب أمريكا الشمالية للعقود.</li>
  </ul>

  <p>وإذا كنت تبيع منتجات رقمية فهذا يعني أن متجراً يقدّم A4 فقط يخسر بصمت تحويلاته من أمريكا الشمالية، ومتجراً يقدّم Letter فقط يخسر معظم العالم. ولا تظهر أي من الخسارتين في تحليلاتك كطلب استرجاع: المشتري ببساطة لا يشتري، أو يشتري مرة ويكتب تقييماً عن الهوامش.</p>

  <h2>ما يحدث فعلاً عندما يطبع المشتري المقاس الخطأ</h2>

  <p>تكاد كل قارئات PDF تختار افتراضياً شيئاً مثل «الملاءمة لمنطقة الطباعة». أعطِ مشترياً يملك ورق Letter ملفاً بمقاس A4، وسيفعل هذا الإعداد الشيء الوحيد الذي يستطيعه: يصغّر الصفحة إلى نحو 94 بالمئة ليناسب الارتفاع، ويوسّطها. والنتائج المرئية:</p>

  <table>
    <thead>
      <tr><th>ما صممته</th><th>ما يحصل عليه المشتري</th></tr>
    </thead>
    <tbody>
      <tr><td>شبكة مخطط مقاسها A4</td><td>الشبكة نفسها بنسبة 94 بالمئة، مع أشرطة بيضاء غير متساوية على الجانبين</td></tr>
      <tr><td>لوحة جدارية مصممة لإطار محدد</td><td>شيء أصغر بمليمترات من كل مقاس إطار قياسي</td></tr>
      <tr><td>خطوط قص لملصقات أو بطاقات</td><td>خطوط لم تعد تطابق حصيرة القص ولا قالب التقطيع</td></tr>
      <tr><td>صفحة مخطط مثقوبة للتجليد</td><td>ثقوب تخطئ الحلقات، لأن الهامش تحرّك</td></tr>
      <tr><td>نص أساسي بحجم 11</td><td>نص بحجم 10.3 تقريباً، يُقرأ كأنه «رخيص» دون أن يعرف أحد السبب</td></tr>
    </tbody>
  </table>

  <p>في ورقة عمل نصية بحتة لا يهم هذا كثيراً. أما في أي شيء يقيسه المشتري أو يقصّه أو يؤطّره أو يجلّده، فهو المنتج بأكمله.</p>

  <h2>الهامش هو ما يحوّل تصميماً واحداً إلى اثنين</h2>

  <p>وهذه النتيجة المفيدة من الأرقام. في الانتقال من A4 إلى Letter تفقد 17.6 مم من الارتفاع، أي 8.8 مم من الأعلى و8.8 مم من الأسفل إذا بقي المحتوى موسّطاً. وفي الانتقال من Letter إلى A4 تفقد 5.9 مم من العرض، أي نحو 3 مم من كل جانب.</p>

  <p>إذن التصميم الذي يبقي كل ما هو مهم على 10 إلى 12 مم على الأقل من الحافة ينجو من الرحلة في الاتجاهين بالمقاس الكامل. والتصميم الذي يمرّر إطاراً على 4 مم من الحافة لا ينجو في أي اتجاه. هذا القرار الواحد، المتخذ في البداية، هو الفرق بين ملف واحد يخدم السوقين وملفين تضطر لصيانتهما إلى الأبد.</p>

  <p>ويحدث أنه الهامش نفسه الذي تحتاجه طابعة المنزل أصلاً، لأن الأجهزة الاستهلاكية لا تقدر على وضع الحبر على آخر مليمترات من الورقة. ودليلنا عن <a href="/ar/blog/sell-printable-pdf-on-etsy/">تجهيز ملف PDF قابل للطباعة للبيع</a> يغطي تلك الحافة غير القابلة للطباعة وبقية الفحوص قبل الرفع.</p>

  <h2>طريقة العمل: صمّم مرة، وصدّر مرتين</h2>

  <p>إذا كان الملف الذي صممت فيه لا يزال بحوزتك، فهذا هو المسار الصحيح ولا شيء يتفوق عليه:</p>

  <ol>
    <li><strong>صمّم بمقاس A4</strong> مع هامش آمن 12 مم. البدء من الشكل الأطول والأضيق هو الاتجاه الأسهل، لأن العرض الإضافي الذي تكسبه على Letter يُستوعب بسهولة، والارتفاع الذي تفقده موجود أصلاً داخل هامشك.</li>
    <li><strong>كرّر لوح العمل بمقاس Letter</strong> واترك التنسيق يعيد توسيط نفسه. تحقّق من العمودي فقط: صار لرأس الصفحة وتذييلها مساحة أقل بـ 8.8 مم.</li>
    <li><strong>صدّر الاثنين</strong> بخطوط مضمَّنة، وسمّهما بشكل لا يلتبس خارج السياق: <code>weekly-planner-A4.pdf</code> و<code>weekly-planner-US-Letter.pdf</code>.</li>
  </ol>

  <p>لا يقدر على إعادة التنسيق فعلاً وفق النسب الجديدة إلا برنامج تصميم حقيقي، ولهذا يتفوق هذا المسار على أي تحويل. فالفقرات قد تتوزع من جديد، والشبكة قد تكسب صفاً، والتذييل قد ينتقل.</p>

  <h2>حين يغيب الملف المصدر</h2>

  <p>الحالة المحرجة الشائعة: اشتريت قالباً بترخيص تجاري، أو ورثت ملفاً، أو ذهب الأصل مع حاسوب قديم. لا يوجد بحوزتك إلا ملف PDF منتهٍ، وملف PDF المنتهي يصف صفحات منتهية. لا شيء يستطيع إعادة تنسيقه.</p>

  <p>لكن ما تستطيعه هو نقله إلى ورقة أخرى، وهو أفضل ما يلي ذلك. <a href="/ar/pdf-edit/page-size/">تغيير مقاس صفحة PDF</a> يضع الصفحات الموجودة على معيار الورق الآخر. وتفصيلان يجعلانه صالحاً للاستخدام لا خطراً:</p>

  <ul>
    <li><strong>يقيس أين يقع المحتوى فعلاً.</strong> وبما أن الانتقال من A4 إلى Letter يكلّف 8.8 مم في الأعلى والأسفل، فإن ملفاً بهامش 12 مم يملك فسحة ويبقى على 100 بالمئة بالضبط. فتبقى مقاسات الطباعة صحيحة، وهذا هو المقصد كله في كل ما يُقاس.</li>
    <li><strong>يصغّر بدلاً من أن يقتطع عندما يضطر.</strong> التصميم الذي يصل إلى الحافة لا يملك فسحة، فيُصغَّر بأقل قدر يحفظ كل شيء، بدلاً من خسارة 9 مم من إطارك. ويُستخدم مقياس واحد للمستند كله، فتبقى المجموعة متعددة الصفحات متوافقة من ورقة إلى أخرى.</li>
  </ul>

  <p>لا تحاول فعل ذلك بأداة قص. <a href="/ar/pdf-edit/crop/">القص</a> يقتطع الصفحة إلى مستطيل أصغر، فتوجيه صندوق بنسبة Letter إلى تصميم A4 يعطيك نافذة بنسبة Letter ينقصها أسفل الصفحة. القص لإزالة هوامش لا تريدها، لا لتغيير معيار الورق.</p>

  <h2>ما تقوله للمشتري</h2>

  <p>معظم ما يتبقى من الاحتكاك يسكن في التحزيم. وعدة عادات تزيله كله تقريباً:</p>

  <ul>
    <li><strong>ضع المقاسين في ملف التنزيل</strong> واذكر ذلك في وصف الإعلان، لا في الصور فقط. فالمشترون يبحثون في الوصف.</li>
    <li><strong>سمِّ الملفات لا المجلدات.</strong> الناس يفكّون الأرشيف ويفقدون بنية المجلدات فوراً.</li>
    <li><strong>أضف سطر تعليمات واحداً:</strong> اطبع بنسبة 100 بالمئة، بالمقاس الفعلي، مع تعطيل التحجيم. هذه الجملة الواحدة تمنع أكبر عدد من رسائل الدعم، لأنها تمنع القارئ من تصغير ملف صحيح بصمت.</li>
    <li><strong>اذكر أي المقاسين صممته أولاً</strong> إذا اختلف الملفان في أي شيء قد يلاحظه المشتري. الصدق هنا لا يكلّف شيئاً ويسبق التقييم.</li>
  </ul>

  <p>وإذا نمت الحزمة أكثر من ملفين أو ثلاثة، فأرشيف واحد يحفظ الترتيب ويبقيك داخل حد عدد الملفات في المنصة؛ ومقالنا عن <a href="/ar/blog/pdf-naming-conventions-best-practices/">تسمية الملفات</a> مكتوب للمستندات، لكن القواعد تنتقل حرفياً.</p>

  <h2>مرجع سريع</h2>

  <table>
    <thead>
      <tr><th>المقاس</th><th>مليمتر</th><th>بوصة</th><th>النسبة</th></tr>
    </thead>
    <tbody>
      <tr><td>A4</td><td>210 × 297</td><td>8.27 × 11.69</td><td>1:1.414</td></tr>
      <tr><td>US Letter</td><td>215.9 × 279.4</td><td>8.5 × 11</td><td>1:1.294</td></tr>
      <tr><td>Legal</td><td>215.9 × 355.6</td><td>8.5 × 14</td><td>1:1.647</td></tr>
      <tr><td>A5</td><td>148 × 210</td><td>5.83 × 8.27</td><td>1:1.414</td></tr>
      <tr><td>F4 / folio</td><td>215 × 330</td><td>8.46 × 12.99</td><td>1:1.535</td></tr>
    </tbody>
  </table>

  <p>وعمود النسبة يستحق نظرة ثانية. فـ A4 وA5 يتشاركانها، ولهذا يعطي نصف ورقة A4 مقاس A5 تماماً، ولهذا تتحجّم مستندات السلسلة A بين بعضها بنظافة. أما Letter فلا يتشارك نسبته مع أي مقاس، وهذا تحديداً سبب استحالة تحجيمه إلى مقاس من السلسلة A.</p>

  <h2>ماذا يحدث للملف الذي ترفعه</h2>

  <p>أدواتنا تعمل على الخادم، فالملف يُرفع. ويُحذف بمجرد انتهاء المهمة، ورابط التنزيل لك وحدك. لا شيء يُفهرس أو يُحفظ أو يُعاد استخدامه للتدريب. ومقالنا عن <a href="/ar/blog/is-convertica-safe-pdf-file-security-privacy-explained/">كيف تتعامل Convertica مع ملفاتك</a> يشرح قواعد الاحتفاظ إن كنت تعمل على شيء لم يُطلق بعد.</p>

  <h2>أسئلة متكررة</h2>

  <h3>هل أطبع A4 على ورق Letter وحسب؟</h3>
  <p>يمكنك ذلك، وفي مستند نصي عادي لا مشكلة. سيصغّر مربع الطباعة الصفحة إلى نحو 94 بالمئة ويوسّطها، وهذا يكلّفك قليلاً من حجم الخط ويترك هوامش بيضاء غير متساوية. أما في أي شيء يُقاس أو يُقص أو يُؤطَّر أو يُثقب فهو غير مقبول، وفي شيء تبيعه فهو تقييم ينتظر دوره.</p>

  <h3>بأي مقاس أصمّم أولاً؟</h3>
  <p>بمقاس A4 في معظم الحالات. فهو معيار الجزء الأكبر من العالم، وهو نقطة بداية أكثر تسامحاً: التحويل إلى Letter يكسبك عرضاً، وهذا سهل، ويكلّفك ارتفاعاً يغطيه هامشك الآمن أصلاً. ولا تبدأ من Letter إلا إذا كان جمهورك أمريكياً شمالياً تحديداً.</p>

  <h3>هل تحويل A4 إلى Letter بلا فقدان؟</h3>
  <p>محتوى الصفحة نعم. فالنقل يضع المحتوى المتجه الموجود على ورقة جديدة، فيبقى النص والرسم الخطي متجهين ويُطبعان بالحدّة نفسها. ما لا يُحفظ هو نية التنسيق: لا شيء يتوزع أو يُعاد ترتيبه وفق النسب الجديدة، وإذا لم يكن لمحتواك فسحة هامش فلا بد من تصغيره حتى لا يُقتطع.</p>

  <h3>وماذا عن A5 أو Legal أو F4؟</h3>
  <p>مقاس A5 هو نصف A4 بالضبط ويتشارك نسبته، فالتحويلات داخل السلسلة A نظيفة. ومقاس Legal أطول بكثير من A4 وLetter، فالمحتوى المنقول إليه يجلس في الوسط بهوامش سخية بدلاً من أن يُقتطع. أما F4 فيقع بين A4 وLegal في الارتفاع، ولا يستحق تقديمه إلا إذا كنت تبيع في أسواق يشيع فيها.</p>

  <h3>هل أحتاج صور إعلان منفصلة لكل مقاس؟</h3>
  <p>لا، وذلك عادة يزحم الإعلان فقط. مجموعة واحدة من نماذج العرض مع سطر واضح في الوصف يقول إن A4 وUS Letter مضمّنان معاً تعمل أفضل. وما يساعد فعلاً هو ملاحظة صغيرة على صورة المعاينة الأخيرة تُدرج ما يحتويه التنزيل.</p>

  <h3>تصميمي فيه خلفية ممتدة إلى الحافة. ماذا الآن؟</h3>
  <p>اقبل أنه لن يتحول بالمقاس الكامل، لأنه لا يملك فسحة هامش في أي مكان. إما أن تصغّره عند النقل، وهذا يضيف حدوداً بيضاء رقيقة كانت طابعة المنزل ستضيفها على أي حال، أو أن تحتفظ بملفين منفصلين فعلاً للمعياريْن. فالامتداد إلى الحافة والطباعة المنزلية لم يكونا يوماً ثنائياً مريحاً.</p>

  <h2>اختر مقاسيك</h2>

  <p>حدّد المعياريْن الذين ستدعمهما قبل أن ترسم أي شيء، واحفظ هامش 12 مم ليبقى القرار رخيصاً. وإذا كنت تحمل ملف PDF منتهياً ولا ملف مصدر، فمرّره على <a href="/ar/pdf-edit/page-size/">تغيير مقاس صفحة PDF</a>، واطبع صفحة واحدة بنسبة 100 بالمئة، وافحص الحواف الأربع قبل أن تسلّمه. وما تبقى موجود في <a href="/ar/all-tools/">كل الأدوات</a>.</p>
