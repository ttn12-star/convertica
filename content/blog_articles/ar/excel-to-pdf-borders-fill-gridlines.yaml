content_ar: |
  الشاشة ترسم الحد بعرض بكسل واحد مهما كان نمطه. أما الورق وملف PDF فيرسمانه بعرضه الحقيقي. لذلك قد يخرج جدول يبدو رقيقا في Excel إلى ملف PDF كأنه شبكة رُسمت بقلم تخطيط عريض، ولا شيء معطوب هنا: أنت ترى فقط العرض الذي كان لنمط الحد منذ البداية.

  قسنا ما يتحول إليه كل نمط حين يرسمه <a href="/ar/excel-to-pdf/">محوّل Excel إلى PDF</a>، ثم بنينا الحلول على هذه القياسات.

  <h2>ما السماكة التي يُطبع بها كل نمط حدود فعلا</h2>

  <ul>
    <li><strong>الحد الشعري</strong> (أرفع الأنماط): نحو 0.1 pt. وهو عمليا أرفع خط تستطيع الطابعة رسمه.</li>
    <li><strong>الرفيع</strong> (النمط الافتراضي حين تنقر زر الحدود): 0.75 pt. وهذا هو الذي يصفه الناس بأنه «عريض».</li>
    <li><strong>المتوسط</strong>: 1.75 pt، أي أكثر من ضعف الخط الرفيع.</li>
  </ul>

  <p>وللمقارنة، خط الجدول المعتاد في كتاب مطبوع يقع بين 0.25 و0.5 pt تقريبا. فالحد الافتراضي في Excel أثقل من معظم الجداول المطبوعة، وفي ورقة كثيفة تحيط فيها الخطوط بكل خلية يتراكم هذا الثقل.</p>

  <h2>اجعل الخطوط أرفع: استخدم النمط الشعري</h2>

  <ol>
    <li>حدد الجدول.</li>
    <li>انقر بزر الفأرة الأيمن، ثم <strong>تنسيق الخلايا</strong> (Format Cells)، ثم تبويب <strong>حد</strong>.</li>
    <li>في قائمة <strong>النمط</strong> اختر أول خط تحت «بلا». يبدو على الشاشة خطا منقطا دقيقا؛ هذا هو الحد الشعري، ويُطبع خطا متصلا رفيعا جدا.</li>
    <li>انقر <strong>مخطط تفصيلي</strong> و<strong>داخلي</strong> (أو الحواف المحددة التي تريدها)، ثم «موافق».</li>
  </ol>

  <p>وهناك حل وسط شائع يبدو جميلا على الورق: حد شعري داخل الجدول، وحد رفيع حول إطاره الخارجي وتحت صف العناوين.</p>

  <h2>خطوط الشبكة: تطبعها أم لا</h2>

  <p>الخطوط الرمادية الباهتة التي تراها في Excel ليست حدودا، ولا تُطبع افتراضيا. فإن لم يكن في جدولك حدود، فلن يكون في ملف PDF أي خطوط على الإطلاق، وهذا يفاجئ كثيرين.</p>

  <p>لطباعتها: تبويب <strong>تخطيط الصفحة</strong>، مجموعة <strong>خيارات الورقة</strong>، ثم فعّل <strong>طباعة</strong> تحت «خطوط الشبكة» (Gridlines). في اختباراتنا خرجت بخطوط سماكتها 0.1 pt، مثل الحدود الشعرية تماما، فهذه أسرع طريقة لشبكة خفيفة على ورقة كبيرة. والمحوّل يحترم هذا الإعداد.</p>

  <p>تريد العكس، ورقة نظيفة بلا أي خطوط؟ تأكد أن خيار «طباعة» تحت خطوط الشبكة غير مفعّل، وأن الخلايا بلا حدود.</p>

  <h2>ألوان التعبئة والنص الملوّن</h2>

  <p>التعبئة تبدو جيدة على الشاشة وفي ملف PDF ملوّن، لكنها تستهلك الحبر، وقد تتحول إلى رمادي باهت ومعكّر على طابعة بالأبيض والأسود. وهناك طريقتان للتعامل معها:</p>

  <ul>
    <li><strong>وضع الأبيض والأسود في Excel نفسه.</strong> تخطيط الصفحة، إعداد الصفحة، تبويب <strong>ورقة</strong>، ثم فعّل <strong>أبيض وأسود</strong>. وحين تستخدم بعدها ملف، حفظ باسم، PDF في Excel، تُحذف التعبئة ويُطبع النص بالأسود، بينما يحتفظ الملف نفسه بألوانه.</li>
    <li><strong>مع المحوّل عبر الإنترنت، أزل التعبئة نفسها.</strong> اختبرنا إعداد الأبيض والأسود مع محوّلنا فوجدنا أنه لا يُطبَّق: تبقى التعبئة والنص الملوّن في ملف PDF. لذلك إن كنت تحوّل عبر الإنترنت، فاصنع نسخة من الورقة، وحدد الجدول، ثم الصفحة الرئيسية، <strong>لون التعبئة</strong>، <strong>بلا تعبئة</strong>، واضبط لون الخط على «تلقائي». ثم حوّل النسخة.</li>
  </ul>

  <h2>الخطوط تبدو عريضة في عارض PDF فقط</h2>

  <p>أحيانا يكون ملف PDF سليما والعارض هو من يبالغ. في Adobe Acrobat وReader إعداد في التفضيلات، عرض الصفحة، اسمه <strong>تحسين الخطوط الرفيعة</strong> (Enhance thin lines)، يرسم كل خط رفيع بعرض بكسل واحد على الأقل مهما كان التكبير. فعند تكبير 50% تبدو صفحة من الخطوط الشعرية كأنها رُسمت بقلم عريض. كبّر إلى 100% أو ألغِ تفعيل الخيار: إن صارت الخطوط دقيقة، فالملف كان سليما من البداية. ولا يؤثر هذا الإعداد في الطباعة.</p>

  <h2>أشياء أخرى تُسمّك الخطوط</h2>

  <ul>
    <li><strong>تحجيم الطباعة فوق 100%.</strong> إن كان في إعداد الصفحة «ضبط إلى» 120%، فكل حد أسمك بنسبة 20% أيضا. أما الاحتواء في عرض الصفحة فيصغّر الورقة عادة، فتصير الخطوط أرفع لا أسمك.</li>
    <li><strong>حدود مزدوجة حيث تلتقي خليتان.</strong> إذا كان لخلية حد أيمن ولجارتها حد أيسر، رُسم الاثنان فوق بعضهما. وهذا غير ضار عادة، لكنه مع النمط المتوسط يبدو ثقيلا أكثر من اللازم. طبّق الحدود على النطاق كله دفعة واحدة بدلا من خلية خلية.</li>
    <li><strong>الأعمدة الضيقة.</strong> لا تجعل الخطوط أسمك، لكنها تعطي مظهرا مزدحما: إذا كان النص يتسع بالكاد، بدت الخطوط أثقل. توسيع الأعمدة قليلا يحسّن القراءة والمظهر معا.</li>
  </ul>

  <h2>أسئلة شائعة</h2>

  <h3>لماذا بدت الحدود جيدة في معاينة الطباعة في Excel وثقيلة في ملف PDF؟</h3>
  <p>معاينة الطباعة مصغّرة لتتسع لشاشتك، فينتهي خط سماكته 0.75 pt بعرض بكسل واحد. أما ملف PDF بتكبير 100% فيعرض العرض الحقيقي. صغّر ملف PDF إلى الحجم نفسه وسيبدوان متشابهين.</p>

  <h3>هل أستطيع جعل الحدود أرفع في ملف PDF موجود لدي؟</h3>
  <p>ليس بأي طريقة عملية: الخطوط مرسومة داخل الصفحة. غيّر نمط الحدود في جدول البيانات وحوّل من جديد.</p>

  <h3>هل يحتفظ المحوّل بألوان الحدود؟</h3>
  <p>نعم. ألوان الحدود والتعبئة والخطوط تبقى كما هي في الملف.</p>

  <h3>هل تظهر الحدود الشعرية على طابعة رخيصة؟</h3>
  <p>نعم. عند 0.1 pt ترسم طابعة الليزر أو النافثة للحبر أرفع خط ممكن لها، ويبقى واضحا للعين. وإن احتجت إلى خطوط تصمد أمام الفاكس أو آلة التصوير، فاستخدم النمط الرفيع.</p>

  <h2>جرّبها بنفسك</h2>

  <p>حوّل حدودك إلى النمط الشعري، وقرر ما تريده بشأن خطوط الشبكة والتعبئة، واحفظ، ثم حوّل الملف بـ <a href="/ar/excel-to-pdf/">محوّل Excel إلى PDF</a>. وإذا كان الجدول يخرج أيضا عن الصفحة أو تلحقه صفحات فارغة، فانظر <a href="/ar/blog/excel-to-pdf-cut-off-blank-pages-fix/">الأعمدة المقطوعة عند تحويل Excel إلى PDF</a>، وللجدول الطويل <a href="/ar/blog/excel-to-pdf-repeat-header-row-every-page/">تكرار صف العناوين في كل صفحة</a>.</p>
