  <p>Three tiles without an account is enough to see whether the idea fits how you work. What Premium really adds is sync: boards and presets live on your account, so the board you built at your desk is already there on your laptop and your phone, same tiles, same settings. PDF to PDF/A is the one converter that stays Premium today, with a PRO badge for everyone else. Prices are on the <a href="/en/pricing/">pricing page</a>.</p>

  <h2>What happens to your files</h2>

  <p>The board never stores your documents. It stores tool names, tile order and settings, a few kilobytes of text. Quick conversions are handed straight back to your browser and nothing is kept. Bigger files run in the background and are deleted after about an hour, exactly as on the tool pages. Close the tab and the invoices are gone; the board that converted them is still there next time.</p>

  <h2>FAQ</h2>

  <h3>Is Workbench free?</h3>
  <p>Yes, and you can use it without signing in: one board, three tiles, kept in your browser. A free account raises that to six tiles, and Premium gives you five boards of twenty tiles each, synced to your account. The <a href="/en/workbench/about/">Workbench overview</a> lists what each tier includes.</p>

  <h3>Which tools can become tiles?</h3>
  <p>Anything that takes a file in and hands a file back, 23 converters today. Editors that need your input on screen (sign, add text, crop, organize, compare) are not tiles, because a drop alone cannot tell them where to put the signature.</p>

  <h3>How do I change a tile's settings?</h3>
  <p>Open the tile menu, choose "Configure on tool page". The tool page opens with the tile's current settings, you change what you want and click Save Workflow. The tile picks up the new settings for every drop after that.</p>

  <h3>Does it work on a phone?</h3>
  <p>Yes. The grid stacks into one column, the board switcher becomes your phone's native picker, and tapping a tile opens the file chooser, usually your camera roll or a cloud drive. Dragging with a mouse is nicer, but nothing here is desktop-only.</p>

  <h3>Do you keep my files?</h3>
  <p>No. Instant conversions come straight back to your browser and are not stored, and files that need the background queue are deleted after about an hour. The board itself only remembers which tools you chose and how you configured them.</p>

  <h2>Open your board</h2>

  <p>The fastest way to understand it is to build one. Open <a href="/en/workbench/">Workbench</a>, add the two or three converters you already use most, and drop a file on the first one. If you would rather watch someone do it first, there is a <a href="https://youtu.be/Dcj_bE15UWQ" target="_blank" rel="noopener">two-minute walkthrough on YouTube</a>, and the <a href="/en/workbench/about/">Workbench page</a> answers the rest.</p>
