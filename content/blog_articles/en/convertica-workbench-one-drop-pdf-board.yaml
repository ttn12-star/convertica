content_en: |
  Some conversions come back every week. The same supplier invoices that have to end up as archival PDFs. The same bank statements that have to end up in a spreadsheet. The same batch of phone photos that nobody in the office can open.

  Each one is only a few clicks. Open the tool page, wait for it to load, upload, tick the one setting you always tick, download. Do that eight times on a Monday morning and you have spent twenty minutes clicking through screens you already know by heart.

  The PDF workbench takes that part out of your morning. You set the tools up once on a board, and from then on a conversion is one drop.

  <h2>The PDF workbench in one idea: a tile</h2>

  <p>A board is a grid. Each square on it is a tile, and a tile is one converter plus the settings you saved for it. Drop a file on the tile, or click it and pick a file, and the conversion runs with those settings. No form to fill in, no options to re-choose, no second page. The result appears under the tile as a row with a Download button, and the last three results stay visible while you keep working, so you can grab a file again without running it twice.</p>

  <p>One conversion runs at a time on a board. That is deliberate: drop three files on three tiles and they come back in the order you sent them, instead of racing each other.</p>

  <figure><img src="/static/images/blog/workbench-board.jpg" alt="A Convertica Workbench board named Accounting with PDF to Word, Word to PDF and PDF to Excel tiles, one showing a finished conversion with a Download button" width="1280" height="800" loading="lazy"></figure>

  <h2>Build your first board in two minutes</h2>

  <ol>
    <li><strong>Open the board.</strong> Go to <a href="/en/workbench/">Workbench</a>. Nothing to install, and no account needed to try it. It is also linked from All Tools, the account menu and the footer.</li>
    <li><strong>Click Add widget.</strong> A searchable list opens with two groups. <em>My presets</em> holds the workflows you have already saved on tool pages, with your own settings attached. <em>Converters</em> holds every file-in, file-out tool on the site, 23 of them today: <a href="/en/pdf-to-word/">PDF to Word</a> and <a href="/en/word-to-pdf/">Word to PDF</a>, Excel and PowerPoint to PDF, PDF out to HTML, text, Markdown, EPUB and JPG, PDF/A, HEIC to JPG, the image optimizer and the ICO tools. Type a few letters and tick what you want.</li>
    <li><strong>Drop a file.</strong> The tile takes it, runs the conversion and shows the result row underneath. Large files take the background route on their own, and while one is running you can choose "Continue in background" and carry on.</li>
    <li><strong>Download.</strong> The row keeps its Download button until you replace it, and the previous two stay under it.</li>
    <li><strong>Teach the tile your settings.</strong> Open the tile menu, choose "Configure on tool page", and the tool page opens with that tile's settings loaded. Change what you need, click <strong>Save Workflow</strong>, and the tile keeps the new version. That is how OCR gets switched on for PDF to Word, or a page size stops being a decision every time. The <a href="/en/saved-workflows/">saved workflows</a> page covers that side.</li>
  </ol>

  <figure><img src="/static/images/blog/workbench-picker.jpg" alt="The Add widget list on a Workbench board, filtered by the word 'word', showing a saved OCR preset under My presets and the PDF to Word and Word to PDF converters below" width="1280" height="800" loading="lazy"></figure>

  <p>Two things are not tiles, on purpose. Tools where the work happens on screen (sign, add text, crop, organize, compare) need your hands and a preview, so they stay on their own pages. And a tool with a choice it cannot guess, like Convert Image asking for an output format, shows "Set up on tool page" and sends you there once.</p>

  <h2>Templates: Office, Scans, Images</h2>

  <p>An empty board offers three starting points, and so does the New board sheet:</p>

  <ul>
    <li><strong>Office</strong>: Word to PDF, PDF to Word, Excel to PDF, PowerPoint to PDF.</li>
    <li><strong>Scans</strong>: Image to text, PDF to text, PDF to Word.</li>
    <li><strong>Images</strong>: HEIC to JPG, Optimize image, PDF to JPG.</li>
  </ul>

  <p>Pick one, or choose Start empty. A template is only a head start: every tile it creates can be reconfigured or removed.</p>

  <h2>Several boards, and Edit mode</h2>

  <p>One board covers a lot, but work splits into different shapes. The switcher at the top left moves between boards (on a phone it is the native picker), and the board menu beside it can rename, set as default, duplicate or delete. Duplicating is the quick way to make a variant: copy the board you trust, then change the two tiles that differ.</p>

  <p>Rearranging happens in Edit mode. Click <strong>Edit</strong> in the top bar and each tile grows a drag handle, its title turns into an input, and an × appears to remove it. Drag tiles into the order you actually work in, rename "PDF to Word" to "Scanned invoices" so you recognize it at a glance, then click Done. Outside Edit mode the tile menu still offers Size S, M or L, Move left, Move right and Remove.</p>

  <figure><img src="/static/images/blog/workbench-edit.jpg" alt="Workbench in Edit mode: each tile shows a drag handle, an editable title field and a red remove button, with a Done button in the top bar" width="1280" height="800" loading="lazy"></figure>

  <h2>Three ways people use it</h2>

  <p><strong>The bookkeeper.</strong> A board called Month end, three tiles. Supplier invoices land on a <a href="/en/pdf-to-pdfa/">PDF to PDF/A</a> tile, because the archive will not accept anything else. Bank statements land on <a href="/en/pdf-to-excel/">PDF to Excel</a> so the numbers get reconciled instead of retyped. A third tile pulls text out of the scanned receipts. Twenty files, twenty drops, no settings touched.</p>

  <p><strong>The assistant.</strong> Everything that leaves the office as an attachment goes through one board first. Word drafts and slide decks become PDFs so the recipient sees the same layout the author did, and photos the sales team sends from their phones go through <a href="/en/image/heic-to-jpg/">HEIC to JPG</a> before they reach anyone on a Windows laptop. It used to be a browser tab per format. Now it is one tab, open all day.</p>

  <p><strong>The teacher.</strong> Handouts arrive as photos of a textbook page and have to become text that can be edited. An <a href="/en/image/to-text/">image to text</a> tile does the reading, a PDF to Word tile handles the older scanned worksheets, and a Word to PDF tile sends the finished version back out in a format that prints the same on every school printer.</p>

  <h2>Free, account, Premium</h2>

