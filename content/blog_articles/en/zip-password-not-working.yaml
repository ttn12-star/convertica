content_en: |
  There are two versions of this problem and they have opposite causes, so the first thing to do is work out which one you have.

  In the first version, the archive opens straight away and never asks for anything, even though you are sure you set a password. In the second, it asks, you type a password you know is correct, and it says no.

  Neither is bad luck. Both have plain explanations.

  <h2>Version one: the archive never asks for a password</h2>

  <p>This is the more common of the two, and the answer is almost always the same: the file was never encrypted. Something compressed it and quietly skipped the password step.</p>

  <p>The usual culprit is Windows Explorer. Right-click, Send to, Compressed folder is the path most people take, and it produces a plain ZIP with no encryption option anywhere in the flow. Explorer can <em>read</em> an encrypted ZIP someone else made, and it will prompt you for the password when you open one. It cannot <em>create</em> encrypted archives. That asymmetry is exactly why the problem is so confusing: you have opened password-protected ZIPs on that machine before, so you assume the feature is there.</p>

  <p>It is not, and it never has been. Windows has shipped ZIP support since XP without ever adding encryption to it. If the only thing you used was the built-in menu, your archive has no password, whatever you thought you typed.</p>

  <p>There is an older trick people remember: setting a password from inside the compressed folder view. That existed in Windows XP, was removed afterwards, and does not come back.</p>

  <p>The fix is to use something that actually encrypts. That means a dedicated tool, or the <a href="/en/archive/protect/">protect ZIP tool</a>, which puts a real password on the archive and uses AES-256 rather than the legacy scheme.</p>

  <h3>How to confirm an archive really is encrypted</h3>

  <p>Two quick checks:</p>

  <ul>
    <li>Open it on a machine that supports encryption, such as 7-Zip on Windows. If it lists the contents and extracts without a prompt, there is no password on it.</li>
    <li>Look at the file size. Encryption does not change the size much, so size tells you nothing. Ignore that instinct.</li>
  </ul>

  <p>The reliable signal is behaviour, not appearance. An encrypted ZIP asks before it extracts.</p>

  <h2>Version two: the password is refused</h2>

  <p>Here the archive is genuinely encrypted, and something about the attempt is wrong. Three causes cover nearly every case.</p>

  <h3>Cause A: the tool does not understand the encryption</h3>

  <p>ZIP has two different encryption schemes under the same word "password".</p>

  <p><strong>ZipCrypto</strong> is the original one from 1989. Everything supports it, and it is weak enough that a known-plaintext attack breaks it quickly. <strong>AES-256</strong> came later, is genuinely strong, and is not universally supported.</p>

  <p>That gap is where the failures live. An archive encrypted with AES-256 opened in an old tool, or in a mobile file manager that only implements the legacy scheme, can produce a wrong-password error even when the password is perfect. The tool is not telling you the password is wrong. It is telling you it cannot do the decryption, and the error message is simply misleading.</p>

  <p>If you hit this, try 7-Zip on Windows or Keka on macOS. Both handle AES-256. If the same password then works, you have found your answer.</p>

  <h3>Cause B: the password is not what you think you are typing</h3>

  <p>Less exotic, more frequent than people expect:</p>

  <ul>
    <li><strong>Keyboard layout.</strong> A password set on a Russian, Polish or Arabic layout and retyped on another gives different characters for the same key positions. Type it into a plain text field first and look at it.</li>
    <li><strong>Non-ASCII characters.</strong> Accented letters and anything outside the basic Latin set can be encoded differently by different tools. A password with é or ż may work in the tool that made the archive and nowhere else.</li>
    <li><strong>Trailing space.</strong> Copying a password from a chat message or an email often picks up a space at the end. It counts.</li>
    <li><strong>Caps Lock and similar characters.</strong> Uppercase i, lowercase L and the digit one look alike in many fonts, as do zero and capital O.</li>
  </ul>

  <p>Where possible, paste rather than type, and paste into a visible field first so you can see exactly what you have.</p>

  <h3>Cause C: the archive is damaged</h3>

  <p>A ZIP truncated by an interrupted download or a mail gateway can fail in ways that surface as a password error rather than a corruption error. If the file came through email or a chat app, download it again from the original source and compare file sizes before concluding anything about the password.</p>

  <h2>Why some archives show the file names and others do not</h2>

  <p>This confuses people who expect encryption to be all or nothing. ZIP offers two levels:</p>

  <ul>
    <li><strong>Contents encrypted, names visible.</strong> The default almost everywhere. Anyone can open the archive and read the list of files, including their names and sizes. They just cannot extract them. This leaks more than people realise: <code>salary-2026-final.xlsx</code> tells a story on its own.</li>
    <li><strong>Names encrypted too.</strong> An option in some tools, usually described as encrypting the file names or the header. The archive shows nothing at all until the password is given.</li>
  </ul>

  <p>If you open an archive and see a file list without being asked for anything, that does not prove the contents are unprotected. Try extracting one file. That is when the prompt appears.</p>

  <h2>Platform by platform</h2>

  <ul>
    <li><strong>Windows.</strong> Explorer reads encrypted ZIPs, never creates them. To make one you need a separate tool or an online one. To open an AES-256 archive reliably, use 7-Zip rather than Explorer.</li>
    <li><strong>macOS.</strong> The Archive Utility in Finder also compresses without encryption. The Terminal command <code>zip -e</code> does encrypt, but with the weak legacy scheme. For AES use a third-party tool.</li>
    <li><strong>Android.</strong> Support depends entirely on the file manager. Many handle ZipCrypto only, which is a frequent source of the false wrong-password error.</li>
    <li><strong>iOS.</strong> The built-in Files app compresses and extracts, but does not do encrypted archives. You need an app for that.</li>
  </ul>

  <h2>If you have genuinely lost the password</h2>

  <p>Worth being direct here. For an AES-256 archive with a reasonable password, there is no recovery. That is the point of the encryption. Tools that advertise instant recovery are either guessing from a dictionary, which works only on weak passwords, or they are targeting the legacy ZipCrypto scheme, where a real cryptographic weakness exists.</p>

  <p>So before spending money on recovery software, work out which scheme your archive uses. If it is AES, no product can help, and the honest answer is to go back to whoever created the file.</p>

  <p>If the archive is one you control and you simply want to change or remove the password, the <a href="/en/archive/unlock/">unlock ZIP tool</a> takes the archive and the current password and gives you back a plain one.</p>

  <h2>FAQ</h2>

  <h3>Why can I not password-protect a ZIP file in Windows 10 or 11?</h3>
  <p>Because Windows has never included that feature. The built-in compression creates plain ZIPs only. It can open encrypted archives made elsewhere, which is why people assume it can make them.</p>

  <h3>My ZIP opens without asking for the password I set.</h3>
  <p>The password was not applied. Whatever compressed the folder skipped encryption, almost certainly the Windows right-click menu. Recreate the archive with a tool that encrypts.</p>

  <h3>7-Zip says the password is wrong but I am sure it is right.</h3>
  <p>Check the password character by character in a plain text field first, watching for a trailing space and for layout differences. If it is definitely correct, the archive may be damaged, so try downloading it again.</p>

  <h3>Is a password-protected ZIP actually secure?</h3>
  <p>It depends on which scheme was used. AES-256 is strong. Legacy ZipCrypto is not, and can be broken quickly when an attacker knows part of the contents. If the archive matters, make sure it uses AES.</p>

  <h3>The file names are visible without a password. Is it encrypted at all?</h3>
  <p>Probably yes, just at the usual level, where contents are encrypted and the listing is not. Try extracting a file and see whether it asks. If you need the names hidden too, use a tool that offers encrypted file names.</p>

  <h3>Can I open an encrypted ZIP on my phone?</h3>
  <p>Sometimes. Many mobile file managers support only the legacy scheme, so an AES archive fails with a misleading password error. An app that states AES support explicitly, or extracting on a computer, avoids the problem.</p>

  <h2>Make one that works the first time</h2>

  <p>If you are sending something that needs a password, skip the built-in compression entirely. The <a href="/en/archive/protect/">ZIP protection tool</a> encrypts with AES-256 in the browser, so the recipient gets an archive that genuinely prompts, and <a href="/en/archive/unlock/">unlock ZIP</a> removes a password from an archive you already have. If your concern is a single image rather than a folder, <a href="/en/image/password-protect-image/">password-protect an image</a> does that directly.</p>
