content_en: |
  Sooner or later every seller of a digital file asks the same question, usually after finding their planner on a third-party site: how do I stop people editing this, and how do I stop them reselling it?

  The honest answer is uncomfortable but useful. Some protections genuinely work, and they solve a real problem that is not theft. Others look like protection and are closer to a polite request. And nothing at all in the PDF format stops a determined person with a screenshot key. Sorting the three apart saves you from spending a weekend on measures that protect nothing, and points you at the handful that pay off.

  <h2>The two kinds of PDF password, and why the difference matters</h2>

  <p>PDF has supported two entirely different passwords for decades, and most confusion about protection comes from treating them as one thing.</p>

  <table>
    <thead>
      <tr><th></th><th>User password</th><th>Owner password</th></tr>
    </thead>
    <tbody>
      <tr><td>Also called</td><td>Open password, document password</td><td>Permissions password, master password</td></tr>
      <tr><td>What it does</td><td>Encrypts the file. Without it the content cannot be read at all</td><td>Sets flags asking readers to restrict printing, copying or editing</td></tr>
      <tr><td>Enforced by</td><td>Mathematics</td><td>The goodwill of the reader application</td></tr>
      <tr><td>Useful for</td><td>Sending a confidential document to one recipient</td><td>Discouraging casual edits to a file people are meant to read</td></tr>
      <tr><td>Useful for a paid download</td><td>No. The buyer needs to open it</td><td>Marginally, as a speed bump</td></tr>
    </tbody>
  </table>

  <p>That last row is the one that matters here. A user password is real encryption, but you cannot use it on a product: your buyer has to open the file, so you would have to give them the password, and then the protection is gone. Our note on <a href="/en/blog/password-protect-pdf-before-emailing/">what a PDF password actually protects</a> goes deeper on the two types if you are also sending confidential documents.</p>

  <p>An owner password is what people mean when they say "restrict editing". It writes permission flags into the file, and every well-behaved reader honours them. The words "well-behaved" are carrying the whole sentence. The flags are not encryption of the content; they are a note attached to it. Readers that choose to ignore the note are trivial to find, which is why <a href="/en/blog/unlock-pdf-remove-password/">removing PDF restrictions</a> is a thing that exists and works.</p>

  <h2>What permissions genuinely buy you</h2>

  <p>Given all that, are permissions worthless? No, but their value is different from what most people expect. <a href="/en/pdf-security/protect/">Setting PDF permissions</a> reliably achieves three things:</p>

  <ul>
    <li><strong>It stops the ordinary accident.</strong> The buyer who opens your planner, clicks somewhere, drags a text block by 3 mm and then emails you asking why your file is broken. This is a real and frequent support cost.</li>
    <li><strong>It states intent.</strong> Someone who removes a restriction has knowingly circumvented something. In a dispute, that is a materially different position from "the file was open, so I assumed I could".</li>
    <li><strong>It filters the lazy.</strong> Most people who would casually reuse a file will not go looking for a tool. That is a smaller share than you would like, but it is not zero.</li>
  </ul>

  <p>What it does not do is protect the content. Anyone who can read the file can screenshot it, and anyone who can print it can print to a fresh PDF. Treat permissions as a speed bump, price them accordingly in your effort budget, and never tell a buyer the file "cannot" be copied.</p>

  <h2>Flattening: the protection that actually gets used</h2>

  <p>If you only do one thing to a file before selling it, <a href="/en/pdf-edit/flatten/">flatten it</a>. Layers, form fields, annotations and live text objects are all things a buyer can nudge out of place. Flattening merges them into static page content, and the result opens faster and prints more predictably in the odd readers people actually use.</p>

  <p>Be precise about what this is, though. Flattening is file hygiene, not copyright enforcement. It prevents the accident, not the copy. It also does not reduce print quality: it merges layers and interactive elements without resampling images, so nothing gets softer. The step that can cost quality is compression, which is a separate decision.</p>

  <p>One caveat worth knowing: if your product is meant to be filled in on screen, a fillable planner or a form, do not flatten it. You would be removing the feature. Sell the fillable version as-is and, if you also offer a print version, flatten that one.</p>

  <h2>Watermarks: useful on previews, awkward on products</h2>

  <p>A watermark is the one measure whose value depends entirely on which file it lands on.</p>

  <ul>
    <li><strong>On preview pages, it is exactly right.</strong> Show two interior pages of a workbook with a legible mark across them and you get the marketing benefit without giving away the product. <a href="/en/pdf-edit/add-watermark/">Adding a watermark</a> takes a minute, and our note on <a href="/en/blog/watermark-pdf-confidential-draft/">placement and opacity</a> covers getting it readable without burying the design.</li>
    <li><strong>On the paid file, think twice.</strong> A visible watermark on a product the buyer paid for reads as distrust, and it ruins a printable they intended to frame or hang. Sellers who do this get reviews about it.</li>
    <li><strong>Personalised watermarks are a different tool.</strong> Stamping the buyer's name or order number on their copy does deter sharing, because a leaked file points at a person. It also requires generating a file per order, which is a fulfilment system, not a checkbox. Worth it for expensive files, overkill for a three-dollar planner.</li>
  </ul>

  <h2>What actually reduces resale</h2>

  <p>None of the technical measures above stop resale. These do, to the extent anything does:</p>

  <ol>
    <li><strong>A licence page inside the file.</strong> One page, plain language: what the buyer may do, what they may not, whether commercial use is included, and your contact. This is the single highest-value thing on this list. It settles honest confusion, which is most of the problem, and it is the document you point at when reporting a copy.</li>
    <li><strong>Your name and shop URL in the footer.</strong> Not as protection, as attribution. A file that circulates with your name on it is marketing you did not pay for, and it makes provenance obvious.</li>
    <li><strong>The platform's reporting process.</strong> Marketplaces do remove infringing listings, and they act faster when you can show the original listing date and the licence terms. Unglamorous and effective.</li>
    <li><strong>Making the copy less attractive than the original.</strong> Free updates, a version history, extra sizes, support. A pirated file is a snapshot; a living product is not.</li>
  </ol>

  <p>There is also a strategic point that is easy to miss when you are annoyed. The people who redistribute a cheap digital file were mostly never going to buy it, and the effort you spend fighting them is effort not spent on the listing, the photos or the next product. Spend a fixed, small amount on protection and move on.</p>

  <h2>What about real DRM?</h2>

  <p>Genuine DRM, where the file phones home and can be revoked, exists and is used for expensive corporate and academic material. It requires a platform, a licence server and a reader the buyer must install. For a printable, a template or a workbook, it fails on its own terms: your buyer wants to print the thing on a home printer, and any format that lets them print also lets them keep. Do not go looking for a plugin that promises otherwise.</p>

  <h2>A sensible default</h2>

  <table>
    <thead>
      <tr><th>Product</th><th>What to do</th></tr>
    </thead>
    <tbody>
      <tr><td>Printable planner, wall art, worksheet</td><td>Flatten, licence page, footer attribution. Skip passwords</td></tr>
      <tr><td>Fillable form or digital planner</td><td>Do not flatten. Licence page, permissions to discourage structural edits</td></tr>
      <tr><td>Preview pages for the listing</td><td>Watermark, low resolution, a few pages only</td></tr>
      <tr><td>Expensive template or course workbook</td><td>Consider per-order personalisation, and price the fulfilment work in</td></tr>
      <tr><td>Confidential client document</td><td>User password, sent through a separate channel. This is the one case where encryption is the right answer</td></tr>
    </tbody>
  </table>

  <p>If you are preparing a file for sale for the first time, the rest of the pre-upload work matters more than protection does: page size, resolution, embedded fonts and file weight are what generate refunds. Our guide on <a href="/en/blog/sell-printable-pdf-on-etsy/">preparing a printable PDF to sell</a> walks the whole checklist, and <a href="/en/blog/a4-vs-us-letter-printable-sizes/">choosing between A4 and US Letter</a> covers the sizing decision that causes the most complaints.</p>

  <h2>What happens to the file you upload</h2>

  <p>Our tools run on the server, so the file is uploaded. It is deleted as soon as the job finishes, and the download link is yours alone. Nothing is indexed, kept or reused for training. If you are protecting something unreleased, our note on <a href="/en/blog/is-convertica-safe-pdf-file-security-privacy-explained/">how Convertica handles your files</a> sets out the retention rules.</p>

  <h2>FAQ</h2>

  <h3>Can I make a PDF completely uneditable?</h3>
  <p>You can make it inconvenient to edit, which is worth doing, and you cannot make it impossible. Flattening removes the easy handles and permissions add a flag that most readers honour. Someone determined can still rasterise the pages, retype the text or remove the restrictions with a tool. Aim for "no accidents and no casual reuse" and you will get there; aim for "impossible" and you will waste a weekend.</p>

  <h3>Will a password stop people sharing my product?</h3>
  <p>No, and it creates a new problem. A user password would have to be given to every buyer, at which point it is public and you have added a support burden for nothing. An owner password does not restrict opening at all. Passwords belong on confidential documents with a known recipient, not on products.</p>

  <h3>Is it legal for someone to remove my PDF restrictions?</h3>
  <p>Removing restrictions from a file you own for your own use is usually unremarkable. Doing it in order to redistribute or resell your work is copyright infringement in most jurisdictions regardless of how the file was protected, which is precisely why the licence page and the reporting process matter more than the flags do.</p>

  <h3>Should I put a watermark on the file buyers pay for?</h3>
  <p>Generally no. It signals distrust and ruins anything meant to be displayed. The exceptions are preview pages, where a watermark is exactly the right tool, and high-value files where you stamp each buyer's own details on their copy so a leak is traceable.</p>

  <h3>Does flattening lose quality or break anything?</h3>
  <p>It does not resample images or change resolution, so print quality is unaffected. What it does break, deliberately, is interactivity: form fields stop being fillable and annotations stop being editable. Keep an editable master copy, and do not flatten a product whose selling point is that it can be filled in.</p>

  <h3>What should the licence page actually say?</h3>
  <p>Keep it to one page and plain language: this file is for personal use by the buyer; it may be printed as many times as they like for themselves; it may not be resold, redistributed, or used commercially without a separate licence; and here is how to contact you for that licence. Naming the permitted uses explicitly prevents more misuse than any technical measure, because most misuse is genuine uncertainty.</p>

  <h2>Protect the file, then move on</h2>

  <p>Take the product you are about to list, run it through <a href="/en/pdf-edit/flatten/">flatten</a>, add a licence page and your shop name in the footer, and stop there. If you also need <a href="/en/pdf-security/protect/">permissions</a>, add them knowing what they are worth. Then go spend the rest of the afternoon on the listing, which will make you more money than any lock. Everything else is in <a href="/en/all-tools/">all tools</a>.</p>
