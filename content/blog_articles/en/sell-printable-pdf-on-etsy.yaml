excerpt_en: "Almost nothing that goes wrong with a printable is a design problem. It is page size, resolution, margins the home printer refuses to reach, fonts that were never embedded, and a file too big for Etsy to accept. Here is the order those things break, and how to check each one before you upload rather than after the first refund request."
