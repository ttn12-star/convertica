name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'  # Deploy on version tags (e.g., v1.0.0)
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '18'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Lint and Code Quality
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black==24.4.2 isort mypy ruff==0.15.8  # versions match pre-commit / dev-requirements
          pip install -r requirements.txt

      - name: Run ruff
        run: |
          # Enforce the ruleset configured in ruff.toml (B, C4, UP, SIM, E, W, F).
          # Verified clean repo-wide before enabling this gate.
          ruff check .

      - name: Run flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check code formatting with black
        run: |
          black --check . || (echo "⚠️ Code formatting issues found. Run 'black .' to fix." && exit 1)

      - name: Check import sorting with isort
        run: |
          isort --check-only --profile black . || (echo "⚠️ Import sorting issues found. Run 'isort --profile black .' to fix." && exit 1)

  # Localization Quality
  l10n:
    name: Localization Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for localization changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            l10n:
              - 'locale/**/*.po'

      - name: Set up Python
        if: steps.changes.outputs.l10n == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install l10n-quality
        if: steps.changes.outputs.l10n == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/ttn12-star/l10n-quality

      - name: Check localization quality (no fuzzy/empty)
        if: steps.changes.outputs.l10n == 'true'
        run: |
          shopt -s globstar
          l10n-quality check locale/**/*.po --strict

  # Auto-translate locale files on demand (commit flag based)
  auto-translate:
    name: Auto Translate Locale Files
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      !startsWith(github.ref, 'refs/tags/') &&
      github.actor != 'github-actions[bot]' &&
      (
        contains(github.event.head_commit.message, '--translate') ||
        contains(github.event.head_commit.message, '[translate]') ||
        contains(toJson(github.event.commits), '--translate') ||
        contains(toJson(github.event.commits), '[translate]')
      )
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -d "/home/n_krivda/learning/po-all/l10n-quality" ]; then
            echo "Using local l10n-quality from /home/n_krivda/learning/po-all/l10n-quality"
            pip install /home/n_krivda/learning/po-all/l10n-quality
          else
            echo "Local l10n-quality not found, using GitHub source"
            pip install git+https://github.com/ttn12-star/l10n-quality
          fi
          pip install httpx

      - name: Resolve translation backend (remote or local self-hosted)
        id: backend
        env:
          POQT_API_URL: ${{ secrets.POQT_API_URL }}
          POQT_API_KEY: ${{ secrets.POQT_API_KEY }}
          POQT_DEV_BYPASS: ${{ secrets.POQT_DEV_BYPASS }}
          L10N_QUALITY_API_URL: ${{ secrets.L10N_QUALITY_API_URL }}
          L10N_QUALITY_API_KEY: ${{ secrets.L10N_QUALITY_API_KEY }}
          L10N_QUALITY_DEV_BYPASS: ${{ secrets.L10N_QUALITY_DEV_BYPASS }}
          AI_PRIMARY_API_KEY: ${{ secrets.AI_PRIMARY_API_KEY }}
          AI_FALLBACK_API_KEY: ${{ secrets.AI_FALLBACK_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          resolved_url="${POQT_API_URL:-${L10N_QUALITY_API_URL:-}}"
          resolved_key="${POQT_API_KEY:-${L10N_QUALITY_API_KEY:-}}"
          resolved_bypass="${POQT_DEV_BYPASS:-${L10N_QUALITY_DEV_BYPASS:-}}"

          if [ -n "$resolved_url" ]; then
            echo "Using configured translation API: $resolved_url"
            echo "api_url=$resolved_url" >> "$GITHUB_OUTPUT"
            echo "api_key=$resolved_key" >> "$GITHUB_OUTPUT"
            echo "dev_bypass=$resolved_bypass" >> "$GITHUB_OUTPUT"
            echo "should_translate=1" >> "$GITHUB_OUTPUT"
            echo "started_local_backend=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${AI_PRIMARY_API_KEY:-}" ] && [ -z "${AI_FALLBACK_API_KEY:-}" ]; then
            echo "ℹ️ Skip auto-translate: no translation API URL and no AI keys for local self-hosted backend."
            echo "To enable: set POQT_API_URL/L10N_QUALITY_API_URL or AI_PRIMARY_API_KEY."
            echo "api_url=" >> "$GITHUB_OUTPUT"
            echo "api_key=" >> "$GITHUB_OUTPUT"
            echo "dev_bypass=" >> "$GITHUB_OUTPUT"
            echo "should_translate=0" >> "$GITHUB_OUTPUT"
            echo "started_local_backend=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TOOL_DIR="$RUNNER_TEMP/l10n-quality-tool"
          rm -rf "$TOOL_DIR"

          if [ -d "/home/n_krivda/learning/po-all/l10n-quality-tool" ]; then
            echo "Using local l10n-quality-tool from /home/n_krivda/learning/po-all/l10n-quality-tool"
            cp -a /home/n_krivda/learning/po-all/l10n-quality-tool "$TOOL_DIR"
          else
            echo "Cloning l10n-quality-tool for local backend..."
            git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/ttn12-star/l10n-quality-tool.git" "$TOOL_DIR"
          fi

          {
            echo "DEPLOYMENT_MODE=free"
            echo "DEV_BYPASS_ENABLED=true"
            echo "DEV_BYPASS_SECRET=ci-dev-bypass"
            echo "AI_PRIMARY_API_KEY=${AI_PRIMARY_API_KEY:-}"
            echo "AI_FALLBACK_API_KEY=${AI_FALLBACK_API_KEY:-}"
            echo "POSTGRES_DB=poqt"
            echo "POSTGRES_USER=poqt"
            echo "POSTGRES_PASSWORD=poqt"
          } > "$TOOL_DIR/.env"

          docker compose -f "$TOOL_DIR/docker/docker-compose.yml" up -d --build redis postgres api worker

          echo "Waiting for local translation backend..."
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:18080/health" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "❌ Local translation backend did not become healthy in time." >&2
            docker compose -f "$TOOL_DIR/docker/docker-compose.yml" logs api --tail=200 || true
            exit 1
          fi

          echo "api_url=http://127.0.0.1:18080" >> "$GITHUB_OUTPUT"
          echo "api_key=" >> "$GITHUB_OUTPUT"
          echo "dev_bypass=ci-dev-bypass" >> "$GITHUB_OUTPUT"
          echo "should_translate=1" >> "$GITHUB_OUTPUT"
          echo "started_local_backend=1" >> "$GITHUB_OUTPUT"
          echo "tool_dir=$TOOL_DIR" >> "$GITHUB_OUTPUT"

      - name: Run bulk translations for all locales
        if: steps.backend.outputs.should_translate == '1'
        env:
          POQT_API_URL: ${{ steps.backend.outputs.api_url }}
          POQT_API_KEY: ${{ steps.backend.outputs.api_key }}
          POQT_DEV_BYPASS: ${{ steps.backend.outputs.dev_bypass }}
          L10N_TRANSLATE_DELAY: '0.5'
          SECRET_KEY: test-secret-key
          DEBUG: 'True'
        run: |
          ./scripts/translate_all_locales.sh

      - name: Stop local translation backend
        if: always() && steps.backend.outputs.started_local_backend == '1'
        run: |
          docker compose -f "${{ steps.backend.outputs.tool_dir }}/docker/docker-compose.yml" down -v || true

      - name: Commit and push translated files
        if: steps.backend.outputs.should_translate == '1'
        run: |
          if [ -z "$(git status --porcelain -- locale)" ]; then
            echo "No translation updates to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add locale
          git commit -m "chore(l10n): auto-translate locale files"
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"

  # Security Scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit
          pip install -r requirements.txt

      - name: Run Safety check
        run: safety check --json || true

      - name: Run Bandit security scan
        run: bandit -r . -f json -o bandit-report.json || true

  # Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    # Centralized database configuration to ensure consistency
    env:
      POSTGRES_DB: convertica_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DATABASE_ENGINE: postgresql
      DATABASE_NAME: convertica_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      SECRET_KEY: test-secret-key
      DEBUG: True
      REDIS_URL: redis://localhost:6379/1
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0

    services:
      postgres:
        image: postgres:16
        env:
          # PostgreSQL container uses POSTGRES_* variables
          # Values must match DATABASE_* variables in job env above
          POSTGRES_DB: convertica_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # dev-requirements pulls in requirements.txt plus test-only deps
          # (e.g. `responses`, needed by payments/test_lemonsqueezy_client).
          pip install -r dev-requirements.txt
          pip install coverage

      - name: Run migrations
        # DATABASE_* variables are inherited from job-level env
        run: |
          python manage.py migrate

      - name: Run tests with coverage
        # DATABASE_* and other env variables are inherited from job-level env
        # Using Django's manage.py test (not pytest) as it's the project's test runner
        # NB: tests run serially (no --parallel) — the suite shares an in-process
        # cache under TESTING, so serial execution avoids cross-worker cache races.
        # --exclude-tag=slow skips heavy integration tests (LibreOffice/PDF conversions)
        # that take 1-2h and are covered by smoke tests in production
        run: |
          coverage run --source='utils_site' manage.py test utils_site.src.api utils_site.src.frontend utils_site.src.blog utils_site.src.users utils_site.src.payments --verbosity=2 --exclude-tag=slow
          coverage xml -o coverage.xml --ignore-errors
          # Floor well below the current ~50% so a real regression (toward zero)
          # fails CI, without being brittle to per-run variance.
          coverage report --ignore-errors --fail-under=45

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Build Docker Image
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    # Cancel in-progress builds when a new push/tag arrives
    # For tags: use common group so new tags cancel old tag builds
    # For branches: use branch-specific group so branches don't cancel each other
    concurrency:
      group: ${{ startsWith(github.ref, 'refs/tags/') && 'build-tags' || format('build-{0}', github.ref) }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: false

      - name: Extract metadata
        id: meta
        # Plain shell instead of docker/metadata-action: the action calls the
        # GitHub API for repo metadata (OCI labels) even with context:git, so
        # the 2026-07-16 API outage ("Unicorn!" HTML instead of JSON) failed
        # three tag deploys in a row (v2.2.161-163). Tag set reproduced:
        #   branch push:  <branch>, sha-<7>, latest (main only)
        #   tag vX.Y.Z:   X.Y.Z, X.Y, sha-<7>
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/convertica"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          TAGS="$IMAGE:sha-$SHORT_SHA"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
            TAGS="$TAGS"$'\n'"$IMAGE:$V"$'\n'"$IMAGE:${V%.*}"
          elif [[ "$GITHUB_REF" == refs/heads/* ]]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
            TAGS="$TAGS"$'\n'"$IMAGE:${BRANCH//\//-}"
            if [ "$BRANCH" = "main" ]; then
              TAGS="$TAGS"$'\n'"$IMAGE:latest"
            fi
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Computed tags:"; echo "$TAGS"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./ci/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=build
          cache-to: type=gha,mode=max,scope=build
          # Build only for amd64 to speed up (uncomment arm64 if needed)
          platforms: linux/amd64

  # Deploy to Production Server
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    # Deploy ONLY on version tags (v*), NOT on push to main
    # This ensures deployment happens only after creating a release tag
    if: |
      startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    # Cancel in-progress deployments when a new tag is pushed
    # This prevents wasting resources on outdated deployments
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    environment:
      name: production
      url: https://convertica.net
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history to compare tags

      - name: Check if newer tag exists
        id: check_newer_tag
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          echo "Current tag: $CURRENT_TAG"

          # Fetch all tags
          git fetch --tags --force

          # Get all version tags sorted by version
          ALL_TAGS=$(git tag -l "v*" | sort -V)

          # Find the latest tag
          LATEST_TAG=$(echo "$ALL_TAGS" | tail -1)
          echo "Latest tag: $LATEST_TAG"

          # Compare versions using sort -V (version sort)
          # If current tag is not the latest, cancel deployment
          if [ "$CURRENT_TAG" != "$LATEST_TAG" ]; then
            # Check if current tag is older than latest using version sort
            SORTED_TAGS=$(printf '%s\n' "$CURRENT_TAG" "$LATEST_TAG" | sort -V)
            FIRST_TAG=$(echo "$SORTED_TAGS" | head -1)

            if [ "$FIRST_TAG" != "$CURRENT_TAG" ]; then
              echo "⚠️ Newer tag $LATEST_TAG exists, current tag $CURRENT_TAG is outdated"
              echo "🛑 Cancelling deployment to avoid deploying outdated version"
              echo "should_cancel=true" >> $GITHUB_OUTPUT
            else
              echo "✅ Current tag $CURRENT_TAG is newer than $LATEST_TAG (should not happen, but proceeding)"
              echo "should_cancel=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "✅ Current tag $CURRENT_TAG is the latest, proceeding with deployment"
            echo "should_cancel=false" >> $GITHUB_OUTPUT
          fi

      - name: Cancel deployment if newer tag exists
        if: steps.check_newer_tag.outputs.should_cancel == 'true'
        run: |
          echo "🛑 Cancelling deployment - newer tag exists"
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Check if Tailwind CSS was updated
        run: |
          if [ -n "$(git status --porcelain static/css/tailwind.css)" ]; then
            echo "⚠️ Tailwind CSS file was modified during build (this is normal in CI/CD)"
            echo "   The updated file will be used for deployment."
            git diff --stat static/css/tailwind.css || true
          else
            echo "✅ Tailwind CSS is up to date"
          fi

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Forwarded to the remote shell via `envs:` below, for ci/deploy.sh.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        with:
          envs: CLOUDFLARE_API_TOKEN,CLOUDFLARE_ZONE_ID
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          # Default is 10m; the deploy script does pull + build (nginx +
          # web + celery + celery-beat) + healthcheck wait + DB backup +
          # migrations + collectstatic + static rebuild. That regularly
          # crosses 10 min, after which the SSH action kills the
          # connection and reports failure even though the deploy on the
          # server completes fine. Give it real headroom.
          command_timeout: 25m
          script: |
            set -e
            echo "🚀 Starting deployment..."

            # Navigate to project directory
            cd /opt/convertica

            # CRITICAL: Check if a newer tag exists before starting deployment
            # This prevents deploying outdated tags even if the build already started
            echo "🔍 Checking for newer tags..."
            CURRENT_TAG="${{ github.ref_name }}"
            echo "Current deploying tag: $CURRENT_TAG"

            # Export Sentry environment & release so docker-compose passes them into Django
            export SENTRY_ENVIRONMENT=production
            export SENTRY_RELEASE="convertica@${CURRENT_TAG}"
            echo "Using SENTRY_ENVIRONMENT=$SENTRY_ENVIRONMENT"
            echo "Using SENTRY_RELEASE=$SENTRY_RELEASE"

            # Fetch all tags from remote
            git fetch --tags --force origin

            # Get all version tags sorted by version
            ALL_TAGS=$(git tag -l "v*" | sort -V)

            # Find the latest tag
            LATEST_TAG=$(echo "$ALL_TAGS" | tail -1)
            echo "Latest tag in repository: $LATEST_TAG"

            # Compare versions using sort -V (version sort)
            if [ "$CURRENT_TAG" != "$LATEST_TAG" ]; then
              # Check if current tag is older than latest using version sort
              SORTED_TAGS=$(printf '%s\n' "$CURRENT_TAG" "$LATEST_TAG" | sort -V)
              FIRST_TAG=$(echo "$SORTED_TAGS" | head -1)

              if [ "$FIRST_TAG" != "$CURRENT_TAG" ]; then
                echo "⚠️  WARNING: Newer tag $LATEST_TAG exists!"
                echo "🛑 Current tag $CURRENT_TAG is outdated, cancelling deployment"
                echo "   This prevents deploying an old version when a newer one is available"
                exit 1
              fi
            fi

            echo "✅ Current tag $CURRENT_TAG is the latest, proceeding with deployment"

            # Save server-specific files (SSL, staticfiles, etc.) before pull
            # IMPORTANT: restrict stash to these paths only, so docker compose configs and code
            # can't be accidentally restored from local changes and break prod startup.
            echo "💾 Saving server-specific files..."
            git stash push -m "Server local changes: staticfiles, ssl, renew-ssl.sh" -- staticfiles ssl renew-ssl.sh || true

            # Pull latest code from repository
            echo "📥 Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            # Note: Tailwind CSS will be built INSIDE the container after it starts
            # This ensures CSS is built with the correct code version and copied to staticfiles
            echo "ℹ️  Tailwind CSS will be built inside container after startup (before collectstatic)"

            # Restore server-specific files (if any were stashed)
            # Use stash apply instead of pop to keep stash in case of conflicts
            echo "📦 Restoring server-specific files..."
            if git stash list | grep -q "Server local changes"; then
              # Try to apply stash, if conflict - abort and keep server files
              if ! git stash apply --index 2>/dev/null; then
                echo "⚠️  Conflict in stash, keeping server files and aborting stash apply"
                git reset --hard HEAD
                git stash drop || true
              else
                git stash drop || true
              fi
            fi

            # Pull latest Docker images (if using Docker Hub)
            echo "🐳 Pulling latest Docker images..."
            docker compose -f docker-compose.yml -f ci/docker-compose.prod.yml pull web celery celery-beat || true

            # Rebuild containers (to get latest code changes)
            # Note: nginx now requires build (Brotli support), so we build it too
            # Everything past the checkout lives in ci/deploy.sh, which the reset
            # above just brought to the deployed revision. Keeping it out of the
            # YAML also keeps this step clear of the step-size ceiling.
            bash ci/deploy.sh
