# Weekly dependency vulnerability audit.
#
# The 2026-07 manual audit found known CVEs in 12 pinned packages — several
# of them (pillow, pypdf, pyzipper) parse untrusted user uploads. This job
# keeps that from drifting again: pip-audit runs against the exact pins every
# Monday and on demand; a finding fails the run so GitHub notifies.
name: Security Audit

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Audit pinned requirements
        run: |
          pip install --quiet pip-audit uv
          # Audit the fully resolved tree, not just direct pins: pdfplumber hard-pinned
          # a vulnerable pdfminer.six that a --no-deps scan of requirements.txt never saw.
          uv pip compile requirements.txt --python-version 3.12 -q -o /tmp/req-audit.txt
          # shortcut: twisted (via daphne) fixes these only in 26.10.0rc1; drop the
          # ignores and pin twisted once a stable 26.10.0 ships.
          pip-audit -r /tmp/req-audit.txt --disable-pip --no-deps \
            --ignore-vuln CVE-2026-106454 --ignore-vuln CVE-2026-115778 \
            --ignore-vuln CVE-2026-115774 --ignore-vuln CVE-2026-115775 \
            --ignore-vuln CVE-2026-115776 --ignore-vuln CVE-2026-115877
